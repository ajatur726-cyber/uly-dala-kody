ақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-1/lesson-08.html\"><h2>8. Жеке ақпаратыңды қалай қорғау керек?<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-1/lesson-09.html\"><h2>9. Үйдегі қауіпсіздік: терезе, есік және қауіпті заттар<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-1/lesson-10.html\"><h2>10. Мектепке дейінгі қауіпсіз бағыт: жолдағы және қоғамдық көліктегі қауіпсіздік<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-1/lesson-11.html\"><h2>11. Далада қауіпсіз ойнау ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-1/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 59-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=59\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ          Төтенше жағдайлар қызметтері мен байланыс\n              орталығының телефон нөмірлері\nМақсаты           Білім алушылардың төтенше жағдайларда\n              қауіпсіз әрекет ету дағдыларын қалыптастыру.\nМіндеттері        - білім алушылардың жедел қызметтердің\n              телефон нөмірлері мен көмек шақыру тәртібі туралы\n              білімдерін бекіту;\n                  - қауіпті жағдайды ажырата білуге, тиісті жедел\n              қызметті дұрыс таңдауға және қажетті ақпаратты\n              нақты жеткізуге үйрету;\n                  - жауапкершілікке тәрбиелеу, жедел қызметтерді\n              тек нақты қауіп туындаған жағдайда ғана шақыру\n              қажеттігін түсіндіру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог телефон макетін көрсетеді:\n      – Балалар, телефон тек достарымызбен және жақындарымызбен\nсөйлесу үшін ғана қажет емес. Кейде бір қоңырау адамның өмірін\nсақтап қалуы мүмкін. Қалай ойлайсыңдар, қандай жағдайда жедел\nқызметтерге қоңырау шалу керек?\n      Білім алушылар жауап береді. Педагог қорытынды жасайды:\n      – Бүгін біз қауіпті жағдайды анықтауды, қажетті жедел қызметті\nтаңдауды және дұрыс қоңырау шалуды үйренеміз.\n      II. Негізгі бөлім\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJ\nQtC74gi/view?usp=sharing\n      1. «Кім көмектеседі?» ойыны\n      Педагог тақтаға жедел қызметтердің телефон нөмірлері\nжазылған карточкаларды орналастырады.\n      Жедел қызметтер нөмірлері:\n       101 – өрт сөндіру қызметі;\n       102 – полиция;\n       103 – жедел медициналық жәрдем;\n       104 – авариялық газ қызметі.\n      Педагог:\n      – Кейде қандай көмек қажет екенін бірден анықтау қиын болуы\nмүмкін. Мұндай жағдайда 112 нөміріне қоңырау шалуға болады. Бұл\n– бірыңғай жедел қызмет нөмірі.\n\n      – Егер балаға көмек қажет болса немесе оның құқықтарын\nқорғау мәселесі туындаса, 111 байланыс орталығына жүгінуге\nболады.\n      Педагог түрлі жағдайлар бейнеленген карточкаларды көрсетеді.\n      Мысалы:\n       ас бөлмесінде өрт шықты;\n       адам өзін жайсыз сезінді;\n       газдың иісі сезілді;\n       бейтаныс адам пәтерге кіруге әрекет жасап жатыр;\n       балаға көмек немесе қорғау қажет;\n       төтенше жағдай орын алды және қай жедел қызметке\nхабарласу керектігі белгісіз.\n      Білім алушылар қажетті телефон нөмірін таңдап, өз таңдауын\nтүсіндіреді. Педагог қорытынды жасайды:\n      – Әр жедел қызмет өзіне тиісті жағдайда көмек көрсетеді. Ең\nбастысы – қауіпті жағдайды тез анықтап, қажетті телефон нөмірін\nдұрыс таңдау.\n      2. «Дұрыс қоңырау шалу» практикалық жаттығуы\n      Педагог телефон макетін көрсетеді:\n      – Диспетчер қоңырауға жауап берді деп елестетейік. Оған не\nайту керек?\n      Педагог білім алушылармен бірге әрекет ету алгоритмін\nқұрастырады:\n      1.     Не болғанын айту.\n      2.     Мекенжайды немесе тұрған жеріңді айту.\n      3.     Өз аты-жөніңді айту.\n      4.     Диспетчердің сұрақтарына жауап беру.\n      5. Диспетчер сөйлесуді аяқтамайынша, телефон тұтқасын\nқоймау.\n      Педагог ескертеді:\n      – Егер жаныңда ересек адам болса, алдымен міндетті түрде оны\nкөмекке шақыр.\n      Бірнеше білім алушы рөлдік ойын арқылы телефонмен\nсөйлесуді көрсетеді.\n      Жағдаят.\n      Педагог (диспетчер):\n      – 101 қызметі. Сәлеметсіз бе!\n      Білім алушы:\n      – Сәлеметсіз бе! Ас бөлмесінде өрт шықты.\n      Педагог:\n      – Мекенжайыңызды айтыңыз.\n      Білім алушы:\n\n      – Абай көшесі, 15-үй.\n      Педагог:\n      – Атың кім?\n      Білім алушы:\n      – Менің атым – Әлихан.\n      Педагог:\n      – Рақмет. Көмек жолға шықты.\n      Педагог қорытынды жасайды:\n      – Диспетчермен сөйлескен кезде сабырлы әрі анық сөйлеу\nкерек. Алдымен не болғанын айтып, содан кейін мекенжайыңды және\nөз атыңды хабарла. Диспетчердің сұрақтарына мұқият жауап бер.\nДиспетчерді мұқият тыңдап, оның нұсқауларын орында. Диспетчер\nқоңырауды аяқтауға болады дегенге дейін телефон тұтқасын қойма.\n      ІІІ. Қорытынды бөлім\n      Педагог сұрақтар қояды:\n      – Өрт болған жағдайда қай нөмірге қоңырау шалу керек?\n      – Диспетчерге қандай ақпаратты міндетті түрде хабарлау қажет?\n      – Неліктен жедел қызметтерге жалған қоңырау шалуға\nболмайды?\n      Педагог қорытынды жасайды:\n      – Бүгін сендер жедел желі нөмірлеріне қалай дұрыс қоңырау\nшалу керектігін үйрендіңдер. Ең бастысы – дүрбелеңге түспеу. Егер\nқасыңда ересек адам болса, оны көмекке шақыру, қажетті жедел\nқызметті таңдау, не болғанын сабырлы түрде айту, мекенжайыңды\nжәне өз атыңды хабарлау керек.\n      Сабақтың басты ережесі:\n      «Дүрбелеңге түспе. Ересек адамды шақыр. Қоңырау шал. Не\nболғанын сабырлы түрде түсіндір».<\/div><p><a href=\"https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJ\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJ<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 1-сабақ — Ұлы дала коды"}, "grade-1/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Менің «қауіпсіздік шеңберім»<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 62-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=62\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ       Менің «қауіпсіздік шеңберім»\nМақсаты        Білім     алушылардың     жақын      адамдарды,\n           таныстарды, көмек көрсете алатын ересектерді және\n           бейтаныс адамдарды ажырата білу дағдыларын\n           қалыптастыру.\nМіндеттері     - білім алушыларды «қауіпсіздік шеңбері»\n           ұғымымен таныстыру;\n               - әртүрлі өмірлік жағдайларды талдау, кімнен\n           және қандай жағдайда көмек сұрауға болатынын\n           анықтау дағдыларын дамыту;\n               - жеке қауіпсіздік ережелерін сақтауға және өз\n           қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Төрт шеңбер бейнеленген парақ, түрлі түсті қарындаштар\n(жасыл, сары, көк, қызыл), өмірлік жағдаяттар бейнеленген\nкарточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Біз күн сайын әртүрлі адамдарды кездестіреміз:\nтуыстарымызды, достарымызды, мұғалімдерді, сатушыларды,\nполиция қызметкерлерін және көшедегі бейтаныс адамдарды. Қалай\nойлайсыңдар, біз барлық адамға бірдей қарым-қатынас жасаймыз ба?\n      Білім алушылар жауап береді. Педагог:\n      – Бүгін біз күн сайын қасымызда жүретін адамдардың кімдер\nекенін, кімнен көмек сұрауға болатынын және жанымызда бейтаныс\nадам пайда болған жағдайда өзімізді қалай қауіпсіз ұстау керектігін\nбілеміз.\n      II. Негізгі бөлім\n      1. «Менің қауіпсіздік шеңберім» практикалық жаттығуы\n      Педагог төрт шеңбер бейнеленген плакатты көрсетеді.\nОртасында «Мен» деген сөз жазылған.\n      – Келіңдер, қауіпсіздік шеңберімізді бірге толтырайық. Күн\nсайын сендерге кім қамқорлық жасайды?\n      Білім алушылар жауап береді. Педагог карточкаларды\nорналастырады:\n            ана;\n            әке;\n            әже;\n            ата.\n      Педагог:\n\n      – Бұлар – сендерге ең жақын адамдар. Олар сендерге қамқорлық\nжасайды және әрдайым көмектесуге тырысады.\n      Әрі қарай педагог сұрақ қояды:\n      – Сендермен кімдер жиі ойнайды немесе бірге оқиды?\n      Білім алушылар жауап береді. Педагог карточкаларды\nорналастырады:\n           дос;\n           сыныптас;\n           көрші.\n      Педагог:\n      – Бұлар – сендерге таныс адамдар. Қажет болған жағдайда\nолардан көмек сұрауға болады.\n      Содан кейін педагог жалғастырады:\n      – Егер қасыңда ата-анаң болмаса, кімнен көмек сұрауға болады?\n      Білім алушылар жауап береді. Педагог карточкаларды\nорналастырады:\n           педагог;\n           полиция қызметкері;\n           күзетші;\n           сатушы.\n      Педагог:\n      – Бұлар – қауіпсіздік бойынша көмек көрсете алатын ересектер.\nЕгер сендер адасып қалсаңдар немесе қиын жағдайға тап болсаңдар,\nолардан көмек сұрауға болады.\n      Педагог бейтаныс адам бейнеленген карточканы көрсетеді:\n      – Бұл адамды сендер танымайсыңдар. Егер бейтаныс адам\nсендерге сыйлық ұсынса, өзімен бірге баруға шақырса немесе белгісіз\nәрекет жасауды сұраса, одан бас тартып, өзің сенетін ересек адамға\nжүгіну керек.\n      2. «Қалай әрекет етесің?» ойыны\n      Педагог түрлі жағдаяттарды ұсынады.\n      1-жағдаят\n      – Сен дүкенге бара жатқан жолда адасып қалдың. Не істейсің?\n      2-жағдаят\n      – Бейтаныс адам сені үйіңе жеткізіп салуды ұсынды. Не\nістейсің?\n      Әр жауаптан кейін педагог білім алушылармен бірге дұрыс\nшешімді қысқаша талқылайды.\n      Жаныңда бейтаныс адам болған жағдайда әрекет ету\nалгоритмі\n      1.    Тоқта – бейтаныс адамға жақындама.\n\n      2.    Бас тарт – сыйлық алма, көлігіне отырма және онымен\nешқайда барма.\n      3.    Алыста – басқа адамдар бар қауіпсіз жерге бар.\n      4.    Көмек сұра – ата-анаңнан, педагогтен, полиция\nқызметкерінен, күзетшіден немесе басқа ересек көмекшіден көмек\nсұра.\n      5.    Айтып бер – болған жағдайды міндетті түрде ата-анаңа\nнемесе сенім білдіретін басқа ересек адамға айт.\n      III. Қорытынды бөлім\n      Педагог сұрақ қояды:\n      – Ең жақын адамдарға кімдер жатады?\n      – Жаныңда ата-анаң болмаса, кімнен көмек сұрауға болады?\n      Педагог қорытынды жасайды:\n      – Бүгін сендер айналаларыңда жақын адамдар, таныстар және\nкөмек көрсете алатын ересектер болатынын білдіңдер. Егер адасып\nқалсаңдар, қорықсаңдар немесе қауіпті жағдайға тап болсаңдар,\nсенімді ересек адамнан көмек сұрау керек. Бейтаныс адаммен ешқайда\nбаруға, оның көлігіне отыруға және одан сыйлық алуға болмайды.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 2-сабақ — Ұлы дала коды"}, "grade-1/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Ересек адам «ата-анаңа айтпа» десе не істеу керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 65-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=65\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 3 сабақ      Ересек адам «ата-анаңа айтпа» десе не істеу\n           керек?\nМақсаты       Білім алушылардың қауіпті құпияны ажырата білу\n           және біреу ата-анасынан немесе сенімді ересек адамнан\n           маңызды жағдайды жасыруды сұраған кезде қауіпсіз\n           әрекет ету дағдыларын қалыптастыру.\nМіндеттері    - білім алушыларды «қауіпті құпия» ұғымымен\n           таныстыру;\n              - қауіпсіз және қауіпті құпияларды ажырата білуге,\n           күмән тудыратын жағдайда дұрыс шешім қабылдауға\n           үйрету;\n              - ата-анасынан немесе сенімді ересек адамнан\n           көмек сұрауға дағдыландыру.\n\n      Материалдар мен ресурстар\n      Өмірлік жағдаяттар бейнеленген карточкалар, сабақтың негізгі\nережесі жазылған плакат.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Кейде адамдар күтпеген сыйлықтар дайындайды. Мысалы,\nанасы мен әкеісінің туған күніне сыйлық дайындау. Ал кейде біреу:\n«Бұл туралы ата-анаңа айтпа», – дейді. Бүгін біз қандай құпияларды\nсақтауға болатынын, ал қандай құпиялар туралы міндетті түрде ересек\nадамға айту керектігін білеміз.\n      II. Негізгі бөлім\n      Педагог қысқаша әңгіме айтып береді:\n      – Балалар, елестетіп көріңдерші: Айдын өзіне таныс ересек\nадамды кездестірді. Ересек адам оған ойыншық сыйлап: «Бұл\nойыншықты саған менің сыйлағанымды анаң мен әкеңе айтпа. Бұл\nбіздің құпиямыз болсын, – деді.\n      Айдын бұл құпияны сақтау керек пе, әлде біреуге айту керек пе\nекенін білмейді. Қане, оған қандай құпияны міндетті түрде өзі сенетін\nересек адамға айту керектігін анықтауға көмектесейік.\n      Педагог:\n       Құпия әр адамның өмірінде болуы мүмкін. Бірақ құпияның екі\nтүрі бар. Мына қораптарға қараңдар.\n\n      Жарқын түсті қорапта «қуанышты» құпиялар болады. Олар\nадамның көңілін көтеріп, жүрегіне жылу сыйлайды, күлкі сыйлайды.\nМысалы, сен анаңа туған күніне сыйлық дайындап жатырсың және\nоны әзірге одан жасыра тұруға тура келеді. Мұндай құпия көп ұзамай\nашылып, анаңа қуаныш сыйлайды.\n      Қара түсті қорапта «қауіпті» құпиялар болады. Егер ересек адам\nсенен анаң мен әкеңнен бір нәрсені жасыруды сұраса, мұндай құпия\nкөбінесе қара түсті қорапқа жатады.\n      Педагог:\n      – Балалар, есте сақтаңдар: ешбір ересек адам баладан ата-\nанасынан бір нәрсені жасыруды сұрамауы керек.\n      Неліктен кейбір адамдар маңызды нәрсені құпия сақтауды\nсұрауы мүмкін?\n         Олар өздерінің дұрыс емес әрекет жасап жатқанын біледі\nжәне ата-анасы біліп қояды деп қорқады.\n         Олар: «Егер айтып қойсаң, ойыншығыңды алып қоямын»\nнемесе «Анаң сенен кетіп қалады» деп қорқытуы мүмкін. Бұл –\nшынайылыққа жанаспайды. Ата-анаң әрқашан сені қолдайды және\nқорғайды.\n      Педагог:\n      – Егер бір құпия сені мазаласа, қорқытса, ұялтса немесе өзіңді\nжалғыз сезінуге мәжбүр етсе, бұл – қауіпті құпия. Мұндай құпияны\nіште сақтауға болмайды. Ол туралы анаңа, әкеңе немесе өзің сенетін\nересек адамға міндетті түрде айт.\n      «Анаң мен әкеңнен ешнәрсе жасырмай! Егер басқа ересек адам\nбір нәрсені жасыруды сұраса, міндетті түрде ата-анаңа айт!».\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n      – Егер біреу ата-анамнан бір нәрсені жасыруымды сұраса, мен...\n      – Егер мен қорқып немесе өзімді жайсыз сезінсем, мен...\n      – Көмек сұрау үшін мен ... жүгіне аламын.\n      Білім алушылар жауап береді. Педагог қорытынды жасайды:\n      – Бүгін сендер маңызды ережені білдіңдер. Жағымды тосынсый\nқуаныш сыйлайды және көп ұзамай оның сыры ашылады. Ал егер\nбіреу ата-анаңнан бір нәрсені жасыруды сұраса және осы жағдайдан\nқорқыныш немесе жайсыздық сезінсең, жасыруға болмайды. Міндетті\nтүрде ата-анаңа, мектеп психологіне айтуға немесе 111 нөмірі арқылы\nкөмек сұрауға болады.\n      Сабақтың басты ережесі\n      «Егер біреу менен ата-анамнан бір нәрсені жасыруды сұраса\nнемесе мен қорқып қалсам – ешнәрсені жасырмаймын, ересек адамға\nайтып, көмек сұраймын».\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 3-сабақ — Ұлы дала коды"}, "grade-1/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Бейтаныс адамдардан қалай сақтану керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 67-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=67\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 4 сабақ     Бейтаныс адамдардан қалай сақтану керек?\nМақсаты       Білім алушылардың бейтаныс адамдармен қарым-\n           қатынас кезінде қауіпсіз әрекет ету дағдыларын\n           қалыптастыру\nМіндеттері    - білім алушыларды бейтаныс адамдармен қарым-\n           қатынас жасау кезіндегі қауіпсіз мінез-құлық\n           ережелерімен таныстыру;\n              - әртүрлі өмірлік жағдайларда қауіпсіз шешім\n           қабылдай білу дағдыларын дамыту;\n              - жеке қауіпсіздігіне жауапкершілікпен қарауға\n           тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Өмірлік жағдаяттар бейнеленген карточкалар, телефон макеті,\nжұмыс парақтары, қарындаштар, 111 нөмірі жазылған карточка,\nтақырыптық постер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушылардың назарын тақырыптық\nпостерге аударады.\n      https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eC\nSY2FeoTMEec8T451Um4EJpuikdqk&amp;index=7\n       Педагог:\n      – Күн сайын біз әртүрлі адамдарды кездестіреміз: көршілерді,\nсатушыларды, бейтаныс адамдарды, басқа балалардың ата-аналарын.\nБіз олардың барлығын жеке танымауымыз мүмкін.\n      Бүгін біз бейтаныс адам сендермен сөйлесуді бастаса, сыйлық\nұсынса немесе бір жерге бірге баруға шақырса, қалай дұрыс әрекет ету\nкеректігін үйренеміз.\n      II. Негізгі бөлім\n      1. Қалай әрекет етемін» ойыны\n      Педагог жағдаяттарды оқиды. Білім алушылар бұл жағдайда\nқалай әрекет ету керектігін түсіндіреді.\n            Бейтаныс адам саған кәмпит ұсынды.\n      Жауабы: Кәмпитті алмау, «Жоқ» деп айту және одан алыстау.\n            Бейтаныс адам сені үйіңе жеткізіп салуды ұсынды.\n\n      Жауабы: Көлікке отырмау, одан алыстау және болған жағдайды\nсенетін ересек адамға айту.\n           Бейтаныс адам сенен өзімен бірге барып, жолды көрсетуді\nсұрады.\n      Жауабы: Бейтаныс адаммен бірге бармау керек. Ересек адам\nжолды басқа ересек адамнан сұрай алады.\n           Бейтаныс адам сені күшік көруге шақырды.\n      Жауабы: Күшікті қатты көргің келсе де, онымен бірге бармау\nкерек.\n           Сен дүкенде адасып қалдың және ата-анаңды сенен\nалыстап кеткенін байқадың.\n      Жауабы: Дүкеннен шықпау керек және дүкен қызметкерінен\nнемесе күзетшіден көмек сұрау керек.\n           Көшеде бейтаныс адам сенің артыңнан еріп келе жатыр\nжәне саған жақындауға тырысады.\n      Жауабы: Адамдар көп жерге бару, дауыстап көмек шақыру және\nполиция қызметкеріне, күзетшіге немесе көмектесе алатын басқа\nересек адамға жүгіну керек.\n      Педагог қорытынды жасайды:\n      – Бейтаныс адам мейірімді әрі сыпайы болып көрінуі мүмкін.\nБірақ онымен бірге ешқайда баруға, оның көлігіне отыруға немесе\nодан сыйлық алуға болмайды. Егер өздеріңе көмек қажет болса,\nсенетін ересек адамға немесе қызметтік міндетіне қарай тануға\nболатын ересек адамға: полиция қызметкеріне, күзетшіге, дүкен\nқызметкеріне жүгініңдер.\n      2. «Қауіпсіздіктің төрт қадамы» қимыл ойыны\n      Педагог алгоритмді түсіндіреді:\n      – Егер бейтаныс адам сендерді бір жерге бірге баруға немесе бір\nзатты алуға шақырса, төрт қадамды орындау керек:\n      Бірінші қадам – «Жоқ!» деп айту.\n      Екінші қадам – бір қадам артқа шегіну.\n      Үшінші қадам – қауіпсіз ересек адамға жақындау.\n      Төртінші қадам – ата-анаңа не болғанын айтып беру.\n      Білім алушылар алгоритмді педагогпен бірге бірнеше рет\nқайталайды. Педагог еске салады:\n      – Егер сендерге қауіп төніп тұрса немесе полицияның шұғыл\nкөмегі қажет болса, 102 нөміріне немесе 112 бірыңғай жедел қызмет\nнөміріне қоңырау шалыңдар.\n      Егер қастарыңда ата-аналарың болмаса, педагогке, полиция\nқызметкеріне, дүкен қызметкеріне немесе мектеп психологіне көмек\nсұрап жүгіне аласыңдар.\n\n      Егер саған көмек керек болса немесе бір нәрсе сені қорқытса,\nбұл туралы міндетті түрде ересек адамға айт. Сондай-ақ, 111 нөміріне\nхабарласып, көмек сұра.\n      III. Қорытынды бөлім\n      Педагог сұрақтар қояды:\n      – Бейтаныс адаммен бірге кетуге бола ма?\n      – Егер бейтаныс адам сені өзімен бірге жүруге қайта-қайта\nшақырса, не істеу керек?\n      – Кімнен көмек сұрауға болады?\n      Педагог қорытынды жасайды:\n      – Бүгін сендер бейтаныс адамдармен кездескен кезде өздеріңді\nқауіпсіз ұстауды үйрендіңдер. Ең бастысы – бейтаныс адамның\nұсынысына келіспеу, онымен бірге ешқайда кетпеу, бірден қауіпсіз\nересек адамнан көмек сұрап, болған жағдайды айтып беру.\n      Сабақтың басты ережесі\n      «Жоқ!» де. Қауіпсіз жерге шегін. Ересек адамнан көмек сұра\nжәне не болғанын айтып бер.\n\n Қазақстан Республикасының Бас\n прокуратурасы ұсынған қауіпсіздік\n сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eC\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eC<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 4-сабақ — Ұлы дала коды"}, "grade-1/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Су айдындарындағы қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 70-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=70\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 5 сабақ     Су айдындарындағы қауіпсіздік ережелері\nМақсаты       Білім алушылардың су айдындарындағы қауіпсіз\n           мінез-құлық     ережелері    туралы     түсініктерін\n           қалыптастыру және су маңында демалу кезінде қауіпсіз\n           әрекет ету дағдыларын дамыту\nМіндеттері    - білім алушыларды су айдындарындағы қауіпсіз\n           мінез-құлық ережелерімен таныстыру;\n              - қауіпті жағдайларды бағалай білу және қауіпсіз\n           шешім қабылдау дағдыларын дамыту;\n              - өз қауіпсіздігіне жауапкершілікпен қарауға\n           тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Болады» және «Болмайды» карточкалары, құтқару кеудешесі,\nқұтқару шеңбері, қайық бейнеленген иллюстрациялар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      – Жаз мезгілінде көптеген адамдар өзеннің, көлдің немесе\nтеңіздің жағасында демалғанды ұнатады. Су жағасындағы демалысты\nқалай көңілді әрі қауіпсіз өткізуге болады?\n      Білім алушылар жауап береді. Педагог:\n      – Бүгін біз денсаулық пен өмірді сақтауға көмектесетін\nқарапайым қауіпсіздік ережелерімен танысамыз.\n      II. Негізгі бөлім\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n         https://drive.google.com/file/d/1X2Ar8XhRSpZ0fci9pfnEk0cPQp1tGAvi/view?usp=s\nharing\n      Педагог су айдындарының маңындағы қауіпсіз мінез-құлық\nережелерін түсіндіреді.\n      1-ереже: Су айдынына ересек адамсыз баруға болмайды. Тіпті\nүйге жақын орналасқан кішкентай тоған болса да, міндетті түрде\nересек адаммен бірге бару керек.\n      2-ереже: Суға тек арнайы жабдықталған, құтқарушылар\nкезекшілік ететін жағажайларда ғана түсуге болады.\n\n      3-ереже: Судағы қалқымалы белгілерден ары қарай жүзуге\nболмайды. Олар терең жердің басталатын шекарасын немесе\nқайықтар мен кемелер жүзуі мүмкін аймақты көрсетеді.\n      4-ереже: Жартастан, көпірден, басқа да биіктен суға секіруге\nболмайды. Судың түбінде тастар, ағаш бұтақтары немесе шыны\nсынықтары болуы мүмкін.\n      5-ереже: «Суға батыру» сияқты ойындарды ойнауға болмайды!\nӘзіл ретінде досыңның аяғынан су астында тартуға, оны жағадан суға\nитеруге немесе әзілдеп «Батып барамын!» деп айқайлауға болмайды.\nҚұтқарушылар мұны әзіл деп ойлап, шын мәнінде көмек қажет болған\nкезде дер кезінде әрекет етпеуі мүмкін.\n      Педагог жазатайым жағдай кезіндегі әрекет ету ережелерін\nтүсіндіреді:\n      Егер суға құлап кетіп, жүзе алмасаң: Дүрбелеңге түспе.\nШалқаңнан жатып, қолдарыңды жан-жаққа созып, жұлдызша тәрізді\nқалқуға тырыс және тыныш дем ал. Су денеңді өзі ұстап тұрады.\nАйқайлап көмекке шақыруға тырыс.\n      Егер біреудің суға батып бара жатқанын көрсең: Ешқашан\nөзің суға секірме! Сен әлі кішкентайсың. Ересектерді қатты дауыстап\nкөмекке шақыр: «Көмектесіңіздер! Адам суға батып бара жатыр!».\n      Егер жақын жерде құтқару шеңбері, үрлемелі матрас немесе\nұзын таяқ болса, оны жағадан суға батып бара жатқан адамға қарай\nлақтыр. Бұл кезде аяғыңды нық басып, жағалауда қауіпсіз жерде тұр.\n      «Қауіпсіз бе, әлде қауіпті ме?» ойыны\n      Педагог түрлі жағдайларды оқиды. Білім алушылар «Болады»\nнемесе «Болмайды» карточкаларын көтереді. Жағдаяттар:\n            ересек адаммен бірге суға түсу;\n            ересектерсіз өзенге немесе көлге жақындау;\n            қайықта құтқару кеудешесін кию;\n            бейтаныс жерде суға секіру;\n            қауіпті жағдайды көргенде ересек адамға хабарлау.\n      Әр жауаптан кейін білім алушылар өз таңдауларын түсіндіреді.\nПедагог қорытынды жасайды:\n      – Су маңында әрдайым мұқият болып, қауіпсіздік ережелерін\nсақтау керек.\n      III. Қорытынды бөлім\n      Педагог сұрақтар қояды:\n            Неліктен ересектерсіз суға жақындауға болмайды?\n            Құтқару кеудешесі не үшін қажет?\n            Қауіпті жағдайды көрсең, не істеу керек?\n\nҚазақстан Республикасы Денсаулық\nсақтау министрлігі ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/1X2Ar8XhRSpZ0fci9pfnEk0cPQp1tGAvi/view?usp=s\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1X2Ar8XhRSpZ0fci9pfnEk0cPQp1tGAvi/view?usp=s<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 5-сабақ — Ұлы дала коды"}, "grade-1/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Менің денем – менің жеке шекарам<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 72-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=72\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ     Менің денем – менің жеке шекарам\nМақсаты      Білім алушылардың жеке шекаралары бұзылған\n           жағдайларда қауіпсіз әрекет ету туралы дағдыларын\n           қалыптастыру.\nМіндеттері   - білім алушыларды жеке қауіпсіздік және жеке\n           шекара ережелерімен таныстыру;\n             - қауіпті жағдайларды тани білу және қауіпсіз\n           шешім қабылдау дағдыларын дамыту;\n             - өзіне және айналасындағылардың қауіпсіздігіне\n           құрметпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Жасыл және қызыл сигналдық карточкалар, адам сұлбасы\nбейнеленген парақтар, қарындаштар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, біреудің затын рұқсатсыз алуға бола ма?\n      Білім алушылар жауап береді.\n      – Ал басқа адамға рұқсатсыз қол тигізуге бола ма?\n      Білім алушылар жауап береді. Педагог:\n      – Әр адамның жеке шекарасы бар. Бұл ереже әр адамның өзін\nеркін, тыныш әрі қауіпсіз сезінуіне көмектеседі. Бүгін біз біреу сенің\nжеке шекараңды бұзған жағдайда қалай дұрыс әрекет ету керектігін\nүйренеміз.\n      II. Негізгі бөлім\n      1. «Бола ма, болмай ма?» ойыны\n      Педагог түрлі жағдаяттар бейнеленген карточкаларды\nкөрсетеді. Білім алушылар «Болады» немесе «Болмайды»\nкарточкасын көтеріп, өз таңдауын түсіндіреді.\n      Жағдаяттар:\n            анасы баланың жарақатын өңдеп жатыр;\n            дәрігер ата-анасының рұқсатымен баланы тексеріп\nжатыр;\n            досы: «Сені құшақтасам бола ма?» – деп сұрады;\n            сен «Болмайды» дегеніңе қарамастан, біреу қолыңнан\nтартады;\n\n           бейтаныс адам баланы рұқсатсыз құшақтағысы келеді;\n           ойын кезінде сыныптасы сен тоқтауын сұрағаныңа\nқарамастан, итеруді жалғастыра береді.\n      Педагог қорытынды жасайды:\n      – Сенің денең – өзіңе тиесілі. Сондықтан өзіңнің де, басқа\nадамдардың да жеке шекарасын құрметтеу маңызды. Егер біреудің\nжанасуы сенде жағымсыз сезім, қорқыныш немесе ауырсыну\nтудырса, «Жоқ!» немесе «Маған тиіспе!» деп айтуға, қауіпсіз жерге\nшегінуге және сенетін ересек адамға болған жағдайды айт.\n      2. «Қауіпсіздіктің үш қадамы» жаттығуы\n      Педагог үш карточканы көрсетеді.\n      Бірінші қадам – «Жоқ!» деп айт.\n      Екінші қадам – қауіпсіз жерге шегін.\n      Үшінші қадам – ата-анаңа, педагогке, мектеп психологіне\nнемесе басқа да жақын ересек адамға айтып бер.\n      Білім алушылар алгоритмді педагогпен бірге бірнеше рет\nқайталайды. Педагог:\n      – Егер саған көмек қажет болса, кімге жүгіне аласың?\n      Білім алушылар жауап береді:\n      – Анаға.\n      – Әкеге.\n      – Педагогке.\n      – Мектеп психологіне.\n      Педагог толықтырады:\n      – Егер балаға көмек немесе қорғау қажет болса, балалар да,\nересектер де 111 байланыс орталығына жүгіне алады.\n      III. Қорытынды бөлім\n      Педагог қорытынды жасайды:\n      – Әр адам өзіне құрметпен қарауға лайық. Егер сен қорықсаң,\nауырсынсаң немесе өзіңді жайсыз сезінсең, мәселеңді жасырып қалма.\n«Жоқ!» деп айт, қауіпсіз жерге бар және болған жағдайды міндетті\nтүрде ата-анаңа, педагогке, мектеп психологіне немесе өзің сенетін\nересек адамғат айт. 111 байланыс орталығына жазып, көмек сұра.\n      Сабақтың басты ережесі\n      Менің денем – өзіме тиесілі. Егер мен өзімді жағымсыз сезінсем:\n– «Жоқ!» деп айтамын, қауіпсіз жерге шегінемін және сенетін ересек\nадамға айтып беремін.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 6-сабақ — Ұлы дала коды"}, "grade-1/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Интернеттегі қауіпті хабарламалар мен сілтемелер<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 74-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=74\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№7 сабақ       Интернеттегі      қауіпті  хабарламалар     мен\n           сілтемелер\nМақсаты        Білім алушылардың интернеттегі қауіпсіз мінез-\n           құлық дағдыларын қалыптастыру\nМіндеттері     −        білім алушыларды бейтаныс адамдардан\n           келген хабарламалар мен сілтемелерге қатысты\n           қауіпсіздік ережелерімен таныстыру;\n               −        цифрлық ортада қауіпсіз шешім қабылдай\n           білу дағдыларын дамыту;\n               −        цифрлық құрылғыларды пайдалануға\n           жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Планшет немесе телефон макеті, хабарламалар бейнеленген\nкарточкалар, «Ашпа», «Жауап берме», «Ересек адамға көрсет»\nкарточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог хабарламаны көрсетеді:\n      «Сен сыйлық ұтып алдың! Осы жерді бас!».\n      Педагог:\n      – Мұндай хабарламаға басуға бола ма?\n      Білім алушылар жауап береді. Педагог:\n      – Дұрыс, басуға болмайды. Қызықтырып, сыйлық немесе жүлде\nуәде ететін бейтаныс хабарламаларға сенуге және олардағы\nсілтемелерді ашуға болмайды.\n      Педагог екінші хабарламаны көрсетеді:\n      «Сәлем! Сен қай жерде тұрасың?»\n      – Бұл хабарламаға жауап беру керек пе?\n      Білім алушылар жауап береді. Педагог қорытынды жасайды:\n      – Бейтаныс адамдардың хабарламаларына жауап беруге және\nөзің туралы жеке ақпаратты айтуға болмайды. Күмәнді хабарлама\nнемесе сілтеме алсаң, оны ашпай, жауап бермей, бірден ересек адамға\nкөрсету керек.\n      II. Негізгі бөлім\n      1. «Қауіпті жағдайды тап» жаттығуы\n      Педагог карточкаларды көрсетеді:\n            анаңнан келген хабарлама;\n            белгісіз сілтеме;\n            фотосурет жіберуді сұрау;\n            әкең қосып берген танымдық ойын;\n            бейтаныс адамнан келген хабарлама.\n\n     Білім алушылар ересек адамның көмегін қажет ететін\nжағдайларды анықтайды. Педагог қорытынды жасайды:\n     – Бейтаныс хабарламаларды өз бетіңше ашуға болмайды.\n     2. «Қауіпсіздіктің үш қадамы» жаттығуы\n     Сыныпта мына карточкалар орналастырылады:\n           «Ашпа»\n           «Жауап берме»\n           «Ересек адамға көрсет»\n     Педагог жағдаятты атайды, ал білім алушылар бірінші кезекте\nжасалуы тиіс дұрыс әрекетті таңдайды:\n           белгісіз сілтеме пайда болды;\n           бейтаныс адам хабарлама жазды;\n           экранда қорқынышты бейне ашылды;\n           фотосурет жіберуді сұрады.\n     III. Қорытынды бөлім\n     Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n     – Егер бейтаныс хабарлама келсе, мен...\n     – Егер белгісіз сілтеме пайда болса, мен...\n     – Көмек сұрау үшін мен ... жүгінемін.\n     Педагог еске салады:\n     – 111 байланыс орталығына балалар да, ересектер де жүгіне\nалады. Егер сендерге көмек немесе қорғау қажет болса, 111\nнөміріне өздерің қоңырау шала аласыңдар немесе ата-анаңнан,\nпедагогтен не басқа жақын ересек адамнан көмек сұрай аласыңдар.\n     Сабақтың басты ережесі\n     Сілтемені ашпа. Бейтаныс адамға жауап берме. Бірден ересек\nадамға көрсет.\n\nҚазақстан Республикасы Қаржы\nнарығын реттеу және дамыту\nагенттігінің «FinGramota.kz» жобасы\nұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 7-сабақ — Ұлы дала коды"}, "grade-1/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Жеке ақпаратыңды қалай қорғау керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 76-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=76\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ       Жеке ақпаратыңды қалай қорғау керек?\nМақсаты        Білім алушылардың жеке ақпарат туралы\n           түсініктерін қалыптастыру және оны бейтаныс\n           адамдарға жарияламау, қауіпсіз қарым-қатынас жасау\n           дағдыларын дамыту.\nМіндеттері     – білім алушыларды жеке ақпарат ұғымымен және\n           оны қорғау ережелерімен таныстыру;\n               – қандай ақпаратты бейтаныс адамдарға айтуға\n           болмайтынын ажырата білуге үйрету;\n               – өз қауіпсіздігіне жауапкершілікпен қарауға және\n           жеке ақпаратты қорғауға тәрбиелеу.\n\n       Материалдар мен ресурстар\n       Жасыл және қызыл түсті екі қорап, өмірлік жағдаяттар,\nиллюстрациялар.\n       Сабақ барысы\n       I. Кіріспе бөлім\n       Педагог:\n       – Балалар, мына әңгімені тыңдаңдар.\n       Айша аулада ойнап жүрді. Оның жанына бейтаныс адам келіп,\nтүрлі сұрақтар қоя бастады:\n       – Атың кім?\n       – Қай жерде тұрасың?\n       – Ата-анаң қашан үйде болады?\n       – Кілттер қай жерде сақтаулы?\n       Айша жауап бергісі келді, бірақ қасына полицей келді. Ол\nбейтаныс адамдардың барлық сұрақтарына жауап бере беруге\nболмайтынын түсіндірді.\n       Педагог сұрақ қояды:\n       – Неліктен бейтаныс адамдарға өзің туралы барлық ақпаратты\nайтуға болмайды?\n       Білім алушылар жауап береді.\n       Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\nhttps://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eCSY2Fe\noTMEec8T451Um4EJpuikdqk&amp;index=7\n\n     II. Негізгі бөлім\n     1. «Айтуға болады ма?» жаттығуы\n     Педагог карточкаларды кезекпен көрсетеді. Білім алушылар\nондағы ақпаратты екі топқа бөледі:\n     «Айтуға болады»\n     «Бейтаныс адамға айтуға болмайды»\n     Карточкалар:\n     Менің есімім.\n     Сүйікті мультфильмім.\n     Сүйікті ойыным.\n     Үй мекенжайым.\n     Ата-анамның телефон нөмірі.\n     Үй кілтінің қай жерде сақталатыны.\n     Ата-анамның үйде болмайтын уақыты.\n     Телефонның немесе планшеттің құпиясөзі.\n     Білім алушылар әр карточкадағы ақпаратты қай топқа жатқызу\nкеректігін анықтап, өз таңдауын түсіндіреді.\n     Әр жауаптан кейін педагог сұрайды:\n     – Неліктен бұлай шештің?\n     Педагог қорытынды жасайды:\n     – Жеке ақпаратты бейтаныс адамдарға айтуға болмайды. Егер\nбейтаныс адам сенен жеке ақпаратыңды сұраса, оған жауап берме. Бұл\nтуралы міндетті түрде өзің сенетін ересек адамға айт.\n     III. Қорытынды бөлім\n     Педагог еске салады:\n     – Егер сендерге көмек немесе қорғау қажет болса, ата-анаңа,\nпедагогке немесе басқа ересек адамға жүгіне аласыңдар. Қажет болған\nжағдайда балалар да, ересектер де 111 байланыс орталығына өздері\nхабарласа алады.\n     Сабақтың басты ережесі\n     Жеке ақпаратымды бейтаныс адамдарға айтпаймын. Егер менен\nсұрай бастаса – жауап бермей, бірден сенімді ересек адамға айтамын.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eCSY2Fe\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eCSY2Fe<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 8-сабақ — Ұлы дала коды"}, "grade-1/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Үйдегі қауіпсіздік: терезе, есік және қауіпті заттар<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 78-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=78\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 9 сабақ      Үйдегі қауіпсіздік: терезе, есік және қауіпті\n           заттар\nМақсаты        Білім алушылардың үйде кездесуі мүмкін қауіптер\n           туралы саналы түсінігін қалыптастыру және қауіпсіз\n           мінез-құлық дағдыларын дамыту\nМіндеттері      терезелерге, есіктерге және тұрмыстық заттарға\n           байланысты қауіптермен таныстыру;\n                жағдайды талдау және қауіпті алдын ала болжай\n           білу дағдыларын дамыту;\n                өз өмірі мен денсаулығына ұқыпты қарауға\n           тәрбиелеу.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      - Әлихан үйде жалғыз қалды. Анасы 20 минутқа дүкенге кетті.\nАйша аулаға қарағысы келіп, терезенің алдына шығып, терезені\nайқара ашты. Сол кезде есік қоңырауы соғылды – бейтаныс адамның\nдауысы: «Аша ғой, мен көршімін. Маған тұз керек», – деді.\n      Сәлден соң айша ас бөлмесінде үстел үстіндегі сіріңкеге көзі\nтүсіп...\n      Педагог тоқтап:\n      – Балалар, Айша қанша қауіпті әрекет жасады? Санап көрейік\nжәне әрқайсысын талдап шығайық.\n      Білім алушылар өз жауаптарын ұсынады, педагог оларды\nтақтаға жазып қояды.\n      1.     Терезенің алдына шығып, терезені ашты.\n      2.     Бейтаныс адамға есік ашқысы келді.\n      3.     Сіріңкені қолына алды.\n      II. Негізгі бөлім\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1kRfBSA7SXxjjm_5F564nSYkFR2\nXjOoc-/view?usp=sharing\n       Педагог:\n      - Бүгін біз осы қауіптердің әрқайсысын талдап, дұрыс әрекет\nетуді үйренеміз!\n\n     Қауіпті аймақ – «ТЕРЕЗЕ»\n     Педагог білім алушыларды терезе жанындағы қауіпсіздік\nережелерімен таныстырады:\n   БОЛМАЙДЫ                   БОЛАДЫ\n   Терезенің алдына шығуға Терезеге еденде тұрып қарау.\n   болмайды.\n   Терезеден сыртқа еңкеюге Терезені ашу үшін ересек\n   немесе басыңды шығаруға адамнан көмек сұрау.\n   болмайды.\n   Масадан қорғайтын торға Есте сақта: масадан қорғайтын\n   сүйенуге болмайды.         тор адамды ұстап тұра\n                              алмайды!\n   Терезені өз бетінше ашуға Ыстық болса, анаңнан немесе\n   болмайды.                  басқа ересек адамнан терезені\n                              ашып беруін сұра.\n   Ашық терезенің жанында Ойын кезінде терезеден алыс\n   ойнауға болмайды.          тұр.\n\n      Қауіпті аймақ – «ЕСІК»\n      Педагог есіктің алдында тұрған баланың суретін көрсетеді.\nесіктің көзшесінен бейтаныс адам көрінеді (иллюстрация).\n      Педагог әрекет ету тәртібін кезең-кезеңімен түсіндіреді:\n      1-қадам. Бірден есікке жақындама.\n      2-қадам. Есікті ашпай, есіктің ар жағынан кім екенін сұра.\n      3-қадам. Бейтаныс адамдарға есік ашпа.\n      4-қадам. Егер қорықсаң – ересек адамды көмекке шақыр\nнемесе 102 нөміріне қоңырау шал.\n      Қауіпті аймақ – «ҚАУІПТІ ЗАТТАР»\n      Педагог заттардың суреттері бейнеленген карточкаларды алып,\nүстел үстіне орналастырады.\n      Карточкалар:\n      Заттар           Қандай қауіп болуы           Қауіпсіздік ережесі\n                            мүмкін?\nСіріңке, оттық       Өрт шығуы, күйіп қалу      Өз бетіңше ұстама. Ересек\n                                                адамға айт.\nТаблеткалар, дәрі-   Денсаулыққа зиян келуі     Дәріні тек ересек адамның\nдәрмектер            мүмкін                     рұқсатымен қабылда.\nЭлектр розеткасы,    Электр тоғы соғуы мүмкін   Розетка мен сымдарға қол\nсымдар                                          тигізбе.\nПышақ, қайшы         Жарақат алып қалу          Ересек адамның көмегімен\n                                                пайдалан.\nТұрмыстық химия      Улану немесе күйіп қалу    Өз бетіңше ашпа және\nқұралдары                                       қолданба.\n\nҮтік, фен          Күйіп қалу немесе электр   Ересек адамның көмегімен\n                   тоғы соғуы мүмкін          пайдалан.\nКәмпиттер          Дұрыс қолданылса,          Ересек адамның\n                   қауіпсіз                   рұқсатымен жеуге болады.\n\n      III. Қорытынды бөлім\n     Педагог сыныппен бірге «Үйдегі қауіпсіздік кодексін»\nқұрастырып, тақтаға жазады:\n     Үйдегі қауіпсіздік кодексі\n     1.     Терезе – терезеге еденде тұрып қарау, ешқашан терезенің\nалдына шықпау.\n     2.     Есік – бейтаныс адамдарға есік ашпау, алдымен анаңа\nнемесе басқа ересек адамға хабарлау.\n     3.     Қауіпті заттар – ересектердің рұқсатынсыз қол тигізбеу.\n     4.     Егер қорықсаң – 102, 111 немесе 112 нөмірлеріне\nхабарласу.<\/div><p><a href=\"https://drive.google.com/file/d/1kRfBSA7SXxjjm_5F564nSYkFR2\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1kRfBSA7SXxjjm_5F564nSYkFR2<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 9-сабақ — Ұлы дала коды"}, "grade-1/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Мектепке дейінгі қауіпсіз бағыт: жолдағы және қоғамдық көліктегі қауіпсіздік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 81-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=81\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 10 сабақ          Мектепке дейінгі қауіпсіз бағыт: жолдағы\n               және қоғамдық көліктегі қауіпсіздік\nМақсаты             Білім алушылардың үйден мектепке дейінгі\n               қауіпсіз бағытты, соның ішінде қоғамдық көлікпен\n               жүру тәртібін өздігінен анықтау және есте сақтау\n               дағдыларын қалыптастыру.\nМіндеттері           «бағыт» және «қауіпсіз бағыт» ұғымдарымен\n               таныстыру;\n                     көшеде    мұқият    әрі   байқампаз   болу\n               дағдыларын дамыту;\n                     өз қауіпсіздігіне жауапкершілікпен қарауға\n               және көшеде жүрген кезде сақтық танытуға\n               тәрбиелеу.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, сендер мектепке күнде әртүрлі жолмен келесіңдер.\nАл сол жолда қауіпсіз жүру үшін нені білу керек деп ойлайсыңдар?\nБүгін мектепке баратын қауіпсіз жолды бірге анықтаймыз. Ал «бағыт»\nдегеніміз не?\n      II. Негізгі бөлім\n      Педагог түсіндіреді:\n      – Бағыт – бір жерден екінші жерге баратын жол. Бағыт қысқа да,\nұзын да, қауіпті де, қауіпсіз де болуы мүмкін. Бізге ең қысқа емес, ЕҢ\nҚАУІПСІЗ бағыт қажет!\n      Педагог көшеде жүру ережелерін түсіндіреді:\n      1-ереже. Тротуармен жүру.\n      Тротуар – жаяу жүргіншілерге арналған жол. Егер тротуар\nболмаса, жолдың шетімен көліктерге қарсы бағытта жүріп, көліктерді\nкөріп отыру керек.\n      2-ереже. Жолды тек жаяу жүргіншілер жолы арқылы кесіп\nөту.\n      Жаяу жүргіншілер жолы – жолдан өтуге арналған арнайы орын.\n      Жолды басқа жерден кесіп өтуге болмайды.\n      3-ереже. Бағдаршам – біздің досымыз.\n      Қызыл түс – жаяу жүргіншілер тоқтайды, жасыл түс – жаяу\nжүргіншілер жүреді.\n      4-ереже. Солға және оңға қарау.\n      Тіпті бағдаршамның жасыл түсі жанса да, алдымен солға\nқараймыз. Жолдың ортасына жеткенде оңға қараймыз. Жолдағы\n\nқозғалыстың қауіпсіз екеніне көз жеткіземіз. Көлік бірден тоқтамауы\nмүмкін!\n      Педагог тақтаға ауылдың үлкен сызбасын іліп, мектепке\nапаратын екі түрлі бағытты көрсетеді:\n   А бағыты                       Б бағыты\n   Саябақ     арқылы,      төте Тротуармен, жаяу жүргіншілер\n   жолмен.                        өткелі («зебра») арқылы.\n   5 минутқа қысқа.               Сәл ұзағырақ.\n   Жарықтандырылмаған.            Бағдаршам        және     жаяу\n                                  жүргіншілер өткелі бар.\n   Адамдар аз жүреді.             Адамдар көп, дүкендер бар.\n\n            Балалар, мектепке баратын қай бағытты таңдаймыз?\nНеліктен?\n      Білім алушылар жауап береді. Педагог қорытынды жасайды:\n      – «Б» бағыты – қауіпсіз бағыт! Ол сәл ұзағырақ болғанымен,\nқауіпсіз!\n      «Қауіпсіз жолаушы» жаттығуы\n      Педагог:\n      – Балалар, кейде мектепке автобуспен барамыз. Автобуста\nөзімізді қалай ұстау керек екенін бірге тексерейік.\n      Мен әртүрлі әрекеттерді айтамын. Егер әрекет дұрыс болса,\nжасыл карточканы, ал қауіпті болса, қызыл карточканы көрсетіңдер.\n      – Автобусты аялдамада күту. (Жасыл)\n      – Жолға тым жақын тұру. (Қызыл)\n      – Автобус тоқтаған соң міну. (Жасыл)\n      – Автобусқа мінгенде итеріcу. (Қызыл)\n      – Бос орын болса отыру, болмаса тұтқадан ұстау. (Жасыл)\n      – Автобус жүріп келе жатқанда ары-бері жүру. (Қызыл)\n      – Автобус тоқтаған соң түсу. (Жасыл)\n      – Автобустан түсе сала жолға жүгіріп шығу. (Қызыл)\n      – Автобуста қолыңды терезеден шығару. (Қызыл)\n      Педагог қорытындылайды:\n      – Есте сақтайық:\n      Аялдамада күт. Автобус тоқтаған соң мін. Отыр немесе\nтұтқадан ұста. Асықпай түс. Жолды жаяу жүргіншілер өткелімен өт.\n      III. Қорытынды бөлім\n      Педагог жағдаяттарды оқиды, білім алушылар жасыл немесе\nқызыл карточканы көтереді:\n      1.     Әлішер кешігіп қалмас үшін көліктердің арасымен жолды\nжүгіріп өтті. (Қызыл)\n\n       2.   Айбек мектепке тезірек жету үшін құрылыс алаңы арқылы\nөтті. (Қызыл)\n       3.   Айша тротуармен жүріп, телефонын қалтасына салып\nқойды. (Жасыл)\n       4.   Айдын әдемі мысықтарды көру үшін бейтаныс ауланың\nарасымен жүрді. (Қызыл)\n       Педагог тақтаға қауіпсіз бағыттың төрт ережесін жазады:\n       1.   Тек тротуармен жүру – ешқашан жолдың көлік жүретін\nбөлігімен жүрмеу.\n       2.   Жолды тек жаяу жүргіншілер жолы арқылы кесіп өту:\nалдымен солға, содан кейін оңға қарау.\n       3.   Адамдар көп жүретін және жарықтандырылған жолды\nтаңдау.\n       4. Мүмкін болса, телефоныңдағы «Орналасқан жерді бөлісу»\n(геолокация) функциясы арқылы ата-анаңа қай жерде екеніңді жібер.\nСонда олар сенің орналасқан жеріңді көре алады.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 10-сабақ — Ұлы дала коды"}, "grade-1/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>1-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-1/index.html\">← 1-сынып тақырыптары<\/a><article><h2>Далада қауіпсіз ойнау ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 84-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=84\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 11 сабақ          Далада қауіпсіз ойнау ережелері\nМақсаты             Білім алушылардың далада ойнау кезіндегі қауіпсіз\n               мінез-құлық дағдыларын қалыптастыру\nМіндеттері          - білім алушыларды көшеде қауіпсіз мінез-құлық\n               ережелерімен таныстыру;\n                    - қауіпсіз шешім қабылдай білу дағдыларын дамыту;\n                    - өз    қауіпсіздігіне жауапкершілікпен    қарауға\n               тәрбиелеу.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, бәріміз далада ойнағанды жақсы көреміз. Бірақ кез\nкелген жер ойнауға қауіпсіз бола бермейді. Бүгін біз далада қалай\nкөңілді әрі қауіпсіз ойнауға болатынын үйренеміз.\n      II. Негізгі бөлім\n      1. «Қай жерде қауіпсіз ойнауға болады?» жаттығуы\n      Білім алушылар карточкаларды көтереді:\n      жасыл карточка – ойнауға болады;\n      қызыл карточка – ойнауға болмайды.\n      Педагог жағдаяттар бейнеленген карточкаларды көрсетеді:\n            балалар алаңы;\n            спорт алаңы;\n            көлік жүретін жол;\n            құрылыс алаңы;\n            қараусыз қалған ғимарат;\n            автотұрақ.\n      Әр жауаптан кейін педагог сұрайды:\n      – Неліктен бұлай шештің?\n      Педагог қорытынды жасайды:\n      – Ойынды тек қауіпсіз әрі арнайы белгіленген жерлерде ойнау\nкерек.\n      2. «Менің қауіпсіз таңдауым» жаттығуы\n      Педагог тақтаға екі белгі іледі:\n      «Қауіпсіз» / «Қауіпті»\n      Педагог әртүрлі әрекеттерді оқиды. Білім алушылар сол\nәрекеттің қауіпсіз немесе қауіпті екенін анықтап, тиісті белгіні\nкөрсетеді.\n      Мысалы:\n          ойын алаңында ересек адамның бақылауымен ойнау;\n          жолдың жанында доп ойнау;\n          әткеншек толық тоқтағаннан кейін оған жақындау;\n\n          биік жерден секіру;\n          сынған ойын құрылғысына міну;\n          ойын кезінде айналаға назар аудару;\n          қараңғы түскенде жалғыз ойнау;\n          жарақат алсаң, ересек адамға айту.\n      Әр жауаптан кейін педагог:\n      – Неліктен бұл қауіпсіз?\n      – Неліктен бұл қауіпті?\n      – Қалай дұрыс әрекет етуге болады? – деп сұрайды.\n      Қорытынды:\n      – Далада ойнағанда қауіпсіз орынды таңдап, айналаңа мұқият\nқарап, өзіңе қауіп төндіретін әрекеттерден аулақ болу керек.\n      Педагог:\n      – Балалар, далада ойнап жүргенде қасымызға ит немесе мысық\nкелуі мүмкін. Олар жуас көрінсе де, қорқып қалуы немесе күтпеген\nәрекет жасауы мүмкін. Сондықтан мұндай кезде өзімізді қалай ұстау\nкерегін білген дұрыс.\n      Есте сақта: «Егер қасыңа ит не мысық жақындаса»\n      – Бейтаныс итке немесе мысыққа жақындама.\n      – Оларды ұстама, мазалама.\n      – Қасыңа келсе, айқайлама, қашпа.\n      – Асықпай алыста.\n      – Қауіп сезсең, ересек адамды шақыр.\n      III. Қорытынды бөлім\n      Педагог сұрақтар қояды:\n            Қай жерде ойнауға болады?\n            Неліктен жолдың жанында ойнауға болмайды?\n            Бейтаныс адам сені өзімен бірге шақырса, не істеу керек?\n            Көмек сұрап кімге жүгіну керек?\n      Педагог еске салады:\n      – Егер сендерге көмек немесе қорғау қажет болса, ата-анаңа,\nпедагогке немесе басқа ересек адамға жүгіне аласыңдар. Қажет болған\nжағдайда 111 байланыс орталығына хабарласа аласыңдар.\n      Қауіпсіз серуен ойын ойнайтын орынды дұрыс таңдаудан және\nқарапайым ережелерді сақтаудан басталады. Егер қауіпті жағдай\nтуындаса, тәуекелге бармай, бірден көмек сұрау керек.\n      Сабақтың басты ережесі\n      Тек балалар алаңында ойна. Жолға, құрылыс алаңына және\nқауіпті заттарға жақындама. Көмек қажет болса – бірден ересек адамға\nжүгін.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "1-сынып · 11-сабақ — Ұлы дала коды"}};const HOME="grade-1/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
