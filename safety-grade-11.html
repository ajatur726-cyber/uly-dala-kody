т және цифрлық шешімдер үшін жауапкершілік<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-11/lesson-08.html\"><h2>8. Қылмыстық әрекетке тартудан сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-11/lesson-09.html\"><h2>9. Өрт кезіндегі қауіпсіздік<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-11/lesson-10.html\"><h2>10. Күмәнді табыс пен дропперліктен сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-11/lesson-11.html\"><h2>11. Жұмысқа орналасудағы алаяқтықтан сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-11/lesson-12.html\"><h2>12. Өз әрекетіңе жауапкершілікпен қарау<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-11/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен бірыңғай байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 402-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=402\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ         Төтенше жағдайлар қызметтері мен бірыңғай\n             байланыс орталығының телефон нөмірлері\nМақсаты          Білім алушылардың дағдарыстық және төтенше\n             жағдайларда сауатты әрекет етуге, шұғыл қызметтер мен\n             қолдау қызметтеріне көмек сұрап жүгінуге дайындығын\n             қалыптастыру.\nМіндеттері        Қазақстандағы шұғыл қызметтер мен байланыс\n             орталығы туралы білімдерін өзектендіру;\n                  көмек сұрап жүгінудің дұрыс алгоритмін таңдауға\n             үйрету;\n                  жағдайды     жедел     бағалау,   қауіп-қатерлердің\n             басымдығын анықтау және көмекке жауапкершілікпен\n             жүгіну дағдыларын дамыту.\n\n      Материалдар мен ресурстар\n      «Дағдарыс штабы» іскерлік ойынына арналған төтенше және\nдағдарыстық жағдайлар сипатталған карточкалар, Қазақстан\nРеспубликасының шұғыл қызметтерінің телефон нөмірлері көрсетілген\nкарточкалар: 101, 102, 103, 104, 111, 112; топтық жұмысқа арналған\nпрактикалық кейстері бар үлестірмелі материалдар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      1. «Бір минутта шешім қабылда» кейс-тапсырмасы\n      Мектеп түлегі кешкі уақытта үйіне қайтып келе жатады. Автобус\nаялдамасында бір адам кенеттен есінен танып қалады. Бірнеше метр\nжерде екі адамның арасында жанжал басталады. Ал басқа жолаушылар\nболып жатқан жағдайды ұялы телефондарына түсіріп жатыр.\n      Педагогтің сұрақтары:\n           Бір уақытта қандай қауіп-қатерлер туындап тұр?\n           Шұғыл көмек кімге қажет екенін қалай анықтауға болады?\n           Қандай қызметтердің көмегі қажет болуы мүмкін?\n           Өзіңізге және айналаңыздағы адамдарға қауіп төндірмей,\n             қалай әрекет етуге болады?\n      Білім алушылар өз болжамдары мен жауаптарын ұсынады.\n      Педагог атап көрсетеді:\n      Күрделі жағдайда уақыт шешуші рөл атқарады. Кейде бір ғана\nқоңырау қайғылы жағдайдың алдын алуға мүмкіндік береді.\n      II. Негізгі бөлім\n      Педагог Қазақстандағы шұғыл қызметтердің телефон нөмірлерін\nтүсіндіреді:\n            101 – өрт сөндіру қызметі;\n\n            102 – полиция;\n            103 – жедел медициналық көмек;\n            104 – газдың авариялық қызметі;\n            112 – бірыңғай құтқару және шұғыл көмек қызметі.\n       Педагог 111 бірыңғай байланыс орталығының нөмірі туралы\nтүсіндіреді:\n            111 – отбасы, әйелдер және балалардың құқықтарын\nқорғау мәселелері бойынша байланыс орталығы. Балалардың\nқұқықтарын қорғауға, отбасындағы қиындықтарға, зорлық-\nзомбылыққа, буллингке және басқа да дағдарыстық жағдайларға\nқатысты кеңес пен қолдау алу үшін осы нөмірге жүгінуге болады.\n       Сондай-ақ, білім алушы ата-анасына немесе өзге де сенімді\nересек адамға, сынып жетекшісіне, мектеп психологіне немесе\nәлеуметтік педагогке көмек сұрап жүгіне алады.\n       2. «Дағдарыс штабы» іскерлік ойыны\n       Сынып 3-4 топқа бөлінеді. Әр топқа төтенше жағдай сипатталған\nкарточка беріледі.\n       1-жағдаят. Мектептегі іс-шара кезінде қатысушылардың бірінің\nжағдайы күрт нашарлап, ол есінен танып қалды.\n       2-жағдаят. Көпқабатты үйде газдың өткір иісі сезілді.\n       3-жағдаят. Досыңа әлеуметтік желіде бейтаныс адам қорқытып\nжазады. Ол досыңның қай мектепте оқитынын білетінін де айтты.\n       4-жағдаят. Көшеде велосипедші қатысқан жол-көлік оқиғасы\nболды.\n       Топтарға арналған тапсырма: 2 минут ішінде төмендегі\nсұрақтарға жауап дайындаңыздар:\n            Қандай қызметке қоңырау шалу қажет?\n            Ақпаратты кім хабарлауы тиіс?\n            Қандай мәліметтерді хабарлау қажет?\n            Мамандар келгенге дейін өзіңізге және басқа адамдарға\nқауіп төндірмей, қандай қауіпсіз әрекеттер жасауға болады?\n       Талқылаудан кейін топтар өз шешімдерін ұсынады.\n       «Біздің топтың әрекет ету алгоритмі: қызмет – ..., хабарлаймыз –\n..., көмек келгенге дейін – ...»\n       Педагог атап көрсетеді:\n       Шұғыл қызметтердің телефон нөмірлерін білу маңызды. Алайда\nодан да маңыздысы – жағдайды жылдам бағалап, көмекті дұрыс\nұйымдастыра білу.\n       Кейде қиын жағдайға тап болғанда, бәрін жалғыз шешуге\nтырыспай, көмек сұраған дұрыс. Осындай кезде ата-анаңа, педагогке,\nмектеп психологіне немесе өзің сенетін ересек адамға жүгіну\n\nжағдайды басқа қырынан бағалап, қауіпсіз шешім табуға көмектеседі.\nАл кімге хабарласарыңды білмесең немесе қосымша кеңес қажет болса,\n111 байланыс орталығына жүгінуге болады. Мұнда қиын өмірлік\nжағдай, буллинг, зорлық-зомбылық, құқықтардың бұзылуы және басқа\nда мәселелер бойынша кеңес пен көмек алуға болады\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін аяқтап,\nөз пікірін білдіруді ұсынады:\n            Төтенше жағдайда мен ең алдымен...\n            Шұғыл қызметке хабарласқанда, маңызды ақпарат\nретінде...\n            Егер қандай қызметтің көмегі қажет екенін білмесем, мен...\n            Мамандар келгенге дейін...\n      Педагог қорытынды жасайды:\n       Төтенше немесе дағдарыстық жағдайда қызметтің телефон\nнөмірін білу ғана жеткіліксіз. Жағдайды дұрыс бағалай білу, өзіңе және\nайналаңдағы адамдарға қосымша қауіп төндірмеу, қажетті ақпаратты\nнақты жеткізу және маманның нұсқауларын орындау маңызды.\nКөмекке дер кезінде әрі жауапкершілікпен жүгіну – жеке және\nқоғамдық қауіпсіздіктің маңызды дағдысы.\n                                    Қосымша ақпарат\n\nБайланыс нөмірі          Қызмет                            Қашан жүгіну керек\n112               Қосымша ақпарат              Кез келген төтенше жағдайда немесе қандай\n                                               қызметке хабарласу керектігі белгісіз болған\n                                               кезде\n101               Бірыңғай шұғыл көмек         Өрт, өрттің шығуы, түтін басу\n                  көрсету қызметі\n102               Өрт сөндіру қызметі          Қылмыс, төбелес, қорқыту, өмірге және\n                                               денсаулыққа қауіп төнуі\n103               Полиция                      Жарақат алу, есінен тану, денсаулық\n                                               жағдайының күрт нашарлауы\n104               Жедел медициналық көмек      Газдың иісі шығуы, газдың таралуы\n                  қызметі\n111               Газдың авариялық             Буллинг, кибербуллинг, қорқыту, зорлық-\n                  қызметі –                    зомбылық және көмек пен қолдауды қажет\n                                               ететін басқа да күрделі өмірлік жағдайлар\nӨз өңіріңіздегі   «111» отбасы, әйелдер мен    Психологиялық қиындықтар, қатты күйзеліс,\nбайланыс          балалардың құқықтарын        мазасыздық, буллинг, психологиялық көмек\nдеректері         қорғау мәселелері            пен қолдауға қажеттілік\n                  бойынша байланыс\n                  орталығы (тәулік бойы,\n                  24/7)\nӨз өңіріңіздегі   Психологиялық қолдау         Балалардың құқықтары мен заңды\nбайланыс          орталығы                     мүдделерінің бұзылуы, қорғау мен көмекті\nдеректері                                      қажет ететін жағдайлар\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 1-сабақ — Ұлы дала коды"}, "grade-11/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Қиын жағдайда көмекке жүгіну жолдары<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 405-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=405\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ          Қиын жағдайда көмекке жүгіну жолдары\nМақсаты           Білім алушылардың қиын жағдайда көмекке дер\n              кезінде жүгіну және тиісті көмек көзін таңдай білу\n              дағдыларын қалыптастыру.\nМіндеттері        – қиын жағдайда көмек көрсете алатын адамдар\n              мен қызметтер туралы білімдерін кеңейту;\n                  – жағдайға қарай кімге және қай қызметке жүгіну\n              керектігін анықтай білуге үйрету;\n                  –     өз    қауіпсіздігі    мен     әл-ауқатына\n              жауапкершілікпен қарап, қажет кезде көмек сұрауға\n              дағдыландыру.\n\n     Материалдар мен ресурстар\n     Ұйымдар мен мамандардың атаулары көрсетілген карточкалар.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     «Сенім шеңбері» жаттығуы\n     Педагог білім алушыларға төмендегі сұраққа жауап беруді\nұсынады:\n      Адам мәселені өз бетінше шеше алмаған кезде көбіне кімнен\nкөмек сұрайды?\n     Білім алушылардың жауаптары тақтаға жазылады.\n     Мысалы:\n           ата-аналар;\n           достар;\n           мұғалімдер;\n           психолог;\n           медицина қызметкерлері;\n           полиция;\n           шұғыл қызметтер.\n     Талқылаудан кейін педагог сұрақ қояды:\n     – Неліктен кей балалар қиын жағдайда басқалрдан көмек сұрауға\nқиналады?\n     Білім алушылар өз пікірлерін білдіреді.\n     Педагог қорытынды жасайды:\n\n      -     Көмекке дер кезінде жүгіну – жауапкершіліктің белгісі.\nКөмек сұрауға шешім қабылдау ғана емес, нақты жағдайда кімнің\nкөмек көрсете алатынын білу де маңызды.\n      ІІ. Негізгі бөлім\n      «Қайда жүгінер едің?» практикалық тапсырмасы\n      Педагог білім алушыларға бірнеше жағдаят ұсынады:\n           Досың соңғы уақытта қатты күйзеліп жүргенін айтып, бұл\nтуралы ешкімге айтпауынды сұрайды.\n           Танысыңа әлеуметтік желі арқылы қорқытып, ақша талап\nетіп жүр.\n           Қоғамдық орында адамның жағдайы кенет нашарлап, оған\nмедициналық көмек қажет болады.\n           Жасөспірім отбасындағы қиын жағдайға байланысты\nкімнен кеңес сұрарын білмейді.\n      Педагог сұрайды:\n      – Қай жағдайда шұғыл әрекет ету қажет?\n      – Әр жағдайда кімнен немесе қай қызметтен көмек сұрауға\nболады?\n      – Көмек түрін таңдағанда нені ескеру керек?\n      – Егер кімге жүгіну керектігін білмесең, қандай әрекет жасар\nедің?\n      Білім алушылар әр жағдаятты талдап, «жағдай – алғашқы әрекет\n– кімге жүгіну керек» ретімен өз шешімдерін ұсынады.\n      Педагог қорытындылайды:\n      – Көмекке жүгінудің бірнеше жолы бар. Бір жағдайда өзің сенетін\nадаммен сөйлесу жеткілікті болуы мүмкін, ал басқа жағдайда\nпсихологтің, құқық қорғау органының немесе жедел қызметтің көмегі\nқажет болады. Ең бастысы – жағдайдың қаншалықты қауіпті екенін\nбағалап, көмекті дер кезінде және дұрыс жерден сұрай білу.\n      Психологиялық қолдау орталығы – егер сен қатты күйзелісті\nнемесе мазасыздықты бастан өткерсең, буллингке, кибербуллингке,\nзорлық-зомбылыққа немесе басқа да күрделі жағдайға тап болсаң және\nпсихологиялық көмек қажет болса, осы орталыққа жүгінуге болады.\n      Мекенжайы: ______________________________\n      Телефоны: ____________________________\n      Балалардың құқықтарын қорғау басқармасы – егер сенің\nқұқықтарың бұзылса, зорлық-зомбылыққа немесе қатыгез қарым-\nқатынасқа тап болсаң не құқықтарың мен заңды мүдделеріңді қорғау\nқажет болған жағдайда жүгінуге болады.\n      Мекенжайы: ______________________________\n      Телефоны: ____________________________\n\n      Ескерту: педагог       білім     алушыларға     тиісті  өңірдегі\nПсихологиялық қолдау орталығы мен Балалардың құқықтарын қорғау\nбасқармасының өзекті мекенжайлары мен телефон нөмірлерін\nхабарлайды.\n      «БАҒАЛА – ТАҢДА – ЖҮГІН» алгоритмі\n      Бағала – өмірге, денсаулыққа немесе қауіпсіздікке тікелей қауіп\nбар ма?\n      Таңда – бұл жағдайда кім көмек көрсете алады: шұғыл қызмет,\nполиция, медицина қызметкері, мектеп маманы, 111 байланыс\nорталығы немесе сенімді ересек адам?\n      Жүгін – не болғанын және қандай көмек қажет екенін қысқа әрі\nнақты түсіндір.\n      Педагог білім алушыларға тақырыпқа қатысты постермен\nтанысуды ұсынады.\n      https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p\n0p/view?usp=sharing\n      Маңызды!\n      Егер алғаш көмек сұраған адамың көмектесе алмаса немесе\nжағдайды маңызды деп қабылдамаса, басқа ересек адамға, маманға\nнемесе 111 байланыс орталығына жүгін. Қауіп әлі де сақталса, қажетті\nкөмек алғанға дейін көмек сұрауды тоқтатпа.\n      III. Қорытынды бөлім\n      Рефлексия\n     – Бүгін мен қиын жағдайда көмекке жүгіну туралы ... түсіндім.\n     – Егер кімге жүгіну керектігін білмесем, мен ... .\n     – Егер алғашқы көмек сұраған адамым көмектесе алмаса, мен ... .\n     – Қажет жағдайда мен көмек сұрай алатын адамдар мен\nқызметтер: ... .\n      Педагог қорытынды жасайды:\n       Әр адамның өмірінде қиын жағдайлар туындауы мүмкін.\nЖаныңда әрдайым көмектесуге дайын адамдар мен қызметтер бар\nекенін есте сақтау маңызды. Қолдауға дер кезінде жүгіну денсаулық\nпен қауіпсіздікті сақтауға және жағдайдан дұрыс жол табуға\nкөмектеседі.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 2-сабақ — Ұлы дала коды"}, "grade-11/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Жеке қарым-қатынастағы қауіпсіздік: груминг пен сталкингті тану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 408-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=408\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ          Жеке     қарым-қатынастағы     қауіпсіздік:\n             груминг пен сталкингті тану\nМақсаты           Білім алушылардың жеке қарым-қатынастағы\n             қауіпті мінез-құлықты тану, жеке шекараларын\n             қорғау және дер кезінде көмек сұрап жүгіну\n             дағдыларын қалыптастыру.\nМіндеттері         білім    алушыларды    «груминг»    және\n             «сталкинг» ұғымдарымен таныстыру;\n                   қауіпсіз қарым-қатынас жасау және жеке\n             шекараларды қорғау дағдыларын дамыту;\n                   жеке қарым-қатынаста жауапты әрі қауіпсіз\n             мінез-құлық қалыптастыру.\n\n      Материалдар мен ресурстар\n      «Құрмет» / «Бақылау» карточкалары, «Қарым-қатынастағы\nқауіпті белгілер» кестесі.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Құрмет шекарасы» жаттығуы\n      Педагог білім алушыларға төмендегі сұраққа жауап беруді\nұсынады:\n       Адамдар арасындағы дұрыс қарым-қатынас қандай болуы\nкерек?\n      Білім алушылардың жауаптары тақтаға жазылады. Мысалы:\n       сенім;\n       құрмет;\n       адалдық;\n       таңдау еркіндігі;\n       қолдау;\n       қауіпсіздік.\n      Талқылаудан кейін педагог келесі сұрақты қояды:\n       Қай сәтте қамқорлық шектен тыс бақылауға айналады?\n      Білім алушылар өз пікірлерін білдіреді.\n      Педагог қорытынды жасайды:\n\n      - Кез келген қарым-қатынас өзара құрметке негізделуі керек.\nЕгер адам бақылауға алып, қорқытып, аңдып немесе айла-шарғы жасай\nбастаса, бұл – алаңдататын белгі.\n      II. Негізгі бөлім\n      Ақпараттық блок «Груминг және сталкинг: қауіптілігі\nнеде?»\n      Груминг – ересек адамның балаға немесе жасөспірімге біртіндеп\nсеніміне кіріп, кейін оны өз мақсатына пайдалануға тырысуы. Мысалы,\nол ерекше көңіл бөліп, сыйлық ұсынуы, құпия сақтауды сұрауы, жеке\nақпарат немесе фотосурет талап етуі мүмкін. Груминг интернетте де,\nкүнделікті өмірде де кездеседі.\n      Сталкинг – адамның қаламағанына қарамастан, оны қайта-қайта\nаңду немесе мазалау. Бұл үздіксіз хабарлама жіберу, қоңырау шалу,\nжүрген жеріне әдейі бару, кіммен араласатынын бақылау немесе жеке\nөміріне араласуға тырысу түрінде көрінуі мүмкін.\n      Практикалық жаттығу «Құрмет, бақылау немесе қауіп?»\n      Педагог білім алушыларға берілген әрекеттің сипатын\nанықтауды ұсынады:\n      «Үйге аман-есен жеткенде, мен уайымдамас үшін, хабарлашы».\n      «Сен үнемі маған геолокацияңды жіберіп отыруға міндеттісің.\nӘйтпесе, менен жасыратын бір нәрсең бар деген сөз».\n      «Бұл туралы сөйлескің келмейтінін түсінемін».\n      «Егер менімен сөйлесуді тоқтатсаң, жеке хат-хабарларыңды\nжариялап жіберемін».\n      «Сенің бас тартқаның маған ұнамайды, бірақ мен оны\nқабылдаймын».\n      Білім алушылар жағдаяттарды анықтайды:\n      құрмет → бақылау/қысым → қорқыту\n      Өз шешіміне қандай нақты белгі әсер еткенін түсіндіреді.\n      Педагог білім алушыларға бейнематериал ұсынады.\n      https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-\nLvKn160Eh6m/view?usp=sharing\n      Қорқыту, аңду немесе басқа да заңға қайшы әрекеттер орын алған\nжағдайда 102 нөмірі арқылы полицияға хабарлас. Балалардың\nқұқықтарын қорғау мәселелері бойынша кеңес пен қолдау алу үшін 111\nбайланыс орталығына жүгінуге болады.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға өз қалауы бойынша төмендегі\nсөйлемдердің бірін аяқтауды ұсынады:\n            Жеке шекараларды құрметтеу дегеніміз – ...\n            Қауіпті бақылаудың белгілерінің бірі – ...\n\n              Егер адам аңдуға немесе қорқытуға тап болса, қауіпсіз\nәрекет – ...\n          Осы сабақтан кейін есте сақтау маңызды нәрсе – ...\n      Қауіпсіз қарым-қатынас өзара құрметке, еркіндікке және әр\nадамның жеке шекараларын белгілеу құқығына негізделеді. Егер\nадамның бас тартуы қабылданбай, бақылау, қысым, қорқыту немесе\nаңду күшейе түссе, жағдайды жалғыз шешуге тырыспау, дәлелдерді\nсақтап қою және дер кезінде көмекке жүгіну маңызды.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 3-сабақ — Ұлы дала коды"}, "grade-11/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Қауіпті жағдайдағы әрекет пен жауапкершілік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 411-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=411\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ           Қауіпті жағдайдағы әрекет пен жауапкершілік\nМақсаты            Білім алушылардың қауіпті және құқыққа қайшы\n                жағдайлардағы        жауапкершілігін       түсінуін\n                қалыптастыру және азаматтық ұстанымын дамыту.\nМіндеттері         - қауіпті немесе құқыққа қайшы жағдайдағы\n                куәгердің рөлін ажырата білуге үйрету;\n                   - қауіпсіз араласу және дер кезінде көмекке\n                жүгіну дағдыларын дамыту;\n                   - саналы әрі қауіпсіз мінез-құлық қалыптастыру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Мектептің чатында бірнеше білім алушы сыныптасын жүйелі\nтүрде қорлап, кемсітіп жүр. Басқа қатысушылар бұл хабарламаларды\nкөріп отыр. Кейбіреулері қолдау білдіретін реакциялар қояды, енді\nбіреулері хабарламаларды басқа адамдарға жібереді, ал үшіншілері\nештеңе жазбайды және болып жатқан жағдай туралы ешкімге\nхабарламайды.\n      Педагогтің сұрақтары:\n            Бұл қатысушылардың әрекеттері бір-бірінен несімен\nерекшеленеді?\n            Қандай әрекеттер буллингті күшейтеді?\n            Куәгердің әрекеті қандай болмақ?\n            Куәгер кибербуллинг қатысушыларымен өзі жанжалға\nтүсуі қажет пе?\n      Білім алушылар өз болжамдары мен пікірлерін білдіреді.\n      Педагог атап көрсетеді:\n      - Куәгер жағдаяттың әрі қарай өрбуіне ықпал ете алады, алайда\nкөмек көрсету барысында өзі қауіпке ұшырамауы керек. Егер жағдайға\nтікелей араласу қауіпсіз болмаса, дұрыс әрекет – қауіпсіз жерге шегініп,\nболған жағдай туралы ересектерге, білім беру ұйымының әкімшілігіне\nнемесе тиісті қызметтердің мамандарына хабарлау, қажет болған\nжағдайда шұғыл көмек шақыру.\n      II. Негізгі бөлім\n      «Куәгердің үш шешімі» жаттығуы\n      Әр жағдаят бойынша топ үш түрлі әрекет нұсқасын талдайды:\n\n      А нұсқасы – жағдайды ушықтырады\n      Арандату, қорлайтын материалдарды қайта жіберу, қауесет\nтарату, болып жатқан жағдайды кейін жариялау мақсатында видеоға\nтүсіру.\n      Б нұсқасы – өзіне қауіп төндіреді\n      Қауіпті жанжалға өз бетімен араласу, төбелесіп жатқан\nадамдарды күш қолдану арқылы ажыратуға тырысу.\n      В нұсқасы – қауіпсіз түрде көмек көрсетеді\n      Болып жатқан жағдайды қолдамау, цифрлық ортадағы жағдайға\nқатысты қажетті дәлелдерді сақтау, жауапты ересек адамға немесе\nмаманға хабарлау, қажет болған жағдайда тиісті қызметке жүгіну.\n      Тапсырма:\n      1.    Әр нұсқа жағдайдың әрі қарай өрбуіне қалай әсер етеді?\n      2.    Қандай әрекет қосымша қауіп төндіреді?\n      3.    Өзіңе және басқа адамдарға қауіп төндірмей, қалай көмек\nкөрсетуге болады?\n      Педагог атап көрсетеді:\n       Кез келген жағдайда тек қатысушылар мен зардап шеккен\nадамдар ғана емес, куәгерлер де болады. Олардың таңдаған әрекеті\nжағдайдың әрі қарай қалай өрбитініне әсер етуі мүмкін.\n      «БАЙҚА – БАҒАЛА – ХАБАРЛА – ҚОЛДА» алгоритмі\n      Байқа – қауіп-қатер, зорлық-зомбылық, буллинг немесе басқа да\nқауіпті жағдайлардың белгілерін елеусіз қалдырма.\n      Бағала – өзіңе және айналаңдағы адамдарға қауіп төндірмей\nәрекет етуге бола ма, соны анықта.\n      Хабарла – жауапты ересек адамға, білім беру ұйымының\nәкімшілігіне, қауіпсіздік қызметінің қызметкеріне немесе тиісті\nқызметке хабарлас. Өмірге немесе денсаулыққа тікелей қауіп төнген\nжағдайда – 112, ал құқыққа қайшы әрекеттер орын алған жағдайда\n– 102 нөміріне хабарлас.\n      Қолда – егер бұл қауіпсіз әрі орынды болса, зардап шеккен\nадамға көмек сұрай алатынын түсіндір. Оқиғаға қатысты\nфотосуреттерді, бейнематериалдарды және басқа да мәліметтерді\nтаратпа.\n      Куәгер басқа адамға көмектесу үшін өзін қауіпке төндіруге\nміндетті емес. Төбелес, қарумен қорқыту, өрт, жол-көлік оқиғасы\nнемесе басқа да қауіпті жағдайда, егер бұл қауіпті болса, жағдайға өз\nбетінше араласуға болмайды. Қауіпсіз түрде көмек сұрау да – әрекет\nетудің бір жолы.\n      Есіңде сақта! Кез-келген жағдайда не мәселеде сен жалғыз\nемессің. Мәселең күрделі әрі мүлдем шешілмейтіндей болса,\n\nересектермен, достарыңмен және мектеп психологімен жай ғана\nәңгімелес. Кейде өзіңді мазалаған уайыммен сенім артатын адамыңмен\nбөлісу жеңілдеп қалуыңа көмектеседі.\n       Егер сенің жағдайыңда мәселе мүлдем шешілмейтіндей көрінсе\n111 байланыс орталығына жаз. Мәселеңмен бөліс. Орталық 24/7 тәулік\nбойы үзіліссіз жұмыс жасайды, анонимді түрде кеңес береді.\n       III. Қорытынды бөлім\n       Педагог білім алушыларға төмендегі сөйлемдерді аяқтауды\nұсынады:\n            Куәгер қауіпсіз түрде көмек көрсете алады, егер...\n            Жағдайға тікелей араласуға болмайды, егер...\n            Куәгердің әрекеті қауіпті жағдайды ушықтыруы мүмкін,\nегер...\n            Көмек сұрап жүгіну маңызды, себебі...\n       Педагог қорытынды жасайды:\n       Куәгердің әрекеті жағдайдың әрі қарай қалай өрбитініне әсер\nетуі мүмкін. Бірақ көмектесемін деп өзіңді қауіпке тігуге болмайды.\nҚауіпті әрекетті қолдама, агрессорды қолдама, жанжалды\nушықтырма, қорлайтын фото не видеоны таратпа.\n       Жауапты куәгер алдымен жағдайды бағалайды, қауіпсіз әрекет\nетеді және қажет болса ересек адамға немесе тиісті қызметке дереу\nхабарлайды.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 4-сабақ — Ұлы дала коды"}, "grade-11/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Төтенше жағдай кезіндегі қауіпсіз әрекет<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 414-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=414\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№5 сабақ         Төтенше жағдай кезіндегі қауіпсіз әрекет\nМақсаты          Білім алушылардың төтенше жағдайлар кезінде\n             дұрыс әрі қауіпсіз әрекет етуге дайындығын\n             қалыптастыру.\nМіндеттері        төтенше жағдайлардың негізгі түрлері туралы\n             түсінік қалыптастыру;\n                  төтенше жағдай кезіндегі алғашқы әрекет ету\n             алгоритмін бекіту;\n                  қауіп-қатерді бағалау, белгіленген қауіпсіздік\n             ережелерін сақтау және шұғыл көмекке дер кезінде\n             жүгіну дағдыларын дамыту.\n\n      Материалдар мен ресурстар\n      «Төтенше жағдайлардың негізгі түрлері» атты плакат немесе\nинфографика.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Әр секунд маңызды болатын жағдай» кейс-тапсырмасы\n      Оқу іс-шарасы өтіп жатқан кезде ғимаратта дабыл сигналы іске\nқосылады. Білім алушылардың бір тобы дүрбелеңге түсіп, бірден\nғимараттан шығуға тырысады, басқалары орнында қалып, нұсқауларды\nкүтеді, ал кейбірі болып жатқан жағдайды ұялы телефонына түсіре\nбастайды. Бұл ретте дабылдың шығу себебі туралы нақты ақпарат жоқ.\n      Педагогтің сұрақтары:\n            Жағдайдың қаншалықты қауіпті екенін қалай анықтауға\nболады?\n            Қандай әрекеттер қате болуы мүмкін?\n            Неліктен абдырап қалу және ойланбай әрекет ету қауіпті\nжағдайды ушықтыруы мүмкін?\n      Төтенше жағдайда адам қорқыныш пен алаңдаушылықты сезінуі\nмүмкін – бұл табиғи реакция. Ең бастысы – асығыс әрекет етпеу,\nқауіпсіздік ережелерін, хабарлау сигналдарын және жауапты\nтұлғалардың нұсқауларын басшылыққа алу.\n      II. Негізгі бөлім\n      «Төтенше жағдай дегеніміз не?» жаттығуы\n      Педагог түсіндіреді:\n\n       Төтенше жағдай – адамдардың өмірі мен денсаулығына,\nмүлікке немесе қоршаған ортаға қауіп төндіретін, қауіп төнуі мүмкін\nболатын және қауіпсіздікті қамтамасыз ету мен тиісті шараларды\nқабылдауды талап ететін қауіпті жағдай.\n      Қандай қауіпті жағдайларға тап болуымыз мүмкін?\n    өрт, түтін басу;\n    апат немесе ғимараттың қирауы;\n    қауіпті табиғи құбылыстар;\n    күдікті заттың табылуы;\n    эвакуациялауды қажет ететін жағдай;\n    адамдардың өмірі мен денсаулығына қауіп төндіретін басқа да\n      жағдайлар.\n      Білім алушылар өз болжамдары мен пікірлерін білдіреді.\n      Педагог      білім    алушыларға      тақырыпқа       қатысты\nбейнематериалды көруді ұсынады.\n      «БАҒАЛА – ӨЗІҢДІ ҚОРҒА – ӘРЕКЕТ ЕТ – ХАБАРЛА»\nалгоритмі\n      Бағала – қауіпті жағдайдың белгілеріне және ресми хабарлау\nсигналдарына назар аудар. Не болғанын анықтау үшін қауіп көзіне\nжақындама.\n      Өзіңді қорға – қауіпті аймақтан шық немесе нақты жағдайға\nарналған белгіленген әрекет ету алгоритміне сәйкес әрекет ет.\n      Әрекет ет – педагогтердің, білім беру ұйымы әкімшілігінің,\nнысан қызметкерлерінің және шұғыл қызметтердің нұсқауларын\nорында. Өзіңе және айналаңдағы адамдарға қосымша қауіп төндірме.\n      Хабарла – егер қауіп туралы жауапты тұлғалар әлі білмесе,\nересектерге немесе тиісті қызметке хабарла. Өмірге және денсаулыққа\nтікелей қауіп төнген жағдайда 112 нөміріне хабарлас.\n      Ескерту: әмбебап алгоритм арнайы қауіпсіздік ережелерінің\nорнын алмастырмайды. Өрт, жер сілкінісі, ғимараттың опырылу қаупі,\nкүдікті заттың табылуы және басқа да жағдайларда әрекет ету тәртібі\nәртүрлі болуы мүмкін.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін аяқтап,\nөз пікірін білдіруді ұсынады:\n    Бүгін мен төтенше жағдайда ең маңыздысы... екенін түсіндім.\n    Егер қауіп туындаса, мен...\n    Қауіпті күшейтуі мүмкін әрекеттер – бұл...\n    Мен ... есте сақтаймын.\n      Педагог атап көрсетеді:\n\n      -    Төтенше жағдайда адам қорқыныш, алаңдаушылық немесе\nабдырау сезімін бастан өткеруі мүмкін. Мұндай кезде асығыс әрекет\nетпеу маңызды: тікелей төнген қауіпті бағалау, белгіленген қауіпсіздік\nережелерін сақтау, ресми нұсқауларды орындау және дер кезінде\nкөмекке жүгіну қажет. Қауіп көзін өз бетіңше тексеруге немесе өзіңе\nжәне айналаңдағы адамдарға қауіп төндіруі мүмкін әрекеттерді\nжасауға болмайды.\n\n Қазақстан Республикасы Денсаулық\n сақтау министрлігі ұсынған қауіпсіздік\n сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 5-сабақ — Ұлы дала коды"}, "grade-11/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Қажу мен күйзелістің алдын алу<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 417-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=417\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ        Қажу мен күйзелістің алдын алу\nМақсаты         Білім алушылардың шамадан тыс қажу мен\n             күйзелістің белгілерін байқап, оқу мен демалыс тепе-\n             теңдігін    сақтай      отырып,       өз     әл-ауқатына\n             жауапкершілікпен қарау дағдыларын қалыптастыру.\nМіндеттері     – қажу мен күйзелістің негізгі белгілерін және олардың\n             алдын алу жолдарын түсіндіру;\n               – оқу жүктемесін жоспарлау, демалыс пен ұйқы\n             режимін сақтау дағдыларын дамыту;\n               – ұзақ уақыт бойы мазасыздық немесе шаршау\n             басылмаса, дер кезінде көмекке жүгінуге дағдыландыру.\n\n       Материалдар мен ресурстар\n       «Эмоционалдық күйзелістің алдын алудың 5 тәсілі» жаднамасы;\nшамадан тыс шаршау мен эмоционалдық күйзелістің белгілері\nжазылған карточкалар; «Менің ресурстарым» жаттығуына арналған\nпарақтар.\n       Сабақ барысы\n       I. Кіріспе бөлім\n       «Күш-қуатың сарқылғанда» кейс-тапсырмасы\n       Педагог:\n       – Он бірінші сынып білім алушысы қорытынды емтихандарға\nдайындалып жүр. Соңғы уақытта ол түнжарымға дейін сабақ оқиды, аз\nдемалады, дайындыққа көбірек уақыт бөлу үшін бұрын айналысқан\nістері мен достарымен кездесуден бас тартқан. Бірнеше аптадан кейін\nол өзінің тез шаршайтынын, тапсырмаларды орындауға зейін қою\nқиындағанын және әдеттегіге қарағанда жиі ашуланшақ болатынын\nбайқайды.\n       Қалай ойлайсыздар:\n       – Оның күн тәртібінде қандай өзгерістер болды?\n       – Қай әдеттері қажуды күшейтіп отыр?\n       – Оқу мен демалысты тең ұстау үшін нені өзгертуге болады?\n       Білім алушылар өз болжамдары мен пікірлерін білдіреді.\n       Педагог қорытынды жасайды:\n        Ұзақ уақыт бойы демалыссыз оқу адамның көңіл күйіне,\nзейініне және жұмыс қабілетіне әсер етуі мүмкін. Сондықтан шаршау\n\nмен күйзелістің алғашқы белгілерін елемей, күн тәртібін дер кезінде\nөзгерткен дұрыс.\n      Бүгін біз оқу мен демалыс арасындағы тепе-теңдікті қалай\nсақтауға болатынын және қандай жағдайда көмекке жүгіну керектігін\nқарастырамыз.\n      II. Негізгі бөлім\n      Ақпараттық блок\n      Кейде адам көп оқып, ұзақ уақыт демалмай немесе бірнеше\nміндетті қатар орындап жүргенде шаршағанын бірден байқамауы\nмүмкін. Ал ағза мен көңіл күйі біртіндеп белгі бере бастайды.\n      Мысалы:\n      – демалғаннан кейін де шаршау басылмайды;\n      – зейін қою қиындайды;\n      – бұрын оңай орындалған іске көбірек уақыт кетеді;\n      – ұйқы режимі өзгереді;\n      – ашулану немесе мазасыздану жиілейді;\n      – бұрын қызық болған істерге ынта азаяды.\n      Мұндай белгілердің біреуі байқалды екен деп өзіңе диагноз\nқоюға болмайды. Бірақ олар ұзақ уақыт сақталса, күн тәртібің мен\nжүктемеңе назар аударған дұрыс.\n      Есте сақта: демалыс – уақытты бос өткізу емес. Ұйқы, үзіліс,\nқозғалыс, таза ауада серуендеу, қызығушылыққа уақыт бөлу және\nжақын адамдармен араласу күш жинауға көмектеседі.\n      «Белгіні байқа – шешім таңда» жаттығуы\n      Педагог жағдаяттарды оқиды. Білім алушылар әр жағдайда\nадамның нені өзгерте алатынын ұсынады.\n      1-жағдаят\n      Оқушы бірнеше апта бойы кеш ұйықтап жүр. Таңертең тұруы\nқиындап, сабақта зейіні жиі бөлінеді.\n      2-жағдаят\n      Оқушы сабақтан, үй тапсырмасынан және қосымша сабақтардан\nбосамайды. Соңғы уақытта достарымен кездесуге де, өзі ұнататын\nістерге де уақыт бөлмейді.\n      3-жағдаят\n      Оқушы демалғаннан кейін де өзін шаршаңқы сезінеді. Ашулануы\nжиілеп, бұрын қызық болған істерге ынтасы төмендеген.\n      Педагог сұрайды:\n      – Қандай белгілерді байқадыңдар?\n      – Жүктемеде нені өзгертуге болады?\n      – Қалпына келу үшін не қосу керек?\n      – Қай кезде көмек сұраған дұрыс?\n\n       «Жүктеме – қалпына келу – қолдау» ережесі\n       Жүктемеңді бағала – оқу, қосымша сабақтар және басқа\nміндеттерің қанша уақыт пен күш алатынына назар аудар.\n       Демалысты жоспарла – ұйқыға, үзіліске, қозғалысқа және өзіңе\nұнайтын істерге уақыт қалдыр.\n       Өзгерістерді байқа – шаршау, ұйқының бұзылуы, ашушаңдық\nнемесе зейін қоюдың қиындауы ұзақ уақыт сақталса, оны елемеуге\nболмайды.\n       Көмек сұра – егер өзіңді ұзақ уақыт жайсыз сезінсең немесе\nшаршау күнделікті өміріңе кедергі келтіре бастаса, ата-анаңа, өзің\nсенетін ересек адамға, мектеп психологіне немесе медицина\nқызметкеріне айт.\n       Сондай-ақ Психологиялық қолдау орталығына немесе 111\nбайланыс орталығына жүгініп, кеңес пен көмек алуға болады. Кейде\nөзіңді мазалаған мәселе туралы біреумен сөйлесудің өзі жағдайды\nтүсінуге және одан шығудың жолын табуға көмектеседі.\n       Педагог білім алушыларға өз өңіріндегі Психологиялық қолдау\nорталығының байланыс деректерін қосымша береді.\n       Педагог білім алушыларға тақырыпқа қатысты постермен\nтанысуды ұсынады.\nhttps://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026г/\nМатериалы%20по%20УЛБ/Чек%20-%20листы/WhatsApp%20Image%2\n02026-08-28%20at%2015.20.29%20%282%29.jpeg?mt=1787912859000\n       III. Қорытынды бөлім\n       Педагог білім алушыларға өз қалауы бойынша төмендегі\nсөйлемдердің бірін аяқтауды ұсынады:\n        «Бүгін мен қалпына келудің ... екенін түсіндім».\n        «Шамадан тыс шаршау қаупін азайту үшін ... маңызды».\n        «Егер ұзақ уақыт бойы шаршау оқуым мен күнделікті өміріме\nкедергі келтірсе, мен ...».\n        «Күш-қуатты қалпына келтірудің бір тәсілі – ...».\n       Педагог:\n        Жүктеме мен демалысты кезектестіру, жеткілікті ұйқы және\nдер кезінде қалпына келу жұмысқа қабілеттілікті сақтауға көмектеседі.\nЕгер ұзақ уақытқа созылған шаршау немесе эмоционалдық ширығу\nкүнделікті өмірге кедергі келтірсе, бұл жағдаймен жалғыз қалмау\nмаңызды: өз жағдайың туралы сенімді ересек адамға айтып, мектеп\nпсихологіне немесе кеңес пен қолдау алу үшін 111 байланыс\nорталығына жүгінген дұрыс.\n\nҚазақстан Республикасының Жасанды\nинтеллект және цифрлық даму\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026г/\" target=\"_blank\" rel=\"noopener noreferrer\">https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026г/<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 6-сабақ — Ұлы дала коды"}, "grade-11/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Жасанды интеллект және цифрлық шешімдер үшін жауапкершілік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 420-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=420\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№7 сабақ          Жасанды интеллект және цифрлық шешімдер\n              үшін жауапкершілік\nМақсаты           Білім    алушылардың       жасанды    интеллект\n              құралдарын     қауіпсіз,   сыни    тұрғыдан    және\n              жауапкершілікпен         пайдалану      дағдыларын\n              қалыптастыру.\nМіндеттері        – жасанды интеллект арқылы жасалған жалған\n              немесе манипуляциялық контенттің негізгі белгілері\n              мен қауіптерін ажырата білуге үйрету;\n                  – цифрлық ақпаратты тексеру, жеке деректерді\n              қорғау және ЖИ құралдарын жауапкершілікпен\n              пайдалану дағдыларын дамыту;\n                  – ЖИ көмегімен жасалған немесе таратылған\n              контент үшін өзінің жауапкершілігін түсінуге және\n              өзгенің құқықтарын құрметтеуге дағдыландыру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Бұрын алаяқтық сипаттағы хабарламаларды мәтіндегі\nқателерден, сапасыз фотосуреттерден немесе нашар өңделген\nбейнематериалдардан ажыратуға болатын. Бүгінде жасанды интеллект\nкөмегімен шынайылыққа жанасатын суреттер, бейнематериалдар,\nдауыстық хабарламалар мен мәтіндер жасауға болады. Оларды\nқосымша тексерусіз түпнұсқадан ажырату тіпті қиын.\n      Педагогтің сұрағы:\n      – Неліктен қазіргі кезде интернеттегі ақпараттың шынайылығын\nтексеру бұрынғыдан да маңызды?\n      Білім алушылар өз нұсқаларын ұсынады.\n      Педагог қорытынды жасайды:\n      – Жасанды интеллектінің өзі – құрал. Алайда оның көмегімен\nжасалған контент адамдарды адастыру үшін пайдаланылуы мүмкін.\nСондықтан ақпараттың қаншалықты нанымды көрінетініне ғана мән\nбермей, шешім қабылдамас бұрын оның дереккөзін және\nшынайылығын тексеру керек.\n      II. Негізгі бөлім\n\n      «Сенуге бола ма?» жаттығуы\n      Педагог білім алушыларға төмендегі тұжырымдарды бағалауды\n(дұрыс не бұрыс тұжырым) ұсынады:\n      - Егер дауысы таныс адамның даусына толық ұқсаса,\nхабарламаны дәл сол адам жіберді деген сөз.\n      - Егер бейнематериал шынайы көрінсе, онда оқиға расымен\nболды деуге болады.\n      - Егер мәтінде көптеген нақты мәліметтер болса, ақпарат\nшынайы деген сөз.\n      - Жасанды интеллект шындыққа сәйкес келмейтін, бірақ өте\nнанымды контент жасай алады.\n      - Маңызды ақпаратты тәуелсіз әрі сенімді дереккөз арқылы\nтексеру қажет.\n      Тапсырма: қай тұжырымдармен келісетініңізді, ал қайсысымен\nкеліспейтініңізді анықтап, өз жауабыңызды түсіндіріңіздер.\n      Педагог қорытынды жасайды:\n      – Жасанды интеллект қарқынды дамып жатқан кезде контенттің\nшынайы көрінуі оның сенімді екенін білдірмейді. Негізгі ереже –\nасықпау, ақпараттың дереккөзін тексеру және маңызды мәліметтерді\nбасқа сенімді дереккөз арқылы растау.\n      «ТОҚТА – ТЕКСЕР – ӘРЕКЕТ ЕТ» алгоритмі\n      Тоқта – асығыстыққа, қорқынышқа байланысты әрекет етпе.\n      Тексер – ақпараттың дереккөзін анықтап, оны басқа сенімді арна\nарқылы раста.\n      Әрекет ет – тек тексеруден кейін ғана шешім қабылда: сілтемеге\nөту, деректерді жіберу, ақша аудару немесе контентті қайта тарату\nқажет пе, жоқ па – соны анықта.\n      Педагог білім алушыларға:\n      «Заң және тәртіп» қағидаты цифрлық ортада да\nқолданылады. Жасанды интеллектіні пайдалану адамның өз әрекеттері\nүшін жауапкершілігінен босатпайды. Егер технологиялар алаяқтық\nжасау, қорқыту, басқа адамдардың құқықтарын бұзу немесе өзге де\nқұқыққа қайшы әрекеттер үшін пайдаланылса, жауапкершілік нақты\nжағдайларды      ескере    отырып,    Қазақстан    Республикасының\nзаңнамасына сәйкес айқындалады.\n      Сондықтан цифрлық технологияларды жауапкершілікпен\nпайдалан, маңызды шешім қабылдамас бұрын ақпаратты тексер,\nсондай-ақ басқа адамдардың құқықтарын бұзуы мүмкін контентті\nжасама және таратпа.\n      III. Қорытынды бөлім\n\n     Педагог білім алушыларға төмендегі сөйлемді аяқтауды\nұсынады:\n     «Қауіпсіз цифрлық шешім дегеніміз – ... екенін түсіндім».\n     2–3 білім алушы өз жауаптарын ортаға салады.\n     Педагог қорытындысы:\n     – Жасанды интеллект көптеген жаңа мүмкіндік береді. Бірақ оны\nжалған ақпарат жасауға немесе адамдарды алдауға да қолдануы мүмкін.\nСондықтан цифрлық ортада ақпараттың шынайылығын тексеріп, жеке\nдеректеріңді қорғап, әр әрекетіңе жауапкершілікпен қара.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 7-сабақ — Ұлы дала коды"}, "grade-11/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Қылмыстық әрекетке тартудан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 423-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=423\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ          Қылмыстық әрекетке тартудан сақтану\nМақсаты           Білім алушылардың манипуляцияны және құқыққа\n               қайшы әрекетке тартуды ажырата білу дағдыларын\n               қалыптастыру\nМіндеттері        – қылмыстық әрекетке тарту кезінде қолданылатын\n               алдау, қысым және манипуляция тәсілдерін анықтай\n               білуге үйрету;\n                  – күмәнді ұсыныстарды бағалап, олардан қауіпсіз\n               бас тарту дағдыларын дамыту;\n                  – құқыққа қайшы әрекетке тарту қаупі туындағанда\n               сенім артатын ересек адамға немесе тиісті қызметке\n               дер кезінде жүгінуге дағдыландыру.\n\n      Сабақтың барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға:\n      -   Адамдардың көпшілігі құқыққа қайшы әрекеттерге қатысуды\nмақсат етпейді. Алайда қаскөйлер өз ұсыныстарының шынайы\nмақсатын бірден ашып айтпауы мүмкін. Олар пайда табуға уәде беру,\nасықтыру, қорқыту, сенімге кіру, қысым көрсету немесе адамды\nәртүрлі әрекеттерді орындауға біртіндеп тарту арқылы ықпал етеді.\n      Педагогтің сұрақтары:\n            Адам күмәнді ұсынысқа не себепті келісуі мүмкін?\n            Оның шешіміне қандай факторлар әсер етеді?\n      Білім алушылар ықтимал себептерді атайды:\n            тез ақша табуға деген ұмтылыс;\n            қорқыныш;\n            таныс адамға сену;\n            біреуге көмектескісі келу;\n            қызығушылық;\n            айналасындағылардың қысымы.\n      Педагог қорытынды жасайды:\n       Қаскөйлер адамның шешіміне әсер ету үшін қорқынышты,\nсенімді, ақша табуға деген ұмтылысты, басқа адамға көмектесу ниетін\nнемесе мақұлдауға деген қажеттілікті пайдалана алады. Сондықтан\nұсыныстың мазмұнына ғана емес, адамды асығыс әрі тексермей әрекет\nетуге итермелейтін қысым жасау тәсілдеріне де назар аудара білу\nмаңызды.\n      II. Негізгі бөлім\n      «Жағдаятты талдап көрейік» практикалық жаттығуы\n      Сынып үш топқа бөлінеді. Әр топқа бір жағдайдан ұсынылады.\n      1-жағдай. «Оңай табыс»\n\n      Мессенджерде мынадай хабарландыру пайда болады:\n      «Аптасына 100 000 теңгеден бастап табыс тап! Тәжірибе қажет\nемес. Барлығы заңды. Орын саны шектеулі. Дәл қазір жаз!»\n      Хабарландыруға жауап бергеннен кейін әкімші:\n      «Толық ақпаратты кейін айтамыз. Алдымен жабық чатқа қосыл»,\n– деп жауап береді.\n      Ұсыныстың ашық әрі қауіпсіз екеніне көз жеткізу үшін қандай\nақпарат жетіспейді?\n      2-жағдаят. Телефон арқылы жасалатын алаяқтық\n      Жоғары сынып оқушысына бейтаныс адам қоңырау шалады.\n      «Әкең жол апатына ұшырады. Қазір түсіндіруге уақыт жоқ.\nШұғыл түрде ақша аудар, әйтпесе салдары ауыр болады. Уақыт\nжоғалтпау үшін ешкімге қоңырау шалма».\n      3-жағдаят. Қаржылық пирамида\n      Танысы қосымша жұмыс істеуді ұсынады:\n      «Еш қиындығы жоқ. Әртүрлі жерден бірнеше сәлемдемені алып,\nоларды басқа адамдарға жеткізу керек. Ішінде не бар екенін білудің\nқажеті жоқ. Жақсы ақша төлейді. Ең бастысы – бұл жұмыс туралы\nешкімге айтпа».\n      Топтарға арналған тапсырма\n      Бір минут ішінде талқылап, сұрақтарға жауап беріңіздер:\n      1.    Нелер күдік туғызуы керек?\n      2.    Мақсаты өзіңнен жасырылған әрекеттерді орындауға неге\nкелісуге болмайды?\n      3.    Қандай шешім қауіпсіз болады?\n      Талқылаудан кейін топ өкілдері өз жауаптарын жариялайды.\n      Педагог жауаптарды тақтаға жазып отырады.\n      Педагог қорытынды жасайды\n      Манипуляция – басқа адамның мүддесі үшін оның шешіміне\nықпал ету мақсатында адамға жасырын немесе ашық түрде әсер ету.\nМысалы, қорқыныш, қысым, кінә сезімін тудыру, пайдаға уәде беру\nнемесе әдейі асығыстық жағдайын жасау арқылы жүзеге асырылуы\nмүмкін.\n      Құқыққа қайшы әрекетке тарту әрекеті бір қарағанда зиянсыз\nкөрінетін қарым-қатынастан немесе қарапайым тапсырмадан басталуы\nмүмкін. Ұсыныстың шынайы мақсаты жасырылуы мүмкін, кейін\nадамды қызықтыру үшін пайдаға уәде беру, қысым көрсету, қорқыту\nнемесе болған жағдайды құпия сақтауды талап ету сияқты тәсілдер\nқолданылуы ықтимал.\n      «ТОҚТА – ТЕКСЕР – ХАБАРЛА» алгоритмі\n      ТОҚТА\n\n      Бірден келіспе және қорқыныш, асығыстық немесе тез ақша табу\nтуралы уәденің әсерімен ешқандай әрекет жасама.\n      ТЕКСЕР\n      Ұсынысты кім жасап отырғанын, тапсырманың мәні неде екенін\nжәне оның заңды немесе заңсыз екенін анықта. Ақшаңды,\nқұжаттарыңды, банк деректеріңді және жеке аккаунттарыңа кіру\nмүмкіндігін ешкімге берме.\n      ХАБАРЛА\n      Егер ұсыныс қорқытуға, құпиялылық талабына, күмәнді\nәрекеттерге немесе заңды бұзуы мүмкін әрекеттерге байланысты болса,\nқарым-қатынасты тоқтат, хабарламаларды сақтап қой және сенімді\nересек адамға жүгін. Құқық бұзушылық белгілері байқалса, полицияға\n(102) хабарла.\n      Заң және тәртіп\n      Педагог білім алушыларға жүгінеді:\n      «Заң және тәртіп» қағидаты заң талаптарын сақтау және өз\nшешімдеріне жауапкершілікпен қарауды көздейді. Құқыққа қайшы\nәрекетке тартуға тырысқан кезде қаскөйлер тапсырманың шынайы\nмақсатын жасыруы, пайдаға уәде беруі, асығыстық сезімін туғызуы,\nқысым көрсетуі немесе қорқытуы мүмкін.\n      Егер тапсырманың мазмұны түсініксіз болса, сізден құпия\nсақтауды талап етсе немесе күмәнді әрекеттерді сыйақы үшін\nорындауды ұсынса, қауіпсіз шешім – бас тарту және ақпаратты тексеру.\n      Егер көмек, кеңес немесе қолдау қажет болса, 111 байланыс\nорталығына жүгінуге болады.\n      Құқық бұзушылық немесе қылмыс белгілері болған\nжағдайда, 102 нөмірі арқылы полицияға хабарлаңыз.\n      III. Қорытынды бөлім\n      Педагог қорытынды жасайды:\n      -     Қауіпті ұсыныс әрдайым бастапқыда қауіпті болып\nкөрінбейді. Тапсырманың жасырын мақсаты, оңай ақша табуға уәде\nберу, құпия сақтауды талап ету, қысым көрсету, қорқыту және\nтексермей әрекет етуге мәжбүрлеу – сақ болуға негіз болатын белгілер.\n      Қауіпсіз шешім – тоқтау, ақпаратты тексеру, күмәнді\nәрекеттерден бас тарту және дер кезінде көмекке жүгіну.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 8-сабақ — Ұлы дала коды"}, "grade-11/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Өрт кезіндегі қауіпсіздік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 426-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=426\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№9 сабақ         Өрт кезіндегі қауіпсіздік\nМақсаты          Өрт жағдайында қауіпсіз шешім қабылдауға\n             дайын болу дағдыларын қалыптастыру\nМіндеттері        тұрмыста және қоғамдық орындарда өрттің\n             шығу себептері туралы білімді жаңғырту;\n                  өрт пен түтін байқалған жағдайда әрекет ету\n             алгоритмін бекіту;\n                  өрт қаупін бағалау және әрекет етудің қауіпсіз\n             тәсілін таңдау дағдыларын дамыту.\n\n      Материалдар мен ресурстар:\n      Жағдаяттар жазылған карточкалар, «Өрт кезіндегі әрекет ету\nалгоритмі» жаднамасы, өрт қауіпсіздігі тақырыбындағы постер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог жағдаят ұсынады:\n      – Сабақтан кейін бірнеше білім алушы кабинетте қалады. Олар\nалдымен күйік иісін сезеді, содан кейін бірнеше құрылғы қосылған\nрозетканың маңынан түтін шыққанын байқайды.\n      Сұрақтар:\n      – Жағдай қай сәтте қауіпті болады?\n      – Алғашқы әрекетіңіз қандай болуы керек?\n      – Қандай әрекеттер қауіпті арттыруы мүмкін?\n      Білім алушылар өз нұсқаларын ұсынады.\n      Педагог қорытынды жасайды:\n      – Өрт кезінде алғашқыда дұрыс әрекет ету керек. Қауіпті\nжағдайды жылдам бағалап, ол туралы хабарлау және өзіңіз бен\nайналаңыздағы адамдарға қауіп төндіруі мүмкін әрекеттерді жасамау\nмаңызды. Бүгін осы әрекеттерге тоқталамыз.\n      II. Негізгі бөлім\n      «ХАБАРЛА – ЭВАКУАЦИЯЛАН – ТӘУЕКЕЛГЕ БАРМА»\nалгоритмі\n      ХАБАРЛА\n      Түтін немесе от байқағанда айналадағы адамдарға ескертіңіз:\nпедагогке, кезекші әкімшіге немесе басқа қызметкерге хабарлаңыз.\n\nҚажет болған жағдайда қолмен іске қосылатын өрт хабарлағышын (өрт\nдабылын) іске қосыңыз. 101 немесе 112 нөміріне қоңырау шалыңыз.\n      ЭВАКУАЦИЯЛАН\n      Кідірмей, ең жақын қауіпсіз шығу жолына қарай қозғалыңыз.\nЭвакуация      жоспарын      және     жасыл     түсті «Шығу» белгілерін\nбасшылыққа алыңыз. Лифтіні пайдаланбаңыз, заттарыңызды алу үшін\nкері қайтпаңыз. Педагогтердің, эвакуацияға жауапты тұлғалардың\nжәне төтенше жағдайлар қызметі қызметкерлерінің нұсқауларын\nорындаңыз.\n      ТӘУЕКЕЛГЕ БАРМА\n      Отқа және қою түтінді жерлерге жақындамаңыз. Өміріңізге қауіп\nтөнуі мүмкін болса, жеке басыңызға қауіп төндіретін әрекеттерге\nбармаңыз немесе өртті жалаң қолмен сөндіруге тырыспаңыз.\nБасқаларға өзіңізге қауіп төндірмейтін жағдайда ғана көмектесіңіз.\nБіреуге көмек қажет болса, бұл туралы ересектерге немесе\nқұтқарушыларға хабарлаңыз.\n      «Бір минутта шешім қабылда» жаттығуы\n      Педагог білім алушыларға дұрыс және қауіпті әрекеттерді\nажыратуды ұсынады:\n            қою түтіннің шығу көзін өз бетінше іздеу;\n            айналадағы адамдарға ескерту;\n            жауапты ересек адамға хабарлау;\n            болып жатқан жағдайды телефонға түсіру;\n            ғимараттан тезірек шығу үшін лифтіні пайдалану;\n            эвакуациялық шығу жолына қарай қозғалу;\n            қалып қойған заттарды алу үшін кері қайту;\n            егер өрт туралы әлі хабарланбаған болса, 101 немесе 112\nнөміріне қоңырау шалу.\n      Білім алушылар өз таңдауын түсіндіреді.\n      Педагог атап көрсетеді:\n      – Өрт кезінде басты басымдық – адамдардың өмірі мен\nқауіпсіздігі. Өртті видеоға түсіруге, заттарды алуға немесе өрттің шығу\nсебебін өз бетіңізше анықтауға уақыт жұмсамаңыз.\n      Педагог       білім    алушыларға       тақырыпқа       қатысты\nбейнематериалмен танысуды ұсынады.\n      https://www.youtube.com/watch?v=hH_WhoDXIzU&amp;list=PLA5eCS\nY2FeoQLLocS-IEuEG9KjOrJzvPM&amp;index=25\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемді аяқтауды ұсынады:\n      – Егер мен өрт белгілерін бірінші болып байқасам,...\n      – Өрт жағдайындағы менің әрекетім...\n\n      2–3 білім алушы өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n      - Өрттің алдын алу үшін отты, электр құралдарын қауіпсіз\nпайдаланып, ақау белгілерін елемеуге болмайды. Өрт шықса, алдымен\nқауіпті бағала, дереу хабарла және қауіпсіз жерге шық. Заттарыңды алу,\nвидеоға түсіру немесе өртті өз бетіңше сөндіру үшін өмірің мен\nденсаулығыңды қатерге тікпе.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=hH_WhoDXIzU&amp;list=PLA5eCS\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=hH_WhoDXIzU&amp;list=PLA5eCS<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 9-сабақ — Ұлы дала коды"}, "grade-11/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Күмәнді табыс пен дропперліктен сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 429-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=429\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ         Күмәнді табыс пен дропперліктен сақтану\nМақсаты           Білім   алушылардың        күмәнді     қаржылық\n              ұсыныстар мен дропперлік белгілерін ажыратып, банк\n              деректерін қорғау және қауіпсіз шешім қабылдау\n              дағдыларын қалыптастыру.\nМіндеттері        – дропперлік пен күмәнді ақша аударымдарына\n              тартудың негізгі белгілерін анықтай білуге үйрету;\n                  – банк картасы, шот деректері мен құпия\n              ақпаратты қауіпсіз пайдалану дағдыларын дамыту;\n                  – күмәнді қаржылық ұсыныстардан бас тартып,\n              қажет жағдайда ересек адамға, банкке немесе тиісті\n              қызметке дер кезінде жүгінуге дағдыландыру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог жағдаят ұсынады:\n      -   Түлекке қосымша жұмыс істеу туралы ұсыныс түседі. Оған өз\nбанк шотының деректемелерін ақша қабылдау үшін беріп, кейін түскен\nсоманы басқа шотқа аударғаны үшін тез арада сыйақы төленетіні уәде\nетіледі. Оған: «Ешқандай қиындық та, заңсыздық та жоқ, сен тек төлем\nжасауға көмектесесің», – деп сендіреді.\n      Педагогтің сұрақтары:\n            Бұл ұсыныстың қандай тұстары күдік туғызуы керек?\n            Жас адам не себепті келісуі мүмкін?\n            Қай сәтте бас тарту қажет?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог қорытынды жасайды:\n      - Алаяқтар қаржылық схемаға қатысуды қарапайым қосымша\nжұмыс ретінде көрсетуі мүмкін. Олар тез ақша табуға уәде беріп,\nтәуекелдерді елеусіз етіп көрсетуі және адамды одан тек ақша\nқабылдау, аудару немесе қолма-қол ақша шешіп алу талап етілетініне\nсендіруі мүмкін. Сондықтан сізге сыйақының нақты қандай әрекет\nүшін ұсынылып отырғанын түсіну маңызды.\n      II. Негізгі бөлім\n      Қаржылық алаяқтық схемаларға тартудың ең көп таралған\nтәсілдері:\n\n            оңай ақша табуға уәде беру;\n            асығыстық сезімін туғызу («дәл қазір шешім қабылда»);\n            «бұл – заңды» деп сендіру;\n            «мұны көп адам жасайды» деген сөздерді қолдану;\n            жұмыс туралы ешкімге айтпауды өтіну;\n            өзіңіздің банк шотыңызды немесе төлем құралыңызды\nпайдаланып, басқа біреудің ақшасын қабылдауды, қолма-қол ақшаға\nайналдыруды, аударуды ұсыну.\n      Педагог атап көрсетеді:\n      - Егер сізге сыйақы үшін өзіңіздің банк шотыңызды немесе\nтөлем құралыңызды басқа адамдардың ақшасына қатысты операциялар\nжасау үшін пайдалануды ұсынса, бас тартып, ұсыныстың заңдылығы\nанықталғанға дейін ешқандай операция жасамау қажет.\n      «Келісім бермес бұрын қойылатын үш сұрақ» практикалық\nережесі\n      1. Жұмысты кім ұсынып отырғанын және маған нақты не үшін\nақы төленетінін түсінемін бе?\n      2. Маған өз шотым немесе төлем құралым арқылы басқа біреудің\nақшасын қабылдауды, қолма-қол ақшаға айналдыруды немесе\nаударуды ұсынбай ма?\n      3. Бұл жұмыстың заңдылығын тексере аламын ба және оны ата-\nанаммен немесе басқа сенімді ересек адаммен ашық талқылай аламын\nба?\n      Егер жұмыстың мазмұны жасырылса, өз банк шотыңызды немесе\nтөлем құралыңызды басқа адамдардың қаржылық операциялары үшін\nпайдалануды талап етсе немесе бұл жұмысты басқа адамдармен\nталқылауға тыйым салса, мұндай ұсынысқа келісуге болмайды.\n      Педагог       білім    алушыларға         тақырыпқа   қатысты\nбейнематериалмен танысуды ұсынады.\n      https://drive.google.com/file/d/1H8lfT5i-\nMiI9cgvzPPkydlb2imhaLVA9/view?usp=sharing\n\n      Педагог білім алушыларға жүгінеді:\n     – Адам алаяқтыққа қатысуды жоспарламаған болса да, өзінің\nбанк картасын немесе шотын басқа біреудің ақшасын аудару үшін\nпайдалану ауыр құқықтық салдарға әкеп соғуы мүмкін.\n     Қазақстан Республикасының Қылмыстық кодексінде банк\nшотына, төлем құралына немесе сәйкестендіру құралына\nқолжетімділікті үшінші тұлғаларға заңсыз беру, сондай-ақ сыйақы\nүшін немесе сыйақы алу мақсатында үшінші тұлғалардың мүддесі үшін\nтөлемдер мен ақша аударымдарын жүзеге асырғаны үшін қылмыстық\n\nжауаптылық көзделген. Қылмыстық әрекеттің сипаты мен ауырлығына\nқарай мүлікті тәркілей отырып, 7 жылға дейін бас бостандығынан\nайыруға дейінгі жаза көзделуі мүмкін.\n      Сондықтан «Заң және тәртіп» қағидатын сақтау маңызды:\nбанк картаңызды, шот деректемелеріңізді, PIN-кодты, CVV-кодты\nжәне SMS-кодтарды басқа адамдарға бермеңіз әрі күмәнді қаржылық\nоперацияларды жасауға келіспеңіз.\n      III. Қорытынды бөлім\n      Педагог сұрақ қояды:\n      – Егер сізге осындай ұсыныс түссе, не істеу керек?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог қорытындылайды:\n      Егер ұсыныс күмән туғызса, мына әрекеттерді орындау қажет:\n           ұсынысқа қатысудан бас тарту;\n           банк картасын, шот деректемелерін, PIN-кодты, CVV-\nкодты және SMS-кодтарды басқа адамдарға бермеу;\n           жағдайды ата-анамен немесе басқа сенімді ересек адаммен\nталқылау;\n           қажет болған жағдайда кеңес және көмек алу үшін 111\nбайланыс орталығына жүгіну;\n           алаяқтық белгілері байқалса, 102 нөмірі арқылы полицияға\nхабарлау.\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n           Бүгін мен қауіпті табысты ... белгілерінен тануға\nболатынын түсіндім.\n           Егер маған өз банк шотымды басқа біреудің ақша\nаударымдары үшін пайдалануды ұсынса, мен...\n           Қосымша жұмысқа келісім бермес бұрын, мен міндетті\nтүрде...\n      2–3 білім алушы (қалауы бойынша) өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n       Қауіпті табыс қарапайым әрі тиімді қосымша жұмыс сияқты\nкөрінуі мүмкін. Тәуекелдің негізгі белгісі – өзіңіздің банк шотыңызды\nнемесе төлем құралыңызды басқа адамдардың ақшасына қатысты\nоперациялар жасау үшін пайдалануды ұсыну. Мәнін түсінбейтін\nәрекеттерді жасауға келіспеңіз. Ұсынысты тексеріңіз, төлем\nдеректеріңізді қорғаңыз және өз шотыңызды пайдаланып жасалған\nқаржылық әрекеттердің ауыр құқықтық салдарға әкеп соғуы мүмкін\nекенін есте сақтаңыз.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1H8lfT5i-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1H8lfT5i-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 10-сабақ — Ұлы дала коды"}, "grade-11/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Жұмысқа орналасудағы алаяқтықтан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 432-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=432\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№11 сабақ    Жұмысқа орналасудағы алаяқтықтан сақтану\nМақсаты      Білім алушылардың жұмысқа орналасу кезінде\n           алаяқтық пен күмәнді ұсыныстарды ажыратып, өз еңбек\n           құқықтарын ескере отырып қауіпсіз шешім қабылдау\n           дағдыларын қалыптастыру.\nМіндеттері   – күмәнді бос жұмыс орындары мен күмәнді жұмыс\n           берушінің негізгі белгілерін анықтай білуге үйрету;\n             – жұмыс шарттарын, жұмыс беруші туралы\n           ақпаратты және ұсыныстың заңдылығын тексеру\n           дағдыларын дамыту;\n             – жеке деректерін, ақшасын және еңбек құқықтарын\n           қорғап, күмәнді жағдайда дер кезінде көмекке жүгінуге\n           дағдыландыру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      1. «Мен армандаған жұмыс» кейс-тапсырмасы\n      Педагог білім алушыларға жағдаят ұсынады.\n      Түлекке әлеуметтік желі арқылы мынадай хабарлама келеді:\n      «Айына 200 000 теңгеден бастап табыс. Тәжірибе қажет емес.\nИкемді жұмыс кестесі. Екі бос орын ғана қалды! Алдымен тіркеу\nжарнасын төлеу, жеке куәліктің фотосын жіберу және бүгін\nкелісіміңізді растау қажет».\n      Педагогтің сұрақтары:\n            Бұл ұсыныстың қандай тұсы тартымды көрінеді?\n            Қандай жайттар күмән тудырады?\n            Жұмыс беруші шешім қабылдауға неге асықтырады?\n            Бірден келісуге бола ма? Неліктен?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог қорытынды жасайды.\n      Жоғары табыс уәдесі, асықтыру, «тіркеу» үшін ақы төлеуді\nнемесе жеке құжаттарды ұсынуды сұрау – алаяқтық сипаттағы бос\nжұмыс орындарының кең таралған белгілері. Қауіпсіз қосымша жұмыс\nәрдайым жұмыс берушіні тексеруден басталады.\n      II. Негізгі бөлім\n      Педагог:\n\n      – Егер жұмыс беруші ақша төлеуді талап етсе, жұмыс шарттарын\nжасырса немесе өзіңіздің банк картаңызды пайдалануды ұсынса,\nмұндай ұсыныстан бас тарт.\n      «Бос жұмыс орындарын сараптау» іскерлік ойыны\n      Сынып 3–4 шағын топқа бөлінеді.\n      Әр топқа бір карточкадан беріледі.\n      №1 бос жұмыс орны\n      Курьер\n      Ресми түрде жұмысқа қабылдау. Ақша орындалған жұмыстан\nкейін төленеді. Әңгімелесу компания кеңсесінде өткізіледі.\n      №2 бос жұмыс орны\n      Қашықтан жұмыс\n      Табысқа кепілдік беріледі. Жұмысты бастау үшін тіркеу ақысын\nтөлеу қажет.\n      №3 бос жұмыс орны\n      Әкімшінің көмекшісі\n      Жұмыс беруші еңбек шартын жасайды, нұсқама жүргізеді және\nміндеттерді егжей-тегжейлі түсіндіреді.\n      №4 бос жұмыс орны\n      Қаржылық көмекші\n      Үлкен табыс. Клиенттердің ақша қаражатын аудару үшін жеке\nбанк картасын пайдалану қажет.\n      Тапсырма\n      Қорытынды дайындаңыздар.\n            Бұл бос жұмыс орны қауіпсіз бе?\n            Қандай тәуекел белгілерін байқадыңыздар?\n            Жұмыс берушіге қандай сұрақтар қойған жөн?\n            Сіздің қорытындыңыз қандай?\n      Әр топ өз жауабын мына сөздермен аяқтайды:\n      «Біздің қорытындымыз: қауіпсіз / тексеруді қажет етеді / тәуекелі\nжоғары».\n      Педагог қорытынды жасайды.\n       Жалақысы жоғары кез келген бос жұмыс орны қауіпсіз бола\nбермейді. Сенімді жұмыс беруші жұмысқа орналасу үшін ақша талап\nетпейді, жұмыс шарттарын жасырмайды және күмәнді қаржылық\nоперацияларды орындауды ұсынбайды.\n      Педагог       білім    алушыларға      тақырыпқа       қатысты\nбейнематериалмен танысуды ұсынады.\n      https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj\nVOYfcO/view?usp=sharing\n\n      Педагог білім алушыларға Қазақстан Республикасының\nЕңбек кодексіндегі нормаларды еске түсіруді ұсынады.\n      Сыныпқа арналған сұрақтар:\n           Әдетте, неше жастан бастап ресми түрде жұмыс істеуге\nболады?\n           14–16 жастағы жасөспірімдер аптасына қанша сағат жұмыс\nістей алады?\n           Ал 16–18 жастағылар ше?\n           Кәмелетке толмағандарды түнгі немесе үстеме жұмысқа\nтартуға бола ма?\n      Білім алушылар жауап береді.\n      Педагог толықтырады:\n      Қазақстан Республикасының Еңбек кодексінде:\n           жалпы ереже бойынша, еңбек шарты 16 жастан\nбастап жасалады;\n           14 жастан бастап оқудан бос уақытта жеңіл жұмыс істеуге\nрұқсат етіледі;\n           жұмыс уақытының ұзақтығы:\n           14–16 жастағы жұмыскерлер үшін – аптасына 24 сағатқа\nдейін;\n           16–18 жастағы жұмыскерлер үшін – аптасына 36 сағатқа\nдейін;\n           кәмелетке толмағандарды ауыр, зиянды, қауіпті, түнгі\nжәне үстеме жұмыстарға тартуға тыйым салынады.\n      Педагог:\n      Егер жұмыс беруші сіздің құқықтарыңызды бұзса немесе заңсыз\nжұмыс ұсынса, қайда жүгінуге болады?\n      Білім алушылар өз жауаптарын ұсынады.\n      Педагог толықтырады:\n      Мына орындарға жүгінуге болады:\n           ата-анаңызға немесе басқа сенімді ересек адамға;\n           сынып жетекшісіне;\n           балалардың құқықтарын қорғау мәселелері бойынша 111\nбайланыс орталығына;\n           алаяқтық, бопсалау немесе басқа да құқыққа қайшы\nәрекеттер белгілері болған жағдайда, 102 нөмірі арқылы полицияға.\n      Педагог атап көрсетеді:\n      «Заң және тәртіп» қағидаты қауіпсіз қосымша жұмыстың\nзаңды, ресми түрде рәсімделген және Қазақстан Республикасының\nзаңнамасы талаптарына сәйкес болуын білдіреді.\n      III. Қорытынды бөлім\n\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n       Бүгін мен жұмысқа орналасар алдында ... маңызды екенін\nтүсіндім.\n       Егер жұмыс туралы ұсыныс тым күмәнді болып көрінсе, мен...\n       Енді мен міндетті түрде ... тексеремін.\n       Көмек қажет болса, мен ... жүгінемін.\n      2–3 білім алушы (қалауы бойынша) өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n      Қосымша жұмыс – алғашқы кәсіби тәжірибе жинақтауға,\nдербестікті арттыруға және қаржылық сауаттылықты дамытуға\nмүмкіндік береді. Алайда кез келген жұмыс ұсынысын сыни тұрғыдан\nбағалау қажет. Өз еңбек құқықтарыңызды білу, жұмысқа орналасу\nшарттарына мұқият қарау және алаяқтық белгілерін ажырата білу\nөзіңізді қорғауға және елеулі салдардың алдын алуға көмектеседі.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 11-сабақ — Ұлы дала коды"}, "grade-11/lesson-12.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>11-сынып · 12-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-11/index.html\">← 11-сынып тақырыптары<\/a><article><h2>Өз әрекетіңе жауапкершілікпен қарау<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 436-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=436\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№12 сабақ        Өз әрекетіңе жауапкершілікпен қарау\n\nМақсаты        Білім алушылардың әртүрлі өмірлік жағдайда өз\n           әрекеттерінің ықтимал салдарын бағалап, қауіпсіз әрі\n           жауапты шешім қабылдау дағдыларын қалыптастыру.\nМіндеттері     – жеке, психологиялық, цифрлық және қаржылық\n           қауіпсіздік бойынша алған білімдерін жүйелеу;\n               – әрекет етпес бұрын тәуекел мен ықтимал\n           салдарды бағалап, қауіпсіз шешім таңдау дағдыларын\n           дамыту;\n               – өз әрекетінің салдарына жауапкершілікпен қарап,\n           қажет жағдайда дер кезінде көмекке жүгінуге\n           дағдыландыру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Бұл оқиғалардың арасында қандай байланыс бар?»\nпроблемалық жағдаяты\n      Педагог жағдаят ұсынады:\n      Бір күннің ішінде төрт түрлі оқиға орын алды:\n            бір жасөспірім алаяқтарға SMS арқылы келген кодты\nбейтаныс адамға хабарлады;\n            екіншісі интернеттегі қауіпті челленджге қатысуға келісті;\n            үшіншісі сыныптасының буллингке ұшырағанын көрсе де,\nүндемей қалды;\n            төртіншісі эвакуацияның басталғаны туралы дабылды\nәзілдеп іске қосты.\n      Педагогтің сұрақтары:\n            Бұл жағдаяттарды не біріктіреді?\n            Әр жағдаятта қандай шешім тәуекелді арттырды?\n            Басқаша қалай әрекет етуге болар еді?\n            Жауапты шешім қандай салдардың алдын алуы мүмкін еді?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог қорытынды жасайды:\n      Бұл жағдаяттар қауіпсіздіктің әртүрлі салаларына қатысты,\nалайда олардың барлығында адамның қабылдаған шешімі оқиғаның\n\nодан әрі өрбуіне әсер етеді. Жауапкершілік жағдайды бағалай білуден,\nықтимал салдарлар туралы ойланудан және әрекет етудің қауіпсіз\nтәсілін таңдаудан басталады.\n      II. Негізгі бөлім\n      «Қауіпсіздік бағыты» қорытынды практикумы\n      Педагог тақтаға немесе экранға кесте орналастырады.\n                                                     Ол қандай\n   Қауіпсіздік        Ықтимал       Жауапты          жағдайдың\n      саласы           жағдаят       шешім          алдын алуға\n                                                    көмектеседі?\nЖеке қауіпсіздік     ?            ?               ?\nПсихологиялық        ?            ?               ?\nқауіпсіздік\nЦифрлық              ?            ?               ?\nқауіпсіздік\nҚаржылық             ?            ?               ?\nқауіпсіздік\nТөтенше              ?            ?               ?\nжағдайлар\n\n      Сынып бес шағын топқа бөлінеді. Әр топқа қауіпсіздіктің бір\nсаласы беріледі.\n      Топтарға арналған тапсырма\n      2 минут ішінде талқылаңыздар:\n      1.    Сіздердің салаларыңызда қандай қауіпті жағдаят туындауы\nмүмкін?\n      2.    Қандай шешім жауапты әрі қауіпсіз болады?\n      3.    Бұл шешім қандай салдардың алдын алуға көмектеседі?\n      Талқылаудан кейін топ өкілдері кезекпен кестені толтырады.\n      Ықтимал жауаптар\n      Жеке қауіпсіздік\n      Қауіпті танып-білу, қысымға берілмеу, тәуекелді әрекеттерден\nбас тарту және дер кезінде көмекке жүгіну.\n      Психологиялық қауіпсіздік\n      Жеке шекараны құрметтеу, буллинг пен қысым көрсетуді\nқолдамау, басқа адамға көмек қажет болған жағдайда бейжай қалмау.\n      Цифрлық қауіпсіздік\n      Ақпаратты жарияламас немесе қайта жібермес бұрын тексеру,\nжеке деректерді қорғау, асығыстықтың немесе қысымның әсерімен\nәрекет етпеу.\n      Қаржылық қауіпсіздік\n\n      Төлем деректері мен банк қосымшасына қолжетімділік\nдеректерін бермеу, күмәнді қаржылық операцияларға қатыспау, табыс\nтабуға қатысты ұсыныстарды тексеру.\n      Төтенше жағдайлар\n      Сабыр сақтау, жағдайды бағалау, жауапты тұлғалар мен төтенше\nжағдайлар қызметі қызметкерлерінің нұсқауларын орындау және дер\nкезінде көмекке жүгіну.\n      Педагог қорытынды жасайды:\n      Қауіпсіздіктің барлық саласында жауапты мінез-құлық үш\nқарапайым әрекеттен басталады:\n    жағдайды бағалау;\n    салдары туралы ойлану;\n    қауіпсіз шешім таңдау.\n      Дәл осы әрекеттер көптеген қауіпті жағдайлардың алдын алуға\nкөмектеседі.\n      «БАҒАЛА – ОЙЛАН – ӘРЕКЕТ ЕТ – ХАБАРЛА» алгоритмі\n      БАҒАЛА – не болып жатқанын және қандай қауіп бар екенін\nанықта.\n      ОЙЛАН – сенің шешімің қандай салдарға әкелуі мүмкін екенін\nойла.\n      ӘРЕКЕТ ЕТ – әрекет етудің қауіпсіз әрі заңды тәсілін таңда.\n      ХАБАРЛА – жағдайды өз бетіңше шеше алмасаң немесе қауіп\nтөнсе, дер кезінде көмекке жүгін.\n      Жауапкершілік жағдайды бағалай білу, өз шешіміңнің ықтимал\nсалдарын алдын ала болжай білу, қауіпсіз әрекет ету және қажет болған\nжағдайда дер кезінде көмекке жүгінуден басталады.\n      Педагог білім алушыларға жүгінеді:\n      «Заң және тәртіп» қағидаты адамның өз шешімдері мен іс-\nәрекеттері үшін жеке жауапкершілігінен басталады. Жауапты мінез-\nқұлық заң талаптарын сақтауды, басқа адамдардың құқықтарын\nқұрметтеуді, өз әрекеттерінің ықтимал салдарын бағалауды және\nқауіпсіздікке қатер төнген жағдайда көмекке жүгінуге дайын болуды\nбілдіреді.\n      Жауапты адам қауіпті жағдайға бейжай қарамайды, белгіленген\nережелерді сақтайды және дер кезінде көмекке жүгінеді.\n      Педагогтің сұрағы:\n      – Егер жауапты адам қауіпті жағдайға тап болса немесе оқиғаның\nкуәгері болса, не істеуі керек?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог қорытынды жасайды:\n\n      Егер балалардың құқықтарын қорғау мәселелері бойынша кеңес\nпен қолдау қажет болса – 111 байланыс орталығына жүгінуге\nболады.\n      Буллинг, зорлық-зомбылық, алаяқтық немесе басқа да құқық\nбұзушылық белгілері болған жағдайда – 102 нөмірі арқылы\nполицияға хабарласыңыз.\n      Төтенше жағдай немесе өмір мен денсаулыққа тікелей қауіп\nтөнген жағдайда – 112 бірыңғай жедел көмек нөміріне хабарласыңыз.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n           Мен үшін жауапкершілік – бұл...\n           Маңызды шешім қабылдар алдында мен...\n           Егер менің шешімім басқа адамның қауіпсіздігіне әсер етуі\nмүмкін болса, мен...\n           Қауіпсіздік ережелерінің ішінен ересек өмірде міндетті\nтүрде ұстанатыным...\n      Ересек өмір адамға көбірек дербестік береді, алайда онымен бірге\nөз шешімдері үшін жауапкершілік те арта түседі. Әрбір қауіпті\nжағдайды алдын ала болжау мүмкін емес, бірақ жауапкершілікпен\nәрекет етуді үйренуге болады: тәуекелді бағалау, салдары туралы\nойлану, заңды сақтау, қауіпсіз шешім таңдау және дер кезінде көмекке\nжүгіну.\n      Өз іс-әрекеті үшін жауапкершілік – адамның өзі жасайтын\nтаңдауынан басталады.\n\n                        АЛҒЫС\n     Әдістемелік ұсынымдардың авторлары осы әдістемелік\nұсынымдардың мазмұнын талқылауға және материалдарын әзірлеуге\nқатысқан мемлекеттік органдарға, ұйымдарға, сарапшылар мен\nмамандарға кәсіби қолдауы, сараптамалық ұсынымдары және осы\nәдістемелік ұсынымдардың мазмұнын жетілдіруге қосқан үлесі үшін\nшынайы алғысын білдіреді.\n\n     Қазақстан Республикасының Бас прокуратурасы\n\n     Қазақстандағы ЮНИСЕФ өкілдігі\n\n     Қазақстан Республикасының Ішкі істер министрлігі\n\n    Қазақстан      Республикасының         Төтенше         жағдайлар\nминистрлігі\n\n     Қазақстан Республикасының Денсаулық сақтау министрлігі\n\n     Қазақстан Республикасы Денсаулық сақтау министрлігінің\n«Ұлттық қоғамдық денсаулық сақтау орталығы» РМК\n\n     Қазақстан Республикасы Денсаулық сақтау министрлігінің\n«С. Қайырбекова атындағы Ұлттық қоғамдық денсаулық сақтау\nорталығы» ШЖҚ РМК\n\n    Қазақстан Республикасының Жасанды интеллект және\nцифрлық даму министрлігі\n\n    Қазақстан Республикасының Қаржы нарығын реттеу және\nдамыту агенттігі\n\n     Қазақстан   Республикасы   Оқу-ағарту           министрлігінің\n«Балаларды ерте дамыту институты» РММ\n\n     Ұсынылатын әдебиеттер мен электрондық ресурстар тізімі\n\n       1.     SAQ жобасы: мектеп оқушыларының қауіпсіз мінез-құлық\nмәдениетін дамыту: мұғалімдерге арналған оқу құралы. – Caravan of\nKnowledge; Ұлттық волонтерлік желі, 2024. – 143 б.\n       2.     «Заң және тәртіп» идеологемасы аясында 5–11 сынып\nоқушыларының құқықтық сауаттылығы. 1-шығарылым. Буллинг:\nқалай анықтауға, өзіңді қорғауға және көмек алуға болады: көрнекі оқу\nқұралы. – Қазақстан Республикасы Бас прокуратурасының жанындағы\nҚұқық қорғау органдары академиясы.\n       3.     Балалардың қауіпсіздігі және кәмелетке толмағандардың\nсуицидтік мінез-құлқының алдын алу мәселелеріне арналған ата-\nаналар жиналыстарын өткізу бойынша әдістемелік ұсынымдар. –\nАлматы: «Өркен» балалардың әл-ауқаты ұлттық ғылыми-практикалық\nинституты» КЕАҚ, 2026. – 128 б.\n       4.     Білім алушылар арасындағы зорлық-зомбылық пен өзіне-\nөзі зиян келтіру мінез-құлқын анықтау және алдын алу. Білім беру\nұйымдарының қызметкерлеріне арналған әдістемелік ұсынымдар. –\nАлматы: «Өркен» балалардың әл-ауқаты ұлттық ғылыми-практикалық\nинституты, 2026.\n       5.     Қазақстан         Республикасы    Төтенше    жағдайлар\nминистрлігінің YouTube арнасы.\n       https://www.youtube.com/channel/UC9Lk8S70ytRKyV2zahIHUSg\n       6. Instagram-страницы НАО «ННПИБД «Өркен» БӘАҰҒПИ\nКеАҚ Instagram-парақшалары\n       orken_qauipsizdik_sabaktary                                  -\nhttps://www.instagram.com/orken_qauipsizdik_sabaktary/\n       orken_instituty\n       https://www.instagram.com/orken_instituty/\n       7. https://orken-instituty.kz/kz\n\n«ӨРКЕН» БӘАҰҒПИ» КеАҚ<\/div><p><a href=\"https://www.youtube.com/channel/UC9Lk8S70ytRKyV2zahIHUSg\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/channel/UC9Lk8S70ytRKyV2zahIHUSg<\/a><\/p><p><a href=\"https://www.instagram.com/orken_qauipsizdik_sabaktary/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.instagram.com/orken_qauipsizdik_sabaktary/<\/a><\/p><p><a href=\"https://www.instagram.com/orken_instituty/\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.instagram.com/orken_instituty/<\/a><\/p><p><a href=\"https://orken-instituty.kz/kz\" target=\"_blank\" rel=\"noopener noreferrer\">https://orken-instituty.kz/kz<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "11-сынып · 12-сабақ — Ұлы дала коды"}};const HOME="grade-11/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
