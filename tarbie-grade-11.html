"false\">Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын. Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Отбасылық қолдау және дербес шешім»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Отбасы күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Үйдегі көрінбейтін еңбек ескерілмей, оқу мен демалыс уақыты тең бөлінбейді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қамқорлық қандай әрекеттен көрінеді? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Жеке мәліметті неге бөлісу міндетті емес? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Әртүрлі отбасыларды қалай құрметтейміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Келісім» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.\"></textarea><label for=\"reflection-1\">«Отбасылық қолдау және дербес шешім» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Келісім» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/P1700000689\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелік күндердің тізбесі</a> · Әділет АҚЖ. Мәтіні ашылып, тиісті мерекелік күндер тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t12\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t14\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t13", "title": "Отбасылық қолдау және дербес шешім | Тәрбие әлемі"}, "lesson/g11-t14": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Республика күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☀</span><span>11-сынып · 14/30 · 40 минут</span></div><h1>Отанға қызмет: жауапты қоғамдық шешім</h1><p>Республика күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Отанға қызмет: жауапты қоғамдық шешім» тақырыбы арқылы республика мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Ортақ игілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Республика күні елдің мемлекеттілігі мен ортақ болашағы туралы ойлануға мүмкіндік береді. Елге құрмет сөзбен де, қоғамдық мүлікті сақтау мен адамдарға сыйластық таныту арқылы да көрінеді. Әр адамның қауіпсіз, шамасына сай пайдалы іс жасауына болады.</p><p>Бүгінгі назарымыз: «Отанға қызмет: жауапты қоғамдық шешім». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді. Ойлану бағдары: Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау.</p><div class=\"concepts\"><span>Республика</span><span>Отан</span><span>Ортақ игілік</span><span>Жауапкершілік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Елге құрметімді күнделікті жауапты ісіммен көрсетемін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 25 қазан</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Қоғамдық ұсыныс тек орталықтың қажетіне бағытталып, шағын елді мекен ұмыт қалды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Барлық өңірге құрмет; әртүрлі қажеттілікті тыңдау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Патриоттық жоба атауымен рұқсатсыз нысан орнату ұсынылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ортақ мүлікті сақтау; келісілген заңды және қауіпсіз балама табу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Жоба ел жетістігін көрсету үшін дәлелсіз көрсеткіштер ұсынды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Шын және тексерілген дерек қолдану; білмегенді нақтылау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Қоғамдық бастаманың әсері тек қатысушылар саны арқылы бағаланды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолжетімді рөлдер; қамтылмаған адамдардың қажетін тыңдау; нақты пайдалы өзгерісті бағалау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Туған жерге пайдалы іс — кімге пайдасы бар?» картасын құрыңдар. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Республика күніне арналған қауіпсіз пайдалы бастама ұсыныңдар: мақсат, рөл, ресурс және нәтиже. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Елге құрметімді күнделікті жауапты ісіммен көрсетемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Менің елімдегі ізгі әрекет» атты ашықхат немесе шағын эссе жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Отанға құрмет қалай байқалады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Ортақ мүлікті неге сақтаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Өңірлердің ерекшелігін қалай сыйлаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Пайдалы бастаманы кіммен келісеміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Істің нәтижесін қалай бағалаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Елге құрметімді күнделікті жауапты ісіммен көрсетемін.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Елге құрметімді күнделікті жауапты ісіммен көрсетемін. Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Отанға қызмет: жауапты қоғамдық шешім»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Республика күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Елге құрметімді күнделікті жауапты ісіммен көрсетемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Отанға құрмет қалай байқалады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Өңірлердің ерекшелігін қалай сыйлаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Істің нәтижесін қалай бағалаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Ортақ игілік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Елге құрметімді күнделікті жауапты ісіммен көрсетемін.\"></textarea><label for=\"reflection-1\">«Отанға қызмет: жауапты қоғамдық шешім» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Елге құрметімді күнделікті жауапты ісіммен көрсетемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Ортақ игілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t13\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t15\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t14", "title": "Отанға қызмет: жауапты қоғамдық шешім | Тәрбие әлемі"}, "lesson/g11-t15": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Ұлттық валюта — теңге</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>₸</span><span>11-сынып · 15/30 · 40 минут</span></div><h1>Жеке бюджет және жауапты таңдау</h1><p>Ұлттық валюта — теңге</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Жеке бюджет және жауапты таңдау» тақырыбы арқылы теңге мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Қалау» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Теңге — Қазақстанның ұлттық валютасы. Ақшаны жоспарлау қажеттілік пен қалауды ажыратудан басталады. Оқу тапсырмасында тек ойдан шығарылған сома қолданылады. Жеке қаржы, банк картасының дерегі немесе құпия код сұралмайды.</p><p>Бүгінгі назарымыз: «Жеке бюджет және жауапты таңдау». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді. Ойлану бағдары: Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау.</p><div class=\"concepts\"><span>Теңге</span><span>Қажеттілік</span><span>Қалау</span><span>Бюджет</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Қажетімді ойлап, шартын тексеріп таңдаймын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 15 қараша</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Топқа қабылдау үшін белгілі қымбат өнім алу талап етілді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Адам құнын затпен өлшемеу; бас тарту; қолжетімді балама ұсыну.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Тегін сынақтан кейін ақылы жазылым басталатыны ұсақ мәтінмен берілді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ересекпен шартын тексеру; келісімсіз төлем жасамау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Банк атынан сөйлеген адам шұғыл растау кодын беруді талап етті.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кодты бермеу; әңгімені тоқтату; ресми арнаға сенімді ересекпен жүгіну.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Екі ұсыныстың бастапқы бағасы бірдей, бірақ қосымша төлемі әртүрлі.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Толық құнын, қажеттілікті және қолдану уақытын салыстыру.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ойдан шығарылған 1000 теңгені үш қағаз карточкаға бөліңдер: қажеттілік, жинақ, қалау. Нақты отбасылық ақша туралы айтпаңдар. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Мектеп көрмесінің ойдан шығарылған 10000 теңгелік жоспарын жасаңыздар. Шығын шегінен аспайтын үш басымдық таңдаңдар. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Қажетімді ойлап, шартын тексеріп таңдаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Сатып алар алдында үш сұрақ» жадынамасын жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қажеттілік пен қалау қалай ажыратылады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Бюджет неге көмектеседі? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Жарнама шешімге қалай әсер етеді? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Құпия төлем кодын неге бермейміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Екі ұсынысты қандай өлшеммен салыстырамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Қажетімді ойлап, шартын тексеріп таңдаймын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қажетімді ойлап, шартын тексеріп таңдаймын. Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Жеке бюджет және жауапты таңдау»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Ұлттық валюта — теңге» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қажетімді ойлап, шартын тексеріп таңдаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қажеттілік пен қалау қалай ажыратылады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Жарнама шешімге қалай әсер етеді? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Екі ұсынысты қандай өлшеммен салыстырамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Қалау» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қажетімді ойлап, шартын тексеріп таңдаймын.\"></textarea><label for=\"reflection-1\">«Жеке бюджет және жауапты таңдау» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қажетімді ойлап, шартын тексеріп таңдаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Қалау» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/P1700000689\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелік күндердің тізбесі</a> · Әділет АҚЖ. Мәтіні ашылып, тиісті мерекелік күндер тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t14\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t16\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t15", "title": "Жеке бюджет және жауапты таңдау | Тәрбие әлемі"}, "lesson/g11-t16": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Мемлекеттік рәміздер</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☀</span><span>11-сынып · 16/30 · 40 минут</span></div><h1>Мемлекеттік рәміздер: құрмет және азаматтық мәдениет</h1><p>Мемлекеттік рәміздер</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Мемлекеттік рәміздер: құрмет және азаматтық мәдениет» тақырыбы арқылы ту мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Әнұран» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Қазақстанның мемлекеттік рәміздері — Ту, Елтаңба және Әнұран. Олар елдің біртұтастығы мен мемлекеттілігін танытады. Рәміз туралы мәліметті ресми дереккөзден тексерген дұрыс. Қолдан жасалған оюды ресми рәміздің дәл көшірмесі деп таныстыруға болмайды.</p><p>Бүгінгі назарымыз: «Мемлекеттік рәміздер: құрмет және азаматтық мәдениет». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды. Ойлану бағдары: Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау.</p><div class=\"concepts\"><span>Ту</span><span>Елтаңба</span><span>Әнұран</span><span>Құрмет</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Рәмізді құрметтеймін, ресми деректі қолданамын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 4 маусым</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Қатысушының денсаулық не қолжетімділік ерекшелігі ескерілмей, рәсімде масқаралау болды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тәртіпті алдын ала сыпайы түсіндіру; адамды кемсітпеу; қолжетімді қатысуға жағдай жасау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Таныстырылымда дәлелсіз символдық жорамал ресми түсіндірме ретінде берілді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ақордадағы дерекпен салыстыру; болжам мен ресми фактіні ажырату.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Көрмедегі рәмізді пайдалану жоспары жауапты маманмен келісілмеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұқыпты қарау; қолдану мен сақтау мәселесін жауапты ересекпен нақтылау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Қоғамдық парақша ресми суретті белгісіз сайттан алып, нұсқасын тексермеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ресми дерекке сүйену; қайдан алынғанын көрсету; қате деректі түзету.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ту, Елтаңба, Әнұран атауларын олардың сөзбен берілген сипаттамасымен сәйкестендіріңдер. Ресми суретті дереккөзден қарауға болады. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Рәміз туралы деректі қалай тексереміз?» үш қадамдық көрме парағын құрыңдар. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Рәмізді құрметтеймін, ресми деректі қолданамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Рәмізді өзгертпей, оны қоршаған ұлттық оюлы жақтау эскизін жасаңдар. Эскизді ресми нұсқа деп атамаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Үш мемлекеттік рәміз қандай? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Оларға құрмет неден көрінеді? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Дұрыс суретті қайдан табамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Ресми факт пен жорамалды қалай ажыратамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Қате мәліметті қалай түзетеміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Рәмізді құрметтеймін, ресми деректі қолданамын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Рәмізді құрметтеймін, ресми деректі қолданамын. Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Мемлекеттік рәміздер: құрмет және азаматтық мәдениет»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Мемлекеттік рәміздер» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Рәмізді құрметтеймін, ресми деректі қолданамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Үш мемлекеттік рәміз қандай? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Дұрыс суретті қайдан табамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Қате мәліметті қалай түзетеміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Әнұран» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Рәмізді құрметтеймін, ресми деректі қолданамын.\"></textarea><label for=\"reflection-1\">«Мемлекеттік рәміздер: құрмет және азаматтық мәдениет» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Рәмізді құрметтеймін, ресми деректі қолданамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Әнұран» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://www.akorda.kz/kz/state_symbols/about_state_symbols\" target=\"_blank\" rel=\"noopener noreferrer\">Мемлекеттік рәміздер туралы</a> · Ақорда. Рәміздер туралы ресми бет ашылып тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t15\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t17\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t16", "title": "Мемлекеттік рәміздер: құрмет және азаматтық мәдениет | Тәрбие әлемі"}, "lesson/g11-t17": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Тәуелсіздік күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>✦</span><span>11-сынып · 17/30 · 40 минут</span></div><h1>Тәуелсіз елдің жауапты азаматы</h1><p>Тәуелсіздік күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Тәуелсіз елдің жауапты азаматы» тақырыбы арқылы тәуелсіздік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Еркіндік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Тәуелсіздік — елдің өз болашағын өзі айқындауымен байланысты ұғым. Бейбіт өмірді бағалау, тарихи деректі бұрмаламау және өзгенің қадірін сыйлау маңызды. Азаматтық жауапкершілік ортақ ортаға қамқорлықтан көрінеді.</p><p>Бүгінгі назарымыз: «Тәуелсіз елдің жауапты азаматы». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды. Ойлану бағдары: Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету.</p><div class=\"concepts\"><span>Тәуелсіздік</span><span>Бейбітшілік</span><span>Еркіндік</span><span>Жауапкершілік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Еркіндікті өзгенің қадірін сыйлап қолданамын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 16 желтоқсан</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Қоғамдық мәселедегі келіспеушілік жеке адамды айыптауға айналды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Еркін пікірді сыйлау; дәлелді талқылау; тұлғаны кемсітпеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Әлеуметтік желіде дереккөзсіз тарихи тұжырым кең тарады.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Дереккөзді тексеру; қатені түзету; болжамды белгілеу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Қоғамдық бастама әртүрлі адамдардың қатысу мүмкіндігін ескермеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолжетімді рөлдер мен ерікті қатысуды жоспарлау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Жастар ұсынысы шешімге ықпал ете алмайды деген пікір туды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Шамаға сай нақты іс; мектеп не жергілікті ортадағы келісілген ұсыныс жолы.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Еркін таңдау — өзгеге әсер — жауапты әрекет» байланысын бір мысалмен көрсетіңдер. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Бейбіт ортаға арналған ортақ игілік жобасын құрыңдар: проблема, шешім, келісім және нәтиже. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Еркіндікті өзгенің қадірін сыйлап қолданамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Еркіндікті жауапкершілікпен сақтаймын» қысқа эссе не суретті хат жазыңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Тәуелсіздік бізге неге қымбат? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Еркіндік пен жауапкершілік қалай байланысады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Тарихи ақпаратты неге тексереміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Пікірге құрмет қалай көрінеді? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Ортақ игілікке қандай үлес қосамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Еркіндікті өзгенің қадірін сыйлап қолданамын.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Еркіндікті өзгенің қадірін сыйлап қолданамын. Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Тәуелсіз елдің жауапты азаматы»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Тәуелсіздік күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Еркіндікті өзгенің қадірін сыйлап қолданамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Тәуелсіздік бізге неге қымбат? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Тарихи ақпаратты неге тексереміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Ортақ игілікке қандай үлес қосамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы
