ығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Суреттің бастапқы контекстін, күнін және дереккөзін салыстыру.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Бағалау тұжырымы өлшемі мен дерегінсіз зерттеу қорытындысы деп ұсынылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Факт пен пікірді ажырату; қандай өлшем мен дәлел қажет екенін сұрау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Қорқыныш туғызатын манипуляциялық мәтін тек бір тарапты көрсетеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тоқтау; толық мәтін мен балама сенімді деректі оқу; асықпай шешу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">ЖИ жасаған сенімді мәтінде ойдан шығарылған сілтеме мен дәйексөз бар.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Түпнұсқадан тексеру; табылмаған деректі факт деп бермеу; қатені түзету.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Ертең мектепте көрме болады» деген фактіні тексеру жолы мен «Бұл ең қызық көрме» пікірін салыстырыңдар. Нақты хабар деп қабылдамаңдар. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ақпаратты тексеру картасын құрыңдар: автор, күн, түпнұсқа, өзге сенімді дерек, тарату шешімі. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Екі ойдан шығарылған хабардың бірін тексеріп, «Неге әзірге таратпаймын?» түсіндірмесін жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Факт пен пікірдің айырмасы қандай? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Хабардың күнін неге қараймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Әдемі сурет дәлел бола ма? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>ЖИ жауабын қалай тексереміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Расталмаған ақпаратты неге таратпаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Мектептің ресми хабарын тексеру; расталмағанын таратпау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Алдымен тексеремін, содан кейін ғана бөлісемін. Мектептің ресми хабарын тексеру; расталмағанын таратпау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Ақпаратты таратудағы қоғамдық жауапкершілік»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Медиасауаттылық» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Көшірілген хабар ресми құжатқа ұқсайды, бірақ бастапқы жарияланымы жоқ.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Алдымен тексеремін, содан кейін ғана бөлісемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Факт пен пікірдің айырмасы қандай? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Әдемі сурет дәлел бола ма? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Расталмаған ақпаратты неге таратпаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Дереккөз» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Алдымен тексеремін, содан кейін ғана бөлісемін.\"></textarea><label for=\"reflection-1\">«Ақпаратты таратудағы қоғамдық жауапкершілік» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Алдымен тексеремін, содан кейін ғана бөлісемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Дереккөз» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t29\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><span class=\"muted\">Соңғы тақырып</span></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t30", "title": "Ақпаратты таратудағы қоғамдық жауапкершілік | Тәрбие әлемі"}, "home": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><span>11-сынып</span></nav><section class=\"class-hero\"><div><span class=\"eyebrow\">30 тақырып · 150 жағдаят</span><h1>11-сыныптың<br>тәрбие қоржыны</h1><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p></div><span class=\"class-num\" aria-hidden=\"true\">11</span></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/home?section=classes\">← Басты бет</a><a class=\"btn\" href=\"#/home?section=library\">Барлық сыныптан іздеу</a></div><section class=\"filterbox\" aria-label=\"Материалды іздеу\"><label class=\"searchlabel\">Тақырып немесе кілт сөз<input id=\"search\" type=\"search\" placeholder=\"Мысалы: достық, рәміздер, қауіпсіздік…\"></label><label>Сынып<select id=\"grade-filter\"><option value=\"\">Осы сынып</option><option value=\"1\">1-сынып</option><option value=\"2\">2-сынып</option><option value=\"3\">3-сынып</option><option value=\"4\">4-сынып</option><option value=\"5\">5-сынып</option><option value=\"6\">6-сынып</option><option value=\"7\">7-сынып</option><option value=\"8\">8-сынып</option><option value=\"9\">9-сынып</option><option value=\"10\">10-сынып</option><option value=\"11\">11-сынып</option></select></label><label>Бағыт<select id=\"direction-filter\"><option value=\"\">Барлық бағыт</option><option value=\"Адал азамат\">Адал азамат</option><option value=\"Таза Қазақстан\">Таза Қазақстан</option><option value=\"Заң мен тәртіп\">Заң мен тәртіп</option><option value=\"Ұлттық мұраны қорғайық\">Ұлттық мұраны қорғайық</option><option va window.TARBIE_CATALOG=[{"id": "g11-t01", "grade": 11, "topic": 1, "title": "Адал азамат: ұстанымнан қоғамдық іске", "direction": "Адал азамат", "icon": "✦", "search": "Адал азамат: ұстанымнан қоғамдық іске Адал азамат «Адал азамат: ұстанымнан қоғамдық іске» тақырыбы арқылы адалдық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Адалдық — өз әрекетің туралы шын айту және өзгенің еңбегін иемденбеу. Қателескен адам оны мойындап, түзете алады. Әділдік әр адамның үлесін және қажет қолдауын ескеруді талап етеді. Бүгінгі назарымыз: «Адал азамат: ұстанымнан қоғамдық іске». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Жобаға қажет дерегі бар табылған құрылғыны қолдану ұсынылды. Иесінің келісімі жоқ. Ойлану бағдары: Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу. Жобаға қажет дерегі бар табылған құрылғыны қолдану ұсынылды. Иесінің келісімі жоқ. Жоба есебіндегі қателікті бір ғана қатысушыға жабу команда беделін сақтайтындай көрінді. Қоғамдық бастаманың мерзімі өтуде. Уәде орындалмайтынын ұйымдастырушы біледі. ЖИ мен ашық деректі қолданған зерттеу жеке авторлық еңбек ретінде ұсынылмақ. Іріктеу талабын ұйымдастырушы өз танысына ыңғайлап өзгертті.", "path": "#/lesson/g11-t01"}, {"id": "g11-t02", "grade": 11, "topic": 2, "title": "Экологиялық мәдениет: таңдаудан қоғамдық бастамаға", "direction": "Таза Қазақстан", "icon": "♧", "search": "Экологиялық мәдениет: таңдаудан қоғамдық бастамаға Таза Қазақстан «Экологиялық мәдениет: таңдаудан қоғамдық бастамаға» тақырыбы арқылы тазалық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Таза орта күнделікті ұсақ әрекеттерден құралады. Қалдықты азайту, суды ысырап етпеу және ортақ орынды ұқыпты пайдалану маңызды. Тазалық жұмысы қауіпсіз болуы керек; шыны мен белгісіз затты балалар жинамайды. Бүгінгі назарымыз: «Экологиялық мәдениет: таңдаудан қоғамдық бастамаға». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Бір реттік безендіруге көп қаржы кетеді, бірақ қайта қолданылатын затты сақтау орны жоқ. Ойлану бағдары: Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру. Бір реттік безендіруге көп қаржы кетеді, бірақ қайта қолданылатын затты сақтау орны жоқ. Суды үнемдеу жобасының нәтижесі тек әдемі есеппен көрсетіліп, өлшем жасалмаған. Қоғамдық сенбілікте балаларға қауіпті қалдықты жинауды ұсынды. Ағаш отырғызу ұсынылды, бірақ кейінгі суару жауаптысы анықталмады. Экологиялық науқан үшін көп пластик сыйлық сатып алу ұсынылды.", "path": "#/lesson/g11-t02"}, {"id": "g11-t03", "grade": 11, "topic": 3, "title": "Заң мәдениеті: саналы қатысу", "direction": "Заң мен тәртіп", "icon": "⚖", "search": "Заң мәдениеті: саналы қатысу Заң мен тәртіп «Заң мәдениеті: саналы қатысу» тақырыбы арқылы ереже мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ереже адамдардың бірге қауіпсіз өмір сүруіне көмектеседі. Мектептің күнделікті ережесі мен мемлекет заңының қызметі бірдей емес. Түсініксіз талапты сұрақ қою және ұсыныс білдіру арқылы нақтылауға болады. Бұл сабақ нақты құқықтық кеңес бермейді. Бүгінгі назарымыз: «Заң мәдениеті: саналы қатысу». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Ұйымдастырушы кезек тәртібін өз тобына ғана қолданбайды. Ойлану бағдары: Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну. Ұйымдастырушы кезек тәртібін өз тобына ғана қолданбайды. Байқау өлшемі нәтижелер белгілі болған соң өзгертілді. Белсенділер нәтижеге тез жету үшін келісілген қауіпсіздік рәсімін айналып өткісі келеді. Мектеп талабын заң талабы деп түсіндірген хабарлама тарады, дереккөз жоқ. Ереже бұзылғанын тіркеу рәсімі адамдарды ұялтуға айналды.", "path": "#/lesson/g11-t03"}, {"id": "g11-t04", "grade": 11, "topic": 4, "title": "Ұлттық мұра: сақтау және заманауи таныстыру", "direction": "Ұлттық мұраны қорғайық", "icon": "❖", "search": "Ұлттық мұра: сақтау және заманауи таныстыру Ұлттық мұраны қорғайық «Ұлттық мұра: сақтау және заманауи таныстыру» тақырыбы арқылы мұра мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мұраға тіл, өнер, дәстүр, тарихи орын мен тұрмыстық бұйым жатады. Оны сақтау — бүлдірмеу, мағынасын білу және дерегін бұрмаламай жеткізу. Бір бұйым туралы әртүрлі әңгіме болуы мүмкін; авторын және дереккөзін нақтылау пайдалы. Бүгінгі назарымыз: «Ұлттық мұра: сақтау және заманауи таныстыру». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Көрме жобасында түпнұсқа затты тиісті қорғанышсыз тасымалдау жоспарланды. Ойлану бағдары: Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану. Көрме жобасында түпнұсқа затты тиісті қорғанышсыз тасымалдау жоспарланды. Цифрлық көрмеде дерексіз түсіндірме ұлттық дәстүрдің жалғыз нұсқасы ретінде берілді. Көптілді көрмеде бір тілдегі түсіндірме қате аударылды. Жобада шебер туындысының бейнесін коммерциялық өнімге рұқсатсыз пайдалану ұсынылды. Ауызша тарих жобасында жазбаны кейін алып тастауды сұраған адамның өтініші ескерілмеді.", "path": "#/lesson/g11-t04"}, {"id": "g11-t05", "grade": 11, "topic": 5, "title": "Достықтан қоғамдағы сенімге", "direction": "ДосболLIKE", "icon": "♡", "search": "Достықтан қоғамдағы сенімге ДосболLIKE «Достықтан қоғамдағы сенімге» тақырыбы арқылы достық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Достық тыңдау, сенім және ерікті қолдауға сүйенеді. Дос болу барлық ұсынысқа келісу дегенді білдірмейді. Өз шекараңды айтып, өзгенің таңдауын сыйлауға болады. Қауіп төнсе, мәселені жалғыз шешуге міндетті емессің. Бүгінгі назарымыз: «Достықтан қоғамдағы сенімге». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Жоба тобына бұрын танымайтын қатысушыны алуға қарсы пікір айтылды. Ойлану бағдары: Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу. Жоба тобына бұрын танымайтын қатысушыны алуға қарсы пікір айтылды. Серіктестер ортақ жобаның бағыты туралы екі түрлі ұстанымда. Досын қолдағысы келген адам оның жеке мәселесін топқа айтып қойды. Серіктес достықты алға тартып, адал емес шешімді қолдауды талап етті. Ортақ жобада беделді қатысушының ойы үнемі автоматты қабылданады.", "path": "#/lesson/g11-t05"}, {"id": "g11-t06", "grade": 11, "topic": 6, "title": "Қауіпсіз ортаға ортақ жауапкершілік", "direction": "Буллингтің алдын алу", "icon": "☂", "search": "Қауіпсіз ортаға ортақ жауапкершілік Буллингтің алдын алу «Қауіпсіз ортаға ортақ жауапкершілік» тақырыбы арқылы қолдау мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Біреуді қайта-қайта қорлау, қорқыту не шеттету — көмек қажет ететін жағдай. Оған ұшыраған бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтуға болады. Бір рет болған ауыр әрекетті де елемеуге болмайды. Бұл сабақта қорлау сөздері мен көріністері қайталанбайды. Бүгінгі назарымыз: «Қауіпсіз ортаға ортақ жауапкершілік». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді. Көмек сұраған адамға қарсы кек қайтару қаупі бар, орта қауіпсіз емес. Беделді топ қудалауды әзіл деп ақтап, куәгерлерден үнсіз қалуды сұрайды. Алдын алу шарасында нақты оқушының оқиғасын оның келісімінсіз жарияламақ. Алғашқы хабарға жауап болмады, оқушы қауіпсіздігі әлі қамтамасыз етілген жоқ.", "path": "#/lesson/g11-t06"}, {"id": "g11-t07", "grade": 11, "topic": 7, "title": "Қауіпсіз цифрлық орта құру", "direction": "Кибербуллингтің алдын алу", "icon": "▣", "search": "Қауіпсіз цифрлық орта құру Кибербуллингтің алдын алу «Қауіпсіз цифрлық орта құру» тақырыбы арқылы кибербуллинг мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Цифрлық ортада қорлау, қорқыту және келісімсіз контент тарату адамға зиян тигізеді. Жауап ретінде қорлаудың қажеті жоқ. Қауіпсіздік үшін сенімді ересекпен бірге шағымдану және бұғаттау мүмкіндігін қарастыруға болады. Куәгер ренжітетін материалды әрі қарай таратпайды. Бүгінгі назарымыз: «Қауіпсіз цифрлық орта құру». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр. Адамды кемсітетін өңделген бейнені «тексеру үшін» таратуды ұсынды. Біреудің атынан жасалған парақша оның беделіне зиян келтіреді. Киберқудалауға ұшыраған оқушы бар кінәні өзіне артып, көмек сұрамай жүр. Қудалаушы топ контентті өшіруді мәселе толық шешілді деп көрсетеді.", "path": "#/lesson/g11-t07"}, {"id": "g11-t08", "grade": 11, "topic": 8, "title": "Қауіпсіз орта: алдын алу және ортақ әрекет", "direction": "Қоғамдық ортадағы қауіпсіздік", "icon": "⌂", "search": "Қауіпсіз орта: алдын алу және ортақ әрекет Қоғамдық ортадағы қауіпсіздік «Қауіпсіз орта: алдын алу және ортақ әрекет» тақырыбы арқылы кездесу орны мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қоғамдық жерде алдын ала келісілген бағыт пен кездесу орны көмектеседі. Бейтаныс адамға еріп кетпеу, қауіпті затты ұстамау және жауапты қызметкерден көмек сұрау маңызды. Қауіпсіздікке күмән туса, сенімді ересекпен бірге шешім қабылда. Бүгінгі назарымыз: «Қауіпсіз орта: алдын алу және ортақ әрекет». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек. Ұйымдастырушы болып көрінген адам қатысушыны жеке орынға шақырды, өкілеті расталмаған. Шара еріктілеріне белгісіз пакетті орнынан жылжыту ұсынылды. Көрме ұйымдастырушылары қосымша орын үшін шығу жолын тарылтқысы келеді. Жоба үшін қауіпті орынға кіруді батылдық сынағы деп ұсынды.", "path": "#/lesson/g11-t08"}, {"id": "g11-t09", "grade": 11, "topic": 9, "title": "Құқықты құрметтеу: азаматтық шешім", "direction": "Құқықтық тәртіп", "icon": "⚑", "search": "Құқықты құрметтеу: азаматтық шешім Құқықтық тәртіп «Құқықты құрметтеу: азаматтық шешім» тақырыбы арқылы құқық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр баланың қадір-қасиеті мен қауіпсіздігі маңызды. Пікір айту кезінде өзгенің де сөзін тыңдау қажет. Құқықтар жақсы мінез үшін берілетін сыйлық емес. Келіспеушілікті тыныш талқылап, қажет болса сенімді ересектің көмегін сұраймыз. Бүгінгі назарымыз: «Құқықты құрметтеу: азаматтық шешім». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады. Жоба қатысушысының жеке мәліметі ортақ кестеге келісімсіз жарияланды. Шектеулі ресурсты бөлу кезінде бір топтың мүддесі ескерілмеді. Міндетін орындамаған адамды негізгі қолдаудан айыру керек деген пікір айтылды. Жауапсыз қалған өтінішті қайта жолдаудың дұрыс ретін топ іздеп отыр.", "path": "#/lesson/g11-t09"}, {"id": "g11-t10", "grade": 11, "topic": 10, "title": "Білімім — Отаныма: тұрақты әлеуметтік жоба", "direction": "Білімім — Отаныма!", "icon": "☀", "search": "Білімім — Отаныма: тұрақты әлеуметтік жоба Білімім — Отаныма! «Білімім — Отаныма: тұрақты әлеуметтік жоба» тақырыбы арқылы білім мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Білім адамға мәселені түсініп, пайдалы шешім табуға көмектеседі. Отанға қызмет ету күнделікті ортаға қамқорлықтан басталады. Пайдалы бастама біреудің нақты қажетіне жауап береді; оның нәтижесі тек суретпен емес, өзгеріспен бағаланады. Бүгінгі назарымыз: «Білімім — Отаныма: тұрақты әлеуметтік жоба». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Кітапханаға каталог ұсынылды, бірақ оны жаңартатын жауапты жоқ. Ойлану бағдары: Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу. Кітапханаға каталог ұсынылды, бірақ оны жаңартатын жауапты жоқ. Тәлімгерлік жобасы оқушының орнына жұмыс орындауға айналды. Экожобада өлшем орнына болжам нәтиже ретінде жазылды. Ақпараттық карта көруі әлсіз адамдарға қолайсыз болып шықты. Қоғамдық жоба табысы бір адамның жетістігі ретінде көрсетілді.", "path": "#/lesson/g11-t10"}, {"id": "g11-t11", "grade": 11, "topic": 11, "title": "Ұрпақтар сабақтастығына ортақ жоба", "direction": "Қарттар күні", "icon": "✿", "search": "Ұрпақтар сабақтастығына ортақ жоба Қарттар күні «Ұрпақтар сабақтастығына ортақ жоба» тақырыбы арқылы құрмет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Үлкенге құрмет — тыңдау, сыпайы сөйлесу және көмекті рұқсатпен ұсыну. Адамның жасына қарап оның мүмкіндігін болжауға болмайды. Қарт кісі де өз таңдауын өзі жасайды. Сұхбатты жазуға және жариялауға бөлек келісім қажет. Бүгінгі назарымыз: «Ұрпақтар сабақтастығына ортақ жоба». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Қамқорлық жобасы қызмет алушының таңдауын сұрамай шешім қабылдады. Ойлану бағдары: Көмекті сыпайы ұсыну; бас тартуды құрметтеу. Қамқорлық жобасы қызмет алушының таңдауын сұрамай шешім қабылдады. Ауызша тарих жобасында қатысушы тәжірибесі жоба жоспарына сыймай қалды. Қамқорлық есебіне адамның келісімінсіз фотосын қосу ұсынылды. Цифрлық қолдау бағдарламасы қатысушыларды жасына қарай бірдей әлсіз деп сипаттады. Ұрпақтар кездесуінің орны кей қонақтарға қолжетімсіз.", "path": "#/lesson/g11-t11"}, {"id": "g11-t12", "grade": 11, "topic": 12, "title": "Білім беру еңбегіне қоғамдық құрмет", "direction": "Ұстаздар күні", "icon": "✎", "search": "Білім беру еңбегіне қоғамдық құрмет Ұстаздар күні «Білім беру еңбегіне қоғамдық құрмет» тақырыбы арқылы ұстаз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ұстаз еңбегі сабақ түсіндірумен шектелмейді: ол дайындалады, кері байланыс береді, оқуға жағдай жасайды. Алғыс қымбат сыйлыққа тәуелді емес. Құрметпен сұрақ қоюға және түсінбегеніңді айтуға болады. Алғыс шарасына қатысу ерікті болуы керек. Бүгінгі назарымыз: «Білім беру еңбегіне қоғамдық құрмет». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Мерекелік сыйлыққа қатыспаған отбасылар тізімін жарияламақ. Ойлану бағдары: Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау. Мерекелік сыйлыққа қатыспаған отбасылар тізімін жарияламақ. Оқушы бағалау туралы келіспеушілікті қоғамдық айыптаумен шешкісі келеді. Бірлескен іс-шарада оқушы мен мұғалім міндеттері анық бөлінбеген. Жобаға қатысу оқушының жеке сенімі мен мүмкіндігін ескермей міндеттелді. Мерекелік бейнеде адамның жеке пікірі келісімсіз берілді.", "path": "#/lesson/g11-t12"}, {"id": "g11-t13", "grade": 11, "topic": 13, "title": "Отбасылық қолдау және дербес шешім", "direction": "Отбасы күні", "icon": "⌂", "search": "Отбасылық қолдау және дербес шешім Отбасы күні «Отбасылық қолдау және дербес шешім» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отбасы мен қамқор адамдар әртүрлі болады. Жылы сөз, қауіпсіз көмек және бір-бірін тыңдау жақындықты нығайтады. Үйдегі міндет жас пен мүмкіндікке сай бөлінеді. Отбасы туралы жеке мәліметті көпшілікке айтуға ешкім міндетті емес. Бүгінгі назарымыз: «Отбасылық қолдау және дербес шешім». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Үйдегі көрінбейтін еңбек ескерілмей, оқу мен демалыс уақыты тең бөлінбейді. Ойлану бағдары: Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу. Үйдегі көрінбейтін еңбек ескерілмей, оқу мен демалыс уақыты тең бөлінбейді. Оқу жоспары туралы отбасы пікірі мен оқушы мақсаты сәйкес келмеді. Жобаға отбасылық қаржы мен жеке хаттарды қосу ұсынылды. Отбасы мүшесінің жеке дерегі ортақ чатқа рұқсатсыз жіберілді. Іс-шара тапсырмалары әртүрлі отбасылардың қатысу мүмкіндігін шектеді.", "path": "#/lesson/g11-t13"}, {"id": "g11-t14", "grade": 11, "topic": 14, "title": "Отанға қызмет: жауапты қоғамдық шешім", "direction": "Республика күні", "icon": "☀", "search": "Отанға қызмет: жауапты қоғамдық шешім Республика күні «Отанға қызмет: жауапты қоғамдық шешім» тақырыбы арқылы республика мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Республика күні елдің мемлекеттілігі мен ортақ болашағы туралы ойлануға мүмкіндік береді. Елге құрмет сөзбен де, қоғамдық мүлікті сақтау мен адамдарға сыйластық таныту арқылы да көрінеді. Әр адамның қауіпсіз, шамасына сай пайдалы іс жасауына болады. Бүгінгі назарымыз: «Отанға қызмет: жауапты қоғамдық шешім». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді. Ойлану бағдары: Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау. Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді. Қоғамдық ұсыныс тек орталықтың қажетіне бағытталып, шағын елді мекен ұмыт қалды. Патриоттық жоба атауымен рұқсатсыз нысан орнату ұсынылды. Жоба ел жетістігін көрсету үшін дәлелсіз көрсеткіштер ұсынды. Қоғамдық бастаманың әсері тек қатысушылар саны арқылы бағаланды.", "path": "#/lesson/g11-t14"}, {"id": "g11-t15", "grade": 11, "topic": 15, "title": "Жеке бюджет және жауапты таңдау", "direction": "Ұлттық валюта — теңге", "icon": "₸", "search": "Жеке бюджет және жауапты таңдау Ұлттық валюта — теңге «Жеке бюджет және жауапты таңдау» тақырыбы арқылы теңге мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Теңге — Қазақстанның ұлттық валютасы. Ақшаны жоспарлау қажеттілік пен қалауды ажыратудан басталады. Оқу тапсырмасында тек ойдан шығарылған сома қолданылады. Жеке қаржы, банк картасының дерегі немесе құпия код сұралмайды. Бүгінгі назарымыз: «Жеке бюджет және жауапты таңдау». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді. Ойлану бағдары: Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау. Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді. Топқа қабылдау үшін белгілі қымбат өнім алу талап етілді. Тегін сынақтан кейін ақылы жазылым басталатыны ұсақ мәтінмен берілді. Банк атынан сөйлеген адам шұғыл растау кодын беруді талап етті. Екі ұсыныстың бастапқы бағасы бірдей, бірақ қосымша төлемі әртүрлі.", "path": "#/lesson/g11-t15"}, {"id": "g11-t16", "grade": 11, "topic": 16, "title": "Мемлекеттік рәміздер: құрмет және азаматтық мәдениет", "direction": "Мемлекеттік рәміздер", "icon": "☀", "search": "Мемлекеттік рәміздер: құрмет және азаматтық мәдениет Мемлекеттік рәміздер «Мемлекеттік рәміздер: құрмет және азаматтық мәдениет» тақырыбы арқылы ту мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қазақстанның мемлекеттік рәміздері — Ту, Елтаңба және Әнұран. Олар елдің біртұтастығы мен мемлекеттілігін танытады. Рәміз туралы мәліметті ресми дереккөзден тексерген дұрыс. Қолдан жасалған оюды ресми рәміздің дәл көшірмесі деп таныстыруға болмайды. Бүгінгі назарымыз: «Мемлекеттік рәміздер: құрмет және азаматтық мәдениет». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды. Ойлану бағдары: Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау. Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды. Қатысушының денсаулық не қолжетімділік ерекшелігі ескерілмей, рәсімде масқаралау болды. Таныстырылымда дәлелсіз символдық жорамал ресми түсіндірме ретінде берілді. Көрмедегі рәмізді пайдалану жоспары жауапты маманмен келісілмеді. Қоғамдық парақша ресми суретті белгісіз сайттан алып, нұсқасын тексермеді.", "path": "#/lesson/g11-t16"}, {"id": "g11-t17", "grade": 11, "topic": 17, "title": "Тәуелсіз елдің жауапты азаматы", "direction": "Тәуелсіздік күні", "icon": "✦", "search": "Тәуелсіз елдің жауапты азаматы Тәуелсіздік күні «Тәуелсіз елдің жауапты азаматы» тақырыбы арқылы тәуелсіздік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Тәуелсіздік — елдің өз болашағын өзі айқындауымен байланысты ұғым. Бейбіт өмірді бағалау, тарихи деректі бұрмаламау және өзгенің қадірін сыйлау маңызды. Азаматтық жауапкершілік ортақ ортаға қамқорлықтан көрінеді. Бүгінгі назарымыз: «Тәуелсіз елдің жауапты азаматы». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды. Ойлану бағдары: Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету. Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды. Қоғамдық мәселедегі келіспеушілік жеке адамды айыптауға айналды. Әлеуметтік желіде дереккөзсіз тарихи тұжырым кең тарады. Қоғамдық бастама әртүрлі адамдардың қатысу мүмкіндігін ескермеді. Жастар ұсынысы шешімге ықпал ете алмайды деген пікір туды.", "path": "#/lesson/g11-t17"}, {"id": "g11-t18", "grade": 11, "topic": 18, "title": "Кәсіби жоспар: мақсат пен балама", "direction": "Мамандық таңдау және еңбек", "icon": "⚙", "search": "Кәсіби жоспар: мақсат пен балама Мамандық таңдау және еңбек «Кәсіби жоспар: мақсат пен балама» тақырыбы арқылы еңбек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мамандық қоғамдағы белгілі бір қажеттілікке жауап береді. Таңдауда қызығушылық, дағды, оқу жолы және еңбек жағдайы ескеріледі. Кәсіпті адамның жынысына немесе отбасы жағдайына қарап шектеуге болмайды. Бірден түпкілікті шешімге келу міндетті емес. Бүгінгі назарымыз: «Кәсіби жоспар: мақсат пен балама». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді. Ойлану бағдары: Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу. Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді. Талапкер бағытын өз қызығушылығын тексермей, құрдасының таңдауына қарап бекітті. Мамандыққа жарамдылық туралы дәлелсіз әлеуметтік шектеу қойылды. Кәсіби сынамада оқушыға рұқсатсыз қауіпті жұмыс ұсынылды. Оқу орны туралы жарнамада қабылдау шарты мен толық шығын көрсетілмеді.", "path": "#/lesson/g11-t18"}, {"id": "g11-t19", "grade": 11, "topic": 19, "title": "Цифрлық тәуекелді саналы басқару", "direction": "Интернеттегі қауіпсіздік", "icon": "▤", "search": "Цифрлық тәуекелді саналы басқару Интернеттегі қауіпсіздік «Цифрлық тәуекелді саналы басқару» тақырыбы арқылы жеке дерек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жеке дерекке аты-жөн, мекенжай, құпиясөз және растау коды сияқты мәлімет жатады. Күдікті сілтеме мен шұғыл талапты бірден орындамай, ресми арнадан тексерген дұрыс. Сабақта нақты құпиясөз жасалмайды және ешкімнің аккаунты ашылмайды. Бүгінгі назарымыз: «Цифрлық тәуекелді саналы басқару». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды. Ойлану бағдары: Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды. Таныс ұйымның атына ұқсас домен төлем не код енгізуді талап етті. Топ әр сервисте бір құпиясөз қолдануды ыңғайлы деп таңдады. Қосымша деректі үшінші тарапқа беру шартын түсініксіз жазды. Желіде ғана танитын адам өз тұлғасын растамай жеке кездесуді талап етті.", "path": "#/lesson/g11-t19"}, {"id": "g11-t20", "grade": 11, "topic": 20, "title": "Ізгілікті тұрақты әрекетке айналдыру", "direction": "Алғыс айту күні", "icon": "✿", "search": "Ізгілікті тұрақты әрекетке айналдыру Алғыс айту күні «Ізгілікті тұрақты әрекетке айналдыру» тақырыбы арқылы алғыс мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Алғыс нақты көмекті байқап, оның әсерін айту арқылы шынайы болады. «Көмектескенің үшін рақмет» деген сөздің өзі маңызды. Алғыс міндетті сыйлық немесе жауап қызмет талап етпейді. Күнделікті байқалмайтын еңбекті де бағалауға болады. Бүгінгі назарымыз: «Ізгілікті тұрақты әрекетке айналдыру». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету. Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді. Құрмет тізімі тек көпшілікке танымал адамдардан құралды. Серіктес бұрынғы көмегі үшін этикалық емес шешімге қолдау талап етті. Жобаға алғыс айтуды міндетті жария әрекетпен өлшеу ұсынылды. Бюджеті жоқ қатысушыларды мерекелік шарадан шеттету қаупі туды.", "path": "#/lesson/g11-t20"}, {"id": "g11-t21", "grade": 11, "topic": 21, "title": "Ризашылықтан күнделікті серіктестікке", "direction": "Аналар мерекесі", "icon": "❀", "search": "Ризашылықтан күнделікті серіктестікке Аналар мерекесі «Ризашылықтан күнделікті серіктестікке» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Анаға және қамқор ересекке құрмет жылы сөзден, тыңдаудан және қауіпсіз көмектен көрінеді. Қамқорлық еңбегі бір адамға ғана міндеттелмейді. Әр оқушы өзі таңдаған қамқор адамға алғыс білдіре алады. Аналар күні мен 8 наурыз — атауы мен күні бөлек мерекелер. Бүгінгі назарымыз: «Ризашылықтан күнделікті серіктестікке». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды. Жалғыз отбасы үлгісіне құрылған сценарий кей қатысушыларды ыңғайсыз күйге түсірді. Мерекелік жоспар қаржылық мүмкіндікке қарай оқушыларды бөліп жіберді. Еңбек туралы талқылауда қамқорлық тек әйел адамның міндеті деп айтылды. Мерекелік жобаға отбасы оқиғасы мен бейнесін келісімсіз жариялау жоспарланды.", "path": "#/lesson/g11-t21"}, {"id": "g11-t22", "grade": 11, "topic": 22, "title": "Конституциялық мәдениет және азаматтық қатысу", "direction": "Конституция күні", "icon": "⚖", "search": "Конституциялық мәдениет және азаматтық қатысу Конституция күні «Конституциялық мәдениет және азаматтық қатысу» тақырыбы арқылы конституция мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Конституция — мемлекеттің негізгі заңы. Бұл сабақта адам қадірін, қауіпсіздікті және өзгенің пікіріне құрметті күнделікті мысалмен талқылаймыз. Нақты құқықтық тұжырымға ресми мәтіннен дәлел қажет. Бұрынғы мәтін мен қолданыстағы редакцияны шатастырмау маңызды. Бүгінгі назарымыз: «Конституциялық мәдениет және азаматтық қатысу». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Қоғамдық жобаны талқылауда азшылық пікірін мүлде тіркемеу ұсынылды. Ойлану бағдары: Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Қоғамдық жобаны талқылауда азшылық пікірін мүлде тіркемеу ұсынылды. Пікірлер қайшылығында адамның құқығын талқылау жеке айыптауға айналды. Тексерілмеген ескі құқықтық мәтін жаңа нұсқа ретінде ұсынылды. Қолжетімділік шарасы артық жеңілдік деп сыналды. Жастар ұсынысын қабылдау рәсімі түсініксіз және кері байланыс жоқ.", "path": "#/lesson/g11-t22"}, {"id": "g11-t23", "grade": 11, "topic": 23, "title": "Наурыз: мұра мен қоғамдық игілік", "direction": "Наурыз мерекесі", "icon": "❖", "search": "Наурыз: мұра мен қоғамдық игілік Наурыз мерекесі «Наурыз: мұра мен қоғамдық игілік» тақырыбы арқылы наурыз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Наурыз жаңару, татулық және ізгі тілекпен байланысты. Дәстүрді түсіндіруде оның мағынасына назар аударамыз. Әр өңірдегі тәжірибе әртүрлі болуы мүмкін. Мерекені қауіпсіз, ысырапсыз және бәріне қолжетімді өткізуге болады. Бүгінгі назарымыз: «Наурыз: мұра мен қоғамдық игілік». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді. Мереке бюджеті кей отбасыларға міндетті шығын жүктейді. Мерекелік ас жоспары қатысушылардың қауіпсіздік қажеттілігін ескермеді. Экологиялық ұранға қарамастан қайта қолдану жоспары жасалмады. Мерекенің бірлік мақсаты рейтинг пен бәсекенің көлеңкесінде қалды.", "path": "#/lesson/g11-t23"}, {"id": "g11-t24", "grade": 11, "topic": 24, "title": "Отанды қорғау: бейбіт өмірге жауапкершілік", "direction": "Отан қорғаушылар күні", "icon": "⚑", "search": "Отанды қорғау: бейбіт өмірге жауапкершілік Отан қорғаушылар күні «Отанды қорғау: бейбіт өмірге жауапкершілік» тақырыбы арқылы бейбітшілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отанға қызмет жауапкершілік, бейбіт өмірді бағалау және адамдардың қауіпсіздігіне қамқорлықпен байланысты. Батылдық — қауіпті сынаққа бару емес; кейде қауіпті ұсыныстан бас тартып, көмек шақыру. Сабақта әскери құрал не қауіпті жаттығу қолданылмайды. Бүгінгі назарымыз: «Отанды қорғау: бейбіт өмірге жауапкершілік». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды. Бастамада тек күш талап ететін рөлдер жоспарланып, басқа қабілет ескерілмеді. Қоғамға қызмет мысалдары бір ғана топпен шектелді. Көрмеге шығу тегі белгісіз әскери зат әкелу ұсынылды. Қоғамдық жоба үшін адамның жеке қызмет мәліметін жариялау ұсынылды.", "path": "#/lesson/g11-t24"}, {"id": "g11-t25", "grade": 11, "topic": 25, "title": "Бірлік мәдениеті: теңдік пен жауапкершілік", "direction": "Қазақстан халқының бірлігі", "icon": "◉", "search": "Бірлік мәдениеті: теңдік пен жауапкершілік Қазақстан халқының бірлігі «Бірлік мәдениеті: теңдік пен жауапкершілік» тақырыбы арқылы бірлік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Бірлік әр адамның қадірін сыйлап, ортақ іске тең қатысуына жағдай жасаудан басталады. Адамды тіліне, тегіне немесе сыртқы белгісіне қарап бағаламаймыз. Мәдени таныстыруда бір адамның тәжірибесін тұтас топқа телуге болмайды. Бүгінгі назарымыз: «Бірлік мәдениеті: теңдік пен жауапкершілік». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды. Жобаға қосылу тәртібі тек бұрынғы мүшелерге түсінікті. Мәдени шара барлық қатысушы бірдей дәстүрді ұстанады деп жоспарланды. Жобада аз ұсынылған топтардың қажеттілігі өлшенбеді. Манипуляциялық хабар бір оқиғаны тұтас қауымға телиді.", "path": "#/lesson/g11-t25"}, {"id": "g11-t26", "grade": 11, "topic": 26, "title": "Тұрақты волонтерлік: келісім және әсер", "direction": "Волонтерлік және қайырымдылық", "icon": "♡", "search": "Тұрақты волонтерлік: келісім және әсер Волонтерлік және қайырымдылық «Тұрақты волонтерлік: келісім және әсер» тақырыбы арқылы еріктілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Волонтерлік — ерікті пайдалы әрекет. Көмектің қажеттігін алдымен сұраған дұрыс. Адамның қадірі мен жеке мәліметі сақталуы керек. Оқушыдан ақша жинау, жеке жағдайын жариялау немесе қауіпті жұмыс істеу талап етілмейді. Бүгінгі назарымыз: «Тұрақты волонтерлік: келісім және әсер». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау. Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды. Волонтерлік сағат үшін адамдардың ерікті таңдауы шектелді. Есепке адамның қиын жағдайын егжей-тегжейлі жазу ұсынылды. Жобаның қауіпсіздік жоспары жоқ, оқушыларға ересек жұмысы берілді. Жоба табысы тек жиналған қаржымен өлшенді.", "path": "#/lesson/g11-t26"}, {"id": "g11-t27", "grade": 11, "topic": 27, "title": "Тұрақты әдет: жоспар және қолдау", "direction": "Денсаулық және пайдалы әдеттер", "icon": "♧", "search": "Тұрақты әдет: жоспар және қолдау Денсаулық және пайдалы әдеттер «Тұрақты әдет: жоспар және қолдау» тақырыбы арқылы әдет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Демалыс, күн тәртібі, қауіпсіз қозғалыс және қол гигиенасы күнделікті өзіне қамқорлықтың бөлігі. Әр адамның мүмкіндігі әртүрлі. Сабақта дене салмағы, диагноз немесе жеке денсаулық ақпараты сұралмайды. Денсаулық мәселесінде сенімді ересек пен медицина маманына жүгінеді. Бүгінгі назарымыз: «Тұрақты әдет: жоспар және қолдау». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды. Оқу тобы түнгі уақытта міндетті жауап беруді талап етті. Белсенділік жоспары әркімнің мүмкіндігін ескермей, бәріне бірдей талап қойды. Дәлелсіз денсаулық кеңесі жарнамалық мүддесін жасырды. Жобаға қатысушы үзіліс сұраудан ұялады, топ нәтижені ғана күтеді.", "path": "#/lesson/g11-t27"}, {"id": "g11-t28", "grade": 11, "topic": 28, "title": "Жол қауіпсіздігіне азаматтық үлес", "direction": "Жолдағы қауіпсіздік", "icon": "↔", "search": "Жол қауіпсіздігіне азаматтық үлес Жолдағы қауіпсіздік «Жол қауіпсіздігіне азаматтық үлес» тақырыбы арқылы өткел мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жолда назарды қозғалысқа аударып, белгіленген жаяу жүргінші өткелі мен бағдаршам тәртібін сақтау керек. Жас бала жолды сенімді ересекпен өтеді. Қауіпсіздік тапсырмалары тек қағазда орындалады; көлік жолында тәжірибе жасалмайды. Бүгінгі назарымыз: «Жол қауіпсіздігіне азаматтық үлес». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді. Топтық тапсырманы жол үстінде телефонмен орындау ұсынылды. Тұрақтағы көліктер жаяу жүргіншінің көру аймағын жауып тұр. Ұсынылған маршрутта жарық аз, қолжетімділік мәселесі бар. Мектеп маңындағы қауіп туралы тексерілген ұсыныс дайындау керек.", "path": "#/lesson/g11-t28"}, {"id": "g11-t29", "grade": 11, "topic": 29, "title": "Құрметті қарым-қатынас мәдениеті", "direction": "Жеке шекара және өзара құрмет", "icon": "☂", "search": "Құрметті қарым-қатынас мәдениеті Жеке шекара және өзара құрмет «Құрметті қарым-қатынас мәдениеті» тақырыбы арқылы шекара мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр адам өзінің затына, кеңістігіне және жеке ақпаратына қатысты шекарасын айта алады. Келісім ерікті болуы керек және оны өзгертуге болады. «Жоқ» деген жауапты сыйлаймыз. Қорқыныш не қысым болса, сенімді ересекке айтамыз. Бүгінгі назарымыз: «Құрметті қарым-қатынас мәдениеті». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады. Өмірлік мысал: Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады. Бұрын берген жариялау келісімін қатысушы кейін өзгертті. Беделді қатысушы бас тартқан адамды мүмкіндіктен айырамын деп қысым жасады. Ортақ жобада байланыс уақыты мен жеке кеңістік келісілмеген. Қысым көрген адам құпиялық уәдесі үшін көмекке жүгінбей жүр.", "path": "#/lesson/g11-t29"}, {"id": "g11-t30", "grade": 11, "topic": 30, "title": "Ақпаратты таратудағы қоғамдық жауапкершілік", "direction": "Медиасауаттылық", "icon": "⌕", "search": "Ақпаратты таратудағы қоғамдық жауапкершілік Медиасауаттылық «Ақпаратты таратудағы қоғамдық жауапкершілік» тақырыбы арқылы факт мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ақпаратты бөліспес бұрын авторын, жарияланған күнін және бастапқы дерегін тексереміз. Сурет басқа оқиғаға қатысты болуы мүмкін. Пікір адамның бағасын білдіреді, ал фактіні тексеруге болады. Сенімді көрінген ЖИ мәтінінде де қате кездеседі. Бүгінгі if($('#prev-page'))$('#prev-page').onclick=()=>{pageIndex--;render();};if($('#next-page'))$('#next-page').onclick=()=>{pageIndex++;render();};}

tabs.forEach((tab,i)=>{tab.onclick=()=>{activate(tab.dataset.tab);window.setSingleTab(tab.dataset.tab);};tab.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();activate(tabs[n].dataset.tab,true);window.setSingleTab(tabs[n].dataset.tab);};});activate(window.SINGLE_TAB||'intro');
