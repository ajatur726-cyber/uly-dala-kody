 бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Еркіндік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Еркіндікті өзгенің қадірін сыйлап қолданамын.\"></textarea><label for=\"reflection-1\">«Тәуелсіз елдің жауапты азаматы» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Еркіндікті өзгенің қадірін сыйлап қолданамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Еркіндік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t16\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t18\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t17", "title": "Тәуелсіз елдің жауапты азаматы | Тәрбие әлемі"}, "lesson/g11-t18": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Мамандық таңдау және еңбек</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⚙</span><span>11-сынып · 18/30 · 40 минут</span></div><h1>Кәсіби жоспар: мақсат пен балама</h1><p>Мамандық таңдау және еңбек</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Кәсіби жоспар: мақсат пен балама» тақырыбы арқылы еңбек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Дағды» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Мамандық қоғамдағы белгілі бір қажеттілікке жауап береді. Таңдауда қызығушылық, дағды, оқу жолы және еңбек жағдайы ескеріледі. Кәсіпті адамның жынысына немесе отбасы жағдайына қарап шектеуге болмайды. Бірден түпкілікті шешімге келу міндетті емес.</p><p>Бүгінгі назарымыз: «Кәсіби жоспар: мақсат пен балама». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді. Ойлану бағдары: Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу.</p><div class=\"concepts\"><span>Еңбек</span><span>Қызығушылық</span><span>Дағды</span><span>Оқу жолы</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Кәсіпті беделіне ғана қарап емес, өзіме және талабына сай зерттеймін.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Талапкер бағытын өз қызығушылығын тексермей, құрдасының таңдауына қарап бекітті.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қызығушылықты шағын қауіпсіз тәжірибемен тексеру; дербес таңдау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Мамандыққа жарамдылық туралы дәлелсіз әлеуметтік шектеу қойылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Дағды мен талапқа сүйену; кемсітуші болжамды қабылдамау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Кәсіби сынамада оқушыға рұқсатсыз қауіпті жұмыс ұсынылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ересек нұсқауынсыз қауіпті құрал қолданбау; қауіпсіз бақылау рөлін таңдау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Оқу орны туралы жарнамада қабылдау шарты мен толық шығын көрсетілмеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ресми талап пен шығынды тексеру; маманға нақты сұрақ қою; бірнеше жолды салыстыру.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Маған ұнайтын іс — қажет дағды — байқап көретін қауіпсіз әрекет» картасын толтырыңдар. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Үш кәсіпті салыстырыңдар: қоғамға пайдасы, күнделікті міндеті, қажет дағдысы және сенімді ақпарат көзі. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Кәсіпті беделіне ғана қарап емес, өзіме және талабына сай зерттеймін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Бір күндік қауіпсіз кәсіби бақылау» жоспарын жасаңдар; нақты жұмысқа бару міндетті емес. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қандай еңбек қоғамға қажет? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Қызығушылықты қалай тексереміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Кәсіп туралы стереотип неге кедергі? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Оқу талабын қайдан қараймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Негізгі жоспарға қандай балама болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Кәсіпті беделіне ғана қарап емес, өзіме және талабына сай зерттеймін.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Кәсіпті беделіне ғана қарап емес, өзіме және талабына сай зерттеймін. Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Кәсіби жоспар: мақсат пен балама»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Мамандық таңдау және еңбек» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Кәсіпті беделіне ғана қарап емес, өзіме және талабына сай зерттеймін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қандай еңбек қоғамға қажет? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Кәсіп туралы стереотип неге кедергі? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Негізгі жоспарға қандай балама болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Дағды» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Кәсіпті беделіне ғана қарап емес, өзіме және талабына сай зерттеймін.\"></textarea><label for=\"reflection-1\">«Кәсіби жоспар: мақсат пен балама» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Кәсіпті беделіне ғана қарап емес, өзіме және талабына сай зерттеймін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Дағды» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t17\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t19\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t18", "title": "Кәсіби жоспар: мақсат пен балама | Тәрбие әлемі"}, "lesson/g11-t19": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Интернеттегі қауіпсіздік</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>▤</span><span>11-сынып · 19/30 · 40 минут</span></div><h1>Цифрлық тәуекелді саналы басқару</h1><p>Интернеттегі қауіпсіздік</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Цифрлық тәуекелді саналы басқару» тақырыбы арқылы жеке дерек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Сілтеме» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Жеке дерекке аты-жөн, мекенжай, құпиясөз және растау коды сияқты мәлімет жатады. Күдікті сілтеме мен шұғыл талапты бірден орындамай, ресми арнадан тексерген дұрыс. Сабақта нақты құпиясөз жасалмайды және ешкімнің аккаунты ашылмайды.</p><p>Бүгінгі назарымыз: «Цифрлық тәуекелді саналы басқару». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды. Ойлану бағдары: Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.</p><div class=\"concepts\"><span>Жеке дерек</span><span>Құпиясөз</span><span>Сілтеме</span><span>Аккаунт</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Таныс ұйымның атына ұқсас домен төлем не код енгізуді талап етті.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Баспауды таңдау; домен мен ресми арнаны тексеру; код бермеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Топ әр сервисте бір құпиясөз қолдануды ыңғайлы деп таңдады.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Құпияны бөліспеу; әр аккаунтты бөлек қорғау; қосымша қорғауды ересекпен қарастыру.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Қосымша деректі үшінші тарапқа беру шартын түсініксіз жазды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсаттың қажеттілігін бағалау; күмәндісін бермеу; қауіпсіз балама таңдау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Желіде ғана танитын адам өз тұлғасын растамай жеке кездесуді талап етті.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Келісім бермеу; сенімді ересекке айту; жеке дерек не орын жібермеу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Нақты дерексіз қағаз аккаунтқа қауіпсіздік чек-парағын жасаңдар: жеке деректі азайту, күмәнді сілтемені тексеру, кодты қорғау. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ойдан шығарылған қолданбаның рұқсат картасын құрыңдар: қажет рұқсат, артық рұқсат және қауіпсіз балама. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Тоқта — тексер — ересекпен шеш» үш белгісін жасаңыздар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Жеке дерекке не жатады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Шұғыл хабар неге күмән тудыруы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Құпия кодты кімге бермейміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Рұқсат сұрауын қалай бағалаймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Күмәнді әрекеттен кейін кімнен көмек сұраймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін. Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Цифрлық тәуекелді саналы басқару»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Интернеттегі қауіпсіздік» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Жеке дерекке не жатады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Құпия кодты кімге бермейміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Күмәнді әрекеттен кейін кімнен көмек сұраймыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Сілтеме» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.\"></textarea><label for=\"reflection-1\">«Цифрлық тәуекелді саналы басқару» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Сілтеме» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t18\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t20\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t19", "title": "Цифрлық тәуекелді саналы басқару | Тәрбие әлемі"}, "lesson/g11-t20": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Алғыс айту күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>✿</span><span>11-сынып · 20/30 · 40 минут</span></div><h1>Ізгілікті тұрақты әрекетке айналдыру</h1><p>Алғыс айту күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Ізгілікті тұрақты әрекетке айналдыру» тақырыбы арқылы алғыс мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Ықылас» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Алғыс нақты көмекті байқап, оның әсерін айту арқылы шынайы болады. «Көмектескенің үшін рақмет» деген сөздің өзі маңызды. Алғыс міндетті сыйлық немесе жауап қызмет талап етпейді. Күнделікті байқалмайтын еңбекті де бағалауға болады.</p><p>Бүгінгі назарымыз: «Ізгілікті тұрақты әрекетке айналдыру». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету.</p><div class=\"concepts\"><span>Алғыс</span><span>Көмек</span><span>Ықылас</span><span>Еріктілік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 1 наурыз</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Нақты көмек пен әсерін атау; үлесті әділ көрсету.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Құрмет тізімі тек көпшілікке танымал адамдардан құралды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Байқалмайтын еңбекті де қамту; ешкімді міндетті жариялауға мәжбүрлемеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Серіктес бұрынғы көмегі үшін этикалық емес шешімге қолдау талап етті.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Алғыс пен мәжбүрлі міндетті ажырату; сыпайы бас тарту.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Жобаға алғыс айтуды міндетті жария әрекетпен өлшеу ұсынылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жазба не жеке алғыс баламасын ұсыну; еріктілікті сақтау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Бюджеті жоқ қатысушыларды мерекелік шарадан шеттету қаупі туды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тегін, қолжетімді әрекет; қаржыға қарап бағаламау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Не істеді? — Маған не берді? — Рақмет» үлгісімен ойдан шығарылған көмекке екі алғыс сөйлемін құрыңдар. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Нақты көмек пен әсерін атау; үлесті әділ көрсету. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Бір апталық «Байқалған ізгілік» картасын жасаңыздар. Адамдарды жарыстырмай, әрекет түрлерін жазыңдар. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Нақты көмекке арналған қысқа алғыс хатын немесе суретін дайындаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Шынайы алғыс қандай? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Қандай еңбек байқалмай қалады? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Алғыс міндетті сыйлық па? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Бас тарту мен ризашылық қатар бола ала ма? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Ізгілікті қалай жалғастырамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Нақты көмек пен әсерін атау; үлесті әділ көрсету.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін. Нақты көмек пен әсерін атау; үлесті әділ көрсету.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Ізгілікті тұрақты әрекетке айналдыру»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Алғыс айту күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Нақты көмек пен әсерін атау; үлесті әділ көрсету.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Шынайы алғыс қандай? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Алғыс міндетті сыйлық па? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Ізгілікті қалай жалғастырамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Ықылас» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.\"></textarea><label for=\"reflection-1\">«Ізгілікті тұрақты әрекетке айналдыру» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Ықылас» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/P1700000689\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелік күндердің тізбесі</a> · Әділет АҚЖ. Мәтіні ашылып, тиісті мерекелік күндер тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g11-t19\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/11\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g11-t21\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "11", "lesson": "g11-t20", "title": "Ізгілікті тұрақты әрекетке айналдыру | Тәрбие әлемі"}, "lesson/g11-t21": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/11\">11-сынып</a><span> / </span><span>Аналар мерекесі</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>❀</span><span>11-сынып · 21/30 · 40 минут</span></div><h1>Ризашылықтан күнделікті серіктестікке</h1><p>Аналар мерекесі</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/11\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Ризашылықтан күнделікті серіктестікке» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</li><li>«Еңбек» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Анаға және қамқор ересекке құрмет жылы сөзден, тыңдаудан және қауіпсіз көмектен көрінеді. Қамқорлық еңбегі бір адамға ғана міндеттелмейді. Әр оқушы өзі таңдаған қамқор адамға алғыс білдіре алады. Аналар күні мен 8 наурыз — атауы мен күні бөлек мерекелер.</p><p>Бүгінгі назарымыз: «Ризашылықтан күнделікті серіктестікке». Азаматтық шешім жеке ыңғайдан бөлек, өзгенің қадірі мен ұзақ мерзімді қоғамдық әсерін ескереді. Ашық есеп пен кері байланыс шешімнің сенімділігін арттырады. Дәлел өзгерсе, ұстанымды қайта қарау жауапкершілікке жатады.</p><p>Өмірлік мысал: Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</p><div class=\"concepts\"><span>Қамқорлық</span><span>Алғыс</span><span>Еңбек</span><span>Таңдау</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> Аналар күні — мамырдың екінші жексенбісі; Халықаралық әйелдер күні — 8 наурыз</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Жалғыз отбасы үлгісіне құрылған сценарий кей қатысушыларды ыңғайсыз күйге түсірді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қамқор адамды таңдауға мүмкіндік; жеке тарихты ашқызбау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Мерекелік жоспар қаржылық мүмкіндікке қарай оқушыларды бөліп жіберді.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тегін алғыс пен пайдалы әрекет; қаржы туралы сұрамау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Еңбек туралы талқылауда қамқорлық тек әйел адамның міндеті деп айтылды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Міндетті мүмкіндікке қарай бөлу; стереотипке сүйенбеу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Мерекелік жобаға отбасы оқиғасы мен бейнесін келісімсіз жариялау жоспарланды.</p><p>Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді ата. Тұрақты шешім, есеп беру және қайта қарау жолын ұсын.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Этикалық дилемманы талдап, тұрақты әрі есепті шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсат сұрау; жеке дерексіз сурет не ойдан шығарылған мысал таңдау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Байқаған еңбегім — айтар алғысым — қауіпсіз көмегім» картасын дайындаңдар. Ұсыныс авторы және сыни рецензент болыңдар. Құндылықтар қайшылығын, дерек шегін және ұзақ мерзімді әсерді тексеріп, бірлескен қорытынды дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Кез келген қамқор адамға арналған қолжетімді мереке жоспарын жасаңдар: ерікті қатысу, тегін алғыс, қауіпсіз көмек. Модератор, этика талдаушысы, ресурс жоспарлаушы, әсер бағалаушысы рөлдерін бөліңдер. Баламалар, тұрақтылық, есеп беру және қайта қарау тетігі бар шешім дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Қамқорлықты бөлісеміз» ашықхатын немесе үш жолдық мәтінін жазыңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қамқорлық қандай еңбекпен көрінеді? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Алғысты сыйлықсыз қалай айтамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Міндетті қандай өлшеммен бөлеміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Неге қамқор адамды таңдауға мүмкіндік береміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Құрметті күнделікті іске қалай айналдырамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз. Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін. Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Ризашылықтан күнделікті серіктестікке»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 11-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Аналар мерекесі» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Қысқа мерзімде ...; ұзақ мерзімде ...; ... құндылығын ... арқылы сақтаймыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қамқорлық қандай еңбекпен көрінеді? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Міндетті қандай өлшеммен бөлеміз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li><li>Құрметті күнделікті іске қалай айналдырамыз? Қысқа және ұзақ мерзімді әсерді байланыстырып жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>«Ұстанымым — дәлелім — ұзақ мерзімді қадамым» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Еңбек» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.\"></textarea><label for=\"reflection-1\">«Ризашылықтан күнделікті серіктестікке» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде екі баламаны қысқа және ұзақ мерзімді әсері бойынша бағала. Құндылықтар қайшылығын және жетіспейтін дәлелді а
