кезіндегі әрекет және көмекке жүгіну<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-8/lesson-08.html\"><h2>8. Көмек келгенге дейінгі алғашқы әрекеттер<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-8/lesson-09.html\"><h2>9. Көпшілік іс-шаралар кезіндегі қауіпсіздік<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-8/lesson-10.html\"><h2>10. Көшеде біреу соңыңнан ергендегі қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-8/lesson-11.html\"><h2>11. Су тасқыны кезіндегі қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-8/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 292-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=292\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ           Төтенше жағдайлар қызметтері мен байланыс\n               орталығының телефон нөмірлері\nМақсаты            Білім алушылардың төтенше және қиын жағдайда\n               тиісті қызметке дұрыс хабарласу дағдыларын\n               қалыптастыру.\nМіндеттері         – жедел қызметтердің телефон нөмірлері мен\n               міндеттері туралы білімдерін бекіту;\n                   – қауіпті жағдайда дұрыс шешім қабылдап, қажетті\n               көмекке жүгіну дағдыларын дамыту;\n                   – жедел қызметтерге жауапкершілікпен жүгінуге\n               тәрбиелеу.\n\n     Материалдар мен ресурстар\n     «Жедел көмек шақыру алгоритмі» жаднамасы, «Егер көмек\nқажет болса» чек-парағы, ватман, маркерлер, стикерлер.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог білім алушыларға өмірлік жағдайды елестетуді ұсынады:\n     - Сабақтан кейін достарыңмен үйге қайтып келе жатырсыңдар.\nАвтобус аялдамасында қарт адам кенеттен өзін нашар сезінді.\nАйналадағы адамдар абдырап қалды. Сендердің әрекеттерің қандай\nболмақ? Кімге қоңырау шаласыңдар?\n     Білім алушылар өз жауаптарын айтады.\n     Педагог      білім    алушыларға      тақырыпқа      қатысты\nбейнематериалды көруді ұсынады\n      https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2FeoT00B3\ngyDuskOvkalEx7TmU&amp;index=28\n      Педагог қорытындылайды:\n      - Төтенше жағдайда дұрыс шешімді тез қабылдау маңызды.\nТөтенше жағдайлар қызметтерінің телефон нөмірлерін және көмекке\nжүгіну ережелерін білу адамның өмірі мен денсаулығын сақтауға\nкөмектеседі. Бүгін біз қайда және қалай көмек сұрау керектігін еске\nтүсіреміз.\n      II. Негізгі бөлім\n      «Қазақстанның төтенше жағдайлар қызметтері» ақпаратпен\nжұмыс\n      Педагог білім алушыларға Қазақстан Республикасының төтенше\nжағдайлар        қызметтерінің    телефон     нөмірлері көрсетілген\nпрезентацияны немесе плакатты ұсынады және оларды талқылауды\nұйымдастырады.\n\n     Нөмір /                Қызмет                  Қай кезде жүгіну керек\n    Байланыс\n     нөмірі\n 112               Бірыңғай жедел көмек          Кез келген төтенше жағдайда\n                   қызметі                       немесе қай қызметке жүгіну\n                                                 керектігі белгісіз болған кезде\n 101               Өрт сөндіру қызметі           Өрт, түтін басу\n 102               Полиция                       Қылмыс, төбелес, қорқыту,\n                                                 өмір мен денсаулыққа қауіп\n                                                 төнген жағдайда\n 103               Жедел медициналық жәрдем      Жарақат алу, есінен тану,\n                   қызметі                       денсаулық жағдайының күрт\n                                                 нашарлауы\n 104               Апаттық газ қызметі           Газдың иісі сезілгенде, газдың\n                                                 шығуы\n 111               Отбасы, әйелдер мен           Буллинг, кибербуллинг,\n                   балалардың құқықтарын         қорқыту, зорлық-зомбылық\n                   қорғау мәселелері бойынша     және көмек пен қолдауды\n                   «111» байланыс орталығы       қажет ететін басқа да қиын\n                   (тәулік бойы, 24/7)           өмірлік жағдайларда\n Өз өңіріңіздегі   Психологиялық қолдау          Психологиялық қиындықтар,\n ПҚО-ның           орталығы                      қатты күйзеліс,\n байланыс                                        алаңдаушылық, буллинг,\n нөмірлері                                       психологиялық көмек пен\n                                                 қолдауды қажет ететін\n                                                 жағдайларда\n Өз өңіріңіздегі   Балалардың құқықтарын         Балалардың құқықтары мен\n БҚҚБ-ның          қорғау басқармасы             заңды мүдделерінің бұзылуы,\n байланыс                                        қорғау мен көмекті қажет\n нөмірлері                                       ететін жағдайларда\n\n      Педагог білім алушыларға өз өңіріндегі Психологиялық қолдау орталығы\nмен Балалардың құқықтарын қорғау басқармасының қолданыстағы телефон\nнөмірлері мен байланыс деректерін ұсынады.\n     Педагог білім алушыларға қиын жағдайда мәселені жалғыз\nшешуге тырыспау керектігін түсіндіреді. Қажет кезде көмек сұрау –\nдұрыс шешім.\n     Көмекке ата-анаңа, сынып жетекшісіне, мектеп психологіне\nнемесе өзің сенетін басқа ересек адамға жүгіне аласың. Ал кімге\nжүгінеріңді білмесең немесе қосымша кеңес қажет болса, 111 байланыс\nорталығына хабарласуға болады.\n     Жағдаяттық кейстерді талдау\n     Білім алушылар жұптарға бірігеді. Әр жұпқа талқылау үшін бір\nжағдаят беріледі.\n     1-жағдаят. Дене шынықтыру сабағында сыныптасы ауыр\nжарақат алды.\n\n      2-жағдаят. Үйге қайтып келе жатқанда пәтердің терезесінен түтін\nшығып жатқанын байқадыңыз.\n      3-жағдаят. Мектептің чатында бірнеше жасөспірім сыныптасын\nүнемі қорлап, оған қоқан-лоқы көрсетіп, ол туралы жалған ақпарат\nтаратады.\n      4-жағдаят. Кіреберістің маңында газдың қатты иісі сезіледі.\n      5-жағдаят. Сауда орталығының жанында төбелес болды.\n      6-жағдаят. Жасөспірім ұзақ уақыт бойы қатты мазасыздық\nсезінеді, өз уайымымен күресу оған қиын және психологиялық көмек\nалу үшін кімге жүгіну керектігін білмейді.\n      Әр жұпқа арналған тапсырма:\n            көмек алу үшін қайда жүгіну керектігін анықтау;\n            өз таңдауын түсіндіру;\n            жүгінген кезде қандай ақпаратты хабарлау қажет екенін\nатау.\n      Талқылаудан кейін білім алушылар өз шешімдерін жариялайды,\nал педагог қажет болған жағдайда жауаптарды түзетіп, толықтырады.\n      Педагог атап өтеді:\n      – Кейде адам қиын жағдайға тап болғанда не істеу керектігін\nбірден түсіне алмайды. Буллинг, кибербуллинг, қысым, қорқыныш,\nмазасыздық немесе басқа да қиындықтар туындаса, мәселені жалғыз\nшешуге тырыспау керек.\n      Мұндай жағдайда 111 байланыс орталығына немесе\nПсихологиялық қолдау орталығына хабарласып, кеңес пен көмек алуға\nболады. Мамандар жағдайды түсінуге, әрі қарай не істеуге болатынын\nанықтауға және қажет болған жағдайда тиісті көмекке жүгінуге бағыт\nбереді.\n      Кейде өзіңді мазалаған мәселе туралы біреумен сөйлесудің өзі\nжеңілдік әкеліп, шешім табуға көмектеседі. Сондықтан қиындықты\nіште сақтап қалмай, қажет кезде көмекке жүгінген дұрыс.\n      Жедел қызметке жүгіну алгоритмі\n      1.     Сабыр сақтаңыз.\n      2.     Не болғанын қысқаша әрі нақты хабарлаңыз.\n      3.     Оқиға болған жердің нақты мекенжайын немесе жақын\nжердегі бағдарды атаңыз.\n      4.     Оператордың сұрақтарына жауап беріп, қажетті ақпаратты\nхабарлаңыз.\n      5.     Оператордың нұсқауларын орындаңыз.\n      6.     Оператор қоңырауды аяқтауға болатынын айтқанға дейін\nтелефон тұтқасын қоймаңыз.\n      III. Қорытынды бөлім\n\n      Рефлексия:\n           Бүгін мен білдім…\n           Енді мен білемін…\n           Егер қауіпті жағдай туындаса, мен…\n      Педагог сабақтың қорытындысын шығарады:\n      «Қауіпсіздіктің ең маңызды ережесі – өз мәселеңмен жалғыз\nқалмау. Егер сізді бір нәрсе алаңдатса, мазасыздансаңыз немесе\nәділетсіздікке тап болсаңыз, дер кезінде көмек сұрау маңызды.\nЖаныңызда әрдайым сізді тыңдауға, қолдауға және көмектесуге дайын\nадамдар бар: ата-анаңыз, сынып жетекшіңіз, мектеп психологі немесе\nсенім артуға болатын басқа да ересектер. Егер оларға жүгіну мүмкін\nболмаса немесе қосымша қолдау қажет болса, «111» бірыңғай\nбайланыс орталығына қоңырау шалуға болады».\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2FeoT00B3\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2FeoT00B3<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 1-сабақ — Ұлы дала коды"}, "grade-8/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Агрессия кезіндегі қауіпсіз әрекет<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 296-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=296\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ          Агрессия кезіндегі қауіпсіз әрекет\nМақсаты           Білім алушылардың жанжал, агрессивті және\n              құқыққа      қайшы      мінез-құлық     арасындағы\n              айырмашылықтарды түсінуін, сондай-ақ жанжал\n              ушыққандағы қауіпсіз әрекет ету дағдыларын\n              қалыптастыру\nМіндеттері        - жанжалды жағдайларды бағалауға           және\n              агрессивті әрі құқыққа қайшы мінез-құлықтың\n              белгілерін анықтауға үйрету;\n                  - жанжал қауіпті жағдайға ұласқан кезде қауіпсіз\n              әрекет ету алгоритмін меңгерту;\n                  - агрессия мен зорлық-зомбылық жағдайында дер\n              кезінде көмекке жүгіну дағдыларын қалыптастыру.\n\n     Материалдар мен ресурстар\n     Жағдаяттар жазылған карточкалар, «Жанжал ушығып кеткен\nжағдайда қалай қауіпсіз әрекет ету керек» жаднамасы.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог білім алушыларға өмірлік жағдаятты қарастыруды\nұсынады.\n     - Екі сегізінші сынып оқушысы мектеп чатында сөзге келіп\nқалды. Олардың бірі балағат чатта сөздер жазылған пікір қалдырды,\nекіншісі оған одан да дөрекі түрде жауап берді. Келесі күні жанжал\nмектепте жалғасып, төбелеспен аяқталды.\n     Педагог сұрақтар қояды:\n     •      Жанжал қай сәтте қауіпті бола бастады?\n     •      Жағдайдың қауіпті бола бастағанын қандай белгілер\nкөрсетті?\n     •      Төбелестің алдын алу үшін не істеуге болатын еді?\n     Педагог қорытындылайды:\n     - Жанжал әрдайым агрессияға немесе зорлық-зомбылыққа ұласа\nбермейді. Бірақ жағдай ушыға бастаса, оны дер кезінде байқап,\nжанжалдан шеттетіліп, агрессияға агрессиямен жауап бермей және\nқажет болса көмек сұрау керек.\n     II. Негізгі бөлім\n\n      Жағдаяттық кейстерді талдау\n      Білім алушылар шағын топтарда жұмыс істейді. Әр топқа бір\nжағдаят беріледі.\n      1-жағдаят. Дауласқаннан кейін екі жасөспірім бір-бірін\nбалағаттай бастайды.\n      2-жағдаят. Ұрыс-керістен кейін бір жасөспірім екіншісін әдейі\nитеріп, оған қоқан-лоқы көрсете отырып, бопсалай бастады.\n      3-жағдаят. Жасөспірімге үнемі жәбірлеу сипатындағы\nхабарламалар келіп тұрады, сондықтан ол мектепке баруға қорқады.\n      Талқылап, сұрақтарға жауап беріңіздер:\n      •     Жағдайды қауіпті ететін не?\n      •     Жанжалға, агрессияға немесе құқыққа қайшы мінез-\nқұлыққа тән қандай белгілерді байқадыңыздар?\n      •     Бұл жағдайда қандай әрекет қауіпсіз болады?\n      •     Көмек алу үшін кімге жүгінуге болады?\n      Талқылаудан кейін топ өкілдері өз жауаптарын ұсынады.\n      Педагог білім алушылардың назарын жаднамаларға\nаударады.\n      https://cloud.mail.ru/public/dHRB/58bQrEgcp/В%20работе/Чек-листы/КАЗ/Чек-\nлисты%20БУЛЛИНГ%20каз9.jpg\n      «Жанжал қауіпті жағдайға ұласқан кезде» алгоритмі\n      •     Агрессияға агрессиямен жауап бермеңіз, дауды\nтоқтатыңыз.\n      •     Қауіпсіз жерге, ересектер немесе басқа адамдар бар жерге\nшегініңіз.\n      •     Ата-анаңыздан, педагогтен немесе өзіңіз сенім артатын\nбасқа ересек адамнан көмек сұраңыз.\n      •     Егер қорқыту, бопсалау немесе буллинг интернетте орын\nалса, дәлелдерді сақтап қойыңыз.\n      •     Буллинг немесе зорлық-зомбылық, өмір мен денсаулыққа\nтікелей қауіп төнген жағдайда 102 нөміріне қоңырау шалыңыз.\n      •     Кеңес алу және психологиялық қолдау қажет болса, «111»\nбайланыс орталығына жүгініңіз.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n      •     Егер жанжал қауіпті жағдайға ұласса, мен…\n      •     Егер маған қоқан-лоқы көрсетілсе, мен…\n      Педагог сабақтың қорытындысын шығарады.\n      Сабақтың басты ережесі:\n      Жанжалды ушықтырмаңыз. Жәбірлеу немесе зорлық-зомбылық\nжағдайында 111 байланыс орталығы мен 102 нөміріне хабарласып\nкөмек сұраңыз.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://cloud.mail.ru/public/dHRB/58bQrEgcp/В%20работе/Чек-листы/КАЗ/Чек-\" target=\"_blank\" rel=\"noopener noreferrer\">https://cloud.mail.ru/public/dHRB/58bQrEgcp/В%20работе/Чек-листы/КАЗ/Чек-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 2-сабақ — Ұлы дала коды"}, "grade-8/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Қиын жағдайда сенімді ересекке жүгіну<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 298-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=298\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ          Қиын жағдайда сенімді ересекке жүгіну\nМақсаты           Білім алушылардың қиын немесе қауіпті\n              жағдайда кімнен және қайдан көмек сұрауға\n              болатынын анықтап, дер кезінде көмекке жүгіну\n              дағдыларын қалыптастыру.\nМіндеттері        – қиын жағдайда көмек көрсете алатын адамдар\n              мен қызметтер туралы білімдерін кеңейту;\n                  – жағдайға қарай кімге немесе қай қызметке\n              жүгіну керектігін анықтай білуге үйрету;\n                  – өмірге, денсаулыққа немесе қауіпсіздікке қатер\n              төнген жағдайда дұрыс әрекет ету дағдыларын бекіту.\n\n     Материалдар мен ресурстар\n     Үш        түсті     карточкалар,      жағдаяттар      жазылған\nкарточкалар, «Көмек алу үшін кімге жүгінуге болады?» жаднамасы.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог білім алушыларға келесі жағдаятты елестетуді ұсынады.\n     - Жасөспірімге бірнеше күн қатарынан әлеуметтік желі арқылы\nқорқыту, бопсалау сипатындағы хабарламалар келіп тұрады. Бейтаныс\nадам болған жағдайды ешкімге айтпауды талап етеді. Жасөспірім\nалаңдайды, бірақ мәселені өзі шешуі керек деп ойлайды.\n     Педагог сұрақтар қояды:\n      Жасөспірім неге ересектерге бұл туралы айтпады?\n      Мәселені әрдайым өз бетімізше шеше аламыз ба?\n      Жасөспірімге қолдау мен қорғаныс алуға не көмектесуі\nмүмкін?\n     Талқылаудан кейін педагог қорытынды жасайды.\n           Күрделі немесе қауіпті жағдайда жасөспірім мәселені өз\nбетінше шешуге міндетті емес. Көмекке жүгіну қиын жағдайда жалғыз\nқалмай, қажетті көмек пен қолдауды алуға мүмкіндік береді.\n     II. Негізгі бөлім\n     «Жағдаятты бағала» практикалық жаттығуы\n     Педагог білім алушыларға әр жағдаяттың қауіпсіздік деңгейін\nанықтауды ұсынады:\n\n      Жасыл деңгей – жағдаятты өз бетіңше қауіпсіз шешуге болады.\nҚажет болса, көмек сұрауға да болады.\n      Сары деңгей – жағдаят алаңдаушылық туғызады, қысым\nкөрсетумен байланысты немесе қайталанып тұрады. Сенім артатын\nересек адамнан көмек сұрау қажет.\n      Қызыл деңгей – өмірге, денсаулыққа немесе қауіпсіздікке тікелей\nқауіп төнеді. Дереу ересек адамға және/немесе жедел қызметке жүгіну\nқажет.\n      Педагог жағдаяттарды оқып береді:\n      1. Түсініспеушіліктің салдарынан досыңмен сөзге келіп қалдың.\n      2. Сыныптастарың мектеп чатында саған үнемі әзілдеп тиіседі.\n      3. Интернетте бейтаныс адам сені жеке кездесуге шақырады.\n      4. Досың үйіне қайтуға қорқатынын айтып, бұл туралы ешкімге\nайтпауыңды өтінеді.\n      5. Аулада төбелес болып, зардап шеккен адам бар.\n      Әр жағдаяттан кейін білім алушылар қауіпсіздік деңгейін\nанықтап, қалай әрекет ету керектігін және көмек алу үшін кімге\nжүгінуге болатынын түсіндіреді.\n      Егер білім алушылар бір жағдаятты әртүрлі бағаласа, педагог\nқауіп деңгейі нақты жағдайларға байланысты өзгеруі мүмкін екенін\nтүсіндіреді. Мазасыздық немесе жайсыздықтың кез келген деңгейінде\nкөмек сұрауға болады.\n      Педагог қорытынды жасайды:\n      - Жағдаяттың қаншалықты қауіпсіз немесе қауіпті екенін\nанықтап қана қоймай, дұрыс әрекет таңдау да маңызды. Егер мәселені\nқауіпсіз түрде шешуге болатын болса – сабыр сақтап әрекет ет. Егер\nжағдаят алаңдаушылық туғызса, қайталана берсе немесе саған қысым\nкөрсетілсе – сенім артатын ересек адамға жүгін. Егер өмірге,\nденсаулыққа немесе қауіпсіздікке қауіп төнсе – мәселені өз бетіңше\nшешуге тырыспа, қауіпсіз жерге барып, дереу көмек сұра.\n      Егер жағдаяттың қаншалықты қауіпті екеніне күмәндансаң, оны\nересек адамға айтып, көмек сұраған дұрыс.\n      Кейде мазасыздыққа тек қауіпті жағдайлар емес, отбасындағы\nқиындықтар, оқу, достармен қарым-қатынас немесе адамның ішкі\nуайымы да себеп болуы мүмкін. Егер өзіңді жалғыз, сені ешкім\nтүсінбейтіндей немесе ешкімге керек емес сияқты сезінсең, бұл сезімді\nіште сақтап қалма. Ата-анаңмен, досыңмен, өзің сенетін ересек\nадаммен немесе мектеп психологімен сөйлесудің өзі жеңілдеп,\nжағдайды түсінуге көмектесуі мүмкін. Кейде біз уайымдап жүргенде\nмәселе шешілмейтіндей көрінеді. Ал біреумен сөйлескеннен кейін\nжағдайға басқа қырынан қарап, шығатын жол бар екенін ұғасың\n\n      Көмек алу үшін кімге жүгінуге болады?\n      Педагог білім алушыларға әр жағдаятқа сәйкес келетін көмек\nкөзін таңдап, кестені толтыруды ұсынады.\n                         Егер…                                Кімге жүгінуге\n                                                                 болады?\n Саған кеңес немесе қолдау қажет немесе қалай әрекет ету\n керектігін білмесең\n Мазасыздықты, қорқынышты немесе басқа да\n уайымдарды жеңу қиындаса\n Құқықтарың бұзылса және қорғау қажет болса\n Кеңестік, психологиялық, құқықтық немесе ақпараттық\n қолдау қажет болса\n Қоқан-лоқы көрсетілсе немесе құқыққа қайшы әрекеттер\n жасалса\n Өмірге немесе денсаулыққа тікелей қауіп төнсе\n\n      Таңдау нұсқалары:\n          ата-ана, педагог, мектеп психологі, әлеуметтік педагог,\nжаттықтырушы немесе сенім артатын басқа да ересек адам;\n          Психологиялық қолдау орталығы (ПҚО);\n          Балалардың құқықтарын қорғау басқармасы (БҚҚБ);\n          Бала құқықтары жөніндегі уәкіл (БҚУ);\n          «111» байланыс орталығы;\n          полиция – 102;\n          бірыңғай жедел қызмет нөмірі – 112.\n      Педагог кейбір жағдайларда көмек алудың бірнеше нұсқасын\nтаңдауға болатынына назар аударады. Педагог білім алушыларға өз\nөңіріндегі Психологиялық қолдау орталығының өзекті телефон\nнөмірлері мен байланыс деректерін ұсынады.\n      Педагог білім алушыларға тақырыптық постермен\nтанысуды ұсынады.\n       https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us\np=sharing\n      III. Қорытынды бөлім\n      «Мен жалғыз емеспін» рефлексиясы\n           Егер менде мәселе туындаса, мен…\n           Егер маған қиын болса немесе қорықсам, мен жалғыз\nемеспін, өйткені…\n           Мен …-дан көмек сұрай аламын.\n      Педагог қорытынды жасайды:\n      Егер сенде қиын немесе қауіпті жағдай туындаса, есіңде\nболсын: сен – жалғыз емессің. Мәселені жасырмай, сенім артатын\nересек адамға немесе тиісті көмек көрсету қызметіне жүгін.\n\n Біріккен Ұлттар Ұйымының Балалар\n қоры (ЮНИСЕФ) материалдары\n негізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 3-сабақ — Ұлы дала коды"}, "grade-8/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>«Жеңіл ақша» ұсынатын алаяқтардан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 301-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=301\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ        «Жеңіл ақша» ұсынатын алаяқтардан сақтану\nМақсаты         Білім алушылардың интернетте және шынайы\n           өмірде «жеңіл ақша табу» туралы ұсыныстар алған\n           кезде қауіпсіз шешім қабылдау дағдыларын\n           қалыптастыру.\nМіндеттері       білім алушыларды күмәнді ақша табу туралы\n           ұсыныстардың белгілерімен таныстыру;\n                 алаяқтық белгілерін тану және ықтимал\n           тәуекелдерді бағалау дағдыларын дамыту;\n                 күмәнді ақша табу туралы ұсыныстар алған\n           кезде қауіпсіз әрекет ету алгоритмін бекіту.\n\n      Материалдар мен ресурстар\n      «Қауіпсіз ақша табу ережелері» жаднамасы, интерактивті тақта\n(қолда бар болса), ватман, маркерлер, стикерлер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға келесі жағдаятты елестетуді ұсынады.\n      - Әлеуметтік желіде сегізінші сынып оқушысына мынадай\nхабарлама келеді: «Бір күнде 30 000 теңге табуға болады. Ешқандай\nқиын нәрсе жасаудың қажеті жоқ: тек ақша аудару үшін банк картаңды\nпайдалан немесе көрсетілген мекенжайға сәлемдеме жеткіз. Жұмыс\nмүлдем қауіпсіз және жұмыс барысында құпиялылықты сақтау қажет.\n      Педагог сұрақтар қояды:\n            Бұл ұсыныста қандай нәрсе күдік тудырады?\n            Жұмысқа қатысты «құпиялылық» сендерде күмән\nтуырмайды ма?\n            Егер келіссе, қандай салдар туындауы мүмкін?\n      Педагог білім алушылардың назарын жаднамаға аударады.\n    https://drive.google.com/file/d/1KPFqMu6qSv-\nCKAKbx_VTPu98Ahb82x8H/view?usp=sharing\n      -     Тым тиімді ұсыныс, міндеттердің нақты көрсетілмеуі, банк\nкартасын пайдалануды, белгісіз сәлемдемені жеткізуді немесе\n«жұмысты» құпия сақтауды сұрау – қауіптің белгілері. Келісуге\nасықпаңыз: алдымен ұсынысты өзіңіз сенім артатын ересек адаммен\nбірге тексеріңіз.\n\n      II. Негізгі бөлім\n      «Қауіп белгілерін тап» жаттығуы\n      Педагог кіріспе бөлімде көрсетілген хабарламаны қайтадан\nкөрсетіп, білім алушыларға оны тағы бір рет мұқият оқуды ұсынады.\n      Тапсырма\n      Жұппен жұмыс істей отырып, күдік тудыратын сөздер мен сөз\nтіркестерінің астын сызыңыздар немесе оларды атаңыздар.\n      Талқылаудан кейін білім алушылар анықталған белгілерді\nатайды, ал педагог оларды тақтаға жазып отырады.\n      Білім алушылардың ықтимал жауаптары:\n            күш жұмсамай-ақ жоғары табыс табуға уәде береді;\n            жұмыстың мәні неде екенін түсіндірмейді;\n            банк картасын пайдалануды немесе күмәнді тапсырманы\nорындауды сұрайды;\n            белгісіз сәлемдемені жеткізуді ұсынады;\n            құпиялылықты талап етеді;\n            шешімді тез қабылдауға итермелейді.\n      Педагог білім алушылардың назарын аударады:\n      «Заң және тәртіп» қағидаты күмәнді ақша табу схемаларынан\nбас тартуды көздейді. Банк картаңызды, шот деректеріңізді немесе\nSMS арқылы келген кодтарды басқа адамдарға бермеңіз. Бейтаныс\nадамдардың ақшасын аударуға немесе күмәнді тапсырмаларды\nорындауға келіспеңіз. Мұндай әрекеттер алаяқтықпен байланысты\nболуы және құқықтық салдарға әкеп соғуы мүмкін. Күмәнданған\nжағдайда өзіңіз сенім артатын ересек адамға жүгініңіз.\n      «Тоқта немесе тексер» практикалық жаттығуы\n      Педагог жағдаяттарды оқып береді және білім алушыларға\nтөмендегі нұсқалардың бірін анықтауды ұсынады:\n            «Тексеру қажет» – қауіптіліктің айқын белгілері жоқ, бірақ\nақпаратты тексеру қажет;\n            «Тоқта!» – қауіпті немесе күмәнді ұсыныстың белгілері\nбар.\n      Жағдаяттар:\n      1.     Кітап дүкеніне көмекші қажет. Ресми түрде жұмысқа\nқабылдау және жұмыс берушімен әңгімелесу ұсынылады.\n      2.     Бір күнде 30 000 теңге ұсынады, бұл ретте іс жүзінде\nештеңе істеудің қажеті жоқ екенін айтады.\n      3.     Басқа адамдардың ақшасын аудару үшін өз банк картаңды\nпайдалануды ұсынады.\n      4.     «Жұмыс» туралы ақпаратты құпияда ұстауды сұрайды.\n\n      5.     Бүгін бір сайтқа ақша салып, ертесіне екі есе қылып\nшығарып алуға уәде етеді.\n      Әр жағдаяттан кейін білім алушылар ұсынысты тексеруді\nжалғастыру немесе тоқтату керектігін анықтап, өз таңдауын\nтүсіндіреді.\n      Педагог білім алушыларға тақырыптық бейнематериалмен\nтанысуды ұсынады.\n      https://drive.google.com/file/d/1H8lfT5i-\nMiI9cgvzPPkydlb2imhaLVA9/view?usp=sharing\n      Дропперлік – «оңай ақша табу» тәсілдерінің бірі. Бұл жағдайда\nадам сыйақы үшін өз банк картасын, шотын немесе банк\nдеректемелерін басқа адамдарға ақша аудару немесе қолма-қол ақшаға\nайналдыру мақсатында береді. Мұндай жолмен ақша табуға әрекет\nжасау шоттардың бұғатталуына, жеке деректердің жоғалуына және ҚР\nҚылмыстық       кодексінің    232-1-бабы    бойынша      қылмыстық\nжауапкершілікке әкелуі мүмкін.\n      Егер сізге «оңай ақша» ұсынса, банк картаңызды немесе\nшотыңызды пайдалануды, басқа біреудің ақшасын алуды немесе\nаударуды, белгісіз сәлемдемені жеткізуді сұраса немесе «жұмысты»\nқұпия сақтауды талап етсе – тоқтаңыз және тапсырманы орындамаңыз.\nБанк деректеріңіз бен кодтарыңызды ешкімге бермеңіз. Ұсынысты ата-\nанаңызға немесе басқа да сенім артатын ересек адамға көрсетіңіз.\nҚосымша кеңес пен қолдау қажет болса, «111» байланыс орталығына\nжүгінуге болады.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n           Бүгін мен … түсіндім.\n           Егер маған «оңай ақша табуды» ұсынса, мен…\n           Мен үшін қаржылық қауіпсіздіктің басты ережесі – …\n      Сабақтың басты ережесі:\n      «Оңай ақша табу» туралы ұсынысқа келісуге асықпаңыз.\nЖұмысты кім ұсынып отырғанын және не істеу керектігін тексеріңіз.\nБанк картаңызды, шот деректеріңізді және кодтарды ешкімге бермеңіз,\nкүмәнді тапсырмаларды орындамаңыз. Күмәндансаңыз, тоқтап, сенім\nартатын ересек адамға немесе кеңес алу үшін «111» байланыс\nорталығына жүгініңіз.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1KPFqMu6qSv-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1KPFqMu6qSv-<\/a><\/p><p><a href=\"https://drive.google.com/file/d/1H8lfT5i-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1H8lfT5i-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 4-сабақ — Ұлы дала коды"}, "grade-8/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Төтенше жағдай кезіндегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 304-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=304\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№5 сабақ            Төтенше жағдай кезіндегі қауіпсіздік\n                ережелері\nМақсаты             Білім алушылардың төтенше жағдайлар\n                туындаған кезде қауіпсіз әрекет ету және дұрыс\n                шешім қабылдау дағдыларын қалыптастыру.\nМіндеттері          – төтенше жағдайлар кезіндегі қауіпсіздік\n                ережелері туралы білімдерін бекіту және оларды\n                нақты жағдайда қолдануға үйрету;\n                    – қауіп деңгейін бағалап, жағдайға сай қауіпсіз\n                әрекет ету дағдыларын дамыту;\n                    – төтенше жағдайда сабыр сақтауға,\n                нұсқауларды орындауға және қажет кезде дер\n                кезінде көмекке жүгінуге дағдыландыру.\n\n     Материалдар мен ресурстар\n     Төтенше жағдай кезіндегі әрекет ету алгоритмі, «Тоқта – Бағала\n– Әрекет ет» жаднамасы.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Білім алушыларға келесі жағдаят ұсынылады.\n     Сабақ барысында кенеттен дабыл сигналы беріледі. Бір білім\nалушы заттарын асығыс жинай бастайды, екіншілері болып жатқан\nжағдайды телефонға түсіреді, ал үшіншілері абдырап, әрі қарай не\nболатынын күтеді.\n     Талқылауға арналған сұрақтар:\n           Ең бірінші қандай әрекет жасау керек?\n           Қандай әрекеттер қауіпті күшейтуі мүмкін?\n           Төтенше жағдайда сабыр сақтау неліктен маңызды?\n     Педагог білім алушыларға тақырыптық бейнематериалмен\nтанысуды ұсынады.\n      https://www.youtube.com/watch?v=fJE2xBJNPHY&amp;list=PLA5eCSY2FeoT00B\n3gyDuskOvkalEx7TmU&amp;index=2\n      Педагог:\n          Төтенше жағдайда «Заң және тәртіп» қағидатын сақтау\nбелгіленген ережелерге сәйкес әрекет етуді және тиісті қызметтердің\nнұсқауларын орындауды білдіреді. Педагогтердің, құтқарушылардың\n\nжәне полиция қызметкерлерінің талаптарын орындау, эвакуацияға\nжәне жедел қызметтердің жұмысына кедергі келтірмеу, тексерілмеген\nақпаратты таратпау, өзіңізге және айналаңыздағыларға қосымша қауіп\nтөндірмеу маңызды.\n      II. Негізгі бөлім\n      «Алғашқы қауіпсіз әрекеттер» практикалық жаттығуы\n      Педагог білім алушыларға топпен төтенше жағдайларды\nқарастыруды ұсынады. Әр топтың міндеті – алғашқы үш қауіпсіз\nәрекетті анықтап, өз таңдауын түсіндіру.\n      1-жағдаят. Мектептегі өрт\n      Сабақ барысында өрт дабылы іске қосылып, дәлізде түтіннің иісі\nсезілді.\n      2-жағдаят. Газ иісі\n      Бөлмеде газдың қатты иісі сезілді.\n      3-жағдаят. Күдікті зат\n      Сауда орталығында қараусыз қалған сөмкені байқадыңыз, оның\nжанында ешкім жоқ.\n      Ықтимал жауаптар\n      Өрт: педагогтің нұсқауларын орындау, белгіленген эвакуация\nбағытымен қауіпсіз шығу жолына қарай қозғалу, заттарды алу үшін\nкері қайтпау.\n      Газдың шығуы: электр құрылғыларын қоспау, ашық отты\nпайдаланбау, қауіпті жерден кету және ересек адамға немесе 104 нөмірі\nбойынша авариялық газ қызметіне хабарлау.\n      Күдікті зат: оны ұстамау және орнынан қозғалтпау, қауіпсіз\nқашықтыққа шегіну, ересек адамға, нысан қызметкеріне немесе 112\nнөміріне хабарлау.\n      Тапсырманы орындағаннан кейін топтар өз шешімдерін\nұсынады.\n      Педагог сұрақтар қояды:\n           Неліктен дәл осы әрекеттерді таңдадыңыздар?\n           Ең алдымен қандай әрекетті орындау қажет?\n           Қандай қате әрекеттер қауіпті арттыруы мүмкін?\n      Педагог қорытындысы:\n      Төтенше жағдайда сабыр сақтау, қауіпсіздік ережелерін сақтау\nжәне жауапты ересектер мен жедел қызмет қызметкерлерінің\nнұсқауларын орындау маңызды. Өмірге немесе денсаулыққа қауіп\nтөнген жағдайда 112 нөмірі арқылы жедел көмекке жүгіну қажет.\n      «Тоқта – Бағала – Әрекет ет» алгоритмі\n      Білім алушыларға қауіпсіз әрекет етудің әмбебап алгоритмі\nұсынылады.\n\n      Тоқта\n           дүрбелеңге берілме;\n           хабарлау сигналдарын және ересектердің нұсқауларын\nмұқият тыңда.\n      Бағала\n           не болғанын анықта;\n           қауіпсіз жолдың немесе қауіпсіз жердің қайда екенін\nанықта;\n           өмір мен денсаулыққа тікелей қауіп бар-жоғын бағала;\n           көмекке мұқтаж адам туралы ересек адамға немесе жедел\nқызмет қызметкеріне хабарла.\n      Әрекет ет\n           жеке заттарыңды алу үшін кері қайтпа;\n           өзіңе немесе басқа адамдарға қауіп төндіруі мүмкін\nәрекеттерді жасама;\n           қажет болған жағдайда оқиға туралы 112 нөміріне хабарла.\n      III. Қорытынды бөлім\n      Білім алушыларға сөйлемдерді аяқтау ұсынылады.\n           Бүгін мен … түсіндім.\n           Төтенше жағдайда ең алдымен … қажет.\n           Мен есте сақтаған қауіпсіздіктің ең маңызды ережесі – …\n      Сабақтың басты ережесі\n      Төтенше жағдайда қауіпсіз әрекеттерге назар аудар: жауапты\nересектер мен жедел қызметтердің нұсқауларын орында, қауіпті\nаймақтан белгіленген жолмен шық, заттарыңды алу үшін ғимаратқа\nкері кірме және оқиғаны түсіру немесе өз бетіңше көмек көрсету үшін\nөзіңді қауіпке төндірме. Қажет болған жағдайда оқиға туралы 112\nнөміріне хабарла.\n\nҚазақстан Республикасы Денсаулық\nсақтау министрлігі ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=fJE2xBJNPHY&amp;list=PLA5eCSY2FeoT00B\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=fJE2xBJNPHY&amp;list=PLA5eCSY2FeoT00B<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 5-сабақ — Ұлы дала коды"}, "grade-8/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Өз бетінше емделу мен дәрі-дәрмекті бақылаусыз қолданудың қаупі<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 307-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=307\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ           Өз бетінше емделу мен дәрі-дәрмекті бақылаусыз\n              қолданудың қаупі\nМақсаты            Білім алушылардың дәрілік заттарды пайдалану\n              кезінде    қауіпсіз  шешім    қабылдау дағдыларын\n              қалыптастыру\nМіндеттері         өз бетінше емделудің және дәрі-дәрмекті сенімсіз\n              интернет ресурстарынан сатып алудың қауіптерін\n              түсіндіру;\n                   дәрілік заттарға қатысты күмәнді ақпарат пен\n              ұсыныстарды ажырата білу дағдысын дамыту;\n                   өзін жайсыз сезінген кезде және дәрілік заттарға\n              қатысты күмәнді кеңестер алған жағдайда қауіпсіз әрекет\n              ету алгоритмін бекіту.\n\n      Материалдар мен ресурстар\n      «Дәрілік заттарды қауіпсіз қолдану ережелері» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Білім алушыларға келесі жағдаят ұсынылады.\n      Сегізінші сынып білім алушысының тамағы ауырып, дене қызуы\nкөтерілді. Әлеуметтік желіден ол блогердің «бір күнде емдейтін дәріні»\nұсынған бейнеролигін көрді. Пікірлерде көптеген адам бұл дәрінің\nшынымен көмектесетінін жазған. Ата-анасымен және дәрігермен\nкеңеспестен, жасөспірім дәріні интернет арқылы тапсырыс беріп, өз\nбетінше ем қабылдауды шешті.\n      Талқылауға арналған сұрақтар:\n       Бұл жағдаятта қандай тәуекелдерді байқадыңыздар?\n       Блогердің ұсынысындағы қандай ақпаратты тексеру қажет?\n       Қандай шешім қауіпсіз болар еді?\n      Қорытынды\n       Интернеттен алынған дәрі-дәрмек туралы ақпарат дәрігердің\nкеңесін алмастыра алмайды. Өзіңізді жайсыз сезінген жағдайда ата-\nанаңызға немесе басқа да сенім артатын ересек адамға хабарлап, қажет\nболған жағдайда 103 нөмірі арқылы жедел жәрдемге жүгініңіз.\n      II. Негізгі бөлім\n      «Не болуы мүмкін?» ақпаратпен жұмыс\n\n      Жағдаятты талқылағаннан кейін педагог сұрақ қояды:\n       Жасөспірім дәрігермен кеңеспей, белгісіз дәріні қабылдаса,\nқандай қауіп туындауы мүмкін?\n      Білім алушылар өз жауаптарын ұсынады. Педагог оларды\nтолықтырып, ықтимал салдарды қорытындылайды:\n           емнің нәтижесіз болуы;\n           аллергиялық реакция;\n           денсаулық жағдайының нашарлауы;\n           медициналық көмек алуға қажетті уақытты жоғалту;\n           жалған дәрілік затты пайдалану.\n      Маңызды\n      Бейтаныс дәрілік заттарды, сондай-ақ блогерлер, таныстар\nнемесе интернет пайдаланушылары ұсынған дәрілерді қабылдамаңыз.\nДәрігер тағайындаған дәрінің дозасын және қолдану тәсілін өз бетінше\nөзгертпеңіз. Өзіңізді жайсыз сезінген жағдайда ата-анаңызға немесе\nбасқа жауапты ересек адамға хабарлап, медицина қызметкерінің\nұсынымдарын орындаңыз. Дәрілік заттарды заңды және сенімді сату\nарналары арқылы сатып алу қажет. Денсаулық жағдайы күрт\nнашарлаған кезде 103 немесе 112 нөміріне хабарласып, жедел\nмедициналық көмекке жүгіну қажет.\n      Жағдаяттық тапсырма\n      Білім алушылар жұппен жұмыс істейді.\n      Тапсырма. Жағдаятты оқып, екі сұраққа жауап беріңіздер:\n           Жағдаятта қандай нәрсеге сақтықпен қарау қажет?\n           Қандай әрекет қауіпсіз болады?\n      1-жағдаят. Блогер арнайы таблеткалар жаттығусыз-ақ бұлшықет\nмассасын тез арттыруға көмектесетінін айтып, сатып алуға сілтеме\nқалдырады.\n      2-жағдаят. Досың: «Мен бұл таблеткаларды суық тигенде іштім,\nмаған көмектесті. Сен де байқап көр», – деп жазады.\n      3-жағдаят. Белгісіз сайтта «ғажайып дәрі» 80% жеңілдікпен\nсатылатыны, оның кез келген дерлік ауруды емдейтіні жазылған.\n      4-жағдаят. Дене қызуың көтерілді. Ата-анаң дәрігерге қаралуды\nұсынады. Дәрігер тексеруден кейін ем тағайындайды.\n      Талқылаудан кейін білім алушылар өз жауаптарын түсіндіреді.\n      Қорытынды\n      Егер сізге белгісіз дәрілік затты ұсынса немесе ересек адаммен не\nмедицина қызметкерімен кеңеспей дәрі қабылдауға кеңес берсе, бұл\nкеңесті орындауға асықпаңыз. Тоқтаңыз – ақпарат көзін тексеріңіз –\nересек адамға немесе медицина қызметкеріне жүгініңіз – қауіпсіз\nұсынымға сәйкес әрекет етіңіз.\n\n      III. Қорытынды бөлім\n      Білім алушыларға сөйлемді аяқтау ұсынылады:\n      «Егер өзімді жайсыз сезінсем, мен…»\n      Бірнеше білім алушы өз жауаптарын оқып береді.\n      Сабақтың басты ережесі\n      Белгісіз дәрілік заттарды қабылдамаңыз және тексерілмеген\nинтернеттегі медициналық кеңестерге сүйенбеңіз. Өзіңізді жайсыз\nсезінсеңіз, ересек адамға хабарлап, медициналық көмекке жүгініңіз.\nДенсаулық жағдайыңызға күмәндансаңыз – 103 нөміріне хабарласыңыз.\n\nҚазақстан Республикасының Жасанды\nинтеллект және цифрлық даму\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 6-сабақ — Ұлы дала коды"}, "grade-8/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Буллинг пен кибербуллинг кезіндегі әрекет және көмекке жүгіну<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 310-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=310\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№7 сабақ          Буллинг пен кибербуллинг кезіндегі әрекет\n              және көмекке жүгіну\nМақсаты           Білім алушылардың буллинг пен кибербуллинг\n              жағдайында көмекке жүгіну, өзін және өзгелерді\n              қауіпсіз қорғау тәсілдерін қолдану дағдыларын\n              қалыптастыру.\nМіндеттері        буллинг пен кибербуллинг жағдайында қауіпсіз\n              әрекет ету тәсілдерін бекіту;\n                  туындаған мәселе туралы ашық айту және\n              ересектер мен мамандардан көмек сұрау дағдыларын\n              дамыту;\n                  қиын жағдайға тап болған адамға жанашырлық\n              танытып, қолдау көрсетуге тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Жағдаяттар жазылған карточкалар, тақта немесе экран, «Кімнен\nкөмек сұрауға болады?» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Біз буллинг пен кибер буллинг ұғымымен жақсы таныспыз.\nБүгін мұндай жағдай өзіңізге немесе жаныңыздағы адамға қатысты\nболса, не істеу керектігі туралы сөйлесеміз.\n      Педагог мынадай жағдаят ұсынады:\n      - Бірнеше аптадан бері сыныптастары бір жасөспірімді\nкелемеждеп жүр. Ортақ чатта ол туралы жағымсыз хабарламалар\nжазады. Ал жасөспірім: «Біреуге айтсам, жағдай одан сайын қиындап\nкетеді» деп ойлап, бұл туралы ешкімге айтпайды.\n      Педагогтің сұрақтары:\n      – Жасөспірім неліктен бұл туралы айтпай жүруі мүмкін?\n      – Оның көмек сұрауына не кедергі болуы мүмкін?\n      – Ол бұл жағдайды өз бетімен шешуге тиіс пе?\n      Білім алушылар өз ойларын айтады.\n      Педагог:\n      – Кейде адамға басынан өтіп жатқан жағдай туралы айту қиын\nболады. Ол қорқуы, ұялуы, не істерін білмей абдырауы немесе өзіне\n\nешкім сенбейді деп ойлауы мүмкін. Бірақ қиын жағдайда жалғыз\nқалмау керек. Көмекке жүгіну – өзіңді қорғаудың бір жолы.\n      II. Негізгі бөлім\n      1. «Әрі қарай не істеу керек?» жаттығуы\n      Педагог жағдаяттарды оқиды. Білім алушылар қауіпсіз әрекет ету\nжолдарын ұсынады.\n      1-жағдаят\n      Мектепте сені үнемі кемсітіп, жанжалға итермелейді. Сені:\n«Біреуге айтып көрші!» деп қорқытады.\n      Жауап: жәбірлеуге берілмеу, қауіпті жерден кету және сенетін\nересек адамға болған жағдайды айту.\n      2-жағдаят\n      Чатта сен туралы қорлайтын хабарламалар мен суреттер\nжарияланып жүр.\n      Жауап: жауап ретінде жанжалға араласпау, хабарламаларды\nсақтап қою немесе скриншот жасау, пайдаланушыны бұғаттау,\nшағымдану мүмкіндігін пайдалану және ересек адамнан көмек сұрау.\n      3-жағдаят\n      Сен буллинг туралы бір ересек адамға айттың, бірақ жағдай әлі\nде жалғасып жатыр.\n      Жауап: көмек іздеуді тоқтатпау. Басқа сенімді ересек адамға,\nсынып жетекшісіне, мектеп психологіне, мектеп әкімшілігіне немесе\nкөмек көрсететін мамандарға жүгіну.\n      4-жағдаят\n      Досың өзіне әлімжеттік жасалып жүргенін айтып: «Тек ешкімге\nайтпа», – деп өтінді.\n      Жауап: досыңды мұқият тыңдап, оған қолдау көрсету. Егер\nжағдай оның қауіпсіздігіне қатер төндірсе, бірге сенімді ересек адамға\nнемесе маманға жүгіну.\n      Педагог қорытындылайды:\n      – Көмек сұрау адамның әлсіз екенін білдірмейді. Кейде ересек\nадаммен немесе маманмен сөйлесудің өзі қиын жағдайды тоқтатуға\nкөмектеседі.\n      2. «Мен кімнен көмек сұрай аламын?»\n      Педагог:\n      – Қиын жағдай туындағанда кімге хабарласуға болатынын алдын\nала білген маңызды.\n      Мектепте:\n      – сынып жетекшісіне;\n      – сенетін педагогке;\n      – мектеп психологіне;\n\n      – әлеуметтік педагогке;\n      – мектеп әкімшілігіне жүгін.\n      Мектептен тыс жерде:\n      – сенетін ересек адамға;\n      – Психологиялық қолдау орталығының мамандарына;\n      – 111 байланыс орталығына жүгін.\n      Педагог білім алушылардың назарын аударады:\n      – Егер саған қиын болса, мазасыздансаң, қорықсаң немесе\nәңгімені неден бастарыңды білмесең, мектеп психологіне жүгінуге\nболады. Мәселенің күрделеніп кетуін күтудің қажеті жоқ.\n      Қосымша көмек қажет болса, Психологиялық қолдау орталығына\nнемесе 111 байланыс орталығына хабарласуға болады.\n      Барлық қиындықты жалғыз еңсеруге міндетті емессің.\nБасыңнан өтіп жатқан жағдай туралы айту және көмек сұрау –\nқалыпты әрекет.\n      3. Мәселең туралы әңгімені қалай бастауға болады?\n      Педагог:\n      – Кейде ең қиыны – әңгімені бастау. Бірден бәрін айтып шығу\nміндетті емес. Әңгімені қарапайым сөздерден бастауға болады:\n      «Маған көмек керек».\n      «Мен өзім шеше алмай жүрген жағдайға тап болдым».\n      «Бұл туралы айту маған қиынға соғып тұр, бірақ мен болған\nжағдайды айтқым келеді».\n      «Мені ренжітіп жүр. Не істерімді білмеймін».\n      «Қазір маған қиын болып жүр. Сізбен сөйлессем бола ма?»\n      Педагог:\n      – Егер бұл туралы дауыстап айту қиын болса, сенетін ересек\nадамға немесе маманға хабарлама жазуға болады. Сондай-ақ, 111\nбайланыс орталығына жазып, мәселең бойынша нақты кеңес ал.\n      4. Егер сен буллингтің куәгері болсаң\n      Педагог:\n      – Буллинг жағдайында айналадағы адамдардың қалай әрекет\nететіні де маңызды.\n      Егер біреуге әлімжеттік жасалып жатқанын көрсең:\n      – келемеждеу мен мазақтауға қосылма;\n      – адамды қорлайтын жазбаларға «лайк» баспа және оларды\nөзгелерге таратпа;\n      – жәбір көрген адамға қолдау көрсет;\n      – бірге көмек сұрауды ұсын;\n      – жағдай қауіпті болса, дереу ересек адамды шақыр.\n\n      III. Қорытынды бөлім\n      «Мен кімге жүгіну керектігін білемін» рефлексиясы\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n      «Егер мәселені өзім шеше алмасам, мен...».\n      «Мектепте мен ... жүгіне аламын».\n      «Егер досым буллингке тап болса, мен...».\n      «Егер әңгімені бастау маған қиын болса, мен ... деп айта аламын».\n      Педагог қорытындылайды:\n      – Буллингке төзуге немесе мәселемен жалғыз қалуға болмайды.\nБолып жатқан жағдай туралы міндетті түрде айтыңдар. Сенетін ересек\nадамға, мектеп психологіне немесе Психологиялық қолдау\nорталығының мамандарына жүгініңдер. Қосымша көмек қажет болса,\n111 байланыс орталығына хабарласуға болады.\n      – Есте сақта: сен жалғыз емессің. Саған көмектесуге және қиын\nжағдайдан шығудың жолын табуға көмектесетін адамдар мен мамандар\nбар.\n      Сабақтың негізгі қағидасы\n      «Мәселемен жалғыз қалма – болып жатқан жағдай туралы айт –\nкөмек сұра».\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 7-сабақ — Ұлы дала коды"}, "grade-8/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Көмек келгенге дейінгі алғашқы әрекеттер<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 314-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=314\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ           Көмек келгенге дейінгі алғашқы әрекеттер\nМақсаты            Мамандар келгенге дейін алғашқы көмек көрсету\n               кезінде жасөспірімдердің қауіпсіз әрекет етуі\n               бойынша негізгі білімдері мен дағдыларын\n               қалыптастыру.\nМіндеттері         – төтенше жағдайда ең алдымен өз қауіпсіздігін\n               және зардап шеккен адамның жағдайын бағалай\n               білуге үйрету;\n                   – мамандар келгенге дейін көрсетуге болатын\n               қарапайым алғашқы көмек әрекеттерін дұрыс\n               орындау дағдыларын дамыту;\n                   – қажет жағдайда 103 немесе 112 нөміріне\n               хабарласып, жағдай туралы нақты ақпарат беруге\n               дағдыландыру.\n\n      Материалдар мен ресурстар\n      «Алғашқы көмек көрсетудің 4 қадамы» жаднамасы; қауіпті\nжағдаяттардың иллюстрациялары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға келесі жағдаятты елестетуді ұсынады:\n       Әлихан досының құлап қалғанын және оған көмек қажет\nекенін байқайды. Оның жанында зақымданған электр сымы жатыр.\n      Педагог сұрақтар қояды:\n      1.     Ең алдымен не істейсің?\n      2.     Бірден жақындауға бола ма?\n      3.     Кімді көмекке шақыру керек?\n      4.     Қай нөмірге хабарласып, көмек шақыру қажет?\n      Білім алушылардың жауаптарынан кейін педагог негізгі ережеге\nназар аударады:\n      «Алдымен қауіпсіздік – содан кейін көмек»\n      Егер зардап шеккен адамның жанында электр сымы, өрт, түтін\nнемесе басқа қауіп көзі болса, оған бірден жақындауға болмайды.\nАлдымен өз қауіпсіздігіңді қамтамасыз етіп, ересек адамды көмекке\nшақыр және қажет болса 112 немесе 103 нөміріне хабарлас. Қауіп\n\nжойылмайынша, зақымданған сымға да, оның жанындағы адамға да\nқол тигізбе.\n      II. Негізгі бөлім\n      Практикалық тапсырма «Сен не істер едің?»\n      Жағдаят:\n      Спорт алаңында оқушы кенет өзін жайсыз сезініп, құлап басын\nсоғып алады. Оның басы қатты айналып, көмек қажет болды.\n      Сұрақ:\n      Мұндай жағдайда қандай ретпен әрекет ету керек?\n      Дұрыс әрекет реті:\n      1.     Оқиға орнының қауіпсіз екеніне көз жеткіз.\n      2.     Ересек адамды көмекке шақыр.\n      3.     Қажет болса, 103 нөміріне хабарлас.\n      4.     Зардап шеккен адамның есін және тынысын бақыла.\n      5.     Диспетчердің нұсқауларын орында.\n      6.     Оған диспетчер не дәрігер рұқсатынсыз су, тамақ немесе\nдәрі берме. Қажет болмаса, орнынан қозғама.\n      «Алғашқы көмектің 4 қадамы»\n      Педагог білім алушыларға қарапайым әрекет ретін түсіндіреді.\n      1. БАҒАЛА\n      Алдымен оқиға орнының қауіпсіз екенін анықта.\n      Мынадай қауіптердің бар-жоғына назар аудар:\n      – электр сымдары;\n      – өрт немесе түтін;\n      – көлік қозғалысы;\n      – су;\n      – басқа да қауіп көздері.\n      2. КӨМЕККЕ ШАҚЫР\n      Ересек адамға немесе қасыңдағы адамға хабар беріп, көмек сұра.\n      Оқиға мектепте орын алса, кезекші әкімшіні, сынып жетекшіңді\nжәне бастысы мектеп медбикесіне жүгін.\n      3. ЖЕДЕЛ ҚЫЗМЕТКЕ ХАБАРЛАС\n      Қажет жағдайда:\n      – 103 – медициналық жедел көмек қажет болса;\n      – 112 – төтенше жағдай туындаса, өмірге қауіп төнсе немесе қай\nқызметке хабарласу керектігін білмесең.\n      Қоңырау шалғанда:\n      – не болғанын;\n      – оқиға болған жерді;\n      – зардап шеккендер санын;\n      – олардың жағдайы туралы білетініңді айт.\n\n      4. КӨМЕКТЕС\n      Егер айнала қауіпсіз болса, ересек адам немесе мамандар\nкелгенше зардап шеккен адамның жанында бол.\n      Оның жағдайын бақылап, ересек адамның немесе жедел қызмет\nдиспетчерінің нұсқауларын орында. Өзің білмейтін немесе\nдағдыланбаған алғашқы көмек әрекеттерін жасауға тырыспа.\n      Педагог білім алушыларға тақырыптық бейнематериалмен\nтанысуды ұсынады.\n      https://drive.google.com/file/d/1WvB65-\nfQwf0pTejx5v0PdLD4t6Cur2Y3/view?usp=sharing\n      III. Қорытынды бөлім\n      Педагог:\n      Балалар, бүгін біз жанымыздағы адам өзін жайсыз сезінгенде\nнемесе жарақат алған кезде қалай әрекет ету керектігін білдік. Ең\nбастысы – дүрбелеңге берілмей, жағдаятты бағалау және өзіңізге қауіп\nтөндірмеу. Егер жағдай күрделі болса, дереу көмекке жүгініп, 103\nнөміріне хабарласу қажет.\n      Естеріңізде болсын: алғашқы көмек медициналық көмектің\nорнын алмастырмайды.\n      Біздің міндетіміз – зардап шеккен адамға қауіпсіз түрде көмек\nкөрсету және мамандардың келуін күту.\n      Рефлексия\n         Бүгін мен алғашқы көмек … басталатынын түсіндім.\n         Жанымдағы адам өзін жайсыз сезінсе, мен…\n         Оқиға болған жер қауіпті болса, мен…\n         Егер жедел көмек қажет болса, мен … нөміріне\nхабарласамын.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1WvB65-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1WvB65-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 8-сабақ — Ұлы дала коды"}, "grade-8/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Көпшілік іс-шаралар кезіндегі қауіпсіздік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 317-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=317\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№9 сабақ            Көпшілік іс-шаралар кезіндегі қауіпсіздік\nМақсаты             Білім алушылардың бұқаралық іс-шаралар кезінде\n                тәуекелдерді бағалау және қауіпсіз әрекет ету\n                дағдыларын қалыптастыру.\nМіндеттері          - білім алушыларды бұқаралық іс-шаралар кезінде\n                туындауы мүмкін негізгі тәуекелдермен таныстыру;\n                    - жағдайды бағалау және әрекет етудің қауіпсіз\n                тәсілін таңдау дағдысын дамыту;\n                    - қауіпті жағдай туындаған кезде және көмекке\n                жүгіну қажет болған жағдайда әрекет ету алгоритмін\n                бекіту.\n      Материалдар мен ресурстар\n      «Бұқаралық іс-шаралардағы қауіпсіздік» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Мен дайынмын ба?» шағын квесті\n      Педагог білім алушыларға достарымен концертке немесе\nспорттық жарысқа бара жатқанын елестетіп, төмендегі сұрақтарға\nойша «иә» немесе «жоқ» деп жауап беруді ұсынады:\n            Бір-бірімізден адасып қалсақ, алдын ала қай жерде\nкездесетінімізді келістік пе?\n            Телефонымның қуаты жеткілікті ме?\n            Негізгі және эвакуациялық шығу жолдарының қай жерде\nорналасқанын білемін бе?\n            Көмек қажет болған жағдайда кімге жүгіну керектігін\nбілемін бе?\n      Тапсырманы орындағаннан кейін педагог сұрақтар қояды:\n            Іс-шара басталғанға дейін тағы не істеу қажет?\n            Іс-шара өтетін жерде неге назар аудару маңызды?\n            Мұндай дайындық қауіпсіздікті неліктен арттырады?\n      Педагог қорытындылайды:\n      Бұқаралық іс-шара кезіндегі қауіпсіздік дайындықтан\nбасталады. Жақын адамдармен байланыс орнату тәртібін және\nкездесетін орынды алдын ала белгілеп алған маңызды. Ал іс-шара\nөтетін жерде шығу жолдарына назар аударып, көмек қажет болған\nжағдайда кімге жүгіну керектігін білу қажет.\n\n      Есіңде болсын: адам көп жиналған іс-шараларда телефон\nбайланысы әлсіреп, интернетке қосылу қиындауы мүмкін.\n      II. Негізгі бөлім\n      «Неге назар аудару керек?» шағын талқылауы\n      Педагог білім алушыларға жағдаяттың қауіпті бола бастағанын\nбілдіретін белгілерді атауды ұсынады.\n      Талқылаудан кейін негізгі белгілер тұжырымдалады.\n      Жағдайдың өзгеру белгілері:\n           адамдардың тығыздығы күрт артты;\n           адамдар тобы тез қозғала бастады немесе адамдар\nарасында қысылыс пайда болды;\n           адамдар құлап жатыр, айқай-шу естіледі;\n           төбелес немесе басқа да қауіпті әрекеттер басталды;\n           қараусыз қалған күдікті зат анықталды;\n           эвакуация жарияланды немесе қызметкерлер аумақтан\nшығу туралы нұсқау берді.\n      «Заң және тәртіп» қағидаты. Бұқаралық іс-шаралар кезіндегі\nқауіпсіздік барлық қатысушылардың белгіленген ережелерді\nсақтауына байланысты. Полиция қызметкерлері мен басқа да уәкілетті\nтұлғалардың заңды талаптарын орындау, қоғамдық тәртіпті сақтау,\nжанжалға арандатпау, эвакуацияға және жедел қызметтердің\nжұмысына кедергі келтірмеу қажет.\n      «Шешім қабылдауға 30 секунд» тренингтік жаттығуы\n      Педагог түсіндіреді:\n      Төтенше жағдайда ұзақ ойланып отыруға уақыт бола бермейді.\nҚазір әр топқа шешім қабылдауға 30 секунд беріледі.\n      Әр топқа карточка беріледі.\n      1-карточка. Концерт кезінде адамдар тобы күтпеген жерден алға\nқарай жылдам қозғала бастады.\n      Тапсырма. 30 секунд ішінде алғашқы қауіпсіз әрекетті\nанықтаңыздар.\n      Талқылау. Сабыр сақта, адамдардың қозғалысына қарсы жүрме\nжәне кенет қимыл жасама. Мүмкіндік болса, біртіндеп адам аз жерге\nқарай жылжып, қауіпсіздік қызметкерлерінің нұсқауларын орында.\n      Егер адамдар тым тығыз жиналып, қозғалу қиындаса, тепе-\nтеңдікті сақтауға тырыс. Кенет тоқтама және жерге түсіп кеткен затты\nалу үшін еңкейме.\n      2-карточка. Фестиваль кезінде қараусыз қалған рюкзакты\nбайқадыңыз.\n      Тапсырма. Ең алдымен не істеу қажет?\n\n      Талқылау. Затқа қол тигізбеу, полиция қызметкеріне, күзет\nқызметкеріне немесе іс-шара ұйымдастырушысына хабарлау және\nқауіпсіз қашықтыққа шегіну қажет.\n      3-карточка. Іс-шара кезінде достарыңыздан адасып қалдыңыз, ал\nтелефоныңыздың қуаты таусылды.\n      Тапсырма. Қандай шешім ең қауіпсіз болады?\n      Талқылау. Достарыңызды адамдар тығыз жиналған жерден өз\nбетіңізше іздемеу, алдын ала келісілген кездесу орнына бару немесе іс-\nшара қызметкерлеріне жүгіну қажет.\n      4-карточка. Спорттық жарыс кезінде жаныңызда төбелес\nбасталды.\n      Тапсырма. Ең алдымен не істеу қажет?\n      Талқылау. Төбелеске араласпау, қауіпсіз қашықтыққа шегіну\nжәне қауіпсіздік қызметкерлеріне немесе полицияға хабарлау қажет.\n      Тапсырманы орындағаннан кейін педагог білім алушыларға\nортақ әрекет ету алгоритмін тұжырымдауды ұсынады.\n      «Бағала – Шегін – Хабарла – Орында» алгоритмі\n      1.    Бағала – не болып жатқанын және қауіп көзі қай жерде\nорналасқанын анықта.\n      2.    Шегін – қауіп көзінен арақашықтықты ұлғайт.\n      3.    Хабарла       –      күзет      қызметкеріне,     іс-шара\nұйымдастырушысына, полицияға немесе басқа да жауапты ересек\nадамға жүгін.\n      4.    Нұсқауларды орында – эвакуация кезінде көрсетілген\nбағыт бойынша сабырлы түрде қозғал.\n      5.    Өмірге немесе денсаулыққа тікелей қауіп төнген жағдайда\n– 112 нөміріне хабарлас.\n      III. Қорытынды бөлім\n      «Қауіптің алдын алатын бір шешім» жаттығуы\n      Педагог әр білім алушыға бұқаралық іс-шаралар кезінде міндетті\nтүрде сақтайтын бір ережені атауды ұсынады.\n      Мысалы:\n           алдын ала кездесетін орынды белгілеймін;\n           дүрбелең туғызбаймын;\n           қараусыз қалған заттарды көтермеймін;\n           қауіпсіздік қызметкерлерінің нұсқауларын орындаймын;\n           қажет болған жағдайда 112 нөміріне хабарласамын.\n      Жауаптардан кейін педагог қорытынды жасайды:\n      Жағдаятты бағала, қауіп көзінен аулақ бол, жауапты\nқызметкерлердің нұсқауларын орында және өмірге немесе\nденсаулыққа қауіп төнген жағдайда 112 нөміріне хабарлас.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 9-сабақ — Ұлы дала коды"}, "grade-8/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Көшеде біреу соңыңнан ергендегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 320-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=320\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ          Көшеде біреу соңыңнан ергендегі қауіпсіздік\n               ережелері\nМақсаты            Білім алушылардың көшеде аңду немесе қудалау\n               белгілері байқалған жағдайда қауіпсіз әрекет ету\n               дағдыларын қалыптастыру.\nМіндеттері         - ықтимал қауіпті жағдаяттың белгілерін танып-\n               білуге үйрету;\n                   - аңду немесе қудалау күдігі туындаған жағдайда\n               қауіпсіз әрекет ету алгоритмін пысықтау;\n                   - ересектерден және қажет болған жағдайда\n               жедел қызметтерден дер кезінде көмек сұрау\n               дағдыларын бекіту.\n\n      Материалдар мен ресурстар\n      «Егер сені аңдып келе жатса» жаднамасы, жағдаяттық\nтапсырмалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға келесі жағдаятты қарастыруды\nұсынады:\n      Сабақтан кейін сегізінші сынып оқушысы үйіне бара жатып,\nбейтаныс адамның біраз уақыт бойы артынан еріп келе жатқанын\nбайқайды. Білім алушы қозғалыс бағытын өзгертеді, алайда әлгі адам\nоның соңынан еруін жалғастырады.\n      Педагог сұрақтар қояды:\n      Бұл жағдаятта қандай белгілер сақ болуға себеп болуы тиіс?\n      Адамның не үшін артынан еріп келе жатқанын өз бетіңше\nанықтауға тырысу керек пе?\n      Қандай әрекет қауіпсіз болады?\n      Білім алушылардың жауаптарынан кейін педагог негізгі ережеге\nназар аударады:\n      -      Егер сені біреу аңдып келе жатқандай көрінсе, оның ниетін\nөз бетіңше анықтауға тырыспа. Сенің басты міндетің – қауіпсіз жерге\nбарып, көмекке жүгіну.\n      II. Негізгі бөлім\n      «Қауіпсіз әрекетті қалай таңдауға болады?» практикалық\nжаттығуы\n      Педагог білім алушыларға бірнеше жағдаятты қарастырып,\nқауіпсіз әрекет нұсқаларын анықтауды ұсынады.\n      1-жағдаят. Подъезде\n\n      Сен подъезге жақындағанда, жанында бейтаныс адам тұрғанын\nбайқадың. Бұл жағдаят сені алаңдатып, подъезге жалғыз кіргің\nкелмейді.\n      Сұрақ: Қалай қауіпсіз әрекет етуге болады?\n      2-жағдаят. Лифтте\n      Сен бейтаныс адаммен бірге лифтке кіргелі тұрсың, бірақ өзіңді\nжайсыз сезінесің.\n      Сұрақ: Лифтке міндетті түрде кіру керек пе? Қауіпсіздікті\nқамтамасыз ететін қандай нұсқаны таңдауға болады?\n      3-жағдаят. Жарықтандырылуы нашар көшеде\n      Сен үйіңе қайтып келе жатырсың. Әдеттегідей сен жүретін\nжолдың бір бөлігі нашар жарықтандырылған және адам аз жүреді.\n      Сұрақ: Тәуекелді азайту үшін бағытыңды немесе әрекетіңді\nқалай өзгертуге болады?\n      4-жағдаят. Артыңнан біреу еріп келе жатқандай көрінеді\n      Бір адамның біраз уақыт бойы сенімен бір бағытта келе жатқанын\nбайқадың. Оның әдейі еріп келе жатқанына сенімді емессің, алайда бұл\nжағдаят сені алаңдатады.\n      Сұрақ: Ол адаммен байланысқа түспей, не істеуге болады?\n      Талқылаудан кейін педагог білім алушылармен бірге қауіпсіз\nәрекет ету алгоритмін тұжырымдайды.\n      Қауіпсіз әрекет ету алгоритмі\n      1.    Жағдайды бағала – өзіңді алаңдатып тұрған жағдайға назар\nаудар.\n      2.    Қауіпсіз нұсқаны таңда – жарық әрі адам көп жерге бар,\nқажет болса, бағытыңды өзгерт немесе келесі лифтіні күт.\n      3.    Өзің сенетін ересек адамға хабарла – қай жерде екеніңді\nжәне не болып жатқанын айт.\n      4.    Смартфонда геолокацияны жіберу функциясы болса,\nорналасқан жеріңді ата-анаңмен немесе өзің сенетін басқа ересек\nадаммен бөліс.\n      5.    Жанжалдаспа және бейтаныс адамның ниетін өз бетіңше\nанықтауға тырыспа.\n      6.    Егер нақты қауіп төнсе, адам сені аңдып, қорқытып немесе\nұстап қалуға әрекет жасаса – 102 нөміріне хабарлас. Мүмкіндігің босла,\nата-анаң мен ересек адамға сені күтіп алуын сұра.\n      Егер осындай жағдаяттан кейін де бойыңда алаңдаушылық\nнемесе қорқыныш сезімі сақталса, не тыныштала алмай жүрсең, өз\nуайымыңмен жалғыз қалма. Бұл туралы ата-анаңа немесе өзің сенетін\nбасқа ересек адамға айт, мектеп психологіне, Психологиялық қолдау\nорталығына немесе «111» байланыс орталығына жүгін.\n\n      Педагог атап өтеді:\n      Сақтық таныту – бейтаныс адамдардан қорқу керек дегенді\nбілдірмейді. Ең бастысы – айналадағы жағдайға назар аударып,\nбарынша қауіпсіз әрекет нұсқасын таңдай білу. Егер бір жағдаят\nалаңдатса, бағытыңды өзгертуге, адам көп жерге баруға немесе көмек\nсұрауға болады.\n      Педагог білім алушыларға тақырыптық бейнематериалмен\nтанысуды ұсынады.\n     https://www.youtube.com/watch?v=gHTw7u8zr6A\n\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n               Егер көшедегі жағдаят мені алаңдатса, мен…\n               Егер мені біреу аңдып келе жатқандай көрінсе, мен…\n               Көмек сұрау үшін мен … адамға жүгінуіме болады.\n               Егер қауіпті жағдайдан кейін де бойымда\nалаңдаушылық немесе қорқыныш сақталса, мен…\n      Бірнеше білім алушы өз жауаптарын қалауы бойынша оқып\nбереді.\n      Педагог қорытынды жасайды:\n      Егер бір жағдай сені алаңдатса, адам көп әрі қауіпсіз жерге бар,\nөзің сенетін ересек адамға хабарла және қажет болса көмек сұра. Қауіп\nтөнген жағдайда 102 немесе 112 нөміріне хабарлас. Егер болған\nоқиғадан кейін алаңдаушылық немесе қорқыныш сақталса, мектеп\nпсихологіне, Психологиялық қолдау орталығына немесе «111»\nбайланыс орталығына жүгінуге болады.<\/div><p><a href=\"https://www.youtube.com/watch?v=gHTw7u8zr6A\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=gHTw7u8zr6A<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 10-сабақ — Ұлы дала коды"}, "grade-8/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>8-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-8/index.html\">← 8-сынып тақырыптары<\/a><article><h2>Су тасқыны кезіндегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 323-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=323\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 11 сабақ        Су тасқыны кезіндегі қауіпсіздік ережелері\nМақсаты           Білім алушылардың су тасқыны кезіндегі қауіпсіз әрекет\n               ету дағдыларын қалыптастыру\nМіндеттері         білім алушыларды су тасқыны кезіндегі қауіпсіз\n               мінез-құлықтың негізгі ережелерімен таныстыру;\n                   жағдайды жылдам бағалау және қауіпсіз әрекет ету\n               алгоритмін таңдау дағдысын дамыту;\n                   өз қауіпсіздігіне және айналасындағы адамдардың\n               қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Су тасқыны кезінде және одан кейін әрекет ету алгоритмі,\nжағдаяттық тапсырмалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға келесі жағдаятты елестетуді ұсынады:\n       Сабақ кезінде су деңгейінің күрт көтерілгені және аумақты су\nбасу қаупі бар екені туралы хабарлама келіп түсті. Білім алушылар ең\nалдымен қандай әрекеттерді орындау керектігін анықтауы қажет.\n      Талқылауға арналған сұрақтар:\n       Ең алдымен қандай әрекет жасау қажет?\n       Қандай әрекеттер қауіпті күшейтуі мүмкін?\n       Төтенше жағдайда неліктен сабыр сақтау маңызды?\n      Педагог қорытынды жасайды:\n      Төтенше жағдайда, соның ішінде су тасқыны кезінде, ең бастысы\n– дүрбелеңге берілмеу. Сабыр сақтау, мұқият болу және дұрыс әрекет\nету өмір мен денсаулықты сақтауға көмектеседі.\n      II. Негізгі бөлім\n      Педагог білім алушыларды су тасқыны кезіндегі әрекет ету\nалгоритмімен таныстырады:\n            Қажет болған жағдайда қауіпті аумақтан дереу кету.\n            Эвакуациялау мүмкін болмаған жағдайда жоғарғы қабатқа\nнемесе басқа да биіктеу жерге көтерілу.\n            Егер адам қауіпсіз аумаққа шыға алмай, оқшауланып қалса,\nкөмек шақыру белгісін беру.\n            Қатты ағып жатқан судан өтпеу.\n            Су басқан аумақтан жаяу өтуге тырыспау.\n            Үзіліп қалған электр сымдарына жақындамау.\n            Ақау бар электр құрылғыларын пайдаланбау.\n\n           Су деңгейі көтеріліп жатса, су басқан жолмен көлікпен\nжүруге болмайды. Құтқарушылардың нұсқауларын орында.\n      Маңызды ереже\n      Тіпті таяз, бірақ ағысы қатты су адамды ағызып әкетуі мүмкін.\nСондықтан су басу қаупін елемеуге және жағдайды қауіпсіз деп\nбағалауға болмайды.\n      Су тасқынынан кейінгі әрекет ету алгоритмі\n      Су қайтқаннан кейін үйге бірден оралуға болмайды.\n      Мыналарды орындау қажет:\n           үйге қайтуға ресми рұқсат берілгенін күту;\n           ғимараттың қауіпсіздігін тексеру;\n           электр жабдықтары су астында қалған болса, электр\nқуатын өз бетінше қоспау;\n           зақымданған немесе ластанған көздерден алынған суды\nішуге пайдаланбау;\n           үзілген электр сымдарынан аулақ болу;\n           жолдардың,       көпірлердің      және      ғимараттардың\nзақымдануына байланысты сақтық шараларын сақтау;\n           анықталған қауіпті жағдайлар туралы ересектерге немесе\nқұтқарушыларға хабарлау.\n      Педагог сыныпты топтарға бөліп, әр топқа жағдаяттар\nұсынады:\n      1-жағдаят: «Радиодан су тасқыны қаупі бар екені және\nэвакуациялау қажеттігі туралы хабарлады. Сіз не істейсіз?».\n      2-жағдаят: «Үйге су тез кіре бастады, ал қауіпсіз жолмен сыртқа\nшығу мүмкін емес. Сіз қалай әрекет етесіз?».\n      3-жағдаят: «Су тасқынынан кейін су тартылды, бірақ үйдің\nжанында зақымдалған электр сымы жатыр. Не істеу керек?».\n      Білім алушылар жағдаяттарды талқылап, әрекет ету нұсқаларын\nұсынады.\n      Педагог қорытынды жасайды:\n      Су тасқыны кезінде сабыр сақтау, дер кезінде эвакуациялану,\nқатты ағып жатқан судан және зақымданған электр желілерінен аулақ\nболу қажет.\n      III. Қорытынды бөлім\n      Білім алушыларға сөйлемдерді аяқтау ұсынылады:\n               Бүгін мен … түсіндім.\n               Төтенше жағдайда ең алдымен … қажет.\n               Мен есте сақтаған ең маңызды қауіпсіздік ережесі – …\n      Педагог:\n\n      Естеріңде болсын! Төтенше жағдайда жағдайды жылдам бағалап,\nсабыр сақтап, қауіпсіздік ережелеріне сәйкес әрекет ету маңызды. Егер\nжағдай өмірге немесе денсаулыққа қауіп төндірсе, ересектер мен жедел\nқызмет мамандарының нұсқауларын орындау, қажет болған жағдайда\nоқиға туралы 112 нөміріне хабарлау қажет.\n      Сабақтың басты ережесі\n      Заттар үшін өміріңді қатерге тікпе және құтқару қызметтерінің\nнұсқауларын қатаң орында.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "8-сынып · 11-сабақ — Ұлы дала коды"}};const HOME="grade-8/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
