window.TARBIE_CATALOG=[{"id": "g04-t01", "grade": 4, "topic": 1, "title": "Әділ бөлісу — жақсы әдет", "direction": "Адал азамат", "icon": "✦", "search": "Әділ бөлісу — жақсы әдет Адал азамат «Әділ бөлісу — жақсы әдет» тақырыбы арқылы адалдық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Адалдық — өз әрекетің туралы шын айту және өзгенің еңбегін иемденбеу. Қателескен адам оны мойындап, түзете алады. Әділдік әр адамның үлесін және қажет қолдауын ескеруді талап етеді. Бүгінгі назарымыз: «Әділ бөлісу — жақсы әдет». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Еденнен қарындаш таптың. Иесі оны іздеп жүр. Не істейсің? Ойлану бағдары: Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу. Еденнен қарындаш таптың. Иесі оны іздеп жүр. Не істейсің? Ойыншығыңды өзің сындырып алдың. Біреу басқа баланы кінәлады. Досыңа кітап әкелуге уәде бердің, бірақ ұмыттың. Екі бала сурет салды. Біреуі барлық мақтауды өзі алғысы келді. Үш балаға екі қарындаш қана бар. Қалай бөлісесіңдер?", "path": "#/lesson/g04-t01"}, {"id": "g04-t02", "grade": 4, "topic": 2, "title": "Суды үнемдеуді үйренемін", "direction": "Таза Қазақстан", "icon": "♧", "search": "Суды үнемдеуді үйренемін Таза Қазақстан «Суды үнемдеуді үйренемін» тақырыбы арқылы тазалық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Таза орта күнделікті ұсақ әрекеттерден құралады. Қалдықты азайту, суды ысырап етпеу және ортақ орынды ұқыпты пайдалану маңызды. Тазалық жұмысы қауіпсіз болуы керек; шыны мен белгісіз затты балалар жинамайды. Бүгінгі назарымыз: «Суды үнемдеуді үйренемін». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Қағаз жерде жатыр. Қасында қоқыс жәшігі бар. Ойлану бағдары: Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру. Қағаз жерде жатыр. Қасында қоқыс жәшігі бар. Краннан су ағып тұр. Жабуға ересектен көмек сұрай аласың. Ауладан сынған шыны көрдің. Гүлді суардың. Досың сабағын жұлып ойнағысы келеді. Сурет қағазының бір жағы бос қалды.", "path": "#/lesson/g04-t02"}, {"id": "g04-t03", "grade": 4, "topic": 3, "title": "Әділ ойын ережесі", "direction": "Заң мен тәртіп", "icon": "⚖", "search": "Әділ ойын ережесі Заң мен тәртіп «Әділ ойын ережесі» тақырыбы арқылы ереже мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ереже адамдардың бірге қауіпсіз өмір сүруіне көмектеседі. Мектептің күнделікті ережесі мен мемлекет заңының қызметі бірдей емес. Түсініксіз талапты сұрақ қою және ұсыныс білдіру арқылы нақтылауға болады. Бұл сабақ нақты құқықтық кеңес бермейді. Бүгінгі назарымыз: «Әділ ойын ережесі». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Кезекте тұрсың. Досың алдыңа өтіп кетті. Ойлану бағдары: Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну. Кезекте тұрсың. Досың алдыңа өтіп кетті. Ойында бір бала ережені білмейді. Дәлізде жүгіруге досың шақырды. Сыныптағы белгі саған түсініксіз. Кітапты орнына қою ережесін ұмытып кеттің.", "path": "#/lesson/g04-t03"}, {"id": "g04-t04", "grade": 4, "topic": 4, "title": "Мақалдың мағынасын ашайық", "direction": "Ұлттық мұраны қорғайық", "icon": "❖", "search": "Мақалдың мағынасын ашайық Ұлттық мұраны қорғайық «Мақалдың мағынасын ашайық» тақырыбы арқылы мұра мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мұраға тіл, өнер, дәстүр, тарихи орын мен тұрмыстық бұйым жатады. Оны сақтау — бүлдірмеу, мағынасын білу және дерегін бұрмаламай жеткізу. Бір бұйым туралы әртүрлі әңгіме болуы мүмкін; авторын және дереккөзін нақтылау пайдалы. Бүгінгі назарымыз: «Мақалдың мағынасын ашайық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Мұражайдағы ескі бұйымды ұстап көргің келді. Ойлану бағдары: Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану. Мұражайдағы ескі бұйымды ұстап көргің келді. Оюлы бұйымның атауын білмейсің. Досың қазақша сөзді қате айтты. Басқа бала салған ою суретін өз атыңмен көрсеткің келді. Үлкен кісі ескі бұйымның тарихын айтқысы келеді.", "path": "#/lesson/g04-t04"}, {"id": "g04-t05", "grade": 4, "topic": 5, "title": "Бірге шешім табайық", "direction": "ДосболLIKE", "icon": "♡", "search": "Бірге шешім табайық ДосболLIKE «Бірге шешім табайық» тақырыбы арқылы достық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Достық тыңдау, сенім және ерікті қолдауға сүйенеді. Дос болу барлық ұсынысқа келісу дегенді білдірмейді. Өз шекараңды айтып, өзгенің таңдауын сыйлауға болады. Қауіп төнсе, мәселені жалғыз шешуге міндетті емессің. Бүгінгі назарымыз: «Бірге шешім табайық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Жаңа бала ойынға қосылмай тұр. Ойлану бағдары: Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу. Жаңа бала ойынға қосылмай тұр. Екі бала бір ойын таңдамады. Досың жалғыз отыр. Сөйлескісі келмеуі мүмкін. Досың саған ұнамайтын ойынға қатысуға шақырды. Топтық суретті бір бала ғана салып жатыр.", "path": "#/lesson/g04-t05"}, {"id": "g04-t06", "grade": 4, "topic": 6, "title": "Біреуді шетте қалдырмайық", "direction": "Буллингтің алдын алу", "icon": "☂", "search": "Біреуді шетте қалдырмайық Буллингтің алдын алу «Біреуді шетте қалдырмайық» тақырыбы арқылы қолдау мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Біреуді қайта-қайта қорлау, қорқыту не шеттету — көмек қажет ететін жағдай. Оған ұшыраған бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтуға болады. Бір рет болған ауыр әрекетті де елемеуге болмайды. Бұл сабақта қорлау сөздері мен көріністері қайталанбайды. Бүгінгі назарымыз: «Біреуді шетте қалдырмайық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Бір баланы ойыннан күнде шығарып тастайды. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Бір баланы ойыннан күнде шығарып тастайды. Досыңды күнде ренжітеді. Ол айтуға қорқады. Бір баланы ренжіткенде өзгелер күліп тұр. Бала ештеңе айтқысы келмейді. Бірақ көңілсіз. Айтқан ересек сені тыңдамады.", "path": "#/lesson/g04-t06"}, {"id": "g04-t07", "grade": 4, "topic": 7, "title": "Жағымсыз хабарға қауіпсіз жауап", "direction": "Кибербуллингтің алдын алу", "icon": "▣", "search": "Жағымсыз хабарға қауіпсіз жауап Кибербуллингтің алдын алу «Жағымсыз хабарға қауіпсіз жауап» тақырыбы арқылы кибербуллинг мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Цифрлық ортада қорлау, қорқыту және келісімсіз контент тарату адамға зиян тигізеді. Жауап ретінде қорлаудың қажеті жоқ. Қауіпсіздік үшін сенімді ересекпен бірге шағымдану және бұғаттау мүмкіндігін қарастыруға болады. Куәгер ренжітетін материалды әрі қарай таратпайды. Бүгінгі назарымыз: «Жағымсыз хабарға қауіпсіз жауап». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Ойындағы хабар сені ренжітті. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Ойындағы хабар сені ренжітті. Біреудің күлкілі суретін жіберуді сұрады. Біреу досыңның атымен жаман сөз жазды. Досың жағымсыз хабарды жасырып отыр. Бала ренжігенін айтты. Өзгелер «әзіл ғой» деді.", "path": "#/lesson/g04-t07"}, {"id": "g04-t08", "grade": 4, "topic": 8, "title": "Көмек сұрауды үйренемін", "direction": "Қоғамдық ортадағы қауіпсіздік", "icon": "⌂", "search": "Көмек сұрауды үйренемін Қоғамдық ортадағы қауіпсіздік «Көмек сұрауды үйренемін» тақырыбы арқылы кездесу орны мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қоғамдық жерде алдын ала келісілген бағыт пен кездесу орны көмектеседі. Бейтаныс адамға еріп кетпеу, қауіпті затты ұстамау және жауапты қызметкерден көмек сұрау маңызды. Қауіпсіздікке күмән туса, сенімді ересекпен бірге шешім қабылда. Бүгінгі назарымыз: «Көмек сұрауды үйренемін». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Дүкенде бірге келген ересекті көрмей қалдың. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Дүкенде бірге келген ересекті көрмей қалдың. Таныс емес адам сені басқа жерге шақырды. Орындық астында белгісіз сөмке тұр. Есіктің алдына көп адам жиналды. Досың биік қоршауға шығуды ұсынды.", "path": "#/lesson/g04-t08"}, {"id": "g04-t09", "grade": 4, "topic": 9, "title": "Дауды тыныш шешемін", "direction": "Құқықтық тәртіп", "icon": "⚑", "search": "Дауды тыныш шешемін Құқықтық тәртіп «Дауды тыныш шешемін» тақырыбы арқылы құқық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр баланың қадір-қасиеті мен қауіпсіздігі маңызды. Пікір айту кезінде өзгенің де сөзін тыңдау қажет. Құқықтар жақсы мінез үшін берілетін сыйлық емес. Келіспеушілікті тыныш талқылап, қажет болса сенімді ересектің көмегін сұраймыз. Бүгінгі назарымыз: «Дауды тыныш шешемін». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Сен сөйлегің келеді, досың да сөйлегісі келеді. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Сен сөйлегің келеді, досың да сөйлегісі келеді. Досың суретіңді сұрамай алды. Екі бала бір кітапты алғысы келеді. Ойында қате жасаған баланы демалуға жібермей қойды. Бала көмек сұрайтын ересекті білмейді.", "path": "#/lesson/g04-t09"}, {"id": "g04-t10", "grade": 4, "topic": 10, "title": "Туған жерге пайдалы білім", "direction": "Білімім — Отаныма!", "icon": "☀", "search": "Туған жерге пайдалы білім Білімім — Отаныма! «Туған жерге пайдалы білім» тақырыбы арқылы білім мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Білім адамға мәселені түсініп, пайдалы шешім табуға көмектеседі. Отанға қызмет ету күнделікті ортаға қамқорлықтан басталады. Пайдалы бастама біреудің нақты қажетіне жауап береді; оның нәтижесі тек суретпен емес, өзгеріспен бағаланады. Бүгінгі назарымыз: «Туған жерге пайдалы білім». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Кітап бұрышындағы кітаптар араласып кетті. Ойлану бағдары: Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу. Кітап бұрышындағы кітаптар араласып кетті. Досың ережені түсінбеді. Сен түсіндіре аласың. Сынып гүліне су құю ұмытылды. Мектеп картасынан керек бөлмені таба алмадың. Пайдалы ісіңді досыңмен бөліскің келеді.", "path": "#/lesson/g04-t10"}, {"id": "g04-t11", "grade": 4, "topic": 11, "title": "Ұрпақтар арасындағы сыйластық", "direction": "Қарттар күні", "icon": "✿", "search": "Ұрпақтар арасындағы сыйластық Қарттар күні «Ұрпақтар арасындағы сыйластық» тақырыбы арқылы құрмет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Үлкенге құрмет — тыңдау, сыпайы сөйлесу және көмекті рұқсатпен ұсыну. Адамның жасына қарап оның мүмкіндігін болжауға болмайды. Қарт кісі де өз таңдауын өзі жасайды. Сұхбатты жазуға және жариялауға бөлек келісім қажет. Бүгінгі назарымыз: «Ұрпақтар арасындағы сыйластық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Үлкен кісі сөмкесін өзі ұстағысы келеді. Ойлану бағдары: Көмекті сыпайы ұсыну; бас тартуды құрметтеу. Үлкен кісі сөмкесін өзі ұстағысы келеді. Үлкен кісінің сөзін бала бөліп жіберді. Қонақты суретке түсіргің келеді. Досың барлық үлкен адам телефонды білмейді деді. Қонаққа орындық керек екенін байқадың.", "path": "#/lesson/g04-t11"}, {"id": "g04-t12", "grade": 4, "topic": 12, "title": "Сабақтағы өзара құрмет", "direction": "Ұстаздар күні", "icon": "✎", "search": "Сабақтағы өзара құрмет Ұстаздар күні «Сабақтағы өзара құрмет» тақырыбы арқылы ұстаз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ұстаз еңбегі сабақ түсіндірумен шектелмейді: ол дайындалады, кері байланыс береді, оқуға жағдай жасайды. Алғыс қымбат сыйлыққа тәуелді емес. Құрметпен сұрақ қоюға және түсінбегеніңді айтуға болады. Алғыс шарасына қатысу ерікті болуы керек. Бүгінгі назарымыз: «Сабақтағы өзара құрмет». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Мұғалімге жылы сөз айтқың келеді. Ойлану бағдары: Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау. Мұғалімге жылы сөз айтқың келеді. Сабақта сұрағың бар, бірақ айтуға ұяласың. Балалар мұғалім сөйлегенде шулап кетті. Бір бала алғыс суретін салғысы келмейді. Ұстаздың еңбегі туралы сурет жасайсың.", "path": "#/lesson/g04-t12"}, {"id": "g04-t13", "grade": 4, "topic": 13, "title": "Отбасындағы міндеттерді бөлісу", "direction": "Отбасы күні", "icon": "⌂", "search": "Отбасындағы міндеттерді бөлісу Отбасы күні «Отбасындағы міндеттерді бөлісу» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отбасы мен қамқор адамдар әртүрлі болады. Жылы сөз, қауіпсіз көмек және бір-бірін тыңдау жақындықты нығайтады. Үйдегі міндет жас пен мүмкіндікке сай бөлінеді. Отбасы туралы жеке мәліметті көпшілікке айтуға ешкім міндетті емес. Бүгінгі назарымыз: «Отбасындағы міндеттерді бөлісу». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Кітаптарың шашылып қалды. Ойлану бағдары: Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу. Кітаптарың шашылып қалды. Сен бір ойын, қамқор ересек басқа іс ұсынды. Отбасы суретін көрсеткің келмейді. Жақының тыныш демалғысы келеді. Досың басқа қамқор адаммен тұрады.", "path": "#/lesson/g04-t13"}, {"id": "g04-t14", "grade": 4, "topic": 14, "title": "Республика күніне ізгі тілек", "direction": "Республика күні", "icon": "☀", "search": "Республика күніне ізгі тілек Республика күні «Республика күніне ізгі тілек» тақырыбы арқылы республика мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Республика күні елдің мемлекеттілігі мен ортақ болашағы туралы ойлануға мүмкіндік береді. Елге құрмет сөзбен де, қоғамдық мүлікті сақтау мен адамдарға сыйластық таныту арқылы да көрінеді. Әр адамның қауіпсіз, шамасына сай пайдалы іс жасауына болады. Бүгінгі назарымыз: «Республика күніне ізгі тілек». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Мерекеден соң қағаздар жерде қалды. Ойлану бағдары: Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау. Мерекеден соң қағаздар жерде қалды. Досың өз ауылы туралы айтып бергісі келеді. Саябақтағы орындыққа жазу жазуды ұсынды. Қонақ елің туралы сұрады. Барлық балаға ортақ суретте орын жетпеді.", "path": "#/lesson/g04-t14"}, {"id": "g04-t15", "grade": 4, "topic": 15, "title": "Шағын қаржыны жоспарлау", "direction": "Ұлттық валюта — теңге", "icon": "₸", "search": "Шағын қаржыны жоспарлау Ұлттық валюта — теңге «Шағын қаржыны жоспарлау» тақырыбы арқылы теңге мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Теңге — Қазақстанның ұлттық валютасы. Ақшаны жоспарлау қажеттілік пен қалауды ажыратудан басталады. Оқу тапсырмасында тек ойдан шығарылған сома қолданылады. Жеке қаржы, банк картасының дерегі немесе құпия код сұралмайды. Бүгінгі назарымыз: «Шағын қаржыны жоспарлау». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Ойынға арналған қағаз ақшаң бір затқа ғана жетеді: су не ойыншық. Ойлану бағдары: Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау. Ойынға арналған қағаз ақшаң бір затқа ғана жетеді: су не ойыншық. Досың қымбат зат алмасаң ойнамаймын деді. Экрандағы сыйлық батырмасын басқың келді. Біреу үлкен адамның телефон кодын сұрады. Екі заттың бағасы әртүрлі, қызметі ұқсас.", "path": "#/lesson/g04-t15"}, {"id": "g04-t16", "grade": 4, "topic": 16, "title": "Рәміз туралы дұрыс дерек", "direction": "Мемлекеттік рәміздер", "icon": "☀", "search": "Рәміз туралы дұрыс дерек Мемлекеттік рәміздер «Рәміз туралы дұрыс дерек» тақырыбы арқылы ту мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қазақстанның мемлекеттік рәміздері — Ту, Елтаңба және Әнұран. Олар елдің біртұтастығы мен мемлекеттілігін танытады. Рәміз туралы мәліметті ресми дереккөзден тексерген дұрыс. Қолдан жасалған оюды ресми рәміздің дәл көшірмесі деп таныстыруға болмайды. Бүгінгі назарымыз: «Рәміз туралы дұрыс дерек». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Екі суреттің қайсысы Ту екенін білмедің. Ойлану бағдары: Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау. Екі суреттің қайсысы Ту екенін білмедің. Әнұранды тыңдағанда не істеуді білмейсің. Тудың бөліктері туралы сұрағың бар. Рәміз салынған қағаз еденде жатыр. Қонақ Ту мен Елтаңбаны сұрады.", "path": "#/lesson/g04-t16"}, {"id": "g04-t17", "grade": 4, "topic": 17, "title": "Еркіндік пен жауапкершілік", "direction": "Тәуелсіздік күні", "icon": "✦", "search": "Еркіндік пен жауапкершілік Тәуелсіздік күні «Еркіндік пен жауапкершілік» тақырыбы арқылы тәуелсіздік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Тәуелсіздік — елдің өз болашағын өзі айқындауымен байланысты ұғым. Бейбіт өмірді бағалау, тарихи деректі бұрмаламау және өзгенің қадірін сыйлау маңызды. Азаматтық жауапкершілік ортақ ортаға қамқорлықтан көрінеді. Бүгінгі назарымыз: «Еркіндік пен жауапкершілік». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Мерекелік суретке ортақ гүлді жұлу ұсынылды. Ойлану бағдары: Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету. Мерекелік суретке ортақ гүлді жұлу ұсынылды. Екі бала ел туралы әртүрлі жақсы ой айтты. Кітаптағы дата саған түсініксіз. Мерекеге досың да қатысқысы келеді. Еліңе қандай жақсы іс жасай аласың?", "path": "#/lesson/g04-t17"}, {"id": "g04-t18", "grade": 4, "topic": 18, "title": "Қабілетімді байқап көремін", "direction": "Мамандық таңдау және еңбек", "icon": "⚙", "search": "Қабілетімді байқап көремін Мамандық таңдау және еңбек «Қабілетімді байқап көремін» тақырыбы арқылы еңбек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мамандық қоғамдағы белгілі бір қажеттілікке жауап береді. Таңдауда қызығушылық, дағды, оқу жолы және еңбек жағдайы ескеріледі. Кәсіпті адамның жынысына немесе отбасы жағдайына қарап шектеуге болмайды. Бірден түпкілікті шешімге келу міндетті емес. Бүгінгі назарымыз: «Қабілетімді байқап көремін». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Досың тазалық қызметкерінің жұмысын бағаламады. Ойлану бағдары: Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу. Досың тазалық қызметкерінің жұмысын бағаламады. Саған сурет салу ұнайды, досыңа құрастыру ұнайды. Біреу бұл жұмыс тек ұлдарға не қыздарға деді. Жаңа құралды бірден қолданғың келді. Кәсіп туралы сұрағың бар.", "path": "#/lesson/g04-t18"}, {"id": "g04-t19", "grade": 4, "topic": 19, "title": "Қауіпсіз цифрлық әдет", "direction": "Интернеттегі қауіпсіздік", "icon": "▤", "search": "Қауіпсіз цифрлық әдет Интернеттегі қауіпсіздік «Қауіпсіз цифрлық әдет» тақырыбы арқылы жеке дерек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жеке дерекке аты-жөн, мекенжай, құпиясөз және растау коды сияқты мәлімет жатады. Күдікті сілтеме мен шұғыл талапты бірден орындамай, ресми арнадан тексерген дұрыс. Сабақта нақты құпиясөз жасалмайды және ешкімнің аккаунты ашылмайды. Бүгінгі назарымыз: «Қауіпсіз цифрлық әдет». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Ойын сенен үй мекенжайын сұрады. Ойлану бағдары: Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Ойын сенен үй мекенжайын сұрады. Экранда «сыйлық ұттың» деген батырма шықты. Досың үлкен адамның құпия кодын сұрады. Ойын сені камераны қосуға шақырды. Бейтаныс адам өзімен кездесуге шақырды.", "path": "#/lesson/g04-t19"}, {"id": "g04-t20", "grade": 4, "topic": 20, "title": "Күнделікті ізгілік", "direction": "Алғыс айту күні", "icon": "✿", "search": "Күнделікті ізгілік Алғыс айту күні «Күнделікті ізгілік» тақырыбы арқылы алғыс мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Алғыс нақты көмекті байқап, оның әсерін айту арқылы шынайы болады. «Көмектескенің үшін рақмет» деген сөздің өзі маңызды. Алғыс міндетті сыйлық немесе жауап қызмет талап етпейді. Күнделікті байқалмайтын еңбекті де бағалауға болады. Бүгінгі назарымыз: «Күнделікті ізгілік». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Досың түсіп қалған кітабыңды берді. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету. Досың түсіп қалған кітабыңды берді. Мектеп еденін таза ұстайтын адамға рақмет айтқың келеді. Досың көмектесті, енді сенен ойыншығыңды талап етті. Бала рақметті дауыстап айтқысы келмеді. Алғыс суретін бірге жасайсыңдар.", "path": "#/lesson/g04-t20"}, {"id": "g04-t21", "grade": 4, "topic": 21, "title": "Көмекті бірге бөлісейік", "direction": "Аналар мерекесі", "icon": "❀", "search": "Көмекті бірге бөлісейік Аналар мерекесі «Көмекті бірге бөлісейік» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Анаға және қамқор ересекке құрмет жылы сөзден, тыңдаудан және қауіпсіз көмектен көрінеді. Қамқорлық еңбегі бір адамға ғана міндеттелмейді. Әр оқушы өзі таңдаған қамқор адамға алғыс білдіре алады. Аналар күні мен 8 наурыз — атауы мен күні бөлек мерекелер. Бүгінгі назарымыз: «Көмекті бірге бөлісейік». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Қамқор адамың шаршады. Кітаптарыңды өзің жинай аласың. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Қамқор адамың шаршады. Кітаптарыңды өзің жинай аласың. Ашықхатты анаңнан басқа қамқор адамға бергің келеді. Сыйлық сатып ала алмайсың. Біреу үйдегі көмекті тек қыздар атқарады деді. Қамқор адамның фотосын көрсеткің келеді.", "path": "#/lesson/g04-t21"}, {"id": "g04-t22", "grade": 4, "topic": 22, "title": "Құқық пен қадір-қасиет", "direction": "Конституция күні", "icon": "⚖", "search": "Құқық пен қадір-қасиет Конституция күні «Құқық пен қадір-қасиет» тақырыбы арқылы конституция мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Конституция — мемлекеттің негізгі заңы. Бұл сабақта адам қадірін, қауіпсіздікті және өзгенің пікіріне құрметті күнделікті мысалмен талқылаймыз. Нақты құқықтық тұжырымға ресми мәтіннен дәлел қажет. Бұрынғы мәтін мен қолданыстағы редакцияны шатастырмау маңызды. Бүгінгі назарымыз: «Құқық пен қадір-қасиет». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Бір бала ойынға қатысқысы келеді, бірақ оған кезек бермеді. Ойлану бағдары: Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Бір бала ойынға қатысқысы келеді, бірақ оған кезек бермеді. Сенің де, досыңның да ойы бар. Ереже туралы сұрағың бар. Көмек керек балаға түсінікті белгі жасайсың. Бала сұрақ қоюдан қорқады.", "path": "#/lesson/g04-t22"}, {"id": "g04-t23", "grade": 4, "topic": 23, "title": "Жаңару және пайдалы іс", "direction": "Наурыз мерекесі", "icon": "❖", "search": "Жаңару және пайдалы іс Наурыз мерекесі «Жаңару және пайдалы іс» тақырыбы арқылы наурыз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Наурыз жаңару, татулық және ізгі тілекпен байланысты. Дәстүрді түсіндіруде оның мағынасына назар аударамыз. Әр өңірдегі тәжірибе әртүрлі болуы мүмкін. Мерекені қауіпсіз, ысырапсыз және бәріне қолжетімді өткізуге болады. Бүгінгі назарымыз: «Жаңару және пайдалы іс». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Досың бір дәстүрді білмейді. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Досың бір дәстүрді білмейді. Ойынға қатысу үшін қымбат киім керек деді. Дәмнен бұрын қолыңды жуу керек. Мерекеден соң көп қағаз қалды. Екі бала ойынның кезегіне келіспеді.", "path": "#/lesson/g04-t23"}, {"id": "g04-t24", "grade": 4, "topic": 24, "title": "Тыныш өмірді бағалаймын", "direction": "Отан қорғаушылар күні", "icon": "⚑", "search": "Тыныш өмірді бағалаймын Отан қорғаушылар күні «Тыныш өмірді бағалаймын» тақырыбы арқылы бейбітшілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отанға қызмет жауапкершілік, бейбіт өмірді бағалау және адамдардың қауіпсіздігіне қамқорлықпен байланысты. Батылдық — қауіпті сынаққа бару емес; кейде қауіпті ұсыныстан бас тартып, көмек шақыру. Сабақта әскери құрал не қауіпті жаттығу қолданылмайды. Бүгінгі назарымыз: «Тыныш өмірді бағалаймын». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Досың биікке шығуды батылдық деді. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Досың биікке шығуды батылдық деді. Көмек керек адамды байқадың. Біреу қорғаушы тек ұл болады деді. Белгісіз затты ойыншық деп ойладың. Мерекеге жылы тілек жазғың келеді.", "path": "#/lesson/g04-t24"}, {"id": "g04-t25", "grade": 4, "topic": 25, "title": "Тыңдайық және танысайық", "direction": "Қазақстан халқының бірлігі", "icon": "◉", "search": "Тыңдайық және танысайық Қазақстан халқының бірлігі «Тыңдайық және танысайық» тақырыбы арқылы бірлік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Бірлік әр адамның қадірін сыйлап, ортақ іске тең қатысуына жағдай жасаудан басталады. Адамды тіліне, тегіне немесе сыртқы белгісіне қарап бағаламаймыз. Мәдени таныстыруда бір адамның тәжірибесін тұтас топқа телуге болмайды. Бүгінгі назарымыз: «Тыңдайық және танысайық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Бала сөзді басқаша айтады. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Бала сөзді басқаша айтады. Жаңа бала ойын ережесін білмейді. Әр баланың сүйікті асы әртүрлі. Бір суретке бәріңнің ойың сыймай қалды. Досың бір топ туралы жаман сөз естіді.", "path": "#/lesson/g04-t25"}, {"id": "g04-t26", "grade": 4, "topic": 26, "title": "Ерікті іс және ортақ қамқорлық", "direction": "Волонтерлік және қайырымдылық", "icon": "♡", "search": "Ерікті іс және ортақ қамқорлық Волонтерлік және қайырымдылық «Ерікті іс және ортақ қамқорлық» тақырыбы арқылы еріктілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Волонтерлік — ерікті пайдалы әрекет. Көмектің қажеттігін алдымен сұраған дұрыс. Адамның қадірі мен жеке мәліметі сақталуы керек. Оқушыдан ақша жинау, жеке жағдайын жариялау немесе қауіпті жұмыс істеу талап етілмейді. Бүгінгі назарымыз: «Ерікті іс және ортақ қамқорлық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Досыңа көмектескің келеді, ол өзі істегісі келеді. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау. Досыңа көмектескің келеді, ол өзі істегісі келеді. Бір бала ізгі іске қатысқысы келмеді. Көмек алған досыңды суретке түсіргің келеді. Ауыр затты жалғыз көтеруді ұсынды. Көмек үшін қағаз кітап белгісін жасайсың.", "path": "#/lesson/g04-t26"}, {"id": "g04-t27", "grade": 4, "topic": 27, "title": "Ұйқы мен демалысты бағалаймын", "direction": "Денсаулық және пайдалы әдеттер", "icon": "♧", "search": "Ұйқы мен демалысты бағалаймын Денсаулық және пайдалы әдеттер «Ұйқы мен демалысты бағалаймын» тақырыбы арқылы әдет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Демалыс, күн тәртібі, қауіпсіз қозғалыс және қол гигиенасы күнделікті өзіне қамқорлықтың бөлігі. Әр адамның мүмкіндігі әртүрлі. Сабақта дене салмағы, диагноз немесе жеке денсаулық ақпараты сұралмайды. Денсаулық мәселесінде сенімді ересек пен медицина маманына жүгінеді. Бүгінгі назарымыз: «Ұйқы мен демалысты бағалаймын». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Ұзақ отырып шаршадың. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Ұзақ отырып шаршадың. Кешке ойын қызық болып, ұйықтау уақыты келді. Досың қиын қимылды қайталауды ұсынды. Экранда сиқырлы сусын туралы сурет шықты. Өзіңді жайсыз сезіндің.", "path": "#/lesson/g04-t27"}, {"id": "g04-t28", "grade": 4, "topic": 28, "title": "Асықпай, назармен жүремін", "direction": "Жолдағы қауіпсіздік", "icon": "↔", "search": "Асықпай, назармен жүремін Жолдағы қауіпсіздік «Асықпай, назармен жүремін» тақырыбы арқылы өткел мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жолда назарды қозғалысқа аударып, белгіленген жаяу жүргінші өткелі мен бағдаршам тәртібін сақтау керек. Жас бала жолды сенімді ересекпен өтеді. Қауіпсіздік тапсырмалары тек қағазда орындалады; көлік жолында тәжірибе жасалмайды. Бүгінгі назарымыз: «Асықпай, назармен жүремін». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Досың жолдан қысқа жермен жүгіріп өтпек. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Досың жолдан қысқа жермен жүгіріп өтпек. Жолда телефондағы суретке қарайсың. Үлкен көліктің артынан жол көрінбейді. Кешкі уақытта қараңғы болды. Бағдаршам түсін білмей қалдың.", "path": "#/lesson/g04-t28"}, {"id": "g04-t29", "grade": 4, "topic": 29, "title": "Өз кеңістігімді айтамын", "direction": "Жеке шекара және өзара құрмет", "icon": "☂", "search": "Өз кеңістігімді айтамын Жеке шекара және өзара құрмет «Өз кеңістігімді айтамын» тақырыбы арқылы шекара мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр адам өзінің затына, кеңістігіне және жеке ақпаратына қатысты шекарасын айта алады. Келісім ерікті болуы керек және оны өзгертуге болады. «Жоқ» деген жауапты сыйлаймыз. Қорқыныш не қысым болса, сенімді ересекке айтамыз. Бүгінгі назарымыз: «Өз кеңістігімді айтамын». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Біреу сөмкеңді сұрамай ашты. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Біреу сөмкеңді сұрамай ашты. Құшақтасқың келмейді. Досың «жоқ десең ойнамаймын» деді. Бір бала сенің шекараңды білмей қалды. Бір жағдай саған ұнамады, бірақ айту қиын.", "path": "#/lesson/g04-t29"}, {"id": "g04-t30", "grade": 4, "topic": 30, "title": "Күнін және дерегін тексеремін", "direction": "Медиасауаттылық", "icon": "⌕", "search": "Күнін және дерегін тексеремін Медиасауаттылық «Күнін және дерегін тексеремін» тақырыбы арқылы факт мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ақпаратты бөліспес бұрын авторын, жарияланған күнін және бастапқы дерегін тексереміз. Сурет басқа оқиғаға қатысты болуы мүмкін. Пікір адамның бағасын білдіреді, ал фактіні тексеруге болады. Сенімді көрінген ЖИ мәтінінде де қате кездеседі. Бүгінгі назарымыз: «Күнін және дерегін тексеремін». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз. Өмірлік мысал: Досың ертең сабақ жоқ дегенді естіді. Ойлану бағдары: Мектептің ресми хабарын тексеру; расталмағанын таратпау. Досың ертең сабақ жоқ дегенді естіді. Суретте ерекше оқиға көрсетілген. «Бұл ең жақсы кітап» деген сөзді оқыдың. Хабар сені қорқытып, бірден жіберуді сұрады. Компьютер әдемі жауап жазды. Ол міндетті түрде рас па?", "path": "#/lesson/g04-t30"}];

$$('.quiz-option').forEach(button=>button.onclick=()=>{const box=button.closest('.quiz');box.querySelectorAll('.quiz-option').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const correct=Number(button.dataset.option)===Number(box.dataset.correct),result=box.querySelector('.quiz-result');result.hidden=false;result.textContent=(correct?'Орынды жауап. ':'Бұл таңдауды қайта қара. ')+result.dataset.explanation;});

form.addEventListener('submit',event=>{event.preventDefault();const selected=form.querySelector('input[name=confidence]:checked');if(!selected){toast('Алдымен өзіндік бағалау белгісін таңдаңыз.');return;}responses.push({confidence:selected.value,answers:[0,1,2].map(i=>$('#reflection-'+i).value.trim())});form.reset();showFeedback();toast('Анонимді жауап тіркелді. Келесі оқушы жауап бере алады.');});
$('#export-feedback').onclick=()=>{if(!responses.length){toast('Әзірге жауап жоқ.');return;}const title=$('.lesson-head h1').textContent;const text=title+'\nАнонимді кері байланыс\nЖауап саны: '+responses.length+'\n\n'+responses.map((r,i)=>'Жауап '+(i+1)+' · '+r.confidence+'\n'+r.answers.map((a,n)=>(n+1)+'. '+(a||'Ауызша жауап / мәтін жоқ')).join('\n')).join('\n\n');download(id+'-keri-bailanys.txt',text);toast('Кері байланыс файлы жүктеуге дайын.');};
$('#clear-feedback').onclick=()=>{responses=[];showFeedback();toast('Осы сессия жауаптары өшірілді.');};
function printDraft(){let p=$('#print-feedback');if(!p){p=document.createElement('div');p.id='print-feedback';p.className='print-feedback';$('#panel-reflection').appendChild(p);}p.innerHTML='<h3>Ағымдағы жауап үлгісі</h3>'+[0,1,2].map(i=>`<section><strong>${esc($('label[for="reflection-'+i+'"]').textContent)}</strong><div>${esc($('#reflection-'+i).value||'________________________________')}</div></section>`).join('');}
$('#print-lesson').onclick=()=>{printDraft();window.print();};window.onbeforeprint=printDraft;showFeedback();

window.setSingleTab=function(tab){const [route,query='']=location.hash.replace(/^#\//,'').split('?');const p=new URLSearchParams(query);p.set('tab',tab);history.replaceState(null,'','#/'+route+'?'+p.toString());};
function routeSingle(){const [path,query='']=location.hash.replace(/^#\//,'').split('?');const page=SINGLE_PAGES[path]||SINGLE_PAGES.home;const params=new URLSearchParams(query);window.SINGLE_QUERY=query;window.SINGLE_TAB=params.get('tab')||'intro';window.onbeforeprint=null;document.body.dataset.page=page.kind;document.body.dataset.grade=page.grade;document.body.dataset.lesson=page.lesson;document.body.dataset.root='';document.getElementById('main').innerHTML=page.html;document.title=page.title;initializeTarbie();window.scrollTo(0,0);const section=params.get('section');if(section&&document.getElementById(section))document.getElementById(section).scrollIntoView();}
window.addEventListener('hashchange',routeSingle);routeSingle();
