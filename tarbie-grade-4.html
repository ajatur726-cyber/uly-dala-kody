 топтық · 5 сұрақ · кері байланыс</p><span class=\"read-link\">Сабақты ашу →</span></a><a class=\"topic-card\" data-direction=\"Жеке шекара және өзара құрмет\" data-search=\"Өз кеңістігімді айтамын Жеке шекара және өзара құрмет\" data-id=\"g04-t29\" href=\"#/lesson/g04-t29\"><div class=\"card-top\"><span class=\"topic-icon\" aria-hidden=\"true\">☂</span><span class=\"tag\">29 / 30</span><span class=\"card-status\" data-status=\"g04-t29\"></span></div><span class=\"direction-label\">Жеке шекара және өзара құрмет</span><h3>Өз кеңістігімді айтамын</h3><p>5 жағдаят · жұптық · топтық · 5 сұрақ · кері байланыс</p><span class=\"read-link\">Сабақты ашу →</span></a><a class=\"topic-card\" data-direction=\"Медиасауаттылық\" data-search=\"Күнін және дерегін тексеремін Медиасауаттылық\" data-id=\"g04-t30\" href=\"#/lesson/g04-t30\"><div class=\"card-top\"><span class=\"topic-icon\" aria-hidden=\"true\">⌕</span><span class=\"tag\">30 / 30</span><span class=\"card-status\" data-status=\"g04-t30\"></span></div><span class=\"direction-label\">Медиасауаттылық</span><h3>Күнін және дерегін тексеремін</h3><p>5 жағдаят · жұптық · топтық · 5 сұрақ · кері байланыс</p><span class=\"read-link\">Сабақты ашу →</span></a></div><div class=\"empty\" id=\"class-empty\" hidden>Тақырып табылмады. Сүзгіні өзгертіңіз.</div>", "kind": "grade", "grade": "4", "lesson": "", "title": "4-сынып | Тәрбие әлемі"}, "lesson/g04-t01": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/4\">4-сынып</a><span> / </span><span>Адал азамат</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>✦</span><span>4-сынып · 01/30 · 40 минут</span></div><h1>Әділ бөлісу — жақсы әдет</h1><p>Адал азамат</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/4\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Әділ бөлісу — жақсы әдет» тақырыбы арқылы адалдық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Сенім» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Адалдық — өз әрекетің туралы шын айту және өзгенің еңбегін иемденбеу. Қателескен адам оны мойындап, түзете алады. Әділдік әр адамның үлесін және қажет қолдауын ескеруді талап етеді.</p><p>Бүгінгі назарымыз: «Әділ бөлісу — жақсы әдет». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз.</p><p>Өмірлік мысал: Еденнен қарындаш таптың. Иесі оны іздеп жүр. Не істейсің? Ойлану бағдары: Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу.</p><div class=\"concepts\"><span>Адалдық</span><span>Уәде</span><span>Әділдік</span><span>Сенім</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Қатені жасырмай, оны түзету — адал әрекет.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Еденнен қарындаш таптың. Иесі оны іздеп жүр. Не істейсің?</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Ойыншығыңды өзің сындырып алдың. Біреу басқа баланы кінәлады.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Өз әрекетін мойындау; кінәсіз адамды қорғау; түзету жұмысын келісу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Досыңа кітап әкелуге уәде бердің, бірақ ұмыттың.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұмытқанын айту; кешірім сұрау; орындалатын жаңа мерзім не балама ұсыну.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Екі бала сурет салды. Біреуі барлық мақтауды өзі алғысы келді.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Үлесті ашық көрсету; рұқсат пен дереккөзді белгілеу; өз еңбегін ажырату.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Үш балаға екі қарындаш қана бар. Қалай бөлісесіңдер?</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Түсінікті ортақ өлшем келісу; кезек не рөл ауыстыру; шешім себебін ашық түсіндіру.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Оқиға — адал шешім — сенімге әсері» карточкаларын жұптастырыңдар. Негізгі оқиға: табылған затты қайтару. Бірің себепті, екіншің салдарды анықтайсың. Бір-біріңді толықтырып, үш ұяшықты ортақ кесте құрыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу. Егер ..., онда ...; сондықтан ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Адал жұмыс келісімін құрыңдар: үлесті көрсету, қатені түзету және уәдені орындау туралы үш тармақ енгізіңдер. Хатшы, суретші, тексеруші, баяндамашы рөлдерін бөліңдер. Үш ережесі және бір мысалы бар постер жасаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Қатені жасырмай, оны түзету — адал әрекет.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Адал таңдау» атты үш кадрлы комикс жасаңдар: мәселе, таңдау, нәтиже. Үш қысқа сөйлем немесе суретпен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Шын айту не үшін маңызды? Жауапқа әрекет пен оның салдарын қос.</li><li>Қателікті қалай түзетуге болады? Жауапқа әрекет пен оның салдарын қос.</li><li>Біреудің еңбегін қалай құрметтейміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Тең бөлу мен әділ бөлудің айырмасы бар ма? Жауапқа әрекет пен оның салдарын қос.</li><li>Сенімді арттыратын бір әрекет қандай? Жауапқа әрекет пен оның салдарын қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Егер ..., онда ...; сондықтан ... . Қатені жасырмай, оны түзету — адал әрекет.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қатені жасырмай, оны түзету — адал әрекет. Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Әділ бөлісу — жақсы әдет»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 4-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Адал азамат» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Жауапқа әрекет пен оның салдарын қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Еденнен қарындаш таптың. Иесі оны іздеп жүр. Не істейсің?</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қатені жасырмай, оны түзету — адал әрекет.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Егер ..., онда ...; сондықтан ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Шын айту не үшін маңызды? Жауапқа әрекет пен оның салдарын қос.</li><li>Біреудің еңбегін қалай құрметтейміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Сенімді арттыратын бір әрекет қандай? Жауапқа әрекет пен оның салдарын қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>«Бір ой — бір дәлел — бір қадам» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Сенім» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қатені жасырмай, оны түзету — адал әрекет.\"></textarea><label for=\"reflection-1\">«Әділ бөлісу — жақсы әдет» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қатені жасырмай, оны түзету — адал әрекет.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Сенім» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><span class=\"muted\">Бірінші тақырып</span><a class=\"btn\" href=\"#/grade/4\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g04-t02\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "4", "lesson": "g04-t01", "title": "Әділ бөлісу — жақсы әдет | Тәрбие әлемі"}, "lesson/g04-t02": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/4\">4-сынып</a><span> / </span><span>Таза Қазақстан</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>♧</span><span>4-сынып · 02/30 · 40 минут</span></div><h1>Суды үнемдеуді үйренемін</h1><p>Таза Қазақстан</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/4\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Суды үнемдеуді үйренемін» тақырыбы арқылы тазалық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Ортақ орта» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Таза орта күнделікті ұсақ әрекеттерден құралады. Қалдықты азайту, суды ысырап етпеу және ортақ орынды ұқыпты пайдалану маңызды. Тазалық жұмысы қауіпсіз болуы керек; шыны мен белгісіз затты балалар жинамайды.</p><p>Бүгінгі назарымыз: «Суды үнемдеуді үйренемін». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз.</p><p>Өмірлік мысал: Қағаз жерде жатыр. Қасында қоқыс жәшігі бар. Ойлану бағдары: Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру.</p><div class=\"concepts\"><span>Тазалық</span><span>Үнем</span><span>Қалдық</span><span>Ортақ орта</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Тазалықты сақтаймын, қауіпті қалдықты ересекке көрсетемін.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Қағаз жерде жатыр. Қасында қоқыс жәшігі бар.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Краннан су ағып тұр. Жабуға ересектен көмек сұрай аласың.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ақауды ересекке хабарлау; өз бетімен жөндемеу; бастапқы және кейінгі өлшемді келісу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Ауладан сынған шыны көрдің.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жақындамау; орнын қауіпсіз қашықтан ескерту; жауапты ересекке хабарлау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Гүлді суардың. Досың сабағын жұлып ойнағысы келеді.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тірі өсімдікке зиян келтірмеу; күтім мен жауаптыны алдын ала келісу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Сурет қағазының бір жағы бос қалды.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қажеттілікті бағалау; бос жағын және бұрынғы материалды пайдалану; мақсатқа сай ресурс таңдау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Қағаз, су, ыдыс карточкаларына «азайтамын», «қайта қолданамын», «ересекке хабарлаймын» әрекетін сәйкестендіріңдер. Бірің себепті, екіншің салдарды анықтайсың. Бір-біріңді толықтырып, үш ұяшықты ортақ кесте құрыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру. Егер ..., онда ...; сондықтан ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Сыныптың қалдықты азайту картасын жасаңдар: бір мәселе, үш қауіпсіз әрекет, жауапты және тексеру белгісі. Хатшы, суретші, тексеруші, баяндамашы рөлдерін бөліңдер. Үш ережесі және бір мысалы бар постер жасаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Тазалықты сақтаймын, қауіпті қалдықты ересекке көрсетемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Бір заттың екінші өмірі» суретті нұсқаулығын жасаңдар. Қауіпті құрал қолданбаңдар. Үш қысқа сөйлем немесе суретпен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Тазалыққа кім жауапты? Жауапқа әрекет пен оның салдарын қос.</li><li>Қандай қалдықты өзің ұстауға болмайды? Жауапқа әрекет пен оның салдарын қос.</li><li>Суды қалай үнемдейміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Жаңа зат алмастан қандай шешім табамыз? Жауапқа әрекет пен оның салдарын қос.</li><li>Өзгерістің нәтижесін қалай байқаймыз? Жауапқа әрекет пен оның салдарын қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Егер ..., онда ...; сондықтан ... . Тазалықты сақтаймын, қауіпті қалдықты ересекке көрсетемін.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Тазалықты сақтаймын, қауіпті қалдықты ересекке көрсетемін. Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Суды үнемдеуді үйренемін»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 4-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Таза Қазақстан» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Жауапқа әрекет пен оның салдарын қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Қағаз жерде жатыр. Қасында қоқыс жәшігі бар.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Тазалықты сақтаймын, қауіпті қалдықты ересекке көрсетемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Егер ..., онда ...; сондықтан ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Тазалыққа кім жауапты? Жауапқа әрекет пен оның салдарын қос.</li><li>Суды қалай үнемдейміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Өзгерістің нәтижесін қалай байқаймыз? Жауапқа әрекет пен оның салдарын қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>«Бір ой — бір дәлел — бір қадам» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Ортақ орта» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Тазалықты сақтаймын, қауіпті қалдықты ересекке көрсетемін.\"></textarea><label for=\"reflection-1\">«Суды үнемдеуді үйренемін» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Тазалықты сақтаймын, қауіпті қалдықты ересекке көрсетемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Ортақ орта» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g04-t01\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/4\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g04-t03\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "4", "lesson": "g04-t02", "title": "Суды үнемдеуді үйренемін | Тәрбие әлемі"}, "lesson/g04-t03": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/4\">4-сынып</a><span> / </span><span>Заң мен тәртіп</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⚖</span><span>4-сынып · 03/30 · 40 минут</span></div><h1>Әділ ойын ережесі</h1><p>Заң мен тәртіп</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/4\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Әділ ойын ережесі» тақырыбы арқылы ереже мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Жауапкершілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Ереже адамдардың бірге қауіпсіз өмір сүруіне көмектеседі. Мектептің күнделікті ережесі мен мемлекет заңының қызметі бірдей емес. Түсініксіз талапты сұрақ қою және ұсыныс білдіру арқылы нақтылауға болады. Бұл сабақ нақты құқықтық кеңес бермейді.</p><p>Бүгінгі назарымыз: «Әділ ойын ережесі». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз.</p><p>Өмірлік мысал: Кезекте тұрсың. Досың алдыңа өтіп кетті. Ойлану бағдары: Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну.</p><div class=\"concepts\"><span>Ереже</span><span>Заң</span><span>Қауіпсіздік</span><span>Жауапкершілік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Тәртіптің мағынасын түсінемін, түсініксіз талапты нақтылаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Кезекте тұрсың. Досың алдыңа өтіп кетті.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Ойында бір бала ережені білмейді.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Талапты алдын ала түсіндіру; өзгерісті ашық келісу; әділ қарауды сұрау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Дәлізде жүгіруге досың шақырды.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысымға ермеу; қауіпсіз балама айту; рұқсатсыз қауіпті әрекет жасамау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Сыныптағы белгі саған түсініксіз.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Талаптың мақсаты мен қайдан алынғанын сұрау; мектеп құжаты мен ресми құқықтық деректі ажырату.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Кітапты орнына қою ережесін ұмытып кеттің.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қателікті түзету; алдын алу жолын келісу; жария масқаралауға жол бермеу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Ереже — ол қорғайтын жағдай» жұптарын құрыңдар: кезек, дәліз, кітапхана, ортақ құрал. Бірің себепті, екіншің салдарды анықтайсың. Бір-біріңді толықтырып, үш ұяшықты ортақ кесте құрыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну. Егер ..., онда ...; сондықтан ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Сынып ережесінің жобасын жасаңдар: мақсаты, орындалатын әрекет, сұрақ қою жолы және қайта қарау мерзімі. Хатшы, суретші, тексеруші, баяндамашы рөлдерін бөліңдер. Үш ережесі және бір мысалы бар постер жасаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Тәртіптің мағынасын түсінемін, түсініксіз талапты нақтылаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Ереженің артындағы қамқорлық» атты түсіндірме белгі әзірлеңдер. Үш қысқа сөйлем немесе суретпен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Ереже не үшін қажет? Жауапқа әрекет пен оның салдарын қос.</li><li>Ереже түсініксіз болса не істейміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Бәріне бірдей қолдану неліктен маңызды? Жауапқа әрекет пен оның салдарын қос.</li><li>Мектеп ережесі мен заңды қалай ажыратамыз? Жауапқа әрекет пен оның салдарын қос.</li><li>Қате жасалғанда қауіпсіз түзету қандай? Жауапқа әрекет пен оның салдарын қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Егер ..., онда ...; сондықтан ... . Тәртіптің мағынасын түсінемін, түсініксіз талапты нақтылаймын.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Тәртіптің мағынасын түсінемін, түсініксіз талапты нақтылаймын. Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Әділ ойын ережесі»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 4-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Заң мен тәртіп» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Жауапқа әрекет пен оның салдарын қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Кезекте тұрсың. Досың алдыңа өтіп кетті.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Тәртіптің мағынасын түсінемін, түсініксіз талапты нақтылаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Егер ..., онда ...; сондықтан ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Ереже не үшін қажет? Жауапқа әрекет пен оның салдарын қос.</li><li>Бәріне бірдей қолдану неліктен маңызды? Жауапқа әрекет пен оның салдарын қос.</li><li>Қате жасалғанда қауіпсіз түзету қандай? Жауапқа әрекет пен оның салдарын қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Бір ой — бір дәлел — бір қадам» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Жауапкершілік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Тәртіптің мағынасын түсінемін, түсініксіз талапты нақтылаймын.\"></textarea><label for=\"reflection-1\">«Әділ ойын ережесі» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Тәртіптің мағынасын түсінемін, түсініксіз талапты нақтылаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Жауапкершілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z020000345_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы баланың құқықтары туралы</a> · Әділет АҚЖ. Мәтіні ашылды; сабақтағы құқықтық мәдениетке жалпы тірек. Жеке жағдайға құқықтық кеңес емес. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g04-t02\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/4\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g04-t04\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "4", "lesson": "g04-t03", "title": "Әділ ойын ережесі | Тәрбие әлемі"}, "lesson/g04-t04": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/4\">4-сынып</a><span> / </span><span>Ұлттық мұраны қорғайық</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>❖</span><span>4-сынып · 04/30 · 40 минут</span></div><h1>Мақалдың мағынасын ашайық</h1><p>Ұлттық мұраны қорғайық</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/4\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Мақалдың мағынасын ашайық» тақырыбы арқылы мұра мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Дереккөз» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Мұраға тіл, өнер, дәстүр, тарихи орын мен тұрмыстық бұйым жатады. Оны сақтау — бүлдірмеу, мағынасын білу және дерегін бұрмаламай жеткізу. Бір бұйым туралы әртүрлі әңгіме болуы мүмкін; авторын және дереккөзін нақтылау пайдалы.</p><p>Бүгінгі назарымыз: «Мақалдың мағынасын ашайық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз.</p><p>Өмірлік мысал: Мұражайдағы ескі бұйымды ұстап көргің келді. Ойлану бағдары: Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану.</p><div class=\"concepts\"><span>Мұра</span><span>Тіл</span><span>Дәстүр</span><span>Дереккөз</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Мұраны құрметтеймін, дерегін тексеріп таныстырамын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Мұражайдағы ескі бұйымды ұстап көргің келді.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Оюлы бұйымның атауын білмейсің.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Білмегенін мойындау; мұғалім, кітап не маманнан нақтылау; болжамды факт деп бермеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Досың қазақша сөзді қате айтты.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Күлмеу; сыпайы көмектесу; мағына мен аударманы тексеру.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Басқа бала салған ою суретін өз атыңмен көрсеткің келді.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Авторын көрсету; қолдану шартын тексеру; рұқсатсыз пайдаланбау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Үлкен кісі ескі бұйымның тарихын айтқысы келеді.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тыңдау; жазба мен жариялауға бөлек келісім алу; адам таңдауын құрметтеу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Бұйым — қызметі — сақтау жолы» кестесін құрыңдар. Мысал: домбыра, сандық, оюлы киім. Бірің себепті, екіншің салдарды анықтайсың. Бір-біріңді толықтырып, үш ұяшықты ортақ кесте құрыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану. Егер ..., онда ...; сондықтан ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Шағын мұра көрмесін жоспарлаңдар: үш нысан, қысқа түсіндірме, дерек пен рұқсат белгісі. Хатшы, суретші, тексеруші, баяндамашы рөлдерін бөліңдер. Үш ережесі және бір мысалы бар постер жасаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Мұраны құрметтеймін, дерегін тексеріп таныстырамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Сандықтағы бір тарих» атты суретті әңгіме құрыңдар. Нақты дәйексөз ойдан қоспаңдар. Үш қысқа сөйлем немесе суретпен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Мұраға нелер жатады? Жауапқа әрекет пен оның салдарын қос.</li><li>Ескі бұйымды қалай сақтаймыз? Жауапқа әрекет пен оның салдарын қос.</li><li>Дәстүр мағынасын кімнен не қайдан білеміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Суретті қолданғанда авторды қалай көрсетеміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Мұраны таныстыруда қандай қателіктен сақтанамыз? Жауапқа әрекет пен оның салдарын қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Егер ..., онда ...; сондықтан ... . Мұраны құрметтеймін, дерегін тексеріп таныстырамын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Мұраны құрметтеймін, дерегін тексеріп таныстырамын. Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Мақалдың мағынасын ашайық»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 4-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Ұлттық мұраны қорғайық» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Жауапқа әрекет пен оның салдарын қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Мұражайдағы ескі бұйымды ұстап көргің келді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Мұраны құрметтеймін, дерегін тексеріп таныстырамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Егер ..., онда ...; сондықтан ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Мұраға нелер жатады? Жауапқа әрекет пен оның салдарын қос.</li><li>Дәстүр мағынасын кімнен не қайдан білеміз? Жауапқа әрекет пен оның салдарын қос.</li><li>Мұраны таныстыруда қандай қателіктен сақтанамыз? Жауапқа әрекет пен оның салдарын қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>«Бір ой — бір дәлел — бір қадам» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Дереккөз» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Мұраны құрметтеймін, дерегін тексеріп таныстырамын.\"></textarea><label for=\"reflection-1\">«Мақалдың мағынасын ашайық» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Мұраны құрметтеймін, дерегін тексеріп таныстырамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Дереккөз» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g04-t03\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/4\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g04-t05\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "4", "lesson": "g04-t04", "title": "Мақалдың мағынасын ашайық | Тәрбие әлемі"}, "lesson/g04-t05": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/4\">4-сынып</a><span> / </span><span>ДосболLIKE</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>♡</span><span>4-сынып · 05/30 · 40 минут</span></div><h1>Бірге шешім табайық</h1><p>ДосболLIKE</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/4\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Бірге шешім табайық» тақырыбы арқылы достық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Себеп, әрекет және салдар байланысын түсіндіреді.</li><li>«Ынтымақ» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Достық тыңдау, сенім және ерікті қолдауға сүйенеді. Дос болу барлық ұсынысқа келісу дегенді білдірмейді. Өз шекараңды айтып, өзгенің таңдауын сыйлауға болады. Қауіп төнсе, мәселені жалғыз шешуге міндетті емессің.</p><p>Бүгінгі назарымыз: «Бірге шешім табайық». Бір таңдаудың кейінгі салдары болуы мүмкін. Қысқа уақытта ыңғайлы көрінген әрекет бәріне пайдалы болмауы ықтимал. Әр шешімге «Кімге қалай әсер етеді?» деп сұрақ қоямыз.</p><p>Өмірлік мысал: Жаңа бала ойынға қосылмай тұр. Ойлану бағдары: Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.</p><div class=\"concepts\"><span>Достық</span><span>Тыңдау</span><span>Қолдау</span><span>Ынтымақ</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Досымды тыңдаймын, оның таңдауын сыйлаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Жаңа бала ойынға қосылмай тұр.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Екі бала бір ойын таңдамады.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Екі ойды тыңдау; ортақ өлшем не кезек ұсыну; адамды емес ұсынысты талқылау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Досың жалғыз отыр. Сөйлескісі келмеуі мүмкін.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Сөйлесуге рұқсат сұрау; құпиялықты сақтау; қауіп болса сенімді ересекке айту.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Досың саған ұнамайтын ойынға қатысуға шақырды.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Сыпайы бас тарту; себеп пен қауіпсіз балама ұсыну; қысымға келіспеу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Топтық суретті бір бала ғана салып жатыр.</p><p>Оқиғаның себебін және ықтимал салдарын жаз. Екі шешімнен біреуін таңдап, оның әсерін 2–3 сөйлеммен түсіндір.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Себеп, әрекет және салдар байланысын түсіндіреді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кезек пен рөл бөлу; әркімнің үлесін сұрау; ортақ шешімді ашық келісу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">
