шу →<\/a><a class=\"card\" href=\"#/grade-6/lesson-07.html\"><h2>7. Жасанды интеллектіні қауіпсіз пайдалану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-6/lesson-08.html\"><h2>8. Жалған ақпаратты қалай ажыратуға болады?<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-6/lesson-09.html\"><h2>9. Интернеттегі қауіпті қарым-қатынас белгілері 243 «Қауіпсіздік сабақтарын» өткізу жөніндегі әдістемелік ұсынымдар<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-6/lesson-10.html\"><h2>10. Қалалық инфрақұрылым және жасырын қауіптер<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-6/lesson-11.html\"><h2>11. Су мен мұздағы қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-6/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 218-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=218\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ          Төтенше жағдайлар қызметтері мен байланыс\n                 орталығының телефон нөмірлері\n  Мақсаты           Білім алушылардың қауіпті жағдайда қажетті\n                 жедел қызметті дұрыс таңдап, көмекке жүгіну\n                 дағдыларын қалыптастыру\n  Міндеттері        - жедел қызметтерге хабарласу тәртібі туралы\n                 білімдерін бекіту және оны жағдаятқа сай қолдануға\n                 үйрету;\n                    - қауіпті жағдайды бағалап, дұрыс әрі қауіпсіз\n                 шешім қабылдау дағдыларын дамыту;\n                    - жедел қызметтерге жауапкершілікпен жүгінуге\n                 және олардың жұмысына құрметпен қарауға\n                 тәрбиелеу.\n\n     Материалдар мен ресурстар\n     Жедел қызметтерді шақыру туралы тақырыптық бейнематериал,\n101, 102, 103, 104, 112, 111 жедел қызмет нөмірлері көрсетілген\nкарточкалар.\n     Сабақ барысы\n     Кіріспе бөлім\n     Педагог:\n     – Елестетіп көріңіздер: жаныңыздағы адамның денсаулығы\nкенеттен нашарлады. Оған бірінші болып сіз көмектесе аласыз. Қай\nнөмірге қоңырау шаласыз?\n     Білім алушылар қысқа жауап береді.\n     Педагог:\n     – Бүгін бірнеше секунд ішінде қажетті қызметті дұрыс таңдап,\nболған жағдай туралы нақты ақпарат бере аламыз ба, соны тексереміз.\n     Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады:\n      https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQtC74gi/view\n?usp=sharing\n\n     II. Негізгі бөлім\n     1-жаттығу. «Қажетті қызметті таңда».\n     Білім алушылар жұппен жұмыс істейді.\n     Әр жұпқа жағдаят ұсынылады. Білім алушылар жағдаятқа сәйкес\nқажетті қызмет нөмірін таңдайды.\n     Жағдаяттар:\n          өрт шықты;\n          адамның денсаулығы кенеттен нашарлады;\n\n            газдың иісі сезілді;\n            ұрлық жасау әрекеті байқалды;\n            бірнеше жедел қызметтің көмегі қажет.\n      Жауап бергеннен кейін білім алушылар өз таңдауының себебін\nтүсіндіреді.\n      2-жаттығу. «Диспетчермен сөйлесу».\n      Педагог жедел қызметке хабарласу алгоритмін еске салады:\n            не болды?\n            қай жерде болды?\n            кім қоңырау шалып тұр?\n      Білім алушылар жұппен жұмыс істейді.\n      Диспетчер:\n      – 103 қызметі. Тыңдап тұрмын.\n      Білім алушы:\n      – Атамның денсаулығы кенеттен нашарлады.\n      – Абай көшесі, 25-үй.\n      – Менің атым – Айбар.\n      Жаттығу аяқталғаннан кейін педагог қорытынды жасайды:\n      – Ақпарат неғұрлым нақты берілсе, көмек соғұрлым жедел\nкөрсетіледі.\n      3-жаттығу. «111 байланыс орталығы қандай жағдайда\nкөмектеседі?»\n      Педагог:\n      – 111 – қиын жағдайда жалғыз қалмауға көмектесетін нөмір. Егер\nсаған көмек керек болса немесе бір нәрсе мазаласа, осы нөмірге\nхабарласуға болады.\n      Жағдаят:\n      Сыныптасыңды үнемі басқа сынып оқушылары мазақтайды,\nбірақ ол бұл туралы ересектерге айтуға қорқады.\n      Білім алушылардың ықтимал жауаптары:\n      – Сынып жетекшісіне немесе мектеп психологіне, ата-анасына\nайтуға кеңес беремін.\n      – Қажет болған жағдайда 111 байланыс орталығына хабарласуға\nболады.\n       III. Қорытынды бөлім\n      «Ережені жалғастыр»\n            Егер қауіпті жағдай орын алса, мен... (көмекке жүгінемін).\n            Жедел қызметке қоңырау шалған кезде... (не болғанын, қай\nжерде болғанын және кім қоңырау шалып тұрғанын айтамын).\n            Егер маған қолдау қажет болса, бұл туралы... (ересек\nадамға айтып, көмекке жүгінемін).\n\n     Педагог:\n     – Ең басты ережені есте сақтаңыздар: «Үрейленбе – нақты\nхабарла – көмек ал!».\n     Қорытынды сұрақтар:\n     – 112 нөміріне қандай жағдайда қоңырау шаламыз?\n     – Диспетчерге қандай ақпарат береміз?\n     – 111 нөміріне қандай жағдайда хабарласуға болады?\n     – Неліктен жедел қызметтерге жалған қоңырау шалуға болмайды?\n\n                          Қосымша ақпарат\n       Нөмір / байланыс                          Қызмет\n112                             Бірыңғай жедел көмек қызметі\n101                             Өрт сөндіру қызметі\n102                             Полиция\n103                             Жедел медициналық жәрдем\n104                             Авариялық газ қызметі\n111                             Отбасы, әйелдер мен балалардың\n                                құқықтарын қорғау мәселелері жөніндегі\n                                «111» байланыс орталығы (тәулік бойы, 24/7)\nПсихологиялық қолдау            Психологиялық қиындықтар, қатты күйзеліс,\nорталығы (өңіріңіздегі байланыс мазасыздық, буллинг жағдайларында\nнөмірлері)                      психологиялық көмек пен қолдау көрсету\nБалалардың құқықтарын қорғау    Балалардың құқықтары мен заңды мүдделері\nбасқармасы (өңіріңіздегі        бұзылған, сондай-ақ қорғау мен көмек қажет\nбайланыс нөмірлері)             болған жағдайларда қолдау көрсету<\/div><p><a href=\"https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQtC74gi/view\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQtC74gi/view<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 1-сабақ — Ұлы дала коды"}, "grade-6/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Буллинг пен кибербуллинг кезінде кімге жүгіне аламын? 220 «Қауіпсіздік сабақтарын» өткізу жөніндегі әдістемелік ұсынымдар<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 220-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=220\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ            Буллинг пен кибербуллинг кезінде кімге\n                  жүгіне аламын?\n\n  Мақсаты            Білім алушыларға буллинг пен кибербуллинг\n                 белгілерін ажырата білуді және мұндай жағдайда\n                 қауіпсіз әрекет ету дағдысын қалыптастыру.\n  Міндеттері:       - буллинг пен кибербуллингтің белгілерін\n                 танып білуге үйрету;\n                    - қиын жағдайда өзін дұрыс ұстап, сенімді\n                 адамнан көмек сұрай білу дағдысын қалыптастыру;\n                    - өз     ісіне    жауапкершілікпен   қарауға,\n                 өзгелердің ар-намысы мен жеке шекарасын\n                 құрметтеуге баулу.\n\n      Материалдар мен ресурстар\n      Жағдаяттар жазылған карточкалар, тақта немесе экран.\n      I. Кіріспе бөлім\n      Педагог:\n      – Мектепте, аулада немесе интернетте адамдар кейде сөзге келіп,\nренжісіп қалуы мүмкін. Ондай жағдай көп ұзамай басылып, екі жақ\nтатуласуы да мүмкін. Ал кейде бір адамды әдейі қайта-қайта мазақтап,\nкемсітіп, қорқытып немесе ортадан шеттетіп жүреді.\n      Қалай ойлайсыңдар, жай ғана ренжісу мен буллингтің\nайырмашылығы неде?\n      Білім алушылар өз ойларын айтады.\n      Педагог түсіндіреді:\n      – Буллинг – бір адамды әдейі және қайта-қайта мазақтау, кемсіту,\nқорқыту немесе ортадан шеттету.\n      Егер мұндай әрекеттер әлеуметтік желіде, мессенджерде, ортақ\nчатта немесе онлайн ойында қайталанса, ол кибербуллинг деп\nаталады.\n      II. Негізгі бөлім\n      «Бұл қандай жағдай?» жаттығуы\n      Педагог жағдаяттарды оқиды. Білім алушылар олардың қайсысы\nжай келіспеушілік, қайсысы буллинг немесе кибербуллинг екенін\nанықтайды.\n      1-жағдаят\n      Екі сыныптас бір мәселе жөнінде келісе алмай, сөзге келіп қалды.\nБіраздан соң екеуі сөйлесіп, татуласты.\n      Жауап: келіспеушілік немесе жанжал.\n      2-жағдаят\n      Бір оқушыны бірнеше күн бойы қайта-қайта мазақтап,\nкелемеждеп, әдейі ортаға қоспай жүр.\n      Жауап: буллинг.\n\n      3-жағдаят\n      Ортақ чатта бір оқушы туралы үнемі қорлайтын сөздер жазып,\nоның суреттерін келемеждейтін пікірлермен таратып жүр.\n      Жауап: кибербуллинг.\n      4-жағдаят\n      Біреуден жеке хабарлама арқылы қорқытатын сөздер келіп, «бұл\nтуралы ешкімге айтпа» деп талап етеді.\n      Жауап: бұл – қауіпті жағдай. Хабарламаларды өшірмей сақтап,\nсенетін ересек адамға бірден айту керек.\n      Педагог:\n      – Егер буллингке немесе кибербуллингке тап болсаң, ашуға ерік\nберіп, қарсы жауап қайтаруға асықпа. Мұндай жағдайды жалғыз\nшешуге тырыспа.\n      Не істеу керек?\n      – Агрессияға агрессиямен жауап берме.\n      – Қорқытпа, балағат сөз жазба.\n      – Болған жағдайдың дәлелдерін өшірме.\n      – Егер бұл интернетте болса, хабарламалардың, пікірлердің\nнемесе суреттердің скриншотын сақтап қой.\n      – Қарым-қатынасты тоқтат.\n      – Мүмкін болса, әлгі адамды бұғатта.\n      – Болған жағдайды өзің сенетін ересек адамға айт: ата-анаңа,\nсынып жетекшіңе, мұғалімге немесе басқа сенімді адамға хабарла.\n      – Мектеп психологінен көмек сұра.\n      Мектеп психологі сені тыңдап, болған жағдайды бірге\nталқылауға және одан шығудың қауіпсіз жолын табуға көмектеседі.\n      – Қажет болса, басқа да көмекке жүгін.\n      Егер қорқып жүрсең, көңілің түссе немесе не істеріңді білмей\nқалсаң, мұның бәрін ішіңе бүгіп жүрме. Психологиялық қолдау\nорталығына хабарласуға немесе 111 нөміріне қоңырау шалуға болады.\nОнда сені тыңдап, көмек көрсетеді.\n      Педагог назар аударады:\n      – Егер біреуді мазақтап, қорлап жатқанын көрсең, оған қосылма.\nКүлме, келемеждеп пікір жазба, «лайк» баспа, хабарламаны өзгелерге\nтаратпа. Жәбірленген адамға қолдау көрсетіп, болған жағдайды ересек\nадамға айт.\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n      – Егер мені интернетте біреу қорласа, мен ...\n      – Егер біреуді мазақтап, қорлап жатқанын көрсем, мен ...\n\n      – Мектепте көмек керек болса, мен ... жүгіне аламын.\n      – Қиын жағдайда мен көмек сұрайтын адам – ...\n      Педагог қорытындылайды:\n      – Буллингке немесе кибербуллингке тап болсаң, оны жасырып\nқалма және жәбірлеуге агрессиямен жауап берме. Хабарламалар мен\nбасқа да дәлелдерді сақтап, сенетін ересек адамға айт. Мектепте сынып\nжетекшісінен, мұғалімнен немесе психологтан көмек сұрауға болады.\nҚажет болса, Психологиялық қолдау орталығына немесе 111 нөміріне\nхабарлас.\n      Сабақтың басты ережесі:\n      «Агрессияға агрессиямен жауап қатпа – дәлелді сақта –\nсенетін адамға айт – көмек сұра».<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 2-сабақ — Ұлы дала коды"}, "grade-6/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Қауіпті сілтемелер, хабарламалар және интернет- алаяқтық<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 223-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=223\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ          Қауіпті сілтемелер, хабарламалар және интернет-\n                алаяқтық\n  Мақсаты           Білім алушылардың қауіпті хабарламалар мен\n                сілтемелерді ажырата білу және интернет-алаяқтық\n\n                әрекеттеріне тап болған жағдайда қауіпсіз әрекет ету\n                дағдыларын қалыптастыру\n Міндеттері:       - фишинг белгілерімен және интернеттегі қауіпсіз\n                мінез-құлық ережелерімен таныстыру;\n                   - қауіпсіз шешім қабылдау дағдыларын дамыту;\n                   - жеке ақпаратты қорғауға жауапкершілікпен\n                қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Хабарламалар жазылған карточкалар, телефон макеті, «Қауіпсіз»\nжәне «Қауіпті» карточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Телефоныңызға мынадай хабарлама келді деп елестетіңіздер:\n      «Құттықтаймыз! Сіз жаңа смартфон ұтып алдыңыз. Сыйлықты\nалу үшін сілтемеге өтіңіз».\n      – Сілтемені бірден ашасыз ба?\n      – Бұл хабарламада сізді не күмәндандырады?\n      Білім алушылар өз болжамдары мен пікірлерін айтады.\n      Педагог:\n      – Бүгін біз интернет-алаяқтық белгілерін анықтауды және жеке\nдеректерімізді қорғауды үйренеміз.\n      II. Негізгі бөлім\n      1-жаттығу. Жағдаятты талда.\n      Білім алушылар жұппен жұмыс істейді.\n      Әр жұпқа жағдаят жазылған карточка беріледі. Білім алушылар\nжағдаятты талқылап, қауіпсіз шешімді анықтайды және өз таңдауын\nтүсіндіреді.\n      1-жағдаят\n      Онлайн ойын кезінде мынадай хабарлама келді:\n      «Сілтемеге өтіп, тегін ойын монеталарын ал».\n      Жауап:\n      – Сілтемеге өтпеу.\n      – Бұл туралы ересек адамға айту.\n      2-жағдаят\n      Мынадай хабарлама келді:\n      «Сіздің аккаунтыңыз бұғатталады. Құпиясөзіңізді шұғыл\nенгізіңіз».\n      Жауап:\n      – Құпиясөзді енгізбеу.\n\n      – Ақпараттың рас-өтірігін ересек адаммен бірге тексеру.\n      3-жағдаят\n      Анаңның дауысына ұқсас дауыспен басқа нөмірден мынадай\nаудиохабарлама келді:\n      «SMS арқылы келген кодты тез жібер».\n      Жауап:\n      – Кодты ешкімге бермеу.\n      – Анаңа өзің қоңырау шалып, ақпаратты нақтылау.\n      Педагог:\n      – Қазіргі кезде алаяқтар жасанды интеллектінің көмегімен\nжалған аудиожазбалар, фотосуреттер мен бейнелер жасай алады.\nСондықтан тек дауысқа немесе бейнеге сенуге болмайды. Кез келген\nәдеттен тыс немесе күмәнді өтініштің шынайылығын міндетті түрде\nтексеру қажет.\n      2-жаттығу. Қауіпті/қауіпсіз.\n      Педагог білім алушыларға бірнеше жағдаят ұсынады.\n      Әр жауаптан кейін білім алушылар өз таңдауының себебін\nтүсіндіреді.\n      Ата-анаң электронды күнделікке кіруге арналған сілтемені\nжіберді.\n      Бейтаныс адам құпиясөзіңді айтуды сұрады.\n      Досың сілтеме жіберіп, бұл туралы ешкімге айтпауды өтінді.\n      Бейтаныс адам бейнеқоңырау кезінде ата-анаңның банк картасын\nкөрсетуді сұрады.\n      Жаңа қосымшаны орнатпас бұрын ересек адаммен кеңестің.\n      3-жаттығу. Не деп жауап бересің?\n      Жағдаят\n      Айдосқа мессенджер арқылы «Қазпоштадан» деп көрсетілген\nхабарлама келеді:\n      «Сіздің атыңызға сәлемдеме келді. Жеткізуді растау үшін\nсілтемеге өтіңіз».\n      Айдос сілтемені ашпақ болғанда, артынша бейтаныс адам\nқоңырау шалып:\n      – Сәлемдемені алу үшін 1414 нөмірінен келген кодты айтып\nжібер, – дейді.\n      Айдосқа шынымен 1414 нөмірінен код келеді.\n      Сұрақтар:\n            Бұл жерде қандай қауіп белгілері бар?\n            Айдос сілтемені ашуы керек пе?\n            1414 нөмірінен келген кодты басқа адамға айтуға бола ма?\n            Мұндай жағдайда Айдос не істеуі керек?\n\n      Дұрыс әрекет:\n      Сілтемені ашпау, 1414-тен келген кодты ешкімге айтпау, әңгімені\nтоқтату және ақпаратты ресми арна арқылы тексеру. Қажет болса, бұл\nтуралы ата-анаға немесе сенімді ересек адамға айту.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады:\n      https://www.youtube.com/watch?v=gGAZaFs9DzI\n\n      III. Қорытынды бөлім\n      Педагог:\n      – Сұрақтарға жауап беріңіздер:\n      Интернет-алаяқтықты қандай белгілер арқылы анықтауға\nболады?\n      Неліктен күмәнді сілтемелерге, аудиожазбалар мен бейнелерге\nсенуге болмайды?\n      Күмән туындаған жағдайда не істеу керек?\n      Қысқаша жағдаят\n      Ойын кезінде бейтаныс адам сілтеме жіберіп, сол сілтемеге\nөтсең, тегін ойын бонустарын алатыныңды айтты.\n      Білім алушылардың ықтимал жауаптары:\n      – Сілтемеге өтпеу.\n      – Бұл туралы ересек адамға айту.\n      Педагог:\n      – Егер интернетте біреу сізді қорқытса, бопсаласа немесе болған\nжағдайды құпия сақтауды талап етсе, бұл туралы міндетті түрде сенетін\nересек адамға айтыңыз. Қажет болған жағдайда 111 байланыс\nорталығына хабарласуға болады.\n      Сөйлемді аяқта\n      «Егер сілтеме күмән тудырса, мен...»\n      «Егер маған көмек қажет болса, мен...»\n      Сабақтың негізгі ережесі\n      Тоқта. Тексер. Күмәнді сілтемелерді ашпа. Жеке деректеріңді\nешкімге берме. Күмәндансаң, ересек адамнан көмек сұра.\n\n\n\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=gGAZaFs9DzI\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=gGAZaFs9DzI<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 3-сабақ — Ұлы дала коды"}, "grade-6/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Ақшаңды не затыңды талап еткендегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 227-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=227\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ            Ақшаңды не затыңды талап еткендегі\n                  қауіпсіздік ережелері\n  Мақсаты             Білім алушылардың қорқыту, қысым көрсету\n                  немесе бопсалау арқылы ақша не зат талап ету\n                  жағдайларын танып, қауіпсіз әрекет ету дағдыларын\n                  қалыптастыру.\n  Міндеттері:         - бопсалаудың негізгі белгілерімен және\n                  қауіпсіз әрекет ету алгоритмімен таныстыру;\n                      - қауіпті жағдайды бағалау, қауіпсіз шешім\n                  қабылдау және көмекке жүгіну дағдыларын дамыту;\n                      - өз қауіпсіздігіне жауапкершілікпен қарауға\n                  және ересектерден көмек сұрауға сенімділігін\n                  қалыптастыру.\n\n      Материалдар мен ресурстар\n      Өмірлік жағдаяттар жазылған карточкалар, әрекет ету алгоритмі\nберілген карточкалар\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог екі хабарламаны көрсетеді.\n      1-хабарлама\n      «Маған 1000 теңге қарызға бере аласың ба? Ертең қайтарамын».\n      2-хабарлама\n      «Ертең ақша әкелесің. Біреуге айтсаң, өкінесің».\n      Педагог:\n            Бұл екі жағдаяттың айырмашылығы неде?\n            Қай жағдайда еш қауіптенбей бас тартуға болады?\n      Білім алушылар өз пікірлерін білдіреді.\n      Педагог:\n      – Егер адамды қорқыту, қоқан-лоқы көрсету немесе бопсалау\nарқылы ақшасын, телефонын, басқа да заттарын беруге не қандай да бір\nталапты орындауға мәжбүрлесе, бұл – қауіпті жағдай. Бүгін осындай\nжағдайда қалай қауіпсіз әрекет ету керектігін қарастырамыз.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады:\n      https://drive.google.com/file/d/1zSXqhB19iMYg24enCPqrBI4xTN9GUcHe/v\niew?usp=sharing\n      II. Негізгі бөлім\n      Жағдаятты анықта.\n      Білім алушылар жұппен жұмыс істейді.\n\n       Әр жұпқа жағдаят жазылған карточка беріледі. Білім алушылар\nжағдаятты талдап, не болғанын анықтайды.\n       1-жағдаят\n       Жоғары сынып оқушысы мектепте «тиіспей жүру» үшін апта\nсайын ақша талап етеді.\n       2-жағдаят\n       Сыныптасы хабарлама жазады:\n       «Құлаққабыңды бермесең, суретіңді мектептің чатына\nжариялаймын».\n       Педагог:\n       – Бопсалау әрдайым қорқыту, қысым көрсету немесе қоқан-лоқы\nжасаумен байланысты. Қазақстан Республикасында бопсалау\nқылмыстық құқық бұзушылық болып саналады. Бұл Қазақстан\nРеспубликасы Қылмыстық кодексінің 194-бабында көзделген. Заң\nәрбір адамды қорқытудан, бопсалаудан және ақша мен мүлікті заңсыз\nталап етуден қорғайды.\n       Жекелеген жағдайларда бопсалау үшін қылмыстық жауаптылық\n14 жастан басталады. Егер мұндай әрекетті осы жасқа толмаған бала\nжасаса, заңнамада көзделген жағдайларда оның ата-анасы немесе\nзаңды өкілдері жауапты болады. Заң талаптарын сақтау және басқа\nадамдардың құқықтарын құрметтеу – «Заң және тәртіп» қағидатының\nнегізі.\n       «Қалай қауіпсіз әрекет ету керек?»\n       1-қадам. Қауіпсіз жерге бар. Егер саған тікелей қауіп төніп\nтұрса, қарсыласпа және өзіңді қатерге тікпе. Мүмкіндік болса, адамдар\nкөп жерге барып, көмек сұра.\n       2-қадам. Мәселені өз бетіңше шешуге тырыспа. Қорқытқан\nадамға қарсы қоқан-лоқы жасама, онымен кездесуге келіспе және\nжағдайды жалғыз шешуге тырыспа.\n       3-қадам. Дәлелдерді сақта. Егер талап хабарлама арқылы келсе,\nоны өшірме, скриншот жаса. Оқиғаның қай жерде, қашан болғанын\nжәне оған кімдер қатысқанын есте сақта.\n       4-қадам. Ересек адамға айт. Болған жағдайды ата-анаңа, сынып\nжетекшіңе, мектеп психологіне немесе өзің сенетін басқа ересек адамға\nжасырмай айт.\n       Есіңде болсын: қорқыту немесе бопсалау жағдайын жалғыз\nшешудің қажеті жоқ. Көмек сұрау – қауіпсіз әрі дұрыс әрекет.\n       Егер саған қоқан-лоқы көрсетілсе немесе қысым жасалса,\nүндемей қалма. 111 байланыс орталығына хабарлас. Ондағы\nмамандар сені тыңдап, мәселенің шешімін табуға көмектеседі.\n\n      «Қалай әрекет етесің?»\n      Білім алушылар жұппен жұмыс істейді.\n      1-жағдаят\n      Сабақтан кейін жоғары сынып оқушысы:\n      «Ертең ақша әкелесің. Ешкімге айтпа», – дейді.\n      Білім алушылардың ықтимал жауаптары:\n           дауласпау;\n           қауіпсіз жерге бару;\n           болған жағдайды ересек адамға айту.\n      III. Қорытынды бөлім\n      Педагог сұрақ қояды:\n           Өтініш пен бопсалаудың айырмашылығы неде?\n           Егер біреу саған қоқан-лоқы жасаса, ең алдымен не істеу\nкерек?\n           Неліктен мұндай жағдайды жалғыз шешуге болмайды?\n      Педагог қорытындылайды:\n      – Егер біреу сені қорқытса, ақша немесе затыңды талап етсе, бұл\nжағдайды жасырма және жалғыз шешуге тырыспа. Саған тікелей қауіп\nтөніп тұрса, 102 нөміріне хабарлас. Ал қолдау, кеңес немесе бала\nқұқығын қорғауға байланысты көмек қажет болса, 111 байланыс\nорталығына жүгінуге болады.\n      Сабақтың басты ережесі\n      Менің қауіпсіздігім ақша мен кез келген заттан маңызды. Егер\nмаған қауіп төнсе, үндемей қалмаймын, көмек сұраймын және мәселені\nзаңды жолмен шешемін.\n\n\n\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1zSXqhB19iMYg24enCPqrBI4xTN9GUcHe/v\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1zSXqhB19iMYg24enCPqrBI4xTN9GUcHe/v<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 4-сабақ — Ұлы дала коды"}, "grade-6/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Түтін мен өрт қаупі кезіндегі қауіпсіз әрекет<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 230-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=230\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№5 сабақ         Түтін мен өрт қаупі кезіндегі қауіпсіз әрекет\nМақсаты           Білім алушылардың өрт шыққан немесе түтін\n              басқан жағдайда ахуалды жылдам бағалап, көмек\n              келгенге дейін қауіпсіз әрекет ету дағдыларын\n              қалыптастыру.\nМіндеттері:        - өрт шыққан және түтін басқан кездегі қауіпсіз\n              әрекет ету ережелерімен таныстыру;\n                   - қауіпсіз шешім қабылдау және дүрбелеңге бой\n              алдырмай әрекет ету дағдыларын дамыту;\n                   - өзінің      және       айналасындағылардың\n              қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Өмірлік жағдаяттар жазылған карточкалар, мектептің немесе\nғимараттың жоспары, «Қауіпсіз» және «Қауіпті» карточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог\n      – Мынадай жағдайды елестетіңіздер. Сабақ кезінде түтіннің иісін\nсездіңіздер, артынша өрт дабылы қосылды.\n      Ең алдымен не істейсіздер?\n      Қандай әрекеттер қауіпті болуы мүмкін?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог\n      – Өрт кезінде біз тек жалынды ғана қауіпті деп ойлаймыз.\nДегенмен адамдардың көбі түтіннің әсерінен немесе дұрыс әрекет\nетпеудің салдарынан зардап шегеді. Бүгін осындай жағдайда қауіпсіз\nәрекет етуді үйренеміз.\n      II. Негізгі бөлім\n      1-жаттығу. «Қалай әрекет етесің?»\n      Білім алушылар жұппен жұмыс істеп, қауіпсіз әрекет нұсқасын\nтаңдайды.\n      1-жағдаят\n      Мектептегі үзіліс кезінде түтіннің иісін сездіңіз.\n      Не істейсіз?\n      Болжамды жауаптар:\n            педагогке хабарлаймын;\n            түтіннің қайдан шығып жатқанын өзім іздемеймін;\n            сабыр сақтап, ересектердің нұсқауларын орындаймын.\n      2-жағдаят\n\n      Телефон қуатталып жатқанда күйген сымның иісі шығып, аздап\nтүтін пайда болды.\n      Не істейсіз?\n      Болжамды жауаптар:\n           құрылғыны пайдаланбаймын;\n           ересек адамға хабарлаймын;\n           қажет болған жағдайда 101 өрт сөндіру қызметіне\nхабарласамын;\n           ақауды өз бетімше жөндеуге тырыспаймын.\n      Талқылаудан кейін білім алушылар өз таңдауларын түсіндіреді.\n      Педагог\n      – Ең басты ереже – дүрбелеңге бой алдырмау және болған\nжағдайды дереу ересек адамға хабарлау.\n      Педагог      білім   алушыларға     тақырыпқа      қатысты\nбейнематериалды көруді ұсынады:\n      https://www.youtube.com/watch?v=4wp98C_phy4&amp;list=PLA5eCSY2FeoT00B\n3gyDuskOvkalEx7TmU&amp;index=11\n\n     https://www.youtube.com/watch?v=aejJBIedb7k&amp;list=PLA5eCSY2FeoT00B3g\nyDuskOvkalEx7TmU&amp;index=49\n      2-жаттығу. «Қауіпсіз бағытты таңда»\n      Педагог мектеп қабатының жоспарын көрсетеді.\n      Білім алушылар мына сұрақтарды талқылайды:\n          қай шығу жолын таңдау керек;\n          неліктен лифтіні пайдалануға болмайды;\n          қою түтін кезінде қалай қозғалу керек.\n      Талқылаудан кейін білім алушылар әрекет ету алгоритмін өздері\nқұрастырады.\n      Болжамды әрекет ету алгоритмі\n      1.    «Шығу» деген жасыл түсті бағыттау белгілеріне және\nэвакуация жоспарына назар аударыңыз. Олар қауіпсіз жолды жылдам\nтабуға көмектеседі.\n      2.    Есік жабық болса, оны ашпас бұрын тұтқасының ыстық\nемес екеніне көз жеткізіңіз.\n      3.    Қою түтін кезінде ауыз бен мұрынды матамен жауып,\nеңкейіп қозғалыңыз.\n      4.    Лифтіні пайдаланбаңыз және телефон, сөмке немесе басқа\nзаттарды алу үшін кері қайтпаңыз.\n      5.    Эвакуациядан кейін төтенше жағдайлар қызметі\nмамандарының рұқсатынсыз ғимаратқа қайта кірмеңіз.\n      Педагог білім алушылардың жауаптарын қорытындылайды.\n\n      3-жаттығу. «Қатені түзет»\n      Педагог өртке қатысты жағдаяттарды оқиды. Білім алушылар\nқатені тауып, дұрыс әрекет нұсқасын айтады.\n      Арман:\n      – Телефонымды алып шығу үшін тез кіріп, қайта шығамын.\n      Дұрыс әрекет: заттарды алу үшін кері қайтпай, қауіпсіз\nэвакуация бағытымен дереу шығу жолына қарай қозғалу.\n      Айару:\n      – Лифт жылдамырақ, лифтімен түсемін.\n      Дұрыс әрекет: лифтіні пайдаланбай, бағыттау белгілеріне және\nересектердің нұсқауларына сүйене отырып, баспалдақпен шығу.\n      Данияр:\n      – Одан да кабинетке тығылып қаламын.\n      Дұрыс әрекет: тығылып қалмай, қауіпсіз эвакуация жолымен\nғимараттан шығу және педагогтің немесе жауапты ересек адамның\nнұсқауларын орындау.\n      Білім алушылар қате әрекеттерді түзетіп, өз жауаптарын\nтүсіндіреді.\n      Одан кейін педагог төтенше жағдайда қолдануға болатын нақты\nсөз тіркестерін айтып жаттығуды ұсынады.\n            «Кабинеттен түтіннің иісі шығып тұр!».\n            «Өрт сөндіру қызметіне хабарласыңызшы».\n            «Барлығымыз сабыр сақтап, жақын жердегі шығу жолына\nқарай жүреміз».\n      Төтенше жағдайдағы «Заң және тәртіп» қағидаты – белгіленген\nережелерге сай әрекет ету және педагогтер мен құтқарушылардың\nнұсқауларын бұлжытпай орындау. Егер жағдай қауіпті болса, өз\nбетіңше әрекет етуге тырыспа және басыңды қатерге тікпе. Өрт\nбелгілерін байқасаң, дереу ересек адамға хабарлап, 101 немесе 112\nнөміріне қоңырау шал. Есіңде болсын: өрт кезінде әр секунд маңызды.\n      III. Қорытынды бөлім\n      Педагог\n      Неліктен түтін оттан да қауіпті?\n      Неліктен лифтіні пайдалануға болмайды?\n      Неліктен телефонды немесе сөмкені алу үшін кері қайтуға\nболмайды?\n      Рефлексия. «Ережені жалғастыр»\n      Білім алушылар кезекпен сөйлемдерді аяқтайды:\n      Егер мен түтіннің иісін сезсем,...\n      Егер эвакуация басталса, мен...\n      Егер досым заттарын алу үшін кері қайтқысы келсе, мен...\n\n      Сабақтың басты ережесі\n      Түтінді немесе отты байқасаң – 101 немесе 112 нөміріне қоңырау\nшалып, көмек шақыр, сабыр сақтап эвакуациялан, лифтіні пайдаланба,\nзаттарыңды алу үшін кері қайтпа және құтқарушылардың нұсқауларын\nорында.\n\n\n\n\nҚазақстан Республикасы Денсаулық\nсақтау министрлігі ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=4wp98C_phy4&amp;list=PLA5eCSY2FeoT00B\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=4wp98C_phy4&amp;list=PLA5eCSY2FeoT00B<\/a><\/p><p><a href=\"https://www.youtube.com/watch?v=aejJBIedb7k&amp;list=PLA5eCSY2FeoT00B3g\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=aejJBIedb7k&amp;list=PLA5eCSY2FeoT00B3g<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 5-сабақ — Ұлы дала коды"}, "grade-6/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Вейп пен электрондық темекінің зияны<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 234-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=234\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ          Вейп пен электрондық темекінің зияны\nМақсаты           Білім алушыларда вейптер мен электрондық\n              темекілерден саналы түрде бас тартудың тұрақты\n              дағдысын қалыптастыру.\nМіндеттері:      - вейптер    мен   электрондық    темекілердің\n              жасөспірімдер денсаулығына әсері туралы нақты\n              мәліметтермен таныстыру;\n                 - манипуляцияны ажырата білу және қауіпсіз\n              таңдау жасау дағдыларын дамыту;\n                 - өз денсаулығына және қауіпсіз өмір салтына\n              жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Жалған» және «Факт» деген жазуы бар карточкалар, өмірлік\nжағдаяттар жазылған карточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог бір реттік вейптің суретін көрсетіп, білім алушылардан\nбұл құрылғы туралы не білетіндерін сұрайды.\n      - Вейптерді неліктен ашық түсті, шағын етіп және жеміс-жидек\nнемесе тәттілердің хош иістерімен шығарады деп ойлайсыздар?\n      Мұндай дизайн кімдерге көбірек тартымды болуы мүмкін?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог\n      – Өндірушілер мұндай құрылғыларды жастарға тартымды етіп\nкөрсетуге тырысады. Алайда жарқын қаптаманың ар жағында\nойыншық емес, денсаулыққа зиян келтіретін құрылғы тұр. Бүгін\nосындай айла-тәсілдерге қалай алданып қалмауға болатынын\nталқылаймыз.\n      II. Негізгі бөлім\n      «Жалған ба, әлде факт пе?»\n      Педагог тұжырымдарды оқиды. Білім алушылар оның миф\nнемесе факт екенін анықтап, өз таңдауын түсіндіреді.\n      1-тұжырым\n      «Вейптен тек қауіпсіз бу шығады».\n      Жалған. Вейпті қолданғанда кәдімгі су буы емес, құрамында\nникотин және басқа да зиянды заттар болуы мүмкін аэрозоль түзіледі.\n      2-тұжырым\n      «Вейпті бір рет қана қолданып көрсең, ешқандай қауіп жоқ».\n      Жалған. Вейпті бір рет қолдануды қауіпсіз деп санауға болмайды.\nАл құрамындағы никотин бірінші реттен тәуелділік тудыруы мүмкін.\n\n      3-тұжырым\n      «Вейптің дәмі мен иісі жағымды болса, ол қауіпсіз деген сөз».\n      Жалған. Жағымды дәм немесе иіс аэрозоль құрамындағы\nзаттардың денсаулыққа қауіпсіз екенін білдірмейді.\n      Педагог қорытындылайды:\n      – Вейптің сыртқы көрінісі, дәмі мен иісі оның қауіпсіз екені\nтуралы жаңсақ түсінік қалыптастыруы мүмкін. Сондықтан өнімнің\nтартымдылығына емес, оның денсаулыққа келтіретін ықтимал зиянына\nмән беру маңызды.\n      «Заң және тәртіп» қағидаты\n      Қазақстан Республикасында вейп, никотин тұтынудың және\nоларға арналған сұйықтықтардың айналымына заңмен тыйым\nсалынған. Қазақстан Республикасы Қылмыстық кодексінің 301-1-\nбабында олардың заңсыз айналымы үшін жауаптылық көзделген.\nМұндай шаралар халықтың, әсіресе балалар мен жасөспірімдердің\nденсаулығын қорғау мақсатында қабылданған. Заң талаптарын сақтау\nжәне өз денсаулығына жауапкершілікпен қарау – «Заң және тәртіп»\nқағидатын ұстанудың көрінісі.\n       «Айла-тәсілді таны»\n      Білім алушылар жұппен жұмыс істейді.\n      Әр жұпқа бір жағдаяттан беріледі.\n      1-жағдаят\n      «Бір рет қана қолданып көрші. Ештеңе болмайды».\n      2-жағдаят\n      «Бәрі қолданып көрген. Кішкентай бала сияқты болма».\n      3-жағдаят\n      «Бұл темекі емес қой, мұнда хош иісті бу ғана бар».\n      Білім алушылар мына сұрақтарға жауап береді:\n      Әңгімелесуші қандай айла-тәсілді қолданып тұр?\n      Неліктен оның ұсынысына келіспеу керек?\n      Талқылаудан кейін жұптар өз жауаптарын таныстырады.\n      «Сенімді түрде бас тарту»\n      Бір білім алушы вейпті қолданып көруді ұсынады, екіншісі оған\nжауап береді.\n      Білім алушылар бас тартудың әртүрлі нұсқаларын қолданады.\n      «Жоқ, мен денсаулығымды таңдаймын».\n      «Маған бұл қызық емес».\n      «Мен денсаулығыма қауіп төндіргім келмейді».\n      «Мен «жоқ» деп айттым. Менің таңдауымды құрметтеуіңді\nсұраймын».\n\n      Жаттығудан кейін білім алушылар қай жауаптың неғұрлым нық\nәрі сенімді шыққанын және неліктен солай ойлайтынын талқылайды.\n      Педагог білім алушылардың назарын тақырыпқа арналған\nжаднамамен бейнероликке аударады:\n      https://drive.google.com/file/d/1dnfgzNk-P4jclys3B6vy7jlaUoop4_G-\n/view?usp=drive_link\n      https://www.youtube.com/watch?v=QJ1sYbKNBbo&amp;list=PLA5eCSY2FeoQL\nLocS-IEuEG9KjOrJzvPM&amp;index=38\n      Егер вейп қолданып көргеннен кейін басың айналса, жүрегің\nайныса, әлсіздік сезінсең, жүрегің жиі соқса немесе өзіңді жайсыз\nсезінсең:\n      ▪ бұл туралы дереу педагогке, ата-анаңа немесе басқа ересек\nадамға айт;\n      ▪ нақты не болғанын түсіндір;\n      ▪ өзіңді жайсыз сезінген жағдайда мәселені өз бетіңше шешуге\nтырыспа;\n      ▪ жағдайың қатты нашарласа, 103 нөміріне қоңырау шалып,\nжедел жәрдем шақыр.\n      III. Қорытынды бөлім\n      Педагог\n      Неліктен көбіне жасөспірімдерге вейпті қолданып көруге\nұсынады?\n      Айла-тәсілді қандай белгілері арқылы анықтауға болады?\n      Электронды темекі секілді зиянды әдеттерден бас тарту –\nәлсіздіктің белгісі ме?\n      Рефлексия. «Сөйлемді аяқта»\n      «Егер маған вейпті қолданып көруді ұсынса, мен...»\n      «Егер мені үгіттей бастаса, мен...»\n      «Егер мен вейпті қолданып көріп, өзімді жайсыз сезінсем,\nмен...»\n      «Көмек қажет болса, мен ... жүгіне аламын».\n      Сабақтың басты ережесі\n      Қысымға ерме, әрекетіңнің салдарын бағала және денсаулығыңа\nзиян келтіруі мүмкін нәрседен сенімді түрде бас тарт! Егер саған көмек\nнемесе қолдау қажет болса, өзің сенетін ересек адамға жүгін немесе 111\nбайланыс орталығына хабарлас.\n Қазақстан Республикасының Жасанды\n интеллект және цифрлық даму\n министрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1dnfgzNk-P4jclys3B6vy7jlaUoop4_G-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1dnfgzNk-P4jclys3B6vy7jlaUoop4_G-<\/a><\/p><p><a href=\"https://www.youtube.com/watch?v=QJ1sYbKNBbo&amp;list=PLA5eCSY2FeoQL\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=QJ1sYbKNBbo&amp;list=PLA5eCSY2FeoQL<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 6-сабақ — Ұлы дала коды"}, "grade-6/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Жасанды интеллектіні қауіпсіз пайдалану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 237-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=237\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 7 сабақ         Жасанды интеллектіні қауіпсіз пайдалану\n Мақсаты           Білім алушыларда жасанды интеллектіні\n               қауіпсіз және жауапкершілікпен пайдалану\n               дағдыларын қалыптастыру.\n Міндеттері:        жасанды интеллектінің мүмкіндіктері мен\n               оны пайдалануға байланысты қауіп-қатерлер\n               туралы түсінік қалыптастыру;\n                    ЖИ көмегімен жасалған ақпаратты тексеру\n               және дербес деректерді қорғау дағдыларын\n               дамыту;\n                    жасанды интеллектіні оқу барысында және\n               күнделікті өмірде жауапкершілікпен пайдалануға\n               тәрбиелеу.\n\n     Материалдар мен ресурстар\n     «Болады», «Тексеру керек», «Қауіпті» карточкалары, өмірлік\nжағдаяттар жазылған карточкалар, шынайы және ЖИ көмегімен\nқұрастырылған бірнеше сурет.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог бірі шынайы, екіншісі жасанды интеллект көмегімен\nжасалған екі суретті көрсетеді.\n      Педагог:\n      - Қай сурет шынайы деп ойлайсыздар? Оны анықтауға не\nкөмектесті?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог\n      – Жасанды интеллект шынайылыққа жанасатын мәтіндер,\nсуреттер, бейнематериалдар мен дауыстық жазбалар жасай алады.\nСондықтан интернеттен көрген немесе естіген ақпараттың бәрі бірдей\nшынайы бола бермейтінін есте ұстау маңызды. ЖИ технологияларын\nадамдарды алдау, олардың жеке деректерін немесе ақшасын иемдену\nмақсатында да пайдаланылуы мүмкін.\n      II. Негізгі бөлім\n      «Қауіпсіз шешім» жаттығуы\n      Педагог жағдаяттарды оқиды. Білім алушылар тиісті карточканы\nкөтереді:\n      Болады / Тексеру керек /Қауіпті\n      Әр жауаптан кейін бір білім алушы өз шешімін түсіндіреді.\n      1-жағдаят\n\n      Мессенджерге мынадай дауыстық хабарлама келді:\n      «Бұл әкең. Менің нөмірім ауысты. Тез арада ақша аудар».\n      Жауап: Қауіпті.\n      Қауіпсіз шешім: әкеңе бұрыннан білетін нөмірі арқылы қоңырау\nшалып, ақпараттың рас-өтірігін тексеру.\n      2-жағдаят\n      Сайт тегін аватар жасап беруді ұсынады және ол үшін фотосурет\nжүктеуді, үй мекенжайын және банк картасының деректерін енгізуді\nсұрайды.\n      Жауап: Қауіпті.\n      Қауіпсіз шешім: жеке деректерді енгізбеу және сайттан шығу.\n      3-жағдаят\n      Білім алушы ЖИ-ден жаңа тақырыпты түсіндіріп беруді сұрады,\nал үй тапсырмасын өзі орындады.\n      Жауап: Болады.\n      Педагог\n      – Жасанды интеллект оқуға көмектесе алады. Бірақ ЖИ\nжауаптарына сүйеніп шешім қабылдамау қажет.\n      4-жағдаят\n      Әлеуметтік желіде сенің сүйікті блогеріңнің аккаунтынан жабық\nтопқа қосылып, ойынға арналған тегін бонустар алуға шақыратын\nхабарлама келді. Бұған дейін блогер мұндай ұсыныстар жарияламаған\nжәне аккаунттың расталғанын көрсететін белгі жоқ.\n      Жауап: Қауіпті.\n      Қауіпсіз шешім: сілтемеге өтпеу, топқа қосылмау және жеке\nдеректерді бермеу. Аккаунт жалған болуы мүмкін, ал блогердің суреті,\nдауысы немесе хабарламалары ЖИ көмегімен өзгертілген болуы\nықтимал. Ақпаратты блогердің ресми парақшалары арқылы тексеріп,\nал күмән туындаса, сенетін ересек адамнан көмек сұрау керек.\n      «Ереже құрастыр» жаттығуы\n      Әр жұп жасанды интеллектіні қауіпсіз пайдалануға қатысты бір\nереже құрастырады.\n      Талқылаудан      кейін    педагог    жауаптарды      жинақтап,\nқорытындылайды.\n      Жасанды интеллектіні қауіпсіз пайдалану ережелері\n      Маңызды ақпаратты міндетті түрде тексер.\n      Жеке деректеріңді жариялама және бөгде адамға берме.\n      Фотосуретке, бейнежазбаға немесе дауыстық хабарламаға бірден\nсене берме.\n      ЖИ-ді оқуда тек көмекші құрал ретінде пайдалан.\n      Егер жағдай алаңдаушылық тудырса\n\n      Тоқта – өтінішті орындама, деректеріңді немесе ақша жіберме.\n      Тексер – егер хабарлама таныс адамның атынан келсе, онымен\nөзіңе бұрыннан белгілі басқа байланыс тәсілі арқылы хабарлас.\n      Таратпа – күмәнді фотосуреттерді, бейнежазбаларды және\nдауыстық хабарламаларды басқа адамдарға жіберме.\n      Айт – ата-анаңа, педагогке, мектеп психологіне немесе өзің\nсенетін басқа ересек адамға хабарла. Егер жағдай қорқытуға,\nбопсалауға немесе басқа да қиын жағдайға байланысты болса, 111\nбайланыс орталығына, 102-ге хабарласуға болады.\n      III. Қорытынды бөлім\n      Педагог\n           Неліктен ЖИ берген жауаптарға бірден сене беруге\nболмайды?\n           Чат-боттарға қандай деректерді бермеу қажет?\n           Егер келген хабарлама күмән тудырса, не істеу керек?\n      Білім алушылардың болжамды жауаптары\n           Сілтемеге өтпеймін.\n           Жеке деректерімді жібермеймін.\n           Ақпаратты тексеремін немесе ересек адамнан кеңес\nсұраймын.\n      Сабақтың басты ережесі\n      Ақпаратты тексер. Жеке деректеріңді қорға. Жасанды\nинтеллектіні тек көмекші құрал ретінде пайдалан.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 7-сабақ — Ұлы дала коды"}, "grade-6/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Жалған ақпаратты қалай ажыратуға болады?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 239-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=239\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 8 сабақ         Жалған ақпаратты қалай ажыратуға болады?\nМақсаты           Білім алушыларда жалған жаңалықтарды ажырата\n              білу және цифрлық ортада ақпаратпен қауіпсіз жұмыс\n              істеу дағдыларын қалыптастыру.\n\nМіндеттері:      - жалған     жаңалықтар      мен     шындыққа\n              жанаспайтын ақпараттың белгілерімен таныстыру;\n                 - ақпараттың    дұрыстығын      тексеру    және\n              дереккөздердің сенімділігін бағалау дағдыларын\n              дамыту;\n                 - цифрлық      ортада      ақпарат      таратуға\n              жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Сенемін», «Тексеремін», «Сенбеймін» карточкалары, түрлі\nхабарламалар жазылған карточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Мектеп чатына мынадай хабарлама келгенін елестетіңіздер:\n      «Шұғыл! Қалың қар жаууына байланысты ертең сабақ болмайды.\nБарлығына таратыңдар!».\n       Кейбір білім алушылар бұл хабарламаны басқаларға жіберді.\nКейін сабақтың тоқтатылғаны туралы ешқандай ресми хабарлама\nболмағаны анықталды.\n       Сұрақтар:\n            Бұл хабарламаның қандай тұстары күмән тудыруы тиіс?\n            Адамдар мұндай хабарламаға неліктен бірден сеніп қалуы\nмүмкін?\n            Оны басқаларға жібермес бұрын не істеу керек еді?\n       Білім алушылардың болжамды жауаптары:\n            Адамдар жалған ақпаратқа сеніп қалады.\n            Біреулер уақытын босқа жоғалтады.\n            Адамдарды алдауға болады.\n            Жалған ақпарат тез таралады.\n       Педагог\n       – Дұрыс. Кейде жалған жаңалықтар шынайы ақпараттан да\nжылдам таралады. Сондықтан жалған ақпаратты ажырату ғана емес,\nоның шынайылығына көз жеткізбей тұрып, хабарламаны өзгелерге\nтаратпау керек.\n       II. Негізгі бөлім\n       «Сенемін бе, әлде тексеремін бе?» жаттығуы\n       Педагог хабарламаларды оқиды. Білім алушылар тиісті\nкарточканы көтереді:\n       Сенемін / Тексеремін / Сенбеймін\n       Әр жауаптан кейін бір білім алушы өз шешімін түсіндіреді.\n\n       1-хабарлама\n       «Мектептің ресми сайтында спорттық жарыстың басқа күнге\nауыстырылғаны туралы хабарландыру жарияланды».\n       Жауап: Сенемін.\n       2-хабарлама\n       «Құттықтаймыз! Сен жаңа смартфон ұтып алдың. Сыйлықты\nалу үшін сілтемеге өтіп, банк картасының деректерін енгіз».\n       Жауап: Сенбеймін.\n       Қауіпсіз шешім: сілтемеге өтпеу, жеке немесе төлем деректерін\nенгізбеу. Күмәнді хабарлама туралы ересек адамға айту.\n       3-хабарлама\n       «Әлеуметтік желіде ертең қалада автобустар жүрмейді деп\nжазылған».\n       Дереккөз көрсетілмеген.\n       Жауап: Тексеремін.\n       4-хабарлама\n       «Қазгидрометтің ресми сайтында ертең жаңбыр жауатыны\nтуралы болжам жарияланды».\n       Жауап: Сенемін.\n       Не нәрсе күмән тудыруы тиіс?\n       ▪ «Шұғыл!», «Тек бүгін!», «Барлығына тарат!» деген сөздермен\nсені асықтырып, ойлануға уақыт бермейді.\n       ▪ Ақпараттың нақты немесе ресми дереккөзі көрсетілмеген.\n       ▪ Тегін сыйлық немесе ұтыс уәде етеді.\n       ▪ Белгісіз сілтемеге өтуді сұрайды.\n       ▪ Құпиясөзді, SMS арқылы келген кодты, банк картасының\nдеректерін немесе басқа да жеке ақпаратты беруді сұрайды.\n       ▪ Хабарлама қатты қорқыныш немесе дүрбелең тудырып, бірден\nәрекет етуді талап етеді.\n       Педагог\n       – Осындай белгілердің біреуі кездессе, бұл міндетті түрде\n«алдау» деген сөз емес. Бірақ хабарлама күмән тудырса, әрекет етуге\nасықпай, алдымен ақпаратты тексеру керек.\n       «Жаңалықты қалай тексеруге болады?» жаттығуы\n       Педагог жағдаят ұсынады.\n       Педагог\n       – Досың саған: «Шұғыл, барлығына тарата сал! Ертең барлық\nмектепте сабақ болмайды» деген хабарлама жіберді.\n       – Не істейсіздер?\n       Білім алушылар өз нұсқаларын ұсынады.\n       Педагог сыныппен бірге әрекет алгоритмін құрастырады.\n\n       Ақпаратты қалай тексеруге болады?\n       ТОҚТА – сілтемеге өтуге немесе хабарламаны таратуға асықпа.\n       ДЕРЕККӨЗ – ақпаратты кім жариялағанын анықта.\n       ТЕКСЕР – ақпараттың расталғанын ресми сайттан немесе басқа\nсенімді дереккөзден ізде.\n       ШЕШІМ ҚАБЫЛДА – егер ақпарат расталмаса, оны таратпа.\n       Егер хабарламада жеке деректеріңді, ақша, құпиясөз немесе\nSMS арқылы келген кодты жіберу сұралса, ештеңе жіберме және өзің\nсенетін ересек адамға айт.\n       «Заң және тәртіп» қағидаты\n       Қазақстан Республикасының заңнамасында жалған ақпаратты\nорналастыру мен тарату үшін әкімшілік, ал заңда көзделген\nжағдайларда көрінеу жалған ақпарат тарату үшін қылмыстық\nжауаптылық көзделген. Бұл нормалар Қазақстан Республикасының\nӘкімшілік құқық бұзушылық туралы кодексінің 456-2-бабында және\nҚазақстан Республикасы Қылмыстық кодексінің 274-бабында\nбелгіленген.\n       Сондықтан жаңалықты немесе хабарламаны өзгелерге жібермес\nбұрын, интернетте ақпарат жарияламас бұрын оның дұрыстығына көз\nжеткізу қажет. Ақпаратқа жауапкершілікпен қарау және заң\nталаптарын сақтау – «Заң және тәртіп» қағидатын ұстанудың көрінісі.\n       Педагог білім алушылардың назарын тақырыптық\nбейнероликке аударады:\n        https://www.youtube.com/watch?v=QbYkm8B-\nxI8&amp;list=PLA5eCSY2FeoTMEec8T451Um4EJpuikdqk&amp;index=27\n       III. Қорытынды бөлім\n       Рефлексия. «Басқаларға жібермес бұрын...»\n       Педагог білім алушыларға сөйлемдерді жалғастыруды ұсынады:\n       «Егер хабарлама «Шұғыл! Барлығына тарат!» деген сөздермен\nбасталса, мен...»\n       «Егер хабарламада белгісіз сілтеме болса, мен...»\n       «Егер ақпарат менің күмәнімді тудырса, мен...»\n       «Егер менен жеке деректерімді беруді сұраса, мен...»\n       Педагог қорытындылайды\n       – Интернеттегі әрбір хабарлама шындыққа сәйкес бола\nбермейді. Жалған ақпарат адамдарды алдау, жеке деректерін иемдену\nнемесе басқа да қауіпті әрекеттер жасау үшін пайдаланылуы мүмкін.\nСондықтан бірден сенуге, сілтемелерге өтуге немесе хабарламаны\nөзгелерге таратуға асықпа.\n\n       Сабақтың басты ережесі\n       «Хабарламаны таратуға асықпа. Алдымен дереккөзді тексер,\nсодан кейін шешім қабылда».\n\n\n\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=QbYkm8B-\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=QbYkm8B-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 8-сабақ — Ұлы дала коды"}, "grade-6/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Интернеттегі қауіпті қарым-қатынас белгілері 243 «Қауіпсіздік сабақтарын» өткізу жөніндегі әдістемелік ұсынымдар<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 243-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=243\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 9 сабақ       Интернеттегі қауіпті қарым-қатынас белгілері\n\nМақсаты          Білім алушыларда интернеттегі қауіпті қарым-\n              қатынас белгілерін ажырата білу және осындай\n              жағдайларда қауіпсіз әрекет ету дағдыларын\n              қалыптастыру.\nМіндеттері       - интернеттегі       қауіпті     қарым-қатынас\n              белгілерімен таныстыру;\n                 - хабарламаларды      талдау,   манипуляцияны\n              ажырату және қауіпсіз шешім қабылдау дағдыларын\n              дамыту;\n                 - цифрлық       ортада       өз    қауіпсіздігіне\n              жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Хат алмасу үзінділері жазылған карточкалар, «Қауіпсіз»,\n«Қауіпті», «Қарым-қатынасты тоқтату керек» карточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог\n      – Онлайн ойында бір адаммен танысқаныңызды елестетіңіздер.\nАлғашында бірге ойын ойнадыңыздар. Ол сізге деңгейлерден өтуге\nкөмектесті, қызығушылықтарыңыз туралы сұрады, жиі қолдау білдірді.\nБіраз уақыттан кейін ол:\n      «Маған сене аласың. Екеуіміз ғана сөйлесейік, хат\nалмасқанымызды ешкімге айтпайық», – деп жазды.\n      Сұрақтар:\n      Қарым-қатынаста не өзгерді?\n      Қандай сөздер күмән тудыруы тиіс?\n      Неліктен хат алмасуды құпия ұстауды сұрау қауіпті белгі болуы\nмүмкін?\n      Педагог\n      – Қауіпті қарым-қатынас әрдайым қорқытудан немесе оғаш\nөтініштен бастала бермейді. Кейде адам алдымен сенімге кіруге\nтырысады, содан кейін хат алмасуды құпия ұстауды, жеке деректерді\nнемесе фотосуреттерді жіберуді, жабық чатқа ауысуды немесе\nкездесуді ұсынады. Мұндай әрекеттер интернеттегі қауіпті қарым-\nқатынастың белгісі болуы мүмкін.\n      Педагог білім алушылардың назарын тақырыптық\nбейнероликке аударады:\n\n      https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-\nLvKn160Eh6m/view?usp=sharing\n      II. Негізгі бөлім\n      1-жаттығу. «Қауіпті белгіні тап»\n      Әр жұпқа хат алмасудан үзінді жазылған карточка беріледі.\n      Білім алушылар:\n            қай хабарламаның алаңдаушылық тудыратынын;\n            оның неліктен қауіпті екенін;\n            мұндай жағдайда қалай әрекет ету керекгін анықтайды.\n      1-карточка\n      «Сен өте қызық адамсың. Екеуіміздің хат алмасқанымызды\nешкімге айтпай-ақ қояйық».\n      Жауап: қауіпті белгі – қарым-қатынасты құпия ұстауды сұрау.\n      2-карточка\n      «Маған суретіңді жібер. Бұл тек екеуіміздің арамызда қалады».\n      Жауап: қауіпті белгі – фотосурет жіберуді және оны құпия\nсақтауды сұрау.\n      3-карточка\n      «Телефон нөміріңді айтсаң, саған ойында валюта сыйлаймын».\n      Жауап: қауіпті белгі – жеке ақпараттың орнына сыйлық ұсыну.\n      Талқылаудан кейін педагог қорытынды жасайды.\n      Қауіпті қарым-қатынастың алаңдататын белгілері\n      ▪ қысқа уақыт ішінде сенімге кіруге тырысады;\n      ▪ ата-анадан және басқа ересектерден қарым-қатынасты\nжасыруды ұсынады;\n      ▪ қайда тұратыныңды, қайда оқитыныңды және үйде қашан\nжалғыз қалатыныңды сұрайды;\n      ▪ фотосурет, бейнежазба немесе басқа да жеке деректерді\nжіберуді сұрайды;\n      ▪ сыйлық, ақша немесе ойын бонустарын ұсынады;\n      ▪ әңгімені жабық немесе басқа чатқа ауыстыруға тырысады;\n      ▪ қысым жасайды, кінәлі сезіндіруге тырысады, қорқытады\nнемесе бопсалайды;\n      ▪ ересектерге айтпай кездесуді ұсынады.\n      2-жаттығу. «Қалай әрекет ету керек?»\n      Педагог хабарламаларды оқиды. Білім алушылар қауіпсіз әрекет\nнұсқасын ұсынады.\n      Хабарлама:\n      «Ата-анаңа екеуіміздің хат алмасып жүргенімізді айтпа».\n      Қауіпсіз әрекет: қарым-қатынасты құпия ұстауға келіспеу, хат\nалмасуды тоқтату және бұл туралы ересек адамға айту.\n\n      Хабарлама:\n      «Суретіңді жібер, содан кейін мен де өз суретімді жіберемін».\n      Қауіпсіз әрекет: фотосурет жібермеу және қарым-қатынасты\nтоқтату.\n      Хабарлама:\n      «Сабақтан кейін кездеселік. Бірақ бұл туралы ешкімге айтпа».\n      Қауіпсіз әрекет: кездесуге келіспеу және бұл туралы дереу өзің\nсенетін ересек адамға айту.\n      «Тоқтат – сақта – бұғатта – айт» әрекет алгоритмі\n      ТОҚТАТ – қауіпті өтініштерді орындама және мұндай қарым-\nқатынасты жалғастырма.\n      САҚТА – хат алмасуды өшірме, экран суреттерін сақтап қой.\n      БҰҒАТТА – пайдаланушыны бұғаттап, шағымдану функциясын\nпайдалан.\n      АЙТ – ата-анаңа, педагогке, мектеп психологіне немесе өзің\nсенетін басқа ересек адамға хабарла.\n      Маңызды: егер сен фотосуретіңді немесе жеке деректеріңді\nжіберіп қойсаң не әлдебір өтінішке келісіп қойсаң, қорыққандықтан\nоның талаптарын әрі қарай орындама. Хабарламаларды сақтап, көмек\nсұра. Қорқыту немесе бопсалау жағдайында 111 байланыс\nорталығына, ал полиция көмегі қажет болса, 102 нөміріне хабарласуға\nболады.\n      III. Қорытынды бөлім\n      Рефлексия. «Мен қалай әрекет ету керектігін білемін»\n      Білім алушылар сөйлемдерді жалғастырады:\n      «Егер менен интернеттегі қарым-қатынасты ересектерден\nжасыруды сұраса, мен...»\n      «Егер мені қорқыта немесе бопсалай бастаса, мен...»\n      «Көмек қажет болса, мен ... жүгіне аламын».\n      Педагог қорытындылайды\n      – Қауіпті қарым-қатынас достық ниетпен басталуы мүмкін.\nСондықтан саған кім жазғанына ғана емес, сенен не сұрап отырғанына\nда назар аудару маңызды. Қарым-қатынасты құпия ұстауды, жеке\nдеректерді немесе фотосуреттерді жіберуді, кездесуді сұрау, сондай-ақ\nқысым көрсету мен қорқыту – қарым-қатынасты тоқтатып, көмек\nсұрауға негіз болатын белгілер.\n      Сабақтың басты ережесі\n      «Қауіпті өтініштерді орындама. Хат алмасуды сақта,\nпайдаланушыны бұғатта және ересек адамға айт. Көмек қажет болса,\n111 байланыс орталығына хабарлас».<\/div><p><a href=\"https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 9-сабақ — Ұлы дала коды"}, "grade-6/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Қалалық инфрақұрылым және жасырын қауіптер<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 247-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=247\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ      Қалалық инфрақұрылым және жасырын\n            қауіптер\nМақсаты         Білім алушыларда қала ортасындағы жасырын\n            қауіптерді байқай білу және қауіпсіз әрекет ету\n            дағдыларын қалыптастыру.\n\nМіндеттері:       - қала      инфрақұрылымындағы         жасырын\n              қауіптермен таныстыру;\n                  - ықтимал қауіптерді байқау және қауіпсіз шешім\n              қабылдау дағдыларын дамыту;\n                  - өз қауіпсіздігіне және айналасындағылардың\n              қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Жағдаяттар       жазылған     карточкалар, қала     ортасының\nфотосуреттері.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог\n      – Біз күн сайын өзімізге таныс көшелермен, аулалармен және\nжолдармен жүреміз. Алайда үйреншікті жерде де жағдай өзгеріп кетуі\nмүмкін: ашық құдық, үзілген электр сымы, құрылыс жұмыстары немесе\nбасқа да кедергілер пайда болуы ықтимал.\n      Педагог қала орталығының фотосуретін көрсетеді.\n      Сұрақ:\n      – Қандай ықтимал қауіпті орындарды немесе нысандарды\nбайқадыңыздар?\n      Білім алушылар ықтимал қауіптерді атайды.\n      Педагог\n      – Бүгін осындай қауіптерді дер кезінде байқауды, олардан\nқауіпсіз қашықтықта жүруді және олар туралы ересектерге дұрыс\nхабарлауды үйренеміз.\n      II. Негізгі бөлім\n      «Қауіпсіздік инспекторы» жаттығуы\n      Педагог білім алушыларды топтарға біріктіріп, қала ортасы\nбейнеленген фотосуреттерді немесе карточкаларды таратады: аула,\nкөше, құрылыс алаңы, теміржол өткелі, аялдама.\n      Топтық тапсырма. Суретті мұқият қарап:\n                  ықтимал қауіпті нысандарды немесе әрекеттерді\n      анықтау;\n                  жақындауға болмайтын орындарды белгілеу;\n                  байқалған қауіп туралы кімге хабарлау керектігін\n      анықтау.\n      Мысалы, суреттерде мыналар болуы мүмкін:\n                  ашық кәріз құдығы;\n                  үзілген электр сымы;\n                  өтуге тыйым салынған, қоршалған аймақ;\n\n                  трансформаторлық қосалқы станция маңында\n      жүрген балалар;\n                  теміржолды белгіленбеген жерден кесіп өтіп бара\n      жатқан адам;\n                  кіруге кедергі қойылмаған құрылыс алаңы;\n                  бүлінген жол белгісі.\n      Әр топ өзі анықтаған қауіптерді таныстырады. Қалған білім\nалушылар жауаптарды толықтыра алады.\n      Педагог қорытындылайды:\n      – Қала ортасындағы қауіп бірден байқала бермеуі мүмкін.\nСондықтан айналадағы жағдайды мұқият бағалау маңызды. Есте\nсақтаңыздар: қауіпті нысанға жақындауға, оның қауіпсіздігін өз\nбетіңше тексеруге немесе ақауды өзің жөндеуге тырысуға болмайды.\n      Практикалық тапсырма. «Қауіпсіз бағыт»\n      Педагог тақтаға «Мектеп – үй» бағытының шартты сызбасын\nорналастырады.\n      Бағытта мыналар белгіленген:\n      А – құрылыс алаңы арқылы өтетін қысқа жол;\n      Б – жаяу жүргіншілер жолындағы ашық құдық;\n      В – бағдаршаммен реттелетін жаяу жүргіншілер өткелі;\n      Г – теміржол;\n      Д – қауіпсіз айналма жол.\n      Топтар қауіпсіз бағытты белгілеп, басқа жолдардан неліктен бас\nтартқанын түсіндіреді.\n      Педагог\n      – Ең қысқа жол оның қауіпсіз екенін білдірмейді. Егер күнделікті\nжүретін бағытыңызда қауіп пайда болса, өзіңізді қатерге тіккеннен гөрі\nбасқа жолды таңдаған дұрыс.\n      Ата-анаңыз немесе басқа жақын ересек адамдар сіздің қайда бара\nжатқаныңызды және қай бағытпен жүретініңізді білгені маңызды. Егер\nжоспарыңыз немесе жүретін бағытыңыз өзгерсе, бұл туралы оларға\nміндетті түрде хабарлаңыз.\n      Ата-анамен алдын ала келісе отырып, қолданбадағы\nгеолокацияны бөлісу функциясын пайдалануға болады. Бұл олардың\nсіздің орналасқан жеріңізді біліп, қажет болған жағдайда жылдам\nкөмек көрсетуіне мүмкіндік береді.\n      Педагог білім алушылардың назарын тақырыптық\nбейнероликке аударады:\n\n     https://www.youtube.com/watch?v=EsZA6jSq5po&amp;list=PLA5eCSY2FeoT00\nB3gyDuskOvkalEx7TmU&amp;index=34\n      III. Қорытынды бөлім\n      Рефлексия. «Бір маңызды әрекет»\n      Педагог кезекпен үш суретті көрсетеді: ашық кәріз құдығы,\nүзілген электр сымы, қоршалған құрылыс алаңы.\n      Білім алушылар әр жағдаятта ең алдымен қандай әрекет жасау\nкеректігін жылдам айтады.\n      Педагог қорытындылайды:\n      – Қалада қауіпті байқаумен қатар дұрыс әрекет ету де маңызды.\nҚауіпті нысандарға жақындамаңыздар, ақауды өз бетіңізше түзетуге\nтырыспаңыздар, айналадағы адамдарға ескертіп, ересектерге\nхабарлаңыздар. Егер адамның өмірі мен денсаулығына тікелей қауіп\nтөнсе, 112 нөміріне қоңырау шалыңыздар.\n      Сабақтың басты ережесі\n      Қауіпті байқасаң – жақындама, өзгелерге ескерт және ересектерге\nхабарла.\n\n\n\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=EsZA6jSq5po&amp;list=PLA5eCSY2FeoT00\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=EsZA6jSq5po&amp;list=PLA5eCSY2FeoT00<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 10-сабақ — Ұлы дала коды"}, "grade-6/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>6-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-6/index.html\">← 6-сынып тақырыптары<\/a><article><h2>Су мен мұздағы қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 251-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=251\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№11 сабақ            Су мен мұздағы қауіпсіздік ережелері\nМақсаты              Білім алушыларда жазда және қыста су\n                 айдындары       маңында    қауіпсіз    жүріп-тұру\n                 дағдыларын қалыптастыру.\nМіндеттері:          - суда    және    мұз  үстіндегі    қауіпсіздік\n                 ережелерімен таныстыру;\n                     - қауіпсіз шешім қабылдау дағдыларын дамыту;\n                     - су   айдыны     маңында    қауіпті    жағдай\n                 туындағанда дұрыс әрекет етуге және дер кезінде\n                 көмек шақыруға үйрету.\n\n      Материалдар мен ресурстар\n      «Қауіпсіз» және «Қауіпті» карточкалары, су маңындағы және мұз\nүстіндегі жағдаяттар бейнеленген иллюстрациялар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог екі иллюстрацияны көрсетеді: бірінде жасөспірімдер\nсуға түсуге жабдықталмаған жерде шомылғалы жатыр, екіншісінде мұз\nқатқан су айдынын кесіп өтпек.\n      Педагог\n      – Бұл екі жағдайдың қандай ортақ тұсы бар? Қауіп неден\nтуындауы мүмкін?\n      Білім     алушылар    жауап     бергеннен     кейін   педагог\nқорытындылайды:\n      – Су айдыны жылдың кез келген мезгілінде сақтықты қажет етеді.\nЖазда қауіп судың тереңдігіне, ағысқа немесе су түбінің қандай екені\nбелгісіз болуына байланысты туындауы мүмкін. Қыста жұқа мұз қауіп\nтөндіреді. Бүгін осындай қауіптерді қалай байқауға және қауіпсіз\nәрекет етуге болатынын қарастырамыз.\n      Педагог білім алушылардың назарын тақырыптық\nбейнероликтерге аударады:\n      https://drive.google.com/file/d/1E1qqMgQYhsvEQtIz4nxCfHXlkoAIyjhy/vie\nw?usp=sharing\n      https://drive.google.com/file/d/11rcjk77uOiTiXNZmhOoTpCPTMPcx-\nN51/view?usp=sharing\n     II. Негізгі бөлім\n     «Ереже бұзушылықты тап» жаттығуы\n     Педагог су айдыны маңындағы жазғы және қысқы демалыс\nбейнеленген иллюстрацияларды көрсетеді. Білім алушылар қауіпті\n\nәрекеттерді анықтап, олардың қандай салдарға әкелуі мүмкін екенін\nтүсіндіреді.\n      Жазғы иллюстрацияда:\n      бала ересектердің қарауынсыз суда жүр;\n      жасөспірім бейтаныс жерде суға сүңгиді;\n      балалар бір-бірін суға итереді;\n      адам жағадан тым алысқа жүзіп кеткен;\n      балалар тік жардың маңында ойнап жүр.\n      Қысқы иллюстрацияда:\n      балалар мұз қатқан су айдынына шыққан;\n      бала мұздың беріктігін аяғымен тексеріп жатыр;\n      жасөспірімдер жолды қысқарту үшін қатып қалған су айдынын\nкесіп өтпек;\n      балалар мұздағы жарықтарға және ашық су көздеріне жақындап\nжүр.\n      Талқылаудан кейін педагог қорытындылайды:\n      – Қауіпті дер кезінде байқаса, оның алдын алу оңайырақ. Судың\nнемесе мұздың қауіпсіз екенін өз бетіңше тексеруге болмайды.\n      Су маңындағы қауіпсіздік ережелері\n            тек шомылуға рұқсат етілген және арнайы жабдықталған\nжерлерде шомылыңыздар;\n            су маңында ересектермен бірге болыңыздар;\n            бейтаныс жерде суға сүңгімеңіздер;\n            жағадан алысқа жүзіп кетпеңіздер;\n            бір-біріңізді суға итермеңіздер және қауіпті ойындар\nойнамаңыздар;\n            ауа райы қолайсыз болса, толқын күшейсе немесе ағыс\nқатты болса, суға түспеңіздер;\n            жағажайда жалға берілетін су скутерін, катамаранды\nнемесе басқа су көлігін ересектердің рұқсатынсыз пайдаланбаңдар;\n            батуттар мен су аттракциондарын пайдаланғанда\nбелгіленген қауіпсіздік ережелерін сақтаңдар және қызметкердің\nнұсқауын орындаңдар;\n            ақауы бар немесе қауіпсіздігіне күмән тудыратын\nқұрылғыны пайдаланбаңдар.\n      Мұз үстіндегі қауіпсіздік ережелері\n            ересектердің қарауынсыз мұз айдыны шықпаңыздар;\n            мұздың беріктігін аяқпен басып немесе секіріп\nтексермеңіздер;\n\n           жарықтарға, ойылған немесе еріген жерлерге және ашық\nсуға жақындамаңыздар;\n           мұз қатқан өзен-көлді қашықтықты қысқарту үшін\nпайдаланбаңыздар;\n           тек арнайы белгіленген мұз айдындарында сырғанаңдар;\n           ескерту және тыйым салу белгілеріне назар аударыңыздар.\n      Практикалық жұмыс. «Қауіпсіз көмек көрсет»\n      Педагог екі жағдаят ұсынады.\n      1-жағдаят. Су айдынының маңында серуендеп жүргенде, судағы\nадамға көмек қажет екенін байқадыңыз.\n      2-жағдаят. Қыста су айдыны маңында мұз үстінде қауіпті\nжағдайды байқап, көмек сұраған дауысты естідіңіз.\n      Педагог\n      – Осындай жағдайларда өз өміріңізге қауіп төндірмей, қалай\nдұрыс көмек көрсетуге болады?\n      Білім алушылар әрекет нұсқаларын ұсынады.\n      Әрекет ету алгоритмі\n      1. Өзіңді қатерге тікпе – суға өз бетіңше секірме және мұз үстіне\nжүгіріп шықпа.\n      2. Көмек шақыр – дереу ересектердің, құтқарушылардың немесе\nмаңайдағы басқа адамдардың назарын аудар.\n      3. 112 нөміріне қоңырау шал – не болғанын, зардап шеккен\nадамның қай жерде екенін айтып, жан-жағыңдағу белгілерді ата.\n      4. Нұсқауларды орында – төтенше қызмет диспетчерінің және\nересектердің нұсқауларын орында.\n      Педагог\n      – Адамға көмектесуге ұмтылу өте маңызды. Бірақ көмек\nкөрсетемін деп өз өміріңді қатерге тігуге болмайды. Ең басты міндет –\nмүмкіндігінше тез көмек шақыру.\n      Педагог\n      – Су айдындары маңындағы ескерту және тыйым салу белгілері,\nқоршаулар мен жүріп-тұру ережелері адамдардың қауіпсіздігі үшін\nорнатылады. Оларды елемеуге, тыйым салынған аумаққа кіруге немесе\nшомылуға рұқсат етілмеген жерде суға түсуге болмайды.\n      Белгіленген ережелерді сақтау – «Заң және тәртіп» қағидатын\nұстану, өз қауіпсіздігіңе және айналаңдағы адамдардың қауіпсіздігіне\nжауапкершілікпен қарауды білдіреді.\n      III. Қорытынды бөлім\n      Рефлексия. «Ережені жалғастыр»\n      Педагог сөйлемдерді бастайды, білім алушылар оларды\nаяқтайды.\n\n      Егер жанымда ересектер болмаса, мен... (су айдынына\nжақындамаймын.)\n      Өзен-көлдердегі сырғанауға рұқсат етілмеген мұз айдындарына...\n(оның үстіне шықпаймын.)\n      Егер адам қауіпті жағдайға тап болса, мен... (ересектерді көмекке\nшақырып, 112 нөміріне қоңырау шаламын.)\n      Сабақтың басты ережесі\n      Қауіпсіз екеніне сенімді болмасаң – жақындама. Өз өміріңді\nқатерге тікпе. Қауіпті жағдайда дереу ересектерді көмекке шақырып,\n112 нөміріне қоңырау шал.\n\n\n\n\n   7-СЫНЫПҚА   АРНАЛҒАН    «ҚАУІПСІЗДІК»\n   ТАҚЫРЫБЫНДАҒЫ САБАҚТАР ТОПТАМАСЫ<\/div><p><a href=\"https://drive.google.com/file/d/1E1qqMgQYhsvEQtIz4nxCfHXlkoAIyjhy/vie\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1E1qqMgQYhsvEQtIz4nxCfHXlkoAIyjhy/vie<\/a><\/p><p><a href=\"https://drive.google.com/file/d/11rcjk77uOiTiXNZmhOoTpCPTMPcx-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/11rcjk77uOiTiXNZmhOoTpCPTMPcx-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "6-сынып · 11-сабақ — Ұлы дала коды"}};const HOME="grade-6/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
