ақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-4/lesson-08.html\"><h2>8. Сен туралы жалған ақпарат тараса...<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-4/lesson-09.html\"><h2>9. Күмәнді хабарламалар мен сілтемелерден сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-4/lesson-10.html\"><h2>10. Иттен қалай сақтануға болады?<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-4/lesson-11.html\"><h2>11. Табиғат аясындағы қауіпсіздік шаралары<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-4/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 149-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=149\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ         Төтенше жағдайлар қызметтері мен байланыс\n               орталығының телефон нөмірлері\nМақсаты          Білім алушылардың жедел қызметтерді дұрыс\n               шақыру және қажетті ақпаратты хабарлау\n               дағдыларын қалыптастыру\nМіндеттері       - жедел қызметтердің телефон нөмірлері\n               туралы білімдерін бекіту;\n                 - қауіпті жағдайда жылдам әрі дұрыс әрекет ету\n               дағдыларын дамыту;\n                 - өзінің        және       айналасындағылардың\n               қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      төтенше жағдайлар бейнеленген карточкалар, 101, 102, 103, 104,\n111, 112 нөмірлері жазылған карточкалар, телефон макеті.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, мынадай жағдайды елестетіп көріңдер. Сендер аулада\nойнап жүріп, үйдің терезесінен түтін шығып жатқанын байқадыңдар.\nНемесе серуендеп жүрген кезде досың өзін нашар сезінді. Осындай\nжағдайда не істейсіңдер?\n      Білім алушылардың жауаптары. Педагог:\n      – Осындай жағдайларда абдырап қалмай, тез арада көмек шақыру\nөте маңызды. Ол үшін қай нөмірге қоңырау шалу керектігін және\nдиспетчерге қандай ақпарат айту қажет екенін білу керек.\n      II. Негізгі бөлім\n      1. «Құтқару қызметінің көмекшілері» жаттығуы\n      Педагог:\n      – Елестетіп көріңдерші, бүгін сендер құтқару қызметінің\nкөмекшілері болдыңдар. Сендердің міндеттерің – қай қызметке\nхабарласу керектігін анықтау.\n      Педагог 101, 102, 103, 104, 111, 112 нөмірлері жазылған\nкарточкаларды көрсетеді.\n      Содан кейін жағдайларды оқиды.\n      1-жағдаят\n      Серуен кезінде пәтердің терезесінен түтін шығып жатқанын\nкөрдіңдер. Сұрақ:\n      – Кімге қоңырау шалу керек?\n      Білім алушылардың жауабы:\n      – 101 – өрт сөндіру қызметі.\n\n      2-жағдаят\n      Ойын кезінде бала велосипедтен құлап, орнынан тұра алмай,\nқатты ауырсынуға шағымданды.\n      Білім алушылардың жауабы:\n      – 103 – жедел медициналық көмек.\n      3-жағдаят\n      Бейтаныс адамның басқа біреудің пәтерінің есігін ашуға\nтырысып жатқанын байқадыңдар.\n      Білім алушылардың жауабы:\n      – 102 – полиция.\n      4-жағдаят\n      Ас үйде газдың иісі пайда болды.\n      Білім алушылардың жауабы:\n      – 104 – авариялық газ қызметі.\n      Педагог:\n      – Егер сендерге көмек немесе қолдау қажет болса, 111 – балалар\nмен отбасыларға көмек көрсетудің бірыңғай мемлекеттік байланыс\nорталығына хабарласуға болады.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\nC74gi/view?usp=sharing\n      III. Қорытынды бөлім\n      Сұрақтар\n            Кез келген шұғыл көмекке шақыру үшін қай нөмірге\nқоңырау шалуға болады?\n            Диспетчерге ең алдымен қандай ақпаратты хабарлау керек?\n      Педагог:\n      – Шұғыл қызметтердің нөмірлерін білу және көмекке дұрыс\nқоңырау шала білу адамның өмірін сақтап қалуы мүмкін. Ең бастысы\n– дүрбелеңге түспей, сабырлы әрі анық сөйлеу.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 1-сабақ — Ұлы дала коды"}, "grade-4/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Ережеге қайшы әрекеттен бас тарту<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 151-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=151\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ            Ережеге қайшы әрекеттен бас тарту\nМақсаты             Білім алушылардың құрдастарының қысымына\n               қарсы тұру және дұрыс шешім қабылдау дағдыларын\n               қалыптастыру\nМіндеттері          - білім алушыларды ұсыныстан қауіпсіз түрде\n               бас тарту тәсілдерімен таныстыру;\n                    - өз бетінше дұрыс шешім қабылдау қабілетін\n               дамыту;\n                    - өз әрекеттері үшін жауапкершілік сезімін\n               тәрбиелеу.\n\n     Материалдар мен ресурстар\n     Өмірлік жағдаяттар жазылған карточкалар, бас тартуға арналған\nсөз тіркестері бар карточкалар, «Қауіпсіз шешім қабылдау\nалгоритмі» плакаты, «Иә» және «Жоқ» белгі карточкалары, жұптық\nжұмысқа арналған парақтар, түрлі түсті қарындаштар.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог:\n     – Кейде достарымыз немесе таныстарымыз ережеге қайшы\nнемесе қауіпті әрекет жасауға үгіттеуі мүмкін. Бүгін біз қауіпті\nұсыныстан қалай бас тартып, құрдастардың қысымына ермеуге\nболатынын үйренеміз.\n     II. Негізгі бөлім\n     Педагог түсіндіреді:\n     Әр адам қауіпті немесе өзі қаламайтын ұсыныстан бас тартуға\nқұқылы.\n           сабырлы түрде: «Жоқ, мен бұлай істемеймін» деп айт;\n           біреулер мазақ етсе де, өз шешіміңнен бас тартпа;\n           егер саған көрсетілетін қысым жалғаса берсе, ол жерден\nкет;\n           болған жағдайды ата-анаңа, педагогке, мектеп психологіне\nнемесе өзің сенетін басқа ересек адамға айт;\n           нағыз дос сені қауіпті әрі бұрыс әрекет жасауға\nмәжбүрлемейтінін есте сақта.\n     «Заң және тәртіп» қағидаты\n\n     «Заң және тәртіп» қағидаты заңды сақтау, ортақ ережелерді\nқұрметтеу және өз әрекетіңе жауапкершілікпен қарау дегенді білдіреді.\nЕрежелер мен заңдар қауіпсіздікті, әділдікті және тәртіпті сақтауға\nкөмектеседі.\n     Жағдай:\n     Сыныптастарың сабақтан қашуды немесе мектеп ережесін\nбұзуды ұсынды.\n     Дұрыс әрекет: қауіпті ұсыныстан бас тартып, ереже бұзуға\nараласпау.\n     Педагог:\n     – Есіңде болсын: өз шешімің бас тартпау – батылдық.\nҚауіпсіздікке немесе ережеге қайшы ұсынысқа «жоқ» деп айту – дұрыс\nшешім.\n     Жағдаят\n     Досың жолды белгіленбеген жерден кесіп өтуді немесе біреудің\nзатын рұқсатсыз алуды ұсынады.\n     Дұрыс шешім: ұсыныстан бас тарту, өз шешіміңді түсіндіру және\nдосыңды жол-көлік қозғалысының ережелерін сақтауға шақыру.\n     Педагог:\n     – Егер жағдайды өз бетіңше шеше алмасаң, 111 – балалар мен\nотбасыларға көмек көрсетудің бірыңғай мемлекеттік байланыс\nорталығына қоңырау шал. Онда сені мұқият тыңдап, қолдау көрсетеді\nжәне дұрыс шешім табуға көмектеседі.\n     Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\nhttps://www.youtube.com/watch?v=DycscArvAYw&amp;list=PLA5eCSY2FeoQLLocS-\nIEuEG9KjOrJzvPM&amp;index=2\n      III. Қорытынды бөлім\n      Рефлексияға арналған сұрақтар\n            Неліктен қажет кезде «жоқ» деп айта білу маңызды?\n            Көмек қажет болса, кімге жүгінуге болады?\n            Нағыз дос қандай әрекет жасайды?\n      Педагог:\n      – «Жоқ» деп айта білу – әлсіздік емес, жауапкершіліктің\nбелгісі. Өз қауіпсіздігің әрқашан басқаларға ұнаймын деген ниетіңнен\nмаңызды.<\/div><p><a href=\"https://www.youtube.com/watch?v=DycscArvAYw&amp;list=PLA5eCSY2FeoQLLocS-\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=DycscArvAYw&amp;list=PLA5eCSY2FeoQLLocS-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 2-сабақ — Ұлы дала коды"}, "grade-4/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Егер сені мазақтаса немесе ренжітсе...<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 153-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=153\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ        Егер сені мазақтаса немесе ренжітсе...\nМақсаты         Білім алушылардың мазақ ету, қорлау, буллинг және\n           жеке шекараны бұзу жағдайларын ажырата білу және\n           қауіпсіз әрекет ету дағдыларын қалыптастыру.\nМіндеттері      - «құрмет»,    «жеке шекара», «буллинг» және\n           «қауіпсіз қарым-қатынас» ұғымдарының мәнін түсіндіру;\n                - мазақ ету немесе қорлау жағдайында өз ойын нық\n           жеткізуге, жеке шекарасын қорғауға және қажет кезде\n           көмек сұрауға үйрету;\n                - өзгенің жеке шекарасын құрметтеуге, мазақ ету мен\n           қорлауға қосылмауға және сыйластыққа негізделген\n           қарым-қатынас жасауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Құрмет бағдаршамы» ойынына арналған өмірлік жағдаяттар\nжазылған карточкалар, рефлексияға арналған қағаз парақтары немесе\nстикерлер, түрлі түсті қарындаштар мен фломастерлер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, әр адам өзіне құрметпен қарағанын қалайды. Бірақ\nкейде балалар мазаққа, ренжітетін сөздерге, дөрекілікке немесе ойынға\nқоспау сияқты жағдайларға тап болады. Қалай ойлайсыңдар, біреуді\nмазақтаса немесе ренжітсе, ол өзін қалай сезінуі мүмкін?\n      Білім алушылардың жауаптары. Педагог:\n      – Әр баланың қауіпсіз ортада өмір сүруге, құрметке ие болуға\nқұқығы бар. Ешкім мазаққа, қорлауға немесе дөрекі қарым-қатынасқа\nтөзуге міндетті емес.\n      II. Негізгі бөлім\n      Әңгімелесу\n      Талқылауға арналған сұрақтар:\n            Құрмет дегеніміз не?\n            Неліктен басқа адамдарды мазақ етуге болмайды?\n            Ренжіген немесе мазаққа ұшыраған адамға қалай\nкөмектесуге болады?\n      Педагог:\n      – Егер біреуді үнемі балағаттаса, қорласа, мазақ етсе немесе әдейі\nортадан шеттетсе, бұл буллинг болып саналады. Мұндай әрекетке жол\nберуге болмайды.\n       «Құрмет бағдаршамы» ойыны\n      Жасыл – құрметпен қарым-қатынас жасау.\n\n      Сары – күмәнді жағдай.\n      Қызыл – жеке шекараны бұзу.\n      Жағдаяттар:\n           Қателесіп қалғаныңда досың сені қолдады.\n           Сыныптастары баланың сыртқы келбетін мазақтап жатыр.\n           Біреу дәлізде басқа баланы итеріп жіберді.\n           Досың сенің затыңды алу үшін рұқсат сұрады.\n           Баланы сыныптастары ойынға қоспайды.\n      Әр жағдаятты білім алушылармен бірге талқылау.\n      Дене және эмоционалды қауіпсіздік\n      Педагог:\n      – Жеке шекара тек біздің денемізге ғана қатысты емес, ол біздің\nсезімдерімізге де қатысты. Әр адам өзіне құрметпен қарауды талап\nетуге құқылы.\n      Әрбір баланың:\n      1.    «Жоқ» деп айтуға;\n      2.    Өзіне қатысты жағымсыз әрекеттерден бас тартуға;\n      3.    Мазақ пен дөрекілікке төзбеуге;\n      4.    Көмек сұрауға;\n      5.    Өзін қауіпсіз сезінуге құқығы бар.\n      Педагог:\n      – «Заң және тәртіп» қағидаты – заңды сақтау, ортақ ережелерді\nқұрметтеу және өз әрекетіңе жауапкершілікпен қарау. Бұл қағидалар\nадамдардың қауіпсіздігін сақтауға, әділ қарым-қатынас орнатуға және\nтәртіпті қамтамасыз етуге көмектеседі.\n      Кейде сыныптастарың біреуді мазақ етуге, оған ауыр сөз айтуға\nнемесе әдейі ортадан шеттетуге шақыруы мүмкін. Мұндай әрекеттерге\nқосылма, өзгені ренжітуге бағытталған ұсыныстан бас тарт.\n      Егер буллингке тап болсаң немесе басқа біреудің буллингке\nұшырағанын көрсең, бұл туралы ата-анаңа, сынып жетекшісіне, мектеп\nпсихологіне немесе өзің сенетін ересек адамға айт. Қажет болса, 111\nбайланыс орталығына хабарласып, көмек сұрауға болады.\n      Педагог білім алушылардың назарын тақырыптық постерге\nаударады.\n      https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026%\nD0%B3/%D0%9C%D0%B0%D1%82%D0%B5%D1%80%D0%B8%D0%B0%D0%B\nB%D1%8B%20%D0%BF%D0%BE%20%D0%A3%D0%9B%D0%91/%D0%A7%D0\n%B5%D0%BA%20-\n%20%D0%BB%D0%B8%D1%81%D1%82%D1%8B/WhatsApp%20Image%202026\n-08-28%20at%2015.20.29%20%2812%29.jpeg?mt=1787912860000\n      III. Қорытынды бөлім\n      Рефлексия\n\nПедагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n    «Бүгін мен... түсіндім»\n    «Егер мені ренжітетін болса, мен …»\n    «Егер басқа адамды ренжітіп жатқанын көрсем, мен …»<\/div><p><a href=\"https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026%\" target=\"_blank\" rel=\"noopener noreferrer\">https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026%<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 3-сабақ — Ұлы дала коды"}, "grade-4/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Ересектерге қайда баратыныңды ескертудің маңызы<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 156-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=156\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ               Ересектерге қайда баратыныңды ескертудің\n                маңызы\nМақсаты              Білім      алушылардың         өз     қауіпсіздігіне\n                жауапкершілікпен қарау дағдысын қалыптастыру.\nМіндеттері           - үйден   шығарда қайда баратынын, кіммен\n                болатынын және шамамен қашан оралатынын жауапты\n                ересектерге (ата-ана, заңды өкілі) хабарлауға үйрету;\n                     - жоспар өзгерген жағдайда ата-анасына дер кезінде\n                хабар беру дағдыларын дамыту;\n                     - өз қауіпсіздігіне жауапкершілікпен қарауға және\n                ата-анамен ашық қарым-қатынас жасауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Қауіпсіз әрекет ету алгоритмі жазылған «Тоқта – Ойлан –\nХабарла – Рұқсат сұра – Әрекет ет» карточкалары, қауіпсіз және қауіпті\nжағдайлар бейнеленген иллюстрациялар, рефлексияға арналған қағаз\nпарақтары немесе стикерлер, түрлі түсті қарындаштар немесе\nфломастерлер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, мынадай жағдайды елестетіп көріңдер: сабақтан кейін\nсендерге өздерің танитын жоғары сыныптың баласы немесе бейтаныс\nадам бірге күшік көруге, жаңа ойын алаңына баруға не дүкенге кіріп\nшығуға ұсыныс жасады. Мұндай жағдайда не істер едіңдер?\nЕресектерге ескертпей басқа жерге баруға бола ма?\n      Білім алушылардың жауаптары. Педагог:\n      – Кейде мұндай ұсыныс қызықты болып көрінуі мүмкін. Бірақ\nқайда баратыныңды ата-анаң білмесе, саған көмек қажет болғанда сені\nтабу қиынға соғады. Сондықтан үйден шығарда немесе жоспарың\nөзгерсе, ересектерге міндетті түрде хабарлап отыр.\n      II. Негізгі бөлім\n      Әңгімелесу\n      Неліктен ересектердің рұқсатынсыз кетуге болмайды?\n      1.     Ересектер баласының қай жерде жүргенін білуі керек.\n      2.     Қауіпті жағдай туындаса, ересектер баласына тезірек\nкөмектесе алады.\n      3.     Бейтаныс адамдар балаларды алдауы мүмкін.\n      4.     Бала адасып немесе жолынан жаңылуы мүмкін.\n      5.     Бейтаныс жерде қауіпті жағдай туындауы ықтимал.\n      Педагог:\n\n      – Адам мейірімді және сыпайы болып көрінсе де, ересектердің\nрұқсатынсыз онымен бірге ешқайда кетуге болмайды.\n      «Бола ма, болмай ма?» ойыны\n      Педагог білім алушыларға әртүрлі жағдаяттарды ұсынады.\n      Жағдаяттар:\n           Ересектердің рұқсатын алғаннан кейін достарымен\nсеруендеуге бару.\n           Бейтаныс адамның күшікті көруге бірге бару туралы\nұсынысына келісу.\n           Қайда бара жатқаныңды ата-анаңа хабарлау.\n           Бейтаныс адамның көлігіне отыру.\n           Жоспар өзгерсе, ересектерге ескерту.\n      Қауіпсіз әрекет болса – білім алушылар жасыл карточканы\nкөрсетеді. Ал қауіпті әрекет болса – қызыл карточканы көрсетеді.\n      Қауіпсіз әрекет ету алгоритмі «ТОҚТА – ОЙЛАН –\nХАБАРЛА – РҰҚСАТ СҰРА – ӘРЕКЕТ ЕТ – БАЙЛАНЫСТА\nБОЛ»\n      1.    ТОҚТА – сыныс сені қызықтырса да немесе ол адам саған\nтаныс болса да, оған бірден ілесіп кетпе.\n      2.    ОЙЛАН – ересектер қайда, кіммен және қанша уақытқа\nбаратыныңды біле ме? Бұл жер қауіпсіз бе?\n      3.    ХАБАРЛА – ересектерге сені қайда шақырғанын, кіммен\nбаратыныңды және қай жерде болатыныңды айт.\n      4.    РҰҚСАТ СҰРА – міндетті түрде ересектерден рұқсат ал.\nЕгер олармен байланысу мүмкін болмаса, ешқайда барма.\n      5.    ӘРЕКЕТ ЕТ – ересектермен алдын ала келіскен тәртіп\nбойынша әрекет ет. Оларға ескертпей, баратын жеріңді немесе\nбағытыңды өзгертпе.\n      6.    БАЙЛАНЫСТА БОЛ – телефоныңды қосулы ұста және\nересектердің қоңыраулары мен хабарламаларына жауап бер.\n      7.    ОРНАЛАСҚАН ЖЕРІҢМЕН БӨЛІС – ересектермен\nалдын ала келісіп, қолжетімді қосымшадағы геолокацияны бөлісу\nфункциясын қос. Бұл жауапты ересектерге сенің орналасқан жеріңді\nбілуге мүмкіндік береді.\n      8.    ӨЗГЕРІСТЕР ТУРАЛЫ ХАБАРЛА – егер жоспарың,\nбағытың, баратын жерің немесе үйге қайтатын уақытың өзгерсе, бұл\nтуралы міндетті түрде ата-анаңа хабарла.\n      III. Қорытынды бөлім\n      Талқылауға арналған сұрақтар\n           Неліктен ересектер баласының қай жерде жүргенін білуі\nкерек?\n\n           Егер сені ересектердің рұқсатынсыз бір жерге шақырса, не\nістеу керек?\n           Неліктен өз жоспарларың туралы ересектерге алдын ала\nескерту маңызды?\n           Көмек қажет болса, кімге жүгінуге болады?\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Бүгін мен түсіндім, …»\n           «Егер мені бір жерге шақырса, мен …»\n           «Менің қауіпсіздігім үшін маңыздысы – …»\n           «Көмек қажет болса, мен … жүгінемін».\n      Педагог:\n      – Естеріңде болсын: егер сендерді бір жерге шақырса, алдымен\nересектерден рұқсат сұрау керек. Бұл сендердің қауіпсіздіктеріңді\nсақтауға және жақындарыңның алаңдамауына көмектеседі.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 4-сабақ — Ұлы дала коды"}, "grade-4/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Төтенше жағдайдағы негізгі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 159-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=159\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 5 сабақ            Төтенше жағдайдағы негізгі қауіпсіздік\n                ережелері\nМақсаты              Білім алушылардың төтенше жағдайда қауіпті\n                бағалау, дұрыс шешім қабылдау және қауіпсіз әрекет\n                ету дағдыларын қалыптастыру.\nМіндеттері           - төтенше жағдайлардың негізгі түрлерін\n                ажырата білуге және олардың ықтимал қаупін\n                бағалауға үйрету;\n                     - төтенше жағдайда әрекет ету ретін анықтап,\n                қауіпсіз шешім қабылдау дағдыларын дамыту;\n                     - нұсқауларды орындауға, қажет кезде жедел\n                қызметтерге немесе ересектерге жүгінуге және өз\n                қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      төтенше жағдайлар және қауіпсіз әрекеттер мысалдары жазылған\nкарточкалар, «Қауіпті» / «Қауіпсіз» белгі карточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, кейде өмірде адамдардың денсаулығы мен\nқауіпсіздігіне қауіп төндіретін жағдайлар орын алады. Мұндай\nжағдайлар төтенше жағдайлар деп аталады. Өзіңе және айналаңдағы\nадамдарға көмектесу үшін мұндай кезде қалай дұрыс әрекет ету\nкеректігін білу өте маңызды.\n      Педагог сұрақ қояды:\n      – Қандай төтенше жағдайларды білесіңдер?\n      Білім алушылардың жауаптары. Педагог:\n      – Төтенше жағдайларға өрт, жер сілкінісі, су тасқыны, қатты жел,\nгаздың таралуы және басқа да қауіпті оқиғалар жатады.\n      II. Негізгі бөлім\n      «Қауіпсіз таңдау» ойыны\n      Педагог әртүрлі әрекеттерді атайды, ал білім алушылар олардың\nқауіпсіз немесе қауіпті екенін анықтап, тиісті карточканы көрсетеді.\n      Мысалдар:\n            Қауіп туралы ересектерге хабарлау.\n\n          Педагогтің нұсқауларын орындау.\n          Дүрбелеңге түсіп, айқайлау.\n          Ересектердің рұқсатынсыз жасырыну.\n          Шұғыл қызметке қоңырау шалу.\n          Эвакуация кезінде ұмыт қалған заттарды алу үшін қайта\nоралу.\n      Төтенше жағдай кезіндегі негізгі әрекет ету ережелері\n      1. Сабыр сақта\n      Дүрбелеңге түспе және айналаңдағы адамдарды да дүрбелеңге\nсалма.\n      2. Ересектерді тыңда\n      Ата-аналардың, педагогтердің, құтқарушылардың және полиция\nқызметкерлерінің нұсқауларын мұқият тыңдап, орында.\n      3. Қауіп туралы хабарла\n      Егер қауіпті жағдайды байқасаң, дереу ересек адамға хабарла.\n      4. Қауіпті жерден кет\n      Егер эвакуация жарияланса, қауіпсіз жерге қарай тез әрі сабырлы\nтүрде жүріп бар. «Шығу» жасыл түсті белгілеріне назар сал.\n      5. Көмекке шақыр\n      Егер эвакуация жарияланса, сабыр сақтап, көрсетілген бағытпен\nқауіпсіз жерге қарай жүр.\n      Педагог:\n      – Әрқайсың айналаңдағы ортаның тазалығы мен қауіпсіздігіне өз\nүлесіңді қоса аласыңдар. Қоқыс қалдырмаңдар, от жақсаңдар, оны\nміндетті түрде толық сөндіріңдер және табиғатқа ұқыпты қараңдар.\nЕстеріңде болсын: жауапты мінез-құлық өрттің және басқа да қауіпті\nжағдайлардың алдын алуға көмектеседі.\n       «Таза Қазақстан» бастамасының қағидаттарын ұстана\nотырып, біз табиғаттағы адам араласуынан болатын төтенше\nжағдайлардың алдын аламыз.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://www.youtube.com/watch?v=fJE2xBJNPHY&amp;list=PLA5eCS\nY2FeoT00B3gyDuskOvkalEx7TmU&amp;index=2\n      III. Қорытынды бөлім\n      Талқылауға арналған сұрақтар\n            Төтенше жағдай дегеніміз не?\n            Дүрбелеңге түсу керек пе?\n            Қауіп төнген кезде кімнің нұсқауларын тыңдау қажет?\n            Эвакуация кезінде заттарыңды алу үшін ғимаратқа кері\nқайтуға бола ма?\n\n           Құтқару қызметін шақыру үшін қай нөмірге қоңырау\nшалуға болады?\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n      «Егер қауіп туындаса, мен …»\n      «Төтенше жағдай кезінде … болмайды».\n      «Көмек қажет болса, мен … жүгінемін».\n      Педагог:\n      – Бүгін біз төтенше жағдай кезінде ең бастысы – сабыр сақтау,\nересектердің нұсқауларын мұқият тыңдау және қауіпсіздік ережелерін\nсақтау екенін білдік.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=fJE2xBJNPHY&amp;list=PLA5eCS\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=fJE2xBJNPHY&amp;list=PLA5eCS<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 5-сабақ — Ұлы дала коды"}, "grade-4/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Жарақат алғандағы алғашқы көмек<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 162-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=162\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ         Жарақат алғандағы алғашқы көмек\n Мақсаты          Білім алушылардың жеңіл жарақаттар кезінде\n              алғашқы көмек көрсетудің қарапайым дағдыларын\n              қалыптастыру\n Міндеттері       - білім алушыларды балаларда жиі кездесетін\n              жарақат түрлерімен таныстыру;\n                  - жарақат алған жағдайда дұрыс әрекет ету\n              алгоритмін үйрету;\n                  - зейінділікті, жауапкершілікті және қиын\n              жағдайда сабыр сақтай білу дағдыларын дамыту.\n\n      Материалдар мен ресурстар\n      Әртүрлі жарақат түрлері (сырылу, көгеру, жара) бейнеленген\nиллюстарциялар, алғашқы көмек көрсету бойынша жаднама.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, ойын кезінде, спортпен шұғылданғанда немесе\nсеруендегенде кейде жеңіл жарақаттар алуымыз мүмкін. Бала құлап,\nтерісін сырып алуы немесе бір жерін соғып алып жатады. Мұндай\nжағдайда қалай дұрыс әрекет ету керектігін және көмек сұрау үшін\nкімге жүгіну қажет екенін білу маңызды.\n      Әңгімелесу\n      Педагог сұрақ қояды:\n            Сырылу дегеніміз не?\n            Көгеру дегеніміз не?\n            Көмек алу үшін кімге жүгіну керек?\n      Білім алушылардың жауаптары. Педагог:\n      – Ең басты ереже – дүрбелеңге түспей, бірден ересек адамға\nхабарлау.\n      II. Негізгі бөлім\n      Педагог:\n      – Егер тері сырылып қалса…\n      Сырылу – терінің жоғарғы қабатының зақымдануы.\n      Мысалы: бала құлап, тізесін сырып алды.\n      Не істеу керек?\n\n     1.    Сабыр сақта.\n     2.    Ересек адамға хабарла.\n     3.    Жарақаттанған жерді таза сумен жу.\n     4.    Сырылған жерді ересек адамның көмегімен өңде.\n     5.    Қажет болса, жараны пластырьмен жап.\n     Егер көгеріп қалса…\n     Көгеру – соққыдан кейін тері зақымданбай пайда болатын\nжарақат.\n     Мысалы: қолын, аяғын немесе маңдайын соғып алу.\n     Не істеу керек?\n     1.    Ересек адамға хабарла.\n     2.    Матаға оралған салқын затты жарақаттанған жерге бас.\n     3.    Демалып отыр.\n     4.    Егер ауырсыну қатты болса, дәрігерге қарал.\n     Жағдаяттарды шешу\n     Педагог жағдаяттарға қатысты иллюстрацияларды көрсетеді.\n     1.    Бала тізесін сырып алды;\n     2.    Бала қолын соғып алды;\n     3.    Бала саусағын кесіп алды.\n     Білім алушылар дұрыс әрекеттерді атайды.\n      Қай кезде көмекке жүгіну керек?\n     1.    Тері сырылса, жеңіл жарақат алсаң немесе көгерсе, бұл\nтуралы ересек адамға айт.\n     2.    Егер қан тоқтамаса, қатты ауырса, ісіну күшейсе немесе\nжағдайың нашарласа, медициналық көмекке жүгіну керек.\n     3.    Жарақат ауыр болса немесе шұғыл көмек қажет болса, 103\nнөміріне қоңырау шал.\n     4.    Есіңде болсын: жарақатты жасырма. Ауыр жарақатты өз\nбетіңше емдеуге тырыспай, ересек адамнан немесе медицина\nқызметкерінен көмек сұра.\n       *Ескерту: Егер сабаққа медицина қызметкері қатысса, ол жарақат алған\nжағдайда қалай дұрыс әрекет ету керектігі жөнінде практикалық ұсынымдар\nберіп, алғашқы көмектің қарапайым тәсілдерін көрсетеді.\n     Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1WvB65-\nfQwf0pTejx5v0PdLD4t6Cur2Y3/view?usp=sharing\n      III. Қорытынды бөлім\n      Педагог талқылауға арналған сұрақтарды ұсынады:\n           Жарақат алған кезде ең алдымен не істеу керек?\n           Ауыр жарақатты өз бетіңше емдеуге бола ма?\n\n         Жедел    медициналық    жәрдемді      қай    нөмір    арқылы\nшақырады?\n     Педагог:\n     – Бүгін біз жеңіл жарақат алған кезде дұрыс әрекет етуді\nүйрендік. Естеріңде болсын: ең бастысы – сабыр сақтау, ересек\nадамнан көмек сұрау және өз денсаулығыңа жауапкершілікпен қарау.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1WvB65-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1WvB65-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 6-сабақ — Ұлы дала коды"}, "grade-4/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Бейтаныс адамдарға сурет жіберудің қаупі<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 165-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=165\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 7 сабақ         Бейтаныс адамдарға сурет жіберудің қаупі\nМақсаты           Білім алушылардың жеке фотосуреттері мен дербес\n              ақпараттарын қорғау және цифрлық ортада қауіпсіз\n              әрекет ету дағдыларын қалыптастыру.\nМіндеттері         білім алушыларды «жеке ақпарат» ұғымымен\n              таныстыру;\n                   фотосуреттердің неліктен дербес деректерге\n              жататынын түсіндіру;\n                   интернеттегі қауіпті өтініштерді ажырата білуге\n              үйрету.\n\n      Материалдар мен ресурстар\n      Өмірлік жағдаяттар бейнеленген карточкалар, «Қауіпсіз бе,\nқауіпті ме?» ойынына арналған жасыл және қызыл белгі карточкалары,\nинтернеттегі қауіпсіз және қауіпті қарым-қатынасты бейнелейтін\nиллюстрациялар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, көпшілігіміз суретке түскенді және фотосуреттерімізді\nдостарымызбен, жақындарымызбен бөліскенді ұнатамыз. Қалай\nойлайсыңдар, өздеріңнің фотосуреттеріңді жеке танымайтын\nадамдарға жіберуге бола ма?\n      Білім алушылардың жауаптары. Педагог:\n      – Фотосурет те жеке ақпараттың бір түрі. Әлеуметтік желіге\nжүктелген фотосуреттен адамның сыртқы келбеті ғана емес, кейде\nоның қай жерде жүргені, қайда оқитыны немесе немен айналысатыны\nтуралы да ақпарат білуге болады. Сондықтан фотосуретті жарияламас\nбұрын оның қандай мәліметті ашып көрсетуі мүмкін екенін ойлаған\nдұрыс.\n      II. Негізгі бөлім\n      Әңгімелесу\n      Неліктен фотосуреттерді бейтаныс адамдарға жіберуге\nболмайды?\n\n      1.    Экранның ар жағында кім отырғанын білмейміз.\n      2.    Фотосуреттерді рұқсатсыз сақтап, басқа мақсатта\nпайдалануы мүмкін.\n      3.    Бейтаныс адам интернетте өзін сенің құрдасың ретінде\nтаныстыруы мүмкін.\n      4.    Фотосуреттер интернетке тарап, басқа адамдарға\nқолжетімді болуы мүмкін.\n      Педагог:\n      – Шынайы достар және сенім артуға болатын ересектер баладан\nфотосуретті жасырын түрде немесе ата-анасының рұқсатынсыз\nжіберуді сұрамайды.\n      «Қауіпсіз бе, қауіпті ме?» ойыны\n      Педагог жағдаяттарды оқиды.\n      Жағдаяттар:\n           Ата-анаң экскурсиядан түскен фотосуретті жіберуді\nсұрады.\n           Педагог орындалған тапсырманың фотосын ата-анаң\nарқылы жіберуді сұрады.\n           Ойындағы бейтаныс адам фотосуретіңді жіберуді сұрады.\n           Бейтаныс адам фотосуретің үшін сыйлық беруге уәде етті.\n           Бейтаныс адам фотосурет жіберуді және бұл туралы\nешкімге айтпауды сұрады.\n      Егер жағдаят қауіпсіз болса – білім алушылар жасыл карточканы\nкөрсетеді, ал қауіпті болса – қызыл карточканы көрсетеді.\n      Педагог:\n      – Естеріңде болсын: интернетте фотосурет жібермес бұрын оны\nкімге және не үшін жіберетініңді ойлану маңызды. Егер бейтаныс адам\nсенен фотосурет сұраса, сыйлық ұсынса немесе «бұл туралы ешкімге\nайтпа» десе, фотосуретіңді жіберме. Бұл туралы өзің сенетін ересек\nадамға міндетті түрде айт.\n      Практикалық жаттығу\n      Педагог:\n      – Егер бейтаныс адам сенен:\n          фотосурет жіберуді;\n          бейнежазба түсіруді;\n          бейнеқоңырау арқылы бөлмеңді көрсетуді;\n          фотосурет жіберіп, бұл туралы ешкімге айтпауды сұраса,\n            не істеу қажет?\n      Білім алушылардың ықтимал жауаптары:\n      Фотосурет немесе бейнежазбаны жібермеу.\n      Бөлмені және жеке кеңістікті көрсетпеу.\n\n      Бейтаныс адамның өтінішін орындамау.\n      Қарым-қатынасты тоқтату.\n      Бұл туралы ата-анаға немесе өзің сенетін ересек адамға айту.\n      Егер жағдай қауіпті болып көрінсе, ересек адамның көмегіне\nжүгіну.\n      Білім алушылардың ықтимал жауаптары:\n      Бас тарту.\n      Фотосуреттерді жібермеу.\n      Ата-анаңа айту.\n      Пайдаланушыны бұғаттау.\n      Педагог:\n      – «Заң және тәртіп» қағидаты дербес деректермен жұмыс істеу\nкезінде Қазақстан Республикасының «Дербес деректер және оларды\nқорғау туралы» заң талаптарын сақтауды көздейді. Адамның\nрұқсатынсыз оның жеке ақпаратын басқа адамдарға беруге болмайды.\n      Жеке ақпаратқа адамның аты-жөні, үйінің мекенжайы, телефон\nнөмірі, ЖСН, фотосуреттері, құжаттарының деректері және адамға\nқатысты басқа да мәліметтер жатады.\n      Егер бейтаныс адам фотосурет жіберуді сұраса, қорқытса немесе\nбұл туралы ешкімге айтпауды талап етсе, міндетті түрде мектеп\nпсихологіне немесе өзің сенетін басқа ересек адамға айт. Көмек алу\nүшін 111 байланыс орталығына да жүгінуге болады.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1YjNFXGcqXuLLr50oRG7oAcuDucQaX1Px/vi\new?usp=drive_link\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Егер бейтаныс адам фотосуретімді сұраса, мен…»\n           «Менің қауіпсіздігім үшін маңыздысы…»\n           «Көмек қажет болса, мен … жүгінемін».\n      Талқылауға арналған сұрақтар\n           Неліктен фотосурет жеке ақпарат болып саналады?\n           Фотосуреттерді бейтаныс адамдарға жіберуге бола ма?\n           Фотосурет жібермес бұрын ата-анадан рұқсат сұрау қажет\nпе?\n           Егер бейтаныс адам фотосурет жіберуді сұраса, не істеу\nкерек?\n           Неліктен жеке деректерді қорғау маңызды?<\/div><p><a href=\"https://drive.google.com/file/d/1YjNFXGcqXuLLr50oRG7oAcuDucQaX1Px/vi\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1YjNFXGcqXuLLr50oRG7oAcuDucQaX1Px/vi<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 7-сабақ — Ұлы дала коды"}, "grade-4/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Сен туралы жалған ақпарат тараса...<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 168-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=168\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ          Сен туралы жалған ақпарат тараса...\nМақсаты           Білім алушылардың жалған ақпаратты ажырата\n              білу және өзі туралы жалған мәлімет таратылған\n              жағдайда дұрыс әрекет ету дағдыларын қалыптастыру.\nМіндеттері         ақпараттан ажырата білуге үйрету;\n                   өзі туралы жалған мәлімет тараған жағдайда\n              дәлелдерді сақтап, оны әрі қарай таратпай, сенімді\n              ересек адамнан көмек сұрау дағдыларын дамыту;\n                   өзгенің ар-намысы мен жеке шекарасын\n              құрметтеуге, тексерілмеген ақпаратты таратпауға\n              тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Талқылауға және топтық жұмысқа арналған өмірлік жағдаяттар\nбейнеленген иллюстрациялар, «Дұрыс шешім» ойынына арналған\nжасыл және қызыл карточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, кейде біреу басқа адам туралы шындыққа\nжанаспайтын сөз айтуы немесе жалған ақпарат таратуы мүмкін. Қалай\nойлайсыңдар, өзі туралы жалған ақпарат тарағанын білген адам өзін\nқалай сезінуі мүмкін?\n      Білім алушылардың жауаптары. Педагог:\n      – Мектептің чатында біреу сен туралы шындыққа жанаспайтын\nақпарат жазды деп елестетіп көріңдер. Басқа балалар бұл хабарламаны\nталқылап, бір-біріне тарата бастады. Сендер өздеріңді қалай сезінер\nедіңдер? Мұндай жағдайда не істер едіңдер?\n      Білім алушылардың жауаптары.\n      II. Негізгі бөлім\n      Әңгімелесу\n      Педагог:\n      – Әр адам құрметке және жақсы қарым-қатынасқа\nқұқылы. Өзгелер туралы жалған ақпаратты, өсек-аяңды немесе\nренжітетін хабарламаларды таратуға болмайды.\n      Егер сен туралы жалған ақпарат таратса, дүрбелеңге түсудің\nнемесе дөрекілікпен жауап берудің қажеті жоқ. Ең маңыздысы – сабыр\nсақтап, дұрыс әрекет ету.\n      Ойын «Дұрыс па, бұрыс па?»\n      Егер әрекет дұрыс болса – балалар жасыл карточканы көтереді,\nал егер бұрыс болса – қызыл карточканы көтереді.\n\n         Жағдаяттар:\n             Мәселе туралы ересек адамға айту.\n             Қарсы жауап ретінде балағат сөздер айту.\n             Жәбір көрген адамға қолдау көрсету.\n             Өсек-аяңды басқа адамдарға тарату.\n             Ақпаратты бөліспес бұрын оның дұрыстығын тексеру.\n             Басқалармен бірге адамды мазақ ету.\n         «Қалай әрекет ету керек?» жағдаяттық ойыны\n         1-жағдаят\n         Мектеп чатында білім алушы туралы жалған ақпарат жазылды.\n         Сұрақ: Бұл адамға қалай көмектесуге болады?\n         2-жағдаят\n         Саған сыныптасың туралы жалған ақпарат жазылған хабарлама\nкелді.\n      Сұрақ: Сен оны әрі қарай таратасың ба?\n      3-жағдаят\n      Біреу интернетте сен туралы жалған ақпарат жазды.\n      Сұрақ: Не істеу керек?\n      Есте сақта!\n           Интернеттен оқыған ақпараттың бәріне бірден сене берме.\n           Өсек пен қауесетті таратпа.\n           Дөрекілікке дөрекілікпен жауап берме.\n           Сабыр сақта.\n           Жағдай туралы міндетті түрде ересек адамға айт.\n           Қиын жағдайға тап болған адамға қолдау көрсет.\n      Әр адамның ар-намысы мен қадір-қасиетін қорғауға құқығы бар.\nСондықтан біреу туралы әдейі жалған ақпарат таратуға болмайды.\n      «Заң мен тәртіп» қағидаты – өз құқығыңды білу, өзгенің құқығын\nқұрметтеу және мәселені заңды жолмен шешу. Егер сен туралы жалған\nақпарат тараса, оған жауап ретінде өзің де біреуді қорлама немесе\nжалған ақпарат таратпа.\n      Егер сен туралы жалған ақпарат жазылса:\n           ашумен жауап берме және жанжалға араласпа;\n           жалған ақпаратты әрі қарай таратпа;\n           дәлелдерді сақта (мысалы, хабарламаның скриншотын\nтүсір);\n           болған жағдайды ата-анаңа, педагогке немесе өзің сенетін\nересек адамға айт.\n      Есте сақта: сенің құқығың бұзылса, мәселені жалғыз шешуге\nтырыспа. Көмек сұрау және мәселені заңды жолмен шешу – өз\n\nқұқығыңды қорғаудың дұрыс жолы. Қажет болса, 111 нөміріне\nхабарлас.\n     Педагог білім алушыларға   тақырыптық     постермен\nтанысуды ұсынады.\n      https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026%D0%\nB3/%D0%9C%D0%B0%D1%82%D0%B5%D1%80%D0%B8%D0%B0%D0%BB%D\n1%8B%20%D0%BF%D0%BE%20%D0%A3%D0%9B%D0%91/%D0%A7%D0%B5\n%D0%BA%20-\n%20%D0%BB%D0%B8%D1%81%D1%82%D1%8B/WhatsApp%20Image%202026-\n08-28%20at%2015.20.29%20%2817%29.jpeg?mt=1787912861000\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Егер мен туралы жалған ақпарат жазылса, мен…»\n           «Егер біреуді ренжітіп жатқанын көрсем, мен…»\n           «Бүгін мен … білдім».<\/div><p><a href=\"https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026%D0%\" target=\"_blank\" rel=\"noopener noreferrer\">https://thumb.cloud.mail.ru/weblink/thumb/xw1/dHRB/58bQrEgcp/2026%D0%<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 8-сабақ — Ұлы дала коды"}, "grade-4/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Күмәнді хабарламалар мен сілтемелерден сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 171-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=171\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№9 сабақ           Күмәнді хабарламалар мен сілтемелерден\n               сақтану\nМақсаты            Білім алушылардың күмәнді хабарламалар мен\n               сілтемелерді ажырата білу, оларды ашпау және\n               цифрлық ортада қауіпсіз әрекет ету дағдыларын\n               қалыптастыру.\nМіндеттері          күмәнді хабарламалар мен сілтемелердің негізгі\n               белгілерін анықтауға үйрету;\n                    хабарламаның мазмұнын тексеріп, асығыс\n               әрекет етпей, қауіпсіз шешім қабылдау дағдыларын\n               дамыту;\n                    жеке деректерді қорғауға, күмәнді сілтемелерді\n               ашпауға      және      интернеттегі     әрекеттеріне\n               жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Мессенджерлерден, электрондық поштадан және SMS\nхабарламалардан алынған хабарламалардың мысалдары (қауіпсіз және\nкүмәнді), топтық жұмысқа арналған кейстер жазылған үлестірме\nматериалдар, «Қауіпсіз бе, қауіпті ме?» ойынына арналған жасыл және\nқызыл карточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Бір ғана күмәнді сілтемені ашу телефондағы деректерге, жеке\nаккаунттарға немесе банк картасына қауіп төндіруі мүмкін. Сондықтан\nкез келген сілтемеге бірден өте салмай, алдымен оның сенімді екенін\nтексеру керек.\n      Бүгін біз күмәнді хабарламалар мен сілтемелердің белгілерін\nанықтап, оларды қалай тексеруге болатынын үйренеміз. Өзімізді нағыз\nкибер ізкесуші ретінде сынап көреміз!\n      II. Негізгі бөлім\n      Педагог білім алушылардан мессенджерге бейтаныс адамнан\nнемесе сыныптасынан мынадай мазмұндағы хабарламалардың келген-\nкелмегенін сұрайды:\n      «Осы хабарламаны 10 досыңа жіберсең, керемет нәрсе болады!»\nнемесе «Осы сілтеме арқылы сурет байқауында маған дауыс берші».\n      Педагог білім алушылардың жауаптарын тыңдайды. Педагог:\n      – Алаяқтар – адамдардың психологиясын жақсы білетін\nмамандар. Олар балалардың қандай нәрсеге қызығатынын және неге\n\nтез сенуі мүмкін екенін біледі. Ендеше, алаяқтар қолданатын 3\nнегізгі айла-тәсілді қарастырайық.\n      1. «Тегін сыйлық» айласы\n      «Осы сілтемені бас та, 5000 робукс немесе алмазды тегін ал!\nАкцияның аяқталуына 10 минут қалды!».\n      Мұндай хабарлама сені әдейі асықтыруы мүмкін. Мақсаты –\nсаған ойлануға және ақпаратты тексеруге уақыт бермеу.\n      2. «Досыңа көмектес» айласы\n      Кейде күмәнді хабарлама досыңның аккаунтынан келуі мүмкін.\nБірақ оның аккаунтына бөтен адам кіріп алған болуы ықтимал.\n      Мысалы:\n      «Сәлем! Байқауда маған дауыс берші. Мына сілтемеге кір: ...»\n      «Сәлем. Қарызға ақша бере тұршы. Кешке қайтарамын».\n      Егер мұндай хабарлама күмән тудырса, сілтемеге өтпе және\nқұпиясөзіңді енгізбе. Алдымен досыңа басқа жолмен хабарласып,\nхабарламаны шынымен өзі жібергенін тексер.\n      3. «Қорқыту» айласы\n      «Мұны 20 адамға таратпасаң, аккаунтың бұғатталады».\n      Мұндай хабарламалар қорқынышқа әсер етіп, адамды ақпаратты\nтексерместен автоматты түрде әрі қарай таратуға итермелейді.\n      Педагог:\n      – Естеріңде болсын: хабарлама қаншалықты қызықты, шұғыл\nнемесе қорқынышты болып көрінсе, соншалықты қауіпті болуы\nмүмкін. Тоқта – ойлан – тексер – содан кейін ғана әрекет ет.\n      Интернеттегі қауіпсіз әрекет. Кейстермен жұмыс\n      Педагог білім алушыларды 3 топқа біріктіреді. Әр топқа бір кейс\nберіледі.\n      Топтарға арналған тапсырма:\n      1.    Жағдаятты оқыңдар.\n      2.    Қауіптің неден туындағанын анықтаңдар.\n      3.    Кейіпкердің қандай қателік жібергенін табыңдар.\n      4.    Қауіпсіз әрекет ету үшін бұл жағдайда не істеу керектігін\nталқылаңдар.\n      5.    Интернеттегі     қауіпсіз    әрекеттің    бір    ережесін\nтұжырымдаңдар.\n      6.    Топтарыңның қорытындысын сыныпқа таныстырыңдар.\n      1-кейс\n      Аружанға «Фотосуретті көр!» деген мәтіні бар сілтеме жіберілді.\nОл сілтемеге кірмеді, бірақ оны құрбысына: «Мұнда не бар екенін\nтексеріп көрші», – деп жіберді.\n      2-кейс\n\n      Айданаға бейтаныс нөмірден: «Сәлем! Мен – сенің жаңа\nсыныптасыңмын. Сілтемеге өт, онда біздің бірге түскен\nфотосуреттеріміз бар», – деген хабарлама келді. Айдана сілтемеге өтіп,\nбелгісіз сайтқа тап болды.\n      3-кейс\n      Нұрәлиге: «Аккаунтыңды қорғау үшін SMS арқылы келген кодты\nжібер», – деген хабарлама келді. Нұрали бұл аккаунт қауіпсіздігі үшін\nқажет деп ойлап, кодты жіберді.\n      Талқылау\n      Тапсырманы орындағаннан кейін әр топ өз кейсін таныстырып,\nқауіптің неден туындағанын және кейіпкердің қалай қауіпсіз әрекет\nетуі керектігін түсіндіреді.\n      Педагогпен бірге білім алушылар интернеттегі қауіпсіз әрекеттің\nортақ ережелерін тұжырымдайды:\n            күмәнді сілтемелерге өтпеу және оларды басқа адамдарға\nжібермеу;\n            бейтаныс адамдармен интернетте абайлап қарым-қатынас\nжасау;\n            SMS арқылы келген кодтарды ешкімге жібермеу;\n            күмәнді хабарламалар туралы ата-анаға немесе өзің сенетін\nересек адамға айту.\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог:\n      – Балалар, неліктен әртүрлі хабарламалар мен жаппай\nтаратылатын хаттарға абай болу керек?\n      Білім алушылардың жауаптары.\n      Педагог:\n      – Сендер тапсырмаларды жақсы орындадыңдар! Естеріңде\nболсын: қорқытатын, асықтыратын немесе басқа адамдарға таратуды\nталап ететін хабарламаларды әрі қарай жібермеңдер. Мұндай\nхабарламаны алған жағдайда оны өшіріп, қажет болса ересек адамға\nкөрсетіңдер. Белгісіз сілтемелерге өтпеңдер және жеке деректеріңді\nешкімге бермеңдер.\n      Егер сендер сілтемеге өтіп қойсаңдар, жеке деректеріңді\nжіберсеңдер, сендерден ақша талап етсе, қорқытса немесе үрей\nтуғызса, мәселені өз беттеріңше шешуге тырыспаңдар және болған\nжағдайды жасырмаңдар.\n      Бірден ата-анаңа, педагогке, мектеп психологіне немесе өзің\nсенетін басқа ересек адамға айт. Қосымша көмек қажет болса, 111\nбайланыс орталығына жүгінуге болады.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 9-сабақ — Ұлы дала коды"}, "grade-4/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Иттен қалай сақтануға болады?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 174-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=174\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ          Иттен қалай сақтануға болады?\nМақсаты            Білім алушылардың иттермен жолыққан жағдайда\n              қауіпті бағалап, қауіпсіз әрекет ету дағдыларын\n              қалыптастыру.\nМіндеттері          итке немесе иттер тобына тап болған жағдайда\n              сақталатын қауіпсіздік ережелерін меңгерту;\n                    ит жақындаған кезде сабыр сақтап, қауіпсіз әрекет\n              ету ретін дұрыс таңдауға үйрету;\n                    жануарларға ізгілікпен қарауға, оларды әдейі\n              ашуландырмауға және өз қауіпсіздігіне жауапкершілікпен\n              қарауға тәрбиелеу.\n\n      Сабақ барысы\n      І. Кіріспе бөлім\n       Педагог:\n      – Сендер көшеде келе жатып итті жолықтырдыңдар. Ол сендерге\nқарай жақындап келеді. Қай әрекет дұрыс?\n      Жүгіріп қашу.\n      Итке айқайлау.\n      Сабыр сақтап, кенет қимыл жасамау.\n      Бүгін біз осы жауаптардың қайсысы қауіпсіз екенін және с ит\nкездескенде қалай әрекет ету керектігін үйренеміз.\n      II. Негізгі бөлім\n      Педагог:\n      – Иттің қимыл-қозғалысы оның өзін қалай сезініп тұрғанын\nаңғаруға көмектеседі.\n      Педагог карточкаларды көрсетеді:\n      1. Ит тыныш тұр\n      Құйрығы төмен түсіп тұрады немесе баяу қозғалады, құлақтары\nбосаңсыған. Ит тыныш көрінсе де, оған жақындама, сипауға тырыспа\nжәне назарын аударма. Жолын кеспей, арақашықтық сақтап айналып\nөт.\n      2. Ит қорқып тұр\n      Құйрығын бауырына қысып, құлағын кейін қайырады, өзі кейін\nшегініп, алыстауға тырысады. Оған жақындама, сипама және\nтыныштандыруға әрекет жасама. Қорыққан ит өзін қорғау үшін\nкүтпеген әрекет жасауы мүмкін.\n      3. Ит ашулы немесе мазасыз\n      Ит үруі немесе ырылдауы, тісін көрсетуі, денесін ширықтыруы\nмүмкін. Мұндай жағдайда оған жақындама, айқайлама және кенет\nқимыл жасама. Сабыр сақтап, иттен баяу алыста.\n\n      Маңызды\n      Иттің сыртқы келбеті мен мінез-құлқы оның қауіпсіз екенін\nтолықтай білдірмейді. Бейтаныс ит сабырлы, қорыққан немесе\nагрессивті болып көрінсе де, онымен байланысқа түспеу керек.\n      Педагог:\n      – Егер сен бейтаныс немесе қаңғыбас итке кездессең, қауіпсіз\nмінез-құлықтың негізгі ережелерін есте сақта:\n      1.    Жүгірме. Тоқта немесе сабырлы түрде жүре бер. Жүгіру\nжәне кенет қозғалыстар иттің назарын аударып, оның сені қууына\nсебеп болуы мүмкін.\n      2.    Итке жақындама. Ол сабырлы көрінсе де, оны сипауға,\nтамақтандыруға немесе қуып жіберуге тырыспа.\n      3.    Итке тесіле қарама. Оның әрекетін бақыла, бірақ көзіне\nұзақ уақыт тікелей қарама.\n      4.    Айқайлама және қолыңды сермеме. Сабыр сақта, кенет\nқозғалыстар жасама және жануарды арандатпа.\n      5.    Арақашықтықты          сабырлы       түрде     ұлғайтуға\nтырыс. Қауіпсіз жерге қарай баяу шегін. Итке арқаңды беріп бұрылма\nжәне жүгірме.\n      6.    Егер ит саған жақындаса, сабыр сақта. Оны ұруға\nнемесе қажетсіз итеруге тырыспа. Егер өзіңмен бірге сөмке, рюкзак\nнемесе басқа зат болса, оны алдыңа тосқауыл ретінде ұста.\n      7.    Егер қасыңда ересек адамдар болса, олардан көмек\nсұра. Итті өз бетіңше қуып жіберуге немесе ұстап алуға тырыспа.\n      Кейс тапсырмаларымен жұмыс\n      1-кейс. Жолда бір топ ит тұр\n      Әрекет ету алгоритмі: иттер тобына жақындама және олардың\nарасынан өтуге тырыспа. Жүгірме, айқайлама және иттердің назарын\nаударма. Бағытыңды сабырлы түрде өзгерт те, арақашықтықты\nұлғайтуға тырыс. Мүмкіндік болса, ересектер немесе басқа адамдардың\nқасына қауіпсіз жерге бар.\n      2-кейс. Ит жақындап келеді, үреді немесе агрессия танытады.\n      Әрекет ету алгоритмі: сабыр сақта, айқайлама, қолыңды сермеме\nжәне итке арқаңды беріп бұрылма. Кенет қимыл жасама.\nАрақашықтықты баяу ұлғайтып, қауіпсіз жерге қарай жылжуға тырыс.\nЕгер ит тым жақын келсе, рюкзакты, сөмкені немесе басқа затты\nалдыңа тосқауыл ретінде ұстауға болады.\n      3-кейс. Ит шабуыл жасап, сені құлатып жіберді.\n      Әрекет ету алгоритмі: бүрісіп жатып, бетіңді, мойныңды және\nбасыңды қолдарыңмен қорға. Мүмкіндігінше қимылсыз жатуға және\n\nкенет қозғалыстар жасамауға тырыс. Қауіп бәсеңдегенде, жақын\nжердегі ересектерді көмекке шақыр.\n     Кейстерді орындағаннан кейін педагог қорытынды жасайды:\n     – Итпен кездескен кездегі басты міндет – онымен байланысқа\nтүспеу, оны арандатпау және арақашықтықты қауіпсіз түрде ұлғайтуға\nтырысу. Жануардың сабырлы мінез-құлқы оның агрессия\nтанытпайтынына кепілдік бермейді.\n     Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n     https://www.youtube.com/watch?v=ic4oV6O3W4Q&amp;list=PLA5eCSY2FeoT00\nB3gyDuskOvkalEx7TmU&amp;index=22\n       Педагог:\n      – Жануарларға мейірімді әрі ізгілікпен қарау керек. Иттен\nсақтану оны жек көру немесе оған зиян келтіру деген сөз емес. Итті\nұруға, тас лақтыруға, әдейі қорқытуға немесе ашуландыруға болмайды.\n      Егер көшеде жараланған немесе әлсіреген итті көрсеңдер, оған\nөздерің жақындамай, ересек адамға хабарлаңдар. Жануарға қауіпсіз\nжолмен көмек көрсету де – мейірімділіктің белгісі.\n      – Естеріңде болсын: өз қауіпсіздігіңді сақтай отырып, жануарға\nда қамқорлықпен және ізгілікпен қарау керек.\n       III. Қорытынды бөлім\n      Рефлексия\n      – Бүгін мен қаңғыбас итті көргенде ... керектігін білдім.\n      – Жануарға мейірімді болу дегеніміз ... .\n      – Өз қауіпсіздігімді сақтау үшін мен ... .<\/div><p><a href=\"https://www.youtube.com/watch?v=ic4oV6O3W4Q&amp;list=PLA5eCSY2FeoT00\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=ic4oV6O3W4Q&amp;list=PLA5eCSY2FeoT00<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 10-сабақ — Ұлы дала коды"}, "grade-4/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>4-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-4/index.html\">← 4-сынып тақырыптары<\/a><article><h2>Табиғат аясындағы қауіпсіздік шаралары<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 177-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=177\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№11 сабақ         Табиғат аясындағы қауіпсіздік шаралары\nМақсаты           Табиғат аясында демалу кезіндегі қауіпсіз мінез-\n              құлық дағдыларын және табиғи қауіптерге тап болған\n              кездегі дұрыс әрекет ету алгоритмін қалыптастыру\nМіндеттері        – табиғаттағы негізгі қауіптерден сақтану\n              ережелерін меңгерту;\n                  – қауіпті жағдайда дұрыс шешім қабылдау\n              дағдыларын дамыту;\n                  – табиғатқа ұқыпты және жауапкершілікпен\n              қарауға тәрбиелеу.\n\n       Материалдар мен ресурстар\n       Табиғат аясындағы қауіпсіз және қауіпті мінез-құлық мысалдары\nбейнеленген иллюстрациялар, «Қауіпсіз бе, қауіпті ме?» жатығуына\nарналған жасыл және қызыл белгі карточкалары.\n       Сабақ барысы\n       I. Кіріспе бөлім\n       Педагог:\n       – Жорыққа шығу, серуендеу немесе табиғат аясына саяхат жасау\nалдын ала дайындықты және қауіпсіздік ережелерін сақтауды талап\nетеді. Бүгін біз виртуалды жорыққа аттанып, серуенге қалай дайындалу\nкеректігін, қауіпті жағдайлардың алдын алуды және қиындық\nтуындаған кезде дұрыс әрекет етуді талқылаймыз.\n       «Рюкзак жинайық» интерактивті ойыны\n       Тақтада әртүрлі заттардың суреттері көрсетіледі: компас, су,\nтелефон, сіріңке, ашық түсті күрте, кәмпиттер, үстел ойыны.\n       Білім алушылар орманға жорыққа шыққанда өздерімен бірге алу\nқажет заттарды таңдап, өз таңдауын түсіндіреді.\n       II. Негізгі бөлім\n       Педагог:\n       – Әдемі көбелекке немесе саңырауқұлаққа алаңдап, ата-анаңнан\nкөз жазып қалғаныңды елестетіп көр. Сен қорқып, абдырай бастадың.\nМұндай жағдайда не істеу керек?\n       Білім алушылардың жауаптары. Педагог:\n       – Егер адасып қалғаныңды түсінсең, ең бастысы – тоқтап, сабыр\nсақтауға тырыс. Бір орында қалып, көмек күт.\n       Тоқта және айналаңа қара. Қай жақтан келгеніңді есіңе түсір,\nтаныс белгілерге назар аудар. Бағытыңа сенімді болмасаң, жолды өз\nбетіңше іздеуге тырыспа. Қауіпсіз әрі жақсы көрінетін бір жерде қалған\nдұрыс.\n\n      Көмекке шақыр. Ара-тұра дауыстап көмек сұра. Ысқырығың\nболса, пайдалан. Дыбыс шығарып, тұрған жеріңді білдіруге тырыс.\n      Телефоның болса, ата-анаңа немесе 112 нөміріне қоңырау\nшал. Адасып қалғаныңды айтып, орналасқан жеріңді мүмкіндігінше\nнақты сипатта. Содан кейін ересектердің немесе құтқарушылардың\nнұсқауларын орында.\n      Педагог:\n      – Табиғат аясында жануарларды, жәндіктерді және өсімдіктерді\nкездестіруге болады. Олардың кейбіреулерімен кездескенде сақтық\nтаныту қажет. Жағдаяттарды қарастырып, қауіпсіз әрекет ету\nжолдарын анықтайық.\n      Топтарға арналған тапсырма\n      Жағдаятты оқыңдар. Қандай қауіп болуы мүмкін екенін анықтап,\nмұндай жағдайда қалай әрекет ету керектігін талқылаңдар.\n      1-кейс. Кенелер мен жыландар\n      Орманда серуендеп жүрген Әлихан жолды қысқарту үшін қалың\nшөптің арасымен жүріп кетті. Біраз уақыттан кейін ол киімінің үстінен\nкенені байқап қалды, ал соқпақтың жанында жыланды көрді.\n      Бұл жағдаятта қандай қауіптер бар?\n      Әлихан не істеуі керек?\n      2-кейс. Шағатын жәндіктер\n      Табиғатта серуендеп жүргенде Аружан мен оның достары жақын\nжерде араның ұясын байқап, оған жақынырақ барғысы келді.\n      Балалардың қандай әрекеттері қауіпті болуы мүмкін?\n      Олар қалай әрекет етуі керек?\n      Егер біреуді жәндік шағып алса, не істеу керек?\n      3-кейс. Жабайы жануарлар, жидектер мен саңырауқұлақтар\n      Серуен кезінде Данияр жабайы жануарды көріп, оны суретке\nтүсіру үшін жақынырақ барғысы келді. Жолда оның достары бейтаныс\nжидектер мен саңырауқұлақтарды байқап, оларды жинап, дәмін татып\nкөруді ұсынды.\n      Қандай қауіптерді байқадыңдар?\n      Неліктен жабайы жануарға жақындауға болмайды?\n      Бейтаныс жидектер мен саңырауқұлақтарды көргенде қалай\nәрекет ету керек?\n      Талқылаудан кейін әр топ өз әрекет ету нұсқасын ұсынады.\n      Педагог білім алушылармен бірге табиғат аясындағы қауіпсіз\nмінез-құлықтың ортақ ережелерін тұжырымдайды.\n      Табиғат аясындағы демалыс қауіпсіз болуы үшін:\n           Бейтаныс өсімдіктерді, саңырауқұлақтар мен жидектерді\nұстама – олар қауіпті болуы мүмкін.\n\n          Жабайы       жануарларға     жақындама және  оларды\nтамақтандыруға тырыспа.\n          Өзендер, көлдер және жартастардың маңында абай бол.\nЕресектердің рұқсатынсыз суға түспе.\n          Егер адасып қалсаң, бір орында қалып, көмекке шақыр\nжәне мүмкін болса, телефон арқылы ата-анаңа немесе 112 нөміріне\nхабарлас.\n     Есте сақта! «Таза Қазақстан» бастамасы табиғатқа ұқыпты\nқарауға, тазалықты сақтауға және қауіпсіздікке жауапкершілікпен\nқарауға шақырады.\n     Табиғат аясында болған кезде қоқыс қалдырмау, өсімдіктерге\nзиян келтірмеу, жануарларды мазаламау және өрт қауіпсіздігі\nережелерін сақтау қажет. Әрқайсымыздың жауапты әрекетіміз\nтабиғатты таза әрі қауіпсіз сақтауға көмектеседі.\n     Педагог білім алушыларға тақырыпқа сай бейнематериалды\nкөруді ұсынады.\n     https://www.youtube.com/watch?v=vIMxBmBpDU8&amp;list=PLA5eCSY2FeoT00\nB3gyDuskOvkalEx7TmU&amp;index=4\n\n     III. Қорытынды бөлім\n     Рефлексия\n     – Табиғат аясында қауіпсіз демалу үшін мен ... .\n     – Егер қауіпті жағдайды байқасам, мен ... .\n     – Егер адасып қалсам, мен ... .\n     Мұқият болу және қауіпсіздік ережелерін сақтау қауіпті\nжағдайлардың алдын алуға көмектеседі. Егер қауіпті жағдайды\nбайқасаң немесе саған көмек қажет болса, міндетті түрде ересек адамға\nхабарла.\n     Төтенше жағдайда қоңырау шал:\n          101 – өрт сөндіру қызметі;\n          103 – жедел медициналық көмек;\n          112 – бірыңғай жедел қызмет нөмірі.<\/div><p><a href=\"https://www.youtube.com/watch?v=vIMxBmBpDU8&amp;list=PLA5eCSY2FeoT00\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=vIMxBmBpDU8&amp;list=PLA5eCSY2FeoT00<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "4-сынып · 11-сабақ — Ұлы дала коды"}};const HOME="grade-4/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
