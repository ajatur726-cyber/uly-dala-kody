пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-5/lesson-08.html\"><h2>8. Мессенджерлерді қауіпсіз пайдалану және жеке деректерді қорғау<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-5/lesson-09.html\"><h2>9. Интернеттегі күмәнді сілтемелер мен хабарламалар<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-5/lesson-10.html\"><h2>10. Кибербуллингтен қорғану және өзгеге қолдау көрсету<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-5/lesson-11.html\"><h2>11. Жолда жүру, самокат, велосипед және скейтборд тебу кезіндегі қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-5/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 181-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=181\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ          Төтенше жағдайлар қызметтері мен байланыс\n              орталығының телефон нөмірлері\nМақсаты           Білім алушылардың төтенше жағдайлар кезінде\n              тиісті жедел қызметті анықтау, қажетті телефон нөміріне\n              дұрыс хабарласу және диспетчерге маңызды ақпаратты\n              нақты жеткізу дағдыларын қалыптастыру.\nМіндеттері        - төтенше жағдайлар қызметтері мен байланыс\n              орталығының телефон нөмірлері туралы білімдерін\n              бекіту;\n                  - төтенше жағдайдың сипатына қарай тиісті жедел\n              қызметті дұрыс таңдай білуге және қажетті ақпаратты\n              нақты жеткізуге үйрету;\n                  - жедел қызметтерге жауапкершілікпен жүгінуге,\n              жалған қоңырауға жол бермеуге және сабырлы әрекет\n              етуге тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Қазақстан Республикасындағы төтенше жағдайлар қызметтерінің\nтелефон нөмірлері көрсетілген карточкалар (101, 102, 103, 111, 112),\n«Дұрыс нөмірді тап» ойынына арналған өмірлік жағдаяттар жазылған\nкарточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға мынадай жағдаятты елестетуді\nұсынады:\n      - Әлішер түтіннің иісін сезіп, бөлмеде түтін пайда болғанын\nбайқайды.\n      Талқылаңыздар:\n            Әлішер мұндай жағдайда не істеуі керек?\n            Кімнен көмек сұрау қажет?\n            Төтенше жағдайлар қызметінің қай нөміріне қоңырау шалу\nкерек?\n      Педагог төтенше жағдайлар қызметтерінің телефон нөмірлерін\nбілу қауіпті жағдайда қажетті көмекті жылдам алуға мүмкіндік\nберетінін атап өтіп, сабақтың тақырыбын хабарлайды.\n      II. Негізгі бөлім\n      «Дұрыс нөмірді тап» ойыны\n      Педагог жағдаятты оқиды, ал білім алушылар қажетті нөмір\nжазылған карточканы көрсетеді немесе нөмірді дауыстап айтады.\n      Жағдаяттар:\n            Пәтерден түтін шығып жатыр. Жауабы: 101 немесе 112.\n\n            Көшеде бір кісі денсаулығына байланысты өзін жайсыз\nсезінді. Жауабы: 103 немесе 112.\n            Біреу велосипед ұрлауға әрекет жасап жатыр. Жауабы: 102.\n            Баланы басқа сынып оқушылары үнемі ренжітіп, қорқытып\nжүр. Жауабы: 111 байланыс орталығы.\n            Төтенше жағдайда қай қызметке хабарласу керектігін\nбілмейсің. Жауабы: 112.\n      Әр жауаптан кейін педагог дұрыс таңдалған нөмірге қысқаша\nтүсініктеме береді.\n      Педагог сұрақ қояды:\n            Егер баланы ренжітсе, қорқытса немесе ол қиын жағдайға\nтап болса, кімнен көмек сұрай алады?\n      Білім алушылар өз болжамдарын айтады.\n      Талқылаудан кейін педагог білім алушылардың назарын 111\nбайланыс орталығына хабарласып, көмек алуға болатынына аударады:\n      -      Балалар зорлық-зомбылыққа, қорқытуға, буллингке немесе\nбасқа да қиын жағдайға тап болған кезде, 111 нөміріне хабарласып,\nкөмек сұрай алады. Мамандар баланы тыңдап, қолдау көрсетеді және\nжағдайдан шығудың жолын табуға көмектеседі.\n      «Дұрыс хабарла» кейсі\n      Педагог хабарласу алгоритмін ұсынады:\n      Төтенше жағдайлар қызметіне қоңырау шалсаң:\n            өз атыңды айт;\n            не болғанын айт;\n            мекенжайды немесе оқиға болған жерді ата;\n            диспетчердің сұрақтарына жауап бер;\n            телефон тұтқасын бірінші болып қойма.\n      Екі қысқаша диалогты сахналанады:\n      – Сәлеметсіз бе, 112 қызметі. Тыңдап тұрмын.\n      – Менің атым – Аружан. Аулада бір адам есінен танып қалды.\nМекенжайы: Абай көшесі, 15-үй.\n      Педагог       білім    алушыларға       тақырыпқа     қатысты\nбейнематериалды көруді ұсынады.\n      https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\nC74gi/view?usp=sharing\n      III. Қорытынды бөлім\n      Педагог төмендегі сұрақтар бойынша қысқаша талқылау\nұйымдастырады:\n         Көмек көрсететін қызметтердің телефон нөмірлерін білу\nнеліктен маңызды?\n         Дер кезінде көмекке жүгінудің маңызы қандай?\n\n        Бүгін алған білімдеріңіз қиын жағдайда өзіңізге немесе\nжақындарыңызға қалай көмектесе алады?\n      Педагог қорытынды жасайды:\n      - Бүгін сіздер қиын және қауіпті жағдайларда көмекке қалай\nдұрыс жүгіну керектігін білдіңіздер. Естеріңізде болсын: ата-\nаналарыңыздан, педагогтен, мектеп психологінен немесе өзіңіз сенетін\nбасқа ересек адамнан көмек сұрауға болады. Қажет болған жағдайда\n111 байланыс орталығына, ал төтенше жағдайда тиісті төтенше\nжағдайлар қызметіне қоңырау шалыңыз.\n\n                        Қосымша ақпарат\n  Нөмірі / байланыс                   Қызмет\n      нөмірі |\n112                     Бірыңғай жедел көмек көрсету қызметі\n101                     Өрт сөндіру қызметі\n102                     Полиция қызметі\n103                     Жедел медициналық көмек қызметі\n104                     Авариялық газ қызметі\n111                     Отбасы, әйелдер мен балалардың\n                        құқықтарын қорғау мәселелері бойынша\n                        «111» байланыс орталығы (тәулік бойы,\n                        аптасына 7 күн)\nПсихологиялық           Психологиялық қиындықтар, қатты\nқолдау орталығы         күйзеліс, мазасыздық, буллинг,\nӨз өңіріңіздегі         психологиялық көмек пен қолдауға\nбайланыс нөмірлері      қажеттілік\nБалалардың               Балалардың құқықтары мен заңды\nқұқықтарын қорғау       мүдделерінің бұзылуы, қорғау мен көмек\nбасқармасы              қажет болатын жағдайлар\nӨз өңіріңіздегі\nбайланыс нөмірлері<\/div><p><a href=\"https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 1-сабақ — Ұлы дала коды"}, "grade-5/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Сыйластыққа негізделген қауіпсіз мектеп ортасы<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 184-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=184\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ           Сыйластыққа негізделген қауіпсіз мектеп ортасы\nМақсаты            Білім   алушылардың      өзара    сыйластыққа\n               негізделген       қарым-қатынас         мәдениетін\n               қалыптастыру және мектептегі қауіпсіз ортаға\n               жауапкершілікпен қатысу дағдыларын дамыту.\nМіндеттері          сыйластық, қолдау және қауіпсіз қарым-\n               қатынас ұғымдарының мәнін түсіндіру;\n                    келіспеушілік немесе қолайсыз жағдайларда өз\n               ойын мәдениетті жеткізуге, өзгенің шекарасын\n               құрметтеуге және қауіпсіз шешім қабылдауға\n               үйрету;\n                    сыныптастарының әл-ауқатына немқұрайлы\n               қарамауға, қажет жағдайда ересек адамнан көмек\n               сұрауға    және     жағымды     мектеп    ортасын\n               қалыптастыруға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Талқылауға және топтық жұмысқа арналған өмірлік жағдаяттар\nжазылған карточкалар, «Дұрыс па, бұрыс па?» ойынына арналған\nтұжырымдар жазылған карточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға төмендегі сұрақтарға жауап беруді\nұсынады:\n            Мектепте күн сайын өзімізді қауіпсіз әрі жайлы\nсезінуімізге не көмектеседі?\n            Бір-бірімізге деген сыйластық пен ізгі қарым-қатынасты\nсақтауға қандай сөздеріміз бен іс-әрекеттеріміз ықпал етеді?\n      Білім алушылардың жауаптарын тыңдағаннан кейін педагог\nолардың пікірлерін жинақтап, қорытынды жасайды:\n      -      Мектептегі      қауіпсіздік   әрқайсымыздың       қарым-\nқатынасымыз бен әрекетімізден басталады. Біреуді келемеждеу, затын\nрұқсатсыз алу немесе «жоқ» деген сөзін елемеу оның өзін жайсыз\nсезінуіне себеп болуы мүмкін.\n      Біреудің қиналғанын байқасаң, бейжай қалма. Қолыңнан\nкелмесе, сенетін ересек адамнан көмек сұра. Өзіңнен сұрап көр: «Менің\nсөзім мен әрекетім өзгелердің өзін қауіпсіз әрі сыйлы сезінуіне ықпал\nете ме?\n      II. Негізгі бөлім\n      «Жағдаяттарды талдаймыз» топтық жұмысы\n\n      Педагог білім алушыларды 3 топқа біріктіреді. Әр топқа бір\nжағдаят ұсынылады. Топ мүшелері жағдаятты талқылап, қауіпсіз әрі\nөзара сыйластыққа негізделген әрекет ету жолын ұсынады.\n      Топтарға арналған тапсырма:\n      Жағдаятты оқып, сұрақтарға жауап беріңіздер.\n      1-жағдаят. Үзілістегі оқиға\n      Үзіліс кезінде сыныптастарының бірі дәптері мен оқулықтарын\nабайсызда түсіріп алды. Бірнеше оқушы күле бастады және оны\nренжітетін сөздер айтты. Мұны басқа оқушылар да байқап қалды.\n      Талқылаңыздар:\n           Мазақтау сыныптасына қалай әсер етуі мүмкін?\n           Жанында тұрған оқушылар не істеуі керек?\n           Қалай құрмет пен қолдауды көрсетуге болады?\n      2-жағдаят. Үзілістегі қауіпті әрекет\n      Үзіліс кезінде бірнеше оқушы сыныптасына баспалдақпен\nжүгіріп, бірнеше басқыштан бірден секіріп түсуге ұсыныс жасады. Ол\nмұның қауіпті екенін түсінді. Бірақ балалар оны: «Қорықпа, ештеңе\nболмайды», – деп көндіруге тырысады.\n      Талқылаңыздар:\n           Мұндай әрекеттің қандай қаупі бар?\n           Мұндай жағдайда қалай әрекет ету керек?\n           Қауіпті ұсыныстан қалай бас тартуға болады?\n      Педагог қорытынды жасайды:\n      -     Қауіпсіз әрі ізгі ниетке негізделген мектеп ортасы\nәрқайсымыздың мінез-құлқымызға байланысты. Мектеп ережелерін\nсақтау, бір-бірімізге құрметпен қарау, қауіпті әрекеттерді қолдамау\nжәне қиын жағдайға тап болғандарға көмектесу маңызды. Егер\nжағдайды өз бетімізше шеше алмасақ, педагогке, мектеп психологіне,\nата-анамызға немесе өзіміз сенетін басқа ересек адамға жүгінуіміз\nкерек.\n      «Дұрыс па, бұрыс па?» ойыны\n      Педагог тұжырымдарды оқиды, ал білім алушылар «дұрыс»\nнемесе «бұрыс» белгісін көрсетеді.\n    Сыныптастарыңа көмектесу.\n    Қателіктері үшін келеке ету.\n    Өзгелердің пікірін құрметтеу.\n    Ересектерден көмек сұрау.\n    Қолдауға мұқтаж адамдардың өтінішін елемеу.\n      Мектеп ережелерін сақтау – «Заң және тәртіп» қағидатының\nмаңызды бөлігі. Ережелер тәртіпті сақтауға, айналадағы адамдардың\nқұқықтарын қорғауға және барлық білім алушылар үшін қауіпсіз\n\nжағдай жасауға көмектеседі. Ережелерді білу ғана емес, оларды сақтау,\nөз іс-әрекетіне жауапкершілікпен қарау және өзгелерге зиян келтіруі\nмүмкін әрекеттерді қолдамау маңызды.\n      Мектеп аумағына төмендегілерді алып кіруге тыйым салынады:\n            қару және қаруға ұқсас заттар;\n            білім беру процесінде пайдаланылмайтын пышақтар мен басқа да\nқауіпті заттар;\n            жарылғыш, тез тұтанатын, химиялық және улы заттар;\n            пиротехникалық бұйымдар;\n            темекі өнімдері, электрондық темекілер (вейптер) және құрамында\nникотин бар басқа да өнімдер.\n       Негіздеме: Қазақстан Республикасы Білім және ғылым министрінің «Білім беру\nұйымдарына және олардың аумақтарына әкелуге тыйым салынған, оларда пайдаланылуы\nшектелген нәрселер мен заттардың тізбесін бекіту туралы» 2021 жылғы 25 мамырдағы\n№ 235 бұйрығы.\n      Егер мектепте қауіпті, жағымсыз немесе қиын жағдайға тап\nболсаң, мәселені жалғыз шешуге тырыспа. Төмендегі адамдардың\nбіріне жүгін:\n           сынып жетекшісіне;\n           мектеп психологіне;\n           ата-анаңа;\n           өзің сенетін басқа ересек адамға;\n           111 байланыс орталығына – мұнда балалардың құқықтары\nмен қауіпсіздігін қорғау мәселелері бойынша кеңес пен психологиялық\nкөмек алуға болады. 111 нөміріне қоңырау шалу тегін және қызмет\nтәулік бойы жұмыс істейді.\n      Есіңде болсын: көмек сұрау – дұрыс әрі жауапты әрекет.\n      III. Қорытынды бөлім\n      Педагог қорытынды жасайды:\n      -     Қауіпсіз әрі өзара сыйластыққа негізделген мектеп ортасы\nәрқайсымызға байланысты. Ізгі сөз, өзара көмек, құрмет және\nережелерді сақтау мектепті күн сайын қуана келетін орынға\nайналдырады.\n      «Менің қорытындым» рефлексиясы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n           Бүгін мен мектепте ... маңызды екенін түсіндім.\n           Қауіпсіз әрі өзара сыйластыққа негізделген мектеп ортасын\nқалыптастыру үшін мен ...\n           Егер қауіпті немесе қиын жағдайды көрсем, мен ...\n      Бірнеше білім алушы өз қалауы бойынша жауаптарын дауыстап\nоқиды.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 2-сабақ — Ұлы дала коды"}, "grade-5/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Қауіптен сақтан, көмекке жүгін<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 187-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=187\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ          Қауіптен сақтан, көмекке жүгін\nМақсаты           Білім алушылардың қауіпті жағдайларды ажырата\n              білу, қауіпсіз әрекет ету және қажет кезде көмекке жүгіну\n              дағдыларын қалыптастыру.\nМіндеттері        - қауіпті және қауіпсіз жағдайларды ажырата білуге\n              үйрету;\n                  - қауіпті жағдайда дұрыс шешім қабылдау, қауіпсіз\n              жерге бару және көмек сұрау дағдыларын дамыту;\n                  - өз қауіпсіздігіне жауапкершілікпен қарауға және\n              қиын жағдайда сенімді ересек адамға жүгінуге\n              тәрбиелеу.\n\n     Материалдар мен ресурстар\n     Талқылауға арналған өмірлік жағдаяттар жазылған карточкалар,\n«Қауіпсіз» және «Қауіпті» карточкалары; рефлексияға арналған\n«Көмек алақаны» үлгісі.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог балаларға мына сұраққа жауап беруді ұсынады:\n   - Үйде, мектепте және көшеде сіздер кімнің қорғауында\n     боласыздар?\n     Білім алушылардың жауаптарын тыңдағаннан кейін педагог\nқорытынды жасайды:\n     Әр баланың қауіпсіз өмір сүруге және қорғалуға құқығы бар.\nЕресектер балалардың қауіпсіздігін қамтамасыз етуге, қиын жағдайда\nқолдау көрсетуге және қауіп төнген кезде қажетті көмек\nұйымдастыруға міндетті.\n     Қорғалуға құқығы болу деген нені білдіреді?\n     Педагог түсіндіреді:\n     Қорғалуға деген құқық әрбір баланың:\n    қауіпсіз жағдайда өмір сүруге;\n    қорқыныш пен зорлық-зомбылықсыз білім алуға;\n    көмек пен қолдау алуға;\n    ересектердің оны тыңдауына;\n    өзінің жеке шекарасын қорғауға құқығы бар екенін білдіреді.\n\n      II. Негізгі бөлім\n      «Қалай әрекет ету керек?» топтық жұмысы\n      Педагог білім алушыларды 4 топқа біріктіреді. Әр топқа бір\nжағдаят ұсынылады.\n      Тапсырма: қауіптің неден туындағанын анықтаңыздар, қауіпсіз\nәрекет ету жолын ұсыныңыздар және кімнен көмек сұрауға болатынын\nатаңыздар.\n      1-кейс. Мектепте\n      Бірнеше жоғары сынып оқушысы дәлізде 5-сынып оқушысын\nтоқтатып, одан ақша беруді талап етеді. Олар: «Тек ешкімге айтпа», –\nдеп ескертеді.\n      2-кейс. Көшеде\n      Аружан үйіне қайтып келе жатқанда, оған бейтаныс ересек адам\nжақындап: «Мені ата-анаң сені үйге алып қайтуға жіберді», – дейді.\nАружан бұл адамды бұрын-соңды көрмеген.\n      3-кейс. Қоғамдық орында\n      Данияр сауда орталығында ата-анасын біраз уақытқа көзден таса\nетіп алды. Бейтаныс адам оған бірге автотұраққа барып, ата-анасын\nіздеуді ұсынады.\n      4-кейс. Интернетте\n      Бейтаныс адам Әлиханға әлеуметтік желі арқылы хабарласып,\nсыйлық ұсынды және одан өзінің фотосуреті мен мекенжайын жіберуді\nсұрады.\n      Топтарға арналған сұрақтар:\n           Бұл жағдайда неге сақ болған жөн?\n           Не істеуге болмайды?\n           Қауіпсіз әрекет ету үшін не істеу керек?\n           Кімнен көмек сұрауға болады?\n      Талқылаудан кейін топтар өз шешімдерін таныстырады.\n      «Алыста – бас тарт – көмек сұра» ережесі\n      Педагог:\n      -     Қауіпті жағдайлардың барлығында дауласудың немесе\nмәселені өз бетіңше шешуге тырысудың қажеті жоқ. Қарапайым\nалгоритмді есте сақтаңдар.\n      Алыста – адамнан мүмкіндігінше қашық болуға немесе қауіпті\nжерден кетуге тырыс.\n      Бас тарт – бейтаныс адаммен бірге баруға, бөтен көлікке отыруға,\nжеке деректеріңді беруге немесе өзіңді алаңдататын әрекеттерді\nжасауға келіспе.\n      Көмек сұра – ата-анаңа, сынып жетекшіңе, мектеп психологіне\nнемесе өзің сенетін басқа ересек адамға айт. Қоғамдық орында полиция\n\nне күзет қызметкеріне немесе басқа да жауапты қызметкерге жүгінуге\nболады.\n      Көмек сұрау белгісі\n      Педагог:\n      -     Кейде адам қиын немесе қауіпті жағдайда дауыстап көмек\nсұрай алмауы мүмкін. Мұндай кезде көмек қажет екенін арнайы белгі\nарқылы білдіруге болады. Бұл белгіні айналадағы адамдарға білдіртпей\nкөрсетуге болады.\n      Белгіні қалай көрсету керек:\n      1.    Алақаныңды ашып, жоғары көтер.\n      2.    Бас бармағыңды алақаныңа қарай бүк.\n      3.    Қалған төрт саусағыңды бас бармақтың үстінен бүк.\n      Педагог көмек сұрау белгісін көрсетеді, білім алушылар оны\nқайталайды.\n      Маңызды! Егер басқа адамның осындай белгі көрсеткенін\nбайқасаң, оны елемеуге және қауіпті жағдайға өз бетіңше араласуға\nтырыспа. Бұл туралы ата-анаңа, педагогке, мектеп психологіне,\nполиция қызметкеріне немесе өзің сенетін басқа ересек адамға хабарла.\n      Есіңде болсын! Сенің үйде, мектепте, көшеде, қоғамдық\nорындарда және интернетте қорғалуға құқығың бар. Егер жағдай\nқауіпті болып көрінсе немесе біреу сенің жеке шекараңды бұзса,\nқауіпсіз жерге кетуге тырыс және бұл туралы ата-анаңа, педагогке,\nмектеп психологіне немесе өзің сенетін басқа ересек адамға айт.\nСондай-ақ көмек алу үшін 111 байланыс орталығына, ал өміріңе\nнемесе қауіпсіздігіңе тікелей қауіп төнген жағдайда төтенше\nжағдайлар қызметтеріне хабарласуға болады.\n      Педагог білім алушыларға тақырыпқа қатысты постермен\nтанысуды ұсынады.\n    https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPi\nGbtqI5p0p/view?usp=sharing\n     III. Қорытынды бөлім\n          Қиындықтарың туралы ересектерге айту неліктен\nмаңызды?\n          Кімнен көмек сұрай аласың?\n          Қауіпті жағдайға тап болсаң, қалай әрекет ету керек?\n          Қауіпсіздік ережелерінің қайсысы есіңде ерекше сақталды?\n     Педагог балаларға сөйлемді аяқтауды ұсынады:\n     «Егер маған көмек қажет болса, мен ... жүгінемін».\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPi\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPi<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 3-сабақ — Ұлы дала коды"}, "grade-5/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Қауіпті іске тартса қалай сақтануға болады?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 190-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=190\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 4 сабақ          Қауіпті іске тартса қалай сақтануға болады?\nМақсаты             Құрдастары немесе бейтаныс адамдар тарапынан\n                қысым көрсетілген жағдайда қауіпсіз әрекет ету\n                дағдыларын қалыптастыру\nМіндеттері           «Қысым» және «қауіпті жағдайға тарту»\n                ұғымдарымен таныстыру;\n                     «жоқ» деп айта білу және көмек сұрау\n                дағдыларын дамыту;\n                     қауіпті жағдайларды анықтауға және өз іс-\n                әрекетінің ықтимал салдарын бағалауға үйрету.\n\n      Материалдар мен ресурстар\n      Өмірлік жағдаяттар жазылған карточкалар, жауап нұсқалары\nжазылған карточкалар: «Жоқ деу», «Кету», «Көмек сұрау», «Ойлану».\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Проблемалық жағдаят\n      Сабақтан кейін бірнеше сыныптасы Әлиханға қызықты бейне\nтүсіру үшін қараусыз қалған құрылыс алаңына баруды ұсынды. Әлихан\nбас тартқанда, олар: «Ол жерге бәрі барып жүр! Қорықпа, ештеңе\nболмайды», – деп оны көндіруге тырысты.\n      Әлихан      ол    жердің  қауіпті   екенін  түсінеді,  бірақ\nсыныптастарының шеттетуінен не күлкіге қалудан қорқады.\n      Талқылауға арналған сұрақтар:\n    Бұл жағдайда Әлиханды не алаңдатуы керек?\n    Сыныптастары оған қандай жолмен қысым көрсетіп отыр?\n    Әлихан қалай бас тарта алады?\n    Ол кімнен көмек сұрай алады?\n      Педагог атап көрсетеді:\n      Кейде адамды өзі қаламайтын әрекетті жасауға мәжбүрлеуге\nтырысады. Бұл – қысым көрсету деп аталады. Мұндай жағдайда өз\nшешіміңе берік болып, қауіпті ұсыныстан бас тартып, қажет болса\nсенімді ересек адамнан көмек сұрау керек.\n      II. Негізгі бөлім\n      Қысым дегеніміз не?\n\n      Қысым – сені өзің қаламайтын немесе өзіңе не басқа адамдарға\nқауіпті болуы мүмкін әрекетті жасауға көндіруге, мәжбүрлеуге немесе\nсоған итермелеуге тырысу.\n      Топтық жаттығу\n      Педагог жағдаяттарды оқиды. Білім алушылар қысымның бар-\nжоғын анықтап, оны қандай белгілер арқылы байқағанын түсіндіреді.\n      1-жағдаят\n      Досың саған бір сайттың сілтемесін жіберіп:\n      – Ақша аудара сал. Мен де аудардым. Кейін одан да көп ақша\nаласың, – деп көндіреді.\n      Қысым бар: сені ақшаға байланысты тәуекелді әрекет жасауға\nитермелеп, асығыс шешім қабылдауға көндіріп жатыр.\n      2-жағдаят\n      Сыныптасың: «Сабақтан кейін жобаны бірге дайындайық.\nҚаламасаң, ескертерсің», – деп ұсынды.\n      Қысым жоқ: бұл ұсыныста өз еркіңмен келісуге немесе бас\nтартуға мүмкіндік бар.\n      3-жағдаят\n      Достарың:\n      -      Бәрі келісіп қойды, тек сен ғана қорқып тұрсың. Бізбен\nбірге жүр! – дейді.\n      Қысым бар: олар сені мазақ ету және «бәрі солай істейді» деген\nойды алға тарту арқылы өздері қалаған шешімге көндіруге тырысып\nжатыр.\n      4-жағдаят\n      Бейтаныс адам балаға өзімен бірге жүруді ұсынып:\n      -      Тек ата-анаңа айтпа, бұл біздің құпиямыз болады, – дейді.\n      Қысым бар: бейтаныс адам жағдайды ересектерден жасыруды\nсұрап, баланың шешіміне ықпал етуге тырысады.\n      Педагог қорытынды жасайды:\n      Қысым көрсету әртүрлі болуы мүмкін. Мысалы, біреу: «Бәрі\nістеп жатыр», «Қорқақ болма», «Тез шешім қабылда», «Ешкімге айтпа»\nдеп сені өзің қаламайтын әрекетке көндіруге тырысуы мүмкін.\n      Осындай сөздерді естісең немесе өзіңді жайсыз сезінсең, асықпай\nшешім қабылда. «Жоқ» деп айт, ол жерден кет және болған жағдайды\nөзің сенетін ересек адамға хабарла.\n      Егер сені қауіпті жағдайға тартуға тырысса:\n      Нақты әрі нық түрде: «Жоқ, мен мұны істемеймін», – деп айт.\n      Қауіпті ұсыныстарға көніп қалма. Мұны достарың ұсынып тұрса\nда, бас тартудан қорықпа.\n      Қауіпті жерден кетуге тырыс.\n\n      Болған жағдайды ата-анаңа, педагогке немесе өзің сенетін ересек\nадамға айт.\n      Көмек қажет болса, 111 нөміріне хабарлас. Егер саған тікелей\nқауіп төніп тұрса немесе полицияның көмегі қажет болса, 102 нөміріне\nқоңырау шал.\n      Есіңде болсын:\n      «Заң мен тәртіп» қағидатын сақтау – қауіпті немесе заңға\nқайшы әрекетке келіспеуден басталады. Егер біреу сені ережені бұзуға,\nөзіңе не өзгеге зиян келтіруі мүмкін әрекет жасауға көндірсе, одан бас\nтарту – дұрыс шешім.\n      Нағыз достар сенің таңдауыңды құрметтейді және қауіпті\nәрекетке итермелемейді.\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін аяқтап,\nөз пікірін айтуды ұсынады:\n            Бүгін мен қысымның ... екенін түсіндім.\n            Егер мені қауіпті әрекет жасауға мәжбүрлесе, мен ...\n            «Жоқ» деп былай айтуға болады: ...\n            Менің қауіпсіздігім үшін ең маңыздысы – ...\n      Педагог атап көрсетеді:\n      -      Егер сені қауіпті жағдайға тартуға тырысса, бас тартуға\nқұқығың бар екенін ұмытпа. Нағыз достар сенің таңдауыңды\nқұрметтейді. Ал күмәнді немесе түсініксіз жағдайға тап болсаң,\nәрдайым ересектерден көмек сұрауға болады.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 4-сабақ — Ұлы дала коды"}, "grade-5/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Қолайсыз ауа райындағы көшедегі қауіпсіздік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 193-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=193\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 5 сабақ         Қолайсыз ауа райындағы көшедегі қауіпсіздік\n  Мақсаты          Қолайсыз ауа райы жағдайында көшеде қауіпсіз\n              әрекет ету дағдыларын қалыптастыру\n Міндеттері        - білім алушыларды қолайсыз ауа райы\n              жағдайында өзін-өзі ұстаудың негізгі ережелерімен\n              таныстыру;\n                   - жауапкершілік және қауіпсіз шешім қабылдай\n              білу дағдыларын дамыту;\n                   - қауіпті жағдайда ересектерден және төтенше\n              жағдайлар қызметтерінен дер кезінде көмек сұрау\n              дағдыларын бекіту.\n\n      Материалдар мен ресурстар\n      Әртүрлі ауа райы жағдайлары бейнеленген карточкалар\n(найзағай, нөсер жаңбыр, қар жаууы, көктайғақ, қатты жел, аптап\nыстық), ойынға арналған «Қауіпті» және «Қауіпсіз» карточкалары,\nәртүрлі ауа райы жағдайларында дұрыс және дұрыс емес әрекет ету\nүлгілері бейнеленген иллюстрациялар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға мынадай жағдаят ұсынады:\n      -      Сендер үйден шығуға дайындалып жатырсыңдар. Кенет\nауа райының күрт өзгергенін байқадыңдар: жел күшейді, аспанды бұлт\nбасты, нөсер жаңбыр жауа бастады. Сенің әрекетің қандай болмақ?\n      Білім алушылар өз әрекеттерінің нұсқаларын ұсынып,\nтаңдауларын түсіндіреді.\n      Педагог қорытынды жасайды:\n      -      Ауа райы жағдайы тез өзгеруі мүмкін, сондықтан көшеге\nшығар алдында жағдайды бағалап, қауіпсіздік туралы ойлану маңызды.\nБүгін біз қатты жел, найзағай, көктайғақ, қалың қар, аптап ыстық және\nбасқа да қолайсыз ауа райы жағдайларында қалай әрекет ету керектігін\nқарастырамыз.\n      II. Негізгі бөлім\n      Қолайсыз ауа райы жағдайларына не жатады?\n      Қолайсыз ауа райы жағдайлары – адамға қауіп төндіруі мүмкін\nауа райы:\n\n            нөсер жаңбыр;\n            найзағай;\n            қатты жел;\n            қалың қар және боран;\n            көктайғақ;\n            аптап ыстық.\n      «Қалай әрекет ету керек?» практикалық жұмысы\n      Педагог білім алушыларды 3 топқа біріктіреді. Әр топқа жағдаят\nжазылған карточка беріледі. Топ жағдаят сұрақтарына жауап береді.\n      1-кейс. Қатты жел\n      Сабақтан кейін Әлішер мектептен шыққанда, желдің кенет\nкүшейгенін байқады. Көшеде ағаштардың бұтақтары қатты тербеліп\nтұр, ал жақын жерде жарнама құрылымдары орналасқан. Үйіне дейін\nбірнеше қиылысты артта қалдыруы керек.\n      Талқылаңыздар:\n            Өз қауіпсіздігіңді қалай қамтамасыз етесің?\n            Қауіпсіз бағытты қалай таңдауға болады?\n            Жел одан әрі күшейсе, не істеу керек?\n      2-кейс. Көктайғақ және қалың қар\n      Аружан үйіне қайтып келе жатып, тротуардың мұз болып қатып\nқалғанын байқады. Қалың қар жауып, көріну қашықтығы нашарлап\nбарады. Үйге тезірек жету үшін нашар жарықтандырылған жолмен\nжүріп, жолды қысқартуға болады.\n      Талқылаңыздар:\n    Жолды қысқартқан дұрыс па?\n    Қауіпсіз қозғалу үшін не істеу керек?\n    Жолды жалғастыру қиындай түссе, не істеу керек?\n      3-кейс. Аптап ыстық және денсаулық жағдайының нашарлауы\n      Күннің аптап ыстығында серуендеп жүрген Данияр өзін әлсіз\nсезініп, басы айналды. Достары үйге дейін аз қалғанын айтып, серуенді\nжалғастыруды ұсынды.\n      Талқылаңыздар:\n    Жолды жалғастыру керек пе?\n    Ең алдымен не істеу қажет?\n    Кімнен көмек сұрауға болады?\n      Топтар өз шешімдерін таныстырғаннан кейін педагог ұсынылған\nәрекет ету алгоритмдерін нақтылап, толықтырады.\n      «Шығар алдында тексер» жаттығуы\n      Педагог білім алушыларға қолайсыз ауа райы жағдайында үйден\nшығуға дайындалып жатқанын елестетуді ұсынады.\n\n      Әр білім алушы үйден шығар алдында жасалуы тиіс үш әрекетті\nатауы керек:\n      1.    Біл – ауа райы болжамын алдын ала қарап, ескертулермен\nтаныс.\n      2.    Дайындал – ауа райына сай киім мен аяқ киім таңда, қажет\nзаттарды өзіңмен бірге ал.\n      3.    Шешім қабылда – сыртқа шығу қауіпсіз бе, соны бағала.\nЕгер ауа райы қолайсыз болса, сыртқа шығуды кейінге қалдыр.\n      Есіңде болсын: 112 қызметінен келетін қолайсыз ауа райы\nтуралы хабарламаларға үнемі назар аудар.\n      Педагог:\n      - Қауіпсіз әрекет үйде, көшеге шықпай тұрып басталады. Егер\nдауылды ескерту жарияланса немесе ауа райы қауіпті бола бастаса, өз\nбетіңше шешім қабылдама: ата-анаңмен немесе басқа ересек адаммен\nақылдас.\n      Егер жағдай қауіпті болса...\n      Егер ауа райы күрт нашарласа, қауіпсіз жерге баруға тырыс және\nқай жерде екеніңді ересектерге хабарла. Егер жарақат алып, жолды\nбағдарлай алмасаң немесе өмірің мен денсаулығыңа тікелей қауіп төнсе,\nжаныңдағы       ересек    адамдардан    көмек     сұра     немесе 112\nнөміріне қоңырау шал.\n      Қауіпсіздік ережелері\n      Нөсер жаңбыр кезінде\n           Қолшатыр немесе су өткізбейтін сырт киім пайдаланыңдар.\n           Терең шалшықтар мен су жиналған жерлерді айналып\nөтіңдер.\n           Жолдан өткенде асықпай, айналаға мұқият қараңдар.\n           Қатты жаңбыр кезінде қауіпсіз жерге кіріп, ауа райының\nбасылғанын күткен дұрыс.\n      Найзағай кезінде\n           Мүмкіндік болса, жақын жердегі ғимаратқа кіріңдер.\n           Жалғыз тұрған биік ағаштардың, бағандардың және басқа\nда биік нысандардың маңында тұрмаңдар.\n           Ашық алаңда қалмауға тырысыңдар.\n           Металл қоршаулар мен құрылымдарға жақындамаңдар.\n      Көктайғақ кезінде\n           Асықпай, абайлап жүріңдер.\n           Табаны таймайтын аяқ киім киіңдер.\n           Тайғақ жерде жүгірмеңдер және кенет қимыл жасамаңдар.\n      Аптап ыстық кезінде\n           Бас киім киіңдер.\n\n           Суды жеткілікті мөлшерде ішіңдер.\n           Мүмкіндігінше көлеңкеде болыңдар.\n           Күн астында ұзақ жүрмеңдер.\n           Өздеріңді жайсыз сезінсеңдер, бірден ересек адамға\nхабарлаңдар.\n      Есіңде болсын: 112 қызметінен келетін қолайсыз ауа райы\nтуралы ескертулерге үнемі назар аударыңдар.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдерді жалғастыруды\nұсынады:\n           Бүгін мен ауа райы күрт өзгерген кезде ... маңызды екенін\nтүсіндім.\n           Үйден шығар алдында мен ...\n           Егер көшеде ауа райы қауіпті бола бастаса, мен ...\n           Егер маған көмек қажет болса, мен ...\n      Педагог сабақты қорытындылайды:\n      Қауіпсіздік ережелерін білу ғана емес, оларды нақты жағдайда\nқолдана білу де маңызды.\n\nҚазақстан Республикасы Денсаулық\nсақтау министрлігі ұсынған қауіпсіздік\nсабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 5-сабақ — Ұлы дала коды"}, "grade-5/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Энергетикалық сусындардың денсаулыққа зияны<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 197-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=197\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 6 сабақ         Энергетикалық сусындардың денсаулыққа\n              зияны\nМақсаты           Білім алушылардың энергетикалық сусындардың\n              денсаулыққа ықтимал зияны туралы түсініктерін\n              қалыптастыру және       қауіпсіз   таңдау жасау\n              дағдыларын дамыту.\nМіндеттері         энергетикалық сусындардың ағзаға кері әсері\n              және оларды тұтынудың ықтимал қауіптері туралы\n              түсіндіру;\n                   сусын таңдауда қауіпсіз әрі саналы шешім\n              қабылдай білуге үйрету;\n                   өз денсаулығына жауапкершілікпен қарауға\n              және салауатты өмір салтын ұстануға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Топтық талқылауға арналған өмірлік жағдаяттар (кейстер)\nжазылған карточкалар, тапсырмаларды орындауға арналған\n«Пайдалы» және «Зиянды» карточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Сәлеметсіңдер ме, балалар!\n      Кейбір жасөспірімдер шаршаған кезде энергетикалық сусын\nішсе, сергіп, күш жинаймын деп ойлайды. Бірақ мұндай сусын ағзаға\nқалай әсер етеді? Бүгін энергетикалық сусындардың денсаулыққа\nәсерін және оларды тұтынудың қандай қауіптері бар екенін\nқарастырамыз.\n      Талқылауға арналған сұрақтар:\n            Өзіңді сергек сезінуге не көмектеседі?\n            Шаршаған кезде не істейсің?\n            Энергетикалық сусындарды тұтынып көрдің бе?\n      II. Негізгі бөлім\n      Энергетикалық сусындар туралы нені білу маңызды?\n      Энергетикалық сусын ішкеннен кейін адам біраз уақыт өзін\nсергек сезінуі мүмкін. Бірақ оның әсері ұзаққа созылмайды. Оның\nқұрамындағы кофеин ағзаға күш түсіреді.\n\n      Мысалы, энергетикалық сусын ішкеннен кейін жүрек жиі соғуы,\nбас ауыруы, мазасыздық пайда болуы немесе ұйқы бұзылуы мүмкін.\nСондықтан мұндай сусындар балалар мен жасөспірімдердің\nденсаулығына кері әсер етуі мүмкін.\n      Педагог:\n      Сондықтан энергетикалық сусындарды ішпеген дұрыс. Достарың\nнемесе таныстарың ұсынса да, одан бас тарта біл.\n      Топтық жұмыс\n      Педагог білім алушыларды 3 топқа біріктіреді. Әр топқа бір\nжағдаят ұсынылады.\n      Тапсырма: қауіптің неден туындағанын анықтап, қауіпсіз әрекет\nету алгоритмін ұсыныңдар.\n      1-кейс. «Ішіп көр!»\n      Серуендеп жүргенде досы Әлиханға энергетикалық сусын\nұсынады: «Аздап ішіп көр. Бәрі ішеді, ештеңе болмайды», – дейді.\nӘлихан бас тартады, бірақ танысы оны көндіруге тырысты.\n      Талқылаңыздар:\n      •     Бұл жағдайда қандай қауіп бар?\n      •     Бұл жерде қысым көрсетіліп жатыр ма?\n      •     Әлихан қалай бас тарта алады?\n      2-кейс. «Сергіп алу керек»\n      Бақылау жұмысының алдында досы Аружанға энергетикалық\nсусын ұсынады:\n   - Ішіп ал, тапсырмаларды жақсырақ орындайсың», – дейді.\n      Талқылаңыздар:\n      •     Ұсынысқа келісу керек пе?\n      •     Қалай бас тартуға болады?\n      •     Энергетикалық сусындар мидың жақсы жұмыс істеуіне\nкөмектеседі ме?\n      3-кейс. «Жағдайы нашарлады»\n      Данияр энергетикалық сусын ішті. Біраз уақыттан кейін жүрегі\nжиі соғып, қолы дірілдеп, басы айнала бастады. Бірақ ол өзіне ұрысады\nдеп қорқып, бұл туралы ересектерден көмегіне жүгінбеймін деп шешті.\n      Талқылаңыздар:\n      •     Данияр ең алдымен не істеуі керек?\n      •     Денсаулық жағдайының нашарлағанын жасыруға неліктен\nболмайды?\n      •     Кімнен көмек сұрау керек?\n      Педагог:\n      -     Егер белгісіз сусынды немесе өнімді ішкеннен кейін өзіңді\nжайсыз сезінсең, бұл туралы дереу ересек адамға айту қажет. Болған\n\nжағдайды жасыруға немесе белгілердің өздігінен басылғанын күтуге\nболмайды.\n      «Нық бас тарту» практикалық жаттығуы\n      Педагог білім алушыларға төмендегі ұсыныстарға жауап беріп,\nбас тарту дағдыларын жаттықтыруды ұсынады:\n      •      «Ішіп көр, бәрі ішіп көрді!»\n      •      «Бір рет ішкеннен ештеңе болмайды!»\n      •      «Не, қорқып тұрсың ба?»\n      Білім алушылар бас тартудың қысқа әрі нақты нұсқаларын\nұсынады:\n      •      «Жоқ, мен ішпеймін».\n      •      «Маған оның қажеті жоқ».\n      •      «Мен энергетикалық сусын ішпеуге шешім қабылдадым».\n      Педагог:\n      -      Денсаулығыңа зиян келтіруі мүмкін нәрседен бас тарту\nүшін ұзақ түсініктеме берудің қажеті жоқ. Сабырлы әрі нық түрде\n«жоқ» деп айтып, әңгімені тоқтатуға болады.\n      Энергетикалық сусындарсыз сергектікті қалай сақтауға болады?\n      •      күн тәртібін сақтау;\n      •      тәулігіне кемінде 8–10 сағат ұйықтау;\n      •      дұрыс тамақтану;\n      •      таза су ішу;\n      •      спортпен шұғылдану;\n      •      таза ауада көбірек серуендеу.\n      Егер энергетикалық сусын ішіп қойсаң және өзіңді жайсыз\nсезінсең, дұрыс әрекет ету алгоритмін есте сақта:\n      1.     Ересек адамға айт – ата-анаңа, педагогке, жаттықтырушыға\nнемесе өзің сенетін басқа ересек адамға хабарла.\n      2.     Не ішкеніңді және оның мөлшерін білсең, ересек адамға\nнақты айт.\n      3.     Белгілерді жасырма – жүрек соғуының жиілеуі, бас айналу,\nәлсіздік немесе денсаулық жағдайының басқа да нашарлау белгілері\nболса, міндетті түрде хабарла.\n      4.     Ересек адамның немесе медицина қызметкерінің\nнұсқауларын орында. 103 нөмірі арқылы жедел медициналық көмекке\nжүгін.\n      «Заң және тәртіп» қағидаты адамның денсаулығы мен\nқауіпсіздігін қорғауға арналған ережелерді сақтауды талап етеді.\nОсындай талаптардың бірі – энергетикалық сусындарды сатуға\nқойылатын жас шектеуі.\n\n     Қазақстанда 2025 жылғы 1 қаңтардан бастап энергетикалық\nсусындарды 21 жасқа толмаған адамдарға сатуға тыйым салынған. Бұл\nталап халықтың, әсіресе жастардың, денсаулығын қорғауға\nбағытталған.\n     Педагог білім алушылардың назарын тақырыпқа қатысты\nжаднамаларға аударады.\n     https://drive.google.com/file/d/1WBNlCTCYT_TkNWCEvOII6gxwf\nX-lq9Co/view?usp=sharing\n\n      III. Қорытынды бөлім\n      Талқылауға арналған сұрақтар:\n      •     Энергетикалық сусындар неліктен тек уақытша сергектік\nбереді?\n      •     Адамның шын мәнінде сергек әрі белсенді болуына не\nкөмектеседі?\n      Рефлексия\n      Сөйлемдерді жалғастырыңдар:\n      •     Бүгін мен ... білдім.\n      •     Маған ... қызықты болды.\n      •     Енді мен ... түсінемін.\n      •     Денсаулығымды сақтау үшін мен ...\n      Педагог қорытынды жасайды:\n      Денсаулықтарыңды күтіңдер! Сергек әрі белсенді болудың ең\nжақсы жолы – жеткілікті ұйықтау, дұрыс тамақтану, қимыл-\nқозғалысты көбейту және күн тәртібін сақтау.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1WBNlCTCYT_TkNWCEvOII6gxwf\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1WBNlCTCYT_TkNWCEvOII6gxwf<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 6-сабақ — Ұлы дала коды"}, "grade-5/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Интернеттегі қауіпті трендтер<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 201-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=201\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 7 сабақ        Интернеттегі қауіпті трендтер\nМақсаты          Білім алушылардың интернетте қауіпсіз әрекет\n             ету дағдыларын қалыптастыру\nМіндеттері       - «интернет-тренд» ұғымымен таныстыру;\n                 - өз қауіпсіздігі үшін жауапкершілікті дамыту;\n                 - интернет-трендтердің     ықтимал     қауіптерін\n             бағалауға және қауіпсіз шешім қабылдауға үйрету.\n\n      Материалдар мен ресурстар\n      Қауіпсіз және қауіпті интернет-трендтер мен челлендждердің\nмысалдары берілген карточкалар, танымал интернет-трендтер\nбейнеленген иллюстрациялар немесе скриншоттар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Әлеуметтік желіден блогердің ерекше трюк жасап жатқан\nбейнесін көрдің делік. Пікірлерде: «Бәрі істеп жатыр! Сен де байқап\nкөр!» – деп жазылған. Осы жағдайдың қауіпті екенін қалай анықтауға\nболады?\n      Бүгін біз:\n            интернеттегі трендтер мен челлендждердің не екенін;\n            олардың кейбірі неліктен қауіпті болуы мүмкін екенін;\n            қауіпті әрекеттерді қалай ажыратуға болатынын;\n            интернеттегі қысымға ермей, дұрыс шешім қабылдауды\nқарастырамыз.\n      Талқылауға арналған сұрақтар:\n            Әлеуметтік      желіде    қандай    трендтерді     немесе\nчеллендждерді көрдіңдер?\n            Адамдар неліктен трендтерге қосылғысы келеді?\n            «Бәрі жасап жатыр» деген сөз әрекетті қауіпсіз етеді ме?\n            Бір трендке қатыспас бұрын нені ойлау керек?\n      II. Негізгі бөлім\n      Интернет-тренд дегеніміз не?\n      Педагог:\n\n      Интернет-тренд – әлеуметтік желілерде тез таралатын танымал\nидея, әрекет немесе челлендж. Көптеген трендтер қауіпсіз болғанымен,\nкейбіреулері денсаулық пен өмірге қауіп төндіруі мүмкін.\n      Қауіпті тренд қауіпті әрекет жасауды, қауіпті заттарды\nпайдалануды, ережелерді бұзуды немесе өз әрекетін ересектерден\nжасыруды ұсынуы мүмкін.\n      Қауіпті трендті қалай тануға болады?\n      Бейнежазбада бәрі оңай әрі қауіпсіз көрінуі мүмкін. Бірақ сен\nкадрдың сыртында не болғанын көрмейсің: видео өңделуі, бірнеше рет\nтүсірілуі немесе арнайы дайындықпен жасалуы мүмкін.\n      Сондықтан трендті көргенде бірден қайталауға асықпа.\n      Өзіңе 4 сұрақ қой:\n      Бұл қауіпті ме?\n      Өзіме немесе басқа адамға қауіп төнбей ме?\n      Бұл әрекет үшін мектеп ережесін немесе заңды бұзу керек пе?\n      Маған қысым жасап жатыр ма?\n      «Қорқып тұрсың ба?», «Бәрі жасап жатыр!» деп көндіріп жатқан\nжоқ па?\n      Егер осы сұрақтардың біреуіне болса да «иә» деп жауап берсең,\nтрендке қатыспа.\n      Есте сақта: желідегі танымал әрекеттің бәрі қауіпсіз емес.\nКүмәндансаң, тоқта, тексер және өзің сенетін ересек адаммен ақылдас.\n      «Қалай әрекет ету керек?» топтық жұмысы\n      Педагог білім алушыларды 3 топқа біріктіреді. Әр топ қауіптің\nнеден туындағанын анықтап, қауіпсіз шешім ұсынады.\n      1-кейс. «Қайталауға батылың жете ме?»\n      Сыныптасы Әлиханға танымал бейнедегі қауіпті трюкті\nқайталауды ұсынады: «Батылың жете ме? Есесіне көп қаралым\nжинаймыз».\n      2-кейс. «Блогер жасап көрді ғой»\n      Аружан блогердің күрделі трюкті оңай орындағанын көрді.\nБейнетүсірілімнің қалай жүргізілгені белгісіз болса да, құрбысы оған\nосы трюкті қайталауды ұсынады.\n      3-кейс. «Ешкімге айтпа»\n      Даниярға қауіпті тапсырманы орындап, оны бейнеге түсіруді\nжәне бұл туралы ересектерге айтпауды ұсынады. Ол үшін көп қаралым\nжинауға уәде береді.\n      Топтарға арналған сұрақтар:\n           Қауіп неде?\n           Неден сақ болған жөн?\n           Қалай әрекет ету керек?\n\n          Кімнен көмек сұрауға болады?\n     «ТОҚТА – ОЙЛАН – ШЕШІМ ҚАБЫЛДА» алгоритмі\n     ТОҚТА – көрген әрекетіңді қайталауға асықпа.\n     ОЙЛАН – ықтимал салдарын бағала.\n     ШЕШІМ ҚАБЫЛДА – егер қауіп болса, бас тарт.\n     III. Қорытынды бөлім\n     «Менің қауіпсіз таңдауым» рефлексиясы\n     Педагог білім алушыларға сөйлемдерді жалғастыруды ұсынады:\n          «Егер мен қауіпті интернет-трендті көрсем, ...»\n          «Егер мені оған қатысуға көндірсе, мен ...»\n          «Егер маған көмек қажет болса, мен ...»\n     Педагог:\n     – Естеріңде болсын: қысқа бейнероликтің артында монтаж,\nалдын ала дайындық және мамандардың (каскадер) көмегі болуы\nмүмкін. Ал кейбір видеолар қауіпсіздік ережелерін сақтамай түсіріледі.\nСондықтан көрген әрекетті бірден қайталауға асықпаңдар. Лайк пен\nқаралым үшін денсаулықтарыңды қатерге тікпеңдер.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 7-сабақ — Ұлы дала коды"}, "grade-5/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Мессенджерлерді қауіпсіз пайдалану және жеке деректерді қорғау<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 204-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=204\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 8 сабақ         Мессенджерлерді қауіпсіз пайдалану және\n             жеке деректерді қорғау\nМақсаты           Білім алушылардың мессенджерлерде қауіпсіз\n             қарым-қатынас жасау және өз жеке деректеріне\n             жауапкершілікпен қарау дағдыларын қалыптастыру\nМіндеттері        - мессенджерлерде қауіпсіз қарым-қатынас\n             жасау ережелерімен таныстыру;\n                  -      бейтаныс адамдарға айтуға болмайтын\n             жеке деректерді ажырата білуге үйрету;\n                  -      интернетте   қауіпсіз    әрекет  ету\n             дағдыларын және дұрыс шешім қабылдай білу\n             қабілетін дамыту.\n\n     Материалдар мен ресурстар\n     «Жіберуге болады» және «Жіберуге болмайды» карточкалары,\nхабарламалар, фотосуреттер, смайликтер, сілтемелер және файлдар\nбейнеленген карточкалар.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     «Цифрлық чемодан» ойыны\n     Педагог:\n     – Әрқайсың интернет әлеміне саяхатқа дайындалып\nжатырсыңдар      деп    елестетіңдер. Бірақ    сендердің     кәдімгі\nчемодандарыңның орнына ішінде жеке деректерің сақталған «цифрлық\nчемодандарың» бар.\n     Сұрақтар:\n     – Мұндай чемоданның ішінде не болуы мүмкін?\n     (Білім алушылар жауап береді: аты-жөні, фотосуреттер,\nтелефон нөмірі, мекенжайы, құпиясөздер).\n     Педагог:\n     – Мұның барлығы жеке деректер деп аталады. Егер олар\nбейтаныс адамдардың қолына түссе, оларды алаяқтық мақсатта\nпайдалануы мүмкін. Сондықтан бүгін біз өзіміздің қауіпсіз «цифрлық\nчемоданымызды» қалай қорғау керектігін үйренеміз.\n     Педагог      білім    алушыларға     тақырыпқа        қатысты\nбейнематериалды көруді ұсынады.\n\n      https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj\nVOYfcO/view?usp=sharing\n      ІІ. Негізгі бөлім\n      «Құпияда сақтау не жария ету?» ойыны\n      Педагог әртүрлі ақпарат жазылған карточкаларды көрсетеді.\n      Егер ақпаратты жариялауға болатын болса, «Болады»\nкарточкасын көтереді.\n      Егер құпия жеке ақпарат болса, «Болмайды» карточкасын\nкөтереді.\n      Карточкалар:\n                   сүйікті жыл мезгілі;\n                   сүйікті мектеп пәні;\n                   үйдің мекенжайы;\n                   телефон нөмірі;\n                   туған күні;\n                   аккаунттың құпиясөзі;\n                   жеке фотосуреті;\n                   сүйікті компьютерлік ойыны.\n      Әр жауаптан кейін педагог таңдалған нұсқаның себебін қысқаша\nтүсіндіреді. Қорытынды:\n      - Сен туралы тым көп ақпарат білуге мүмкіндік беретін\nмәліметтердің барлығы жеке деректерге жатады және оларды қорғау\nқажет.\n      «Пошта сүзгісі» ойыны\n      Тақтада екі конверт орналасады:\n            «Қауіпсіз»\n            «Қауіпті»\n      Педагог карточкаларды көрсетеді.\n      Мысалы:\n            ата-анадан келген хабарлама;\n            белгісіз сілтеме;\n            құпиясөзді хабарлауды сұрау;\n            фотосурет жіберуді сұрау;\n            досыңнан келген құттықтау;\n            бейтаныс адам жіберген файл.\n      Білім алушылар әр карточканы қай конвертке салу керектігін\nанықтайды.\n      Талқылаудан кейін педагог қорытынды жасайды:\n      - Хабарламаны ашпас бұрын немесе оған жауап жібермес бұрын,\nоның қауіпсіз екені туралы әрдайым ойлау керек.\n\n      Қазақстан Республикасының заңнамасына сәйкес әр адамның\nжеке өмірі мен жеке деректерінің қорғалуына құқығы бар. Сондықтан\nбасқа адамның телефон нөмірін, мекенжайын, фотосын, хат алмасуын\nнемесе басқа да жеке мәліметтерін оның рұқсатынсыз таратуға\nболмайды.\n      «Заң мен тәртіп» қағидатын естен шығарма: – өз деректеріңді\nқорға, өзгенің құпиялылығын құрметте және интернетте де белгіленген\nережелерді сақта! Егер мессенджерде біреу сенен жеке мәлімет сұраса,\nкүмәнді сілтеме жіберсе, қорқытса немесе рұқсатсыз ақпарат таратса,\nоған жауап ретінде ережені бұзуға немесе жанжалға баруға болмайды.\n      Есіңде болсын! Жеке деректеріңді бейтаныс адамдарға жіберме,\nкүмәнді сілтемелерді ашпа және құпиясөзіңді ешкімге айтпа. Қауіп\nтөнсе немесе құқықтарың бұзылса, ата-анаңа, педагогке немесе өзің\nсенетін ересек адамға хабарла. Қажет болса, 111 нөміріне жүгінуге\nболады.\n      ІІІ. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдерді аяқтауды\nұсынады:\n                 Бүгін мен жеке деректердің ... екенін түсіндім.\n                 Енді мен ешқашан ... жібермеймін.\n                 Хабарламаға жауап бермес бұрын, мен ...\n                 Интернетте өзімді қорғау үшін мен ...\n      Сабақтың басты ережесі\n      Жеке деректер – құнды ақпарат. Оларды бейтаныс адамдармен\nбөліспе, хабарламаларды тексер және бір нәрсе жібермес бұрын\nәрдайым ойлан.\n\nҚазақстан Республикасы Қаржы\nнарығын реттеу және дамыту\nагенттігінің «FinGramota.kz» жобасы\nұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 8-сабақ — Ұлы дала коды"}, "grade-5/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Интернеттегі күмәнді сілтемелер мен хабарламалар<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 207-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=207\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 9 сабақ       Интернеттегі      күмәнді     сілтемелер  мен\n             хабарламалар\nМақсаты         Білім алушылардың мессенджерлерде қауіпсіз\n             қарым-қатынас жасау дағдыларын және жеке\n             деректерін қорғауға жауапкершілікпен қарауын\n             қалыптастыру\nМіндеттері       білім алушыларды «фишинг» ұғымымен\n             таныстыру;\n                 қауіпті хабарламалар мен сілтемелердің\n             белгілерін ажырата білуге үйрету;\n                 интернетте қауіпсіз әрекет ету және жауапты\n             шешім қабылдау дағдыларын дамыту.\n\n      Материалдар мен ресурстар\n      Қауіпсіз және күмәнді хабарламалардың мысалдары жазылған\nкарточкалар, «Қауіпсіз» (жасыл) және «Қауіпті» (қызыл) карточкалар,\nсілтемелер, хабарламалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, біз күн сайын мессенджерлерден, әлеуметтік\nжелілерден және онлайн ойындардан хабарламалар аламыз. Кейбір\nхабарламалар достарымыздан, ата-анамыздан немесе ұстаздарыңыздан\nкеледі. Ал кейбірі бейтаныс адамдардан келуі мүмкін.\n      Кейде мұндай хабарламалар өте сенімді көрінеді: сыйлық\nұсынады, тегін ойындарға бонус береді, оңай ақша табуды уәде етеді\nнемесе шұғыл мәселе туралы ескертеді. Алайда олардың артында\nалаяқтар болуы мүмкін.\n      Бүгін біз қауіпті хабарламалар мен сілтемелерді қалай анықтауға\nболатынын, неліктен оларды ашып, сілтемелерге өтпеу керектігін және\nинтернетте жеке деректерімізді қалай қорғауға болатынын үйренеміз.\n      II. Негізгі бөлім\n      Интернет-детектив зертханасы.\n      Педагог:\n\n       – Бүгін біз интернет-детективтер болып көрейік. Нағыз интернет-\nдетектив хабарламаға бірден сенбейді. Алдымен оның шындық екенін\nнемесе тұзақ болуы мүмкін екенін анықтауға көмектесетін белгілерді\nіздейді.\n       Тақтада «Қауіпті хабарламаның бес белгісі» деген тақырып\nпайда болады.\n       1-белгі. Тым тиімді ұсыныс\n       Алаяқтар көбіне шындыққа жанаспайтындай тартымды\nнәрселерді ұсынады:\n     «Сен жаңа телефон ұтып алдың!»\n     «Бір миллион тиынды тегін ал!»\n     «Тек бүгін әр адамға сыйлық беріледі!»\n       Педагог:\n       – Егер сен ешқандай байқауға немесе ойынға қатыспай-ақ, саған\nкенеттен «сыйлық ұтып алдың» деген хабарлама келсе, ойланып көр:\nбұл алаяқтық болуы мүмкін.\n       2-белгі. Хабарламада саған асығыс шешім қабылдауға\nитермелейтін сөздер болады\n       Алаяқтар адамды әдейі асықтыруға тырысады.\n       Мысалы:\n     «3 минут қана қалды!»\n     «Шұғыл түрде сілтемеге өт!»\n     «Аккаунтың бүгін өшіріледі!»\n       Педагог:\n       – Асықтырған кезде ойланып, жағдайды тексеруге уақыт аз\nқалады. Алаяқтардың көздейтіні де – осы.\n       3-белгі. Жеке деректерді хабарлауды сұрайды\n       Егер хабарламада құпиясөзді;\n     телефон нөмірін;\n     SMS арқылы келген кодты;\n     ата-анаңның банк картасына қатысты деректерді сұраса, онда\n       бұл қауіпті хабарлама болуы мүмкін.\n       Педагог:\n       – Банктің, мектептің, ойынның немесе әлеуметтік желінің\nшынайы қызметкерлері хат алмасу барысында сенен құпиясөзіңді\nнемесе SMS арқылы келген кодты хабарлауды ешқашан сұрамайды.\n       Педагог      білім     алушыларға     тақырыпқа       қатысты\nбейнематериалды көруді ұсынады.\nhttps://drive.google.com/file/d/1Oa2a3GCqfvaO4GYfEq4FxH2lyzwmp5lx\n/view?usp=sharing\n       III. Қорытынды бөлім\n\n      Педагог:\n      – Бүгін біз интернеттегі әрбір хабарлама мен сілтеменің қауіпсіз\nбола бермейтінін білдік. Алаяқтар жеке деректерді қолға түсіру немесе\nадамды алдау үшін түрлі айла-тәсілдерді қолдануы мүмкін. Енді сендер\nкүмәнді сілтемелерді ашуға асықпау, құпиясөздерің мен жеке\nақпараттарыңды ешкімге хабарламау керектігін білесіңдер. Егер\nхабарлама күмән тудырса, оны ата-анаңа, педагогке немесе өзің сенетін\nбасқа ересек адамға көрсеткен дұрыс.\n      «Сөйлемді жалғастыр» рефлексиясы\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n                   Бүгін мен ... білдім.\n                   Енді мен әрқашан ...\n                   Егер күмәнді хабарлама алсам, мен ...\n                   Мен үшін интернеттегі қауіпсіздіктің ең маңызды\n      ережесі – ...\n      Педагог:\n      – Жарайсыңдар! Естеріңде болсын: мұқият болу және сақтық\nтаныту жеке деректеріңді қорғауға әрі интернетті қауіпсіз етуге\nкөмектеседі.\n      Сабақтың басты ережесі\n      Алдымен ойлан, содан кейін бас! Егер күмәндансаң – сілтемені\nашпа және ересек адамнан көмек сұра.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1Oa2a3GCqfvaO4GYfEq4FxH2lyzwmp5lx\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1Oa2a3GCqfvaO4GYfEq4FxH2lyzwmp5lx<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 9-сабақ — Ұлы дала коды"}, "grade-5/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Кибербуллингтен қорғану және өзгеге қолдау көрсету<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 210-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=210\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 10 сабақ        Кибербуллингтен қорғану және өзгеге қолдау\n              көрсету\nМақсаты           Білім алушылардың кибербуллингті ажырата\n              білу, одан қорғану және осындай жағдайға тап болған\n              адамға қолдау көрсету дағдыларын қалыптастыру.\nМіндеттері         кибербуллингтің негізгі белгілерін танып, оны\n              жай әзілден немесе келіспеушіліктен ажырата білуге\n              үйрету;\n                   кибербуллингке тап болған жағдайда қауіпсіз\n              әрекет ету, жағымсыз хабарламаларға жауап бермеу,\n              оларды бұғаттау және сенімді ересек адамнан көмек\n              сұрау дағдыларын дамыту;\n                   өзгенің ар-намысы мен жеке шекарасын\n              құрметтеуге, кибербуллингке қатыспауға және зардап\n              шеккен адамға қолдау көрсетуге тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Кибербуллинг туралы тақырыптық бейнематериал, әлеуметтік\nжелілерде, мессенджерлерде және онлайн ойындарда кездесетін\nкибербуллинг мысалдары бейнеленген иллюстрациялар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Сынып чатына бір оқушының сәтсіз түскен суретінен стикер\nжасап, тарата бастады делік. Біреулер күліп жатыр, енді біреулер оны\nбасқа чаттарға жіберуде. Сен мұндай жағдайда не істер едің? Стикерді\nәрі қарай таратасың ба, чаттан шығып кетесің бе, әлде бұл әрекетті\nтоқтатуға тырысасың ба?\n      Бір қарағанда, бұл жай әзіл сияқты көрінуі мүмкін. Бірақ егер\nмұндай әрекет адамды ренжітсе, кемсітсе немесе әдейі мазақ ету үшін\nжасалса, бұл кибербуллингке айналуы мүмкін.\n      Бүгін біз осындай жағдайда қалай дұрыс әрекет ету қажет және\nкибербуллингке ұшыраған досыңа қалай қолдау көрсету керектігін\nталқылаймыз.\n      II. Негізгі бөлім\n      Кибербуллинг дегеніміз не?\n\n      Кибербуллинг – интернет, әлеуметтік желілер, мессенджерлер\nжәне онлайн ойындар арқылы қорлау, кемсіту, қорқыту, жалған\nақпарат немесе ренжітетін материалдар тарату.\n      Кибербуллинг қалай көрініс табуы мүмкін?\n           ренжітетін хабарламалар мен пікірлер жазу;\n           чаттарда мазақ ету;\n           жалған ақпарат тарату;\n           басқа адамның фотосуретін оның рұқсатынсыз жариялау;\n           адамды кемсіту мақсатында топтар немесе парақшалар\nқұру;\n           қорқыту және үркіту.\n      Жағдаяттарды талқылау\n      1-жағдаят. Мектеп чатында бірнеше білім алушы сыныптасын\nмазақтап, оған ренжітетін хабарламалар жаза бастады.\n      Сұрақтар:\n      Куәгер қалай әрекет етуі керек?\n      Неліктен мазақтауға қосылуға болмайды?\n      2-жағдаят. Әлеуметтік желіде сыныптасың туралы мем пайда\nболып, ол мектеп оқушылары арасында тез таралып жатыр.\n      Сұрақтар:\n      Мұндай материалды басқа чаттарға жіберуге бола ма?\n      Сыныптасың осы кезде не сезуі мүмкін?\n      Кибербуллингке ұшыраған адамға қалай қолдау көрсетуге\n      болады?\n      3-жағдаят. Айбек екеуі бір уақытта онлайн ойын ойнап\nжүрсіңдер. Сен ойын барысында басқа лақап атпен кіретін бір баланың\nАйбекке үнемі былапыт сөздер жазып, оны қорлайтынын байқадың.\nБұл жағдай әр ойын сайын қайталанады.\n      Сұрақтар:\n      Неліктен мұндай жағдайды елемеуге болмайды?\n      Айбекке қалай қолдау көрсетуге болады?\n      Бұл туралы кімге айту керек?\n      Ойындағы қорлау тоқтамаса, қандай әрекет жасауға болады?\n      Кибербуллингке тап болған жағдайда не істеу керек?\n      1.    Жауап беруге асықпа. Қорлау мен қорқытуға агрессиямен\nжауап берме.\n      2.    Кибербуллингті қолдама. Ренжітетін жазбаға лайк баспа,\nпікір жазба және оны басқа адамдарға таратпа.\n      3.    Дәлелдерді сақта. Хабарламалардың, пікірлердің немесе\nбасқа материалдардың скриншотын сақтап қой.\n\n      4.     Бұғатта және шағымдан. Ренжіткен адамды бұғаттап,\nплатформадағы шағымдану мүмкіндігін пайдалан.\n      5.     Басқа адамға қолдау көрсет. Егер кибербуллингке басқа\nадамның тап болғанын көрсең, оған қосылма, ренжітетін материалды\nтаратпа және қолдау көрсет.\n      6.     Қауіп төнсе, міндетті түрде көмек сұра. Егер саған қоқан-\nлоқы жасалса, бопсаласа немесе өзіңді қауіпсіз сезінбесең, бұл туралы\nбірден ересек адамға хабарла.\n      Кімнен көмек сұрауға болады?\n            ата-анаңнан немесе өзің сенетін жақын адамыңнан;\n            сынып жетекшісінен немесе басқа педагогтен;\n            мектеп психологінен;\n            111 – отбасы, әйелдер мен балалардың құқықтарын қорғау\nмәселелері бойынша Бірыңғай мемлекеттік байланыс орталығынан.\n      Педагог       білім    алушыларға       тақырыпқа      қатысты\nбейнематериалды көруді ұсынады.\n      https://drive.google.com/file/d/1P2jq6pUVs8J0Ogc1DvelgJ2piyedvJ\nyx/view?usp=sharing\n      III. Қорытынды бөлім\n      Педагог қорытынды жасайды:\n      -      Біреуді қорлау, қорқыту, мазақ ету, ренжітетін материал\nтарату немесе әдейі қудалау оның көңіл күйіне, оқуына және өзін\nқауіпсіз сезінуіне кері әсер етуі мүмкін.\n      «Заң мен тәртіп» қағидаты интернетте де өзгенің құқығын, ар-\nнамысы мен қадір-қасиетін құрметтеуді талап етеді. Сондықтан\nкибербуллингке қосылмау, ренжітетін материалды таратпау, мәселені\nагрессиямен шешпеу және қажет кезде ересектерден көмек сұрау\nмаңызды.\n      Егер кибербуллингке тап болсаң, дәлелдерді сақта, ренжіткен\nадамды бұғатта және болған жағдайды ата-анаңа, сынып жетекшісіне,\nмектеп психологіне немесе өзің сенетін басқа ересек адамға айт.\n      «Менің қауіпсіз қадамым» рефлексиясы\n      Педагог білім алушыларға сөйлемдерді жалғастыруды ұсынады:\n            «Егер мені интернетте ренжітсе, мен ...»\n            «Егер ренжітетін жазба немесе сурет көрсем, мен ...»\n            «Егер жағдайды өзім шеше алмасам, мен ... көмек\nсұраймын».\n      Басты ереже\n      Кибербуллингке қосылма. Өзгенің құқығын құрметте.\nДәлелдерді сақта және қажет болса, ересек адамнан көмек сұра.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1P2jq6pUVs8J0Ogc1DvelgJ2piyedvJ\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1P2jq6pUVs8J0Ogc1DvelgJ2piyedvJ<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 10-сабақ — Ұлы дала коды"}, "grade-5/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>5-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-5/index.html\">← 5-сынып тақырыптары<\/a><article><h2>Жолда жүру, самокат, велосипед және скейтборд тебу кезіндегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 213-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=213\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 11 сабақ      Жолда жүру, самокат, велосипед және скейтборд\n             тебу кезіндегі қауіпсіздік ережелері\nМақсаты          Білім алушылардың жолда, велосипед, самокат және\n             скейтборд тепкен кезде қауіпсіздік ережелерін сақтау\n             және дұрыс әрекет ету дағдыларын қалыптастыру.\nМіндеттері       - велосипед, самокат және скейтборд тебу кезіндегі\n             қауіпсіздік ережелері туралы білімдерін бекіту;\n                 - жолдан өту кезінде қауіпсіз әрекет ету алгоритмін\n             меңгерту;\n                 - жол жағдайын бағалай білу, зейін қою және өз\n             қауіпсіздігіне жауапкершілікпен қарау дағдыларын\n             дамыту.\n\n      Материалдар мен ресурстар\n      «Велосипедшілер       мен    самокат     пайдаланушыларының\nқауіпсіздігі» тақырыбындағы постер, «Қатені байқа» жаттығуына\nарналған жолдағы жағдайлар бейнеленген карточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Велосипед, самокат және скейтбордпен жүру қызықты әрі\nбелсенді қозғалысқа мүмкіндік береді. Бірақ оларды пайдаланған кезде\nқауіпсіздік ережелерін сақтау өте маңызды. Велосипедпен немесе\nсамокатпен жол қозғалысына қатысқанда жол ережелерін сақтау, ал\nскейтборд тепкенде қауіпсіз орын таңдап, айналадағы адамдарға\nкедергі келтірмеу қажет.\n      Ойланыңдар:\n      Велосипедті, самокатты немесе скейтбордты жақсы тебе білу\nқауіпсіздік ережелерін сақтамауға бола ма? Неліктен?\n      Телефонға алаңдап немесе жан-жағыңа қарамай жүргенде не\nболуы мүмкін?\n      Педагог қорытындылайды:\n      – Жолдағы сақтық денсаулық пен өмірді сақтауға көмектеседі.\nБүгін біз қауіпті жағдайлардың алдын алуға көмектесетін ережелерді\nеске түсіреміз.\n      II. Негізгі бөлім\n\n      «Қатесіз маршрут» жаттығуы\n      Педагог маршрут сызбасын көрсетеді:\n      үй → тротуар → жаяу жүргіншілер өткелі → саябақ.\n      Білім алушылар жолдың әр бөлігінде қалай дұрыс әрекет ету\nкеректігін түсіндіреді.\n      Талқылау:\n      Тротуар\n           жаяу жүргіншілерге жақындағанда жылдамдықты азайту;\n           жаяу жүргіншілерге кедергі келтірмеу;\n           адамдар көп жерде жылдам жүрмеу.\n           скейтборд тепкенде жаяу жүргіншілерге кедергі келтірмеу,\nадам көп жерде одан түсіп, қолмен алып жүру;\n      Жаяу жүргіншілер өткелі\n           өткелге жақындағанда тоқтау;\n           велосипедтен немесе самокаттан түсу, скейтбордты қолына\nалу;\n           велосипедті немесе самокатты жетектеп, ал скейтбордты\nқолына ұстап, жолдан жаяу өту;\n      Саябақ немесе веложол\n           басқа адамдармен арақашықтық сақтау;\n           біреуге жақындағанда алдын ала белгі беру;\n           адамдардың жанында қауіпті трюктер жасамау;\n           скейтборд тебуге қолайлы әрі қауіпсіз жерді таңдау;\n           жаяу жүргіншілердің жанында жылдамдықты азайту;\n           адамдар жүрген жерде қауіпті қимылдар мен трюктер\nжасамау;\n      Теміржол өткелі\n           теміржолдан тек арнайы белгіленген өткел арқылы өту;\n           өткелге жақындағанда тоқтап, екі жаққа қарау;\n           бағдаршамның белгісіне және дыбыстық ескертуге назар\nаудару;\n           пойыз жақындап келе жатса, жолдан өтпеу;\n           шлагбаум жабық немесе жабылып келе жатса, одан өтпеу;\n           велосипедті немесе самокатты жетектеп, скейтбордты\nқолына алып, теміржолдан жаяу өту;\n           теміржолдан өтер кезде телефонға алаңдамау және\nқұлаққапты шешу.\n      «Қатені байқа» практикалық тапсырмасы\n      Педагог әрекеттерді оқиды. Егер ереже бұзылса, білім алушылар\nқатені түсіндіріп, дұрыс шешім ұсынады.\n\n      Велосипедші жаяу жүргіншілер өткелінен велосипедтен түспей\nөтіп бара жатыр.\n       Бала самокатпен қорғаныш шлемін киіп жүр.\n       Самокат      мінген     бала    жаяу    жүргіншілерді жоғары\nжылдамдықпен айналып өтеді.\n       Бала жолға шығар алдында тежегіштерін тексереді.\n       Велосипедші қозғалыс кезінде телефонмен сөйлесіп келеді.\n       Бала скейтбордпен адамдар көп жүретін жерде жоғары\nжылдамдықпен келе жатыр.\n       Бала скейтборд тебер алдында шлемі мен қорғаныш құралдарын\nкиіп алды.\n      Талқылаудан кейін педагог қорытынды жасайды:\n      Велосипед пен электросамокатты пайдалану тәртібі Қазақстан\nРеспубликасының Жол жүрісі қағидаларында белгіленген. Бұл\nережелер жол қозғалысына қатысушылар үшін міндетті және\nадамдардың өмірі мен денсаулығын қорғауға көмектеседі.\n      Білу және сақтау маңызды:\n            жолдың жүру бөлігінде қозғалған кезде қорғаныш шлемін\nпайдалану қажет;\n            самокатпен жолаушы тасымалдауға болмайды;\n            жаяу жүргіншілер өткелінен велосипедтен немесе\nэлектросамокаттан түсіп, оны жаныңа жетектеп өту қажет;\n            қараңғы уақытта жарық шағылыстыратын киім, ал болған\nжағдайда жарықтандыру құралдарын пайдалану қажет;\n            қозғалыс кезінде ұялы телефонға алаңдауға болмайды;\n            қауіпсіз жылдамдықты таңдап, жаяу жүргіншілердің\nжанында, аулаларда және тұрақта тұрған көліктердің маңында аса\nмұқият болу қажет;\n            кәмелетке толмағандарға электросамокатпен жолдың жүру\nбөлігіне шығуға тыйым салынады.\n            Жалға     берілетін    электросамоакаттарды   кәмелетке\nтолмағандарға пайдалануға тыйым салынады.\n      Скейтборд тепкенде де қауіпсіздікті ұмытпа:\n            қорғаныш шлемін, тізеқап пен шынтаққапты пайдалан;\n            көлік жүретін жолға шықпа;\n            қауіпсіз әрі арнайы орындарды таңда;\n            жаяу жүргіншілерге кедергі келтірме;\n            жолдан өтерде скейтбордтан түсіп, оны қолыңа ал.\n      Педагог қорытындылайды:\n      Жол қозғалысы ережелерін сақтау – «Заң және тәртіп»\nқағидатының бір бөлігі. Ережелерді білу және орындау олардың заңмен\n\nбелгіленгені үшін ғана емес, өз қауіпсіздіктерің мен айналадағы\nадамдардың қауіпсіздігін сақтау үшін де маңызды.\n      III. Қорытынды бөлім\n      «Ережені жалғастыр» рефлексиясы\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n                 Велосипед, самокат немесе скейтборд тебер алдында\n      мен әрқашан ...\n                 Жолдан өтер кезде мен міндетті түрде ...\n                 Сапарым қауіпсіз болуы үшін ...\n                 Бүгін есте сақтаған ең маңызды ереже – ...\n      Педагог қорытынды жасайды:\n      – Жол қозғалысының жауапты қатысушысы жылдамдыққа емес,\nқауіпсіздікке мән береді. Ол «Заң мен тәртіп» қағидатын, жол жүрісі\nережелерін сақтайды, айналасындағы адамдарды құрметтейді және әр\nәрекетін ойланып жасайды.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "5-сынып · 11-сабақ — Ұлы дала коды"}};const HOME="grade-5/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
