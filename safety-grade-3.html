Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-3/lesson-08.html\"><h2>8. Онлайн ойындағы бейтаныс адамдармен қарым- қатынас қауіпсіздігі<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-3/lesson-09.html\"><h2>9. Бейтаныс адаммен сөйлескенде қалай сақтануға болады?<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-3/lesson-10.html\"><h2>10. Жер сілкінісі кезіндегі қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-3/lesson-11.html\"><h2>11. Табиғат аясындағы қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-3/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 119-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=119\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ           Төтенше жағдайлар қызметтері мен байланыс\n              орталығының телефон нөмірлері\nМақсаты            Қауіпті жағдайда дұрыс әрекет ету және көмек\n              сұрау дағдыларын қалыптастыру.\nМіндеттері         - жедел қызметтердің телефон нөмірлері туралы\n              білімдерін бекіту және қауіпті жағдайға сәйкес тиісті\n              қызметті таңдай білуге үйрету;\n                   - қауіпті жағдайда сабыр сақтап, дұрыс әрекет ету\n              және қажетті ақпаратты нақты жеткізу дағдыларын\n              дамыту;\n                   - жедел қызметтерге жауапкершілікпен жүгінуге\n              және жалған қоңырау шалуға болмайтынын түсіндіру.\n\n      Материалдар мен ресурстар\n      Телефон макеті, төтенше жағдайлар бейнеленген карточкалар,\n«Шұғыл көмек шақыру алгоритмі» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға мынадай жағдайды ұсынады:\n      -      Елестетіп көріңдер: серуендеп жүрген кезде үйдің\nтерезесінен түтін шығып жатқанын байқадыңдар. Жақын жерде ересек\nадам жоқ.\n      Педагогтің сұрақтары:\n            Ең алдымен не істейсіңдер?\n            Қауіпті жерге өз беттеріңше кіруге бола ма?\n            Көмек алу үшін қайда хабарласу керек?\n            Қоңырау кезінде қандай ақпаратты хабарлау қажет?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\nC74gi/view?usp=sharing\n      Педагог сабақтың тақырыбына жетелейді:\n      Қауіпті жағдайда дүрбелеңге берілмеу, жағдайды бағалау,\nкөмекке жүгінудің дұрыс тәсілін таңдау және қажетті ақпаратты\nхабарлау қажет.\n      Бүгін біз төтенше жағдайлар қызметтерінің нөмірлерін біліп қана\nқоймай, қай кезде көмек қажет екенін анықтауды, тиісті қызметті\nтаңдауды және қажетті ақпаратты дұрыс хабарлауды үйренеміз.\n      II. Негізгі бөлім\n      1. Жағдайға сәйкес қызметті таңда.\n\n      Педагог мынадай жағдайларды ұсынады:\n           Үйдің терезесінен түтін шығып жатыр. (101 – өрт сөндіру\nқызметі).\n           Адамның денсаулығы күрт нашарлады. (103 – жедел\nмедициналық жәрдем қызметі).\n           Қатты газ иісі сезілді. (104 – газдың авариялық қызметі).\n           Бейтаныс адам пәтерге кіруге тырысып жатыр. (102 –\nполиция).\n           Балаға көмек пен қолдау қажет. (111 – балалар мен\nотбасыларға көмек көрсету байланыс орталығы).\n      Педагог нақтылайды:\n      – Егер қай қызметке қоңырау шалу керектігін білмесеңдер немесе\nжағдай бірнеше қызметтің көмегін қажет етсе, 112 нөміріне қоңырау\nшалуға болады.\n      2. Диспетчерге не айту керек?\n      Педагог қысқаша алгоритмді түсіндіреді:\n      Не болды → қай жерде болды → кім қоңырау шалып тұр →\nдиспетчердің сұрақтарына жауап бер.\n      Білім алушылардың бірі педагогпен қысқаша диалог құрады.\nПедагог:\n      – 103 қызметі. Тыңдап тұрмын.\n      Білім алушы:\n      – Досымның өзін жайсыз сезініп тұр. Бұл үйдің ауласында болды.\nМекенжайым – Абай көшесі, №55 үй. Менің атым – Айбек.\n      Педагог:\n      – Сабырлы, анық сөйлеу және әңгімені бірінші болып өзің\nтоқтатпау маңызды.\n      3. Кімге жүгіну керек?\n      Педагог жағдайларды атайды:\n      – Сауда орталығында адасып қалдың.\n      Білім алушылар:\n      – Қызметкерге, күзетшіге немесе басқа да қауіпсіз ересек адамға\nжүгіну керек.\n      – Саған біреу қоқан-лоқы көрсетіп жүр, бірақ бұл туралы айтуға\nқорқасың.\n      Білім алушылар:\n      – Сенім артатын ересек адамға айту немесе 111 нөміріне\nхабарласу керек.\n      Педагог атап көрсетеді:\n\n      – Егер жағдай шұғыл қызметті шақыруды қажет етпесе, алдымен\nөзің сенетін ересек адамға жүгінеміз. Ал өмірге немесе денсаулыққа\nтікелей қауіп төнсе – шұғыл көмек шақырамыз.\n      III. Қорытынды бөлім\n      Педагог жағдайды атайды, ал білім алушылар хормен жауап\nберіп, дұрыс телефон нөмірін айтады.\n      Мысалдар:\n      – Жертөледен түтін шыққанын көрдіңдер ме? (101)\n      – Бейтаныс адам есікті бұзып кірмекші ме? (102)\n      – Асүйден газдың иісі шығып тұр ма? (104)\n      – Түнде тісің қатты ауырды ма? (103)\n      Педагог:\n      – Егер жағдайды өз бетіңше шеше алмасаң, 111 нөміріне –\nбалалар мен отбасыларға көмек көрсету жөніндегі бірыңғай\nмемлекеттік байланыс орталығына қоңырау шал. Онда сені мұқият\nтыңдап, қолдау көрсетеді және дұрыс шешім табуға көмектеседі.<\/div><p><a href=\"https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 1-сабақ — Ұлы дала коды"}, "grade-3/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Қауіпті жағдайларда «жоқ» деп айтуды үйренеміз<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 122-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=122\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ              Қауіпті жағдайларда «жоқ» деп айтуды\n               үйренеміз\nМақсаты             Білім алушылардың қауіпті және қолайсыз\n               ұсыныстардан      бас    тарта  білу    дағдыларын\n               қалыптастыру.\nМіндеттері          - қауіпті және қолайсыз өтініштерді ажырата\n               білуге үйрету;\n                    - қажет жағдайда «жоқ» деп нық айту және\n               қауіпсіз жерге бару дағдыларын дамыту;\n                    - өз қауіпсіздігіне жауапкершілікпен қарауға\n               және сенімді ересек адамнан көмек сұрауға тәрбиелеу.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, кейде біреу бізден көмек сұрайды. Мысалы,\nкітаптарды бірге тасу, сыныпты жинау немесе досымызға көмектесу.\nМұндай істер жақсы әрі пайдалы. Бірақ кейде біреу бізге қауіпті нәрсе\nістеуді ұсынуы мүмкін. Ондай кезде абай болған дұрыс. Қалай\nойлайсыңдар, өтініштерге әрқашан «Иә!» деу керек пе?\n      Білім алушылардың жауаптары.Педагог:\n      – Әрине, ондай өтінішке келісе берудің қажеті жоқ. Егер біреудің\nайтқаны сендерді қорқытса, көңілдеріңе жақпаса немесе дұрыс емес\nсияқты көрінсе, «жоқ» деп айтуға болады. Бүгін біз қажет кезде батыл\nтүрде «жоқ» деп айтуды және өзімізді қорғауды үйренеміз.\n      II. Негізгі бөлім\n      1. Қашан «жоқ» деп айту керек?\n      Педагог түсіндіреді.\n      Мынадай жағдайда бас тарту керек:\n            бейтаныс адам бір жаққа шақырса;\n            ата-анаңнан бір нәрсені жасыруды ұсынса;\n            ақшаңды, телефоныңды немесе жеке заттарыңды беруді\nсұраса;\n            белгісіз заттарды немесе сусындарды ішіп көруді ұсынса;\n            үй мекенжайыңды, телефон нөміріңді немесе құпиясөзіңді\nайтуды сұраса.\n      Педагог еске салады:\n      Әрбір бала өзін қауіпте сезінсе, «жоқ» деп айтуға құқылы.\n      Пайдалы сөз тіркестері:\n      – «Жоқ, мен бармаймын».\n      – «Жоқ, маған болмайды».\n\n      – «Алдымен ата-анамнан сұраймын».\n      – «Мен ересек адамды көмекке шақырамын».\n      2. «Қалай әрекет ету керек?» ойыны\n      Педагог жағдаяттарды оқиды.\n      1-жағдаят. Бейтаныс адам үйіңе дейін жеткізіп салуды ұсынады.\n      Жауап: «Жоқ, рақмет. Мен ата-анамды күтемін».\n      2-жағдаят. Досың сабақтан қашып кетуді ұсынады.\n      Жауап: «Жоқ, бұл – дұрыс емес».\n      3-жағдаят. Бейтаныс адам араларыңдағы әңгіме туралы ешкімге\nайтпауды сұрайды.\n      Жауап: Бұл туралы міндетті түрде ересектерге ескерт.\n      4-жағдай. Педагог оқулықтарды таратып беруге көмектесуді\nсұрайды.\n      Жауап: Бұл – қауіпсіз өтініш, көмектесуге болады.\n      III. Қорытынды бөлім\n      Сұрақтар:\n           Күмәнді жағдаяттар туралы ересектерге айту керек пе?\n           Бейтаныс адамдарға үй мекенжайыңды немесе телефон\nнөміріңді айтуға бола ма?\n           «Жоқ» деп айта білудің маңызы неде?\n           Кімнен көмек сұрауға болады?\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Егер бейтаныс адам мені өзімен бірге кетуге шақырса,\nмен…»\n           «Егер мен қорқып кетсем, …»\n           «Мен көмек сұрау үшін … жүгінемін».\n      Педагог:\n      – Бүгін біз әрбір баланың қауіпсіз болуға құқығы бар екенін\nбілдік. Егер жағдай қауіпті болып көрінсе немесе алаңдаушылық\nтуғызса, сенімді түрде «жоқ» деп айту, ол жерден кету және ересек\nадамнан көмек сұрау керек.\n      Кімнен көмек сұрау керегін білмесең, 111 байланыс орталығына\nхабарлас. Сені тыңдайды, түсінеді және көмектеседі.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 2-сабақ — Ұлы дала коды"}, "grade-3/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Жеке шекаралар және қауіпсіз қарым-қатынас<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 124-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=124\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ           Жеке шекаралар және қауіпсіз қарым-қатынас\nМақсаты            Білім алушылардың жеке шекара туралы\n               түсініктерін қалыптастыру және қауіпсіз қарым-\n               қатынас жасау дағдыларын дамыту.\nМіндеттері        жеке шекара ұғымын түсіндіру және өзіне\n               жайсыздық тудыратын әрекеттерді ажырата білуге\n               үйрету;\n                  қажет жағдайда «жоқ» деп айту, арақашықтық\n               сақтау және қауіпсіз жерге бару дағдыларын дамыту;\n                    өз шекарасын қорғауға, өзгенің шекарасын\n               құрметтеуге және сенімді ересек адамнан көмек\n               сұрауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Маған жайлы» және «Маған жайсыз» карточкалары, қарым-\nқатынас жағдайларының мысалдары бейнеленген суреттер, «Менің\nжеке шекараларым» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, әр адамның өзінің жеке кеңістігі болады. Бұл – өзімізді\nтыныш әрі жайлы сезінетін кеңістік. Сонымен қатар әр адамның жеке\nзаттары, ойлары мен сезімдері бар. Оларды құрметтеу қажет.\n      Мысалы, біреудің қаламын, телефонын немесе ойыншығын\nалмас бұрын, міндетті түрде рұқсат сұрау керек.\n      Талқылауға арналған сұрақтар:\n      – Біреудің затын рұқсатсыз алуға бола ма?\n      – Біреу өзіңе ұнамайтын немесе жайсыз әрекет жасағанда, өзіңді\nқалай сезінесің?\n      Білім алушылардың жауаптары. Педагог:\n      – Бүгін біз басқа адамдардың жеке шекараларын құрметтеуді\nжәне өз шекарамызды қорғауды үйренеміз.\n      II. Негізгі бөлім\n      1. «Дұрыс па, бұрыс па?» ойыны\n\n       Педагог бірнеше жағдайды көрсетеді. Білім алушылар\nадамдардың дұрыс әрекетін анықтап, жасыл немесе қызыл\nкарточкаларды көтереді.\n       Қауіпсіз жағдаяттар (жасыл карточка):\n            Досы: «Қаламыңды алуға бола ма?» – деп рұқсат сұрады.\n            Сыныптасы суретіңді көруге рұқсат сұрады.\n       Жеке шекара бұзылатын жағдайлар (қызыл карточка):\n            Біреу басқа адамның затын рұқсатсыз алды.\n            Біреу басқа адамның жеке хабарламаларын оқып отыр.\n            Біреу сені өзіңе жағымсыз нәрсені жасауға мәжбүрлеп\nжатыр.\n            Біреу ата-анаңнан маңызды ақпаратты жасыруды сұрайды.\n       Педагог қорытындылайды:\n       – Әр адамның құрметке ие болуға құқығы бар. Егер бір әрекет\nұнамаса немесе жайсыздық тудырса, бұл туралы ашық айта аламыз.\n       2. «Жоқ деп айта аламын» жаттығуы\n       Педагог жағдаяттарды оқиды. Білім алушылар әр жағдайда қалай\nжауап беруге болатынын айтады және «жоқ» сөзін нық айтуға\nжаттығады.\n       1-жағдаят. Сыныптасың сенің затыңды рұқсатсыз алғысы келеді.\n       Жауап: «Жоқ, бұл менің затым. Алдымен менен сұра».\n       2-жағдаят. Біреу сені өзің қаламайтын әрекетті жасауға\nмәжбүрлейді.\n       Жауап: «Жоқ, мен мұны қаламаймын». Қажет болса, ол жерден\nкетіп, ересек адамнан көмек сұра.\n       3-жағдаят. Біреу сені мазалаған немесе қорқытқан жағдайды\nешкімге айтпауды сұрайды.\n       Жауап: «Жоқ, мен бұл туралы өзім сенетін ересек адамға\nайтамын».\n       Педагог сұрайды:\n       – «Жоқ» деп айтқанда дауысымыз қандай болуы керек?\n       – Егер адам сенің жауабыңды тыңдамаса, не істейсің?\n       – Кімнен көмек сұрауға болады?\n       Қорытынды:\n       – Егер бір әрекет саған ұнамаса, қорқытса немесе жайсыздық\nтудырса, «жоқ» деп айтуға болады. Қажет болса, қауіпсіз жерге барып,\nөзің сенетін ересек адамнан, мектеп психологінен және сынып\nжетекшіден көмек сұра.\n       Кімнен көмек сұрау керегін білмесең, 111 байланыс орталығына\nхабарлас. Сені тыңдайды, түсінеді және көмектеседі.\n       III. Қорытынды бөлім\n\n     Рефлексия\n     Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n         «Егер маған бір нәрсе ұнамаса, мен…»\n         «Мен өз шекарамды мына сөздер арқылы қорғай аламын:\n…»\n           «Мен көмек сұрап … жүгіне аламын».\n      Педагог:\n      – Өз сезімдерің туралы айту және көмек сұрау – дұрыс әрекет. Әр\nадамның құрметке және қауіпсіздікке құқығы бар.\n      Кімнен көмек сұрауға болады?\n           ата-анаңнан немесе жақын туыстарыңнан;\n           сынып жетекшісінен;\n           мектеп психологінен;\n           әлеуметтік педагогтен;\n           өзің сенетін басқа да ересек адамдардан;\n           111 нөмірі бойынша – балалар мен отбасыларға көмек\nкөрсету жөніндегі бірыңғай мемлекеттік байланыс орталығынан.\n      Сабақтың басты ережесі\n      Басқалардың жеке шекарасын құрметте және өз шекараңды\nқорға: егер саған бір нәрсе жайсыз болса – «жоқ» деп айт және бұл\nтуралы ересек адамға хабарла.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 3-сабақ — Ұлы дала коды"}, "grade-3/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Күдікті зат тауып алғанда не істеу керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 127-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=127\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 4 сабақ         Күдікті зат тауып алғанда не істеу керек?\nМақсаты           Білім алушылардың бейтаныс, күмәнді немесе\n               ықтимал қауіпті заттарды анықтаған кездегі қауіпсіз\n               мінез-құлық дағдыларын қалыптастыру\nМіндеттері                ықтимал қауіпті заттарды танып-білуге\n               үйрету, оларды анықтаған кездегі нақты әрекет ету\n               алгоритмімен таныстыру;\n                          байқағыштықты, қырағылықты және сыни\n               ойлау қабілетін дамыту;\n                          жеке қауіпсіздігі мен айналасындағылардың\n               қауіпсіздігіне   жауапкершілікпен       қарау  сезімін\n               тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Суреттер: сөмке, рюкзак, бейтаныс қорап, шприц, ойыншық,\nтелефон макеті; «Қауіпті затты байқаған жағдайда не істеу керек?»\nжаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, мынадай жағдайды елестетіп көріңдер: көшеде келе\nжатып, орындықтың үстінде біреудің тастап кеткен әдемі ойыншығын\nнемесе жаңа телефонын көрдіңдер. Оны көргенде не істегілерің келеді?\nОны қарап көргілерің немесе өздеріңе алғыларың келуі мүмкін. Бірақ\nмұндай затты ұстау қауіпсіз бе?\n      Бүгін біз бейтаныс заттарға неге қол тигізуге болмайтынын және\nкүмәнді зат тауып алған жағдайда не істеу керектігін үйренеміз.\n      II. Негізгі бөлім\n      Педагог білім алушыларға қауіпсіздіктің алғашқы алтын\nережесін түсіндіреді:\n      Өзіңе тиесілі емес затты рұқсатсыз алуға болмайды. Кейбір бөгде\nзаттар қауіпті болуы мүмкін, сондықтан оларды ұстамай, бірден ересек\nадамға айтқан дұрыс.\n      1. Қараусыз қалған заттар: метро, автобустардағы немесе мектеп\nдәліздеріндегі сөмкелер, рюкзактар, чемодандар, қораптар. Мұндай\n\nзаттардың ішінде не бар екені белгісіз, сондықтан оларға жақындамау,\nқол тигізбеу және бірден ересек адамға хабарлау керек.\n      2. Қызығушылықты тудыратын қауіпті заттар: телефондар,\nәмияндар, ойыншықтар, планшеттер. Қылмыскерлер қауіпті заттарды\nбалалардың қызығушылығын оятып, оларды алуға итермелеу үшін\nқұнды заттардың кейпіне әдейі келтіруі мүмкін.\n      3. Өткір және медициналық заттар: пайдаланылған шприцтер,\nампулалар, бейтаныс таблеткалар. Олардың құрамында қауіпті\nвирустар немесе улы заттар болуы мүмкін. Тіпті ескі термометрлердің\nсынған бөліктері де (сынап) қауіпті.\n      4. Әскери заттар: тот басқан патрондар, снарядтар. Олар\nтопырақта көп жыл жатса да, болмашы ғана әсерден жарылып кетуі\nмүмкін.\n      Педагог сыныппен бірге әрбір оқушы орындауы тиіс әрекет ету\nалгоритмін қарастырады.\n      1. Жақындама! Күмәнді затты көрсең – тоқта!\n      2. Қолыңмен ұстама! Оны аяғыңмен теппе, көтерме, ашпа,\nсілкіме және үстін ешнәрсемен жаппа!\n      3. Телефонды күмәнді заттың қасында пайдаланба! Қауіпсіз\nқашықтыққа алыста да, содан кейін ғана қоңырау шал! (102 не 111-ге\nқоңырау шал).\n      4. Үндемей қалма! Бірден өзің сенетін ересек адамға айт немесе\nшұғыл қызметке қоңырау шал!\n      III. Қорытынды бөлім\n      Педагог білім алушылардың зат табылған жерге байланысты\nкімге хабарласу керектігін түсінгенін тексереді:\n           Мектептен тапсаң – мұғалімге, күзетшіге немесе\nдиректорға хабарла.\n           Автобустан немесе метрода тапсаң – жүргізушіге немесе\nмашинистке, басқа да ересек адамға хабарла.\n           Дүкеннен тапсаң – сатушыға немесе дүкен күзетшісіне\nхабарла.\n           Көшеден тапсаң, ал жақын жерде таныс ересек адам\nболмаса – арақашықтық сақтап, ата-анаңа қоңырау шал немесе 112\nнөміріне хабарлас.\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Бүгін мен … білдім»\n           «Егер мен күмәнді затты көрсем, мен …» (оған\nжақындамаймын және ересек адамға хабарлаймын).\n           «Мен      есте      сақтаған     басты     ереже:    …»\n(«Жақындама! Қолмен ұстама! Алыста! Ересек адамға хабарла!»)\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 4-сабақ — Ұлы дала коды"}, "grade-3/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Эвакуация басталған жағдайда не істеу керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 129-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=129\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 5 сабақ         Эвакуация басталған жағдайда не істеу керек?\nМақсаты           Білім алушылардың эвакуация кезіндегі қауіпсіз\n              мінез-құлық дағдыларын қалыптастыру\nМіндеттері          «эвакуация» ұғымымен және оны жүргізу\n              себептерімен таныстыру;\n                    эвакуация кезінде қауіпсіз әрекет ету\n              алгоритмін меңгерту;\n                    зейінділікті, тәртіптілікті және ересектердің\n              нұсқауларын орындай білу дағдыларын дамыту.\n\n      Материалдар мен ресурстар\n      эвакуация және шығу белгілері бейнеленген карточкалар,\nғимараттан қауіпсіз шығу сызбасы, «Дұрыс» және «Бұрыс»\nжағдаяттары бейнеленген карточкалар, өрт дабылының суреті.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, кейде мектепте, үйде немесе қоғамдық орындарда\nэвакуация жариялануы мүмкін. Бұл қауіпті жағдай туындаған кезде\nадамдарды ғимараттан тез әрі қауіпсіз шығару үшін жасалады. Бүгін біз\nөзімізге және айналамыздағы адамдарға қауіп төндірмей қалай дұрыс\nәрекет ету керектігін үйренеміз.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n    https://drive.google.com/file/d/1QPf5FreQ_EOfUDUaTFM\nG9HshJlQpxyEF/view?usp=sharing\n     II. Негізгі бөлім\n     1. Эвакуация кезіндегі қауіпсіздік ережелері\n     Педагог түсіндіреді:\n     Егер эвакуация басталса:\n     1. Сабыр сақта. Айқайлама, жүгірме, өзгелердің сыртқа\nшығуына кедергі келтірме.\n     2. Ересектерді мұқият тыңда. Педагогтің немесе жауапты\nадамның нұсқауларын орында.\n\n      3. Ғимаратқа қайта кірме. Телефон, сөмке немесе басқа\nзаттарыңды алу үшін кері қайтпа.\n      4. Асықпай қозғал. Сыныппен бірге «ШЫҒУ» белгісіне қарай\nжүр. Басқаларды басып озуға немесе итеруге болмайды.\n      5. Сыртқа шыққаннан кейін сыныбыңмен бірге бол.\nӨз бетіңше ешқайда кетпе. Педагогтің келесі нұсқауын күт.\n      2. «Дұрыс па, бұрыс па?» ойыны\n      Педагог әртүрлі әрекеттерді оқиды. Егер әрекет дұрыс әрі\nқауіпсіз болса, білім алушылар орындарынан тұрады, ал дұрыс\nболмаса, орындарында қалады. Әр жауаптан кейін педагог дұрыс\nәрекетті балалармен бірге талқылайды.\n         Дабыл белгісін естіген оқушы сыныппен бірге шығуға\nдайындалды. (Дұрыс)\n         Оқушы телефонын алу үшін сыныпқа қайта кірді. (Бұрыс)\n         Оқушы педагогтің соңынан асықпай, сыныппен бірге шығып\nкеледі. (Дұрыс)\n         Балалар шығатын кезде жүгіріп, бір-бірін итеріп жатыр.\n(Бұрыс)\n         Ғимараттан шыққаннан кейін оқушы өз сыныбымен бірге\nқалды. (Дұрыс)\n      Есте сақта:\n       лифтіні пайдаланба;\n       жүгірме және басқаларды итерме;\n       педагогтің және жедел қызмет мамандарының нұсқауларын\nорында.\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n                 Дабыл белгісін естісем, мен ...\n                 Эвакуация кезінде ... болмайды.\n                 Эвакуация кезінде мен ... тыңдаймын.\n                 Ғимараттан шыққаннан кейін мен ...\n      Педагог:\n      – Эвакуация адамдардың қауіпсіздігі үшін жүргізіледі.\nСондықтан сабыр сақтап, ересектердің нұсқауларын мұқият орындау\nмаңызды.\n      Сабақтың басты ережесі:\n      «Сабыр сақта! Ересектерді тыңда! Сыныппен бірге қауіпсіз жерге\nшық!».\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1QPf5FreQ_EOfUDUaTFM\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1QPf5FreQ_EOfUDUaTFM<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 5-сабақ — Ұлы дала коды"}, "grade-3/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Абайла: электр энергиясы!<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 131-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=131\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 6 сабақ         Абайла: электр энергиясы!\nМақсаты           Білім алушылардың электр қауіпсіздігінің негізгі\n              ережелері туралы түсінігін қалыптастыру және электр\n              тоғына байланысты қауіпті жағдайлар туындаған кезде\n              дұрыс әрекет етуге үйрету\nМіндеттері        - білім алушыларды электр тоғымен және электр\n              құрылғыларымен қауіпсіз жұмыс істеудің негізгі\n              ережелерімен таныстыру;\n                  - қауіпті жағдайларды танып-білуге және олар\n              туындаған кезде дұрыс әрекет етуге үйрету;\n                  - өз қауіпсіздігіне және айналасындағылардың\n              қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Электр құрылғылары мен розеткалардың суреттері, қауіпсіз және\nқауіпті жағдайлар бейнеленген бөлме суреті, электр қауіпсіздігі\nбойынша тақырыптық бейнематериал.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, электр энергиясы күн сайын айналамызда. Оның\nкөмегімен жарық, теледидар, компьютер, тоңазытқыш және басқа да\nкөптеген құрылғылар жұмыс істейді. Бірақ қауіпсіздік ережелерін\nсақтамаса, электр қуаты қауіпті болуы мүмкін. Бүгін біз қандай\nжағдайлардың қауіпті екенін және өзімізді қорғау үшін қалай дұрыс\nәрекет ету керектігін үйренеміз.\n      II. Негізгі бөлім\n      1. Электр қауіпсіздігінің ережелері\n      Педагог түсіндіреді.\n      Электр энергиясын қауіпсіз пайдалану үшін қарапайым\nережелерді сақтау қажет:\n      1. Розеткаларға қол тигізбе. Розеткаға саусақтарыңды немесе\nбөгде заттарды сұқпа.\n      2. Электр құрылғыларын дымқыл қолмен пайдаланба.\nЭлектр құрылғысын қолданар алдында қолыңды құрғату қажет.\n\n      3. Зақымдалған сымдарға қол тигізбе. Егер сым үзілсе, сыртқы\nқаптамасы ашылып қалса, қызып тұрса немесе одан ұшқын шықса, оған\nқол тигізбеу керек.\n      4.    Электр     құрылғыларын        өз    бетіңше   жөндеме.\nҚұрылғы істен шықса, бұл туралы ересек адамға хабарла.\n      5. Электр құрылғыларын судың жанында пайдаланба.\nСу мен электр тоғы қауіпті жағдайға әкелуі мүмкін.\n      6. Электр құрылғыларымен ойнама.\n      2. «Электрлік детектив»\n      Педагог:\n      – Ал енді ең маңызды тапсырмаға көшейік. Алдарыңда бөлменің\nсуреті берілген. Бұл бөлмеде электр тоғына байланысты қауіпті\nжағдайлар жасырылған. Сендердің міндеттерің – оларды тауып алу.\n      Экранда бөлменің суреті көрсетіледі.\n      Білім алушылар мына қауіпті жағдайларды табуы керек:\n           зақымдалған сым;\n           суға жақын орналасқан электр құрылғысы;\n           розеткаға қол тигізіп тұрған бала;\n           ақауы бар электр құрылғысы.\n      Балалар қауіпті жағдайды тапқаннан кейін педагог сұрақ қояды:\n      – Бұл жерде не дұрыс емес?\n      – Бұл жағдайда қауіпсіздікті қалай сақтауға болады?\n      3. Қауіпті жағдайда қалай әрекет ету керек?\n      Педагог:\n      – Ал егер сенің жаныңда электр тоғына байланысты қауіпті\nжағдай орын алса, не істеу керек? Өзіңе қауіп төндірмей, қалай\nкөмектесесің?\n      Бірнеше маңызды ережені есте сақтаңдар:\n           сымдарға, ақаулы құрылғыларға және басқа да қауіпті\nзаттарға жақындама және қол тигізбе;\n           қауіпті жағдайды өз бетіңше жоюға немесе электр\nқұрылғысын жөндеуге тырыспа;\n           бірден ата-анаңды, педагогті, күзетшіні немесе көмек\nкөрсете алатын басқа ересек адамды шақыр;\n           егер біреуге шұғыл көмек қажет болса, бұл туралы ересек\nадамға хабарла. Қажет болған жағдайда 112 немесе 103 нөміріне\nқоңырау шал;\n           ересек адамның немесе төтенше жағдайлар қызметі\nмаманының нұсқауларын орында және қауіпті жерге қайта барма.\n      Педагог:\n\n     – Ең бастысы – өзіңді қауіпке итермелеу. Егер не істеу керектігін\nбілмесең, бірден ересек адамнан көмек сұра.\n     Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\nhttps://www.youtube.com/watch?v=Ak3skdTL3PY\n     III. Қорытынды бөлім\n     Рефлексия\n     Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n          «Егер мен зақымдалған сымды көрсем, …»\n          «Дымқыл қолмен … болмайды»\n          «Розеткаға … болмайды»\n          «Егер электр құрылғысы істен шықса, мен…»\n          «Егер мен қауіпті жағдайды көрсем, …»\n     Педагог:\n     –Ең бастысы – электр ақауын ешқашан өз бетіңше жөндеуге\nнемесе қауіпті жағдайды жоюға тырыспау. Егер қауіпті жағдайды\nбайқасаң, өз бетіңше әрекет етпе және міндетті түрде ересек адамға\nхабарла.\n     Сабақтың басты ережесі\n     «Қол тигізбе! Алыста! Ересек адамға хабарла!»\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=Ak3skdTL3PY\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=Ak3skdTL3PY<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 6-сабақ — Ұлы дала коды"}, "grade-3/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Интернеттегі жаңа достарға сенуге бола ма?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 134-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=134\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 7 сабақ          Интернеттегі жаңа достарға сенуге бола ма?\nМақсаты            Білім алушылардың интернеттегі қауіпсіз қарым-\n               қатынас жасау дағдыларын қалыптастыру\nМіндеттері          білім алушыларды интернетте бейтаныс\n               адамдармен қауіпсіз қарым-қатынас жасаудың негізгі\n               ережелерімен таныстыру;\n                    қауіпті өтініштер мен хабарламаларды танып-\n               білуге үйрету;\n                    интернеттегі                 қарым-қатынасқа\n               жауапкершілікпен және сақтықпен қарауға тәрбиелеу.\n\n     Материалдар мен ресурстар\n     Интернеттегі хабарламалардың мысалдары, «Қауіпсіз» және\n«Қауіпті» деген жазуы бар суреттер, «Жауап берме – жеке\nмәліметтеріңді хабарлама – ересек адамға айт» жаднамасы.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог:\n     – Балалар, интернетте біз бейнероликтер көреміз, ойын\nойнаймыз, білім аламыз және бір-бірімізбен сөйлесеміз. Кейде бізге\nинтернет арқылы танымайтын адамдар да хабарлама жазуы мүмкін.\nМынадай жағдайды елестетіп көріңдер. Сендерге хабарлама келді:\n     «Сәлем! Дос болайық! Жасың нешеде? Қайда тұрасың? Суретіңді\nжіберші».\n     Білім алушыларға сұрақтар:\n     – Мұндай хабарламаға жауап берген дұрыс па?\n     – Бейтаныс адам сен туралы қандай ақпаратты білгісі келіп тұр?\n     – Бейтаныс адамдарға өзің туралы қандай мәліметтерді\nхабарлауға болмайды?\n     Білім алушылардың жауаптары. Педагог:\n     – Интернетте адам өзін басқа біреу ретінде таныстыруы мүмкін.\nСондықтан бүгін біз интернетте қалай қауіпсіз қарым-қатынас жасау\nкеректігін және хабарлама күмән тудырған жағдайда не істеу керектігін\nүйренеміз.\n     II. Негізгі бөлім\n     1. Қауіпсіз қарым-қатынас ережелері\n\n      Педагог:\n      – Бейтаныс адамдармен интернетте қарым-қатынас жасаудың үш\nқарапайым ережесін есте сақтаңдар:\n      1. Жауап берме. Егер бейтаныс адам оғаш сұрақтар қойса,\nсуретіңді жіберуді, сілтемеге өтуді немесе арадағы әңгімені құпия\nсақтауды сұраса, сөйлесуді жалғастырма.\n      2. Жеке мәліметтеріңді хабарлама. Бейтаныс адамдарға толық\nаты-жөніңді, мекенжайыңды, телефон нөміріңді, мектебіңді,\nқұпиясөздеріңді, кодтарды және басқа да жеке мәліметтеріңді берме.\n      3. Сенетін ересек адамға айт. Егер хабарлама сені қорқытса,\nкүмәндандырса немесе не істеу керектігін білмесең, бұл жағдаймен\nжалғыз қалма. Өзің сенетін ересек адамнан көмек сұра.\n      Педагог түсіндіреді:\n      – Сенетін ересек адам – жанында өзіңді қауіпсіз сезінетін және\nкөмек сұрап жүгіне алатын адам. Бұл ата-анаң немесе басқа жақын\nересек адам, педагог, сынып жетекшісі немесе мектеп психологі болуы\nмүмкін.\n      Егер жағдай туралы таныс ересек адамға айту қиын болса немесе\nқосымша көмек қажет болса, 111 байланыс орталығына жүгін. Мұнда\nбалалардың құқықтарын қорғау, қауіпсіздігі мен әл-ауқатына қатысты\nмәселелер бойынша көмек пен кеңес алуға болады.\n      Педагог:\n       Кейде интернетте адамның жеке мәліметтерін алу үшін\nсілтемелері бар хабарламалар жіберуі немесе сыйлықтар ұсынуы\nмүмкін.    Мысалы: «Сен       жүлде    ұтып    алдың!     Сілтемеге\nөт» немесе «Құпиясөзіңді жіберсең, ойындағы сыйлықты аласың».\nМұндай хабарламалар алаяқтық болуы мүмкін. Белгісіз сілтемелерге\nөтпеу және өзің туралы жеке мәліметтерді хабарламау керек.\n      2. «Қауіпті ме, қауіпсіз бе?» ойыны\n      Педагог жағдайларды оқиды. Егер әрекет қауіпсіз болса, білім\nалушылар бас бармағын жоғары көтереді, ал қауіпті болса – төмен\nтүсіреді. Әр жауаптан кейін педагог білім алушылардан өз таңдауын\nтүсіндіруді сұрайды.\n      1-жағдай. Ойындағы бейтаныс адам сенен қай мектепте\nоқитыныңды сұрады.\n      Жауап: Қауіпті. Бейтаныс адамдарға жеке ақпаратты хабарлауға\nболмайды.\n      2-жағдай. Бала күмәнді хабарлама алып, оны ата-анасына\nкөрсетті.\n      Жауап: Қауіпсіз. Хабарлама күмән тудырса, ересек адамнан\nкөмек сұрау керек.\n\n      3-жағдай. Бейтаныс адам тегін сыйлық ұсынып, белгісіз\nсілтемеге өтуді сұрады.\n      Жауап: Қауіпті. Белгісіз сілтемелерді ашуға болмайды.\n      Педагог:\n      – Қауіпті жағдайлардың ортақ белгісі қандай?\n(Білім алушылардың жауаптары.)\n      – Дұрыс. Бейтаныс адам жеке ақпаратты алуға тырысады, белгісіз\nсілтемеге өтуді ұсынады немесе интернеттегі қарым-қатынасты\nересектерден жасыруды сұрайды.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-\nLvKn160Eh6m/view\n      III. Қорытынды бөлім\n      Педагог білім алушыларға үш негізгі ережені еске түсіруді\nұсынады.\n      Педагог:\n      – Егер бейтаныс адам интернетте саған жазып, жеке сұрақтар\nқойса, не істеу керек?\n      Педагог:\n      –Интернетте мұқият болу маңызды. Адам қанша жерден жылы\nшырайлы немесе достық ниеттегі болып көрінсе де, оған жеке\nмәліметтеріңді беруге, суреттеріңді жіберуге немесе күмәнді\nөтініштерін орындауға болмайды. Егер бір нәрсе күмән тудырса,\nқарым-қатынасты тоқтатып, ересек адамнан көмек сұрау керек.\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n            «Интернетте бейтаныс адамдарға мен … туралы ақпаратты\nхабарламаймын»\n            «Егер бейтаныс адам менен сілтемеге өтуді сұраса, мен…»\n            «Егер хабарлама маған күмәнді болып көрінсе, мен…»\n      Педагог қорытындылайды:\n      –      Интернеттегі      қауіпсіз    қарым-қатынастың     басты\nережесі: күмәнді хабарламаларға жауап берме, жеке ақпаратты\nхабарлама және ересек адамға айт.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1VaeewGnO-LcajVQGXYPY-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 7-сабақ — Ұлы дала коды"}, "grade-3/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Онлайн ойындағы бейтаныс адамдармен қарым- қатынас қауіпсіздігі<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 137-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=137\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 8 сабақ          Онлайн ойындағы бейтаныс адамдармен қарым-\n              қатынас қауіпсіздігі\nМақсаты            Білім алушылардың онлайн-ойындардағы қауіпсіз\n              қарым-қатынас жасау дағдыларын қалыптастыру\nМіндеттері          ойын чаттары мен қоңырауларындағы қауіпсіз\n              және қауіпті өтініштерді ажырата білуге үйрету;\n                    интернетте бейтаныс адамдармен қарым-\n              қатынас жасау кезінде қауіпті жағдайларды танып-білу\n              және дұрыс әрекет ету дағдыларын дамыту;\n                    онлайн-ойындарда       бейтаныс     адамдармен\n              қарым-қатынас жасауға жауапкершілікпен және\n              сақтықпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Бейнеролик, ойын чаттарындағы хабарламалардың мысалдары\nбар карточкалар, қауіпсіздік ережелері жазылған карточкалар: «Жауап\nберме», «Жеке мәліметтерді хабарлама», «Сілтемелерді ашпа»,\n«Ересек адамға айт».\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, көпшілігің онлайн ойындар ойнағанды ұнатасыңдар.\nОйындарда деңгейлерден өтуге, тапсырмаларды орындауға және басқа\nойыншылармен қарым-қатынас жасауға болады. Бірақ кейде ойын\nбарысында сендерге бейтаныс адамдар жазуы немесе қоңырау шалуы\nмүмкін. Оларға сенуге бола ма?\n      Білім алушылардың жауаптары. Педагог хабарламаны көрсетеді:\n      «Сәлем! Мен де осы ойынды ойнаймын. Жасың нешеде және\nқайда тұратыныңды жазшы. Кездесейік».\n      Сұрақтар:\n      – Мұндай хабарламаға жауап беруге бола ма?\n      – Хабарламадағы қандай сөздер сендерге күмән немесе\nалаңдаушылық тудыруы керек?\n      Педагог:\n      – Бүгін біз бейтаныс адам ойын арқылы жазып, қоңырау шалған\nжағдайда қалай дұрыс әрекет ету керектігін үйренеміз.\n\n       II. Негізгі бөлім\n       1. Ойындағы қауіпті өтініштер\n       Педагог түсіндіреді:\n       – Ойын кезінде бейтаныс адамдарға мынадай ақпараттарды\nхабарлауға болмайды:\n       1.     Толық аты-жөніңді;\n       2.     Үй мекенжайыңды;\n       3.     Мектебіңнің атауын;\n       4.     Телефон нөміріңді;\n       5.     Аккаунтыңның құпиясөзін;\n       6.     Хабарламалар арқылы келген кодтарды.\n       Қауіпті хабарламалар мынадай болуы мүмкін:\n             «Құпиясөзіңді бер, мен саған сирек кездесетін ойын\nқұралын сыйлаймын»;\n             «Қайда тұратыныңды айтшы, саған сыйлық жібергім\nкеледі»;\n             «Ересектерге айтпа, бұл біздің құпиямыз»;\n             «Сілтемеге өтсең, тегін монеталар аласың».\n       Педагог:\n       – Шынайы дос сенің құпияларыңды сұрамайды және өзіңе\nжағымсыз немесе қауіпті нәрсені жасауға мәжбүрлемейді.\n       2. «Жауап беру немесе тоқтау» ойыны\n       Педагог жағдайларды оқиды, білім алушылар «Болады» немесе\n«Болмайды» карточкаларын көрсетеді.\n       1-жағдаят\n       Ойыншы жазады: «Сәлем! Бірге ойнайық. Атың кім?»\n       Жауап: Бейтаныс адамға шын атыңды хабарлама. Құрамында\nжеке ақпарат жоқ ойын никнеймін қолдан: аты-жөнің, жасың, туған\nжылың, мектебің немесе қалаң көрсетілмегені дұрыс.\n       Мысалы: PixelFox, SkyDragon немесе TurboPanda.\n       2-жағдаят\n       Ойыншы айтады: «Құпиясөзіңді бер, аккаунтыңды дамытуға\nкөмектесемін».\n       Жауап: Болмайды. Құпиясөзді ешкімге айтуға болмайды.\n       3-жағдаят\n       Ойыншы сілтеме жібереді: «Ашсаң, тегін сыйлықтар аласың».\n       Жауап: Болмайды. Белгісіз сілтемелерді ашуға болмайды.\n       Педагог білім алушылардың назарын тақырыптық постерге\nаударады.\nhttps://drive.google.com/file/d/1CeRWiOOm817PriTnqHcq58MMfuIQZu\nqW/view?usp=sharing\n\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Егер ойын барысында маған бейтаныс адам жазса, мен…»\n           «Егер менен сурет жіберуді сұраса, мен…»\n           «Егер жағдай маған күдікті болып көрінсе, мен…»\n      Педагог қорытындылайды:\n       –    Бейтаныс адамдарға жеке мәліметтеріңді хабарламаңдар,\nсуреттеріңді жібермеңдер және күмәнді өтініштерді орындамаңдар.\nЕгер қарым-қатынас сендерге алаңдаушылық немесе күмән тудырса,\nоны тоқтатып, сенетін ересек адамға айтыңдар. Қажет болса, мектеп\nпсихологінен немесе 111 байланыс орталығынан көмек пен кеңес алуға\nболады.<\/div><p><a href=\"https://drive.google.com/file/d/1CeRWiOOm817PriTnqHcq58MMfuIQZu\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1CeRWiOOm817PriTnqHcq58MMfuIQZu<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 8-сабақ — Ұлы дала коды"}, "grade-3/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Бейтаныс адаммен сөйлескенде қалай сақтануға болады?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 140-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=140\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 9 сабақ         Бейтаныс адаммен сөйлескенде қалай сақтануға\n              болады?\nМақсаты           Білім алушылардың бейтаныс адамдармен қауіпсіз\n              қарым-қатынас жасау дағдыларын қалыптастыру\nМіндеттері        - білім   алушыларды бейтаныс адамдармен\n              қауіпсіз    қарым-қатынас    жасау   ережелерімен\n              таныстыру;\n                  - қауіпсіз жағдайларды қауіпті жағдайлардан\n              ажырата білуге үйрету;\n                  - өзіне деген сенімділікті және дұрыс шешім\n              қабылдау қабілетін дамыту.\n\n      Материалдар мен ресурстар\n      Адамдармен қарым-қатынас жасаудың әртүрлі жағдайлары\nбейнеленген суреттер, мынадай сөз тіркестері жазылған карточкалар:\n            «Жоқ, мен бармаймын»;\n            «Мен алдымен ата-анамнан сұрауым керек»;\n            «Мен бұл туралы ересек адамға айтамын».\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, біз күн сайын әртүрлі адамдарды кездестіреміз:\nкөршілерді, сатушыларды, автобустағы жолаушыларды, көшедегі\nадамдарды. Адамдардың көпшілігі мейірімді және жақсы ниетті, бірақ\nбіз олардың барлығын жеке тани бермейміз.\n      – Қалай ойлайсыңдар, бейтаныс адам деп кімді атаймыз?\n      Білім алушылардың жауаптары. Педагог:\n      – Бейтаныс адам – сен танымайтын немесе алғаш рет көріп тұрған\nадам. Адам күлімсіреп тұрса, сыйлық ұсынса немесе ата-анаңды\nтанитынын айтса да, қауіпсіздік ережелерін есте сақтау керек.\n      II. Негізгі бөлім\n      «Бола ма, болмай ма?» ойыны\n      Педагог жағдяттарды оқиды.\n      Мысалдар:\n            Көршімен амандасу.\n            Бейтаныс адам кәмпит ұсынады.\n            Полиция қызметкері ата-анаңды табуға көмектеседі.\n            Бейтаныс адам үйге дейін жеткізіп салуды ұсынады.\n            Бейтаныс әйел мысығын табуға көмектесуді сұрап, өзімен\nбірге жүруді ұсынады.\n\n      Егер жағдаят қауіпсіз болса, білім алушылар жасыл карточканы,\nал қауіпті болса қызыл карточканы көрсетеді.\n      Педагог:\n      – Жарайсыңдар! Сендер қауіпсіз және қауіпті жағдайларды\nдұрыс ажыраттыңдар.\n      Қауіпсіздік алгоритмін есте сақта\n      1. «Жоқ!» де. Бейтаныс адаммен бірге кетпе және одан ештеңе\nалма.\n      2. Алыста. Адамдар көп, қауіпсіз жерге қарай бар.\n      3. Көмекке шақыр. Полиция қызметкеріне, күзетшіге, сатушыға\nнемесе көмектесе алатын басқа ересек адамға жүгін.\n      4. Егер сені алып кетуге немесе ұстап алуға тырысса, қатты\nдауыстап айқайла: «Көмектесіңіздер! Мен бұл адамды танымаймын!»\n      5. Қауіп төнсе, 102 немесе 112 нөміріне қоңырау шал.\n      6. Болған жағдайды сенетін ересек адамға міндетті түрде айт.\n      Практикалық жаттығу «Қалай дұрыс әрекет ету керек?»\n      Педагог:\n      – Бейтаныс адам мынадай әрекеттер жасаса, не істеу керек?\n            тәтті ұсынып жатса;\n            жол көрсетуді сұраса;\n            көлігімен қыдырып келуге шақырса;\n            ата-анаң сені алып кетуді тапсырғанын айтса.\n      Білім алушылардың ықтимал жауаптары:\n            «Жоқ, рақмет».\n            «Мен ересек адамды шақырамын».\n            «Маған бейтаныс адамдармен бірге кетуге болмайды».\n            «Мен бұл туралы ата-анама немесе мұғалімге айтамын».\n      III. Қорытынды бөлім\n      Талқылауға арналған сұрақтар\n            Бейтаныс адамдармен бірге кетуге бола ма?\n            Бейтаныс адамдардан сыйлық алуға бола ма?\n            Күмәнді немесе қауіпті жағдайлар туралы ересектерге айту\nкерек пе?\n            Бейтаныс адам бір жерге баруды ұсынса, не істеу керек?\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n            «Егер маған бейтаныс адам жақындаса, мен…»\n            «Егер мен алаңдай бастасам, …»\n            «Көмек қажет болса, мен…»\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 9-сабақ — Ұлы дала коды"}, "grade-3/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Жер сілкінісі кезіндегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 142-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=142\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ           Жер сілкінісі кезіндегі қауіпсіздік ережелері\nМақсаты             Білім алушылардың жер сілкінісі кезіндегі\n               қауіпсіз мінез-құлық дағдыларын қалыптастыру, жер\n               асты дүмпулері кезінде және одан кейін дұрыс әрекет\n               етуге үйрету\nМіндеттері           білім алушыларды жер сілкінісі кезіндегі\n               негізгі мінез-құлық ережелерімен таныстыру;\n                     жер асты дүмпулері кезінде дұрыс әрекет етуге\n               және қауіпсіз орын табуға үйрету;\n                     өз    қауіпсіздігіне    және     айналасындағы\n               адамдардың        қауіпсіздігіне      сабырлы      әрі\n               жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Ғимарат ішіндегі қауіпсіз және қауіпті орындардың суреттері,\nжер сілкінісі кезіндегі әрекеттер сызбасы, тақырыптық бейнематериал.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, елестетіп көріңдерші: сендер сыныпта отырсыңдар,\nкенеттен парталар теңселіп, жиһаздар қозғала бастады. Бұл не болуы\nмүмкін?\n      Білім алушылардың жауабы. Педагог:\n      – Жер сілкінісі – жер астындағы дүмпулер. Олар ғимараттардың\nқозғалуына немесе зақымдануына, заттардың құлауына және басқа да\nқауіпті жағдайларға әкелуі мүмкін. Жер сілкінісі кезінде ең бастысы\n– дүрбелеңге түспеу және не істеу керектігін білу.\n      Бүгін біз жер сілкінісі кезінде дұрыс әрі қауіпсіз әрекет етуді\nүйренеміз.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n   https://drive.google.com/file/d/1ikBBSopuniZNSNa6185B\nMUVj1asul9tf/view?usp=sharing\n     II. Негізгі бөлім\n     1. Жер сілкінісі кезінде не істеу керек?\n\n      Педагог түсіндіреді. Егер жер сілкінісі басталса:\n      1. Сабыр сақта. Айқайлама, өзгелерге кедергі келтірме және\nтәртіппен шығатын есікке қарай бет ал.\n      2. Қауіпсіз орын тап. Егер ғимараттың ішінде болсаң, берік\nүстелдің немесе партаның астына жасырынуға тырыс. Егер жақын\nжерде үстел болмаса, терезелерден, шкафтардан, сөрелерден және\nқұлап кетуі мүмкін басқа да заттардан алыста.\n      3. Басың мен мойныңды қорға. Еңкейіп, басыңды қолдарыңмен\nжап.\n      4. Паналайтын орынды ұстап тұр. Егер үстелдің астында болсаң,\nүстелдің аяғынан ұстап тұр, сонда ол қозғалған жағдайда да қасыңда\nболады.\n      5. Лифтіні пайдаланба. Жер сілкінісі кезінде лифт тоқтап қалуы\nнемесе істен шығуы мүмкін.\n      6. Ересек адамның нұсқауын тыңда. Егер мектепте болсаң,\nмұғалімнің нұсқауларын орында және ересек қасыңда болғанда өз\nбетіңше әрекет етпе.\n      2. «Не істеу керек?» ойыны\n      Педагог жағдайды атайды, білім алушылар дұрыс әрекетті\nайтады.\n      1-жағдаят: «Сен сыныптасыңмен бірге жер сілкінісінің\nдүмпулерін сездің».\n      Жауап: Сабыр сақтау, қауіпсіз жерге жасырыну, басты қорғау\nжәне мұғалімнің нұсқауларын орындау.\n      2-жағдаят: «Сен үйде жер сілкінісінің дүмпулерін сездің».\n      Жауап: Терезелерден және ауыр заттардан алыстау, қауіпсіз\nжерге паналау, басты қорғау және ересек адамның нұсқауларын\nорындау.\n      3-жағдаят: «Жер сілкінісі кезінде сен көшеде жүрсің».\n      Жауап: Ғимараттардан, ағаштардан, бағандардан және электр\nсымдарынан алыстап, ашық жерге бару.\n      4-жағдаят: «Сен дүкенде жер сілкінісінің дүмпулерін сездің».\n      Жауап: Сөрелерден, витриналардан және биік стеллаждардан\nалыстау, басты қорғау және дүкен қызметкерлерінің нұсқауларын\nорындау.\n     Жер сілкінісінен кейін көмек қажет болса\n     Педагог:\n     – Егер біреуге медициналық көмек қажет болса, ересек адамға\nхабарла немесе 103 пен 112 нөміріне қоңырау шал. Егер адасып қалсаң\nнемесе шығу қиын жерге тап болсаң, дүрбелеңге түспе. Көмекке шақыр,\n\nысқырықты пайдалан немесе құтқарушылар сені естуі үшін қатты\nдыбыс шығар.\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сұрақтарға жауап беруді ұсынады:\n           «Бүгін мен жер сілкінісі кезінде ең маңыздысы … екенін\nтүсіндім».\n           «Егер мен жер асты дүмпулерін сезсем, …»\n           «Жер сілкінісі кезінде өзімді қорғау үшін …»\n           «Егер жер сілкінісі аяқталып, ересек адам сыртқа шығуға\nрұқсат берсе, мен…»\n      Білім алушылардың жауаптарынан кейін педагог қорытынды\nжасайды:\n      – Жер сілкінісі кезінде ең бастысы – дүрбелеңге түспеу, қауіпсіз\nжер табу, басты қорғау және ересектердің нұсқауларын орындау екенін\nбілесіңдер. Дұрыс әрекет ету денсаулық пен өмірді сақтауға\nкөмектеседі.\n      Сабақтың басты ережесі\n      «Сабыр сақта! Қауіпсіз жерді панала! Басыңды қорға!\nЕресектердің нұсқауын орында!».\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1ikBBSopuniZNSNa6185B\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1ikBBSopuniZNSNa6185B<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 10-сабақ — Ұлы дала коды"}, "grade-3/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>3-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-3/index.html\">← 3-сынып тақырыптары<\/a><article><h2>Табиғат аясындағы қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 145-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=145\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 11 сабақ            Табиғат аясындағы қауіпсіздік ережелері\nМақсаты              Білім алушылардың табиғат аясында демалу\n                кезіндегі   қауіпсіз    мінез-құлық     дағдыларын\n                қалыптастыру\nМіндеттері            білім алушыларды табиғат аясында қауіпсіз\n                демалудың негізгі ережелерімен таныстыру;\n                      ықтимал қауіптерді бағалау және дұрыс\n                шешім қабылдау қабілетін дамыту;\n                      өз қауіпсіздігіне жауапкершілікпен қарауға\n                және табиғатты қорғауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Табиғат     аясындағы      қауіпсіз   демалыс» тақырыбындағы\nсуреттер, «Болады – болмайды» жағдайлары бар карточкалар, жасыл\nжәне қызыл түсті карточкалар, «Табиғат аясында қауіпсіз демалу\nережелері» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, араларыңда табиғат аясында: саябақта, орманда, өзен\nжағасында немесе тауда демалғанды ұнататындар бар ма?\n      Білім алушылардың жауаптары.\n      – Табиғат бізге таза ауа, әдемі көріністер мен жақсы көңіл күй\nсыйлайды. Бірақ демалыс ережелерін сақтаған жағдайда ғана табиғат\nаясындағы демалыс жағымды әрі қауіпсіз болады.\n      Жағдайды елестетіп көрейік\n      Педагог орманда демалып жүрген балалар бейнеленген суретті\nкөрсетеді.\n      Сұрақтар:\n      – Суреттегі балалар не істеп жатыр?\n      – Табиғат аясында демалу кезінде қандай қауіпсіздік ережелерін\nсақтау керек?\n      – Егер осы ережелерді ұмытсақ, не болуы мүмкін?\n      Педагог:\n      – Бүгін біз өзімізге, басқа адамдарға және қоршаған ортаға зиян\nкелтірмей, табиғат аясында қалай қауіпсіз демалу керектігін үйренеміз.\n\n      II. Негізгі бөлім\n      1. Табиғат аясында қауіпсіз демалудың негізгі ережелері\n      Педагог түсіндіреді:\n      1. Жалғыз кетпе. Әрқашан ересектермен бірге демал және егер\nбір жерге барғың келсе, міндетті түрде ересек адамға айт.\n      2. Судың жанында абай бол. Ересектердің рұқсатынсыз суға\nтүспе және тік, жарқабақты жағалаулардың маңында ойнама.\n      3. Бейтаныс өсімдіктер мен саңырауқұлақтарға тиме. Олардың\nкейбірі улы болуы мүмкін.\n      4. Табиғатты қорға. Қоқыс қалдырма, ағаштарды сындырма және\nересектерсіз от жақпа.\n      5. Қауіпті жағдай туындаса. Егер адасып қалсаң немесе жарақат\nалсаң, дүрбелеңге түспе. Қауіпсіз жерде қалып, ересектерден көмек\nсұра немесе 112 нөміріне қоңырау шал.\n      2. «Табиғаттың жас қорғаушылары» шығармашылық\nтапсырмасы\n      Педагог орманда демалып жүрген балалар бейнеленген суретті\nкөрсетеді.\n      Тапсырма:\n      – Балалардың 5 дұрыс және 5 бұрыс әрекетін табыңдар.\n      Дұрыс әрекеттер:\n      Бала қоқысты пакетке жинап, өзімен бірге алып кетуге\nдайындалып жатыр. – Дұрыс.\n      Бала таныс соқпақпен жүріп, ересектерден алыс кетпейді.\n– Дұрыс.\n      Балалар демалыс орнын таза ұстайды. – Дұрыс.\n      Балалар табиғаттағы өсімдіктерге зиян келтірмейді. – Дұрыс.\n      Балалар ересектердің жанында болып, олардың нұсқауларын\nорындайды. – Дұрыс.\n      Бұрыс әрекеттер:\n      Балалар орманда тапқан бейтаныс жидектерді жеп көреді.\n– Бұрыс.\n      Балалар жабайы жануарға жақын келеді. – Бұрыс.\n      Балалар қоқысты орманға тастап кетеді. – Бұрыс.\n      Балалар ересектерсіз от жағуға тырысады. – Бұрыс.\n      Балалар ересектерден сұрамай, алысқа кетті. – Бұрыс.\n      – Қауіпсіз демалу – тек өзіңе ғана емес, табиғатқа да қамқорлық\nжасау.\n      «Таза Қазақстан» бастамасы табиғатты қорғау керектігін еске\nсалады. Табиғат аясында демалған кезде қоқыс қалдырмау, ағаштар\nмен бұталарды сындырмау, ересектерсіз от жақпау және қауіпсіздік\n\nережелерін сақтау маңызды. Табиғатқа қамқорлық жасай отырып, біз\nөзімізге және айналамыздағы адамдарға да қамқорлық жасаймыз.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n      https://drive.google.com/file/d/1Kn6xET32yGKl33px3ZJkgBS_lbDf\n1ajx/view?usp=sharing\n      III. Қорытынды бөлім\n      Педагог:\n      – Қарапайым қауіпсіздік ережелерін сақтау демалысты қызықты\nғана емес, қауіпсіз етуге де көмектеседі. Естеріңде болсын, сендердің\nқауіпсіздіктерің дұрыс әрекет етулеріңе байланысты.\n      Рефлексияға арналған сұрақтар\n            Неліктен ересектерсіз алысқа кетуге болмайды?\n            Орманда нені ұстауға немесе жеуге болмайды?\n            Судың жанында өзіңді қалай ұстау керек?\n            Көмек шақыру үшін қай нөмірге қоңырау шалуға болады?\n      Педагогтың қорытынды сөзі:\n      – Табиғат аясында демалғанда әрқашан абай болыңдар,\nересектердің айтқанын тыңдаңдар және табиғатты қорғаңдар. Егер\nқауіпті жағдай туындаса, сабыр сақтап, ересек адамнан көмек сұраңдар\nнемесе 112 нөміріне хабарласыңдар.\n      Сабақтың басты ережесі\n      Тоқта – Ойлан – Әрекет ет! Табиғатты қорға және қауіпсіздік\nережесін сақта!<\/div><p><a href=\"https://drive.google.com/file/d/1Kn6xET32yGKl33px3ZJkgBS_lbDf\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1Kn6xET32yGKl33px3ZJkgBS_lbDf<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "3-сынып · 11-сабақ — Ұлы дала коды"}};const HOME="grade-3/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
