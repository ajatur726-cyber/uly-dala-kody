сырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-9/lesson-08.html\"><h2>8. Бейтаныс адамнан төнетін қауіптен сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-9/lesson-09.html\"><h2>9. Жұмысқа орналасудағы алаяқтықтан сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-9/lesson-10.html\"><h2>10. Қорқыту мен бопсалау кезінде қауіпсіз әрекет ету<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-9/lesson-11.html\"><h2>11. Мектепте қауіпті жағдай туындағанда қауіпсіз әрекет ету<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-9/lesson-12.html\"><h2>12. Қауіпті әуестіктер және олардың салдары<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-9/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 327-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=327\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ       Төтенше жағдайлар қызметтері мен байланыс\n            орталығының телефон нөмірлері\n Мақсаты        Білім алушылардың тиісті көмек көрсету қызметін\n            дұрыс таңдау және көмекке сауатты жүгіну\n            дағдыларын қалыптастыру.\n Міндеттері      білім    алушылардың     төтенше    жағдайлар\n            қызметтері мен 111 байланыс орталығы туралы\n            білімдерін бекіту;\n                 қауіп-қатер деңгейін бағалау және тиісті көмек\n            алу көзін дұрыс таңдау дағдыларын дамыту;\n                 төтенше жағдайлар қызметіне жүгінген кезде\n            жауапкершілікпен әрекет етуге тәрбиелеу.\n\n     Материалдар мен ресурстар\n     101, 102, 103, 104, 111, 112 нөмірлері жазылған карточкалар,\nжағдаяттар жазылған карточкалар.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     «Диспетчер түсіне ала ма?» шағын тапсырмасы\n     Педагог білім алушыларға жүгінеді.\n     Өзіңіздің 112 нөміріне қоңырау шалып:\n     «Көмектесіңіз! Мұнда бір адамның жағдайы нашар!», – деп\nайтқаныңызды елестетіңіз.\n     Сыныпқа сұрақ:\n     Диспетчер бірден қажетті көмекті жібере ала ма? Неліктен?\n     Білім алушылардың екі-үш жауабын тыңдағаннан кейін педагог\nқорытынды жасайды.\n     II. Негізгі бөлім\n     «Диспетчер        шешім      қабылдайды»        практикалық\nсимуляциясы\n     Педагог:\n     – Бүгін сіздер тек оқиғаның куәгері ғана емес, сонымен қатар\nкөмек көрсету қызметінің диспетчері боласыздар. Сіздердің\nміндеттеріңіз – көмек көрсету үшін берілген ақпараттың жеткілікті\nанықтау.\n     Педагог жағдаяттарды бір-бірден ұсынады.\n     1-жағдаят\n     Аулада бір адам есінен танып қалды.\n     Білім алушылардың бірі телефонмен болған жағдай туралы\nхабарлайтынын айтады.\n     Оның жауабынан кейін педагог сыныпқа сұрақ қояды:\n\n          Көмек көрсету қызметін жіберу үшін берілген ақпарат\n            жеткілікті ме?\n      Егер ақпарат жеткіліксіз болса, білім алушылар қандай\nмәліметтерді нақтылау қажет екенін ұсынады.\n      2-жағдаят\n      Кіреберісте газдың өткір иісі сезіледі.\n      3-жағдаят\n      Аулада автокөлік өртеніп жатыр.\n      4-жағдаят\n      Интернетте бейтаныс адам ақша талап етіп, жеке фотосуреттерді\nтаратамын деп қорқытуда. Ол:\n      «Егер біреуге айтып қойсаң, өкінесің», – деп ескертті.\n      Білім алушылар:\n           қайда жүгіну керектігін;\n           қандай ақпаратты хабарлау қажет екенін анықтайды.\n      Барлық жағдаяттарды талқылап болғаннан кейін педагог\nқорытынды жасайды.\n      Есте сақтаңыз!\n      «Заң және тәртіп» қағидатын сақтау – жедел қызметтердің\nмүмкіндіктерін жауапкершілікпен пайдалануды білдіреді. Жалған\nқоңыраулар мамандардың шын мәнінде көмекке мұқтаж адамдарға\nжедел көмек көрсетуіне кедергі келтіреді және Қазақстан\nРеспубликасының заңнамасына сәйкес жауапкершілікке әкеп соғуы\nмүмкін.\n      III. Қорытынды бөлім\n      «Бір ереже» жаттығуы\n      Педагог әр білім алушыға өзі ең маңызды деп санайтын бір\nережені атауды ұсынады.\n      Мысалы:\n           дүрбелеңге берілмеу;\n           нақты мекенжайды хабарлау;\n           диспетчердің сұрақтарына жауап беру;\n           қай қызметке хабарласу керектігін білмесеңіз, 112 нөміріне\nқоңырау шалу;\n           егер досыңыз эмоционалдық дағдарысты бастан өткеріп\nжатса, сенім білдіретін ересек адамға немесе 111 нөміріне хабарласу.\n      Педагог сабақты қорытындылайды.\n      Қиын немесе қауіпті жағдайда бәрін өз бетіңше шешуге тырыспа.\nКейде ең дұрыс қадам – ата-анаңа, өзің сенетін ересек адамға немесе\nмектеп психологіне болған жағдайды айтып, көмек сұрау.\n\n      Егер кімге жүгінеріңді білмесең, өзіңді жалғыз сезінсең немесе\nмәселені біреуге айту қиын болса, 111 байланыс орталығына\nхабарласуға болады. Кейде өзіңді мазалаған нәрсені біреумен бөлісудің\nөзі жеңілдік әкеліп, жағдайға басқа қырынан қарауға көмектеседі.\n      Ал өміріңе немесе денсаулығыңа тікелей қауіп төнсе, уақыт\nжоғалтпай жедел көмек шақыр. Есіңде болсын: қиын сәтте жалғыз\nқалудың қажеті жоқ – көмек сұрау мәселені шешуге бастайтын\nалғашқы қадам болуы мүмкін.\n\n                             Қосымша ақпарат\n   Нөмірі /          Қызмет түрі               Қай кезде жүгіну керек\n  байланыс\n    нөмірі\n112            Бірыңғай жедел көмек     Кез келген төтенше жағдайда\n               көрсету қызметі          немесе қай қызметке хабарласу\n                                        керектігі белгісіз болған кезде\n101            Өрт сөндіру қызметі      Өрт, өрттің шығуы, түтін\n                                        байқалған кезде\n102            Полиция қызметі          Қылмыс, төбелес, қорқыту, өмірге\n                                        немесе денсаулыққа қауіп төнген\n                                        жағдайда\n103            Жедел медициналық        Жарақат алған кезде, есінен танып\n               көмек қызметі            қалған жағдайда немесе\n                                        денсаулық жағдайы күрт\n                                        нашарлағанда\n104            Апаттық газ қызметі      Газдың иісі сезілгенде немесе\n                                        газдың шығуы байқалған кезде\n111            Отбасы, әйелдер мен      Буллинг, кибербуллинг, қорқыту,\n               балалардың құқықтарын    зорлық-зомбылық және көмек пен\n               қорғау мәселелері        қолдауды қажет ететін басқа да\n               жөніндегі «111» байланыс қиын өмірлік жағдайларда\n               орталығы (тәулік бойы,\n               24/7)\nӨңіріңіздегі   Психологиялық қолдау     Психологиялық қиындықтар,\nбайланыс       орталығы                 қатты күйзеліс, мазасыздық,\nнөмірлері                               буллинг, психологиялық көмек\n                                        пен қолдауды қажет ететін\n                                        жағдайларда\nӨңіріңіздегі   Балалардың құқықтарын    Балалардың құқықтары мен заңды\nбайланыс       қорғау басқармасы        мүдделері бұзылған жағдайда,\nнөмірлері                               сондай-ақ қорғау мен көмекті\n                                        қажет ететін жағдайларда\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 1-сабақ — Ұлы дала коды"}, "grade-9/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Бір қателіктің салдары<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 330-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=330\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ          Бір қателіктің салдары\nМақсаты           Білім алушылардың тәуекел жағдайларда өз\n              әрекеттерінің ықтимал салдарын ескере отырып,\n              қауіпсіз шешімдерді саналы түрде қабылдау\n              дағдыларын қалыптастыру.\nМіндеттері         тәуекелді жағдайды танып, қауіпсіз әрекет ету\n              нұсқасын анықтау дағдысын бекіту;\n                   қабылданатын шешімдердің ықтимал салдарын\n              алдын ала болжай білу қабілетін дамыту;\n                   эмоционалдық қысым, құрдастарының ықпалы\n              немесе күмәнді ұсыныс жағдайында қауіпсіз шешім\n              қабылдау алгоритмін іс жүзінде қолдану дағдысын\n              қалыптастыру.\n\n\n      Материалдар мен ресурстар\n      Жағдаяттар жазылған карточкалар, «ТОҚТА» жаднама-\nкарточкасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Бір сәттік шешімнің салдары қандай болуы мүмкін?\n      Педагог үш жағдаятты ұсынады:\n      – жасөспірім ақша табамын деп күмәнді тапсырманы орындауға\nкеліседі;\n      – мектептегі сөз таласы төбелеске ұласады;\n      – біреу төтенше жағдай туралы жалған ақпарат таратып, соның\nсалдарынан жедел қызметтер шақырылады.\n      Педагог сұрайды:\n      – Осы жағдайлардың әрқайсысы неден басталды?\n      – Қай сәтте басқа шешім қабылдауға болатын еді?\n      – Бір ғана асығыс немесе ойланбай жасалған әрекет қандай\nсалдарға әкелуі мүмкін?\n      Білім алушылар өз пікірлерін айтады.\n      Педагог қорытындылайды:\n      – Кейде үлкен мәселе бір ғана асығыс шешімнен басталады. Бірақ\nшешім қабылдамас бұрын тоқтап, оның салдарын ойласаң, жағдайдың\nәрі қарай қалай өрбитінін өзгертуге болады.\n\n      Бүгін біз бір әрекеттің қандай салдарға әкелуі мүмкін екенін және\nқателіктің алдын алу үшін қай сәтте тоқтап, басқа шешім таңдауға\nболатынын талқылаймыз.\n      II. Негізгі бөлім\n      «Таңдау нүктесі» шағын тренингтік жаттығуы\n      Педагог түсіндіреді:\n      Қазір сіздердің міндеттеріңіз – таңдау нүктесін, яғни адамның\nбасқа шешім қабылдауына әлі де мүмкіндік болған сәтті анықтау.\n      1-жағдаят\n      Жасөспірімге тәжірибесінің жоқтығына қарамастан, ақысы\nжоғары қосымша жұмыс ұсынылды.\n      Ол не істейді?\n           Бас тартады.\n           Ата-анасымен немесе басқа да сенім артатын ересек\nадаммен кеңеседі.\n           Бірден келіседі.\n      Таңдау жасалғаннан кейін педагог жағдаяттың жалғасын\nкөрсетеді.\n      Жасөспірім келісім берді. Біраз уақыттан кейін оның заңсыз\nәрекетке тартылғаны анықталды.\n      Сыныпқа сұрақ:\n      Таңдау нүктесі қай жерде болды?\n      2-жағдаят\n      Жанжал кезінде достары:\n      «Осал болма! Оны итеріп жібер!» – дейді.\n      Қалай әрекет ету керек?\n           Жанжалдан аулақ болу.\n           Жағдайды сабырға келтіруге тырысу.\n           Эмоцияға беріліп кету.\n      Таңдау жасалғаннан кейін педагог жағдаяттың жалғасын\nкөрсетеді.\n      Итеріп жібергеннен кейін екінші жасөспірім ауыр жарақат алды.\n      Сыныпқа сұрақ:\n      Таңдау нүктесі қай жерде болды?\n      Барлық жағдаяттардың қандай ортақ тұсы болды?\n      Жауаптарды тыңдағаннан кейін педагог қорытынды жасайды.\n      Барлық жағдайда да зардап бір ғана ойланбай қабылданған\nшешімнен кейін туындады.\n      «ТОҚТА» ережесі\n      Маңызды шешім қабылдар алдында:\n      Т – тоқта және эмоцияның жетегінде кетпе.\n\n      О – ойлан және шешімнің ықтимал салдарын байыппен бағала.\n      Қ – күмәндансаң, сенім артатын ересек адаммен жағдайды\nталқыла.\n      Т – таңдау жаса және жауапкершілікпен шешім қабылда.\n      А – ақылмен әрекет ет және қабылдаған шешіміңе сай қадам\nжаса.\n      Маңызды ескерту\n      «Заң және тәртіп» қағидаты жеке жауапкершіліктен\nбасталады. Эмоцияға берілу, айналадағы адамдардың қысымына\nұшырау немесе тез пайда табуға ұмтылу адамды ауыр зардаптарға және\nҚазақстан       Республикасының       заңнамасында       көзделген\nжауапкершілікке әкеп соғады.\n      Маңызды: Қазақстан Республикасының Әкімшілік құқық\nбұзушылық туралы кодексіне (ҚР ӘҚБтК) сәйкес, әкімшілік\nжауаптылық, жалпы ереже бойынша, 16 жастан басталады, ал ұсақ\nбұзақылық үшін – 14 жастан туындайды.\n      Қазақстан Республикасының Қылмыстық кодексіне (ҚР ҚК)\nсәйкес, қылмыстық жауаптылық жалпы ереже бойынша 16 жастан, ал\nжекелеген ауыр және аса ауыр қылмыстар үшін 14 жастан басталады.\n      III. Қорытынды бөлім\n      «Бір минут бұрын» жаттығуы\n      Педагог сұрақ қояды:\n      Егер осы жағдаяттардағы кейіпкерлер бір минут бұрынғы сәтке\nқайта орала алса, олардың қай шешімін өзгертуге кеңес берер\nедіңіздер?\n      Бірнеше білім алушы өз жауаптарын айтады.\n      Педагог сабақты қорытындылайды:\n       Қателіктің құны тек оның салдарымен ғана өлшенбейді. Ең\nмаңыздысы – таңдау сәтін дер кезінде байқап, жауапкершілікпен\nшешім қабылдай білу.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 2-сабақ — Ұлы дала коды"}, "grade-9/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Жеке шекара және қысымнан қорғану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 333-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=333\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ        Жеке шекара және қысымнан қорғану\nМақсаты         Білім алушылардың психологиялық қысымды тану,\n           жеке шекараларын қорғау және қысым мен\n           манипуляция жағдайларында қауіпсіз әрекет ету\n           стратегиясын таңдау дағдыларын қалыптастыру\nМіндеттері       психологиялық қысым мен манипуляцияның\n           негізгі белгілерімен таныстыру;\n                 сыйластыққа     негізделген  қарым-қатынасты\n           қысым көрсету мен жеке шекараны бұзудан ажырата\n           білу дағдысын дамыту;\n                 жеке шекараның бұзылуы, қорқыту немесе\n           бопсалау жағдайларында қауіпсіз әрекет ету алгоритмін\n           бекіту.\n\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог екі жағдаятты көрсетеді.\n     1-жағдаят\n     «Бірге түскен суретімізді жарияласам қалай қарайсың? Қарсы\nболсаң, жарияламаймын».\n     2-жағдаят\n     «Егер маған сенсең, телефоныңның құпиясөзін бер. Жасыратын\nештеңең жоқ қой».\n     Педагог:\n       Қай жағдаятта адамға деген құрмет байқалады, ал қай\nжағдаятта қысым көрсету әрекеті байқалады? Неліктен?\n     Білім алушылар өз жауаптарын айтады.\n     Педагог қорытынды жасайды:\n      - Жеке шекараларды бұзу әрекеті қысым көрсету, манипуляция\nжасау, бақылау, қорқыту немесе адамның бас тартуын елемеу арқылы\nкөрінуі мүмкін. Бұл белгілерді дер кезінде байқап, қауіпсіз әрекет ету\nжолын таңдай білу маңызды.\n       Педагог білім алушылардың назарын тақырыпқа қатысты\nбейнематериалға аударады.\n     https://www.youtube.com/watch?v=H9AZIpy1eZ4\n     II. Негізгі бөлім\n\n      «Қауіпсіз шешімді таңда» практикалық жаттығуы\n      Педагог үш жағдаят ұсынады. Әр жағдаяттан кейін білім\nалушылар тек бір сұраққа жауап береді:\n      Қай шешім қауіпсіз болады?\n      1-жағдаят\n      Достары түнде қараусыз қалған ғимаратқа барып, видео түсіруді\nұсынады.\n      Олар:\n      «Бәрі барады».\n      «Қорықпа, бәріміз бірге боламыз».\n      «Егер бармасаң, сені енді бізбен бірге шақырмаймыз», – дейді.\n      Қауіпсіз шешім:\n      Барудан бас тартып, қауіпті жерге бармау. Егер қысым жалғаса\nберсе, жасөспірім өзін қауіпсіз сезінбесе, ата-анасына немесе басқа да\nсенім артатын ересек адамға жүгіну.\n      2-жағдаят\n      Жаңа танысы:\n      «Жеке суретіңді жібер. Оны ешкім көрмейді», – деп жазады.\n      Жасөспірім бас тартқаннан кейін де ол адам өз талабын қайталап,\nсуретті жіберуді талап ете береді.\n      Қауіпсіз шешім:\n      Суретті жібермеу. Егер адам талап етуін жалғастырса, хат\nалмасуды тоқтату, хабарламаларды сақтап қою, пайдаланушыны\nбұғаттау және сенім артатын ересек адамға жүгіну. Қорқыту немесе\nбопсалау жағдайында қойылған талаптарды орындамай, бұл туралы\nміндетті түрде ересек адамға хабарлау.\n      3-жағдаят\n      Жасөспірімге:\n      «Ешкімге айтпа. Егер ересектер біліп қойса, өкінесің», – дейді.\n      Қауіпсіз шешім:\n      Қауіпті құпияны іште сақтамау. Бұл туралы ата-анаңа, сынып\nжетекшісіне, мектеп психологіне немесе басқа да сенім артатын ересек\nадамға айту.\n      Маңызды ескерту\n      «ТОҚТА – АЛШАҚТА – АЙТ» алгоритмі\n      ТОҚТА – өзіңе жайсыздық, қорқыныш тудыратын немесе\nқауіпті болып көрінетін әрекетке келіспе.\n      АЛШЫҚТА – мүмкіндік болса, қарым-қатынасты тоқтат немесе\nқауіпсіз жерге кет.\n      АЙТ – сенім артатын ересек адамға хабарла. Қорқыту, бопсалау\nнемесе қауіп төнген жағдайда қосымша көмекке жүгін.\n\n    Педагог білім алушылардың назарын тақырыпқа қатысты\nжаднамаға аударады.\n     https://drive.google.com/file/d/11zhIKd_g_4kARmILL79tQ4SyRTok3UbY/vie\nw?usp=sharing\n      III. Қорытынды бөлім\n      Рефлексия\n      «Менің қауіпсіз таңдауым» жаттығуы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n           «Енді мен қысымның ... кезде басталатынын түсіндім».\n           «Егер менің жеке шекараларым бұзылса, мен ...».\n           «Көмек сұрап, ... жүгіне аламын».\n      Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n      Педагог қорытынды жасайды:\n      Жеке шекаралар адамның қауіпсіздігі мен қадір-қасиетін\nқорғауға көмектеседі. Егер сіздің бас тарту туралы шешіміңізді\nқабылдамаса, сізге қысым көрсетілсе, қорқытса немесе бопсаласа,\nжағдайды өз бетіңізше шешуге тырыспаңыз: қауіпті қарым-қатынасты\nтоқтатып, сенім артатын ересек адамға жүгініңіз. Қауіпсіздікке қатер\nтөнген жағдайда 102 немесе 112 нөмірлеріне хабарласуға, ал кеңес пен\nқолдау алу үшін 111 байланыс орталығына жүгінуге болады.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=H9AZIpy1eZ4\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=H9AZIpy1eZ4<\/a><\/p><p><a href=\"https://drive.google.com/file/d/11zhIKd_g_4kARmILL79tQ4SyRTok3UbY/vie\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/11zhIKd_g_4kARmILL79tQ4SyRTok3UbY/vie<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 3-сабақ — Ұлы дала коды"}, "grade-9/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Төбелес пен жанжал кезіндегі қауіпсіз әрекет<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 336-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=336\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ      Төбелес пен жанжал кезіндегі қауіпсіз әрекет\n Мақсаты       Білім    алушылардың      қауіпсіз   мінез-құлық\n            дағдыларын қалыптастыру және олардың төбелес пен\n            көшедегі жанжалдарға араласуының алдын алу.\n Міндеттері     жанжалдың       туындау     және     шиеленісу\n            белгілерімен таныстыру;\n                құрдастарының қысымына қауіпсіз түрде жауап\n            беру және төбелеске араласпау дағдыларын дамыту;\n                өміріне, денсаулығына немесе қауіпсіздігіне\n            қауіп     төнген     жағдайда     өз    әрекеттеріне\n            жауапкершілікпен қарауға тәрбиелеу\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Араласу немесе қауіпсіз шешім жасау.\n      Педагог жағдаят ұсынады:\n      Мектептен кейін екі жасөспірімнің арасында сөз таласы\nбасталып, жағдай біртіндеп ушығады. Айналаға басқа оқушылар\nжиналады. Біреулері оларды одан әрі арандатып, енді біреулер болған\nжағдайды телефонға түсіре бастайды. Сол кезде танысың саған:\n      – Сен де бізге болыс. Әйтпесе қорқып тұр деп ойлайды, – дейді.\n      Педагог сұрайды:\n      – Мұндай жағдайда қандай қысым болуы мүмкін?\n      – Қай әрекет жанжалды одан әрі ушықтыруы мүмкін?\n      – Төбелеске араласпай-ақ қалай дұрыс әрекет етуге болады?\n      – Қай сәтте ересектерден немесе басқалардан көмек сұрау қажет?\n      Білім алушылар өз пікірлерін ортаға салады.\n      Педагог қорытындылайды:\n      – Жанжал кезінде эмоцияға немесе құрдастардың қысымына\nеріп, асығыс әрекет ету жағдайды одан әрі ушықтыруы мүмкін.\nСондықтан ең дұрыс шешім – жанжалға қосылмай, қауіп деңгейін\nбағалап, өзіңе және өзгелерге қауіп төндірмейтін әрекетті таңдау.\n      II. Негізгі бөлім\n      «Қауіпсіз таңдау нүктесі» практикалық жаттығуы\n      Педагог жағдаятты кезең-кезеңімен оқиды. Әр кезеңнен кейін\nбілім алушылар сұраққа жауап береді:\n\n      Осы кезеңде жанжалдың төбелеске ұласып кетуіне жол\nбермеу үшін не істеуге болады?\n      1-қадам\n      Екі жасөспірім мектептің жанында кездейсоқ соқтығысып\nқалады.\n      2-қадам\n      Бір-біріммен сөзге келіп қалды.\n      3-қадам\n      Достары арандатуға кіріседі:\n      – Үндемей қалма!\n      – Оған жауап бер!\n      - Қарымтасын бер!\n      4-қадам\n      Біреу телефонын шығарып, болып жатқан жағдайды түсіре\nбастайды.\n      5-қадам\n      Қатысушылардың бірі төбелесуге дайындалып, алға қарай қадам\nбасады.\n      Педагогтің сұрақтары\n            Жанжалды қай кезеңде тоқтатуға болатын еді?\n            Жанжалдың күшеюіне не көбірек әсер етті?\n      Педагог қорытынды жасайды:\n      Жанжал өзара тіл тигізу, құрдастар тарапынан қысым көрсету,\nарандату және бақылаушылардың әрекеті салдарынан күшеюі мүмкін.\nАдам бұл белгілерді неғұрлым ерте байқаса, соғұрлым қауіпсіз әрекет\nету жолын таңдауға мүмкіндігі артады.\n      Қауіпсіз түрде қалай әрекет ету керек?\n      Педагог білім алушылармен бірге қауіпсіз әрекет ету ережелерін\nтұжырымдайды:\n         төбелеске араласпау және жанжалға қатысушыларды\nарандатпау;\n         болып жатқан жағдайды жариялау немесе тарату мақсатында\nбейнежазбаға түсірмеу;\n         қауіпсіз қашықтыққа шегіну;\n         жанында жүрген ересек адамға, педагогке, күзет\nқызметкеріне немесе полицияға хабарлау;\n         егер жанжал немесе қоқан-лоқы жалғаса берсе, ата-анаға,\nсынып жетекшісіне немесе өзіңіз сенім білдіретін басқа ересек адамға\nайту;\n         өмірге немесе денсаулыққа тікелей қауіп төнген жағдайда\n– 102 нөміріне хабарласу.\n\n      Есте сақтаңыз! «Заң және тәртіп» қағидаты өз іс-әрекеті үшін\nжеке жауапкершіліктен басталады. Тіпті бір ғана соққы адамның\nденсаулығына ауыр зардап келтіруі және Қазақстан Республикасының\nзаңнамасында көзделген жауапкершілікке әкеп соғуы мүмкін.\n      Жалпы      заңнамалық     талаптар     бойынша      қылмыстық\nжауаптылық 16 жастан басталады. Алайда 14 жастан бастап жекелеген\nауыр қылмыстар үшін, оның ішінде денсаулыққа қасақана ауыр зиян\nкелтіргені үшін (ҚР Қылмыстық кодексінің 106-бабы), денсаулыққа\nқасақана ауырлығы орташа зиян келтіргені үшін (ҚР Қылмыстық\nкодексінің 107-бабы), сондай-ақ ауырлататын мән-жайлардағы\nбұзақылық үшін қылмыстық жауаптылық туындауы мүмкін.\n      Егер төбелеске қатысушы қылмыстық жауаптылық жасына\nтолмаған болса, Қазақстан Республикасының заңнамасында көзделген\nжағдайларда жекелеген құқық бұзушылықтар үшін жауапкершілікті\nоның ата-анасы немесе заңды өкілдері көтеруі мүмкін.\n      III. Қорытынды бөлім\n      Рефлексия\n      «Менің қауіпсіз таңдауым» жаттығуы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n           «Егер мені төбелеске араласуға мәжбүрлесе, мен...»\n           «Жанжал кезіндегі қауіпсіздіктің ең басты ережесі – ...»\n      Бірнеше білім алушы өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n      - Әрбір жанжал төбелеске ұласа бермейді, алайда\nтөбелестердің басым бөлігінің алдын алуға болады. Жанжалға\nқатысудан бас тарта білу, топтың қысымына берілмеу және дер кезінде\nкөмекке жүгіну денсаулықты сақтауға, заң алдындағы жауапкершілікке\nәкелетін жағдайлардың алдын алуға және өзіңді қорғауға көмектеседі.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 4-сабақ — Ұлы дала коды"}, "grade-9/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Табиғат аясындағы қауіпсіз демалыс<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 339-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=339\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№5 сабақ        Табиғат аясындағы қауіпсіз демалыс\nМақсаты       Білім алушылардың табиғат аясында қауіпсіз\n           демалу, ықтимал қауіптерді бағалау және дұрыс әрекет\n           ету дағдыларын қалыптастыру.\nМіндеттері     табиғат аясында демалу кезінде туындауы мүмкін\n           негізгі қауіп-қатерлермен таныстыру;\n               жағдайды дұрыс бағалауға және қауіпсіз әрекет\n           ету тәсілін таңдауға үйрету;\n               қауіпті жағдайда дер кезінде көмекке жүгіну\n           алгоритмін бекіту.\n\n     Материалдар мен ресурстар\n      жағдаяттық кейс, «Табиғат аясында қауіпсіз демалу» жаднамасы.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог жағдаят ұсынады:\n     Тоғызыншы сыныпта оқитын төрт оқушы тауға демалуға барды.\nОлар ата-аналарына тек «табиғат аясына барамыз» деп айтып, нақты\nқай бағытпен жүретіндерін хабарламады. Серуендеу кезінде\nдостарының бірі:\n     -      Туристік соқпақтан шығып, жоғарыға шығайық. Онда\nсуретке түсуге әдемі жер бар екен. Сосын тез қайтып келеміз, – деп\nұсыныс жасады.\n     Достар бұл ұсыныспен келісті.\n     Педагогтің сұрақтары:\n           Бірінші қандай қателік жіберілді?\n           Неліктен ойланбай қабылданған бір шешім қауіпті\nжағдайға әкелуі мүмкін?\n     Оқушылардың жауаптарын тыңдағаннан кейін педагог\nқорытынды жасайды.\n     Педагог атап көрсетеді:\n     - Табиғат аясындағы қауіпті жағдайдың туындау қаупі\nжеткілікті дайындықтың болмауы, белгіленген бағыттан ауытқу және\nбасқа да ойланбай жасалған әрекеттер салдарынан артуы мүмкін.\nАлдын ала дайындалып, қауіпсіздік ережелерін сақтау арқылы\n\nкөптеген қауіптің алдын алуға немесе олардың деңгейін төмендетуге\nболады.\n      II. Негізгі бөлім\n      «Қауіпсіздікке әсер ететін үш шешім» практикалық кейсі\n      1-жағдаят\n      Біраз уақыттан кейін жасөспірімдер туристік соқпақтан адасып\nкеткендерін түсінеді.\n      Олардың бірі:\n      -     Уайымдамаңдар, телефон жолды көрсетеді, – дейді.\n      Алайда ұялы байланыс жоқ, ал навигатор жұмыс істемейді.\n      Сұрақ:\n      Ең қауіпсіз шешім қандай?\n      Білім алушылар өз жауаптарын ұсынады.\n      Педагог қорытынды жасайды:\n      Белгісіз бағытта әрі қарай жүре беруге болмайды. Тоқтап, сабыр\nсақтап, өздерінің қай жерде тұрғанын және қолда бар байланыс\nқұралдарын бағалау қажет. Егер кері қайтатын жол нақты белгілі болса,\nсоңғы белгілі бағдарға дейін қайтуға болады. Ал жолға қатысты күмән\nболса, бағытты ретсіз іздеуге тырыспау керек. Байланыс пайда болған\nжағдайда, дереу көмекке жүгіну қажет.\n      2-жағдаят\n      Күн күркірей бастайды.\n      Телефонның қуаты таусылуға жақын.\n      Достарының бірі:\n      - Мен жалғыз өзім көмек іздеуге барамын. Осылай тезірек\nболады, – деп ұсыныс айтады.\n      Сұрақ:\n      Қалай әрекет ету керек?\n      Білім алушылар өз жауаптарын ұсынады.\n      Педагог қорытынды жасайды:\n      Топтан бөлінуге және бір адамды жалғыз өзін көмек іздеуге\nжіберуге болмайды. Мүмкіндігінше ашық әрі биік жерден кету керек.\nЖеке тұрған ағаштың астына жасырынуға болмайды. Судан және\nметалл заттардан алшақ болған жөн. Телефон қуатын үнемдеп,\nбайланыс пайда болған жағдайда көмекке жүгіну қажет.\n      3-жағдаят\n      Біраз уақыттан кейін ұялы байланыс пайда болады.\n      Педагог:\n      112 операторына қандай ақпаратты хабарлау қажет?\n      Білім алушылар өз нұсқаларын айтады.\n      Педагог:\n\n      112 операторына\n            не болғанын;\n            шамамен орналасқан жерін;\n            адамдардың санын;\n            зардап шеккендердің бар-жоғын;\n            кері байланыс үшін телефон нөмірін хабарлау қажет.\n      Педагог:\n      Бұл жағдайдың алдын алу үшін балалар сапарға шықпас бұрын\nне істеуі керек еді?\n      Білім алушылар өз жауаптарын ұсынады.\n      Педагог қорытынды жасайды:\n      Сапарға шығар алдында:\n            жақындарына баратын бағытын, баратын жерін және қай\nуақытта оралуды жоспарлап отырғанын хабарлау;\n            қажетті мөлшерде су, ауа райына сай киім және алғашқы\nқажетті заттарды өзімен бірге алу;\n            ауа райы болжамын алдын ала тексеру;\n            телефонды толық қуаттап алу;\n            белгіленген бағытты өзгертпеу қажет.\n      Педагог       білім    алушыларға       тақырыпқа    қатысты\nбейнематериалды көруді ұсынады.\n      https://drive.google.com/file/d/1Kn6xET32yGKl33px3ZJkgBS_lbDf\n1ajx/view?usp=sharing\n\n      Есте сақтаңыз!\n      Педагог білім алушылардың назарын аударады:\n      Сапарға шығар алдында қажетті мөлшерде су, ауа райына сай\nкиім және алғашқы қажетті заттарды өзімен бірге алу қажет.\n      Педагог атап көрсетеді:\n      Табиғат аясында қауіпсіз әрі жауапты демалу тек өз қауіпсіздігіне\nқамқорлық жасауды ғана емес, қоршаған ортаға ұқыпты қарауды да\nбілдіреді: қоқыс қалдырмау, өсімдіктерге зиян келтірмеу, өрт\nқауіпсіздігі ережелерін сақтау және су айдындарын ластамау қажет.\nМұндай жауапты мінез-құлық «Таза Қазақстан» бастамасының\nқұндылықтарына сәйкес келеді.\n      III. Қорытынды бөлім\n      Рефлексия\n      «Негізгі ереже» жаттығуы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n\n           Бүгін мен қауіпсіз демалудың ең маңызды ережесі – ...\nекенін түсіндім.\n           Табиғат аясына шығар алдында мен міндетті түрде ...\n           Егер қауіпті жағдай туындаса, мен ...\n      Бірнеше білім алушының жауаптарын тыңдағаннан кейін педагог\nсабақты қорытындылайды.\n      -     Табиғат аясындағы қауіпсіздік сапарға алдын ала\nдайындықтан басталады. Маршрутты алдын ала жоспарлау, ауа райы\nжағдайын бағалау, қауіпсіздік ережелерін сақтау, дер кезінде көмекке\nжүгіну қауіп-қатерді азайтуға және дұрыс әрекет етуге мүмкіндік\nбереді.\n\nҚазақстан Республикасы Денсаулық\nсақтау министрлігі ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/1Kn6xET32yGKl33px3ZJkgBS_lbDf\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1Kn6xET32yGKl33px3ZJkgBS_lbDf<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 5-сабақ — Ұлы дала коды"}, "grade-9/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Денсаулыққа зиян келтіретін әрекеттерден сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 343-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=343\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ      Денсаулыққа зиян келтіретін әрекеттерден\n           сақтану\nМақсаты        Білім алушылардың денсаулыққа қауіп төндіретін\n           әрекеттерді ажыратып, қысымға ермей, қауіпсіз шешім\n           қабылдау дағдыларын қалыптастыру.\nМіндеттері     – денсаулыққа зиян келтіруі мүмкін заттар мен\n           әрекеттердің қауіптерін түсіндіру;\n               – қауіпті ұсыныс, қысым және манипуляция\n           белгілерін ажырата білуге үйрету;\n               – қауіпті ұсыныстан бас тарту және қажет жағдайда\n           дер кезінде көмекке жүгіну дағдыларын дамыту.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Шын мәнінде не болып жатыр?» диалогын талдау\n      Педагог диалогты ұсынады:\n      – Байқап көрші. Бір мәрте қолданғаннан ештеңе болмайды.\n      – Жоқ, қаламаймын.\n      – Бәрі де байқап көрді ғой. Тек сен қалдың.\n      – Қорқып тұрсың ба?\n      – Онда ешкімге айтпа.\n      Педагогтің сұрақтары:\n            Бұл әңгімеде не болып жатыр?\n            Қай сәтте ұсыныс қысым көрсетуге айналады?\n            Соңғы сөздер неліктен сақ болуға себеп болуы керек?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог атап көрсетеді:\n      - Белгісіз затты немесе құрамында никотин бар өнімді байқап\nкөру туралы ұсыныстың өзі денсаулыққа қауіп төндіруі мүмкін. Ал\n«бәрі байқап көрген», «бір реттен ештеңе болмайды», «қорқып тұрсың\nба?» және «ешкімге айтпа» деген сөздер қысым көрсету мен\nманипуляцияның белгісі болуы мүмкін.\n      II. Негізгі бөлім\n      «Қауіпсіз әрекетті қалай тануға болады?» жағдаятын талдау\n      Педагог оқиғаны жалғастырады.\n\n      Күмәнданғанына қарамастан, жасөспірім белгісіз затты байқап\nкөруге келіседі.\n      Педагог:\n            Қалай ойлайсыңдар, одан әрі не болуы мүмкін?\n      Білім алушылар өз нұсқаларын ұсынады.\n      Педагог:\n            Бірнеше минуттан кейін жасөспірістің жағдайы\nнашарлайды: басы айналып, әлсіздік пайда болады, тыныс алуы\nқиындайды.\n      Педагог:\n            Достары бірінші кезекте не істеуі керек?\n      Білім алушылар жауап береді.\n      Педагог қорытынды жасайды:\n            Егер белгісіз затты қолданғаннан кейін адамның жағдайы\nнашарласа, әсіресе тыныс алуы қиындаса, есі ауысып немесе жағдайы\nкүрт нашарласа, дереу 103 нөмірі арқылы жедел медициналық көмек\nшақыру қажет. Егер адам қандай затты қолданғаны белгілі болса, бұл\nақпаратты жасыруға болмайды.\n      Педагог оқиғаны жалғастырады.\n      Достарының бірі:\n      -      Ешкімге айтпаңдар, әйтпесе бәріміздің басымыз дауға\nқалады, – дейді.\n      Педагог:\n            Бұл сөз неліктен қауіпті?\n            Қандай шешім дұрыс болады?\n      Білім алушылар жауап бергеннен кейін педагог қорытынды\nжасайды.\n      Педагог:\n      -      Қауіпті жағдайды жасыруға болмайды. Ересектер болған\nжағдайдан неғұрлым тез хабардар болса, адамға соғұрлым тез көмек\nкөрсетіледі.\n      Педагог:\n      -      Қай кезеңде осы жағдайдың алдын алуға болаты еді?\nСабақтың басындағы диалогты еске түсірейік.\n      Білім алушылар жауап береді.\n      Педагог атап көрсетеді:\n      - Күмәнді ұсыныстан бірден бас тарту – қауіпсіздіктің ең дұрыс\nжолы. Егер адам ұсынысқа келісіп, белгісіз затты қолданып қойған\nболса, болған жағдайды жасырмай, дер кезінде көмекке жүгіну\nмаңызды.\n      Есте сақтаңыз!\n\n      Денсаулыққа қауіпті тәжірибелерге вейптерді және құрамында\nникотин бар басқа да өнімдерді пайдалану, белгісіз таблеткаларды,\nдәрілік препараттарды немесе заттарды қабылдау, сондай-ақ қауіпті\nинтернет-челлендждерге қатысу жатады. Әсіресе Қазақстан\nРеспубликасының заңнамасына сәйкес айналымына толық тыйым\nсалынған есірткі құралдары, психотроптық заттар және олардың\nаналогтары – аса қауіпті. Оларды сатып алу, сақтау, тасымалдау,\nдайындау және өткізу Қазақстан Республикасының Қылмыстық\nкодексінің 296 және 297-баптарына сәйкес қылмыстық жауаптылыққа\nәкеп соғады.\n      «Заң      және    тәртіп»     қағидаты     өз шешімдері      үшін\nжауапкершіліктен басталады. Қауіпсіз шешім – белгісіз заттан бас\nтарту, қысымға берілмеу және қауіпті жағдайдан шығу. Қысым көрсету\nжалғасқан жағдайда сенім артатын ересек адамнан көмек сұрау қажет.\n      Педагог білім алушылардың назарын жаднамаға аударады:\n      https://drive.google.com/file/d/106psd8xHuCLdUx3ufmskrn6iazwE\n4sph/view?usp=sharing\n      III. Қорытынды бөлім\n      «Менің таңдауым» жаттығуы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n            Бүгін айтылған ең қауіпті сөз – ...\n            Егер маған белгісіз затты байқап көруді ұсынса, мен ...\n            Егер жанымдағы адамның жағдайы нашарласа, мен ...\n      Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n      Педагог сабақтың қорытындысын шығарады.\n      -      Қауіпсіз шешім – белгісіз заттан бас тарту. Егер оны\nқолданғаннан кейін адамның жағдайы нашарласа, болған жағдайды\nжасыруға болмайды – дереу көмекке жүгіну қажет.\n      Егер жасөспірімді үнемі бір нәрсеге мәжбүрлесе, қорқытса\nнемесе қауіпті әрекеттерге тартуға тырысса, бұл туралы сенім артатын\nересек адамға айту қажет. Кеңес пен қолдау алу үшін 111 байланыс\nорталығына жүгінуге болады.\n\nҚазақстан Республикасының Жасанды\nинтеллект және цифрлық даму\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/106psd8xHuCLdUx3ufmskrn6iazwE\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/106psd8xHuCLdUx3ufmskrn6iazwE<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 6-сабақ — Ұлы дала коды"}, "grade-9/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Цифрлық ортада қауіпсіз әрі жауапты әрекет ету<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 346-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=346\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№7 сабақ            Цифрлық ортада қауіпсіз әрі жауапты әрекет\n              ету\nМақсаты         Білім алушылардың цифрлық ортада өз\n            әрекеттерінің ықтимал салдарын ескере отырып,\n            қауіпсіз әрі жауапты мінез-құлық дағдыларын\n            қалыптастыру.\nМіндеттері:      білім алушыларды цифрлық ортадағы әрекеттері\n            мен жарияланымдарының ықтимал салдарымен\n            таныстыру;\n                 цифрлық контентті жарияламас немесе таратпас\n            бұрын тәуекелдерді бағалай білу дағдысын дамыту;\n                 цифрлық ортада қауіпсіз әрі жауапты мінез-\n            құлық қалыптастыру.\n\n      Материалдар мен ресурстар\n      Жағдаяттар жазылған карточкалар, «Жарияламас бұрын бір сәт\nтоқта» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагогтің сұрақтары:\n            Көбірек қаралым, лайк немесе назарға ие болуға деген\nұмтылыс адамды неліктен қауіпті әрекеттерге итермелеуі мүмкін?\n            Интернет кеңістігін ережесіз орта деп санауға бола ма?\n            Цифрлық ортада жауапты мінез-құлық таныту дегенді\nқалай түсінесіңдер?\n      Білім алушылар өз пікірлерін білдіреді.\n      Педагог қорытынды жасайды:\n      - Интернеттегі кез келген әрекеттің салдары болуы мүмкін.\nЦифрлық ортадағы жауапты мінез-құлық адамның өз беделін сақтауға,\nбасқа адамдардың құқықтарын құрметтеуге және заң талаптарын\nсақтауға көмектеседі.\n      II. Негізгі бөлім\n      «Жариялау немесе бас тарту?» практикалық тапсырмасы\n      Педагог жағдаят ұсынады:\n      - Тоғызыншы сынып оқушысы досымен бірге әлеуметтік\nжеліге     арналған     пранк-видео    түсірді.   Видео     барысында\n\nқатысушылардың бірі жарақат алып қалуы мүмкін қауіпті әрекет\nжасады. Видео көп қаралым жинау мақсатында жарияланды. Бірнеше\nсағаттан кейін видео басқа аккаунттарда да тарала бастады. Автор\nбастапқы жарияланымды өшірді, алайда қолданушылар видеоны\nсақтап үлгеріп, басқа адамдарға жіберіп қойған болатын.\n      Педагогтің сұрақтары:\n      1.    Осы жағдайда қандай шешімдер қауіпті болды?\n      2.    Бұл әрекеттің өзіне және видеодағы басқа адамдарға\nқандай салдары болуы мүмкін?\n      3.    Бұл жағдайда қалай әрекет ету керек еді?\n      Білім алушылар жағдаятты талқылап, өз ұсыныстарын білдіреді.\n      Педагог түсіндіреді:\n      - Жарияланған цифрлық контент бастапқы жарияланым\nөшірілгеннен кейін де сақталып, таралады. Скриншоттар, көшірмелер\nжәне қайта жарияланған материалдар адамның цифрлық ізінің бір\nбөлігіне айналып, оның цифрлық беделіне әсер етеді..\n      Есте сақтаңыз!\n      Интернеттегі әрекеттердің құқықтық салдары бар. Қорқыту,\nбуллинг, басқа адамдардың материалдарын олардың келісімінсіз\nтарату және заңға қайшы өзге де контент Қазақстан Республикасының\nзаңнамасына сәйкес жауапкершілікке әкеп соғады.\n      Педагог білім алушылардың назарын тақырыпқа қатысты\nбейнематериалға аударады:\n      https://www.youtube.com/watch?v=vMmVSwGYo5U\n      Есте сақтаңыз!\n      «Заң және тәртіп» қағидаты цифрлық ортада да\nқолданылады. Интернет ережесіз кеңістік емес. Желідегі жауапты\nмінез-құлық – басқа адамдарды құрметтеу, заң талаптарын сақтау және\nәрбір хабарламаға, фотосуретке, бейнежазбаға немесе пікірге саналы\nтүрде қарау дегенді білдіреді.\n      Әлеуметтік желіге пранк, челлендж немесе трендтік видео түсіру\nүшін қоғамдық тәртіпті бұзуға, адамдарға кедергі келтіруге, оларды\nәдейі қорқытуға немесе мазалауға болмайды. Контент түсіру басқа\nадамдардың құқығы мен қауіпсіздігін елемеуге себеп болмауы тиіс.\n      Педагог    білім     алушылардың      назарын     тақырыпқа\nқатысты жаднамаға (2–3-беттер) аударады.\n      https://drive.google.com/file/d/14LiP77Sye62FajsmC6wY1ueYp9DGPzwW/vie\nw?usp=sharing\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n           Жарияламас бұрын мен міндетті түрде ...\n\n          Бүгінгі сабақтан кейін мен ... екенін түсіндім.\n          Цифрлық ортадағы жауапты мінез-құлықтың ең маңызды\nережесі – ...\n      Бірнеше білім алушы өз жауаптарымен бөліседі.\n      Педагог қорытынды жасайды:\n      Интернетте контент жариялау – адамның өзіне де,\nайналасындағыларға да әсер етуі мүмкін салдары бар шешім. Контентті\nжарияламас немесе басқаға жібермес бұрын үш маңызды аспектіні\nбағалау қажет: қауіпсіздік, заңдылық және оның салдары. Цифрлық\nортада әр әрекетіңе абай бол және кез-келген түсініксіз жағдайда\nересектерден көмек сұра.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=vMmVSwGYo5U\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=vMmVSwGYo5U<\/a><\/p><p><a href=\"https://drive.google.com/file/d/14LiP77Sye62FajsmC6wY1ueYp9DGPzwW/vie\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/14LiP77Sye62FajsmC6wY1ueYp9DGPzwW/vie<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 7-сабақ — Ұлы дала коды"}, "grade-9/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Бейтаныс адамнан төнетін қауіптен сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 349-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=349\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ         Бейтаныс адамнан төнетін қауіптен сақтану\nМақсаты        Білім алушылардың интернетте және күнделікті\n           өмірде бейтаныс адамның тарапынан қауіп төнген\n           жағдайда     қауіпсіз    әрекет  ету    дағдыларын\n           қалыптастыру.\nМіндеттері      бейтаныс адамның ықтимал қауіпті мінез-\n           құлқының белгілерін ажырата білуге үйрету;\n                сенім артатын ересектерден және шұғыл\n           қызметтерден дер кезінде көмек сұрауға дайын болу\n           дағдысын дамыту;\n                интернетте және күнделікті өмірде бейтаныс\n           адамның тарапынан қауіп төнген жағдайда қауіпсіз\n           әрекет ету алгоритмін бекіту.\n\n      Материалдар мен ресурстар\n      «Бейтаныс адам тарапынан қауіп төнген жағдайда қалай әрекет\nету керек?» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Қауіп қай кезде туындайды?» тапсырмасы\n      Педагог екі қысқа мысал ұсынады:\n      Интернетте\n      Бейтаныс адам әлеуметтік желі арқылы хат жазып, танысуды\nұсынады, сурет жіберуді сұрайды және кездесуге шақырады. Сонымен\nқатар: «Тек бұл туралы ешкімге айтпа», – дейді.\n      Көшеде\n      Жасөспірім бейтаныс адамның соңынан еріп келе жатқанын\nбайқайды. Ол жасөспіріммен сөйлесуге тырысып, үйіне дейін жеткізіп\nсалуды ұсынады.\n      Педагогтің сұрақтары\n            Бұл жағдайларда қандай әрекеттер күдік тудыруы керек?\n            Осы екі жағдайдың қандай ортақ белгілері бар?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог атап көрсетеді:\n\n      Адамның қауіпті екенін оның таныс не бейтаныс болуы емес, іс-\nәрекеті анықтайды. Егер біреу қысым жасаса, қарым-қатынасты құпия\nұстауды талап етсе, жеке мәліметтеріңді немесе фотосуреттеріңді\nқайта-қайта сұраса, ересектерге айтпай кездесуге шақырса, соңынан\nқалмай мазаласа, қорқытса немесе сенің бас тартқаныңды қабылдамаса,\nмұндай әрекеттерге бей-жай қарама.\n      II. Негізгі бөлім\n      «Қауіпсіз шешім» жаттығуы\n      1-жағдаят. Интернеттегі бейтаныс адам\n      Педагог сұрайды:\n       Егер бейтаныс адам кездесуді ұсынса, жеке суреттерді\nжіберуді сұраса немесе сіз бас тартқаннан кейін қорқыта бастаса, не\nістеу керек?\n      Білім алушылар өз нұсқаларын ұсынады.\n      Педагог толықтырады:\n      Дұрыс әрекеттер:\n            бейтаныс адамның талабымен жеке суреттерді немесе\nбейнежазбаларды жібермеу;\n            мекенжайды, оқу орнын, күнделікті жүретін бағытты және\nорналасқан жеріңізді анықтауға мүмкіндік беретін басқа да\nмәліметтерді хабарламау;\n            ата-ананың немесе басқа да сенім артатын ересек адамның\nхабарынсыз кездесуге келіспеу;\n            қысым көрсету немесе буллинг жағдайында қарым-\nқатынасты тоқтату, дәлелдерді сақтап қою, пайдаланушыны бұғаттау\nжәне болған жағдай туралы ересек адамға хабарлау.\n      2-жағдаят. Көшедегі бейтаныс адам\n      Педагог сұрайды:\n      - Егер бейтаныс адам артыңыздан еріп келе жатса, жолыңызды\nбөгеп, тоқтатуға тырысса немесе көлігіне отыруды ұсынса, не істеу\nкерек?\n      Білім алушылар өз нұсқаларын ұсынады.\n      Педагог толықтырады.\n      Дұрыс әрекеттер:\n       адам көп әрі қауіпсіз жерге – дүкенге, дәріханаға, мектепке\nнемесе басқа да мекемеге кіру;\n       сол жердегі қызметкерге, күзет қызметіне, полицияға немесе\nжақын маңдағы басқа адамдарға жүгініп, көмек қажет екенін нақты\nайту;\n       ата-анамен немесе басқа да сенім артатын ересек адаммен\nбайланысу;\n\n         тікелей қауіп төнген жағдайда 102 немесе 112 нөміріне қоңырау\nшалу.\n      «Бас тарт – қауіптен алыста/бұғатта – хабарла» алгоритмі\n      Педагог білім алушыларға үш қарапайым ережені есте сақтауды\n      ұсынады.\n       Бас тарт. Кездесуге баруға, жеке мәліметтерді немесе\nфотосуреттерді беруге, сондай-ақ алаңдаушылық туғызатын немесе\nқауіпті болып көрінетін өтінішті орындауға келіспе.\n       Қауіптен алыста/бұғатта. Интернеттегі қарым-қатынасты\nтоқтат және пайдаланушыны бұғатта. Егер жағдай шынайы өмірде\nорын алса, дауласпай, адам көп әрі қауіпсіз жерге бар.\n       Хабарла. Ата-анаңа немесе басқа да сенім артатын ересек\nадамға айт. Интернеттегі қауіп-қатер жағдайында хабарламалар мен\nскриншоттарды сақтап қой. Егер саған қауіп төндірсе, аңдыса,\nбопсаласа немесе зиян келтіруге әрекет жасаса, 102 нөмірі арқылы\nполицияға немесе отбасы, әйелдер және балалардың құқықтарын\nқорғау мәселелері бойынша 111 байланыс орталығына хабарлас.\n      Педагог білім алушылардың назарын жаднамаға аударады.\n       https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us\np=sharing\n       III. Қорытынды бөлім\n       Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n            Егер интернеттегі бейтаныс адам мені кездесуге шақырса,\nмен ...\n            Егер бейтаныс адамның артымнан еріп келе жатқанын\nбайқасам, мен ...\n            Қауіпті жағдайда мен ... адамнан көмек сұраймын.\n            Егер тікелей қауіп төнсе, мен ... нөміріне қоңырау\nшаламын.\n       Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n       Педагог қорытынды жасайды:\n       - Егер адамның әрекеті алаңдаушылық туғызса немесе қауіп\nтөндірсе, қауіпті қарым-қатынасты жалғастырмау маңызды: бас тарту,\nқарым-қатынасты тоқтату, қауіпсіз жерге бару және сенім артатын\nересек адамға хабарлау қажет. Тікелей қауіп төнген жағдайда шұғыл\nкөмекке жүгіну керек.\n       Көмек сұрау – қауіпсіз мінез-құлықтың маңызды бөлігі.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 8-сабақ — Ұлы дала коды"}, "grade-9/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Жұмысқа орналасудағы алаяқтықтан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 352-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=352\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№9 сабақ         Жұмысқа орналасудағы алаяқтықтан сақтану\nМақсаты        Білім алушылардың жұмысқа орналасу кезінде\n           алаяқтық белгілерін ажыратып, ұсыныстың сенімділігін\n           тексеру және қауіпсіз шешім қабылдау дағдыларын\n           қалыптастыру.\nМіндеттері      – күмәнді жұмыс ұсыныстары мен алаяқтықтың\n           негізгі белгілерін анықтай білуге үйрету;\n                – жұмыс беруші туралы ақпаратты, ұсыныс\n           шарттарын және байланыс деректерін тексеру\n           дағдыларын дамыту;\n                – жеке мәліметтері мен ақшасын қорғауға, күмәнді\n           жағдайда асығыс шешім қабылдамай, көмекке жүгінуге\n           дағдыландыру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Келісуге бола ма?» тапсырмасы\n      Педагог хабарландыруды көрсетеді.\n      «14 жастан асқан жасөспірімдерге арналған қосымша жұмыс.\n      Күніне 20 000 теңгеге дейін табыс.\n      Тәжірибе қажет емес.\n      Жұмыс күніне 1–2 сағатты құрайды.\n      Жұмысты бастау үшін 5 000 теңге көлемінде тіркеу ақысын төлеу\nқажет.\n      Толық ақпарат тек жеке хабарламада беріледі».\n      Педагогтің сұрақтары:\n            Хабарландыруда қандай ұсыныстар тартымды көрінеді?\n            Қандай белгілер күмән тудырады?\n            «Тіркелу үшін» алдын ала ақша төлеу талабы неліктен\nқауіптенуге себеп болуы керек?\n      Білім алушылар өз пікірлерін білдіреді.\n      Педагог қорытынды жасайды:\n      Егер жұмысқа орналасу үшін алдын ала ақша талап етсе немесе\nнақты еңбек міндеттері көрсетілмей, тым жоғары табыс уәде етілсе, бұл\nеңбек саласындағы алаяқтықтың кең таралған белгілерінің бірі болуы\nмүмкін.\n\n      II. Негізгі бөлім\n      «Қауіпсіз жұмыс ұсынысы» практикалық тапсырмасы\n      Педагог қосымша жұмыстың қауіпсіз белгілермен таныстырады:\n       жұмыс міндеттері, еңбек жағдайлары және еңбекақы мөлшері\nалдын ала нақты көрсетілген;\n       жұмыс берушінің кім екені және оның байланыс деректерін\nтексеруге болады;\n       еңбек заңнамасына сәйкес ресми түрде жұмысқа орналасу\nұсынылады;\n       жұмыс жасөспірімнің жасына сәйкес келеді;\n       жұмысқа орналасу үшін алдын ала ақша төлеу талап етілмейді;\n       банк картасын, PIN-кодты, SMS-кодтарды, парольдерді немесе\nбанк қосымшасына кіру деректерін беруді талап етпейді;\n       басқа адамдардың ақшасын қабылдап, оны басқа шоттарға\nаударуды ұсынбайды;\n       жұмысты ата-анадан немесе заңды өкілдерден жасыруды талап\nетпейді.\n      Педагог білім алушылардың назарын бейнематериалға\nаударады:\n      https://www.youtube.com/watch?v=Dae8gdyA1OY\n      «Заң және тәртіп» қағидаты жұмысқа орналасқанда заң\nталаптарын сақтап, өз құқығың мен қауіпсіздігіңді қорғауды білдіреді.\nЖұмыс ресми рәсімделіп, жасөспірімнің жасына сай болуы керек.\n      Егер жұмыс беруші жұмысқа алу үшін алдын ала ақша сұраса,\nбанк картасының деректерін беруді талап етсе немесе күмәнді ақша\nаударымдарын жасауды ұсынса, мұндай ұсынысқа келіспе. Бұл туралы\nата-анаңа, сынып жетекшісіне немесе өзің сенетін ересек адамға айт.\n      Егер алаяқтық, қорқыту немесе заңсыз әрекет белгілері байқалса,\nқұқық қорғау органдарына немесе 102 нөміріне хабарлап, көмек\nсұрауға болады. Ал еңбек құқықтары бұзылса немесе жұмысқа\nресімдеу талаптары сақталмаса, еңбек инспекциясына жүгін.\n      Кәмелетке толмағандардың қауіпсіз еңбек ету құқығы\nҚазақстан Республикасының заңнамасымен қорғалады.\n      Қазақстан Республикасының Еңбек кодексіне сәйкес:\n            жалпы ереже бойынша еңбек шарты 15 жастан\nбастап жасалады;\n            14 жастан бастап жасөспірім оқудан тыс бос уақытында\nеңбек заңнамасының талаптарын сақтай отырып, жеңіл жұмыс атқара\nалады;\n            14 жастан 16 жасқа дейінгі қызметкерлер үшін жұмыс\nуақытының ұзақтығы аптасына 24 сағаттан аспауға тиіс;\n\n             16 жастан 18 жасқа дейінгі қызметкерлер үшін жұмыс\nуақыты аптасына 36 сағаттан аспауға тиіс;\n             кәмелетке толмағандарды ауыр жұмыстарға, зиянды және\nқауіпті еңбек жағдайларындағы жұмыстарға, түнгі уақыттағы\nжұмысқа, үстеме жұмысқа және вахталық әдіспен орындалатын\nжұмыстарға тартуға тыйым салынады.\n      Педагог білім алушыларға жаднама ұсынады:\n      https://drive.google.com/file/d/1KPFqMu6qSv-\nCKAKbx_VTPu98Ahb82x8H/view?usp=sharing\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n             Жұмысқа келісім бермес бұрын, мен ...\n             Егер жұмыс беруші ақша немесе банк деректерін талап\nетсе, мен ...\n             Егер ұсыныс күмән тудырса, мен ... адамнан кеңес\nсұраймын.\n      Білім алушылар өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n      Егер қосымша жұмыс туралы ұсыныс күмән тудырса, оны ата-\nанаңызбен немесе басқа да сенім артатын ересек адаммен талқылаңыз.\nЕгер сіз ақшаңызды немесе жеке деректеріңізді беріп қойған болсаңыз\nне алаяқтық белгілеріне тап болсаңыз, бұл туралы дереу ересек адамға\nхабарлап, қажет болған жағдайда 102 нөмірі арқылы полицияға жүгіну\nмаңызды.\n      Баланың құқықтарын қорғау мәселелері бойынша кеңес алу\nүшін 111 байланыс орталығына хабарласуға болады.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=Dae8gdyA1OY\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=Dae8gdyA1OY<\/a><\/p><p><a href=\"https://drive.google.com/file/d/1KPFqMu6qSv-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1KPFqMu6qSv-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 9-сабақ — Ұлы дала коды"}, "grade-9/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Қорқыту мен бопсалау кезінде қауіпсіз әрекет ету<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 355-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=355\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ     Қорқыту мен бопсалау кезінде қауіпсіз әрекет ету\n Мақсаты       Білім алушылардың қорқыту, бопсалау және қысым\n            көрсету жағдайларын бағалап, қауіпсіз әрі жауапты\n            шешім қабылдау дағдыларын қалыптастыру.\n Міндеттері    – қорқыту, бопсалау және психологиялық\n            қысымның негізгі белгілерін ажырата білуге үйрету;\n               – қысым жағдайында тәуекелді бағалап, өз\n            қауіпсіздігін сақтай отырып әрекет ету дағдыларын\n            дамыту;\n               – құқықтары бұзылған жағдайда сенімді ересек\n            адамға, маманға немесе тиісті қызметке дер кезінде\n            жүгінуге дағдыландыру.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға үш сөйлемді оқиды:\n      – «Ақша бермесең, сен туралы жағымсыз ақпарат таратамын».\n      – «Суретті жібермесең, хат-хабарларыңды басқаларға\nкөрсетемін».\n      – «Бұл туралы біреуге айтсаң, өзің өкінетін боласың».\n      Педагог сұрайды:\n      – Бұл үш жағдайда қандай ортақ белгі бар?\n      – Мұндай сөздер адамның шешіміне қалай әсер етуі мүмкін?\n      – Қорқыту мен бопсалауды қарапайым өтініштен қалай\nажыратуға болады?\n      Білім алушылар өз пікірлерін айтады.\n      Педагог қорытындылайды:\n      – Бұл мысалдардың барлығында адамды қорқыту немесе қысым\nкөрсету арқылы өзі қаламайтын әрекетке көндіруге тырысады. Ақша,\nзат, фотосурет, жеке ақпарат немесе басқа бір әрекетті талап етіп, оны\nорындамаған жағдайда зиян келтіремін деп қорқыту – бопсалау мен\nқысымның белгісі.\n      Бүгін біз осындай жағдайларды қалай тануға, қауіп деңгейін\nбағалауға және өз қауіпсіздігімізді сақтай отырып қалай әрекет етуге\nболатынын талқылаймыз.\n      II. Негізгі бөлім\n      «Қалай дұрыс әрекет ету керек?» практикалық тапсырмасы\n\n      Педагог жағдаят ұсынады.\n      Тоғызыншы сынып оқушысына ақша аударуды талап етіп,\nхабарламалар жаза бастады. Оны жеке хат-хабарларын көпшілікке\nтаратып жібереміз деп қорқытып, болған жағдайды ешкімге айтпауын\nталап етуде.\n      Педагогтің сұрақтары:\n       Қандай қауіпті белгілерді байқадыңдар?\n       Қандай әрекеттер жағдайды одан әрі қауіпті етуі мүмкін?\n       Қалай дұрыс әрекет ету керек?\n      Талқылаудан кейін педагог қорытынды жасайды.\n      «Орындама – сақта – хабарла – көмекке жүгін» алгоритмі\n      Талаптарды орындама\n      Қорқытып немесе бопсалап отырған адамның талабымен ақша,\nбанк деректерін, парольдерді, жеке материалдарды немесе басқа да\nақпаратты берме.\n      Дәлелдерді сақта\n      Хабарламаларды өшірме. Қауіпсіз болса, хат-хабарларды,\nаккаунт туралы деректерді сақтап, скриншоттар жаса.\n      Ересек адамға хабарла\n      Ата-анаңа немесе басқа да сенім артатын ересек адамға айт. Егер\nбірінші жүгінген ересек адам көмектесе алмаса немесе қолжетімсіз\nболса, басқа ересек адамға хабарлас.\n      Көмекке жүгін\n      Қорқыту, бопсалау немесе басқа да тікелей қауіп жағдайында 102\nнөмірі арқылы полицияға, ал өмірге немесе денсаулыққа шұғыл қауіп\nтөнген жағдайда 103 нөміріне хабарлас. Балалардың құқықтарын\nқорғау мәселелері бойынша кеңес пен қолдау алу үшін 111 байланыс\nорталығына жүгінуге болады.\n      Сенім артатын ересек адамнан көмек сұра.\n      «Заң және тәртіп» қағидаты әр адамның құқықтарын, қадір-\nқасиетін және қауіпсіздігін құрметтеуді білдіреді. Қорқыту, бопсалау\nнемесе мәжбүрлеу арқылы ақша, мүлік, жеке деректер, фотосуреттер\nберуді немесе басқа да әрекеттерді талап етуге жол берілмейді. Мұндай\nжағдайда қауіпсіз шешім – талаптарды орындамау, дәлелдерді сақтау\nжәне көмекке жүгіну.\n      Қазақстан Республикасында бопсалау, қорқыту және заңға\nқайшы әрекеттерге мәжбүрлеу құқыққа қайшы әрекеттер болып\nтабылады және заңнамаға сәйкес жауаптылыққа әкеп соғады.\n      Қорқыту немесе бопсалау кезінде адам қорқып, ұялып немесе\n«айтсам, жағдай одан әрі қиындайды» деп үндемей қалуы мүмкін.\nБірақ мұндай мәселені жалғыз шешуге тырысу қауіпті күшейтуі\n\nықтимал. Болған жағдайды ата-анаңа, өзің сенетін ересек адамға,\nпедагогке немесе маманға айту – қауіпсіздікті қалпына келтіруге\nжасалған алғашқы қадам. Кейде мәселені біреуге айтудың өзі\nжағдайға басқа қырынан қарап, әрі қарай не істеу керектігін түсінуге\nкөмектеседі. Есіңде болсын: қорқыту мен бопсалауға тап болсаң, сен\nжалғыз емессің және көмек сұрауға толық құқығың бар.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сұрақтарды өздері үшін\nанықтауды ұсынады, жауаптарын міндетті түрде жариялау талап\nетілмейді:\n       қиын жағдайға тап болғанда мен қай ересек адамға жүгіне\nаламын;\n       егер бірінші адамға хабарласу мүмкін болмаса, тағы кімнен\nкөмек сұрай аламын;\n       қандай көмек көрсету қызметтеріне жүгіне аламын: 111, 102,\n112.\n      Педагог қорытынды жасайды:\n      - Қорқыту мен бопсалау жағдайында талаптарды орындауға және\nмәселені жалғыз өзі шешуге тырысуға болмайды. Қауіпсіз әрекет ету\nалгоритмі – талаптарды орындамау, дәлелдерді сақтау, сенім артатын\nересек адамға хабарлау және көмекке жүгіну. Адам көмекке неғұрлым\nертерек жүгінсе, қауіпті жағдайды тоқтатуға және өз құқықтарын\nқорғауға соғұрлым көп мүмкіндік болады.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 10-сабақ — Ұлы дала коды"}, "grade-9/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Мектепте қауіпті жағдай туындағанда қауіпсіз әрекет ету<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 358-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=358\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№11 сабақ      Мектепте қауіпті жағдай туындағанда қауіпсіз\n           әрекет ету\nМақсаты        Білім алушылардың мектепте қауіпті жағдай\n           туындаған кезде қауіпсіз әрекет ету және дұрыс шешім\n           қабылдау дағдыларын қалыптастыру.\nМіндеттері      мектепте қауіпті жағдай туындаған кезде қауіпсіз\n           әрекет ету алгоритмін бекіту;\n                өз қауіпсіздігі мен айналасындағы адамдардың\n           қауіпсіздігі үшін жауапкершілік сезімін дамыту;\n                қауіп-қатер туындаған жағдайда жауапты әрі\n           қауіпсіз мінез-құлық қалыптастыру.\n\n     Материалдар мен ресурстар\n     «Мектептегі қауіпсіздік» жадынамасы.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог білім алушылардың назарын тақырыпқа қатысты\nбейнематериалға аударады:\n     https://www.youtube.com/watch?v=0GNBf656hjI\n      Талқылауға арналған сұрақ\n      – Қауіпті жағдай туындағанда ережелер мен нұсқауларды білу не\nүшін қажет?\n      – Дүрбелең адамның дұрыс шешім қабылдауына қалай әсер етуі\nмүмкін?\n      Білім алушылар өз пікірлерін айтады.\n      Педагог қорытындылайды:\n      – Мектепте қауіпсіздікті қамтамасыз ету үшін арнайы ережелер\nмен әрекет ету тәртібі белгіленген. Олар күнделікті тәртіпті сақтау\nүшін ғана емес, күтпеген жағдай туындағанда адамдардың қауіпсіздігін\nқорғау үшін қажет.\n      Қауіпті жағдайда асығыс шешім қабылдамай, не болып жатқанын\nдұрыс бағалау, педагогтер мен қауіпсіздік қызметкерлерінің\nнұсқауларын орындау және өз бетіңше тәуекелге бармау қажет.\n      Бүгін біз мектепте қауіпті жағдай туындаса, қалай сабыр сақтап,\nқауіпсіз әрі дұрыс әрекет ету керектігін қарастырамыз.\n      II. Негізгі бөлім\n      Қауіпті жағдайлардың түрі әртүрлі болғандықтан, әрқайсысында\nәрекет ету тәртібі де өзгеше болады. Бірақ ортақ ережелер бар: сабыр\nсақтау, қауіп көзіне жақындамау, болған жағдай туралы дереу\nересектерге хабарлау және педагогтер мен жедел қызмет\nмамандарының нұсқауларын орындау.\n\n       «Дұрыс шешім» практикалық тапсырмасы\n       Педагог жағдаят ұсынады:\n     - Сабақ барысында мектеп әкімшілігі төтенше жағдай\nтуындағанын хабарлап, барлығынан педагогтердің нұсқауларын\nорындауды сұрады. Кейбір білім алушылар дәлізге шығып, не\nболғанын өз көздерімен көріп келуді ұсынды, ал басқалары болып\nжатқан жағдайды телефонға түсіріп, достарына хабарламалар жібере\nбастады.\n       Педагог:\n        Ең алдымен не істеу қажет?\n        Қандай әрекеттер өзіңізге және айналаңыздағы адамдарға\nтөнетін қауіпті арттыруы мүмкін?\n        Болған жағдайды өз бетінше анықтауға тырысу неліктен\nқауіпті болуы мүмкін?\n       Талқылаудан кейін педагог қорытынды жасайды.\n       «Тыңда – бағала – хабарла – әрекет ет» алгоритмі\n       Тыңда – ресми хабарламалар мен педагогтің нұсқауларын мұқият\nтыңда.\n       Бағала – қауіп көзіне жақындама және өзіңе де, айналаңдағы\nадамдарға да қауіп төндірме.\n       Хабарла – қауіпті жағдайдың белгілерін бірінші болып байқасаң,\nпедагогке немесе мектеп әкімшілігіне хабарла.\n       Әрекет ет – педагогтер мен шұғыл қызметтер қызметкерлерінің\nнұсқауларын орында, жалған ақпарат таратпа және болып жатқан\nжағдайды жариялау мақсатында видеоға түсірме.\n       Күдікті затты өз бетінше тексеруге, қауіп көзін іздеуге немесе не\nболғанын анықтауға тырыспа.\n       «Заң және тәртіп» қағидаты\n       Қазақстан Республикасының білім беру ұйымдарында қауіпсіздік\nережелері қолданылады. Мектеп ортасында бұл белгіленген қауіпсіздік\nталаптарын сақтау, басқа адамдардың құқықтарын құрметтеу, сондай-\nақ педагогтердің, мектеп әкімшілігінің және шұғыл қызметтер\nқызметкерлерінің заңды талаптарын орындау арқылы көрініс табады.\n       Әр адамның жауапты мінез-құлқы қауіпті азайтуға және\nайналасындағы адамдардың қауіпсіздігін             қамтамасыз      етуге\nкөмектеседі.\n       Мектеп аумағына\n            оқу процесінде пайдаланылмайтын пышақтар мен басқа да\nқауіпті заттарды;\n            жарылғыш, тез тұтанатын, химиялық және уытты\nзаттарды;\n\n         пиротехникалық бұйымдарды;\n         темекі өнімдерін, электрондық темекілерді (вейптерді)\nжәне құрамында никотин бар басқа да өнімдерді алып кіруге тыйым\nсалынады.\n      *Қазақстан Республикасы Білім және ғылым министрінің 2021 жылғы 25\nмамырдағы № 235 бұйрығы «Мектепке дейінгі, орта, техникалық және кәсіптік,\nорта білімнен кейінгі, қосымша білім беру ұйымдарына және олардың\nаумақтарына алып кіруге тыйым салынған, пайдаланылуы шектелген заттар мен\nзаттардың тізбесін бекіту туралы».\n      Егер білім алушы күдікті немесе тыйым салынған затты байқаса,\nоны ұстауға, ашуға немесе орнынан қозғауға болмайды. Бұл туралы\nдереу мұғалімге немесе мектеп әкімшілігіне хабарлау қажет.\n      Өмірге немесе денсаулыққа тікелей қауіп төнген жағдайда – 102\nнемесе 103 нөміріне хабарласу қажет.\n      Егер қауіпті жағдайдан кейін жасөспірімге өз құқықтарын қорғау\nмәселелері бойынша кеңес пен қолдау қажет болса, сенім артатын\nересек адамға, мектеп психологіне немесе 111 байланыс\nорталығына жүгінуге болады.\n      Педагог білім алушылардың назарын тақырыпқа қатысты\nбейнероликке аударады.\n     https://www.youtube.com/watch?v=lIWt0hR1EB8&amp;list=PLA5eCSY2FeoT00\nB3gyDuskOvkalEx7TmU&amp;index=18\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n            Егер мектепте қауіпті жағдай туындаса, менің бірінші\nәрекетім – ...\n            Егер қауіпті жағдайдың белгілерін бірінші болып\nбайқасам, мен ...\n            Егер шұғыл көмек қажет болса, мен ... екенін білемін.\n      Бірнеше білім алушы өз қалауы бойынша жауап береді.\n      Педагог қорытынды жасайды:\n      - Мектептегі қауіпсіздік әр адамның жауапты мінез-құлқына\nбайланысты. Ережелерді сақтау, сабырлық таныту және педагогтерге\nдер кезінде хабарлау өзіңді және айналаңдағы адамдарды қорғауға\nкөмектеседі.\n      Негізгі ереже\n      Қауіпті жағдай туындаған кезде сабыр сақта, қауіп көзіне\nжақындама және сынып жетекшісіне, кезекші әкімшіге немесе\nмектептің басқа да қызметкеріне хабарла. Педагогтер мен шұғыл\nқызметтер қызметкерлерінің нұсқауларын орында және қауіпті өз\nбетіңше жоюға тырыспа.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=0GNBf656hjI\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=0GNBf656hjI<\/a><\/p><p><a href=\"https://www.youtube.com/watch?v=lIWt0hR1EB8&amp;list=PLA5eCSY2FeoT00\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=lIWt0hR1EB8&amp;list=PLA5eCSY2FeoT00<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 11-сабақ — Ұлы дала коды"}, "grade-9/lesson-12.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>9-сынып · 12-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-9/index.html\">← 9-сынып тақырыптары<\/a><article><h2>Қауіпті әуестіктер және олардың салдары<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 361-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=361\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№12 сабақ         Қауіпті әуестіктер және олардың салдары\nМақсаты            Білім алушылардың қауіпті әуестіктердің\n              себептері мен ықтимал салдарын бағалап, қысым мен\n              қызығушылыққа ермей, қауіпсіз шешім қабылдау\n              дағдыларын қалыптастыру.\nМіндеттері         – қауіпті әуестіктердің негізгі белгілерін және\n              жасөспірімдерді оған итермелейтін себептерді анықтай\n              білуге үйрету;\n                   – мұндай әрекеттердің денсаулыққа, қауіпсіздікке\n              және күнделікті өмірге ықтимал салдарын талдау\n              дағдыларын дамыту;\n                   – өз өмірі мен денсаулығына жауапкершілікпен\n              қарап, тәуекелді әрекеттерден саналы түрде бас тартуға\n              дағдыландыру.\n\n       Сабақ барысы\n       I. Кіріспе бөлім\n       Педагог сұрақ қояды:\n       Неліктен кейбір жасөспірімдер әлеуметтік желіде танымал\nболу үшін қауіпті әрекеттерге барады?\n      Білім алушылар өз пікірлерін білдіреді.\n      Педагог қорытынды жасайды:\n       Танымал болуға ұмтылу, батылдығын дәлелдеуге тырысу\nнемесе достарынан қалмау кейде жасөспірімдерді қауіпті әрекетке\nитермелеуі мүмкін. Бірақ қысқа сәттік қызығушылықтың салдары\nденсаулыққа да, болашаққа да ұзақ уақыт әсер етуі ықтимал.\n       II. Негізгі бөлім\n       «Мұны дәлелдеудің қажеті бар ма?» практикалық\nжаттығуы\n       Педагог жағдаят ұсынады:\n       Достары тоғызыншы сынып оқушысына қараусыз қалған\nғимараттың төбесіне шығып, әлеуметтік желіге видео түсіруді ұсынды.\n       Достары:\n           «Қорықпа, біз ол жерде болдық».\n           «Егер бас тартсаң – демек, сен қорқақсың».\n           «Барлық танымал блогерлер осылай жасайды».\n\n           «Бірнеше минут қана уақыт алады», – дейді.\n       Педагог:\n       1. Жасөспірім не себепті келісуі мүмкін?\n       Білім алушылар себептерін атайды:\n           өзінің батылдығын дәлелдеуге деген ұмтылыс;\n           мазаққа қалудан қорқу;\n           «бәрі сияқты» болуға деген ұмтылыс;\n           лайк жинап, танымал болуға ұмтылу;\n           «ештеңе болмайды» деген сенім.\n       2. Жасөспірім шын мәнінде нені дәлелдеуге тырысады?\n       Білім алушылар талқылайды.\n       Педагог қорытынды жасайды:\n       - Көбінесе адам өзінің батылдығын басқа адамдарға дәлелдеуге\nтырысады. Бұл жағдайда ең бастысы – қысымға берілмеу және өмір\nмен денсаулыққа қауіп төндіретін әрекеттен бас тарту.\n       Әлеуметтік желідегі трендтер\n       Педагог сұрақ қояды:\n       -    Егер блогер қауіпті трюк жасап, жарақат алмаса, бұл оны\nқайталауға болады дегенді білдіре ме?\n       Білім алушылар жауап береді.\n       Педагог түсіндіреді:\n      Қысқа бейнероликте көрермен көбіне тек соңғы нәтижені көреді.\n       Кадр сыртында:\n           түсірілімге дайындық;\n           қорғаныс құралдары мен сақтандыру жүйесі;\n           мамандардың көмегі;\n           монтаж және бірнеше дубль;\n           қажет болған жағдайда түсірілім жүргізуге берілген\nрұқсаттың бар екенін естен шығармаған жөн.\n       Кейде авторлар шынымен де қауіпті тәуекелге барады. Видеода\nәрекет толық бақылауда тұрғандай көрінгенімен, көрермен түсірілімнің\nбарлық жағдайын және нақты қауіп деңгейін білмейді.\n       Бейнероликтің танымалдылығы әрекеттің қауіпсіз екенін\nдәлелдемейді. Сондықтан лайк пен қаралым саны да қауіпсіздіктің\nкөрсеткіші болып саналмайды.\n       Қауіпті әрекеттер мен трендтерді қайталаудан бұрын өзіңе\nүш сұрақ қой\n       Көрген әрекетіңді қайталаудан бұрын өзіңнен сұра:\n           Бұл қауіпсіз бе?\n           Бұл заңды ма?\n\n           Бұл әрекет мен үшін және айналамдағы адамдар үшін\nқандай тәуекелдер мен салдарға әкелуі мүмкін?\n       «Заң және тәртіп» қағидаты өз өміріңді және айналаңдағы\nадамдардың қауіпсіздігін құрметтеуді, сондай-ақ заң талаптарын\nсақтауды білдіреді. Кейбір тәуекелді әрекеттер бір мезгілде қауіпсіздік\nережелерін, нысандарға кіру тәртібін немесе заңнама талаптарын бұзуы\nмүмкін. Оларға күзетілетін нысандарға заңсыз кіру, теміржол\nинфрақұрылымында қауіпті әрекеттер жасау және адамдардың өмірі\nмен денсаулығына қауіп төндіретін әрекеттер жатады.\n       Кейбір экстремалды әуестіктер қауіпті болып қана қоймай, заң\nталаптарын да бұзады.\n       Мысалы:\n        пойыздың сыртқы бөліктеріне жабысып жүру (зацепинг);\n        ғимараттардың шатырларына, құрылыс алаңдарына және\nбасқа да күзетілетін нысандарға заңсыз кіру;\n        теміржол жолдарын белгіленбеген жерден кесіп өту;\n        адамдардың өмірі мен денсаулығына қауіп төндіретін\nәрекеттер.\n       Өмірге немесе денсаулыққа тікелей қауіп төнген жағдайда – 112\nнөміріне хабарласыңыз.\n       Қорқыту, зорлық-зомбылық, аңду немесе полицияның\nараласуын қажет ететін басқа да жағдайларда – 102 нөміріне\nхабарласыңыз.\n       Педагог      білім   алушыларға       тақырыпқа       қатысты\nбейнематериалмен танысуды ұсынады.\n      https://www.youtube.com/watch?v=uRT_GTJKn_g&amp;list=PLA5eCSY2FeoT0\n0B3gyDuskOvkalEx7TmU&amp;index=22\n       III. Қорытынды бөлім\n       Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n            Егер маған қауіпті челленджерге қатысуды ұсынса, мен ...\n            Бүгінгі сабақтан шығарған ең маңызды қорытынды – ...\n       2–3 білім алушы өз жауаптарын айтады.\n       Педагог қорытынды жасайды:\n      - Есте сақта: шынайы батылдық – қауіпті әрекетті қайталау емес,\nоның салдарын алдын ала бағалап, қысымға ермей дұрыс шешім\nқабылдай білу. Лайк, қаралым немесе біреуге өзіңді дәлелдеу үшін\nөмірің мен денсаулығыңды қатерге тікпе. Егер әрекет қауіпсіз емес,\nзаңға қайшы немесе саған және өзгелерге зиян келтіруі мүмкін болса –\nодан бас тарт.<\/div><p><a href=\"https://www.youtube.com/watch?v=uRT_GTJKn_g&amp;list=PLA5eCSY2FeoT0\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=uRT_GTJKn_g&amp;list=PLA5eCSY2FeoT0<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "9-сынып · 12-сабақ — Ұлы дала коды"}};const HOME="grade-9/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
