і тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көрінбейтін жерден шықпау; қауіпсіз өткелге бару; ересекпен шешу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Кешкі уақытта қараңғы болды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жақсы көрінетін қауіпсіз бағыт; ересекпен маршрутты келісу; мәселені жауаптыға хабарлау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Бағдаршам түсін білмей қалдың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Өздігінен тәуекел етпеу; ересекке айту; қауіпсіз жерден бақылау және ұсыныс.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Қағаздағы үш маршрутты салыстырыңдар: өткелі бар ұзындау жол, өткелсіз қысқа жол, жарықсыз жол. Қауіпсіз нұсқаны негіздеңдер. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ойдан шығарылған мектеп маңындағы қауіпсіздік картасын жасаңдар. Нақты мекенжай мен күнделікті жеке маршрутты жазбаңдар. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Жолда назарым — қауіпсіздікке» үш белгісін әзірлеңдер. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қай жерден өтеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Неге қысқа жол әрдайым қауіпсіз емес? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Телефон назарды қалай бөледі? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Көрінбейтін жерден неге шықпаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Түсініксіз белгі болса кімнен көмек сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын. Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Жолды ересекпен өтемін»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Жолдағы қауіпсіздік» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Досың жолдан қысқа жермен жүгіріп өтпек.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қай жерден өтеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Телефон назарды қалай бөледі? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Түсініксіз белгі болса кімнен көмек сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Өткел» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.\"></textarea><label for=\"reflection-1\">«Жолды ересекпен өтемін» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t27\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t29\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t28", "title": "Жолды ересекпен өтемін | Тәрбие әлемі"}, "lesson/g01-t29": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Жеке шекара және өзара құрмет</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☂</span><span>1-сынып · 29/30 · 40 минут</span></div><h1>Рұқсат сұраймын</h1><p>Жеке шекара және өзара құрмет</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Рұқсат сұраймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Затты аларда рұқсат сұраймыз. «Жоқ» деген жауапты сыйлаймыз. Қорықсақ, сенімді ересекке айтамыз.</p><p>Бүгінгі назарымыз: «Рұқсат сұраймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Біреу сөмкеңді сұрамай ашты. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p><div class=\"concepts\"><span>Шекара</span><span>Рұқсат</span><span>Келісім</span><span>Құрмет</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Біреу сөмкеңді сұрамай ашты.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Құшақтасқың келмейді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бас тартуды құрметтеу; келісімді қайтарып алуды ескеру; балама ұсыну.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Досың «жоқ десең ойнамаймын» деді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысым келісім емес; қауіпсіз бас тарту; сенімді ересектен қолдау сұрау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Бір бала сенің шекараңды білмей қалды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Нақты әрі тыныш сөйлем; шекараны келісу; қайталанса көмек сұрау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Бір жағдай саған ұнамады, бірақ айту қиын.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіздікке қатысты қорқынышты құпияны жалғыз сақтамау; сенімді ересекке айту.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Қауіпсіз зат мысалымен «Мен ... қаламаймын. Оның орнына ... ұсынамын» сөйлемін жаттықтырыңдар. Бір-біріңді ұстамаңдар, қысым жасамаңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Жеке және цифрлық кеңістікке арналған бес ереже құрыңдар: рұқсат, бас тарту, өзгерген келісім, құпиялық, көмек. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Рұқсат сұра — жауапты сыйла» карточкасын жасаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Жеке шекара нені қамтиды? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Рұқсатты неге сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Келісімді өзгертуге бола ма? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қысым мен ерікті келісім қалай ажыратылады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қауіп туса кімнен көмек сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын. Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Рұқсат сұраймын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Жеке шекара және өзара құрмет» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Біреу сөмкеңді сұрамай ашты.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Жеке шекара нені қамтиды? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Келісімді өзгертуге бола ма? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қауіп туса кімнен көмек сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Шекара» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Рұқсат сұраймын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қудалауды сахналамаңыз; кінә артпаңыз; қолдау мен сенімді ересекке жүгінуді ғана жаттықтырыңыз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t28\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t30\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t29", "title": "Рұқсат сұраймын | Тәрбие әлемі"}, "lesson/g01-t30": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Медиасауаттылық</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⌕</span><span>1-сынып · 30/30 · 40 минут</span></div><h1>Естігеннің бәрі рас па?</h1><p>Медиасауаттылық</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Естігеннің бәрі рас па?» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Естігеннің бәрі рас бола бермейді. «Кім айтты?» деп сұраймыз. Мұғаліммен не қамқор ересекпен тексереміз.</p><p>Бүгінгі назарымыз: «Естігеннің бәрі рас па?». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Досың ертең сабақ жоқ дегенді естіді. Ойлану бағдары: Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p><div class=\"concepts\"><span>Факт</span><span>Пікір</span><span>Дереккөз</span><span>Контекст</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Алдымен тексеремін, содан кейін ғана бөлісемін.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Досың ертең сабақ жоқ дегенді естіді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Суретте ерекше оқиға көрсетілген.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Суреттің бастапқы контекстін, күнін және дереккөзін салыстыру.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">«Бұл ең жақсы кітап» деген сөзді оқыдың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Факт пен пікірді ажырату; қандай өлшем мен дәлел қажет екенін сұрау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Хабар сені қорқытып, бірден жіберуді сұрады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тоқтау; толық мәтін мен балама сенімді деректі оқу; асықпай шешу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Компьютер әдемі жауап жазды. Ол міндетті түрде рас па?</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Түпнұсқадан тексеру; табылмаған деректі факт деп бермеу; қатені түзету.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Ертең мектепте көрме болады» деген фактіні тексеру жолы мен «Бұл ең қызық көрме» пікірін салыстырыңдар. Нақты хабар деп қабылдамаңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ақпаратты тексеру картасын құрыңдар: автор, күн, түпнұсқа, өзге сенімді дерек, тарату шешімі. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Екі ойдан шығарылған хабардың бірін тексеріп, «Неге әзірге таратпаймын?» түсіндірмесін жасаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Факт пен пікірдің айырмасы қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Хабардың күнін неге қараймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Әдемі сурет дәлел бола ма? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>ЖИ жауабын қалай тексереміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Расталмаған ақпаратты неге таратпаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Мектептің ресми хабарын тексеру; расталмағанын таратпау.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Алдымен тексеремін, содан кейін ғана бөлісемін. Мектептің ресми хабарын тексеру; расталмағанын таратпау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Естігеннің бәрі рас па?»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Медиасауаттылық» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Досың ертең сабақ жоқ дегенді естіді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Алдымен тексеремін, содан кейін ғана бөлісемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Факт пен пікірдің айырмасы қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Әдемі сурет дәлел бола ма? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Расталмаған ақпаратты неге таратпаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Факт» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Алдымен тексеремін, содан кейін ғана бөлісемін.\"></textarea><label for=\"reflection-1\">«Естігеннің бәрі рас па?» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Алдымен тексеремін, содан кейін ғана бөлісемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t29\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><span class=\"muted\">Соңғы тақырып</span></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t30", "title": "Естігеннің бәрі рас па? | Тәрбие әлемі"}, "home": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><span>1-сынып</span></nav><section class=\"class-hero\"><div><span class=\"eyebrow\">30 тақырып · 150 жағдаят</span><h1>1-сыныптың<br>тәрбие қоржыны</h1><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p></div><span class=\"class-num\" aria-hidden=\"true\">01</span></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/home?section=classes\">← Басты бет</a><a class=\"btn\" href=\"#/home?section=library\">Барлық сыныптан іздеу</a></div><section class=\"filterbox\" aria-label=\"Материалды іздеу\"><label class=\"searchlabel\">Тақырып немесе кілт сөз<input id=\"search\" type=\"search\" placeholder=\"Мысалы: достық, рәміздер, қауіпсіздік…\"></label><label>Сынып<select i window.TARBIE_CATALOG=[{"id": "g01-t01", "grade": 1, "topic": 1, "title": "Шындықты айтамын", "direction": "Адал азамат", "icon": "✦", "search": "Шындықты айтамын Адал азамат «Шындықты айтамын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Адал бала шын айтады. Қателессе, оны түзетеді. Біреудің затын сұрап алады. Бүгінгі назарымыз: «Шындықты айтамын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Еденнен қарындаш таптың. Иесі оны іздеп жүр. Не істейсің? Ойлану бағдары: Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу. Еденнен қарындаш таптың. Иесі оны іздеп жүр. Не істейсің? Ойыншығыңды өзің сындырып алдың. Біреу басқа баланы кінәлады. Досыңа кітап әкелуге уәде бердің, бірақ ұмыттың. Екі бала сурет салды. Біреуі барлық мақтауды өзі алғысы келді. Үш балаға екі қарындаш қана бар. Қалай бөлісесіңдер?", "path": "#/lesson/g01-t01"}, {"id": "g01-t02", "grade": 1, "topic": 2, "title": "Таза сынып — жақсы әдет", "direction": "Таза Қазақстан", "icon": "♧", "search": "Таза сынып — жақсы әдет Таза Қазақстан «Таза сынып — жақсы әдет» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Таза сыныпта оқу жақсы. Қағазды жәшікке саламыз. Сынған шыныға тимейміз, ересекке айтамыз. Бүгінгі назарымыз: «Таза сынып — жақсы әдет». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Қағаз жерде жатыр. Қасында қоқыс жәшігі бар. Ойлану бағдары: Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру. Қағаз жерде жатыр. Қасында қоқыс жәшігі бар. Краннан су ағып тұр. Жабуға ересектен көмек сұрай аласың. Ауладан сынған шыны көрдің. Гүлді суардың. Досың сабағын жұлып ойнағысы келеді. Сурет қағазының бір жағы бос қалды.", "path": "#/lesson/g01-t02"}, {"id": "g01-t03", "grade": 1, "topic": 3, "title": "Ереже бізге көмектеседі", "direction": "Заң мен тәртіп", "icon": "⚖", "search": "Ереже бізге көмектеседі Заң мен тәртіп «Ереже бізге көмектеседі» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Ереже бірге ойнауға және қауіпсіз жүруге көмектеседі. Кезекті сақтаймыз. Түсінбесек, мұғалімнен сұраймыз. Бүгінгі назарымыз: «Ереже бізге көмектеседі». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Кезекте тұрсың. Досың алдыңа өтіп кетті. Ойлану бағдары: Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну. Кезекте тұрсың. Досың алдыңа өтіп кетті. Ойында бір бала ережені білмейді. Дәлізде жүгіруге досың шақырды. Сыныптағы белгі саған түсініксіз. Кітапты орнына қою ережесін ұмытып кеттің.", "path": "#/lesson/g01-t03"}, {"id": "g01-t04", "grade": 1, "topic": 4, "title": "Оюды танып үйренемін", "direction": "Ұлттық мұраны қорғайық", "icon": "❖", "search": "Оюды танып үйренемін Ұлттық мұраны қорғайық «Оюды танып үйренемін» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Домбыра, ою және ескі бұйым — мұраның бір бөлігі. Оларды ұқыпты ұстаймыз. Атауын білмесек, сұраймыз. Бүгінгі назарымыз: «Оюды танып үйренемін». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Мұражайдағы ескі бұйымды ұстап көргің келді. Ойлану бағдары: Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану. Мұражайдағы ескі бұйымды ұстап көргің келді. Оюлы бұйымның атауын білмейсің. Досың қазақша сөзді қате айтты. Басқа бала салған ою суретін өз атыңмен көрсеткің келді. Үлкен кісі ескі бұйымның тарихын айтқысы келеді.", "path": "#/lesson/g01-t04"}, {"id": "g01-t05", "grade": 1, "topic": 5, "title": "Досыма жылы сөз айтамын", "direction": "ДосболLIKE", "icon": "♡", "search": "Досыма жылы сөз айтамын ДосболLIKE «Досыма жылы сөз айтамын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Досымызды тыңдаймыз. Ойынға қосылуды ұсынамыз. Досымыз «жоқ» десе, сыйлаймыз. Бүгінгі назарымыз: «Досыма жылы сөз айтамын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Жаңа бала ойынға қосылмай тұр. Ойлану бағдары: Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу. Жаңа бала ойынға қосылмай тұр. Екі бала бір ойын таңдамады. Досың жалғыз отыр. Сөйлескісі келмеуі мүмкін. Досың саған ұнамайтын ойынға қатысуға шақырды. Топтық суретті бір бала ғана салып жатыр.", "path": "#/lesson/g01-t05"}, {"id": "g01-t06", "grade": 1, "topic": 6, "title": "Ренжісең, көмек сұра", "direction": "Буллингтің алдын алу", "icon": "☂", "search": "Ренжісең, көмек сұра Буллингтің алдын алу «Ренжісең, көмек сұра» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Баланы қайта-қайта ренжітуге болмайды. Ренжіген бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтамыз. Бүгінгі назарымыз: «Ренжісең, көмек сұра». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Бір баланы ойыннан күнде шығарып тастайды. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Бір баланы ойыннан күнде шығарып тастайды. Досыңды күнде ренжітеді. Ол айтуға қорқады. Бір баланы ренжіткенде өзгелер күліп тұр. Бала ештеңе айтқысы келмейді. Бірақ көңілсіз. Айтқан ересек сені тыңдамады.", "path": "#/lesson/g01-t06"}, {"id": "g01-t07", "grade": 1, "topic": 7, "title": "Экранда ренжітсе, ересекке айт", "direction": "Кибербуллингтің алдын алу", "icon": "▣", "search": "Экранда ренжітсе, ересекке айт Кибербуллингтің алдын алу «Экранда ренжітсе, ересекке айт» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Экрандағы сөз де ренжітуі мүмкін. Жаман хабарды басқаға жібермейміз. Сенімді ересекке көрсетеміз. Бүгінгі назарымыз: «Экранда ренжітсе, ересекке айт». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Ойындағы хабар сені ренжітті. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Ойындағы хабар сені ренжітті. Біреудің күлкілі суретін жіберуді сұрады. Біреу досыңның атымен жаман сөз жазды. Досың жағымсыз хабарды жасырып отыр. Бала ренжігенін айтты. Өзгелер «әзіл ғой» деді.", "path": "#/lesson/g01-t07"}, {"id": "g01-t08", "grade": 1, "topic": 8, "title": "Көп жерде ересекпен бірге боламын", "direction": "Қоғамдық ортадағы қауіпсіздік", "icon": "⌂", "search": "Көп жерде ересекпен бірге боламын Қоғамдық ортадағы қауіпсіздік «Көп жерде ересекпен бірге боламын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Көп жерде бірге келген ересектен алыстамаймыз. Адассақ, басқа жаққа жүгірмейміз. Қызметкерден көмек сұраймыз. Бүгінгі назарымыз: «Көп жерде ересекпен бірге боламын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Дүкенде бірге келген ересекті көрмей қалдың. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Дүкенде бірге келген ересекті көрмей қалдың. Таныс емес адам сені басқа жерге шақырды. Орындық астында белгісіз сөмке тұр. Есіктің алдына көп адам жиналды. Досың биік қоршауға шығуды ұсынды.", "path": "#/lesson/g01-t08"}, {"id": "g01-t09", "grade": 1, "topic": 9, "title": "Менің де, досымның да құқығы бар", "direction": "Құқықтық тәртіп", "icon": "⚑", "search": "Менің де, досымның да құқығы бар Құқықтық тәртіп «Менің де, досымның да құқығы бар» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Сен де, досың да сыйластыққа лайықсыңдар. Кезекпен сөйлейміз. Дау болса, ересектен көмек сұраймыз. Бүгінгі назарымыз: «Менің де, досымның да құқығы бар». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Сен сөйлегің келеді, досың да сөйлегісі келеді. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Сен сөйлегің келеді, досың да сөйлегісі келеді. Досың суретіңді сұрамай алды. Екі бала бір кітапты алғысы келеді. Ойында қате жасаған баланы демалуға жібермей қойды. Бала көмек сұрайтын ересекті білмейді.", "path": "#/lesson/g01-t09"}, {"id": "g01-t10", "grade": 1, "topic": 10, "title": "Білгенімді пайдалы іске жұмсаймын", "direction": "Білімім — Отаныма!", "icon": "☀", "search": "Білгенімді пайдалы іске жұмсаймын Білімім — Отаныма! «Білгенімді пайдалы іске жұмсаймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Білгенімізді пайдалы іске жұмсаймыз. Досқа түсінуге көмектесеміз. Ортақ кітапты ұқыпты ұстаймыз. Бүгінгі назарымыз: «Білгенімді пайдалы іске жұмсаймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Кітап бұрышындағы кітаптар араласып кетті. Ойлану бағдары: Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу. Кітап бұрышындағы кітаптар араласып кетті. Досың ережені түсінбеді. Сен түсіндіре аласың. Сынып гүліне су құю ұмытылды. Мектеп картасынан керек бөлмені таба алмадың. Пайдалы ісіңді досыңмен бөліскің келеді.", "path": "#/lesson/g01-t10"}, {"id": "g01-t11", "grade": 1, "topic": 11, "title": "Үлкенге сәлем беремін", "direction": "Қарттар күні", "icon": "✿", "search": "Үлкенге сәлем беремін Қарттар күні «Үлкенге сәлем беремін» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Үлкен кісіге сәлем береміз. Сөзін бөлмей тыңдаймыз. Көмек керек пе деп сұраймыз. Бүгінгі назарымыз: «Үлкенге сәлем беремін». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Үлкен кісі сөмкесін өзі ұстағысы келеді. Ойлану бағдары: Көмекті сыпайы ұсыну; бас тартуды құрметтеу. Үлкен кісі сөмкесін өзі ұстағысы келеді. Үлкен кісінің сөзін бала бөліп жіберді. Қонақты суретке түсіргің келеді. Досың барлық үлкен адам телефонды білмейді деді. Қонаққа орындық керек екенін байқадың.", "path": "#/lesson/g01-t11"}, {"id": "g01-t12", "grade": 1, "topic": 12, "title": "Ұстазыма алғыс айтамын", "direction": "Ұстаздар күні", "icon": "✎", "search": "Ұстазыма алғыс айтамын Ұстаздар күні «Ұстазыма алғыс айтамын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Ұстаз бізге үйренуге көмектеседі. Алғыс айтамыз. Сыйлықсыз да жылы сөзбен қуантамыз. Бүгінгі назарымыз: «Ұстазыма алғыс айтамын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Мұғалімге жылы сөз айтқың келеді. Ойлану бағдары: Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау. Мұғалімге жылы сөз айтқың келеді. Сабақта сұрағың бар, бірақ айтуға ұяласың. Балалар мұғалім сөйлегенде шулап кетті. Бір бала алғыс суретін салғысы келмейді. Ұстаздың еңбегі туралы сурет жасайсың.", "path": "#/lesson/g01-t12"}, {"id": "g01-t13", "grade": 1, "topic": 13, "title": "Маған қамқор адамдар", "direction": "Отбасы күні", "icon": "⌂", "search": "Маған қамқор адамдар Отбасы күні «Маған қамқор адамдар» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Қамқор адамдар әртүрлі болады. Оларға жылы сөз айтамыз. Жасымызға сай қауіпсіз көмек жасаймыз. Бүгінгі назарымыз: «Маған қамқор адамдар». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Кітаптарың шашылып қалды. Ойлану бағдары: Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу. Кітаптарың шашылып қалды. Сен бір ойын, қамқор ересек басқа іс ұсынды. Отбасы суретін көрсеткің келмейді. Жақының тыныш демалғысы келеді. Досың басқа қамқор адаммен тұрады.", "path": "#/lesson/g01-t13"}, {"id": "g01-t14", "grade": 1, "topic": 14, "title": "Менің елім — Қазақстан", "direction": "Республика күні", "icon": "☀", "search": "Менің елім — Қазақстан Республика күні «Менің елім — Қазақстан» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Біздің еліміз — Қазақстан. Туған жерге қамқор боламыз. Ортақ затты бүлдірмейміз. Бүгінгі назарымыз: «Менің елім — Қазақстан». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Мерекеден соң қағаздар жерде қалды. Ойлану бағдары: Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау. Мерекеден соң қағаздар жерде қалды. Досың өз ауылы туралы айтып бергісі келеді. Саябақтағы орындыққа жазу жазуды ұсынды. Қонақ елің туралы сұрады. Барлық балаға ортақ суретте орын жетпеді.", "path": "#/lesson/g01-t14"}, {"id": "g01-t15", "grade": 1, "topic": 15, "title": "Теңгені танимын", "direction": "Ұлттық валюта — теңге", "icon": "₸", "search": "Теңгені танимын Ұлттық валюта — теңге «Теңгені танимын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Теңге — еліміздің ақшасы. Қажет зат пен қалаған зат бірдей емес. Сатып алуды ересекпен келісеміз. Бүгінгі назарымыз: «Теңгені танимын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Ойынға арналған қағаз ақшаң бір затқа ғана жетеді: су не ойыншық. Ойлану бағдары: Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау. Ойынға арналған қағаз ақшаң бір затқа ғана жетеді: су не ойыншық. Досың қымбат зат алмасаң ойнамаймын деді. Экрандағы сыйлық батырмасын басқың келді. Біреу үлкен адамның телефон кодын сұрады. Екі заттың бағасы әртүрлі, қызметі ұқсас.", "path": "#/lesson/g01-t15"}, {"id": "g01-t16", "grade": 1, "topic": 16, "title": "Туымызды танимын", "direction": "Мемлекеттік рәміздер", "icon": "☀", "search": "Туымызды танимын Мемлекеттік рәміздер «Туымызды танимын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Ту, Елтаңба және Әнұран — мемлекеттік рәміздер. Оларды құрметтейміз. Дұрыс бейнесін мұғаліммен бірге қараймыз. Бүгінгі назарымыз: «Туымызды танимын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Екі суреттің қайсысы Ту екенін білмедің. Ойлану бағдары: Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау. Екі суреттің қайсысы Ту екенін білмедің. Әнұранды тыңдағанда не істеуді білмейсің. Тудың бөліктері туралы сұрағың бар. Рәміз салынған қағаз еденде жатыр. Қонақ Ту мен Елтаңбаны сұрады.", "path": "#/lesson/g01-t16"}, {"id": "g01-t17", "grade": 1, "topic": 17, "title": "Тәуелсіз елімнің баласымын", "direction": "Тәуелсіздік күні", "icon": "✦", "search": "Тәуелсіз елімнің баласымын Тәуелсіздік күні «Тәуелсіз елімнің баласымын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Қазақстан — тәуелсіз ел. Бейбіт күнді бағалаймыз. Бір-бірімізді сыйлап, пайдалы іс жасаймыз. Бүгінгі назарымыз: «Тәуелсіз елімнің баласымын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Мерекелік суретке ортақ гүлді жұлу ұсынылды. Ойлану бағдары: Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету. Мерекелік суретке ортақ гүлді жұлу ұсынылды. Екі бала ел туралы әртүрлі жақсы ой айтты. Кітаптағы дата саған түсініксіз. Мерекеге досың да қатысқысы келеді. Еліңе қандай жақсы іс жасай аласың?", "path": "#/lesson/g01-t17"}, {"id": "g01-t18", "grade": 1, "topic": 18, "title": "Әр мамандық пайдалы", "direction": "Мамандық таңдау және еңбек", "icon": "⚙", "search": "Әр мамандық пайдалы Мамандық таңдау және еңбек «Әр мамандық пайдалы» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Әр мамандықтың пайдалы ісі бар. Адамдардың еңбегін сыйлаймыз. Қызық істі қауіпсіз байқап көреміз. Бүгінгі назарымыз: «Әр мамандық пайдалы». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Досың тазалық қызметкерінің жұмысын бағаламады. Ойлану бағдары: Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу. Досың тазалық қызметкерінің жұмысын бағаламады. Саған сурет салу ұнайды, досыңа құрастыру ұнайды. Біреу бұл жұмыс тек ұлдарға не қыздарға деді. Жаңа құралды бірден қолданғың келді. Кәсіп туралы сұрағың бар.", "path": "#/lesson/g01-t18"}, {"id": "g01-t19", "grade": 1, "topic": 19, "title": "Экранда рұқсат сұраймын", "direction": "Интернеттегі қауіпсіздік", "icon": "▤", "search": "Экранда рұқсат сұраймын Интернеттегі қауіпсіздік «Экранда рұқсат сұраймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Құпия кодты ешкімге айтпаймыз. Бейтаныс батырманы баспаймыз. Күмәнді хабарды ересекке көрсетеміз. Бүгінгі назарымыз: «Экранда рұқсат сұраймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Ойын сенен үй мекенжайын сұрады. Ойлану бағдары: Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Ойын сенен үй мекенжайын сұрады. Экранда «сыйлық ұттың» деген батырма шықты. Досың үлкен адамның құпия кодын сұрады. Ойын сені камераны қосуға шақырды. Бейтаныс адам өзімен кездесуге шақырды.", "path": "#/lesson/g01-t19"}, {"id": "g01-t20", "grade": 1, "topic": 20, "title": "Рақмет айта білемін", "direction": "Алғыс айту күні", "icon": "✿", "search": "Рақмет айта білемін Алғыс айту күні «Рақмет айта білемін» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Көмекті байқап, рақмет айтамыз. Алғыс үшін сыйлық міндетті емес. Жылы сөз бен жақсы іс те маңызды. Бүгінгі назарымыз: «Рақмет айта білемін». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Досың түсіп қалған кітабыңды берді. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету. Досың түсіп қалған кітабыңды берді. Мектеп еденін таза ұстайтын адамға рақмет айтқың келеді. Досың көмектесті, енді сенен ойыншығыңды талап етті. Бала рақметті дауыстап айтқысы келмеді. Алғыс суретін бірге жасайсыңдар.", "path": "#/lesson/g01-t20"}, {"id": "g01-t21", "grade": 1, "topic": 21, "title": "Қамқор жанға жылы сөз", "direction": "Аналар мерекесі", "icon": "❀", "search": "Қамқор жанға жылы сөз Аналар мерекесі «Қамқор жанға жылы сөз» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Анаға не қамқор адамға алғыс айтамыз. Көмекті бірге бөлісеміз. Жеке суретті көрсетпес бұрын рұқсат сұраймыз. Бүгінгі назарымыз: «Қамқор жанға жылы сөз». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Қамқор адамың шаршады. Кітаптарыңды өзің жинай аласың. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Қамқор адамың шаршады. Кітаптарыңды өзің жинай аласың. Ашықхатты анаңнан басқа қамқор адамға бергің келеді. Сыйлық сатып ала алмайсың. Біреу үйдегі көмекті тек қыздар атқарады деді. Қамқор адамның фотосын көрсеткің келеді.", "path": "#/lesson/g01-t21"}, {"id": "g01-t22", "grade": 1, "topic": 22, "title": "Әр адамды сыйлаймын", "direction": "Конституция күні", "icon": "⚖", "search": "Әр адамды сыйлаймын Конституция күні «Әр адамды сыйлаймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Конституция — еліміздің негізгі заңы. Әр адамға құрметпен қараймыз. Өзгенің сөзін тыңдаймыз. Бүгінгі назарымыз: «Әр адамды сыйлаймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Бір бала ойынға қатысқысы келеді, бірақ оған кезек бермеді. Ойлану бағдары: Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Бір бала ойынға қатысқысы келеді, бірақ оған кезек бермеді. Сенің де, досыңның да ойы бар. Ереже туралы сұрағың бар. Көмек керек балаға түсінікті белгі жасайсың. Бала сұрақ қоюдан қорқады.", "path": "#/lesson/g01-t22"}, {"id": "g01-t23", "grade": 1, "topic": 23, "title": "Наурыздағы ізгі тілек", "direction": "Наурыз мерекесі", "icon": "❖", "search": "Наурыздағы ізгі тілек Наурыз мерекесі «Наурыздағы ізгі тілек» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Наурызда ізгі тілек айтамыз. Дәстүрді танып үйренеміз. Мерекеде бір-бірімізді сыйлаймыз. Бүгінгі назарымыз: «Наурыздағы ізгі тілек». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Досың бір дәстүрді білмейді. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Досың бір дәстүрді білмейді. Ойынға қатысу үшін қымбат киім керек деді. Дәмнен бұрын қолыңды жуу керек. Мерекеден соң көп қағаз қалды. Екі бала ойынның кезегіне келіспеді.", "path": "#/lesson/g01-t23"}, {"id": "g01-t24", "grade": 1, "topic": 24, "title": "Бейбіт күнге қамқормын", "direction": "Отан қорғаушылар күні", "icon": "⚑", "search": "Бейбіт күнге қамқормын Отан қорғаушылар күні «Бейбіт күнге қамқормын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Бейбіт өмірді бағалаймыз. Батыл болу — қауіпті іске бару емес. Қауіп байқасақ, ересекке айтамыз. Бүгінгі назарымыз: «Бейбіт күнге қамқормын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Досың биікке шығуды батылдық деді. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Досың биікке шығуды батылдық деді. Көмек керек адамды байқадың. Біреу қорғаушы тек ұл болады деді. Белгісіз затты ойыншық деп ойладың. Мерекеге жылы тілек жазғың келеді.", "path": "#/lesson/g01-t24"}, {"id": "g01-t25", "grade": 1, "topic": 25, "title": "Бәріміз бірге ойнаймыз", "direction": "Қазақстан халқының бірлігі", "icon": "◉", "search": "Бәріміз бірге ойнаймыз Қазақстан халқының бірлігі «Бәріміз бірге ойнаймыз» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Бәріміздің қызығушылығымыз әртүрлі. Бір-бірімізге күлмейміз. Ортақ іске бірге қатысамыз. Бүгінгі назарымыз: «Бәріміз бірге ойнаймыз». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Бала сөзді басқаша айтады. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Бала сөзді басқаша айтады. Жаңа бала ойын ережесін білмейді. Әр баланың сүйікті асы әртүрлі. Бір суретке бәріңнің ойың сыймай қалды. Досың бір топ туралы жаман сөз естіді.", "path": "#/lesson/g01-t25"}, {"id": "g01-t26", "grade": 1, "topic": 26, "title": "Көмекті рұқсатпен ұсынамын", "direction": "Волонтерлік және қайырымдылық", "icon": "♡", "search": "Көмекті рұқсатпен ұсынамын Волонтерлік және қайырымдылық «Көмекті рұқсатпен ұсынамын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Көмек керек пе деп сұраймыз. Көмектесуді өзіміз таңдаймыз. Ауыр не қауіпті жұмысты ересекке қалдырамыз. Бүгінгі назарымыз: «Көмекті рұқсатпен ұсынамын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Досыңа көмектескің келеді, ол өзі істегісі келеді. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау. Досыңа көмектескің келеді, ол өзі істегісі келеді. Бір бала ізгі іске қатысқысы келмеді. Көмек алған досыңды суретке түсіргің келеді. Ауыр затты жалғыз көтеруді ұсынды. Көмек үшін қағаз кітап белгісін жасайсың.", "path": "#/lesson/g01-t26"}, {"id": "g01-t27", "grade": 1, "topic": 27, "title": "Демаламын және қимылдаймын", "direction": "Денсаулық және пайдалы әдеттер", "icon": "♧", "search": "Демаламын және қимылдаймын Денсаулық және пайдалы әдеттер «Демаламын және қимылдаймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Оқу арасында демаламыз. Өзімізге қолайлы қимыл жасаймыз. Жайсыз болсақ, ересекке айтамыз. Бүгінгі назарымыз: «Демаламын және қимылдаймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Ұзақ отырып шаршадың. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Ұзақ отырып шаршадың. Кешке ойын қызық болып, ұйықтау уақыты келді. Досың қиын қимылды қайталауды ұсынды. Экранда сиқырлы сусын туралы сурет шықты. Өзіңді жайсыз сезіндің.", "path": "#/lesson/g01-t27"}, {"id": "g01-t28", "grade": 1, "topic": 28, "title": "Жолды ересекпен өтемін", "direction": "Жолдағы қауіпсіздік", "icon": "↔", "search": "Жолды ересекпен өтемін Жолдағы қауіпсіздік «Жолды ересекпен өтемін» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Жолды белгіленген жерден ересекпен өтеміз. Асықпаймыз. Телефонға алаңдамаймыз. Бүгінгі назарымыз: «Жолды ересекпен өтемін». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Досың жолдан қысқа жермен жүгіріп өтпек. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Досың жолдан қысқа жермен жүгіріп өтпек. Жолда телефондағы суретке қарайсың. Үлкен көліктің артынан жол көрінбейді. Кешкі уақытта қараңғы болды. Бағдаршам түсін білмей қалдың.", "path": "#/lesson/g01-t28"}, {"id": "g01-t29", "grade": 1, "topic": 29, "title": "Рұқсат сұраймын", "direction": "Жеке шекара және өзара құрмет", "icon": "☂", "search": "Рұқсат сұраймын Жеке шекара және өзара құрмет «Рұқсат сұраймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Затты аларда рұқсат сұраймыз. «Жоқ» деген жауапты сыйлаймыз. Қорықсақ, сенімді ересекке айтамыз. Бүгінгі назарымыз: «Рұқсат сұраймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Біреу сөмкеңді сұрамай ашты. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Біреу сөмкеңді сұрамай ашты. Құшақтасқың келмейді. Досың «жоқ десең ойнамаймын» деді. Бір бала сенің шекараңды білмей қалды. Бір жағдай саған ұнамады, бірақ айту қиын.", "path": "#/lesson/g01-t29"}, {"id": "g01-t30", "grade": 1, "topic": 30, "title": "Естігеннің бәрі рас па?", "direction": "Медиасауаттылық", "icon": "⌕", "search": "Естігеннің бәрі рас па? Медиасауаттылық «Естігеннің бәрі рас па?» тақырыбында бір пайдалы әрекетті таңдау және көрсету. Естігеннің бәрі рас бола бермейді. «Кім айтты?» деп сұраймыз. Мұғаліммен не қамқор ересекпен тексереміз. Бүгінгі назарымыз: «Естігеннің бәрі рас па?». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың. Өмірлік мысал: Досың ертең сабақ жоқ дегенді естіді. Ойлану бағдары: Мектептің ресми хабарын тексеру; расталмағанын таратпау. Досың ертең сабақ жоқ дегенді естіді. Суретте ерекше оқиға көрсетілген. «Бұл ең жақсы кітап» деген сөзді оқыдың. Хабар сені қорқытып, бірден жіберуді сұрады. Компьютер әдемі жауап жазды. Ол міндетті түрде рас па?", "path": "#/lesson/g01-t30"}];

$('#pagination').innerHTML=found.length?`<button id="prev-page" type="button" ${pageIndex===0?'disabled':''}>← Алдыңғы</button><span class="muted">${pageIndex+1} / ${total}</span><button id="next-page" type="button" ${pageIndex>=total-1?'disabled':''}>Келесі →</button>`:'';
if($('#prev-page'))$('#prev-page').onclick=()=>{pageIndex--;render();};if($('#next-page'))$('#next-page').onclick=()=>{pageIndex++;render();};}
[search,grade,direction,view].forEach(e=>e.addEventListener(e===search?'input':'change',()=>{pageIndex=0;render();}));
$('#reset-filter').onclick=()=>{search.value='';grade.value=page==='grade'?body.dataset.grade:'';direction.value='';view.value='all';pageIndex=0;render();};
if($('#clear-marks'))$('#clear-marks').onclick=()=>{marks={favorites:[],viewed:[]};saveMarks();render();toast('Таңдаулы мен қаралған белгілер тазаланды.');};render();
}
if(page==='lesson'){
const id=body.dataset.lesson;const tabs=$$('[role=tab]'),panels=$$('.tab-panel');
function activate(key,focus=false){const target=tabs.find(t=>t.dataset.tab===key)||tabs[0];tabs.forEach(t=>{const active=t===target;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;});panels.forEach(p=>p.hidden=p.id!==target.getAttribute('aria-controls'));if(focus)target.focus();}
tabs.forEach((tab,i)=>{tab.onclick=()=>{activate(tab.dataset.tab);window.setSingleTab(tab.dataset.tab);};tab.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();activate(tabs[n].dataset.tab,true);window.setSingleTab(tabs[n].dataset.tab);};});activate(window.SINGLE_TAB||'intro');
function updateMarks(){const fav=marks.favorites.includes(id),seen=marks.viewed.includes(id);$('#favorite').textContent=fav?'★ Таңдаулыдан алу':'☆ Таңдаулыға қосу';$('#favorite').setAttribute('aria-pressed',String(fav));$('#mark-viewed').textContent=seen?'✓ Қаралған белгісін алу':'○ Қаралды деп белгілеу';$('#mark-viewed').setAttribute('aria-pressed',String(seen));}

$$('.quiz-option').forEach(button=>button.onclick=()=>{const box=button.closest('.quiz');box.querySelectorAll('.quiz-option').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const correct=Number(button.dataset.option)===Number(box.dataset.correct),result=box.querySelector('.quiz-result');result.hidden=false;result.textContent=(correct?'Орынды жауап. ':'Бұл таңдауды қайта қара. ')+result.dataset.explanation;});

window.setSingleTab=function(tab){const [route,query='']=location.hash.replace(/^#\//,'').split('?');const p=new URLSearchParams(query);p.set('tab',tab);history.replaceState(null,'','#/'+route+'?'+p.toString());};
function routeSingle(){const [path,query='']=location.hash.replace(/^#\//,'').split('?');const page=SINGLE_PAGES[path]||SINGLE_PAGES.home;const params=new URLSearchParams(query);window.SINGLE_QUERY=query;window.SINGLE_TAB=params.get('tab')||'intro';window.onbeforeprint=null;document.body.dataset.page=page.kind;document.body.dataset.grade=page.grade;document.body.dataset.lesson=page.lesson;document.body.dataset.root='';document.getElementById('main').innerHTML=page.html;document.title=page.title;initializeTarbie();window.scrollTo(0,0);const section=params.get('section');if(section&&document.getElementById(section))document.getElementById(section).scrollIntoView();}
window.addEventListener('hashchange',routeSingle);routeSingle();
