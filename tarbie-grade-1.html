мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Жақсы тыңдау қалай байқалады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Досқа әрқашан келісу керек пе? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жаңа баланы қалай қосамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қолдау мен қысымның айырмасы қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Топта әркімнің пікірін қалай ескереміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Досымды тыңдаймын, оның таңдауын сыйлаймын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Досымды тыңдаймын, оның таңдауын сыйлаймын. Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Досыма жылы сөз айтамын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «ДосболLIKE» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Жаңа бала ойынға қосылмай тұр.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Досымды тыңдаймын, оның таңдауын сыйлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Жақсы тыңдау қалай байқалады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жаңа баланы қалай қосамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Топта әркімнің пікірін қалай ескереміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Достық» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Досымды тыңдаймын, оның таңдауын сыйлаймын.\"></textarea><label for=\"reflection-1\">«Досыма жылы сөз айтамын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Досымды тыңдаймын, оның таңдауын сыйлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t04\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t06\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t05", "title": "Досыма жылы сөз айтамын | Тәрбие әлемі"}, "lesson/g01-t06": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Буллингтің алдын алу</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☂</span><span>1-сынып · 06/30 · 40 минут</span></div><h1>Ренжісең, көмек сұра</h1><p>Буллингтің алдын алу</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Ренжісең, көмек сұра» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Баланы қайта-қайта ренжітуге болмайды. Ренжіген бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтамыз.</p><p>Бүгінгі назарымыз: «Ренжісең, көмек сұра». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Бір баланы ойыннан күнде шығарып тастайды. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</p><div class=\"concepts\"><span>Қолдау</span><span>Қауіпсіздік</span><span>Куәгер</span><span>Сенімді ересек</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Бір баланы ойыннан күнде шығарып тастайды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Досыңды күнде ренжітеді. Ол айтуға қорқады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қасында болуды ұсыну; сенімді ересекке жеке хабарлау; қауіпсіздік жоспарын ересек ұйымдастырады.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Бір баланы ренжіткенде өзгелер күліп тұр.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолпаштауды тоқтату; қарсы күш қолданбау; қауіпсіз қолдау және хабарлау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Бала ештеңе айтқысы келмейді. Бірақ көңілсіз.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жеке тәжірибені айтқызбау; жеке сөйлесуді ұсыну; қажет деректі тек жауапты ересекке беру.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Айтқан ересек сені тыңдамады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Басқа сенімді ересекке, сынып жетекшісіне не мектеп әкімшілігіне қайта айту; көмекті жалғастыру.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Мен сені тыңдаймын», «Сен кінәлі емессің», «Сенімді ересекке бірге барайық» қолдау сөздерінің қай кезде айтылатынын талқылаңдар. Қудалауды сахналамаңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Қауіпсіз көмек картасын жасаңыздар: қауіпсіз орын, мектептегі екі жауапты ересек рөлі, хабарлау және қайта хабарлау жолы. Нақты оқушы атын жазбаңдар. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Көмек сұрау — дұрыс қадам» постерін жасаңыздар. Жәбірленушіні бейнелеп масқаралайтын сурет қоспаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қолдау неге маңызды? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қай әрекет жағдайды ушықтырады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Куәгер қауіпсіз қалай көмектеседі? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Кімге хабарлауға болады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Алғашқы көмек нәтиже бермесе не істейміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады. Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Ренжісең, көмек сұра»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Буллингтің алдын алу» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Бір баланы ойыннан күнде шығарып тастайды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қолдау неге маңызды? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Куәгер қауіпсіз қалай көмектеседі? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Алғашқы көмек нәтиже бермесе не істейміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Қолдау» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.\"></textarea><label for=\"reflection-1\">«Ренжісең, көмек сұра» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қудалауды сахналамаңыз; кінә артпаңыз; қолдау мен сенімді ересекке жүгінуді ғана жаттықтырыңыз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://www.unicef.org/kazakhstan/kk/%D0%BA%D0%B8%D0%B1%D0%B5%D1%80%D0%B1%D1%83%D0%BB%D0%BB%D0%B8%D0%BD%D0%B3%D1%82%D0%B5%D0%BD-%D2%9B%D0%B0%D0%BB%D0%B0%D0%B9-%D2%9B%D0%BE%D1%80%D2%93%D0%B0%D0%BD%D1%83%D2%93%D0%B0-%D0%B1%D0%BE%D0%BB%D0%B0%D0%B4%D1%8B\" target=\"_blank\" rel=\"noopener noreferrer\">Кибербуллингтен қалай қорғануға болады?</a> · UNICEF Қазақстан / БҰҰДБ. Қазақша беті ашылып, қолдау және көмек сұрау материалы тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t05\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t07\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t06", "title": "Ренжісең, көмек сұра | Тәрбие әлемі"}, "lesson/g01-t07": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Кибербуллингтің алдын алу</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>▣</span><span>1-сынып · 07/30 · 40 минут</span></div><h1>Экранда ренжітсе, ересекке айт</h1><p>Кибербуллингтің алдын алу</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Экранда ренжітсе, ересекке айт» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Экрандағы сөз де ренжітуі мүмкін. Жаман хабарды басқаға жібермейміз. Сенімді ересекке көрсетеміз.</p><p>Бүгінгі назарымыз: «Экранда ренжітсе, ересекке айт». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Ойындағы хабар сені ренжітті. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</p><div class=\"concepts\"><span>Кибербуллинг</span><span>Шағым</span><span>Бұғаттау</span><span>Қолдау</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Ойындағы хабар сені ренжітті.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Біреудің күлкілі суретін жіберуді сұрады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Контентті көбейтпеу; адамды қолдау; ересекке не платформаға хабарлау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Біреу досыңның атымен жаман сөз жазды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Аккаунтпен дауласпау; жалғандықты жауапты ересекпен тіркеу; шағым беру.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Досың жағымсыз хабарды жасырып отыр.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кінәламау; тыңдау; сенімді ересекпен жеке сөйлесуге қолдау беру.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Бала ренжігенін айтты. Өзгелер «әзіл ғой» деді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әсерін мойындау; қайта таратпау; қауіпсіздіктің қалпына келуін ересекпен қадағалау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ойдан шығарылған чат үшін қолдау хабарын жазыңдар: кінәламау, таратпау, ересекке жүгіну. Шынайы хатты ашпаңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Көрдім — таратпадым — қолдадым — хабарладым» төрт қадамдық карта құрыңдар. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Қолдау хабарлары бар қағаз чат-комикс жасаңыздар; қорлау сөздерін қоспаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Ренжітетін хабарды неге таратпаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қауіпсіз қолдау сөзі қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Шағым мен бұғаттау не үшін керек? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Көмек сұрауға не кедергі болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қауіпсіздік қалпына келгенін қалай білеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын. Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Экранда ренжітсе, ересекке айт»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Кибербуллингтің алдын алу» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Ойындағы хабар сені ренжітті.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Ренжітетін хабарды неге таратпаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Шағым мен бұғаттау не үшін керек? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қауіпсіздік қалпына келгенін қалай білеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Кибербуллинг» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Экранда ренжітсе, ересекке айт» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қудалауды сахналамаңыз; кінә артпаңыз; қолдау мен сенімді ересекке жүгінуді ғана жаттықтырыңыз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://www.unicef.org/kazakhstan/kk/%D0%BA%D0%B8%D0%B1%D0%B5%D1%80%D0%B1%D1%83%D0%BB%D0%BB%D0%B8%D0%BD%D0%B3%D1%82%D0%B5%D0%BD-%D2%9B%D0%B0%D0%BB%D0%B0%D0%B9-%D2%9B%D0%BE%D1%80%D2%93%D0%B0%D0%BD%D1%83%D2%93%D0%B0-%D0%B1%D0%BE%D0%BB%D0%B0%D0%B4%D1%8B\" target=\"_blank\" rel=\"noopener noreferrer\">Кибербуллингтен қалай қорғануға болады?</a> · UNICEF Қазақстан / БҰҰДБ. Қазақша беті ашылып, қолдау және көмек сұрау материалы тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t06\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t08\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t07", "title": "Экранда ренжітсе, ересекке айт | Тәрбие әлемі"}, "lesson/g01-t08": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Қоғамдық ортадағы қауіпсіздік</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⌂</span><span>1-сынып · 08/30 · 40 минут</span></div><h1>Көп жерде ересекпен бірге боламын</h1><p>Қоғамдық ортадағы қауіпсіздік</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Көп жерде ересекпен бірге боламын» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Көп жерде бірге келген ересектен алыстамаймыз. Адассақ, басқа жаққа жүгірмейміз. Қызметкерден көмек сұраймыз.</p><p>Бүгінгі назарымыз: «Көп жерде ересекпен бірге боламын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Дүкенде бірге келген ересекті көрмей қалдың. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</p><div class=\"concepts\"><span>Кездесу орны</span><span>Қауіп</span><span>Көмек</span><span>Жауапты қызметкер</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Дүкенде бірге келген ересекті көрмей қалдың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Таныс емес адам сені басқа жерге шақырды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Еріп кетпеу; сенімді ересекке не ресми қызметкерге айту; тұлғаны жауапты адам арқылы тексеру.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Орындық астында белгісіз сөмке тұр.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тиіспеу; қауіпсіз қашықтық сақтау; жауапты қызметкерге хабарлау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Есіктің алдына көп адам жиналды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Итермелеуге қосылмау; жауапты ересекке айту; шығу жолын бос ұстауды келісу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Досың биік қоршауға шығуды ұсынды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бас тарту; қауіпсіз балама табу; рұқсатсыз орынға кірмеу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Адастым — қауіпсіз жер — жауапты қызметкер — байланыс» картасын қағазда реттеңдер. Жеке телефон нөмірін жазбаңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ойдан шығарылған мектеп көрмесіне қауіпсіз бағыт пен кездесу орнының сызбасын жасаңдар. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Көмек сұрайтын бір сөйлем» карточкасын дайындаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Кездесу орнын не үшін келісеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Көмекті кімнен сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Иесіз затты неге ұстамаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қауіпті ұсынысқа қалай бас тартамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Топта қауіпсіздікке қалай үлес қосамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын. Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Көп жерде ересекпен бірге боламын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Қоғамдық ортадағы қауіпсіздік» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Дүкенде бірге келген ересекті көрмей қалдың.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Кездесу орнын не үшін келісеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Иесіз затты неге ұстамаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Топта қауіпсіздікке қалай үлес қосамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Кездесу орны» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.\"></textarea><label for=\"reflection-1\">«Көп жерде ересекпен бірге боламын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t07\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t09\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t08", "title": "Көп жерде ересекпен бірге боламын | Тәрбие әлемі"}, "lesson/g01-t09": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Құқықтық тәртіп</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⚑</span><span>1-сынып · 09/30 · 40 минут</span></div><h1>Менің де, досымның да құқығы бар</h1><p>Құқықтық тәртіп</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Менің де, досымның да құқығы бар» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Сен де, досың да сыйластыққа лайықсыңдар. Кезекпен сөйлейміз. Дау болса, ересектен көмек сұраймыз.</p><p>Бүгінгі назарымыз: «Менің де, досымның да құқығы бар». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Сен сөйлегің келеді, досың да сөйлегісі келеді. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</p><div class=\"concepts\"><span>Құқық</span><span>Міндет</span><span>Қадір-қасиет</span><span>Бейбіт шешім</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Сен сөйлегің келеді, досың да сөйлегісі келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Досың суретіңді сұрамай алды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсат сұрау; жеке деректі таратпау; бұзылған шекараны түзету.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Екі бала бір кітапты алғысы келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әр тараптың қажетін тыңдау; кезек не ортақ пайдалану келісімін табу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Ойында қате жасаған баланы демалуға жібермей қойды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Міндет бұзылуын түзету мен негізгі құқықтарды ажырату; адамды қолдаудан айырмау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Бала көмек сұрайтын ересекті білмейді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мұғалім, сынып жетекшісі, мектеп әкімшілігі арқылы қауіпсіз көмек пен қарау жолын нақтылау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Бірі өтініш айтады, екіншісі өзгенің қажетін қайталап, бейбіт шешім ұсынады. Мысал: ортақ кітапты пайдалану. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Мәселе — әр тараптың қажеті — келісім — қайта қарау» бейбіт шешім картасын жасаңдар. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Құқық пен міндет байланысын көрсететін екі бағанды постер әзірлеңдер. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Өзгенің сөзін тыңдау неге қажет? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Құқық пен міндет қалай байланысады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жеке мәліметті неге қорғау керек? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Дауда екі тарапты қалай тыңдаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Көмек сұрау жолын қайдан білеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын. Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Менің де, досымның да құқығы бар»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Құқықтық тәртіп» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Сен сөйлегің келеді, досың да сөйлегісі келеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Өзгенің сөзін тыңдау неге қажет? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жеке мәліметті неге қорғау керек? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Көмек сұрау жолын қайдан білеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Құқық» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.\"></textarea><label for=\"reflection-1\">«Менің де, досымның да құқығы бар» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z020000345_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы баланың құқықтары туралы</a> · Әділет АҚЖ. Мәтіні ашылды; сабақтағы құқықтық мәдениетке жалпы тірек. Жеке жағдайға құқықтық кеңес емес. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t08\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t10\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t09", "title": "Менің де, досымның да құқығы бар | Тәрбие әлемі"}, "lesson/g01-t10": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Білімім — Отаныма!</span></nav><section class=\"lesson-head\"><
