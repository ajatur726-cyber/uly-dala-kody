ір сөзбен, суретпен не ауызша жауап бер.</li><li>Қымбат затсыз мереке бола ма? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ысырапты қалай азайтамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Наурыз» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.\"></textarea><label for=\"reflection-1\">«Наурыздағы ізгі тілек» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t22\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t24\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t23", "title": "Наурыздағы ізгі тілек | Тәрбие әлемі"}, "lesson/g01-t24": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Отан қорғаушылар күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⚑</span><span>1-сынып · 24/30 · 40 минут</span></div><h1>Бейбіт күнге қамқормын</h1><p>Отан қорғаушылар күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Бейбіт күнге қамқормын» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Бейбіт өмірді бағалаймыз. Батыл болу — қауіпті іске бару емес. Қауіп байқасақ, ересекке айтамыз.</p><p>Бүгінгі назарымыз: «Бейбіт күнге қамқормын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Досың биікке шығуды батылдық деді. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</p><div class=\"concepts\"><span>Бейбітшілік</span><span>Қызмет</span><span>Батылдық</span><span>Қамқорлық</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 7 мамыр</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Досың биікке шығуды батылдық деді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Көмек керек адамды байқадың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қызметтің түрлі рөлін ұсыну; қауіпсіз ақпараттық не ұйымдастыру көмегі.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Біреу қорғаушы тек ұл болады деді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әр адамның бейбіт еңбек пен қамқорлық арқылы үлес қоса алатынын көрсету.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Белгісіз затты ойыншық деп ойладың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тиіспеу; ересекке хабарлау; тек қауіпсіз бейне не қағаз материал қолдану.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Мерекеге жылы тілек жазғың келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бейбіт қызмет туралы жалпы сұрақ; құпия дерексіз және келісіммен жұмыс.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Батыл таңдау — қауіпсіз әрекет» карточкаларын құрыңдар: бас тарту, көмек сұрау, қолдау. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Бейбіт өмірге пайдалы қауіпсіз бастама жоспарлаңдар: ақпараттық белгі, қолжетімділік немесе ортақ мүлікке қамқорлық. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Бейбіт күнге менің тілегім» ашықхатын жасаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Батылдық пен тәуекелдің айырмасы қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Отанға қызметтің қандай жолдары бар? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Көмекті қалай қауіпсіз ұсынамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Неге қауіпті жаттығу жасамаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Бейбіт өмірге өз үлесіміз қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін. Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Бейбіт күнге қамқормын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Отан қорғаушылар күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Досың биікке шығуды батылдық деді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Батылдық пен тәуекелдің айырмасы қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Көмекті қалай қауіпсіз ұсынамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Бейбіт өмірге өз үлесіміз қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Бейбітшілік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.\"></textarea><label for=\"reflection-1\">«Бейбіт күнге қамқормын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t23\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t25\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t24", "title": "Бейбіт күнге қамқормын | Тәрбие әлемі"}, "lesson/g01-t25": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Қазақстан халқының бірлігі</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>◉</span><span>1-сынып · 25/30 · 40 минут</span></div><h1>Бәріміз бірге ойнаймыз</h1><p>Қазақстан халқының бірлігі</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Бәріміз бірге ойнаймыз» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Бәріміздің қызығушылығымыз әртүрлі. Бір-бірімізге күлмейміз. Ортақ іске бірге қатысамыз.</p><p>Бүгінгі назарымыз: «Бәріміз бірге ойнаймыз». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Бала сөзді басқаша айтады. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</p><div class=\"concepts\"><span>Бірлік</span><span>Әртүрлілік</span><span>Тең қатысу</span><span>Ортақ мақсат</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 1 мамыр</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Бала сөзді басқаша айтады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Жаңа бала ойын ережесін білмейді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Түсінікті ереже мен таныстыру; жаңа адамға қолжетімді рөл.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Әр баланың сүйікті асы әртүрлі.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Таңдау еркіндігі; дәстүрді міндеттемеу; әртүрлілікті құрметтеу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Бір суретке бәріңнің ойың сыймай қалды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көпшілік шешімде де әркімнің қажетін тыңдау; балама қатысу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Досың бір топ туралы жаман сөз естіді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Таратпау; дерек пен жалпылауды ажырату; адамды топ белгісімен айыптамау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Екі түрлі қызығушылықты бір ортақ іске біріктіріңдер: сурет салу мен кітап оқу, спорт пен ұйымдастыру. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Әркімге ашық ортақ іс» жобасын жасаңдар: тіл, орын, рөл және қатысу кедергілерін ескеріңдер. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Әртүрліміз, ортақ ісіміз бар» ұжымдық плакат эскизін жасаңыздар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Бірлік бірдей болуды білдіре ме? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Адамды топ белгісімен бағалау неге қате? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жаңа қатысушыны қалай қосамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Әр пікірді қалай тыңдаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ортақ мақсат қандай болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Айырмашылықты сыйлап, ортақ іске тең қатысамын. Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Бәріміз бірге ойнаймыз»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Қазақстан халқының бірлігі» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Бала сөзді басқаша айтады.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Бірлік бірдей болуды білдіре ме? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жаңа қатысушыны қалай қосамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ортақ мақсат қандай болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Бірлік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Айырмашылықты сыйлап, ортақ іске тең қатысамын.\"></textarea><label for=\"reflection-1\">«Бәріміз бірге ойнаймыз» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Айырмашылықты сыйлап, ортақ іске тең қатысамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t24\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t26\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t25", "title": "Бәріміз бірге ойнаймыз | Тәрбие әлемі"}, "lesson/g01-t26": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Волонтерлік және қайырымдылық</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>♡</span><span>1-сынып · 26/30 · 40 минут</span></div><h1>Көмекті рұқсатпен ұсынамын</h1><p>Волонтерлік және қайырымдылық</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Көмекті рұқсатпен ұсынамын» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Көмек керек пе деп сұраймыз. Көмектесуді өзіміз таңдаймыз. Ауыр не қауіпті жұмысты ересекке қалдырамыз.</p><p>Бүгінгі назарымыз: «Көмекті рұқсатпен ұсынамын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Досыңа көмектескің келеді, ол өзі істегісі келеді. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау.</p><div class=\"concepts\"><span>Еріктілік</span><span>Қажеттілік</span><span>Қадір-қасиет</span><span>Әсер</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Досыңа көмектескің келеді, ол өзі істегісі келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көмектің қажет екенін сұрау; бас тартуды сыйлау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Бір бала ізгі іске қатысқысы келмеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Еріктілікті сақтау; балама рөл; мәжбүрлемеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Көмек алған досыңды суретке түсіргің келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қадірін сақтау; келісімсіз фото мен жеке оқиғаны жарияламау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Ауыр затты жалғыз көтеруді ұсынды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз рөл; қауіпті міндеттен бас тарту; ересек бақылауы.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Көмек үшін қағаз кітап белгісін жасайсың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ақшасыз пайдалы әрекет; нақты өзгеріс пен алушы пікірін бағалау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Кімге не қажет? — қалай сұраймыз? — қауіпсіз не ұсына аламыз?» картасын ойдан шығарылған мысалмен толтырыңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көмектің қажет екенін сұрау; бас тартуды сыйлау. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ақша жинаусыз ерікті жоба құрыңдар: сұраныс, келісім, қауіпсіз әрекет, ресурс және нәтиже. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Көмек ұсынудың әдепті жолы» үш қадамдық нұсқаулық жасаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Көмектің қажет екенін қалай білеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Еріктілік нені білдіреді? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Неге жеке оқиғаны жарияламаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қандай көмек қауіпсіз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Пайданы ақшадан бөлек қалай өлшейміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Көмектің қажет екенін сұрау; бас тартуды сыйлау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын. Көмектің қажет екенін сұрау; бас тартуды сыйлау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Көмекті рұқсатпен ұсынамын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Волонтерлік және қайырымдылық» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Досыңа көмектескің келеді, ол өзі істегісі келеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Көмектің қажет екенін сұрау; бас тартуды сыйлау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Көмектің қажет екенін қалай білеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Неге жеке оқиғаны жарияламаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Пайданы ақшадан бөлек қалай өлшейміз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Еріктілік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.\"></textarea><label for=\"reflection-1\">«Көмекті рұқсатпен ұсынамын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t25\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t27\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t26", "title": "Көмекті рұқсатпен ұсынамын | Тәрбие әлемі"}, "lesson/g01-t27": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Денсаулық және пайдалы әдеттер</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>♧</span><span>1-сынып · 27/30 · 40 минут</span></div><h1>Демаламын және қимылдаймын</h1><p>Денсаулық және пайдалы әдеттер</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Демаламын және қимылдаймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Оқу арасында демаламыз. Өзімізге қолайлы қимыл жасаймыз. Жайсыз болсақ, ересекке айтамыз.</p><p>Бүгінгі назарымыз: «Демаламын және қимылдаймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Ұзақ отырып шаршадың. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p><div class=\"concepts\"><span>Әдет</span><span>Демалыс</span><span>Қозғалыс</span><span>Өзіне қамқорлық</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Ұзақ отырып шаршадың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Кешке ойын қызық болып, ұйықтау уақыты келді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Демалыс шекарасын келісу; байланыс уақытын алдын ала белгілеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Досың қиын қимылды қайталауды ұсынды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз балама; ауырсыну не жайсыздықта тоқтау; салыстырып бағаламау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Экранда сиқырлы сусын туралы сурет шықты.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тексерілмеген емге сенбеу; маманмен кеңесу; жарнаманы ажырату.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Өзіңді жайсыз сезіндің.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жайсыздықты ересекке айту; демалыс пен көмекке жағдай жасау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ойдан шығарылған оқушының күніне оқу, демалыс және қауіпсіз қозғалыс уақытын үйлестіріңдер. Нақты денсаулық дерегін жазбаңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Қолайлы үзіліс» картасын жасаңдар: отырып, тұрып не тыныш орындалатын үш балама. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Бір пайдалы әдет — бір шағын қадам» апталық жоспар эскизін құрыңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Демалыс неге қажет? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Өзіне қамқорлық қалай көрінеді? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Әркімге бірдей қимыл міндетті ме? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Денсаулық ақпаратын кіммен тексереміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жаңа әдетті кішкентай қадамнан қалай бастаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын. Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Демаламын және қимылдаймын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Денсаулық және пайдалы әдеттер» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Ұзақ отырып шаршадың.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Демалыс неге қажет? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Әркімге бірдей қимыл міндетті ме? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Жаңа әдетті кішкентай қадамнан қалай бастаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Әдет» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Демаламын және қимылдаймын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t26\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t28\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t27", "title": "Демаламын және қимылдаймын | Тәрбие әлемі"}, "lesson/g01-t28": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Жолдағы қауіпсіздік</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>↔</span><span>1-сынып · 28/30 · 40 минут</span></div><h1>Жолды ересекпен өтемін</h1><p>Жолдағы қауіпсіздік</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Жолды ересекпен өтемін» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Жолды белгіленген жерден ересекпен өтеміз. Асықпаймыз. Телефонға алаңдамаймыз.</p><p>Бүгінгі назарымыз: «Жолды ересекпен өтемін». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Досың жолдан қысқа жермен жүгіріп өтпек. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p><div class=\"concepts\"><span>Өткел</span><span>Бағдаршам</span><span>Назар</span><span>Қауіпсіз бағыт</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Досың жолдан қысқа жермен жүгіріп өтпек.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Жолда телефондағы суретке қарайсың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жолда экранға алаңдамау; тапсырманы қауіпсіз орында тоқтатып орындау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Үлкен көліктің артынан жол көрінбейді.</p><p>Екі әрекетт
