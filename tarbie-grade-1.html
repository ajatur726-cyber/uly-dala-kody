p>Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Ойын сенен үй мекенжайын сұрады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Экранда «сыйлық ұттың» деген батырма шықты.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Баспауды таңдау; домен мен ресми арнаны тексеру; код бермеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Досың үлкен адамның құпия кодын сұрады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Құпияны бөліспеу; әр аккаунтты бөлек қорғау; қосымша қорғауды ересекпен қарастыру.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Ойын сені камераны қосуға шақырды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсаттың қажеттілігін бағалау; күмәндісін бермеу; қауіпсіз балама таңдау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Бейтаныс адам өзімен кездесуге шақырды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Келісім бермеу; сенімді ересекке айту; жеке дерек не орын жібермеу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Нақты дерексіз қағаз аккаунтқа қауіпсіздік чек-парағын жасаңдар: жеке деректі азайту, күмәнді сілтемені тексеру, кодты қорғау. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ойдан шығарылған қолданбаның рұқсат картасын құрыңдар: қажет рұқсат, артық рұқсат және қауіпсіз балама. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Тоқта — тексер — ересекпен шеш» үш белгісін жасаңыздар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Жеке дерекке не жатады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Шұғыл хабар неге күмән тудыруы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Құпия кодты кімге бермейміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Рұқсат сұрауын қалай бағалаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Күмәнді әрекеттен кейін кімнен көмек сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін. Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Экранда рұқсат сұраймын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Интернеттегі қауіпсіздік» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Ойын сенен үй мекенжайын сұрады.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Жеке дерекке не жатады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Құпия кодты кімге бермейміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Күмәнді әрекеттен кейін кімнен көмек сұраймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Жеке дерек» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.\"></textarea><label for=\"reflection-1\">«Экранда рұқсат сұраймын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Құпияны бермеймін, күмәнді хабарды ресми арнадан тексеремін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t18\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t20\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t19", "title": "Экранда рұқсат сұраймын | Тәрбие әлемі"}, "lesson/g01-t20": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Алғыс айту күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>✿</span><span>1-сынып · 20/30 · 40 минут</span></div><h1>Рақмет айта білемін</h1><p>Алғыс айту күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Рақмет айта білемін» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Көмекті байқап, рақмет айтамыз. Алғыс үшін сыйлық міндетті емес. Жылы сөз бен жақсы іс те маңызды.</p><p>Бүгінгі назарымыз: «Рақмет айта білемін». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Досың түсіп қалған кітабыңды берді. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету.</p><div class=\"concepts\"><span>Алғыс</span><span>Көмек</span><span>Ықылас</span><span>Еріктілік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 1 наурыз</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Досың түсіп қалған кітабыңды берді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Нақты көмек пен әсерін атау; үлесті әділ көрсету.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Мектеп еденін таза ұстайтын адамға рақмет айтқың келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Байқалмайтын еңбекті де қамту; ешкімді міндетті жариялауға мәжбүрлемеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Досың көмектесті, енді сенен ойыншығыңды талап етті.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Алғыс пен мәжбүрлі міндетті ажырату; сыпайы бас тарту.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Бала рақметті дауыстап айтқысы келмеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жазба не жеке алғыс баламасын ұсыну; еріктілікті сақтау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Алғыс суретін бірге жасайсыңдар.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тегін, қолжетімді әрекет; қаржыға қарап бағаламау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Не істеді? — Маған не берді? — Рақмет» үлгісімен ойдан шығарылған көмекке екі алғыс сөйлемін құрыңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Нақты көмек пен әсерін атау; үлесті әділ көрсету. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Бір апталық «Байқалған ізгілік» картасын жасаңыздар. Адамдарды жарыстырмай, әрекет түрлерін жазыңдар. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Нақты көмекке арналған қысқа алғыс хатын немесе суретін дайындаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Шынайы алғыс қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қандай еңбек байқалмай қалады? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Алғыс міндетті сыйлық па? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Бас тарту мен ризашылық қатар бола ала ма? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ізгілікті қалай жалғастырамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Нақты көмек пен әсерін атау; үлесті әділ көрсету.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін. Нақты көмек пен әсерін атау; үлесті әділ көрсету.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Рақмет айта білемін»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Алғыс айту күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Досың түсіп қалған кітабыңды берді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Нақты көмек пен әсерін атау; үлесті әділ көрсету.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Шынайы алғыс қандай? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Алғыс міндетті сыйлық па? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ізгілікті қалай жалғастырамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Алғыс» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.\"></textarea><label for=\"reflection-1\">«Рақмет айта білемін» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Көмекті байқаймын, алғысты ерікті әрі шынайы білдіремін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/P1700000689\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелік күндердің тізбесі</a> · Әділет АҚЖ. Мәтіні ашылып, тиісті мерекелік күндер тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t19\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t21\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t20", "title": "Рақмет айта білемін | Тәрбие әлемі"}, "lesson/g01-t21": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Аналар мерекесі</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>❀</span><span>1-сынып · 21/30 · 40 минут</span></div><h1>Қамқор жанға жылы сөз</h1><p>Аналар мерекесі</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Қамқор жанға жылы сөз» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Анаға не қамқор адамға алғыс айтамыз. Көмекті бірге бөлісеміз. Жеке суретті көрсетпес бұрын рұқсат сұраймыз.</p><p>Бүгінгі назарымыз: «Қамқор жанға жылы сөз». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Қамқор адамың шаршады. Кітаптарыңды өзің жинай аласың. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</p><div class=\"concepts\"><span>Қамқорлық</span><span>Алғыс</span><span>Еңбек</span><span>Таңдау</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> Аналар күні — мамырдың екінші жексенбісі; Халықаралық әйелдер күні — 8 наурыз</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Қамқор адамың шаршады. Кітаптарыңды өзің жинай аласың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Ашықхатты анаңнан басқа қамқор адамға бергің келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қамқор адамды таңдауға мүмкіндік; жеке тарихты ашқызбау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Сыйлық сатып ала алмайсың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тегін алғыс пен пайдалы әрекет; қаржы туралы сұрамау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Біреу үйдегі көмекті тек қыздар атқарады деді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Міндетті мүмкіндікке қарай бөлу; стереотипке сүйенбеу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Қамқор адамның фотосын көрсеткің келеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсат сұрау; жеке дерексіз сурет не ойдан шығарылған мысал таңдау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Байқаған еңбегім — айтар алғысым — қауіпсіз көмегім» картасын дайындаңдар. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Кез келген қамқор адамға арналған қолжетімді мереке жоспарын жасаңдар: ерікті қатысу, тегін алғыс, қауіпсіз көмек. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Қамқорлықты бөлісеміз» ашықхатын немесе үш жолдық мәтінін жазыңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қамқорлық қандай еңбекпен көрінеді? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Алғысты сыйлықсыз қалай айтамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Міндетті қандай өлшеммен бөлеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Неге қамқор адамды таңдауға мүмкіндік береміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Құрметті күнделікті іске қалай айналдырамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін. Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Қамқор жанға жылы сөз»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Аналар мерекесі» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Қамқор адамың шаршады. Кітаптарыңды өзің жинай аласың.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қамқорлық қандай еңбекпен көрінеді? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Міндетті қандай өлшеммен бөлеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Құрметті күнделікті іске қалай айналдырамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Қамқорлық» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.\"></textarea><label for=\"reflection-1\">«Қамқор жанға жылы сөз» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Ризашылықты сөзбен де, қауіпсіз көмегіммен де көрсетемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/P1700000689\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелік күндердің тізбесі</a> · Әділет АҚЖ. Мәтіні ашылып, тиісті мерекелік күндер тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p><p>8 наурыз туралы дерек: <a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Мерекелер туралы заң</a>. Аналар күнімен шатастырмаңыз.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t20\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t22\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t21", "title": "Қамқор жанға жылы сөз | Тәрбие әлемі"}, "lesson/g01-t22": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Конституция күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⚖</span><span>1-сынып · 22/30 · 40 минут</span></div><h1>Әр адамды сыйлаймын</h1><p>Конституция күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Әр адамды сыйлаймын» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Конституция — еліміздің негізгі заңы. Әр адамға құрметпен қараймыз. Өзгенің сөзін тыңдаймыз.</p><p>Бүгінгі назарымыз: «Әр адамды сыйлаймын». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Бір бала ойынға қатысқысы келеді, бірақ оған кезек бермеді. Ойлану бағдары: Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.</p><div class=\"concepts\"><span>Конституция</span><span>Негізгі заң</span><span>Қадір-қасиет</span><span>Теңдік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 15 наурыз (01.07.2026 бастап қолданыстағы мерекелер туралы заң бойынша)</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Бір бала ойынға қатысқысы келеді, бірақ оған кезек бермеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Сенің де, досыңның да ойы бар.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Дәлел мен адамды ажырату; құрметті талқылау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Ереже туралы сұрағың бар.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Дереккөз, редакция және құжат деңгейін тексеру; бап ойдан жазбау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Көмек керек балаға түсінікті белгі жасайсың.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тең мүмкіндік үшін әртүрлі қолдау қажет болуы мүмкін екенін түсіндіру.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Бала сұрақ қоюдан қорқады.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Сыпайы өтініш жолы; жауапты адам мен қарау тәртібін нақтылау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Күнделікті әрекет — адамға әсері» кестесін құрыңдар: тыңдау, рұқсат сұрау, қолдау. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Қадір-қасиеті сақталатын сынып» ұсынысын дайындаңдар. Нақты заң бабы тек ресми мәтінмен тексерілгенде ғана қосылады. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Баршаға құрмет» атты қолжетімді орта белгісін жасаңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Негізгі заң дегенді қалай түсінеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Адам қадірін қалай сыйлаймыз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Тең мүмкіндікке қандай қолдау керек? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Құқықтық мәтіннің нұсқасын неге тексереміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ұсынысты қауіпсіз қалай жеткіземіз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін. Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Әр адамды сыйлаймын»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Конституция күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Бір бала ойынға қатысқысы келеді, бірақ оған кезек бермеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Негізгі заң дегенді қалай түсінеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Тең мүмкіндікке қандай қолдау керек? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ұсынысты қауіпсіз қалай жеткіземіз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>Белгішені таңда, содан кейін бір әрекетті көрсет.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Конституция» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.\"></textarea><label for=\"reflection-1\">«Әр адамды сыйлаймын» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>5 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>10 мин</td><td>A1–A5: әрқайсысына 2 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>5 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>5 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z020000345_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы баланың құқықтары туралы</a> · Әділет АҚЖ. Мәтіні ашылды; сабақтағы құқықтық мәдениетке жалпы тірек. Жеке жағдайға құқықтық кеңес емес. Тексерілген күн: 25.10.2026. Интернет қажет.</p><div class=\"notice\">Маңызды: тексерілген 2026 жылғы редакцияда Конституция күні — 15 наурыз. Бұрынғы 30 тамыз датасын автоматты көшірмеңіз. Сабақ өткізер алдында ресми мәтіннің қолданыстағы нұсқасын қайта қараңыз.</div></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g01-t21\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/1\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g01-t23\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "1", "lesson": "g01-t22", "title": "Әр адамды сыйлаймын | Тәрбие әлемі"}, "lesson/g01-t23": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/1\">1-сынып</a><span> / </span><span>Наурыз мерекесі</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>❖</span><span>1-сынып · 23/30 · 40 минут</span></div><h1>Наурыздағы ізгі тілек</h1><p>Наурыз мерекесі</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/1\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Наурыздағы ізгі тілек» тақырыбында бір пайдалы әрекетті таңдау және көрсету.</p><h3>Күтілетін нәтижелер</h3><ul><li>Бір орынды әрекетті атайды немесе көрсетеді.</li><li>Тақырыпқа сай бір жақсы әрекетті айтады немесе суретпен көрсетеді.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Наурызда ізгі тілек айтамыз. Дәстүрді танып үйренеміз. Мерекеде бір-бірімізді сыйлаймыз.</p><p>Бүгінгі назарымыз: «Наурыздағы ізгі тілек». Бүгін бір дұрыс әрекетті таңдап үйренеміз. Сұрағың болса, мұғалімге айт. Ойыңды суретпен де көрсете аласың.</p><p>Өмірлік мысал: Досың бір дәстүрді білмейді. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</p><div class=\"concepts\"><span>Наурыз</span><span>Жаңару</span><span>Татулық</span><span>Дәстүр</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 21–23 наурыз</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">2 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Досың бір дәстүрді білмейді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">2 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Ойынға қатысу үшін қымбат киім керек деді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолжетімді рөл; киім мен қаржыға байланысты кемсітпеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">2 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Дәмнен бұрын қолыңды жуу керек.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ересекпен қауіпсіздігін келісу; дәм татуды міндеттемеу; қауіпсіз балама.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">2 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Мерекеден соң көп қағаз қалды.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қалдықты азайту; қайта қолданылатын қауіпсіз материал; жинауды жоспарлау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">2 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Екі бала ойынның кезегіне келіспеді.</p><p>Екі әрекетті тыңда: қауіпсіз әрі әдептісін таңда. Ойыңды бір сөзбен не суретпен көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Бір орынды әрекетті атайды немесе көрсетеді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кезек пен құрмет ережесі; ортақ пайдалы нәтиже.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Ізгі тілек — оны көрсететін іс» жұптарын құрыңдар. Тілек нақты әрі ешкімді міндеттемейтін болсын. Бірің суретті не әрекетті атайсың, екіншің жауапты көрсетесің. Одан кейін рөл ауыстырыңдар. Жазу міндетті емес.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Мен ... таңдаймын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Қолжетімді Наурыз бұрышын жоспарлаңдар: мұра, ойын, тазалық және қауіпсіз қатысу. Үш адам болыңдар: суретші, көрсетуші, айтушы. Бір ортақ сурет пен бір ереже дайындаңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Үш кадрлы «Жаңару күні» суретті әңгімесін құрыңдар. Бір сурет пен бір сөз жеткілікті.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Наурыздағы жаңару нені білдіреді? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Дәстүр айырмасын қалай құрметтейміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қымбат затсыз мереке бола ма? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Қауіпсіз қатысуды қалай қамтамасыз етеміз? Бір сөзбен, суретпен не ауызша жауап бер.</li><li>Ысырапты қалай азайтамыз? Бір сөзбен, суретпен не ауызша жауап бер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мен ... таңдаймын. Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Бірінші оқиғада қай әрекетті таңдаймыз? Мұғалім жауаптарды оқиды.</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Дәстүрді түсініп, мерекені ізгі іспен толықтырамын. Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Наурыздағы ізгі тілек»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 1-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Наурыз мерекесі» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Бір сөзбен, суретпен не ауызша жауап бер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Досың бір дәстүрді білмейді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мен ... таңдаймын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Наурыздағы жаңару нені білдіреді? Б
