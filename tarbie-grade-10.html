жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Пікір» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g10-t29\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/10\">Сынып тақырыптары</a><span class=\"muted\">Соңғы тақырып</span></nav>", "kind": "lesson", "grade": "10", "lesson": "g10-t30", "title": "ЖИ контенті және дәлел | Тәрбие әлемі"}, "home": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><span>10-сынып</span></nav><section class window.TARBIE_CATALOG=[{"id": "g10-t01", "grade": 10, "topic": 1, "title": "Академиялық адалдық және ЖИ", "direction": "Адал азамат", "icon": "✦", "search": "Академиялық адалдық және ЖИ Адал азамат «Академиялық адалдық және ЖИ» тақырыбы арқылы адалдық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Адалдық — өз әрекетің туралы шын айту және өзгенің еңбегін иемденбеу. Қателескен адам оны мойындап, түзете алады. Әділдік әр адамның үлесін және қажет қолдауын ескеруді талап етеді. Бүгінгі назарымыз: «Академиялық адалдық және ЖИ». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Жобаға қажет дерегі бар табылған құрылғыны қолдану ұсынылды. Иесінің келісімі жоқ. Ойлану бағдары: Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу. Жобаға қажет дерегі бар табылған құрылғыны қолдану ұсынылды. Иесінің келісімі жоқ. Жоба есебіндегі қателікті бір ғана қатысушыға жабу команда беделін сақтайтындай көрінді. Қоғамдық бастаманың мерзімі өтуде. Уәде орындалмайтынын ұйымдастырушы біледі. ЖИ мен ашық деректі қолданған зерттеу жеке авторлық еңбек ретінде ұсынылмақ. Іріктеу талабын ұйымдастырушы өз танысына ыңғайлап өзгертті.", "path": "#/lesson/g10-t01"}, {"id": "g10-t02", "grade": 10, "topic": 2, "title": "Экожобаның пайдасы мен ресурсы", "direction": "Таза Қазақстан", "icon": "♧", "search": "Экожобаның пайдасы мен ресурсы Таза Қазақстан «Экожобаның пайдасы мен ресурсы» тақырыбы арқылы тазалық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Таза орта күнделікті ұсақ әрекеттерден құралады. Қалдықты азайту, суды ысырап етпеу және ортақ орынды ұқыпты пайдалану маңызды. Тазалық жұмысы қауіпсіз болуы керек; шыны мен белгісіз затты балалар жинамайды. Бүгінгі назарымыз: «Экожобаның пайдасы мен ресурсы». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Бір реттік безендіруге көп қаржы кетеді, бірақ қайта қолданылатын затты сақтау орны жоқ. Ойлану бағдары: Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру. Бір реттік безендіруге көп қаржы кетеді, бірақ қайта қолданылатын затты сақтау орны жоқ. Суды үнемдеу жобасының нәтижесі тек әдемі есеппен көрсетіліп, өлшем жасалмаған. Қоғамдық сенбілікте балаларға қауіпті қалдықты жинауды ұсынды. Ағаш отырғызу ұсынылды, бірақ кейінгі суару жауаптысы анықталмады. Экологиялық науқан үшін көп пластик сыйлық сатып алу ұсынылды.", "path": "#/lesson/g10-t02"}, {"id": "g10-t03", "grade": 10, "topic": 3, "title": "Тәртіп пен жауапкершілік тепе-теңдігі", "direction": "Заң мен тәртіп", "icon": "⚖", "search": "Тәртіп пен жауапкершілік тепе-теңдігі Заң мен тәртіп «Тәртіп пен жауапкершілік тепе-теңдігі» тақырыбы арқылы ереже мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ереже адамдардың бірге қауіпсіз өмір сүруіне көмектеседі. Мектептің күнделікті ережесі мен мемлекет заңының қызметі бірдей емес. Түсініксіз талапты сұрақ қою және ұсыныс білдіру арқылы нақтылауға болады. Бұл сабақ нақты құқықтық кеңес бермейді. Бүгінгі назарымыз: «Тәртіп пен жауапкершілік тепе-теңдігі». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Ұйымдастырушы кезек тәртібін өз тобына ғана қолданбайды. Ойлану бағдары: Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну. Ұйымдастырушы кезек тәртібін өз тобына ғана қолданбайды. Байқау өлшемі нәтижелер белгілі болған соң өзгертілді. Белсенділер нәтижеге тез жету үшін келісілген қауіпсіздік рәсімін айналып өткісі келеді. Мектеп талабын заң талабы деп түсіндірген хабарлама тарады, дереккөз жоқ. Ереже бұзылғанын тіркеу рәсімі адамдарды ұялтуға айналды.", "path": "#/lesson/g10-t03"}, {"id": "g10-t04", "grade": 10, "topic": 4, "title": "Цифрлық көрмедегі жауапкершілік", "direction": "Ұлттық мұраны қорғайық", "icon": "❖", "search": "Цифрлық көрмедегі жауапкершілік Ұлттық мұраны қорғайық «Цифрлық көрмедегі жауапкершілік» тақырыбы арқылы мұра мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мұраға тіл, өнер, дәстүр, тарихи орын мен тұрмыстық бұйым жатады. Оны сақтау — бүлдірмеу, мағынасын білу және дерегін бұрмаламай жеткізу. Бір бұйым туралы әртүрлі әңгіме болуы мүмкін; авторын және дереккөзін нақтылау пайдалы. Бүгінгі назарымыз: «Цифрлық көрмедегі жауапкершілік». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Көрме жобасында түпнұсқа затты тиісті қорғанышсыз тасымалдау жоспарланды. Ойлану бағдары: Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану. Көрме жобасында түпнұсқа затты тиісті қорғанышсыз тасымалдау жоспарланды. Цифрлық көрмеде дерексіз түсіндірме ұлттық дәстүрдің жалғыз нұсқасы ретінде берілді. Көптілді көрмеде бір тілдегі түсіндірме қате аударылды. Жобада шебер туындысының бейнесін коммерциялық өнімге рұқсатсыз пайдалану ұсынылды. Ауызша тарих жобасында жазбаны кейін алып тастауды сұраған адамның өтініші ескерілмеді.", "path": "#/lesson/g10-t04"}, {"id": "g10-t05", "grade": 10, "topic": 5, "title": "Ынтымақтастықтағы әділ үлес", "direction": "ДосболLIKE", "icon": "♡", "search": "Ынтымақтастықтағы әділ үлес ДосболLIKE «Ынтымақтастықтағы әділ үлес» тақырыбы арқылы достық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Достық тыңдау, сенім және ерікті қолдауға сүйенеді. Дос болу барлық ұсынысқа келісу дегенді білдірмейді. Өз шекараңды айтып, өзгенің таңдауын сыйлауға болады. Қауіп төнсе, мәселені жалғыз шешуге міндетті емессің. Бүгінгі назарымыз: «Ынтымақтастықтағы әділ үлес». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Жоба тобына бұрын танымайтын қатысушыны алуға қарсы пікір айтылды. Ойлану бағдары: Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу. Жоба тобына бұрын танымайтын қатысушыны алуға қарсы пікір айтылды. Серіктестер ортақ жобаның бағыты туралы екі түрлі ұстанымда. Досын қолдағысы келген адам оның жеке мәселесін топқа айтып қойды. Серіктес достықты алға тартып, адал емес шешімді қолдауды талап етті. Ортақ жобада беделді қатысушының ойы үнемі автоматты қабылданады.", "path": "#/lesson/g10-t05"}, {"id": "g10-t06", "grade": 10, "topic": 6, "title": "Алдын алу жүйесі және оқушы үні", "direction": "Буллингтің алдын алу", "icon": "☂", "search": "Алдын алу жүйесі және оқушы үні Буллингтің алдын алу «Алдын алу жүйесі және оқушы үні» тақырыбы арқылы қолдау мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Біреуді қайта-қайта қорлау, қорқыту не шеттету — көмек қажет ететін жағдай. Оған ұшыраған бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтуға болады. Бір рет болған ауыр әрекетті де елемеуге болмайды. Бұл сабақта қорлау сөздері мен көріністері қайталанбайды. Бүгінгі назарымыз: «Алдын алу жүйесі және оқушы үні». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді. Көмек сұраған адамға қарсы кек қайтару қаупі бар, орта қауіпсіз емес. Беделді топ қудалауды әзіл деп ақтап, куәгерлерден үнсіз қалуды сұрайды. Алдын алу шарасында нақты оқушының оқиғасын оның келісімінсіз жарияламақ. Алғашқы хабарға жауап болмады, оқушы қауіпсіздігі әлі қамтамасыз етілген жоқ.", "path": "#/lesson/g10-t06"}, {"id": "g10-t07", "grade": 10, "topic": 7, "title": "Онлайн қысымға жауап беру жоспары", "direction": "Кибербуллингтің алдын алу", "icon": "▣", "search": "Онлайн қысымға жауап беру жоспары Кибербуллингтің алдын алу «Онлайн қысымға жауап беру жоспары» тақырыбы арқылы кибербуллинг мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Цифрлық ортада қорлау, қорқыту және келісімсіз контент тарату адамға зиян тигізеді. Жауап ретінде қорлаудың қажеті жоқ. Қауіпсіздік үшін сенімді ересекпен бірге шағымдану және бұғаттау мүмкіндігін қарастыруға болады. Куәгер ренжітетін материалды әрі қарай таратпайды. Бүгінгі назарымыз: «Онлайн қысымға жауап беру жоспары». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр. Адамды кемсітетін өңделген бейнені «тексеру үшін» таратуды ұсынды. Біреудің атынан жасалған парақша оның беделіне зиян келтіреді. Киберқудалауға ұшыраған оқушы бар кінәні өзіне артып, көмек сұрамай жүр. Қудалаушы топ контентті өшіруді мәселе толық шешілді деп көрсетеді.", "path": "#/lesson/g10-t07"}, {"id": "g10-t08", "grade": 10, "topic": 8, "title": "Қоғамдық шараны қауіпсіз жоспарлау", "direction": "Қоғамдық ортадағы қауіпсіздік", "icon": "⌂", "search": "Қоғамдық шараны қауіпсіз жоспарлау Қоғамдық ортадағы қауіпсіздік «Қоғамдық шараны қауіпсіз жоспарлау» тақырыбы арқылы кездесу орны мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қоғамдық жерде алдын ала келісілген бағыт пен кездесу орны көмектеседі. Бейтаныс адамға еріп кетпеу, қауіпті затты ұстамау және жауапты қызметкерден көмек сұрау маңызды. Қауіпсіздікке күмән туса, сенімді ересекпен бірге шешім қабылда. Бүгінгі назарымыз: «Қоғамдық шараны қауіпсіз жоспарлау». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек. Ұйымдастырушы болып көрінген адам қатысушыны жеке орынға шақырды, өкілеті расталмаған. Шара еріктілеріне белгісіз пакетті орнынан жылжыту ұсынылды. Көрме ұйымдастырушылары қосымша орын үшін шығу жолын тарылтқысы келеді. Жоба үшін қауіпті орынға кіруді батылдық сынағы деп ұсынды.", "path": "#/lesson/g10-t08"}, {"id": "g10-t09", "grade": 10, "topic": 9, "title": "Өтініш пен ұсыныстың мәдениеті", "direction": "Құқықтық тәртіп", "icon": "⚑", "search": "Өтініш пен ұсыныстың мәдениеті Құқықтық тәртіп «Өтініш пен ұсыныстың мәдениеті» тақырыбы арқылы құқық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр баланың қадір-қасиеті мен қауіпсіздігі маңызды. Пікір айту кезінде өзгенің де сөзін тыңдау қажет. Құқықтар жақсы мінез үшін берілетін сыйлық емес. Келіспеушілікті тыныш талқылап, қажет болса сенімді ересектің көмегін сұраймыз. Бүгінгі назарымыз: «Өтініш пен ұсыныстың мәдениеті». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады. Жоба қатысушысының жеке мәліметі ортақ кестеге келісімсіз жарияланды. Шектеулі ресурсты бөлу кезінде бір топтың мүддесі ескерілмеді. Міндетін орындамаған адамды негізгі қолдаудан айыру керек деген пікір айтылды. Жауапсыз қалған өтінішті қайта жолдаудың дұрыс ретін топ іздеп отыр.", "path": "#/lesson/g10-t09"}, {"id": "g10-t10", "grade": 10, "topic": 10, "title": "Зерттеуден пайдалы ұсынысқа", "direction": "Білімім — Отаныма!", "icon": "☀", "search": "Зерттеуден пайдалы ұсынысқа Білімім — Отаныма! «Зерттеуден пайдалы ұсынысқа» тақырыбы арқылы білім мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Білім адамға мәселені түсініп, пайдалы шешім табуға көмектеседі. Отанға қызмет ету күнделікті ортаға қамқорлықтан басталады. Пайдалы бастама біреудің нақты қажетіне жауап береді; оның нәтижесі тек суретпен емес, өзгеріспен бағаланады. Бүгінгі назарымыз: «Зерттеуден пайдалы ұсынысқа». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Кітапханаға каталог ұсынылды, бірақ оны жаңартатын жауапты жоқ. Ойлану бағдары: Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу. Кітапханаға каталог ұсынылды, бірақ оны жаңартатын жауапты жоқ. Тәлімгерлік жобасы оқушының орнына жұмыс орындауға айналды. Экожобада өлшем орнына болжам нәтиже ретінде жазылды. Ақпараттық карта көруі әлсіз адамдарға қолайсыз болып шықты. Қоғамдық жоба табысы бір адамның жетістігі ретінде көрсетілді.", "path": "#/lesson/g10-t10"}, {"id": "g10-t11", "grade": 10, "topic": 11, "title": "Қолдаудың қолжетімді түрлері", "direction": "Қарттар күні", "icon": "✿", "search": "Қолдаудың қолжетімді түрлері Қарттар күні «Қолдаудың қолжетімді түрлері» тақырыбы арқылы құрмет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Үлкенге құрмет — тыңдау, сыпайы сөйлесу және көмекті рұқсатпен ұсыну. Адамның жасына қарап оның мүмкіндігін болжауға болмайды. Қарт кісі де өз таңдауын өзі жасайды. Сұхбатты жазуға және жариялауға бөлек келісім қажет. Бүгінгі назарымыз: «Қолдаудың қолжетімді түрлері». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Қамқорлық жобасы қызмет алушының таңдауын сұрамай шешім қабылдады. Ойлану бағдары: Көмекті сыпайы ұсыну; бас тартуды құрметтеу. Қамқорлық жобасы қызмет алушының таңдауын сұрамай шешім қабылдады. Ауызша тарих жобасында қатысушы тәжірибесі жоба жоспарына сыймай қалды. Қамқорлық есебіне адамның келісімінсіз фотосын қосу ұсынылды. Цифрлық қолдау бағдарламасы қатысушыларды жасына қарай бірдей әлсіз деп сипаттады. Ұрпақтар кездесуінің орны кей қонақтарға қолжетімсіз.", "path": "#/lesson/g10-t11"}, {"id": "g10-t12", "grade": 10, "topic": 12, "title": "Ұстаз бен оқушы серіктестігі", "direction": "Ұстаздар күні", "icon": "✎", "search": "Ұстаз бен оқушы серіктестігі Ұстаздар күні «Ұстаз бен оқушы серіктестігі» тақырыбы арқылы ұстаз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ұстаз еңбегі сабақ түсіндірумен шектелмейді: ол дайындалады, кері байланыс береді, оқуға жағдай жасайды. Алғыс қымбат сыйлыққа тәуелді емес. Құрметпен сұрақ қоюға және түсінбегеніңді айтуға болады. Алғыс шарасына қатысу ерікті болуы керек. Бүгінгі назарымыз: «Ұстаз бен оқушы серіктестігі». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Мерекелік сыйлыққа қатыспаған отбасылар тізімін жарияламақ. Ойлану бағдары: Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау. Мерекелік сыйлыққа қатыспаған отбасылар тізімін жарияламақ. Оқушы бағалау туралы келіспеушілікті қоғамдық айыптаумен шешкісі келеді. Бірлескен іс-шарада оқушы мен мұғалім міндеттері анық бөлінбеген. Жобаға қатысу оқушының жеке сенімі мен мүмкіндігін ескермей міндеттелді. Мерекелік бейнеде адамның жеке пікірі келісімсіз берілді.", "path": "#/lesson/g10-t12"}, {"id": "g10-t13", "grade": 10, "topic": 13, "title": "Үй еңбегін әділ бағалау", "direction": "Отбасы күні", "icon": "⌂", "search": "Үй еңбегін әділ бағалау Отбасы күні «Үй еңбегін әділ бағалау» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отбасы мен қамқор адамдар әртүрлі болады. Жылы сөз, қауіпсіз көмек және бір-бірін тыңдау жақындықты нығайтады. Үйдегі міндет жас пен мүмкіндікке сай бөлінеді. Отбасы туралы жеке мәліметті көпшілікке айтуға ешкім міндетті емес. Бүгінгі назарымыз: «Үй еңбегін әділ бағалау». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Үйдегі көрінбейтін еңбек ескерілмей, оқу мен демалыс уақыты тең бөлінбейді. Ойлану бағдары: Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу. Үйдегі көрінбейтін еңбек ескерілмей, оқу мен демалыс уақыты тең бөлінбейді. Оқу жоспары туралы отбасы пікірі мен оқушы мақсаты сәйкес келмеді. Жобаға отбасылық қаржы мен жеке хаттарды қосу ұсынылды. Отбасы мүшесінің жеке дерегі ортақ чатқа рұқсатсыз жіберілді. Іс-шара тапсырмалары әртүрлі отбасылардың қатысу мүмкіндігін шектеді.", "path": "#/lesson/g10-t13"}, {"id": "g10-t14", "grade": 10, "topic": 14, "title": "Туған өңірге дәлелді ұсыныс", "direction": "Республика күні", "icon": "☀", "search": "Туған өңірге дәлелді ұсыныс Республика күні «Туған өңірге дәлелді ұсыныс» тақырыбы арқылы республика мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Республика күні елдің мемлекеттілігі мен ортақ болашағы туралы ойлануға мүмкіндік береді. Елге құрмет сөзбен де, қоғамдық мүлікті сақтау мен адамдарға сыйластық таныту арқылы да көрінеді. Әр адамның қауіпсіз, шамасына сай пайдалы іс жасауына болады. Бүгінгі назарымыз: «Туған өңірге дәлелді ұсыныс». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді. Ойлану бағдары: Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау. Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді. Қоғамдық ұсыныс тек орталықтың қажетіне бағытталып, шағын елді мекен ұмыт қалды. Патриоттық жоба атауымен рұқсатсыз нысан орнату ұсынылды. Жоба ел жетістігін көрсету үшін дәлелсіз көрсеткіштер ұсынды. Қоғамдық бастаманың әсері тек қатысушылар саны арқылы бағаланды.", "path": "#/lesson/g10-t14"}, {"id": "g10-t15", "grade": 10, "topic": 15, "title": "Қаржы шешіміндегі тәуекел", "direction": "Ұлттық валюта — теңге", "icon": "₸", "search": "Қаржы шешіміндегі тәуекел Ұлттық валюта — теңге «Қаржы шешіміндегі тәуекел» тақырыбы арқылы теңге мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Теңге — Қазақстанның ұлттық валютасы. Ақшаны жоспарлау қажеттілік пен қалауды ажыратудан басталады. Оқу тапсырмасында тек ойдан шығарылған сома қолданылады. Жеке қаржы, банк картасының дерегі немесе құпия код сұралмайды. Бүгінгі назарымыз: «Қаржы шешіміндегі тәуекел». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді. Ойлану бағдары: Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау. Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді. Топқа қабылдау үшін белгілі қымбат өнім алу талап етілді. Тегін сынақтан кейін ақылы жазылым басталатыны ұсақ мәтінмен берілді. Банк атынан сөйлеген адам шұғыл растау кодын беруді талап етті. Екі ұсыныстың бастапқы бағасы бірдей, бірақ қосымша төлемі әртүрлі.", "path": "#/lesson/g10-t15"}, {"id": "g10-t16", "grade": 10, "topic": 16, "title": "Көрнекіліктегі дәлдік пен әдеп", "direction": "Мемлекеттік рәміздер", "icon": "☀", "search": "Көрнекіліктегі дәлдік пен әдеп Мемлекеттік рәміздер «Көрнекіліктегі дәлдік пен әдеп» тақырыбы арқылы ту мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қазақстанның мемлекеттік рәміздері — Ту, Елтаңба және Әнұран. Олар елдің біртұтастығы мен мемлекеттілігін танытады. Рәміз туралы мәліметті ресми дереккөзден тексерген дұрыс. Қолдан жасалған оюды ресми рәміздің дәл көшірмесі деп таныстыруға болмайды. Бүгінгі назарымыз: «Көрнекіліктегі дәлдік пен әдеп». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды. Ойлану бағдары: Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау. Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды. Қатысушының денсаулық не қолжетімділік ерекшелігі ескерілмей, рәсімде масқаралау болды. Таныстырылымда дәлелсіз символдық жорамал ресми түсіндірме ретінде берілді. Көрмедегі рәмізді пайдалану жоспары жауапты маманмен келісілмеді. Қоғамдық парақша ресми суретті белгісіз сайттан алып, нұсқасын тексермеді.", "path": "#/lesson/g10-t16"}, {"id": "g10-t17", "grade": 10, "topic": 17, "title": "Бейбіт қоғамға жеке үлес", "direction": "Тәуелсіздік күні", "icon": "✦", "search": "Бейбіт қоғамға жеке үлес Тәуелсіздік күні «Бейбіт қоғамға жеке үлес» тақырыбы арқылы тәуелсіздік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Тәуелсіздік — елдің өз болашағын өзі айқындауымен байланысты ұғым. Бейбіт өмірді бағалау, тарихи деректі бұрмаламау және өзгенің қадірін сыйлау маңызды. Азаматтық жауапкершілік ортақ ортаға қамқорлықтан көрінеді. Бүгінгі назарымыз: «Бейбіт қоғамға жеке үлес». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды. Ойлану бағдары: Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету. Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды. Қоғамдық мәселедегі келіспеушілік жеке адамды айыптауға айналды. Әлеуметтік желіде дереккөзсіз тарихи тұжырым кең тарады. Қоғамдық бастама әртүрлі адамдардың қатысу мүмкіндігін ескермеді. Жастар ұсынысы шешімге ықпал ете алмайды деген пікір туды.", "path": "#/lesson/g10-t17"}, {"id": "g10-t18", "grade": 10, "topic": 18, "title": "Оқу мүмкіндіктерін дерекпен салыстыру", "direction": "Мамандық таңдау және еңбек", "icon": "⚙", "search": "Оқу мүмкіндіктерін дерекпен салыстыру Мамандық таңдау және еңбек «Оқу мүмкіндіктерін дерекпен салыстыру» тақырыбы арқылы еңбек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мамандық қоғамдағы белгілі бір қажеттілікке жауап береді. Таңдауда қызығушылық, дағды, оқу жолы және еңбек жағдайы ескеріледі. Кәсіпті адамның жынысына немесе отбасы жағдайына қарап шектеуге болмайды. Бірден түпкілікті шешімге келу міндетті емес. Бүгінгі назарымыз: «Оқу мүмкіндіктерін дерекпен салыстыру». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді. Ойлану бағдары: Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу. Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді. Талапкер бағытын өз қызығушылығын тексермей, құрдасының таңдауына қарап бекітті. Мамандыққа жарамдылық туралы дәлелсіз әлеуметтік шектеу қойылды. Кәсіби сынамада оқушыға рұқсатсыз қауіпті жұмыс ұсынылды. Оқу орны туралы жарнамада қабылдау шарты мен толық шығын көрсетілмеді.", "path": "#/lesson/g10-t18"}, {"id": "g10-t19", "grade": 10, "topic": 19, "title": "Қолданба шартын сыни оқу", "direction": "Интернеттегі қауіпсіздік", "icon": "▤", "search": "Қолданба шартын сыни оқу Интернеттегі қауіпсіздік «Қолданба шартын сыни оқу» тақырыбы арқылы жеке дерек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жеке дерекке аты-жөн, мекенжай, құпиясөз және растау коды сияқты мәлімет жатады. Күдікті сілтеме мен шұғыл талапты бірден орындамай, ресми арнадан тексерген дұрыс. Сабақта нақты құпиясөз жасалмайды және ешкімнің аккаунты ашылмайды. Бүгінгі назарымыз: «Қолданба шартын сыни оқу». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды. Ойлану бағдары: Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды. Таныс ұйымның атына ұқсас домен төлем не код енгізуді талап етті. Топ әр сервисте бір құпиясөз қолдануды ыңғайлы деп таңдады. Қосымша деректі үшінші тарапқа беру шартын түсініксіз жазды. Желіде ғана танитын адам өз тұлғасын растамай жеке кездесуді талап етті.", "path": "#/lesson/g10-t19"}, {"id": "g10-t20", "grade": 10, "topic": 20, "title": "Алғыс мәдениеті және еріктілік", "direction": "Алғыс айту күні", "icon": "✿", "search": "Алғыс мәдениеті және еріктілік Алғыс айту күні «Алғыс мәдениеті және еріктілік» тақырыбы арқылы алғыс мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Алғыс нақты көмекті байқап, оның әсерін айту арқылы шынайы болады. «Көмектескенің үшін рақмет» деген сөздің өзі маңызды. Алғыс міндетті сыйлық немесе жауап қызмет талап етпейді. Күнделікті байқалмайтын еңбекті де бағалауға болады. Бүгінгі назарымыз: «Алғыс мәдениеті және еріктілік». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету. Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді. Құрмет тізімі тек көпшілікке танымал адамдардан құралды. Серіктес бұрынғы көмегі үшін этикалық емес шешімге қолдау талап етті. Жобаға алғыс айтуды міндетті жария әрекетпен өлшеу ұсынылды. Бюджеті жоқ қатысушыларды мерекелік шарадан шеттету қаупі туды.", "path": "#/lesson/g10-t20"}, {"id": "g10-t21", "grade": 10, "topic": 21, "title": "Мерекені бәріне қолжетімді ету", "direction": "Аналар мерекесі", "icon": "❀", "search": "Мерекені бәріне қолжетімді ету Аналар мерекесі «Мерекені бәріне қолжетімді ету» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Анаға және қамқор ересекке құрмет жылы сөзден, тыңдаудан және қауіпсіз көмектен көрінеді. Қамқорлық еңбегі бір адамға ғана міндеттелмейді. Әр оқушы өзі таңдаған қамқор адамға алғыс білдіре алады. Аналар күні мен 8 наурыз — атауы мен күні бөлек мерекелер. Бүгінгі назарымыз: «Мерекені бәріне қолжетімді ету». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды. Жалғыз отбасы үлгісіне құрылған сценарий кей қатысушыларды ыңғайсыз күйге түсірді. Мерекелік жоспар қаржылық мүмкіндікке қарай оқушыларды бөліп жіберді. Еңбек туралы талқылауда қамқорлық тек әйел адамның міндеті деп айтылды. Мерекелік жобаға отбасы оқиғасы мен бейнесін келісімсіз жариялау жоспарланды.", "path": "#/lesson/g10-t21"}, {"id": "g10-t22", "grade": 10, "topic": 22, "title": "Қоғамдық шешім және адам қадірі", "direction": "Конституция күні", "icon": "⚖", "search": "Қоғамдық шешім және адам қадірі Конституция күні «Қоғамдық шешім және адам қадірі» тақырыбы арқылы конституция мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Конституция — мемлекеттің негізгі заңы. Бұл сабақта адам қадірін, қауіпсіздікті және өзгенің пікіріне құрметті күнделікті мысалмен талқылаймыз. Нақты құқықтық тұжырымға ресми мәтіннен дәлел қажет. Бұрынғы мәтін мен қолданыстағы редакцияны шатастырмау маңызды. Бүгінгі назарымыз: «Қоғамдық шешім және адам қадірі». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Қоғамдық жобаны талқылауда азшылық пікірін мүлде тіркемеу ұсынылды. Ойлану бағдары: Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Қоғамдық жобаны талқылауда азшылық пікірін мүлде тіркемеу ұсынылды. Пікірлер қайшылығында адамның құқығын талқылау жеке айыптауға айналды. Тексерілмеген ескі құқықтық мәтін жаңа нұсқа ретінде ұсынылды. Қолжетімділік шарасы артық жеңілдік деп сыналды. Жастар ұсынысын қабылдау рәсімі түсініксіз және кері байланыс жоқ.", "path": "#/lesson/g10-t22"}, {"id": "g10-t23", "grade": 10, "topic": 23, "title": "Мереке ресурсын жауапты жоспарлау", "direction": "Наурыз мерекесі", "icon": "❖", "search": "Мереке ресурсын жауапты жоспарлау Наурыз мерекесі «Мереке ресурсын жауапты жоспарлау» тақырыбы арқылы наурыз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Наурыз жаңару, татулық және ізгі тілекпен байланысты. Дәстүрді түсіндіруде оның мағынасына назар аударамыз. Әр өңірдегі тәжірибе әртүрлі болуы мүмкін. Мерекені қауіпсіз, ысырапсыз және бәріне қолжетімді өткізуге болады. Бүгінгі назарымыз: «Мереке ресурсын жауапты жоспарлау». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді. Мереке бюджеті кей отбасыларға міндетті шығын жүктейді. Мерекелік ас жоспары қатысушылардың қауіпсіздік қажеттілігін ескермеді. Экологиялық ұранға қарамастан қайта қолдану жоспары жасалмады. Мерекенің бірлік мақсаты рейтинг пен бәсекенің көлеңкесінде қалды.", "path": "#/lesson/g10-t23"}, {"id": "g10-t24", "grade": 10, "topic": 24, "title": "Қауіпсіз азаматтық бастама", "direction": "Отан қорғаушылар күні", "icon": "⚑", "search": "Қауіпсіз азаматтық бастама Отан қорғаушылар күні «Қауіпсіз азаматтық бастама» тақырыбы арқылы бейбітшілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отанға қызмет жауапкершілік, бейбіт өмірді бағалау және адамдардың қауіпсіздігіне қамқорлықпен байланысты. Батылдық — қауіпті сынаққа бару емес; кейде қауіпті ұсыныстан бас тартып, көмек шақыру. Сабақта әскери құрал не қауіпті жаттығу қолданылмайды. Бүгінгі назарымыз: «Қауіпсіз азаматтық бастама». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды. Бастамада тек күш талап ететін рөлдер жоспарланып, басқа қабілет ескерілмеді. Қоғамға қызмет мысалдары бір ғана топпен шектелді. Көрмеге шығу тегі белгісіз әскери зат әкелу ұсынылды. Қоғамдық жоба үшін адамның жеке қызмет мәліметін жариялау ұсынылды.", "path": "#/lesson/g10-t24"}, {"id": "g10-t25", "grade": 10, "topic": 25, "title": "Қолжетімді қоғамдық бастама", "direction": "Қазақстан халқының бірлігі", "icon": "◉", "search": "Қолжетімді қоғамдық бастама Қазақстан халқының бірлігі «Қолжетімді қоғамдық бастама» тақырыбы арқылы бірлік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Бірлік әр адамның қадірін сыйлап, ортақ іске тең қатысуына жағдай жасаудан басталады. Адамды тіліне, тегіне немесе сыртқы белгісіне қарап бағаламаймыз. Мәдени таныстыруда бір адамның тәжірибесін тұтас топқа телуге болмайды. Бүгінгі назарымыз: «Қолжетімді қоғамдық бастама». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды. Жобаға қосылу тәртібі тек бұрынғы мүшелерге түсінікті. Мәдени шара барлық қатысушы бірдей дәстүрді ұстанады деп жоспарланды. Жобада аз ұсынылған топтардың қажеттілігі өлшенбеді. Манипуляциялық хабар бір оқиғаны тұтас қауымға телиді.", "path": "#/lesson/g10-t25"}, {"id": "g10-t26", "grade": 10, "topic": 26, "title": "Ресурс пен есептің ашықтығы", "direction": "Волонтерлік және қайырымдылық", "icon": "♡", "search": "Ресурс пен есептің ашықтығы Волонтерлік және қайырымдылық «Ресурс пен есептің ашықтығы» тақырыбы арқылы еріктілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Волонтерлік — ерікті пайдалы әрекет. Көмектің қажеттігін алдымен сұраған дұрыс. Адамның қадірі мен жеке мәліметі сақталуы керек. Оқушыдан ақша жинау, жеке жағдайын жариялау немесе қауіпті жұмыс істеу талап етілмейді. Бүгінгі назарымыз: «Ресурс пен есептің ашықтығы». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау. Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды. Волонтерлік сағат үшін адамдардың ерікті таңдауы шектелді. Есепке адамның қиын жағдайын егжей-тегжейлі жазу ұсынылды. Жобаның қауіпсіздік жоспары жоқ, оқушыларға ересек жұмысы берілді. Жоба табысы тек жиналған қаржымен өлшенді.", "path": "#/lesson/g10-t26"}, {"id": "g10-t27", "grade": 10, "topic": 27, "title": "Жеке мүмкіндікке сай әдет", "direction": "Денсаулық және пайдалы әдеттер", "icon": "♧", "search": "Жеке мүмкіндікке сай әдет Денсаулық және пайдалы әдеттер «Жеке мүмкіндікке сай әдет» тақырыбы арқылы әдет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Демалыс, күн тәртібі, қауіпсіз қозғалыс және қол гигиенасы күнделікті өзіне қамқорлықтың бөлігі. Әр адамның мүмкіндігі әртүрлі. Сабақта дене салмағы, диагноз немесе жеке денсаулық ақпараты сұралмайды. Денсаулық мәселесінде сенімді ересек пен медицина маманына жүгінеді. Бүгінгі назарымыз: «Жеке мүмкіндікке сай әдет». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды. Оқу тобы түнгі уақытта міндетті жауап беруді талап етті. Белсенділік жоспары әркімнің мүмкіндігін ескермей, бәріне бірдей талап қойды. Дәлелсіз денсаулық кеңесі жарнамалық мүддесін жасырды. Жобаға қатысушы үзіліс сұраудан ұялады, топ нәтижені ғана күтеді.", "path": "#/lesson/g10-t27"}, {"id": "g10-t28", "grade": 10, "topic": 28, "title": "Қолжетімді маршрут ұсынысы", "direction": "Жолдағы қауіпсіздік", "icon": "↔", "search": "Қолжетімді маршрут ұсынысы Жолдағы қауіпсіздік «Қолжетімді маршрут ұсынысы» тақырыбы арқылы өткел мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жолда назарды қозғалысқа аударып, белгіленген жаяу жүргінші өткелі мен бағдаршам тәртібін сақтау керек. Жас бала жолды сенімді ересекпен өтеді. Қауіпсіздік тапсырмалары тек қағазда орындалады; көлік жолында тәжірибе жасалмайды. Бүгінгі назарымыз: «Қолжетімді маршрут ұсынысы». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді. Топтық тапсырманы жол үстінде телефонмен орындау ұсынылды. Тұрақтағы көліктер жаяу жүргіншінің көру аймағын жауып тұр. Ұсынылған маршрутта жарық аз, қолжетімділік мәселесі бар. Мектеп маңындағы қауіп туралы тексерілген ұсыныс дайындау керек.", "path": "#/lesson/g10-t28"}, {"id": "g10-t29", "grade": 10, "topic": 29, "title": "Билік теңсіздігі және қауіпсіз қолдау", "direction": "Жеке шекара және өзара құрмет", "icon": "☂", "search": "Билік теңсіздігі және қауіпсіз қолдау Жеке шекара және өзара құрмет «Билік теңсіздігі және қауіпсіз қолдау» тақырыбы арқылы шекара мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр адам өзінің затына, кеңістігіне және жеке ақпаратына қатысты шекарасын айта алады. Келісім ерікті болуы керек және оны өзгертуге болады. «Жоқ» деген жауапты сыйлаймыз. Қорқыныш не қысым болса, сенімді ересекке айтамыз. Бүгінгі назарымыз: «Билік теңсіздігі және қауіпсіз қолдау». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады. Бұрын берген жариялау келісімін қатысушы кейін өзгертті. Беделді қатысушы бас тартқан адамды мүмкіндіктен айырамын деп қысым жасады. Ортақ жобада байланыс уақыты мен жеке кеңістік келісілмеген. Қысым көрген адам құпиялық уәдесі үшін көмекке жүгінбей жүр.", "path": "#/lesson/g10-t29"}, {"id": "g10-t30", "grade": 10, "topic": 30, "title": "ЖИ контенті және дәлел", "direction": "Медиасауаттылық", "icon": "⌕", "search": "ЖИ контенті және дәлел Медиасауаттылық «ЖИ контенті және дәлел» тақырыбы арқылы факт мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ақпаратты бөліспес бұрын авторын, жарияланған күнін және бастапқы дерегін тексереміз. Сурет басқа оқиғаға қатысты болуы мүмкін. Пікір адамның бағасын білдіреді, ал фактіні тексеруге болады. Сенімді көрінген ЖИ мәтінінде де қате кездеседі. Бүгінгі назарымыз: «ЖИ контенті және дәлел». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз. Өмірлік мысал: Көшірілген хабар ресми құжатқа ұқсайды, бірақ бастапқы жарияланымы жоқ. Ойлану бағдары: Мектептің ресми хабарын тексеру; расталмағанын таратпау. Көшірілген хабар ресми құжатқа ұқсайды, бірақ бастапқы жарияланымы жоқ. Шын фотоға қате уақыт пен орын беріліп, қоғамдық пікірге әсер ету көзделді. Бағалау тұжырымы өлшемі мен дерегінсіз зерттеу қорытындысы деп ұсынылды. Қорқыныш туғызатын манипуляциялық мәтін тек бір тарапты көрсетеді. ЖИ жасаған сенімді мәтінде ойдан шығарылған сілтеме мен дәйексөз бар.", "path": "#/lesson/g10-t30"}];
function initializeTarbie(){
'use strict';
(() => {
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const body=document.body,root=body.dataset.root||'',page=body.dataset.page;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function status(id){return (marks.favorites.includes(id)?'★ ':'')+(marks.viewed.includes(id)?'✓ Қаралған':'');}
function updateCardStatus(){$$('[data-status]').forEach(e=>e.textContent=status(e.dataset.status));}

if(page==='home'||page==='grade'){
const search=$('#search'),grade=$('#grade-filter'),direction=$('#direction-filter'),view=$('#view-filter');let pageIndex=0;const pageSize=18;
if(page==='grade'){grade.value=body.dataset.grade;grade.disabled=true;}
const params=new URLSearchParams(window.SINGLE_QUERY||'');if(params.get('view')==='favorites')view.value='favorites';

function render(){const found=(window.TARBIE_CATALOG||[]).filter(matches);$('#result-count').textContent=found.length+' тақырып табылды';
if(page==='grade'){const ids=new Set(found.map(x=>x.id));$$('#class-results .topic-card').forEach(e=>e.hidden=!ids.has(e.dataset.id));$('#class-empty').hidden=found.length>0;updateCardStatus();return;}
const total=Math.max(1,Math.ceil(found.length/pageSize));pageIndex=Math.min(pageIndex,total-1);const shown=found.slice(pageIndex*pageSize,(pageIndex+1)*pageSize);
$('#catalog-results').innerHTML=shown.length?shown.map(x=>`<a class="topic-card" href="${root}${x.path}"><div class="card-top"><span class="topic-icon" aria-hidden="true">${x.icon}</span><span class="tag">${x.grade}-сынып</span><span class="card-status">${status(x.id)}</span></div><span class="direction-label">${esc(x.direction)}</span><h3>${esc(x.title)}</h3><p>5 жағдаят · жұптық · топтық · 5 сұрақ · кері байланыс</p><span class="read-link">Сабақты ашу →</span></a>`).join(''):'<p class="empty">Материал табылмады. Іздеу сөзін немесе сүзгіні өзгертіңіз. Таңдаулыға сабақ ішіндегі ☆ батырмасымен қосуға болады.</p>';
$('#pagination').innerHTML=found.length?`<button id="prev-page" type="button" ${pageIndex===0?'disabled':''}>← Алдыңғы</button><span class="muted">${pageIndex+1} / ${total}</span><button id="next-page" type="button" ${pageIndex>=total-1?'disabled':''}>Келесі →</button>`:'';
if($('#prev-page'))$('#prev-page').onclick=()=>{pageIndex--;render();};if($('#next-page'))$('#next-page').onclick=()=>{pageIndex++;render();};}
[search,grade,direction,view].forEach(e=>e.addEventListener(e===search?'input':'change',()=>{pageIndex=0;render();}));
$('#reset-filter').onclick=()=>{search.value='';grade.value=page==='grade'?body.dataset.grade:'';direction.value='';view.value='all';pageIndex=0;render();};
if($('#clear-marks'))$('#clear-marks').onclick=()=>{marks={favorites:[],viewed:[]};saveMarks();render();toast('Таңдаулы мен қаралған белгілер тазаланды.');};render();
}
if(page==='lesson'){
const id=body.dataset.lesson;const tabs=$$('[role=tab]'),panels=$$('.tab-panel');
function activate(key,focus=false){const target=tabs.find(t=>t.dataset.tab===key)||tabs[0];tabs.forEach(t=>{const active=t===target;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;});panels.forEach(p=>p.hidden=p.id!==target.getAttribute('aria-controls'));if(focus)target.focus();}
tabs.forEach((tab,i)=>{tab.onclick=()=>{activate(tab.dataset.tab);window.setSingleTab(tab.dataset.tab);};tab.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();activate(tabs[n].dataset.tab,true);window.setSingleTab(tabs[n].dataset.tab);};});activate(window.SINGLE_TAB||'intro');
function updateMarks(){const fav=marks.favorites.includes(id),seen=marks.viewed.includes(id);$('#favorite').textContent=fav?'★ Таңдаулыдан алу':'☆ Таңдаулыға қосу';$('#favorite').setAttribute('aria-pressed',String(fav));$('#mark-viewed').textContent=seen?'✓ Қаралған белгісін алу':'○ Қаралды деп белгілеу';$('#mark-viewed').setAttribute('aria-pressed',String(seen));}
$('#favorite').onclick=()=>{marks.favorites=marks.favorites.includes(id)?marks.favorites.filter(x=>x!==id):[...marks.favorites,id];saveMarks();updateMarks();};$('#mark-viewed').onclick=()=>{marks.viewed=marks.viewed.includes(id)?marks.viewed.filter(x=>x!==id):[...marks.viewed,id];saveMarks();updateMarks();};updateMarks();
$$('.quiz-option').forEach(button=>button.onclick=()=>{const box=button.closest('.quiz');box.querySelectorAll('.quiz-option').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const correct=Number(button.dataset.option)===Number(box.dataset.correct),result=box.querySelector('.quiz-result');result.hidden=false;result.textContent=(correct?'Орынды жауап. ':'Бұл таңдауды қайта қара. ')+result.dataset.explanation;});
let responses=[];const form=$('#feedback-form');function showFeedback(){$('#feedback-count').textContent=responses.length+' анонимді жауап тіркелді.';const ratings=['Түсіндім','Жаттығамын','Көмек керек'];$('#feedback-tally').innerHTML='<div class="tally">'+ratings.map(r=>`<span>${r}: <b>${responses.filter(x=>x.confidence===r).length}</b></span>`).join('')+'</div>';$('#feedback-list').innerHTML=responses.length?responses.map((r,i)=>`<section class="feedback-response"><strong>Жауап ${i+1} · ${esc(r.confidence)}</strong>${r.answers.map((a,n)=>`<p><b>${n+1}.</b> ${esc(a||'Ауызша жауап / мәтін енгізілмеген')}</p>`).join('')}</section>`).join(''):'<p class="muted">Әзірге жауап жоқ.</p>';}
form.addEventListener('submit',event=>{event.preventDefault();const selected=form.querySelector('input[name=confidence]:checked');if(!selected){toast('Алдымен өзіндік бағалау белгісін таңдаңыз.');return;}responses.push({confidence:selected.value,answers:[0,1,2].map(i=>$('#reflection-'+i).value.trim())});form.reset();showFeedback();toast('Анонимді жауап тіркелді. Келесі оқушы жауап бере алады.');});
$('#export-feedback').onclick=()=>{if(!responses.length){toast('Әзірге жауап жоқ.');return;}const title=$('.lesson-head h1').textContent;const text=title+'\nАнонимді кері байланыс\nЖауап саны: '+responses.length+'\n\n'+responses.map((r,i)=>'Жауап '+(i+1)+' · '+r.confidence+'\n'+r.answers.map((a,n)=>(n+1)+'. '+(a||'Ауызша жауап / мәтін жоқ')).join('\n')).join('\n\n');download(id+'-keri-bailanys.txt',text);toast('Кері байланыс файлы жүктеуге дайын.');};
$('#clear-feedback').onclick=()=>{responses=[];showFeedback();toast('Осы сессия жауаптары өшірілді.');};
function printDraft(){let p=$('#print-feedback');if(!p){p=document.createElement('div');p.id='print-feedback';p.className='print-feedback';$('#panel-reflection').appendChild(p);}p.innerHTML='<h3>Ағымдағы жауап үлгісі</h3>'+[0,1,2].map(i=>`<section><strong>${esc($('label[for="reflection-'+i+'"]').textContent)}</strong><div>${esc($('#reflection-'+i).value||'________________________________')}</div></section>`).join('');}
$('#print-lesson').onclick=()=>{printDraft();window.print();};window.onbeforeprint=printDraft;showFeedback();

window.setSingleTab=function(tab){const [route,query='']=location.hash.replace(/^#\//,'').split('?');const p=new URLSearchParams(query);p.set('tab',tab);history.replaceState(null,'','#/'+route+'?'+p.toString());};
function routeSingle(){const [path,query='']=location.hash.replace(/^#\//,'').split('?');const page=SINGLE_PAGES[path]||SINGLE_PAGES.home;const params=new URLSearchParams(query);window.SINGLE_QUERY=query;window.SINGLE_TAB=params.get('tab')||'intro';window.onbeforeprint=null;document.body.dataset.page=page.kind;document.body.dataset.grade=page.grade;document.body.dataset.lesson=page.lesson;document.body.dataset.root='';document.getElementById('main').innerHTML=page.html;document.title=page.title;initializeTarbie();window.scrollTo(0,0);const section=params.get('section');if(section&&document.getElementById(section))document.getElementById(section).scrollIntoView();}
window.addEventListener('hashchange',routeSingle);routeSingle();
