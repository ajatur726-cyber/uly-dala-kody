е көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тең мүмкіндік үшін әртүрлі қолдау қажет болуы мүмкін екенін түсіндіру.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Жастар ұсынысын қабылдау рәсімі түсініксіз және кері байланыс жоқ.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Сыпайы өтініш жолы; жауапты адам мен қарау тәртібін нақтылау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Күнделікті әрекет — адамға әсері» кестесін құрыңдар: тыңдау, рұқсат сұрау, қолдау. Жоспарлаушы және тәуелсіз тексеруші болыңдар. Бірің ұсыныс жазады, екіншің өлшем мен тәуекелді тексереді. Рөл ауыстырып, жетілдіріңдер.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Қадір-қасиеті сақталатын сынып» ұсынысын дайындаңдар. Нақты заң бабы тек ресми мәтінмен тексерілгенде ғана қосылады. Жоба үйлестірушісі, ресурс жоспарлаушы, қауіпсіздік тексерушісі, нәтиже бағалаушысы болыңдар. Бір беттік жоба паспортын және бақылау күнін ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Баршаға құрмет» атты қолжетімді орта белгісін жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Негізгі заң дегенді қалай түсінеміз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Адам қадірін қалай сыйлаймыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Тең мүмкіндікке қандай қолдау керек? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Құқықтық мәтіннің нұсқасын неге тексереміз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Ұсынысты қауіпсіз қалай жеткіземіз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... . Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін. Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Қоғамдық шешім және адам қадірі»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 10-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Конституция күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Іске асыру шарты мен нәтиже көрсеткішін қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Қоғамдық жобаны талқылауда азшылық пікірін мүлде тіркемеу ұсынылды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Негізгі заң дегенді қалай түсінеміз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Тең мүмкіндікке қандай қолдау керек? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Ұсынысты қауіпсіз қалай жеткіземіз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>«Жоспарым — өлшемім — қажет қолдауым» әдісін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Негізгі заң» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.\"></textarea><label for=\"reflection-1\">«Қоғамдық шешім және адам қадірі» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Адам қадірін сыйлаймын, құқықтық ақпаратты ресми көзден тексеремін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Негізгі заң» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z020000345_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы баланың құқықтары туралы</a> · Әділет АҚЖ. Мәтіні ашылды; сабақтағы құқықтық мәдениетке жалпы тірек. Жеке жағдайға құқықтық кеңес емес. Тексерілген күн: 25.10.2026. Интернет қажет.</p><div class=\"notice\">Маңызды: тексерілген 2026 жылғы редакцияда Конституция күні — 15 наурыз. Бұрынғы 30 тамыз датасын автоматты көшірмеңіз. Сабақ өткізер алдында ресми мәтіннің қолданыстағы нұсқасын қайта қараңыз.</div></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g10-t21\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/10\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g10-t23\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "10", "lesson": "g10-t22", "title": "Қоғамдық шешім және адам қадірі | Тәрбие әлемі"}, "lesson/g10-t23": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/10\">10-сынып</a><span> / </span><span>Наурыз мерекесі</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>❖</span><span>10-сынып · 23/30 · 40 минут</span></div><h1>Мереке ресурсын жауапты жоспарлау</h1><p>Наурыз мерекесі</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/10\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Мереке ресурсын жауапты жоспарлау» тақырыбы арқылы наурыз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Жаңару» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Наурыз жаңару, татулық және ізгі тілекпен байланысты. Дәстүрді түсіндіруде оның мағынасына назар аударамыз. Әр өңірдегі тәжірибе әртүрлі болуы мүмкін. Мерекені қауіпсіз, ысырапсыз және бәріне қолжетімді өткізуге болады.</p><p>Бүгінгі назарымыз: «Мереке ресурсын жауапты жоспарлау». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз.</p><p>Өмірлік мысал: Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</p><div class=\"concepts\"><span>Наурыз</span><span>Жаңару</span><span>Татулық</span><span>Дәстүр</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 21–23 наурыз</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Мереке бюджеті кей отбасыларға міндетті шығын жүктейді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолжетімді рөл; киім мен қаржыға байланысты кемсітпеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Мерекелік ас жоспары қатысушылардың қауіпсіздік қажеттілігін ескермеді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ересекпен қауіпсіздігін келісу; дәм татуды міндеттемеу; қауіпсіз балама.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Экологиялық ұранға қарамастан қайта қолдану жоспары жасалмады.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қалдықты азайту; қайта қолданылатын қауіпсіз материал; жинауды жоспарлау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Мерекенің бірлік мақсаты рейтинг пен бәсекенің көлеңкесінде қалды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кезек пен құрмет ережесі; ортақ пайдалы нәтиже.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Ізгі тілек — оны көрсететін іс» жұптарын құрыңдар. Тілек нақты әрі ешкімді міндеттемейтін болсын. Жоспарлаушы және тәуелсіз тексеруші болыңдар. Бірің ұсыныс жазады, екіншің өлшем мен тәуекелді тексереді. Рөл ауыстырып, жетілдіріңдер.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Қолжетімді Наурыз бұрышын жоспарлаңдар: мұра, ойын, тазалық және қауіпсіз қатысу. Жоба үйлестірушісі, ресурс жоспарлаушы, қауіпсіздік тексерушісі, нәтиже бағалаушысы болыңдар. Бір беттік жоба паспортын және бақылау күнін ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Үш кадрлы «Жаңару күні» суретті әңгімесін құрыңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Наурыздағы жаңару нені білдіреді? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Дәстүр айырмасын қалай құрметтейміз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Қымбат затсыз мереке бола ма? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Қауіпсіз қатысуды қалай қамтамасыз етеміз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Ысырапты қалай азайтамыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... . Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Дәстүрді түсініп, мерекені ізгі іспен толықтырамын. Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Мереке ресурсын жауапты жоспарлау»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 10-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Наурыз мерекесі» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Іске асыру шарты мен нәтиже көрсеткішін қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Наурыздағы жаңару нені білдіреді? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Қымбат затсыз мереке бола ма? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Ысырапты қалай азайтамыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Жоспарым — өлшемім — қажет қолдауым» әдісін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Жаңару» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.\"></textarea><label for=\"reflection-1\">«Мереке ресурсын жауапты жоспарлау» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Дәстүрді түсініп, мерекені ізгі іспен толықтырамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Жаңару» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g10-t22\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/10\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g10-t24\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "10", "lesson": "g10-t23", "title": "Мереке ресурсын жауапты жоспарлау | Тәрбие әлемі"}, "lesson/g10-t24": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/10\">10-сынып</a><span> / </span><span>Отан қорғаушылар күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⚑</span><span>10-сынып · 24/30 · 40 минут</span></div><h1>Қауіпсіз азаматтық бастама</h1><p>Отан қорғаушылар күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/10\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Қауіпсіз азаматтық бастама» тақырыбы арқылы бейбітшілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Қызмет» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Отанға қызмет жауапкершілік, бейбіт өмірді бағалау және адамдардың қауіпсіздігіне қамқорлықпен байланысты. Батылдық — қауіпті сынаққа бару емес; кейде қауіпті ұсыныстан бас тартып, көмек шақыру. Сабақта әскери құрал не қауіпті жаттығу қолданылмайды.</p><p>Бүгінгі назарымыз: «Қауіпсіз азаматтық бастама». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз.</p><p>Өмірлік мысал: Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</p><div class=\"concepts\"><span>Бейбітшілік</span><span>Қызмет</span><span>Батылдық</span><span>Қамқорлық</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 7 мамыр</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Бастамада тек күш талап ететін рөлдер жоспарланып, басқа қабілет ескерілмеді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қызметтің түрлі рөлін ұсыну; қауіпсіз ақпараттық не ұйымдастыру көмегі.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Қоғамға қызмет мысалдары бір ғана топпен шектелді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әр адамның бейбіт еңбек пен қамқорлық арқылы үлес қоса алатынын көрсету.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Көрмеге шығу тегі белгісіз әскери зат әкелу ұсынылды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тиіспеу; ересекке хабарлау; тек қауіпсіз бейне не қағаз материал қолдану.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Қоғамдық жоба үшін адамның жеке қызмет мәліметін жариялау ұсынылды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бейбіт қызмет туралы жалпы сұрақ; құпия дерексіз және келісіммен жұмыс.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Батыл таңдау — қауіпсіз әрекет» карточкаларын құрыңдар: бас тарту, көмек сұрау, қолдау. Жоспарлаушы және тәуелсіз тексеруші болыңдар. Бірің ұсыныс жазады, екіншің өлшем мен тәуекелді тексереді. Рөл ауыстырып, жетілдіріңдер.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Бейбіт өмірге пайдалы қауіпсіз бастама жоспарлаңдар: ақпараттық белгі, қолжетімділік немесе ортақ мүлікке қамқорлық. Жоба үйлестірушісі, ресурс жоспарлаушы, қауіпсіздік тексерушісі, нәтиже бағалаушысы болыңдар. Бір беттік жоба паспортын және бақылау күнін ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Бейбіт күнге менің тілегім» ашықхатын жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Батылдық пен тәуекелдің айырмасы қандай? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Отанға қызметтің қандай жолдары бар? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Көмекті қалай қауіпсіз ұсынамыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Неге қауіпті жаттығу жасамаймыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Бейбіт өмірге өз үлесіміз қандай? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... . Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін. Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Қауіпсіз азаматтық бастама»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 10-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Отан қорғаушылар күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Іске асыру шарты мен нәтиже көрсеткішін қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Батылдық пен тәуекелдің айырмасы қандай? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Көмекті қалай қауіпсіз ұсынамыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Бейбіт өмірге өз үлесіміз қандай? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>«Жоспарым — өлшемім — қажет қолдауым» әдісін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Қызмет» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.\"></textarea><label for=\"reflection-1\">«Қауіпсіз азаматтық бастама» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Батылдықты қауіпсіз, жауапты әрекетпен көрсетемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Қызмет» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g10-t23\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/10\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g10-t25\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "10", "lesson": "g10-t24", "title": "Қауіпсіз азаматтық бастама | Тәрбие әлемі"}, "lesson/g10-t25": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/10\">10-сынып</a><span> / </span><span>Қазақстан халқының бірлігі</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>◉</span><span>10-сынып · 25/30 · 40 минут</span></div><h1>Қолжетімді қоғамдық бастама</h1><p>Қазақстан халқының бірлігі</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/10\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Қолжетімді қоғамдық бастама» тақырыбы арқылы бірлік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Әртүрлілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Бірлік әр адамның қадірін сыйлап, ортақ іске тең қатысуына жағдай жасаудан басталады. Адамды тіліне, тегіне немесе сыртқы белгісіне қарап бағаламаймыз. Мәдени таныстыруда бір адамның тәжірибесін тұтас топқа телуге болмайды.</p><p>Бүгінгі назарымыз: «Қолжетімді қоғамдық бастама». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз.</p><p>Өмірлік мысал: Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</p><div class=\"concepts\"><span>Бірлік</span><span>Әртүрлілік</span><span>Тең қатысу</span><span>Ортақ мақсат</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 1 мамыр</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Жобаға қосылу тәртібі тек бұрынғы мүшелерге түсінікті.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Түсінікті ереже мен таныстыру; жаңа адамға қолжетімді рөл.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Мәдени шара барлық қатысушы бірдей дәстүрді ұстанады деп жоспарланды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Таңдау еркіндігі; дәстүрді міндеттемеу; әртүрлілікті құрметтеу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Жобада аз ұсынылған топтардың қажеттілігі өлшенбеді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көпшілік шешімде де әркімнің қажетін тыңдау; балама қатысу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Манипуляциялық хабар бір оқиғаны тұтас қауымға телиді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Таратпау; дерек пен жалпылауды ажырату; адамды топ белгісімен айыптамау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Екі түрлі қызығушылықты бір ортақ іске біріктіріңдер: сурет салу мен кітап оқу, спорт пен ұйымдастыру. Жоспарлаушы және тәуелсіз тексеруші болыңдар. Бірің ұсыныс жазады, екіншің өлшем мен тәуекелді тексереді. Рөл ауыстырып, жетілдіріңдер.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Әркімге ашық ортақ іс» жобасын жасаңдар: тіл, орын, рөл және қатысу кедергілерін ескеріңдер. Жоба үйлестірушісі, ресурс жоспарлаушы, қауіпсіздік тексерушісі, нәтиже бағалаушысы болыңдар. Бір беттік жоба паспортын және бақылау күнін ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Әртүрліміз, ортақ ісіміз бар» ұжымдық плакат эскизін жасаңыздар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Бірлік бірдей болуды білдіре ме? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Адамды топ белгісімен бағалау неге қате? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Жаңа қатысушыны қалай қосамыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Әр пікірді қалай тыңдаймыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Ортақ мақсат қандай болуы мүмкін? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... . Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Айырмашылықты сыйлап, ортақ іске тең қатысамын. Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Қолжетімді қоғамдық бастама»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 10-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Қазақстан халқының бірлігі» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Іске асыру шарты мен нәтиже көрсеткішін қос.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Айырмашылықты сыйлап, ортақ іске тең қатысамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Бірлік бірдей болуды білдіре ме? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Жаңа қатысушыны қалай қосамыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Ортақ мақсат қандай болуы мүмкін? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Жоспарым — өлшемім — қажет қолдауым» әдісін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Әртүрлілік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Айырмашылықты сыйлап, ортақ іске тең қатысамын.\"></textarea><label for=\"reflection-1\">«Қолжетімді қоғамдық бастама» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Айырмашылықты сыйлап, ортақ іске тең қатысамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Әртүрлілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z010000267_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелер туралы</a> · Әділет АҚЖ. Мәтіні ашылып, мереке күндері тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g10-t24\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/10\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g10-t26\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "10", "lesson": "g10-t25", "title": "Қолжетімді қоғамдық бастама | Тәрбие әлемі"}, "lesson/g10-t26": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/10\">10-сынып</a><span> / </span><span>Волонтерлік және қайырымдылық</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>♡</span><span>10-сынып · 26/30 · 40 минут</span></div><h1>Ресурс пен есептің ашықтығы</h1><p>Волонтерлік және қайырымдылық</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/10\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Ресурс пен есептің ашықтығы» тақырыбы арқылы еріктілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</li><li>«Қажеттілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Волонтерлік — ерікті пайдалы әрекет. Көмектің қажеттігін алдымен сұраған дұрыс. Адамның қадірі мен жеке мәліметі сақталуы керек. Оқушыдан ақша жинау, жеке жағдайын жариялау немесе қауіпті жұмыс істеу талап етілмейді.</p><p>Бүгінгі назарымыз: «Ресурс пен есептің ашықтығы». Ниет пен нақты нәтиженің арасында жоспар, ресурс және жауапкершілік бар. Жобаның өлшемі мақсатына сәйкес болуы керек. Қолжетімсіз не қауіпті әрекет байқалса, жоспарды өзгертуге дайын боламыз.</p><p>Өмірлік мысал: Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау.</p><div class=\"concepts\"><span>Еріктілік</span><span>Қажеттілік</span><span>Қадір-қасиет</span><span>Әсер</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көмектің қажет екенін сұрау; бас тартуды сыйлау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Волонтерлік сағат үшін адамдардың ерікті таңдауы шектелді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Еріктілікті сақтау; балама рөл; мәжбүрлемеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Есепке адамның қиын жағдайын егжей-тегжейлі жазу ұсынылды.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қадірін сақтау; келісімсіз фото мен жеке оқиғаны жарияламау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Жобаның қауіпсіздік жоспары жоқ, оқушыларға ересек жұмысы берілді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз рөл; қауіпті міндеттен бас тарту; ересек бақылауы.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Жоба табысы тек жиналған қаржымен өлшенді.</p><p>Нақты әрекет жоспарын ұсын: мақсат, үш қадам, жауаптылар, ресурс, тәуекелді азайту және бір нәтиже көрсеткіші. Жоспардың орындалуын қалай тексеретініңді жаз.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Ресурсы мен өлшемі бар іске асатын жоспар жасайды.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ақшасыз пайдалы әрекет; нақты өзгеріс пен алушы пікірін бағалау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Кімге не қажет? — қалай сұраймыз? — қауіпсіз не ұсына аламыз?» картасын ойдан шығарылған мысалмен толтырыңдар. Жоспарлаушы және тәуелсіз тексеруші болыңдар. Бірің ұсыныс жазады, екіншің өлшем мен тәуекелді тексереді. Рөл ауыстырып, жетілдіріңдер.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көмектің қажет екенін сұрау; бас тартуды сыйлау. Мақсат ...; ресурс ...; көрсеткіш ...; тексеру жолы ... .</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ақша жинаусыз ерікті жоба құрыңдар: сұраныс, келісім, қауіпсіз әрекет, ресурс және нәтиже. Жоба үйлестірушісі, ресурс жоспарлаушы, қауіпсіздік тексерушісі, нәтиже бағалаушысы болыңдар. Бір беттік жоба паспортын және бақылау күнін ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Көмек ұсынудың әдепті жолы» үш қадамдық нұсқаулық жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Көмектің қажет екенін қалай білеміз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Еріктілік нені білдіреді? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Неге жеке оқиғаны жарияламаймыз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Қандай көмек қауіпсіз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li><li>Пайданы ақшадан бөлек қалай өлшейміз? Іске асыру шарты мен нәтиже көрсеткішін қос.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Мақсат ...; ресурс ...; кө
