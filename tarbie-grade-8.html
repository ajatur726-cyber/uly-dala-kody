арылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Әсер» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t25\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t27\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t26", "title": "Ерікті жұмыстың қауіпсіздігі | Тәрбие әлемі"}, "lesson/g08-t27": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Денсаулық және пайдалы әдеттер</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>♧</span><span>8-сынып · 27/30 · 40 минут</span></div><h1>Денсаулық ақпаратына сын көзқарас</h1><p>Денсаулық және пайдалы әдеттер</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Денсаулық ақпаратына сын көзқарас» тақырыбы арқылы әдет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Өзіне қамқорлық» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Демалыс, күн тәртібі, қауіпсіз қозғалыс және қол гигиенасы күнделікті өзіне қамқорлықтың бөлігі. Әр адамның мүмкіндігі әртүрлі. Сабақта дене салмағы, диагноз немесе жеке денсаулық ақпараты сұралмайды. Денсаулық мәселесінде сенімді ересек пен медицина маманына жүгінеді.</p><p>Бүгінгі назарымыз: «Денсаулық ақпаратына сын көзқарас». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Экран алдында ұзақ отырған соң зейін төмендеді. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p><div class=\"concepts\"><span>Әдет</span><span>Демалыс</span><span>Қозғалыс</span><span>Өзіне қамқорлық</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Экран алдында ұзақ отырған соң зейін төмендеді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Топтық чат кешке тоқтамай, демалысқа кедергі келтіреді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Демалыс шекарасын келісу; байланыс уақытын алдын ала белгілеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Қозғалыс ойыны бір оқушыға қолайсыз.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз балама; ауырсыну не жайсыздықта тоқтау; салыстырып бағаламау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Блогер өнім бәрін емдейді деді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тексерілмеген емге сенбеу; маманмен кеңесу; жарнаманы ажырату.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Досың жағдайын жасырып, ойынды жалғастырмақ.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жайсыздықты ересекке айту; демалыс пен көмекке жағдай жасау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ойдан шығарылған оқушының күніне оқу, демалыс және қауіпсіз қозғалыс уақытын үйлестіріңдер. Нақты денсаулық дерегін жазбаңдар. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Қолайлы үзіліс» картасын жасаңдар: отырып, тұрып не тыныш орындалатын үш балама. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Бір пайдалы әдет — бір шағын қадам» апталық жоспар эскизін құрыңдар. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Демалыс неге қажет? Кемінде екі түрлі адамның қажетін ескер.</li><li>Өзіне қамқорлық қалай көрінеді? Кемінде екі түрлі адамның қажетін ескер.</li><li>Әркімге бірдей қимыл міндетті ме? Кемінде екі түрлі адамның қажетін ескер.</li><li>Денсаулық ақпаратын кіммен тексереміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Жаңа әдетті кішкентай қадамнан қалай бастаймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын. Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Денсаулық ақпаратына сын көзқарас»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Денсаулық және пайдалы әдеттер» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Экран алдында ұзақ отырған соң зейін төмендеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Демалыс неге қажет? Кемінде екі түрлі адамның қажетін ескер.</li><li>Әркімге бірдей қимыл міндетті ме? Кемінде екі түрлі адамның қажетін ескер.</li><li>Жаңа әдетті кішкентай қадамнан қалай бастаймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Өзіне қамқорлық» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Денсаулық ақпаратына сын көзқарас» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Өзіне қамқорлық» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t26\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t28\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t27", "title": "Денсаулық ақпаратына сын көзқарас | Тәрбие әлемі"}, "lesson/g08-t28": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Жолдағы қауіпсіздік</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>↔</span><span>8-сынып · 28/30 · 40 минут</span></div><h1>Көрінудің маңызы</h1><p>Жолдағы қауіпсіздік</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Көрінудің маңызы» тақырыбы арқылы өткел мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Қауіпсіз бағыт» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Жолда назарды қозғалысқа аударып, белгіленген жаяу жүргінші өткелі мен бағдаршам тәртібін сақтау керек. Жас бала жолды сенімді ересекпен өтеді. Қауіпсіздік тапсырмалары тек қағазда орындалады; көлік жолында тәжірибе жасалмайды.</p><p>Бүгінгі назарымыз: «Көрінудің маңызы». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Топ өткелге бармай, жолды кесіп өтуді ұсынды. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p><div class=\"concepts\"><span>Өткел</span><span>Бағдаршам</span><span>Назар</span><span>Қауіпсіз бағыт</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Топ өткелге бармай, жолды кесіп өтуді ұсынды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Құлаққап пен телефон назарды бөледі.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жолда экранға алаңдамау; тапсырманы қауіпсіз орында тоқтатып орындау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Автобус артынан өтуді ұсынды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көрінбейтін жерден шықпау; қауіпсіз өткелге бару; ересекпен шешу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Киімдегі жарық шағылыстырғыштың қажеті талқыланды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жақсы көрінетін қауіпсіз бағыт; ересекпен маршрутты келісу; мәселені жауаптыға хабарлау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Өткелдегі белгі түсініксіз не көрінбейді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Өздігінен тәуекел етпеу; ересекке айту; қауіпсіз жерден бақылау және ұсыныс.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Қағаздағы үш маршрутты салыстырыңдар: өткелі бар ұзындау жол, өткелсіз қысқа жол, жарықсыз жол. Қауіпсіз нұсқаны негіздеңдер. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ойдан шығарылған мектеп маңындағы қауіпсіздік картасын жасаңдар. Нақты мекенжай мен күнделікті жеке маршрутты жазбаңдар. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Жолда назарым — қауіпсіздікке» үш белгісін әзірлеңдер. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қай жерден өтеміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Неге қысқа жол әрдайым қауіпсіз емес? Кемінде екі түрлі адамның қажетін ескер.</li><li>Телефон назарды қалай бөледі? Кемінде екі түрлі адамның қажетін ескер.</li><li>Көрінбейтін жерден неге шықпаймыз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Түсініксіз белгі болса кімнен көмек сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын. Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Көрінудің маңызы»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Жолдағы қауіпсіздік» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Топ өткелге бармай, жолды кесіп өтуді ұсынды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қай жерден өтеміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Телефон назарды қалай бөледі? Кемінде екі түрлі адамның қажетін ескер.</li><li>Түсініксіз белгі болса кімнен көмек сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Қауіпсіз бағыт» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.\"></textarea><label for=\"reflection-1\">«Көрінудің маңызы» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Қауіпсіз бағыт» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t27\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t29\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t28", "title": "Көрінудің маңызы | Тәрбие әлемі"}, "lesson/g08-t29": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Жеке шекара және өзара құрмет</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☂</span><span>8-сынып · 29/30 · 40 минут</span></div><h1>Цифрлық және жеке шекара</h1><p>Жеке шекара және өзара құрмет</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Цифрлық және жеке шекара» тақырыбы арқылы шекара мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Құрмет» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Әр адам өзінің затына, кеңістігіне және жеке ақпаратына қатысты шекарасын айта алады. Келісім ерікті болуы керек және оны өзгертуге болады. «Жоқ» деген жауапты сыйлаймыз. Қорқыныш не қысым болса, сенімді ересекке айтамыз.</p><p>Бүгінгі назарымыз: «Цифрлық және жеке шекара». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Досың жеке дәптеріңді рұқсатсыз оқыды. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p><div class=\"concepts\"><span>Шекара</span><span>Рұқсат</span><span>Келісім</span><span>Құрмет</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Досың жеке дәптеріңді рұқсатсыз оқыды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Топтық фотоға түскің келмеді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бас тартуды құрметтеу; келісімді қайтарып алуды ескеру; балама ұсыну.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Құрдастар жеке мәлімет айтуды достық шарты етті.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысым келісім емес; қауіпсіз бас тарту; сенімді ересектен қолдау сұрау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Досың өтінішті түсінбей, әрекетін қайталады.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Нақты әрі тыныш сөйлем; шекараны келісу; қайталанса көмек сұрау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Оқушы қауіпсіздікке қатысты сырды сақтауға уәде берді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіздікке қатысты қорқынышты құпияны жалғыз сақтамау; сенімді ересекке айту.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Қауіпсіз зат мысалымен «Мен ... қаламаймын. Оның орнына ... ұсынамын» сөйлемін жаттықтырыңдар. Бір-біріңді ұстамаңдар, қысым жасамаңдар. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Жеке және цифрлық кеңістікке арналған бес ереже құрыңдар: рұқсат, бас тарту, өзгерген келісім, құпиялық, көмек. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Рұқсат сұра — жауапты сыйла» карточкасын жасаңдар. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Жеке шекара нені қамтиды? Кемінде екі түрлі адамның қажетін ескер.</li><li>Рұқсатты неге сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Келісімді өзгертуге бола ма? Кемінде екі түрлі адамның қажетін ескер.</li><li>Қысым мен ерікті келісім қалай ажыратылады? Кемінде екі түрлі адамның қажетін ескер.</li><li>Қауіп туса кімнен көмек сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын. Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Цифрлық және жеке шекара»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Жеке шекара және өзара құрмет» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Досың жеке дәптеріңді рұқсатсыз оқыды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Жеке шекара нені қамтиды? Кемінде екі түрлі адамның қажетін ескер.</li><li>Келісімді өзгертуге бола ма? Кемінде екі түрлі адамның қажетін ескер.</li><li>Қауіп туса кімнен көмек сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Құрмет» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Цифрлық және жеке шекара» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қудалауды сахналамаңыз; кінә артпаңыз; қолдау мен сенімді ересекке жүгінуді ғана жаттықтырыңыз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Құрмет» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t28\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t30\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t29", "title": "Цифрлық және жеке шекара | Тәрбие әлемі"}, "lesson/g08-t30": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Медиасауаттылық</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⌕</span><span>8-сынып · 30/30 · 40 минут</span></div><h1>Сурет пен контексті тексеру</h1><p>Медиасауаттылық</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Сурет пен контексті тексеру» тақырыбы арқылы факт мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Контекст» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Ақпаратты бөліспес бұрын авторын, жарияланған күнін және бастапқы дерегін тексереміз. Сурет басқа оқиғаға қатысты болуы мүмкін. Пікір адамның бағасын білдіреді, ал фактіні тексеруге болады. Сенімді көрінген ЖИ мәтінінде де қате кездеседі.</p><p>Бүгінгі назарымыз: «Сурет пен контексті тексеру». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Чатқа мектеп жабылады деген дереккөзсіз хабар келді. Ойлану бағдары: Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p><div class=\"concepts\"><span>Факт</span><span>Пікір</span><span>Дереккөз</span><span>Контекст</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Алдымен тексеремін, содан кейін ғана бөлісемін.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Чатқа мектеп жабылады деген дереккөзсіз хабар келді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Ескі фото жаңа оқиғаға қатысты деп таратылды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Суреттің бастапқы контекстін, күнін және дереккөзін салыстыру.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Жарнамадағы пікір факт ретінде берілді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Факт пен пікірді ажырату; қандай өлшем мен дәлел қажет екенін сұрау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Эмоциялық тақырып мазмұндағы дерекке сәйкес емес.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тоқтау; толық мәтін мен балама сенімді деректі оқу; асықпай шешу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">ЖИ жауабы кітап атауын қате берді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Түпнұсқадан тексеру; табылмаған деректі факт деп бермеу; қатені түзету.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Ертең мектепте көрме болады» деген фактіні тексеру жолы мен «Бұл ең қызық көрме» пікірін салыстырыңдар. Нақты хабар деп қабылдамаңдар. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ақпаратты тексеру картасын құрыңдар: автор, күн, түпнұсқа, өзге сенімді дерек, тарату шешімі. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Екі ойдан шығарылған хабардың бірін тексеріп, «Неге әзірге таратпаймын?» түсіндірмесін жасаңдар. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Факт пен пікірдің айырмасы қандай? Кемінде екі түрлі адамның қажетін ескер.</li><li>Хабардың күнін неге қараймыз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Әдемі сурет дәлел бола ма? Кемінде екі түрлі адамның қажетін ескер.</li><li>ЖИ жауабын қалай тексереміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Расталмаған ақпаратты неге таратпаймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Мектептің ресми хабарын тексеру; расталмағанын таратпау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Алдымен тексеремін, содан кейін ғана бөлісемін. Мектептің ресми хабарын тексеру; расталмағанын таратпау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Сурет пен контексті тексеру»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Медиасауаттылық» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Чатқа мектеп жабылады деген дереккөзсіз хабар келді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Алдымен тексеремін, содан кейін ғана бөлісемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Факт пен пікірдің айырмасы қандай? Кемінде екі түрлі адамның қажетін ескер.</li><li>Әдемі сурет дәлел бола ма? Кемінде екі түрлі адамның қажетін ескер.</li><li>Расталмаған ақпаратты неге таратпаймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Контекст» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Алдымен тексеремін, содан кейін ғана бөлісемін.\"></textarea><label for=\"reflection-1\">«Сурет пен контексті тексеру» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Алдымен тексеремін, содан кейін ғана бөлісемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Контекст» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t29\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><span class=\"muted\">Соңғы тақырып</span></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t30", "title": "Сурет пен контексті тексеру | Тәрбие әлемі"}, "home": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><span>8-сынып</span></nav><section class=\"class-hero\"><div><span class=\"eyebrow\">30 тақырып · 150 жағдаят</span><h1>8-сыныптың<br>тәрбие қоржыны</h1><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p></div><span class=\"class-num\" aria-hidden=\"true\">08</span></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/home?section=classes\">← Басты бет</a><a class=\"btn\" href=\"#/home?section=library\">Барлық сыныптан іздеу</a></div><section class=\"filterbox\" aria-label=\"Материалды іздеу\"><label class=\"searchlabel\">Тақырып немесе кілт сөз<input id=\"search\" type=\"search\" placeholder=\"Мысалы: достық, рәміздер, қауіпсіздік…\"></label><label>Сынып<select id=\"grade-filter\"><option value=\"\">Осы сынып</option><option value=\"1\">1-сынып</option><option value=\"2\">2-сынып</option><option value=\"3\">3-сынып</option><option value=\"4\">4-сынып</option><option value=\"5\">5-сынып</option><option value=\"6\">6-сынып</option><option value=\"7\">7-сынып</option><option value=\"8\">8-сынып</option><option value=\"9\">9-сынып</option><option value=\"10\">10-сынып</option><option value=\"11\">11-сынып</option></select></label><label>Бағыт<select id=\"direction-filter\"><option value=\"\">Барлық бағыт</option><option value=\"Адал азамат\">Адал азамат</option><option value=\"Таза Қазақстан\">Таза Қазақстан</option><option value=\"Заң мен тәртіп\">Заң мен тәртіп</option><option value=\"Ұлттық мұраны қорғайық\">Ұлттық мұраны қорғайық</option><option value=\"ДосболLIKE\">ДосболLIKE</option><option value=\"Буллингтің алдын алу\">Буллингтің алдын алу</option><option value=\"Кибербуллингтің алдын алу\">Кибербуллингтің алдын алу</option><option value=\"Қоғамдық ортадағы қауіпсіздік\">Қоғамдық ортадағы қауіпсіздік</option><option value=\"Құқықтық тәртіп\">Құқықтық тәртіп</option><option value=\"Білімім — Отаныма!\">Білімім — Отаныма!</option><option value=\"Қарттар күні\">Қарттар күні</option><option value=\"Ұстаздар күні\">Ұстаздар күні</option><option value=\"Отбасы күні\">Отбасы күні</option><option
