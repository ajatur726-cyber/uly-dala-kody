n\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын. Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Құпиялық және қадір-қасиет»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Құқықтық тәртіп» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Талқылауда бір оқушыға сөз берілмеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Өзгенің сөзін тыңдау неге қажет? Кемінде екі түрлі адамның қажетін ескер.</li><li>Жеке мәліметті неге қорғау керек? Кемінде екі түрлі адамның қажетін ескер.</li><li>Көмек сұрау жолын қайдан білеміз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Бейбіт шешім» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.\"></textarea><label for=\"reflection-1\">«Құпиялық және қадір-қасиет» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Бейбіт шешім» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/Z020000345_\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы баланың құқықтары туралы</a> · Әділет АҚЖ. Мәтіні ашылды; сабақтағы құқықтық мәдениетке жалпы тірек. Жеке жағдайға құқықтық кеңес емес. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t08\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t10\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t09", "title": "Құпиялық және қадір-қасиет | Тәрбие әлемі"}, "lesson/g08-t10": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Білімім — Отаныма!</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☀</span><span>8-сынып · 10/30 · 40 минут</span></div><h1>Жоба нәтижесін дәлелдеу</h1><p>Білімім — Отаныма!</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Жоба нәтижесін дәлелдеу» тақырыбы арқылы білім мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Ортақ игілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Білім адамға мәселені түсініп, пайдалы шешім табуға көмектеседі. Отанға қызмет ету күнделікті ортаға қамқорлықтан басталады. Пайдалы бастама біреудің нақты қажетіне жауап береді; оның нәтижесі тек суретпен емес, өзгеріспен бағаланады.</p><p>Бүгінгі назарымыз: «Жоба нәтижесін дәлелдеу». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Кітап іздеуге көп уақыт кетеді. Ойлану бағдары: Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу.</p><div class=\"concepts\"><span>Білім</span><span>Пайда</span><span>Зерттеу</span><span>Ортақ игілік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Білгенімді өзіме де, ортақ игілікке де жұмсаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Кітап іздеуге көп уақыт кетеді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Оқушы тапсырмада қиналды, топ дайын жауап бергісі келеді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қадамды түсіндіру; дайын жауаппен алмастырмау; дербестікті қолдау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Өсімдік күтімі кестесі бар, бірақ орындалмайды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қарапайым кесте мен нақты бақылау; тек өлшенген деректі нәтиже деп көрсету.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Жаңа оқушы мектепте бағдарлануда қиналады.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолданушы қажетін сұрау; анық белгі, ірі мәтін және балама түсіндіру ұсыну.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Жобаны таныстырғанда тек үздік оқушылардың аты аталды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Үлесті әділ көрсету; нәтижені шынайы баяндау; қатысушылар келісімін сақтау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Білемін — кімге керек — қалай көмектесемін» үш бөлікті карта құрыңдар. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Мектепке пайдалы бастама дайындаңдар: қажеттілік, үш әрекет, жауаптылар, нәтиже белгісі. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Білгенімді өзіме де, ортақ игілікке де жұмсаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Менің білімімнің пайдасы» бір беттік суретті жоба паспортын жасаңдар. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Білім кімге көмектеседі? Кемінде екі түрлі адамның қажетін ескер.</li><li>Біреудің қажет екенін қалай білеміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Көмек пен орнына орындаудың айырмасы қандай? Кемінде екі түрлі адамның қажетін ескер.</li><li>Пайдалы істің нәтижесін қалай тексереміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Жобаны жалғастыру үшін не керек? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Білгенімді өзіме де, ортақ игілікке де жұмсаймын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Білгенімді өзіме де, ортақ игілікке де жұмсаймын. Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Жоба нәтижесін дәлелдеу»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Білімім — Отаныма!» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Кітап іздеуге көп уақыт кетеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Білгенімді өзіме де, ортақ игілікке де жұмсаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Білім кімге көмектеседі? Кемінде екі түрлі адамның қажетін ескер.</li><li>Көмек пен орнына орындаудың айырмасы қандай? Кемінде екі түрлі адамның қажетін ескер.</li><li>Жобаны жалғастыру үшін не керек? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Ортақ игілік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Білгенімді өзіме де, ортақ игілікке де жұмсаймын.\"></textarea><label for=\"reflection-1\">«Жоба нәтижесін дәлелдеу» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Білгенімді өзіме де, ортақ игілікке де жұмсаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Ортақ игілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t09\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t11\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t10", "title": "Жоба нәтижесін дәлелдеу | Тәрбие әлемі"}, "lesson/g08-t11": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Қарттар күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>✿</span><span>8-сынып · 11/30 · 40 минут</span></div><h1>Үлкеннің тәжірибесін тіркеу</h1><p>Қарттар күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Үлкеннің тәжірибесін тіркеу» тақырыбы арқылы құрмет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Дербестік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Үлкенге құрмет — тыңдау, сыпайы сөйлесу және көмекті рұқсатпен ұсыну. Адамның жасына қарап оның мүмкіндігін болжауға болмайды. Қарт кісі де өз таңдауын өзі жасайды. Сұхбатты жазуға және жариялауға бөлек келісім қажет.</p><p>Бүгінгі назарымыз: «Үлкеннің тәжірибесін тіркеу». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Ерікті көмек ұсынысын қарт кісі қабылдамады. Ойлану бағдары: Көмекті сыпайы ұсыну; бас тартуды құрметтеу.</p><div class=\"concepts\"><span>Құрмет</span><span>Тәжірибе</span><span>Келісім</span><span>Дербестік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Құрмет — адамның таңдауын да сыйлау.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 1 қазан</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Ерікті көмек ұсынысын қарт кісі қабылдамады.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көмекті сыпайы ұсыну; бас тартуды құрметтеу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Сұхбатта оқушылар дайын сұрақтан ауытқыған әңгімені тоқтатты.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бөлмей тыңдау; сұрақты жұмсақ нақтылау; адамды дерек көзі ретінде ғана көрмеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Қарт кісі суретін жарияламауды өтінді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Фото мен жариялау үшін келісім сұрау; қажет болса суретсіз есеп беру.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Топ қарт кісінің цифрлық дағдысын сұрамай, бәрін өзі істеді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Дағдыны жорамалдамай сұрау; қажет көмекті адамның өзімен келісу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Кездесу орнына баспалдақпен көтерілу қиын болды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз, қолжетімді орын таңдауды жауапты ересекпен келісу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Үлкен кісіге қойылатын үш сыпайы сұрақ пен көмекті рұқсатпен ұсынатын бір сөйлем дайындаңдар. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көмекті сыпайы ұсыну; бас тартуды құрметтеу. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ұрпақтар кездесуін жоспарлаңдар: қолжетімді орын, ерікті қатысу, сұрақтар және келісім. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Құрмет — адамның таңдауын да сыйлау.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Тыңдай білу — құрмет» шағын ашықхатын жасаңыздар. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Құрмет қалай көрінеді? Кемінде екі түрлі адамның қажетін ескер.</li><li>Көмек ұсынар алдында не сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Неге адамның мүмкіндігін жасына қарап шешпейміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Сұхбатты жариялауға қандай келісім керек? Кемінде екі түрлі адамның қажетін ескер.</li><li>Кездесуді бәріне қолжетімді қалай етеміз? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Құрмет — адамның таңдауын да сыйлау.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Көмекті сыпайы ұсыну; бас тартуды құрметтеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Құрмет — адамның таңдауын да сыйлау. Көмекті сыпайы ұсыну; бас тартуды құрметтеу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Үлкеннің тәжірибесін тіркеу»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Қарттар күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Ерікті көмек ұсынысын қарт кісі қабылдамады.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Көмекті сыпайы ұсыну; бас тартуды құрметтеу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Құрмет — адамның таңдауын да сыйлау.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Құрмет қалай көрінеді? Кемінде екі түрлі адамның қажетін ескер.</li><li>Неге адамның мүмкіндігін жасына қарап шешпейміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Кездесуді бәріне қолжетімді қалай етеміз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Дербестік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Құрмет — адамның таңдауын да сыйлау.\"></textarea><label for=\"reflection-1\">«Үлкеннің тәжірибесін тіркеу» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Құрмет — адамның таңдауын да сыйлау.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Дербестік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://old.adilet.zan.kz/kaz/docs/P1700000689\" target=\"_blank\" rel=\"noopener noreferrer\">Қазақстан Республикасындағы мерекелік күндердің тізбесі</a> · Әділет АҚЖ. Мәтіні ашылып, тиісті мерекелік күндер тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t10\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t12\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t11", "title": "Үлкеннің тәжірибесін тіркеу | Тәрбие әлемі"}, "lesson/g08-t12": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Ұстаздар күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>✎</span><span>8-сынып · 12/30 · 40 минут</span></div><h1>Мектептегі әдепті байланыс</h1><p>Ұстаздар күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Мектептегі әдепті байланыс» тақырыбы арқылы ұстаз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Серіктестік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Ұстаз еңбегі сабақ түсіндірумен шектелмейді: ол дайындалады, кері байланыс береді, оқуға жағдай жасайды. Алғыс қымбат сыйлыққа тәуелді емес. Құрметпен сұрақ қоюға және түсінбегеніңді айтуға болады. Алғыс шарасына қатысу ерікті болуы керек.</p><p>Бүгінгі назарымыз: «Мектептегі әдепті байланыс». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Сынып міндетті ақша жинауды ұсынды. Ойлану бағдары: Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау.</p><div class=\"concepts\"><span>Ұстаз</span><span>Еңбек</span><span>Алғыс</span><span>Серіктестік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Шынайы алғыс нақты әрекеттен көрінеді.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> 5 қазан</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Сынып міндетті ақша жинауды ұсынды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Оқушы мұғалім түсіндірмесін түсінбей қалды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тыныш, нақты сұрақ қою; жеке талқылау мен мектептің қарау жолын пайдалану.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Топтық тапсырмада оқушылар бір-бірінің сөзін бөлді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тыңдау және міндеттерді келісу; мәселені тұлғаны кінәламай атау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Баяндамашы болғысы келмеген оқушыны мәжбүрледі.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қатысуды және рөлді ерікті таңдау; балама ұсыну.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Топ мұғалімнің жеке фотосын рұқсатсыз қолданды.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолдануға рұқсат алу; жеке өмірге қол сұқпай, еңбекке назар аудару.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ұстаздың бір нақты көмегі мен оған арналған шынайы алғыс сөйлемін ойдан шығарылған мысалмен құрыңдар. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Сыйлықсыз құрмет апталығын жоспарлаңдар: тыңдау, ұқыптылық, өзара көмек туралы үш ерікті іс. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Шынайы алғыс нақты әрекеттен көрінеді.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Ұстаз еңбегінің бір күні» суретті жолақ жасаңыздар. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Ұстаз еңбегінің қандай бөлігі байқалмай қалады? Кемінде екі түрлі адамның қажетін ескер.</li><li>Алғыс міндетті сыйлықты қажет ете ме? Кемінде екі түрлі адамның қажетін ескер.</li><li>Түсінбегенді қалай сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Өзара құрмет неден көрінеді? Кемінде екі түрлі адамның қажетін ескер.</li><li>Ерікті қатысуды қалай сақтаймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Шынайы алғыс нақты әрекеттен көрінеді.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Шынайы алғыс нақты әрекеттен көрінеді. Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Мектептегі әдепті байланыс»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Ұстаздар күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Сынып міндетті ақша жинауды ұсынды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Шынайы алғыс нақты әрекеттен көрінеді.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Ұстаз еңбегінің қандай бөлігі байқалмай қалады? Кемінде екі түрлі адамның қажетін ескер.</li><li>Түсінбегенді қалай сұраймыз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Ерікті қатысуды қалай сақтаймыз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Серіктестік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Шынайы алғыс нақты әрекеттен көрінеді.\"></textarea><label for=\"reflection-1\">«Мектептегі әдепті байланыс» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Шынайы алғыс нақты әрекеттен көрінеді.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Серіктестік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://www.gov.kz/memleket/entities/kgd/press/news/details/631204\" target=\"_blank\" rel=\"noopener noreferrer\">5 қазан — Дүниежүзілік мұғалімдер күні</a> · gov.kz. Ресми хабардағы мереке күні тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g08-t11\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/8\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g08-t13\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "8", "lesson": "g08-t12", "title": "Мектептегі әдепті байланыс | Тәрбие әлемі"}, "lesson/g08-t13": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/8\">8-сынып</a><span> / </span><span>Отбасы күні</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⌂</span><span>8-сынып · 13/30 · 40 минут</span></div><h1>Отбасылық ақпараттың құпиялығы</h1><p>Отбасы күні</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/8\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Отбасылық ақпараттың құпиялығы» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</li><li>«Жеке кеңістік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Отбасы мен қамқор адамдар әртүрлі болады. Жылы сөз, қауіпсіз көмек және бір-бірін тыңдау жақындықты нығайтады. Үйдегі міндет жас пен мүмкіндікке сай бөлінеді. Отбасы туралы жеке мәліметті көпшілікке айтуға ешкім міндетті емес.</p><p>Бүгінгі назарымыз: «Отбасылық ақпараттың құпиялығы». Ортақ шешім әртүрлі мүдделерге әсер етеді. Бір адамның ыңғайы басқа адамға кедергі болуы мүмкін. Қолайлы шешім табу үшін мүдделерді, ресурсты және шешімді қайта қарау мүмкіндігін талдаймыз.</p><p>Өмірлік мысал: Үйдегі қауіпсіз жұмыстар бір адамға ғана жүктеледі. Ойлану бағдары: Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.</p><div class=\"concepts\"><span>Қамқорлық</span><span>Тыңдау</span><span>Келісім</span><span>Жеке кеңістік</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.</p></div><p class=\"date-note\"><strong>Мереке күні:</strong> Қыркүйектің екінші жексенбісі</p></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Үйдегі қауіпсіз жұмыстар бір адамға ғана жүктеледі.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Үйде ортақ уақытты қалай өткізу туралы пікірлер бөлінді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бір-бірін тыңдау; нақты қажеттілік пен мүмкіндікті атау; келісім жолын іздеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Сабақта отбасы құрамы туралы бәріне айту талап етілді.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жеке ақпаратты айтпау құқығын сақтау; ойдан шығарылған мысал қолдану.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Біреудің бөлмесіне сұрамай кіріп кеттің.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Шекара мен демалысты сыйлау; рұқсат сұрау; таратылған деректі өшіруді келісу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Топ тек бір отбасы үлгісін дұрыс деп атады.</p><p>Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Мүдделер мен үш өлшемді ескеріп шешім негіздейді.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Отбасы құрамын салыстырып бағаламау; қамқор адамды еркін таңдауға мүмкіндік беру.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ойдан шығарылған үйдегі үш қауіпсіз міндетті жас пен мүмкіндікке сай бөлісіңдер. Бірің қатысушылардың қажеттілігін, екіншің тәуекел мен кедергіні тірке. Бірігіп ортақ шешім және қайта қарау шартын жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Бірге тыңдаймыз, бірге келісеміз» отбасылық кездесу картасын жасаңыздар; жеке дерек қоспаңдар. Мүдде талдаушы, ресурс талдаушы, хатшы, модератор болыңдар. Ұсыныстың кімге қолжетімді екенін тексеріп, жетілдірілген нұсқа ұсыныңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Кез келген қамқор адамға арналған ризашылық ашықхатын жасаңдар. Екі шешімді салыстыру элементін қос.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қамқорлық қандай әрекеттен көрінеді? Кемінде екі түрлі адамның қажетін ескер.</li><li>Міндетті қалай әділ бөлеміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Жеке мәліметті неге бөлісу міндетті емес? Кемінде екі түрлі адамның қажетін ескер.</li><li>Келіспегенде қалай сөйлесеміз? Кемінде екі түрлі адамның қажетін ескер.</li><li>Әртүрлі отбасыларды қалай құрметтейміз? Кемінде екі түрлі адамның қажетін ескер.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз. Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын. Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Отбасылық ақпараттың құпиялығы»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 8-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Отбасы күні» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Кемінде екі түрлі адамның қажетін ескер.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Үйдегі қауіпсіз жұмыстар бір адамға ғана жүктеледі.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Бұл шешім ... қажетіне жауап береді; ... тәуекелін ... арқылы азайтамыз.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қамқорлық қандай әрекеттен көрінеді? Кемінде екі түрлі адамның қажетін ескер.</li><li>Жеке мәліметті неге бөлісу міндетті емес? Кемінде екі түрлі адамның қажетін ескер.</li><li>Әртүрлі отбасыларды қалай құрметтейміз? Кемінде екі түрлі адамның қажетін ескер.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Өзгерткен пікірім — оның себебі» тәсілін қолдан.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Жеке кеңістік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.\"></textarea><label for=\"reflection-1\">«Отбасылық ақпараттың құпиялығы» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қамқорлықты бағалаймын, жеке кеңістікті сыйлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Кемінде үш қатысушының мүддесін анықта. Екі шешімді қауіпсіздік, әділдік және қолжетімділік өлшемімен салыстыр. Қайта қарау шартын қос.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Мүдделер мен үш өлшемді ескеріп шешім негі
