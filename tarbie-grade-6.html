window.TARBIE_CATALOG=[{"id": "g06-t01", "grade": 6, "topic": 1, "title": "Ортақ еңбектегі адалдық", "direction": "Адал азамат", "icon": "✦", "search": "Ортақ еңбектегі адалдық Адал азамат «Ортақ еңбектегі адалдық» тақырыбы арқылы адалдық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Адалдық — өз әрекетің туралы шын айту және өзгенің еңбегін иемденбеу. Қателескен адам оны мойындап, түзете алады. Әділдік әр адамның үлесін және қажет қолдауын ескеруді талап етеді. Бүгінгі назарымыз: «Ортақ еңбектегі адалдық». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Досың табылған флешканы өзіне қалдырмақ. Оның ішінде біреудің жұмысы болуы мүмкін. Ойлану бағдары: Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу. Досың табылған флешканы өзіне қалдырмақ. Оның ішінде біреудің жұмысы болуы мүмкін. Топ плакаты бүлінді. Оған қатысы жоқ оқушы кінәлі болып қалды. Топқа керек материалды уақытында дайындамадың. Қалғандар күтіп отыр. Топ жұмысында авторлардың біреуінің аты көрсетілмеді. Топтағы жеңіл рөлдер достарға, қиын рөл бір балаға берілді.", "path": "#/lesson/g06-t01"}, {"id": "g06-t02", "grade": 6, "topic": 2, "title": "Аз қалдық — саналы таңдау", "direction": "Таза Қазақстан", "icon": "♧", "search": "Аз қалдық — саналы таңдау Таза Қазақстан «Аз қалдық — саналы таңдау» тақырыбы арқылы тазалық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Таза орта күнделікті ұсақ әрекеттерден құралады. Қалдықты азайту, суды ысырап етпеу және ортақ орынды ұқыпты пайдалану маңызды. Тазалық жұмысы қауіпсіз болуы керек; шыны мен белгісіз затты балалар жинамайды. Бүгінгі назарымыз: «Аз қалдық — саналы таңдау». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Мектеп шарасынан соң таза қағаздар аралас қоқысқа кетті. Ойлану бағдары: Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру. Мектеп шарасынан соң таза қағаздар аралас қоқысқа кетті. Мектеп краны тамшылайды. Оқушылар бұл туралы кімге айтуды білмейді. Тазалық тобы белгісіз сұйықтық құйылған ыдыс тапты. Көгалға қысқа жол салу өсімдіктерді бүлдірді. Сынып әр жиналысқа жаңа плакат сатып алады.", "path": "#/lesson/g06-t02"}, {"id": "g06-t03", "grade": 6, "topic": 3, "title": "Ереже өзгерсе, не істейміз?", "direction": "Заң мен тәртіп", "icon": "⚖", "search": "Ереже өзгерсе, не істейміз? Заң мен тәртіп «Ереже өзгерсе, не істейміз?» тақырыбы арқылы ереже мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ереже адамдардың бірге қауіпсіз өмір сүруіне көмектеседі. Мектептің күнделікті ережесі мен мемлекет заңының қызметі бірдей емес. Түсініксіз талапты сұрақ қою және ұсыныс білдіру арқылы нақтылауға болады. Бұл сабақ нақты құқықтық кеңес бермейді. Бүгінгі назарымыз: «Ереже өзгерсе, не істейміз?». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Асхана кезегін кей оқушылар үнемі бұзады. Ойлану бағдары: Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну. Асхана кезегін кей оқушылар үнемі бұзады. Жарыс шарты басталғаннан кейін өзгерді. Топ «бәрі солай істейді» деп қауіпсіздік талабын бұзуды ұсынды. Жаңа ереже не үшін керек екенін ешкім түсіндірмеді. Ортақ құралды қайтару тәртібі орындалмайды.", "path": "#/lesson/g06-t03"}, {"id": "g06-t04", "grade": 6, "topic": 4, "title": "Тіл мен дәстүр сабақтастығы", "direction": "Ұлттық мұраны қорғайық", "icon": "❖", "search": "Тіл мен дәстүр сабақтастығы Ұлттық мұраны қорғайық «Тіл мен дәстүр сабақтастығы» тақырыбы арқылы мұра мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мұраға тіл, өнер, дәстүр, тарихи орын мен тұрмыстық бұйым жатады. Оны сақтау — бүлдірмеу, мағынасын білу және дерегін бұрмаламай жеткізу. Бір бұйым туралы әртүрлі әңгіме болуы мүмкін; авторын және дереккөзін нақтылау пайдалы. Бүгінгі назарымыз: «Тіл мен дәстүр сабақтастығы». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Көрмеде экспонатпен селфи үшін қоршаудан өтуді ұсынды. Ойлану бағдары: Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану. Көрмеде экспонатпен селфи үшін қоршаудан өтуді ұсынды. Бір оюдың мағынасы туралы екі түрлі түсіндірме таптың. Топта бір оқушы мұра туралы ойды басқа тілде жеткізді. Интернеттен алынған қолөнер суретінің авторы көрсетілмеді. Сұхбат беруші әңгімесінің бір бөлігін жарияламауды өтінді.", "path": "#/lesson/g06-t04"}, {"id": "g06-t05", "grade": 6, "topic": 5, "title": "Топта әркімнің үні маңызды", "direction": "ДосболLIKE", "icon": "♡", "search": "Топта әркімнің үні маңызды ДосболLIKE «Топта әркімнің үні маңызды» тақырыбы арқылы достық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Достық тыңдау, сенім және ерікті қолдауға сүйенеді. Дос болу барлық ұсынысқа келісу дегенді білдірмейді. Өз шекараңды айтып, өзгенің таңдауын сыйлауға болады. Қауіп төнсе, мәселені жалғыз шешуге міндетті емессің. Бүгінгі назарымыз: «Топта әркімнің үні маңызды». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Сыныпқа жаңадан келген оқушы топқа қосыла алмады. Ойлану бағдары: Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу. Сыныпқа жаңадан келген оқушы топқа қосыла алмады. Топ бос уақытты өткізу жайында келіспеді. Досың «қазір сөйлескім келмейді» деді. Досың достықты дәлелдеу үшін ережені бұзуды сұрады. Топ жұмысында сөзді екі адам ғана алды.", "path": "#/lesson/g06-t05"}, {"id": "g06-t06", "grade": 6, "topic": 6, "title": "Куәгердің қауіпсіз көмегі", "direction": "Буллингтің алдын алу", "icon": "☂", "search": "Куәгердің қауіпсіз көмегі Буллингтің алдын алу «Куәгердің қауіпсіз көмегі» тақырыбы арқылы қолдау мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Біреуді қайта-қайта қорлау, қорқыту не шеттету — көмек қажет ететін жағдай. Оған ұшыраған бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтуға болады. Бір рет болған ауыр әрекетті де елемеуге болмайды. Бұл сабақта қорлау сөздері мен көріністері қайталанбайды. Бүгінгі назарымыз: «Куәгердің қауіпсіз көмегі». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Бір оқушыны топқа үнемі қоспай қояды. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Бір оқушыны топқа үнемі қоспай қояды. Қысым көрген оқушы мұғалімге барса, одан сайын мазақтайды деп қорқады. Куәгерлер «біз араласпадық» дейді, бірақ мазақтауға күліп қосылады. Оқушыдан бәрінің алдында не болғанын айтып беруді сұрады. Көмек сұрағаннан кейін жағдай тоқтамады.", "path": "#/lesson/g06-t06"}, {"id": "g06-t07", "grade": 6, "topic": 7, "title": "Кибербуллинг: қолдау және шағым", "direction": "Кибербуллингтің алдын алу", "icon": "▣", "search": "Кибербуллинг: қолдау және шағым Кибербуллингтің алдын алу «Кибербуллинг: қолдау және шағым» тақырыбы арқылы кибербуллинг мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Цифрлық ортада қорлау, қорқыту және келісімсіз контент тарату адамға зиян тигізеді. Жауап ретінде қорлаудың қажеті жоқ. Қауіпсіздік үшін сенімді ересекпен бірге шағымдану және бұғаттау мүмкіндігін қарастыруға болады. Куәгер ренжітетін материалды әрі қарай таратпайды. Бүгінгі назарымыз: «Кибербуллинг: қолдау және шағым». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Чатта бір оқушыға қайта-қайта кемсітетін хабар келеді. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Чатта бір оқушыға қайта-қайта кемсітетін хабар келеді. Чатқа келісімсіз өңделген фото келді. Жалған аккаунт сыныптасыңның атын пайдаланып жүр. Досың телефонын алып қояды деп ересекке айтуға қорқады. Ренжіткен контент өшірілді, бірақ оны басқа адамдар қайта жіберді.", "path": "#/lesson/g06-t07"}, {"id": "g06-t08", "grade": 6, "topic": 8, "title": "Топпен жүргендегі жауапкершілік", "direction": "Қоғамдық ортадағы қауіпсіздік", "icon": "⌂", "search": "Топпен жүргендегі жауапкершілік Қоғамдық ортадағы қауіпсіздік «Топпен жүргендегі жауапкершілік» тақырыбы арқылы кездесу орны мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қоғамдық жерде алдын ала келісілген бағыт пен кездесу орны көмектеседі. Бейтаныс адамға еріп кетпеу, қауіпті затты ұстамау және жауапты қызметкерден көмек сұрау маңызды. Қауіпсіздікке күмән туса, сенімді ересекпен бірге шешім қабылда. Бүгінгі назарымыз: «Топпен жүргендегі жауапкершілік». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Сапарда топтан ажырап қалдың, кездесу орнын білесің. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Сапарда топтан ажырап қалдың, кездесу орнын білесің. Бейтаныс адам қысқа жол көрсетемін деп ертпек. Қоғамдық орында иесіз зат байқалды. Шарада шығу жолын заттар жауып тұр. Топ рұқсатсыз аумаққа кіріп фото жасағысы келеді.", "path": "#/lesson/g06-t08"}, {"id": "g06-t09", "grade": 6, "topic": 9, "title": "Тыңдалу және жауапкершілік", "direction": "Құқықтық тәртіп", "icon": "⚑", "search": "Тыңдалу және жауапкершілік Құқықтық тәртіп «Тыңдалу және жауапкершілік» тақырыбы арқылы құқық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр баланың қадір-қасиеті мен қауіпсіздігі маңызды. Пікір айту кезінде өзгенің де сөзін тыңдау қажет. Құқықтар жақсы мінез үшін берілетін сыйлық емес. Келіспеушілікті тыныш талқылап, қажет болса сенімді ересектің көмегін сұраймыз. Бүгінгі назарымыз: «Тыңдалу және жауапкершілік». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Талқылауда бір оқушыға сөз берілмеді. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Талқылауда бір оқушыға сөз берілмеді. Біреу жеке дәптердегі жазбаны оқып берді. Ортақ құралды қолдануға байланысты дау туды. Тәртіп бұзған оқушының пікірін енді тыңдамау ұсынылды. Оқушы өзіне әділетсіз қаралғанын кімге айтатынын білмейді.", "path": "#/lesson/g06-t09"}, {"id": "g06-t10", "grade": 6, "topic": 10, "title": "Білгенімді бөлісудің әдебі", "direction": "Білімім — Отаныма!", "icon": "☀", "search": "Білгенімді бөлісудің әдебі Білімім — Отаныма! «Білгенімді бөлісудің әдебі» тақырыбы арқылы білім мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Білім адамға мәселені түсініп, пайдалы шешім табуға көмектеседі. Отанға қызмет ету күнделікті ортаға қамқорлықтан басталады. Пайдалы бастама біреудің нақты қажетіне жауап береді; оның нәтижесі тек суретпен емес, өзгеріспен бағаланады. Бүгінгі назарымыз: «Білгенімді бөлісудің әдебі». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Кітап іздеуге көп уақыт кетеді. Ойлану бағдары: Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу. Кітап іздеуге көп уақыт кетеді. Оқушы тапсырмада қиналды, топ дайын жауап бергісі келеді. Өсімдік күтімі кестесі бар, бірақ орындалмайды. Жаңа оқушы мектепте бағдарлануда қиналады. Жобаны таныстырғанда тек үздік оқушылардың аты аталды.", "path": "#/lesson/g06-t10"}, {"id": "g06-t11", "grade": 6, "topic": 11, "title": "Қамқорлық пен дербестік", "direction": "Қарттар күні", "icon": "✿", "search": "Қамқорлық пен дербестік Қарттар күні «Қамқорлық пен дербестік» тақырыбы арқылы құрмет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Үлкенге құрмет — тыңдау, сыпайы сөйлесу және көмекті рұқсатпен ұсыну. Адамның жасына қарап оның мүмкіндігін болжауға болмайды. Қарт кісі де өз таңдауын өзі жасайды. Сұхбатты жазуға және жариялауға бөлек келісім қажет. Бүгінгі назарымыз: «Қамқорлық пен дербестік». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Ерікті көмек ұсынысын қарт кісі қабылдамады. Ойлану бағдары: Көмекті сыпайы ұсыну; бас тартуды құрметтеу. Ерікті көмек ұсынысын қарт кісі қабылдамады. Сұхбатта оқушылар дайын сұрақтан ауытқыған әңгімені тоқтатты. Қарт кісі суретін жарияламауды өтінді. Топ қарт кісінің цифрлық дағдысын сұрамай, бәрін өзі істеді. Кездесу орнына баспалдақпен көтерілу қиын болды.", "path": "#/lesson/g06-t11"}, {"id": "g06-t12", "grade": 6, "topic": 12, "title": "Алғыс пен еріктілік", "direction": "Ұстаздар күні", "icon": "✎", "search": "Алғыс пен еріктілік Ұстаздар күні «Алғыс пен еріктілік» тақырыбы арқылы ұстаз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ұстаз еңбегі сабақ түсіндірумен шектелмейді: ол дайындалады, кері байланыс береді, оқуға жағдай жасайды. Алғыс қымбат сыйлыққа тәуелді емес. Құрметпен сұрақ қоюға және түсінбегеніңді айтуға болады. Алғыс шарасына қатысу ерікті болуы керек. Бүгінгі назарымыз: «Алғыс пен еріктілік». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Сынып міндетті ақша жинауды ұсынды. Ойлану бағдары: Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау. Сынып міндетті ақша жинауды ұсынды. Оқушы мұғалім түсіндірмесін түсінбей қалды. Топтық тапсырмада оқушылар бір-бірінің сөзін бөлді. Баяндамашы болғысы келмеген оқушыны мәжбүрледі. Топ мұғалімнің жеке фотосын рұқсатсыз қолданды.", "path": "#/lesson/g06-t12"}, {"id": "g06-t13", "grade": 6, "topic": 13, "title": "Үйдегі келісім мәдениеті", "direction": "Отбасы күні", "icon": "⌂", "search": "Үйдегі келісім мәдениеті Отбасы күні «Үйдегі келісім мәдениеті» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отбасы мен қамқор адамдар әртүрлі болады. Жылы сөз, қауіпсіз көмек және бір-бірін тыңдау жақындықты нығайтады. Үйдегі міндет жас пен мүмкіндікке сай бөлінеді. Отбасы туралы жеке мәліметті көпшілікке айтуға ешкім міндетті емес. Бүгінгі назарымыз: «Үйдегі келісім мәдениеті». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Үйдегі қауіпсіз жұмыстар бір адамға ғана жүктеледі. Ойлану бағдары: Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу. Үйдегі қауіпсіз жұмыстар бір адамға ғана жүктеледі. Үйде ортақ уақытты қалай өткізу туралы пікірлер бөлінді. Сабақта отбасы құрамы туралы бәріне айту талап етілді. Біреудің бөлмесіне сұрамай кіріп кеттің. Топ тек бір отбасы үлгісін дұрыс деп атады.", "path": "#/lesson/g06-t13"}, {"id": "g06-t14", "grade": 6, "topic": 14, "title": "Ел мен жерге жауапкершілік", "direction": "Республика күні", "icon": "☀", "search": "Ел мен жерге жауапкершілік Республика күні «Ел мен жерге жауапкершілік» тақырыбы арқылы республика мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Республика күні елдің мемлекеттілігі мен ортақ болашағы туралы ойлануға мүмкіндік береді. Елге құрмет сөзбен де, қоғамдық мүлікті сақтау мен адамдарға сыйластық таныту арқылы да көрінеді. Әр адамның қауіпсіз, шамасына сай пайдалы іс жасауына болады. Бүгінгі назарымыз: «Ел мен жерге жауапкершілік». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Мектеп мерекесінен кейін залды реттейтін адам белгіленбеді. Ойлану бағдары: Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау. Мектеп мерекесінен кейін залды реттейтін адам белгіленбеді. Өңірлер туралы әңгімеде бір елді мекенді кемсіту айтылды. Сынып мерекелік суретті қоғамдық мүлікке рұқсатсыз салмақ. Ел туралы таныстырылымда тексерілмеген мәлімет бар. Шараға кей оқушылар қатыса алмай қалды.", "path": "#/lesson/g06-t14"}, {"id": "g06-t15", "grade": 6, "topic": 15, "title": "Жарнама және саналы сатып алу", "direction": "Ұлттық валюта — теңге", "icon": "₸", "search": "Жарнама және саналы сатып алу Ұлттық валюта — теңге «Жарнама және саналы сатып алу» тақырыбы арқылы теңге мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Теңге — Қазақстанның ұлттық валютасы. Ақшаны жоспарлау қажеттілік пен қалауды ажыратудан басталады. Оқу тапсырмасында тек ойдан шығарылған сома қолданылады. Жеке қаржы, банк картасының дерегі немесе құпия код сұралмайды. Бүгінгі назарымыз: «Жарнама және саналы сатып алу». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Ойдан шығарылған 2000 теңгеге оқу құралы мен тәтті таңдауы берілді. Ойлану бағдары: Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау. Ойдан шығарылған 2000 теңгеге оқу құралы мен тәтті таңдауы берілді. Құрдастар қымбат затқа ақша жұмсауға қысым жасады. Ойын ішіндегі сатып алу тегін сияқты көрсетілді. Төлемді қайтару үшін құпия код жіберуді өтінді. Арзан өнім тез бұзылуы мүмкін, салыстыру керек.", "path": "#/lesson/g06-t15"}, {"id": "g06-t16", "grade": 6, "topic": 16, "title": "Рәміз бейнесін ұқыпты қолдану", "direction": "Мемлекеттік рәміздер", "icon": "☀", "search": "Рәміз бейнесін ұқыпты қолдану Мемлекеттік рәміздер «Рәміз бейнесін ұқыпты қолдану» тақырыбы арқылы ту мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қазақстанның мемлекеттік рәміздері — Ту, Елтаңба және Әнұран. Олар елдің біртұтастығы мен мемлекеттілігін танытады. Рәміз туралы мәліметті ресми дереккөзден тексерген дұрыс. Қолдан жасалған оюды ресми рәміздің дәл көшірмесі деп таныстыруға болмайды. Бүгінгі назарымыз: «Рәміз бейнесін ұқыпты қолдану». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Плакаттағы рәміз суретінің бір бөлігі қате. Ойлану бағдары: Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау. Плакаттағы рәміз суретінің бір бөлігі қате. Рәсім тәртібін білмеген оқушыға өзгелер күлді. Интернетте рәміз мағынасының екі түрлі түсіндірмесі бар. Мерекелік материалды сақтайтын орын белгіленбеген. Сынып таныстырылымда автор мен дереккөзді көрсетпеді.", "path": "#/lesson/g06-t16"}, {"id": "g06-t17", "grade": 6, "topic": 17, "title": "Тарихи дерекке құрмет", "direction": "Тәуелсіздік күні", "icon": "✦", "search": "Тарихи дерекке құрмет Тәуелсіздік күні «Тарихи дерекке құрмет» тақырыбы арқылы тәуелсіздік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Тәуелсіздік — елдің өз болашағын өзі айқындауымен байланысты ұғым. Бейбіт өмірді бағалау, тарихи деректі бұрмаламау және өзгенің қадірін сыйлау маңызды. Азаматтық жауапкершілік ортақ ортаға қамқорлықтан көрінеді. Бүгінгі назарымыз: «Тарихи дерекке құрмет». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Мерекелік шарада ортақ мүлікке зиян келді. Ойлану бағдары: Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету. Мерекелік шарада ортақ мүлікке зиян келді. Тарихты талқылауда бір пікірге күлді. Плакатта тарихи жыл қате көрсетілді. Сынып шарасында кей оқушыға рөл жетпеді. Оқушы пайдалы іс тек үлкендерге байланысты деді.", "path": "#/lesson/g06-t17"}, {"id": "g06-t18", "grade": 6, "topic": 18, "title": "Мамандықтағы күнделікті еңбек", "direction": "Мамандық таңдау және еңбек", "icon": "⚙", "search": "Мамандықтағы күнделікті еңбек Мамандық таңдау және еңбек «Мамандықтағы күнделікті еңбек» тақырыбы арқылы еңбек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мамандық қоғамдағы белгілі бір қажеттілікке жауап береді. Таңдауда қызығушылық, дағды, оқу жолы және еңбек жағдайы ескеріледі. Кәсіпті адамның жынысына немесе отбасы жағдайына қарап шектеуге болмайды. Бірден түпкілікті шешімге келу міндетті емес. Бүгінгі назарымыз: «Мамандықтағы күнделікті еңбек». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Топ тек беделді кәсіптерді маңызды деп атады. Ойлану бағдары: Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу. Топ тек беделді кәсіптерді маңызды деп атады. Оқушы досы таңдаған үйірмеге қызықпаса да бармақ. Кәсіп таныстыруда гендерлік стереотип айтылды. Үйірмеде қауіпсіздік нұсқауы берілмеген. Мамандық туралы бейне күнделікті қиындықты айтпады.", "path": "#/lesson/g06-t18"}, {"id": "g06-t19", "grade": 6, "topic": 19, "title": "Алаяқтық белгілерін тану", "direction": "Интернеттегі қауіпсіздік", "icon": "▤", "search": "Алаяқтық белгілерін тану Интернеттегі қауіпсіздік «Алаяқтық белгілерін тану» тақырыбы арқылы жеке дерек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жеке дерекке аты-жөн, мекенжай, құпиясөз және растау коды сияқты мәлімет жатады. Күдікті сілтеме мен шұғыл талапты бірден орындамай, ресми арнадан тексерген дұрыс. Сабақта нақты құпиясөз жасалмайды және ешкімнің аккаунты ашылмайды. Бүгінгі назарымыз: «Алаяқтық белгілерін тану». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Белгісіз сауалнама мекенжай мен туған күнді сұрайды. Ойлану бағдары: Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Белгісіз сауалнама мекенжай мен туған күнді сұрайды. Жүлде алу үшін сілтемеге кіріп тіркелу сұралды. Бір аккаунт үшін достарға ортақ құпиясөз ұсынылды. Қолданба қызметіне қатысы жоқ камера рұқсатын сұрады. Онлайн таныс жеке кездесу орнын ұсынды.", "path": "#/lesson/g06-t19"}, {"id": "g06-t20", "grade": 6, "topic": 20, "title": "Алғыс және өзара құрмет", "direction": "Алғыс айту күні", "icon": "✿", "search": "Алғыс және өзара құрмет Алғыс айту күні «Алғыс және өзара құрмет» тақырыбы арқылы алғыс мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Алғыс нақты көмекті байқап, оның әсерін айту арқылы шынайы болады. «Көмектескенің үшін рақмет» деген сөздің өзі маңызды. Алғыс міндетті сыйлық немесе жауап қызмет талап етпейді. Күнделікті байқалмайтын еңбекті де бағалауға болады. Бүгінгі назарымыз: «Алғыс және өзара құрмет». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Топқа көмектескен оқушының үлесі айтылмады. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету. Топқа көмектескен оқушының үлесі айтылмады. Алғыс шарасына қызметкерлердің бір тобы шақырылмады. Біреу көмегін алға тартып, жағымсыз өтінішті орындауды сұрады. Алғыс бейнесіне түсуден бас тартқан оқушыға қысым жасалды. Сынып алғыс үшін қымбат зат алмақ.", "path": "#/lesson/g06-t20"}, {"id": "g06-t21", "grade": 6, "topic": 21, "title": "Жақын адамды тыңдау", "direction": "Аналар мерекесі", "icon": "❀", "search": "Жақын адамды тыңдау Аналар мерекесі «Жақын адамды тыңдау» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Анаға және қамқор ересекке құрмет жылы сөзден, тыңдаудан және қауіпсіз көмектен көрінеді. Қамқорлық еңбегі бір адамға ғана міндеттелмейді. Әр оқушы өзі таңдаған қамқор адамға алғыс білдіре алады. Аналар күні мен 8 наурыз — атауы мен күні бөлек мерекелер. Бүгінгі назарымыз: «Жақын адамды тыңдау». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Үйде мерекеге дайындықтың бәрін бір адам атқарады. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Үйде мерекеге дайындықтың бәрін бір адам атқарады. Оқушы анасы туралы айтуды қаламады. Топ бәріне бірдей қымбат сыйлық алуды ұсынды. Топ міндеттерді жынысына қарай бөлді. Ашықхатқа жеке суретті рұқсатсыз қосу ұсынылды.", "path": "#/lesson/g06-t21"}, {"id": "g06-t22", "grade": 6, "topic": 22, "title": "Құқықты құрметтеудің күнделікті жолы", "direction": "Конституция күні", "icon": "⚖", "search": "Құқықты құрметтеудің күнделікті жолы Конституция күні «Құқықты құрметтеудің күнделікті жолы» тақырыбы арқылы конституция мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Конституция — мемлекеттің негізгі заңы. Бұл сабақта адам қадірін, қауіпсіздікті және өзгенің пікіріне құрметті күнделікті мысалмен талқылаймыз. Нақты құқықтық тұжырымға ресми мәтіннен дәлел қажет. Бұрынғы мәтін мен қолданыстағы редакцияны шатастырмау маңызды. Бүгінгі назарымыз: «Құқықты құрметтеудің күнделікті жолы». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Ортақ шешімде бір оқушының пікірі үнемі ескерілмейді. Ойлану бағдары: Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Ортақ шешімде бір оқушының пікірі үнемі ескерілмейді. Екі топ өз ұсынысын жалғыз дұрыс шешім деп санайды. Сынып ережесін Конституция бабы деп атады. Тапсырма бірдей берілді, бірақ оны орындау жолы кей балаға қолайсыз. Оқушы қауіпсіздік туралы ұсынысын қалай жеткізуді білмейді.", "path": "#/lesson/g06-t22"}, {"id": "g06-t23", "grade": 6, "topic": 23, "title": "Дәстүр мен қазіргі өмір", "direction": "Наурыз мерекесі", "icon": "❖", "search": "Дәстүр мен қазіргі өмір Наурыз мерекесі «Дәстүр мен қазіргі өмір» тақырыбы арқылы наурыз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Наурыз жаңару, татулық және ізгі тілекпен байланысты. Дәстүрді түсіндіруде оның мағынасына назар аударамыз. Әр өңірдегі тәжірибе әртүрлі болуы мүмкін. Мерекені қауіпсіз, ысырапсыз және бәріне қолжетімді өткізуге болады. Бүгінгі назарымыз: «Дәстүр мен қазіргі өмір». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Оқушының өңірінде дәстүр басқаша орындалады. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Оқушының өңірінде дәстүр басқаша орындалады. Ұлттық киімі жоқ бала шарадан шеттетілді. Тағам шарасында бір балаға ұсынылған ас жарамайды. Бір реттік ыдыс пен безендіру көп жиналды. Мерекелік топтар жарыста бір-бірін кемсітті.", "path": "#/lesson/g06-t23"}, {"id": "g06-t24", "grade": 6, "topic": 24, "title": "Қамқорлық — жауапты күш", "direction": "Отан қорғаушылар күні", "icon": "⚑", "search": "Қамқорлық — жауапты күш Отан қорғаушылар күні «Қамқорлық — жауапты күш» тақырыбы арқылы бейбітшілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отанға қызмет жауапкершілік, бейбіт өмірді бағалау және адамдардың қауіпсіздігіне қамқорлықпен байланысты. Батылдық — қауіпті сынаққа бару емес; кейде қауіпті ұсыныстан бас тартып, көмек шақыру. Сабақта әскери құрал не қауіпті жаттығу қолданылмайды. Бүгінгі назарымыз: «Қамқорлық — жауапты күш». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Құрдастар қауіпті күш сынауды ерлікпен теңестірді. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Құрдастар қауіпті күш сынауды ерлікпен теңестірді. Қоғамдық шарада қауіпсіз бағыт көрсететін ерікті керек. Іс-шарадағы рөлдер жынысына қарай шектелді. Далада қауіпті болуы мүмкін зат табылды. Қызмет ететін адамға сұхбат сұрақтары дайындалды.", "path": "#/lesson/g06-t24"}, {"id": "g06-t25", "grade": 6, "topic": 25, "title": "Стереотипсіз қарым-қатынас", "direction": "Қазақстан халқының бірлігі", "icon": "◉", "search": "Стереотипсіз қарым-қатынас Қазақстан халқының бірлігі «Стереотипсіз қарым-қатынас» тақырыбы арқылы бірлік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Бірлік әр адамның қадірін сыйлап, ортақ іске тең қатысуына жағдай жасаудан басталады. Адамды тіліне, тегіне немесе сыртқы белгісіне қарап бағаламаймыз. Мәдени таныстыруда бір адамның тәжірибесін тұтас топқа телуге болмайды. Бүгінгі назарымыз: «Стереотипсіз қарым-қатынас». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Акценті үшін оқушыға күлді. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Акценті үшін оқушыға күлді. Топ ережесі түсіндірілмей, жаңа қатысушы кінәланды. Сынып бір тағамды бәріне міндетті ұсынды. Шағын топтың ұсынысы дауыс аз болғандықтан тыңдалмады. Желіде бір халық туралы дәлелсіз тұжырым тарады.", "path": "#/lesson/g06-t25"}, {"id": "g06-t26", "grade": 6, "topic": 26, "title": "Қайырымдылықтағы әдеп", "direction": "Волонтерлік және қайырымдылық", "icon": "♡", "search": "Қайырымдылықтағы әдеп Волонтерлік және қайырымдылық «Қайырымдылықтағы әдеп» тақырыбы арқылы еріктілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Волонтерлік — ерікті пайдалы әрекет. Көмектің қажеттігін алдымен сұраған дұрыс. Адамның қадірі мен жеке мәліметі сақталуы керек. Оқушыдан ақша жинау, жеке жағдайын жариялау немесе қауіпті жұмыс істеу талап етілмейді. Бүгінгі назарымыз: «Қайырымдылықтағы әдеп». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Көмек тобы не қажет екенін сұрамай зат әкелді. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау. Көмек тобы не қажет екенін сұрамай зат әкелді. Ерікті шараға қатыспағандарға қысым жасалды. Көмек алушының суреті рұқсатсыз жарияланды. Еріктілер белгісіз қоқысты жинамақ. Топ ақшасыз көмекті пайдасыз деп атады.", "path": "#/lesson/g06-t26"}, {"id": "g06-t27", "grade": 6, "topic": 27, "title": "Экран мен қозғалыс тепе-теңдігі", "direction": "Денсаулық және пайдалы әдеттер", "icon": "♧", "search": "Экран мен қозғалыс тепе-теңдігі Денсаулық және пайдалы әдеттер «Экран мен қозғалыс тепе-теңдігі» тақырыбы арқылы әдет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Демалыс, күн тәртібі, қауіпсіз қозғалыс және қол гигиенасы күнделікті өзіне қамқорлықтың бөлігі. Әр адамның мүмкіндігі әртүрлі. Сабақта дене салмағы, диагноз немесе жеке денсаулық ақпараты сұралмайды. Денсаулық мәселесінде сенімді ересек пен медицина маманына жүгінеді. Бүгінгі назарымыз: «Экран мен қозғалыс тепе-теңдігі». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Экран алдында ұзақ отырған соң зейін төмендеді. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Экран алдында ұзақ отырған соң зейін төмендеді. Топтық чат кешке тоқтамай, демалысқа кедергі келтіреді. Қозғалыс ойыны бір оқушыға қолайсыз. Блогер өнім бәрін емдейді деді. Досың жағдайын жасырып, ойынды жалғастырмақ.", "path": "#/lesson/g06-t27"}, {"id": "g06-t28", "grade": 6, "topic": 28, "title": "Қауіпсіз маршрутты салыстыру", "direction": "Жолдағы қауіпсіздік", "icon": "↔", "search": "Қауіпсіз маршрутты салыстыру Жолдағы қауіпсіздік «Қауіпсіз маршрутты салыстыру» тақырыбы арқылы өткел мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жолда назарды қозғалысқа аударып, белгіленген жаяу жүргінші өткелі мен бағдаршам тәртібін сақтау керек. Жас бала жолды сенімді ересекпен өтеді. Қауіпсіздік тапсырмалары тек қағазда орындалады; көлік жолында тәжірибе жасалмайды. Бүгінгі назарымыз: «Қауіпсіз маршрутты салыстыру». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Топ өткелге бармай, жолды кесіп өтуді ұсынды. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Топ өткелге бармай, жолды кесіп өтуді ұсынды. Құлаққап пен телефон назарды бөледі. Автобус артынан өтуді ұсынды. Киімдегі жарық шағылыстырғыштың қажеті талқыланды. Өткелдегі белгі түсініксіз не көрінбейді.", "path": "#/lesson/g06-t28"}, {"id": "g06-t29", "grade": 6, "topic": 29, "title": "Рұқсат және ерікті келісім", "direction": "Жеке шекара және өзара құрмет", "icon": "☂", "search": "Рұқсат және ерікті келісім Жеке шекара және өзара құрмет «Рұқсат және ерікті келісім» тақырыбы арқылы шекара мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр адам өзінің затына, кеңістігіне және жеке ақпаратына қатысты шекарасын айта алады. Келісім ерікті болуы керек және оны өзгертуге болады. «Жоқ» деген жауапты сыйлаймыз. Қорқыныш не қысым болса, сенімді ересекке айтамыз. Бүгінгі назарымыз: «Рұқсат және ерікті келісім». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Досың жеке дәптеріңді рұқсатсыз оқыды. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Досың жеке дәптеріңді рұқсатсыз оқыды. Топтық фотоға түскің келмеді. Құрдастар жеке мәлімет айтуды достық шарты етті. Досың өтінішті түсінбей, әрекетін қайталады. Оқушы қауіпсіздікке қатысты сырды сақтауға уәде берді.", "path": "#/lesson/g06-t29"}, {"id": "g06-t30", "grade": 6, "topic": 30, "title": "Тақырып пен мазмұнды салыстыру", "direction": "Медиасауаттылық", "icon": "⌕", "search": "Тақырып пен мазмұнды салыстыру Медиасауаттылық «Тақырып пен мазмұнды салыстыру» тақырыбы арқылы факт мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ақпаратты бөліспес бұрын авторын, жарияланған күнін және бастапқы дерегін тексереміз. Сурет басқа оқиғаға қатысты болуы мүмкін. Пікір адамның бағасын білдіреді, ал фактіні тексеруге болады. Сенімді көрінген ЖИ мәтінінде де қате кездеседі. Бүгінгі назарымыз: «Тақырып пен мазмұнды салыстыру». Бір мәселенің бірнеше шешімі болуы мүмкін. Әр нұсқаның пайдасы, қиындығы және өзге адамдарға әсері бар. Шешімді түсіндіру үшін нақты өлшем қолданамыз: қауіпсіздік, әділдік, қолжетімділік. Өмірлік мысал: Чатқа мектеп жабылады деген дереккөзсіз хабар келді. Ойлану бағдары: Мектептің ресми хабарын тексеру; расталмағанын таратпау. Чатқа мектеп жабылады деген дереккөзсіз хабар келді. Ескі фото жаңа оқиғаға қатысты деп таратылды. Жарнамадағы пікір факт ретінде берілді. Эмоциялық тақырып мазмұндағы дерекке сәйкес емес. ЖИ жауабы кітап атауын қате берді.", "path": "#/lesson/g06-t30"}];
function initializeTarbie(){
'use strict';
(() => {
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const body=document.body,root=body.dataset.root||'',page=body.dataset.page;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;function toast(message){const e=$('#toast');e.textContent=message;e.className='toast-visible';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{e.textContent='';e.className=''},4200)}
const KEY='tarbie-alemi:v1';let marks={favorites:[],viewed:[]};
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Array.isArray(saved.favorites)&&Array.isArray(saved.viewed))marks=saved;}catch{}
function saveMarks(){try{localStorage.setItem(KEY,JSON.stringify(marks));return true;}catch{toast('Бұл браузерде белгілерді сақтау қолжетімсіз. Олар осы ашық бетте ғана көрінеді.');return false;}}
function status(id){return (marks.favorites.includes(id)?'★ ':'')+(marks.viewed.includes(id)?'✓ Қаралған':'');}
function updateCardStatus(){$$('[data-status]').forEach(e=>e.textContent=status(e.dataset.status));}
function download(name,text){const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
if(page==='home'||page==='grade'){
const search=$('#search'),grade=$('#grade-filter'),direction=$('#direction-filter'),view=$('#view-filter');let pageIndex=0;const pageSize=18;
if(page==='grade'){grade.value=body.dataset.grade;grade.disabled=true;}
const params=new URLSearchParams(window.SINGLE_QUERY||'');if(params.get('view')==='favorites')view.value='favorites';
function matches(x){const q=search.value.trim().toLocaleLowerCase('kk');return (!q||x.search.toLocaleLowerCase('kk').includes(q))&&(!grade.value||x.grade===Number(grade.value))&&(!direction.value||x.direction===direction.value)&&(view.value==='all'||view.value==='favorites'&&marks.favorites.includes(x.id)||view.value==='viewed'&&marks.viewed.includes(x.id)||view.value==='new'&&!marks.viewed.includes(x.id));}
function render(){const found=(window.TARBIE_CATALOG||[]).filter(matches);$('#result-count').textContent=found.length+' тақырып табылды';
if(page==='grade'){const ids=new Set(found.map(x=>x.id));$$('#class-results .topic-card').forEach(e=>e.hidden=!ids.has(e.dataset.id));$('#class-empty').hidden=found.length>0;updateCardStatus();return;}
const total=Math.max(1,Math.ceil(found.length/pageSize));pageIndex=Math.min(pageIndex,total-1);const shown=found.slice(pageIndex*pageSize,(pageIndex+1)*pageSize);
$('#catalog-results').innerHTML=shown.length?shown.map(x=>`<a class="topic-card" href="${root}${x.path}"><div class="card-top"><span class="topic-icon" aria-hidden="true">${x.icon}</span><span class="tag">${x.grade}-сынып</span><span class="card-status">${status(x.id)}</span></div><span class="direction-label">${esc(x.direction)}</span><h3>${esc(x.title)}</h3><p>5 жағдаят · жұптық · топтық · 5 сұрақ · кері байланыс</p><span class="read-link">Сабақты ашу →</span></a>`).join(''):'<p class="empty">Материал табылмады. Іздеу сөзін немесе сүзгіні өзгертіңіз. Таңдаулыға сабақ ішіндегі ☆ батырмасымен қосуға болады.</p>';
$('#pagination').innerHTML=found.length?`<button id="prev-page" type="button" ${pageIndex===0?'disabled':''}>← Алдыңғы</button><span class="muted">${pageIndex+1} / ${total}</span><button id="next-page" type="button" ${pageIndex>=total-1?'disabled':''}>Келесі →</button>`:'';
if($('#prev-page'))$('#prev-page').onclick=()=>{pageIndex--;render();};if($('#next-page'))$('#next-page').onclick=()=>{pageIndex++;render();};}
[search,grade,direction,view].forEach(e=>e.addEventListener(e===search?'input':'change',()=>{pageIndex=0;render();}));
$('#reset-filter').onclick=()=>{search.value='';grade.value=page==='grade'?body.dataset.grade:'';direction.value='';view.value='all';pageIndex=0;render();};
if($('#clear-marks'))$('#clear-marks').onclick=()=>{marks={favorites:[],viewed:[]};saveMarks();render();toast('Таңдаулы мен қаралған белгілер тазаланды.');};render();
}
if(page==='lesson'){
const id=body.dataset.lesson;const tabs=$$('[role=tab]'),panels=$$('.tab-panel');
function activate(key,focus=false){const target=tabs.find(t=>t.dataset.tab===key)||tabs[0];tabs.forEach(t=>{const active=t===target;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;});panels.forEach(p=>p.hidden=p.id!==target.getAttribute('aria-controls'));if(focus)target.focus();}
tabs.forEach((tab,i)=>{tab.onclick=()=>{activate(tab.dataset.tab);window.setSingleTab(tab.dataset.tab);};tab.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();activate(tabs[n].dataset.tab,true);window.setSingleTab(tabs[n].dataset.tab);};});activate(window.SINGLE_TAB||'intro');
function updateMarks(){const fav=marks.favorites.includes(id),seen=marks.viewed.includes(id);$('#favorite').textContent=fav?'★ Таңдаулыдан алу':'☆ Таңдаулыға қосу';$('#favorite').setAttribute('aria-pressed',String(fav));$('#mark-viewed').textContent=seen?'✓ Қаралған белгісін алу':'○ Қаралды деп белгілеу';$('#mark-viewed').setAttribute('aria-pressed',String(seen));}
$('#favorite').onclick=()=>{marks.favorites=marks.favorites.includes(id)?marks.favorites.filter(x=>x!==id):[...marks.favorites,id];saveMarks();updateMarks();};$('#mark-viewed').onclick=()=>{marks.viewed=marks.viewed.includes(id)?marks.viewed.filter(x=>x!==id):[...marks.viewed,id];saveMarks();updateMarks();};updateMarks();
$$('.quiz-option').forEach(button=>button.onclick=()=>{const box=button.closest('.quiz');box.querySelectorAll('.quiz-option').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const correct=Number(button.dataset.option)===Number(box.dataset.correct),result=box.querySelector('.quiz-result');result.hidden=false;result.textContent=(correct?'Орынды жауап. ':'Бұл таңдауды қайта қара. ')+result.dataset.explanation;});
let responses=[];const form=$('#feedback-form');function showFeedback(){$('#feedback-count').textContent=responses.length+' анонимді жауап тіркелді.';const ratings=['Түсіндім','Жаттығамын','Көмек керек'];$('#feedback-tally').innerHTML='<div class="tally">'+ratings.map(r=>`<span>${r}: <b>${responses.filter(x=>x.confidence===r).length}</b></span>`).join('')+'</div>';$('#feedback-list').innerHTML=responses.length?responses.map((r,i)=>`<section class="feedback-response"><strong>Жауап ${i+1} · ${esc(r.confidence)}</strong>${r.answers.map((a,n)=>`<p><b>${n+1}.</b> ${esc(a||'Ауызша жауап / мәтін енгізілмеген')}</p>`).join('')}</section>`).join(''):'<p class="muted">Әзірге жауап жоқ.</p>';}
form.addEventListener('submit',event=>{event.preventDefault();const selected=form.querySelector('input[name=confidence]:checked');if(!selected){toast('Алдымен өзіндік бағалау белгісін таңдаңыз.');return;}responses.push({confidence:selected.value,answers:[0,1,2].map(i=>$('#reflection-'+i).value.trim())});form.reset();showFeedback();toast('Анонимді жауап тіркелді. Келесі оқушы жауап бере алады.');});
$('#export-feedback').onclick=()=>{if(!responses.length){toast('Әзірге жауап жоқ.');return;}const title=$('.lesson-head h1').textContent;const text=title+'\nАнонимді кері байланыс\nЖауап саны: '+responses.length+'\n\n'+responses.map((r,i)=>'Жауап '+(i+1)+' · '+r.confidence+'\n'+r.answers.map((a,n)=>(n+1)+'. '+(a||'Ауызша жауап / мәтін жоқ')).join('\n')).join('\n\n');download(id+'-keri-bailanys.txt',text);toast('Кері байланыс файлы жүктеуге дайын.');};
$('#clear-feedback').onclick=()=>{responses=[];showFeedback();toast('Осы сессия жауаптары өшірілді.');};
function printDraft(){let p=$('#print-feedback');if(!p){p=document.createElement('div');p.id='print-feedback';p.className='print-feedback';$('#panel-reflection').appendChild(p);}p.innerHTML='<h3>Ағымдағы жауап үлгісі</h3>'+[0,1,2].map(i=>`<section><strong>${esc($('label[for="reflection-'+i+'"]').textContent)}</strong><div>${esc($('#reflection-'+i).value||'________________________________')}</div></section>`).join('');}
$('#print-lesson').onclick=()=>{printDraft();window.print();};window.onbeforeprint=printDraft;showFeedback();
}
})();

}

window.setSingleTab=function(tab){const [route,query='']=location.hash.replace(/^#\//,'').split('?');const p=new URLSearchParams(query);p.set('tab',tab);history.replaceState(null,'','#/'+route+'?'+p.toString());};
function routeSingle(){const [path,query='']=location.hash.replace(/^#\//,'').split('?');const page=SINGLE_PAGES[path]||SINGLE_PAGES.home;const params=new URLSearchParams(query);window.SINGLE_QUERY=query;window.SINGLE_TAB=params.get('tab')||'intro';window.onbeforeprint=null;document.body.dataset.page=page.kind;document.body.dataset.grade=page.grade;document.body.dataset.lesson=page.lesson;document.body.dataset.root='';document.getElementById('main').innerHTML=page.html;document.title=page.title;initializeTarbie();window.scrollTo(0,0);const section=params.get('section');if(section&&document.getElementById(section))document.getElementById(section).scrollIntoView();}
window.addEventListener('hashchange',routeSingle);routeSingle();
</script></body></html>
