бедел<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-10/lesson-08.html\"><h2>8. Интернеттегі таныстықтан туындайтын қауіптер<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-10/lesson-09.html\"><h2>9. Қаржылық алаяқтықтан сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-10/lesson-10.html\"><h2>10. Жұмысқа орналасудағы құқықтар мен қауіпсіздік<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-10/lesson-11.html\"><h2>11. Суда және табиғат аясындағы қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-10/lesson-12.html\"><h2>12. Қысым мен бопсалаудан сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-10/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 365-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=365\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ           Төтенше жағдайлар қызметтері мен байланыс\n               орталығының телефон нөмірлері\nМақсаты             Білім алушылардың қауіпті жағдайды бағалау, қажетті\n               көмек көрсету қызметін дұрыс таңдау және шұғыл әрі\n               консультациялық қолдауға        сауатты түрде      жүгіну\n               дағдыларын қалыптастыру.\nМіндеттері          -қауіпті жағдайдың сипатын анықтап, тиісті көмек\n               көрсету қызметін дұрыс таңдауға үйрету;\n                    -шұғыл және консультациялық көмекке сауатты әрі\n               нақты жүгіну дағдыларын дамыту;\n                    -өз қауіпсіздігі мен айналасындағы адамдардың\n               қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n       Материалдар мен ресурстар\n       «Шұғыл көмек шақыру алгоритмі» жаднамасы, «Диспетчер –\nкуәгер» рөлдік ойынына арналған карточкалар.\n       Сабақ барысы\n       I. Кіріспе бөлім\n       «Шешім қабылдауға бір минут» проблемалық жағдаяты\n       Педагог:\n       – Төтенше жағдайдың куәгері болғаныңызды елестетіңіз.\nҚолыңызда телефон бар, бірақ шешім қабылдауға бар болғаны бір\nминут уақыт берілді. Ең алдымен не істейсіз?\n       Экранда (немесе тақтада) үш жағдаят көрсетіледі:\n             Пәтерде газдың өткір иісі сезіледі;\n             Көшеде адамның жағдайы нашарлап, есінен танып қалды;\n             Көрші кіреберісте өрт басталды.\n       Педагог:\n       – Неліктен әр қауіпті жағдайда әрекет ету тәртібі әртүрлі болуы\nмүмкін?\n       – Өз басыңды қауіпке тікпей, қалай әрекет етуге болады?\n       – Төтенше жағдайда тиісті жедел қызметті дұрыс таңдау неліктен\nмаңызды?\n       Педагог қорытынды жасайды:\n       - Төтенше жағдайда ең алдымен өз қауіпсіздігіңді қамтамасыз\nету, қауіптің айқын белгілерін тез бағалау, тиісті қызметті шақыру және\nдиспетчерге өзіңе белгілі ақпаратты нақты әрі анық хабарлау маңызды.\n       II. Негізгі бөлім\n       Көмекке жүгіну алгоритмі\n       1.     Қауіпсіздікті қамтамасыз ет – қауіп көзіне жақындама және\nөзіңді қауіпке ұшыратпа.\n\n      2.    Жағдайды анықта – не болғанын және өмірге немесе\nденсаулыққа тікелей қаупі бар-жоғын бағала.\n      3.    Қажетті қызметті таңда – қай шұғыл қызметке хабарласу\nкеректігіне сенімді болмасаң, 112 нөміріне қоңырау шал.\n      4.    Негізгі ақпаратты хабарла – не болғанын, қай жерде\nболғанын, зардап шеккендер бар-жоғын және қауіптің әлі де сақталып\nтұрғанын айт.\n      5.    Диспетчердің сұрақтарына жауап бер және оның\nнұсқауларын орында.\n      Есте сақта!\n      «Заң     және     тәртіп»    қағидаты     шұғыл     қызметтерді\nжауапкершілікпен пайдалануды көздейді. Көрінеу жалған қоңыраулар\nмен хабарламалар мамандардың назарын нақты оқиғалардан бұрып,\nҚазақстан Республикасының заңнамасына сәйкес жауапкершілікке\nәкеп соғуы мүмкін.\n      Төтенше жағдайда диспетчерге өзіңе белгілі нақты фактілерді\nғана хабарлау, жағдайды әсірелемеу және тексерілмеген ақпаратты\nхабарламау қажет.\n      «Шұғыл қызмет диспетчері» практикумы\n      Педагог білім алушыларға өздерін құтқару қызметінің\nқызметкерлері ретінде елестетуді ұсынады.\n      Жұппен жұмыс:\n           бір білім алушы – диспетчер, ал екіншісі– оқиғаның куәгері.\n      Әр жұпқа жағдаят жазылған карточка беріледі.\n           Сауда орталығында өрт шықты.\n           Аялдамада адам есінен танып қалды.\n           Аулада төбелес болды.\n           Пәтерде газдың өткір иісі сезіледі.\n           Жасөспірім қараусыз қалған күдікті сөмкені байқап қалды.\n           Досы «Маған өте қиын, өзімнің уайымдарымды жеңе\nалмай жүрмін, ешкімге айтпа» деп хабарлама жазды.\n      Тапсырма\n      30–40 секунд ішінде куәгер диспетчерге қажетті ақпаратты дұрыс\nәрі нақты хабарлауы тиіс.\n      Әр жұптың жауабынан кейін сынып талқылайды:\n           Барлық қажетті ақпарат айтылды ма?\n           Қандай ақпаратты атау ұмыт қалды?\n           Нені нақтырақ айтуға болар еді?\n      Педагог      білім    алушыларға       тақырыпқа       қатысты\nбейнематериалмен танысуды ұсынады.\n\n      https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2\nFeoT00B3gyDuskOvkalEx7TmU&amp;index=28\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n    Бүгін мен ... түсіндім.\n    Төтенше жағдайда ең бастысы – ...\n    Енді мен қоңырау шалмас бұрын ... керектігін білемін.\n      Педагог қорытынды жасайды:\n      - Қауіпті жағдайда уақытты жоғалтпау маңызды: алдымен өз\nқауіпсіздігіңді қамтамасыз ету, қауіптің сипатын анықтау, тиісті\nқызметке хабарласу және өзіңе белгілі ақпаратты нақты жеткізу\nқажет. Егер қай шұғыл қызметке хабарласу керектігін білмесеңіз, 112\nнөміріне қоңырау шалыңыз.\n                             Қосымша ақпарат\n  Байланыс             Қызмет                       Қашан жүгіну керек\n    нөмірі\n112            Бірыңғай шұғыл көмек        Кез келген төтенше жағдайда немесе қай\n               көрсету қызметі             қызметке хабарласу керектігі белгісіз\n                                           болған кезде\n101            Өрт сөндіру қызметі         Өрт, жану, түтін байқалған жағдайда 1\n102            Полиция                     Қылмыс, төбелес, қорқыту, өмірге\n                                           немесе денсаулыққа қауіп төнген\n                                           жағдайда\n103            Жедел медициналық           Жарақат алу, есінен тану, денсаулық\n               жәрдем қызметі              жағдайының күрт нашарлауы кезінде\n104            Апаттық газ қызметі         Газдың иісі сезілгенде немесе газдың\n                                           таралуы байқалған жағдайда\n111            Отбасы, әйелдер мен         Буллинг, кибербуллинг, қорқыту,\n               балалардың құқықтарын       зорлық-зомбылық және көмек пен\n               қорғау мәселелері           қолдауды қажет ететін басқа да қиын\n               бойынша «111» байланыс      өмірлік жағдайлар – 111\n               орталығы – (тәулік бойы,\n               аптасына 7 күн)\nӨз             Психологиялық қолдау        Психологиялық қиындықтар, қатты\nөңіріңіздегі   орталығы                    күйзеліс, мазасыздық, буллинг,\nбайланыс                                   психологиялық көмек пен қолдаудың\nдеректері                                  қажеттілігі – Психологиялық қолдау\n                                           орталығы\nӨз             Балалардың құқықтарын       Балалардың құқықтары мен заңды\nөңіріңіздегі   қорғау басқармасы           мүдделерінің бұзылуы, қорғау мен\nбайланыс                                   көмекті қажет ететін\nдеректері                                  жағдайлар – Балалардың құқықтарын\n                                           қорғау басқармасы\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 1-сабақ — Ұлы дала коды"}, "grade-10/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Күмәнді табыс ұсыныстарынан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 368-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=368\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ         Күмәнді табыс ұсыныстарынан сақтану\nМақсаты          Білім алушылардың күмәнді қаржылық\n             ұсыныстарды ажырату, олардың тәуекелдерін\n             бағалау және қауіпсіз шешім қабылдау дағдыларын\n             қалыптастыру\nМіндеттері        алаяқтық белгілерін және ықтимал құқыққа\n             қайшы қаржылық схемаларды анықтауға үйрету;\n                  күмәнді ұсыныстарға қатысудың қаржылық,\n             цифрлық және құқықтық салдарын бағалай білу\n             дағдысын дамыту;\n                  өз қауіпсіздігіне жауапкершілікпен қарауға\n             тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Жеңіл табыс» туралы хабарландырулары бар талдауға арналған\nкарточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      Өзіңізге мынадай хабарлама келгенін елестетіңіз:\n      «Көмекші іздеймін. Жұмыс күніне небәрі 20 минутты алады.\nТабыс – аптасына 50 000 теңгеден бастап. Тәжірибе қажет емес. Тек\nбанк картасы мен телефон болса жеткілікті».\n      Педагог білім алушыларға сұрақ қояды:\n            Неліктен мұндай хабарландырулар назар аудартады?\n            Бұл ұсыныста қандай жайттар күдік тудырады?\n      Білім алушылар жауап береді.\n      Педагог қорытынды жасайды:\n       Алаяқтыққа қатысты бос жұмыс орындары көбіне тартымды\nқосымша жұмыс немесе тез ақша табу мүмкіндігі ретінде ұсынылады.\nСондықтан уәде етілген табыс мөлшеріне емес, ұсыныстың\nшарттарына, заңдылығына және оның ықтимал салдарына баға беру\nмаңызды.\n       II. Негізгі бөлім\n      «Нені ескеріп, сақ болған жөн?» жаттығуы\n\n      Педагог білім алушыларға ықтимал алаяқтық белгілерімен\nтанысуды ұсынады:\n       күш жұмсамай-ақ жоғары табыс табуға уәде береді;\n       алдын ала ақша аударуды талап етеді;\n       банк картасының деректерін беруді сұрайды;\n       өз банк картасы арқылы басқа адамдардың ақшасын\nқабылдауды немесе аударуды ұсынады;\n       шешім қабылдауға асықтырады;\n       ақшаның қайдан түсетінін және оны кейін не үшін басқа\nадамдарға аудару қажет екенін түсіндірмейді;\n       барлығын құпия сақтауды сұрайды.\n      Тапсырма: әр белгіні талқылап, оның неліктен күдік тудыруы\nтиіс екенін түсіндіріңіздер. Әр жағдайдағы қауіпсіз әрекет ету тәсілін\nұсыныңыздар.\n      Педагог қорытынды жасайды:\n       Егер ұсыныс күмән тудырса: ақшаңызды, банк картаңызды\nнемесе оның деректерін ешкімге бермеңіз, сондай-ақ басқа адамдардың\nақшасын аударуға келіспеңіз. Ата-анаңызға, педагогке немесе басқа да\nсенім артатын ересек адамға жүгініңіз.\n      «Заң және тәртіп» қағидаты цифрлық ортадағы қаржылық\nәрекеттерге де қатысты. Бөтен адамдардың ақшасын өзіңіздің банк\nшотыңызға қабылдау, оны басқа адамдарға аудару, шотқа немесе банк\nкартасына қолжетімділікті беру құқыққа қайшы қаржылық схеманың\nбір бөлігі болуы мүмкін.\n      Ақшаның қайдан шыққанын білмеу мұндай әрекетті қауіпсіз\nетпейді. Сондықтан банк картаңызды, банк деректемелеріңізді, PIN-\nкодты, CVV-кодты, SMS-кодтарды немесе банк қосымшасына\nқолжетімділікті басқа адамдарға беруге болмайды.\n      Педагог білім алушылардың назарын тақырыпқа қатысты\nжаднамаға аударады.\n      https://drive.google.com/file/d/1KPFqMu6qSv-\nCKAKbx_VTPu98Ahb82x8H/view?usp=sharing\n      «ТОҚТА – ТЕКСЕР – БАС ТАРТ – ХАБАРЛА» алгоритмі\n      Тоқта – қысыммен шешім қабылдама және күдікті сілтемелерге\nөтпе.\n      Тексер – жұмысты кім ұсынып отырғанын, қандай міндеттер бар\nекенін, ақша қайдан түсетінін және ресми шарттардың бар-жоғын\nанықта.\n      Бас тарт – ақша, банк деректері, шотқа қолжетімділік немесе\nмағынасы түсініксіз ақша аударымдарына қатысуды талап етсе,\nұсыныстан бас тарт.\n\n      Хабарла – ата-анаңа немесе басқа да сенім артатын ересек адамға\nайт; алаяқтық белгілері байқалса, көмекке жүгін.\n      Егер жасөспірім банк деректерімен екінші тұлғамен бөліссе,\nкүдікті операцияларды байқаған болса, бұл туралы дереу ата-анасына\nнемесе басқа да сенім артатын ересек адамға хабарлап, банкке жүгіну\nқажет. Алаяқтық белгілері байқалған жағдайда 102 нөмірі арқылы\nполицияға хабарласу қажет. Жасөспірімнің құқықтарын қорғау\nмәселелері     бойынша        кеңес    алу     үшін 111     байланыс\nорталығына жүгінуге болады.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n       Бүгін мен ... түсіндім.\n       Енді мен оңай табыс туралы ұсынысты ... .\n       Егер маған күш жұмсамай-ақ көп ақша табуды ұсынса, мен ...\n       Мен үшін қаржылық қауіпсіздіктің ең маңызды ережесі – ...\n      Педагог қорытынды жасайды:\n       Жоғары табыс, жеңіл жұмыс және тез ақша табу туралы уәде\nбірден алаяқтықты білдірмейді. Бірақ мұндай ұсынысты міндетті түрде\nмұқият тексеру керек.\n      Ақшаңды, банк деректеріңді немесе шотыңа кіруге мүмкіндік\nберетін ақпаратты ешкімге берме. Өзіңе қатысы жоқ әрі күмәнді ақша\nаударымдарына немесе басқа қаржылық операцияларға келіспе.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1KPFqMu6qSv-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1KPFqMu6qSv-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 2-сабақ — Ұлы дала коды"}, "grade-10/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Дағдарыс кезінде көмекке жүгіну<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 371-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=371\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ         Дағдарыс кезінде көмекке жүгіну\nМақсаты          Білім алушылардың шынайы өмірде және цифрлық\n              ортада дағдарысты жағдайларда көмекке уақытылы әрі\n              сауатты жүгіну дағдыларын қалыптастыру.\nМіндеттері        білім алушыларды «дағдарысты жағдай» ұғымымен\n              және оның негізгі белгілерімен таныстыру;\n                  қолжетімді қолдауға жүгінуге үйрету;\n                  өзіне   деген сенімділік пен сабырлылықты\n              қалыптастыру.\n\n      Материалдар мен ресурстар\n      «Көмек шеңбері» карточкалары (ата-ана, педагог, мектеп\nпсихологі, әлеуметтік педагог, достар, шұғыл қызметтер).\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Кейде адам қиын жағдайға тап болғанда не істеу керектігін\nбірден түсіне алмайды. Қорқыныш, күйзеліс немесе абыржу дұрыс\nшешім қабылдауға кедергі келтіруі мүмкін. Осындай кезде мәселені\nжалғыз шешуге тырыспай, дер кезінде көмекке жүгіну қажет.\n      Педагог сұрайды:\n      – Неліктен кейбір адамдар қиын жағдайға тап болғанын біле тұра\nкөмек сұрауға асықпайды?\n      Білім алушылар ықтимал себептерді атайды: қорқу, ұялу,\nжағдайды жасыруға тырысу, мәселені өз бетімен шешемін деп ойлау,\nкімге жүгінерін білмеу немесе айналасындағылар түсінбейді деп\nқауіптену.\n      Педагог қорытындылайды:\n      – Дағдарысты жағдайда үндемей қалу немесе мәселенің өздігінен\nшешілуін күту кейде жағдайды қиындатуы мүмкін. Ал дер кезінде\nкөмек сұрау қауіптің алдын алуға, дұрыс шешім табуға және қажетті\nқолдау алуға мүмкіндік береді.\n      Бүгін біз қандай жағдайда өз бетімізше әрекет етпей, кімге және\nқалай көмекке жүгінуге болатынын талқылаймыз.\n      II. Негізгі бөлім\n      Педагог түсіндіреді:\n\n      – Дағдарысты жағдай – адамның болып жатқан жағдайды өз\nбетімен шешуі немесе еңсеруі қиынға соғатын кезең. Мұндай кезде\nқатты қорқыныш, мазасыздық, абыржу, қысым сезіліп, әрі қарай не\nістеу керектігін түсіну қиындауы мүмкін. Бұған жанжал, қауіп-қатер,\nзорлық-зомбылық, буллинг, жақын адамынан айырылу немесе басқа да\nауыр жағдайлар себеп болуы мүмкін.\n      Осындай сәтте бәрін жалғыз шешуге тырыспау керек. Өзің\nсенетін ересек адамға, психологке немесе тиісті көмек қызметіне\nжүгіну жағдайды түсінуге және одан шығудың қауіпсіз жолын табуға\nкөмектеседі.\n      Педагог білім алушыларға тақырыпқа қатысты постермен\nтанысуды ұсынады.\n      https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p\n0p/view?usp=sharing\n      «Менің әрекетім» жаттығуы\n      Педагог білім алушыларға төмендегі жағдаяттарды қарастырып,\nөз әрекеттерін анықтауды ұсынады.\n      1-жағдаят. Сыныптасың саған өзін шарасыз сезініп тұрғанын, бұл\nтуралы ешкімге айтпауыңды өтінді.\n      2-жағдаят. Әлеуметтік желіде саған қорқыту сипатындағы\nхабарламалар келіп жатыр. Хабарлама жіберуші бұл туралы ешкімге\nайтпауды талап етеді.\n      3-жағдаят. Үйдегі күрделі жанжалдан кейін досың үйіне қайтуға\nқорқатынын айтып, сенен көмек сұрады.\n      Сұрақтар:\n            Қауіп бар ма?\n            Кімнен көмек сұрайсың?\n            Егер көмек көрсетілмесе, не істейсің?\n      Педагог қорытынды жасайды:\n       Дағдарысты жағдайда мәселемен жалғыз қалмау және сенім\nартатын ересек адамнан көмек сұрау маңызды. Өмірге немесе\nденсаулыққа тікелей қауіп төнген жағдайда 112 нөміріне хабарласу\nқажет.\n      «Бағала – Жүгін – Хабарла – Көмек іздеуді жалғастыр»\nалгоритмі\n      1. Бағала. Өмірге немесе денсаулыққа тікелей қауіп бар ма?\nТікелей қауіп болған жағдайда қауіпсіздік ережелерін сақтап, шұғыл\nқызметтерге хабарлас (102, 103, 111).\n      2. Жүгін. Жағдай туралы өзің сенетін ересек адамға: ата-анаңа,\nпедагогке, мектеп психологіне, әлеуметтік педагогке немесе басқа\nжауапты ересек адамға айт.\n\n      3. Хабарла. Не болғанын, қай жерде екеніңді, қазіргі уақытта\nқауіптің бар-жоғын және қандай көмек қажет екенін қысқаша әрі нақты\nтүсіндір.\n      4. Ақпаратты сақта. Қорқыту, бопсалау немесе кибербуллинг\nжағдайында (егер мұны қауіпсіз түрде жасауға болса), хабарламалар\nмен басқа да материалдарды сақтап қой.\n      5. Көмек іздеуді жалғастыр. Егер бірінші жүгінген адам\nқолжетімсіз болса немесе қажетті көмек көрсете алмаса, басқа ересек\nадамға немесе тиісті қызметке жүгін.\n      Қолдау қызметтеріне жүгін\n      Қазақстанда балалар мен отбасыларға көмек көрсетудің бірыңғай\nмемлекеттік байланыс орталығының 111 нөміріне қоңырау шалуға\nболады.\n      Өмірге немесе денсаулыққа қауіп төнген жағдайда – 102 және 103\nнөмірлеріне хабарласу қажет.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n       «Адамға көмек қажет екенін көрсететін белгілердің бірі – ...»\n       «Егер бірінші жүгінген адам көмектесе алмаса, келесі қадам –\n...»\n       «Енді мен дағдарысты жағдайда ... жүгінуге болатынын\nбілемін».\n      Педагог:\n      - Дағдарысты жағдайда бәрін өз бетіңше шешуге тырыспау\nкерек. Өзің сенетін ересек адамға, психологке немесе тиісті маманға\nдер кезінде жүгіну жағдайды жеңілдетіп, дұрыс шешім табуға\nкөмектеседі.\n      Егер өмірге немесе денсаулыққа тікелей қауіп төнсе, уақыт\nжоғалтпай жедел қызметке хабарласу қажет. Ал бірінші жүгінген адам\nкөмектесе алмаса, көмек сұрауды тоқтатпа – басқа ересек адамға\nнемесе тиісті қызметке жүгін.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 3-сабақ — Ұлы дала коды"}, "grade-10/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Есірткі және есірткі тасымалынан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 374-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=374\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ           Есірткі және есірткі тасымалынан сақтану\nМақсаты            Білім алушылардың есірткі қылмыстарына тарту\n               әрекеттерін танып-білу және оның алдын алу\n               дағдыларын қалыптастыру.\nМіндеттері          жасөспірімдерді есірткі тасымалдауға тарту\n               кезінде қолданылатын алдау мен арбау тәсілдерін\n               ажырата білуге үйрету;\n                    құқыққа қайшы ұсыныстардан нық бас тарту\n               және ересектерден көмек сұрау дағдыларын дамыту;\n                    өз қауіпсіздігіне саналы түрде қарауға,\n               құрдастарының қысымына қарсы тұруға және жеке\n               шекарасын сақтауға тәрбиелеу.\n\n     Материалдар мен ресурстар\n     әлеуметтік желілер мен мессенджерлердегі «оңай табыс» туралы\nхабарландырулар мен бос жұмыс орындарының мысалдары берілген\nкарточкалар, ұсыныстарды талдауға арналған «Қауіпсіз» және\n«Қауіпті» карточкалары.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог білім алушыларға сұрақ қояды:\n     – «Оңай табыс» туралы ұсыныстың қандай белгілері\nжасөспірімге күмән тудыруы керек?\n     Білім алушылар жауап береді: ақшаға деген қызығушылық,\nаңғалдық, тәжірибенің аздығы, өз бетінше әрекет етуге деген ұмтылыс.\n     Педагог қорытынды жасайды:\n     – Кейде жасөспірім жұмыс жасауға келіскенде, ол жұмыстың\nартында алаяқтықпен ақша табу мүмкіндігі тұрғанын біле бермейді.\nСондықтан ұсыныстың қанша табыс әкелетініне ғана емес, жұмыстың\nзаңды, ашық және қауіпсіз екеніне де назар аудару керек.\n     II. Негізгі бөлім\n     «Тоқтау белгілері» жаттығуы\n     Педагог «жұмыс» туралы ұсыныстың белгілерін атайды. Білім\nалушылар олардың қандай тәуекелдерді жасыруы мүмкін екенін\nанықтайды:\n\n             жұмыс беруші өзінің кім екенін және қай ұйымның атынан\nәрекет ететінін айтпайды;\n             қарапайым әрекеттерді орындағаны үшін жоғары табысқа\nуәде береді;\n             нақты міндеттер мен жұмыс шарттарын түсіндірмейді;\n             «жұмыс» туралы ешкімге айтпауды сұрайды;\n             белгісіз заттарды алып кетуді, сақтауды немесе басқа\nадамдарға жеткізуді ұсынады;\n             шешімді дереу қабылдауды талап етеді.\n       Педагог сұрақ қояды:\n       – Осы белгілердің қайсысы сізді ұсыныстан бірден бас тартуға\nмәжбүр етеді және неліктен?\n       Педагог қорытынды жасайды:\n       «Заң және тәртіп» қағидаты бұл жағдайда заңсыз немесе\nкүмәнді ұсынысты тани білу, оған қатысудан бас тарту және дер кезінде\nкөмекке жүгіну дағдысын білдіреді.\n       Есірткі құралдары мен психотроптық заттардың заңсыз\nайналымы           Қазақстан        Республикасының        заңнамасына\nсәйкес қылмыстық жауаптылыққа әкеп соғады. Жасөспірімнің белгісіз\nзаттарды сыйақы үшін қабылдауы, сақтауы, тасымалдауы немесе басқа\nадамға беруі оны заңсыз әрекетке тартуы мүмкін.\n       Педагог      білім     алушыларға      тақырыпқа       қатысты\nбейнематериалмен танысуды ұсынады.\nhttps://drive.google.com/file/d/1sFZDk8NvsXWTkRR6Kps2stm1fuIepGV\nR/view?usp=sharing\n       «ТОҚТА» алгоритмі\n       Келіспе – ұсынысты қабылдама және күмәнді тапсырмаларды\nорындама.\n       Байланысты тоқтат – әңгімені жалғастырма және жеке немесе\nбанк деректерін берме.\n       Ақпаратты сақта – қорқыту немесе құқыққа қайшы әрекетке\nтарту әрекеті болған жағдайда, егер бұл қауіпсіз болса, хабарламаларды\nсақтап қой.\n       Хабарла – ата-анаңа немесе өзің сенетін басқа ересек адамға айт.\n       Көмекке қайда жүгінуге болады?\n             Ата-анаға, сынып жетекшісіне, мектеп психологіне немесе\nөзің сенетін басқа ересек адамға.\n             111 – балалар мен отбасыларға көмек көрсетудің бірыңғай\nмемлекеттік байланыс орталығы.\n             102 – қауіп төнген немесе қылмыс туралы ақпарат болған\nжағдайда полицияға.\n\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Қауіпті ұсыныстарды ... белгілерінен тануға болады».\n           «Егер маған «оңай табыс» ұсынса, мен ...»\n           «Бүгін мен қауіпсіздік дегеніміз ... екенін түсіндім».\n      Педагог:\n       Күмәнді «оңай табыс» туралы ұсыныс құқыққа қайшы\nәрекетке тартудың тәсілі болуы мүмкін. Қауіпсіз шешім – белгісіз\nтапсырмаларды орындамау, белгісіз заттарды алмау және\nтасымалдамау, байланысты тоқтату және жағдай туралы сенім артатын\nересек адамға хабарлау.\n      Қорқыту немесе қылмысқа тарту әрекеті болған жағдайда дер\nкезінде көмекке жүгіну қажет.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1sFZDk8NvsXWTkRR6Kps2stm1fuIepGV\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1sFZDk8NvsXWTkRR6Kps2stm1fuIepGV<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 4-сабақ — Ұлы дала коды"}, "grade-10/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Қоғамдық орындар мен көліктегі қауіпсіздік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 377-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=377\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№5 сабақ      Қоғамдық орындар мен көліктегі қауіпсіздік\n Мақсаты       Білім алушылардың қоғамдық көлікте және\n            қоғамдық орындарда қауіп-қатерді бағалау және\n            қауіпсіз әрекет ету стратегиясын таңдау дағдыларын\n            қалыптастыру\n Міндеттері    – білім алушыларды қоғамдық көліктегі және\n            қоғамдық орындардағы ықтимал қауіпті жағдайларды\n            тануға үйрету;\n               – қауіп деңгейін бағалау және қауіпсіз әрекет ету\n            тәсілін таңдау қабілетін дамыту;\n               – өз     әрекеттері    мен    олардың  салдарына\n            жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Cабақ барысында толтыруға арналған «Жеке қауіпсіздік\nережелері» кестесі, топтық жұмысқа арналған «Қауіпсіздік детекторы»\nкарточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Күн сайын біз қоғамдық көлікпен жүреміз, дүкенге, саябаққа,\nсауда орталығына және басқа да қоғамдық орындарға барамыз. Көп\nжағдайда біз еш кедергісіз өз жұмысымызды орындаймыз. Кейде күмән\nтудыратын немесе қауіп белгісі байқалатын жағдайлар кездесуі мүмкін.\n      Осындай сәтте абыржымай, жағдайды дұрыс бағалап, өз\nқауіпсіздігіңді сақтай отырып әрекет ету қажет.\n      Педагог      білім    алушыларға      тақырыпқа       қатысты\nбейнематериалмен танысуды ұсынады.\n      https://www.youtube.com/watch?v=HmkW6QsNb1k&amp;list=PLA5eC\nSY2FeoT00B3gyDuskOvkalEx7TmU&amp;index=19\n      II. Негізгі бөлім\n      Кейс-тапсырма\n      Педагог білім алушыларға келесі жағдайды елестетуді ұсынады:\n       Білім алушы автобуспен үйіне қайтып келе жатыр. Салон\nбіртіндеп адамға тола бастайды. Жанына бейтаныс адам отырады. Ол\nсені әңгімеге тартуға тырысып, кейін жеке сұрақтар қоя бастайды және\n\nбілім алушыдан телефонын көрсетуді сұрайды. Бұл кезде білім алушы\nөзін жайсыз сезінеді.\n      Педагог сұрақтары:\n           Жағдайдың қай тұстары алаңдаушылық тудырады?\n           Қалай қауіпсіз әрекет етуге болады?\n           Ішкі жайсыздық сезімін елемеуге бола ма?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог атап көрсетеді:\n      – Жайсыздық сезімі жағдайға назар аударып, ықтимал қауіпті\nбағалаудың белгісі болуы мүмкін. Егер адам жеке шекараны бұзса,\nжеке ақпаратты табанды түрде талап етсе, ұстап қалуға, аңдуға немесе\nқорқытуға тырысса, арақашықтықты ұлғайтып, көмекке жүгіну\nмаңызды.\n      «Жеке қауіпсіздік ережелері» жаттығуы\n      Педагог білім алушыларға кестені толтыруды ұсынады. Мысалы\n                     Көлікте                       Қоғамдық орындарда\n▪      жеке заттарыңды бақылауда ұста;                ▪ бағытты      және\n▪      қозғалыс кезінде тұтқадан берік ұста,       бейтаныс жерден шығу\nәсіресе көлік кенет тоқтағанда немесе бұрылғанда   жолдарын алдын ала\nтепе-теңдікті сақта;                               бағдарлай білу;\n▪      көлікке     кіргенде     апаттық     шығу      ▪ қажет      болған\nжолдарының және төтенше жағдайда терезені          жағдайда         жақын\nсындыруға арналған арнайы балғаның қай жерде       адамдармен\nорналасқанына назар аудар;                         байланыста болу;\n▪      мүмкіндік болса, қауіпсіз әрі өзіңе жайлы      ▪ қауіп        төнуі\nарақашықтық сақта;                                 мүмкін екенін сезсең,\n▪      адам өзін агрессивті түрде ұстаса, басқа    адам көп әрі қауіпсіз\nжолаушыларға немесе жүргізушіге жақынырақ          жерге бару;\nжерге бар;                                            ▪ нысан\n▪      жанжалды ушықтырма және қақтығысқа          қызметкерлеріне, күзет\nараласпа;                                          қызметіне, полицияға\n▪      қауіп төнген жағдайда көмекке жүгін.        немесе басқа жауапты\n                                                   ересектерге жүгіну.\n\n      Білім алушылар өз болжамдарын айтып, жауаптарын\nтолықтырады.\n      «Бағала – Алыста – Хабарла» алгоритмі\n      Бағала – не болып жатқанын және өмірге, денсаулыққа тікелей\nқауіп бар-жоғын анықта.\n      Алыста – арақашықтықты ұлғайт, адам көп немесе қауіпсіз жерге\nбар, жанжалға араласпа.\n      Хабарла – көлік қызметкеріне, күзет қызметіне, полицияға,\nжақын адамыңа немесе көмектесе алатын басқа адамға жүгін.\n\n            Өмірге немесе денсаулыққа тікелей қауіп төнген жағдайда\n– 102/103/112-ге хабарлас.\n            Құқыққа қайшы әрекет немесе басқа адамның тарапынан\nқауіп болған жағдайда – 102-ге хабарлас..\n            Күрделі жағдайда кеңес пен қолдау алу үшін – 111\nбайланыс орталығына хабарлас.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін аяқтап,\nөз пікірін айтуды ұсынады:\n            «Бүгін мен қоғамдық орындарда ... маңызды екенін\nтүсіндім».\n            «Егер мен өзімді жайсыз сезінсем, мен ...».\n            «Мен үшін қауіпсіздіктің ең маңызды ережесі – ...».\n      Педагог атап көрсетеді:\n       Жеке қауіпсіздік жағдайдың өзгергенін дер кезінде байқап,\nқауіпті азайтатын әрекетті таңдаудан басталады. Егер басқа адамның\nәрекеті алаңдаушылық туғызса, жеке шекараңды бұзса немесе қауіп\nтөндіре бастаса, арақашықтықты ұлғайтып, қауіпсіз жерге барып,\nкөмекке жүгіну қажет.\n      Өмірге немесе денсаулыққа тікелей қауіп төнген жағдайда\nжағдайды өз бетіңше шешуге тырыспа.\n\nҚазақстан Республикасы Денсаулық\nсақтау министрлігі ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=HmkW6QsNb1k&amp;list=PLA5eC\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=HmkW6QsNb1k&amp;list=PLA5eC<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 5-сабақ — Ұлы дала коды"}, "grade-10/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Жарақаттану кезіндегі алғашқы көмек<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 380-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=380\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ          Жарақаттану кезіндегі алғашқы көмек\nМақсаты           Білім алушылардың мамандар келгенге дейін\n               алғашқы көмек көрсету қажеттілігі туындаған\n               жағдайда     дұрыс     әрекет етуге    дайындығын\n               қалыптастыру\nМіндеттері         білім алушыларды алғашқы көмек көрсету\n               қажеттілігі туындаған кездегі жалпы әрекет ету\n               алгоритмімен таныстыру;\n                   шұғыл медициналық көмекке дереу жүгінуді\n               қажет ететін жағдайларды тануға үйрету;\n                   өз        қауіпсіздігіне    саналы      түрде\n               жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Алғашқы көмек көрсету тәсілдерін көрсетуге арналған манекен\n(тренажер, бар болса), бинт, стерильді майлықтар, эластикалық бинт,\nбір рет қолданылатын қолғаптар.\n      Ескерту. Осы тақырыптағы қауіпсіздік сабағын білім беру ұйымының\nмедицина қызметкерінің қатысуымен өткізу ұсынылады (білім беру ұйымының\nмүмкіндігіне қарай).\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог:\n     – Жағдайды елестетіп көріңдер. Мектептегі іс-шара кезінде бір\nоқушы тамақ ішіп отырып кенет қақалып қалады. Алғашында ол\nжөтелуге тырысады, бірақ біраздан кейін сөйлей алмай, тыныс алуы\nқиындай бастайды. Қасындағы оқушылардың бірі абдырап қалады,\nекіншісі көмекке ересек адамды шақырады, ал тағы біреуі 103 нөміріне\nхабарласу керек екенін айтады.\n     Білім алушыларға сұрақтар:\n     – Бұл жағдайда қандай белгілер қауіптің күшейгенін көрсетеді?\n     – Ең алдымен не істеу керек?\n     – Кімді көмекке шақыру қажет?\n     – Қандай жағдайда жедел медициналық көмекке хабарласу\nкерек?\n     Талқылаудан кейін педагог қорытынды жасайды:\n\n      – Мамандар келгенге дейін қасындағы адамдар ағлашқы көмек\nкөрсете алады: жағдайдың қауіпті екенін дер кезінде байқап, ересек\nадамды шақыру, жедел қызметке хабарласу және өздері білетін қауіпсіз\nалғашқы көмек әрекеттерін орындау қажет.\n      Ең бастысы – өзіңді де, зардап шеккен адамды да қосымша\nқауіпке тікпей, мамандардың көмегіне тез жүгін.\n      II. Негізгі бөлім\n      Педагог       білім    алушыларға       тақырыпқа      қатысты\nбейнематериалмен танысуды ұсынады.\n      https://drive.google.com/file/d/1WvB65-\nfQwf0pTejx5v0PdLD4t6Cur2Y3/view?usp=sharing\n      Ақпараттық блок\n      Медицина қызметкері алғашқы көмек қажет болатын\nжағдайларды түсіндіреді. Атап айтқанда, адам:\n       есінен айырылса;\n       тамаққа қақалып, дем алуы қиындаса;\n       қатты қан кетсе;\n       күйік немесе ауыр жарақат алса;\n       оған айтылған сөздерге немесе үндеуге жауап бермесе.\n      Медицина қызметкері ерекше атап көрсетеді:\n      Алғашқы көмек – бұл медицина қызметкерлері келгенге дейін\nзардап шеккен адамға көрсетілетін қолдау.\n      «Адам тамаққа қақалған жағдайда» практикалық\nдемонстрациясы\n      Медицина қызметкері білім алушыларды тыныс алу жолдарының\nбітелу белгілерімен таныстырып, бөгде заттың тыныс алу жолына түсуі\nкезіндегі алғашқы көмектің қолданыстағы алгоритмін манекенде\n(тренажерде) көрсетеді.\n      Білім алушыларға қақалған адамның жөтеліп, сөйлеп, тыныс ала\nалуы мен тыныс алуының қатты қиындауы немесе мүлде тоқтауы\nарасындағы айырмашылық түсіндіріледі.\n      Алғашқы көмек көрсету тәсілдерін практикалық түрде орындау\nмедицина қызметкерінің немесе тиісті даярлықтан өткен маманның\nжетекшілігімен жүргізіледі. Манекен немесе тренажер болмаған\nжағдайда педагог әрекет ету ретін түсіндіреді, көрнекі материал немесе\nбейнематериал қолданады.\n      Маңызды!\n      Алғашқы көмек көрсету тәсілдерін дайындықтан өткен\nмаманның жетекшілігімен меңгеріп, тренажерде пысықтау қажет.\nНақты жағдайда ең алдымен қауіпсіздікті бағалап, ересектерді дереу\nкөмекке шақырып, 103 немесе 112 нөміріне хабарласу керек. Әрі\n\nқарайғы әрекеттерді меңгерілген алғашқы көмек алгоритміне және\nшұғыл қызмет диспетчерінің нұсқауларына сәйкес орындау қажет.\n      Жалпы алгоритм\n      Қауіпсіздікті бағала – оқиға болған жер өзіңе және зардап шеккен\nадам үшін қауіпсіз екеніне көз жеткіз.\n      Жағдайды бағала – адамның есін білгенін, қалыпты тыныс алып\nжатқанын және өміріне анық қауіп бар-жоғын анықта.\n      Көмекке шақыр – ересек адамды, медицина қызметкерін немесе\nжақын маңдағы басқа адамдарды көмекке тарт.\n      Шұғыл көмек шақыр – адамның жағдайы өміріне немесе\nденсаулығына қауіп төнсе, 103 нөміріне хабарлас.\n      Өз дағдыларың шегінде әрекет ет – тек өзің үйренген алғашқы\nкөмек тәсілдерін орында.\n      Қауіпсіз болса, көмек келгенге дейін зардап шеккен адамның\nжанында бол.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n          «Бүгін мен алғашқы көмек – бұл ... екенін түсіндім».\n          «Егер жанымдағы адам өзін нашар сезінсе, мен ...».\n          «Алғашқы көмектің ең маңызды ережесі – ...».\n          «Енді мен алдымен ... жасау керектігін білемін».\n      Педагог қорытынды жасайды:\n       Алғашқы көмек жағдайды қауіпсіз бағалаудан және\nмамандарды дер кезінде шақырудан басталады. Өзіңді қауіпке\nтөндірме, мүмкіндігінше тез ересектерді және шұғыл қызметтерді\nкөмекке шақыр, тек өзің меңгерген әрекеттерді орында.\n      Көмекке қарапайым әрі дер кезінде қоңырау шалудың өзі –\nмаңызды және жауапты әрекет.\n\nҚазақстан Республикасының Жасанды\nинтеллект және цифрлық даму\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1WvB65-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1WvB65-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 6-сабақ — Ұлы дала коды"}, "grade-10/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Дипфейктер, ЖИ арқылы жасалатын алаяқтық және цифрлық бедел<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 383-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=383\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№7 сабақ           Дипфейктер,     ЖИ      арқылы     жасалатын\n               алаяқтық және цифрлық бедел\nМақсаты            Білім алушылардың цифрлық манипуляциялар\n               мен жасанды     интеллект     арқылы    жасалатын\n               алаяқтықты тану, ақпаратты тексеру және цифрлық\n               ортада қауіпсіз шешім қабылдау дағдыларын\n               қалыптастыру.\nМіндеттері         - білім   алушыларды «дипфейк»,      «жасанды\n               интеллект арқылы жасалатын алаяқтық», «цифрлық\n               бедел» ұғымдарымен таныстыру;\n                   - цифрлық контентті тарату немесе пайдалану\n               алдында оның мазмұнын талдау, сыни ойлау және\n               ақпараттың дұрыстығын бағалау қабілетін дамыту;\n                   - ақпаратты     таратуға     және     цифрлық\n               технологияларды, соның ішінде жасанды интеллект\n               құралдарын пайдалануға жауапкершілікпен қарауға\n               тәрбиелеу.\n\n     Материалдар мен ресурстар\n     Цифрлық жағдайлардың мысалдары берілген карточкалар\n(дипфейктер, жалған хабарламалар, күдікті сілтемелер, әлеуметтік\nжелілердегі жарияланымдар).\n     Сабақ барысы\n     I. Кіріспе бөлім\n     «Бұл шынымен өзі ме?» кейс-тапсырмасы\n     Педагог білім алушыларға келесі жағдайды ұсынады:\n      Мектептің чатында жасөспірімдердің бірі қорлайтын сөздер\nайтып тұрғандай көрінетін бейнежазба пайда болады. Бейне тез тарала\nбастайды. Кейін бұл бейненің жасанды интеллект технологиялары\nарқылы жасанды түрде жасалғаны немесе өзгертілгені анықталады.\n     Педагог:\n      Бейнежазбада бейнеленген адам үшін қандай салдар туындауы\nмүмкін?\n      Мұндай бейнені тексермей тарату қауіпсіз деп санауға бола ма?\n      Егер сіз осындай бейнеролик алсаңыз, не істер едіңіз?\n     Білім алушылар өз болжамдарын айтады.\n\n      Педагог:\n      – Заманауи технологиялар шынайы көрінетін суреттерді, аудио\nжәне бейнежазбаларды жасауға мүмкіндік береді. Сондықтан эмоция\nақпаратты тексеруден бұрын әрекетке итермелемеуі керек. Егер мазмұн\nкүмән тудырса немесе біреуге зиян келтіруі мүмкін болса, оны\nтексермей тұрып таратуға болмайды.\n      II. Негізгі бөлім\n      Ақпараттық блок\n      Педагог түсіндіреді:\n      - Дипфейк – жасанды интеллект технологияларының көмегімен\nжасалған немесе өзгертілген сурет, аудио немесе бейне. Ол шынайы\nадамның іс жүзінде айтпаған сөзді айтқанын немесе жасамаған әрекетті\nжасағанын көрсетіп, жалған әсер қалдыруы мүмкін.\n      Цифрлық бедел – адамның интернеттегі әрекеттері негізінде\nқалыптасатын ол туралы пікір. Цифрлық беделге мыналар әсер етеді:\n       жарияланымдар;\n       пікірлер мен комментарийлер;\n       фотосуреттер;\n       бейнематериалдар;\n       әлеуметтік желілердегі цифрлық із.\n      «Цифрлық тергеу» ойыны\n      Сынып топтарға бөлінеді. Әр топқа цифрлық жағдай сипатталған\nкарточка беріледі.\n      1-карточка. Бейтаныс нөмірден досыңның даусына ұқсас\nдауыстық хабарлама келеді. Хабарламада шұғыл түрде басқа адамның\nбанк картасына ақша аудару және кері қоңырау шалмау сұралады.\n      2-карточка. Әлеуметтік желіде дереккөзі көрсетілмеген белгілі\nблогердің беделіне нұқсан келтіретін бейне пайда болады.\n      3-карточка. Әлеуметтік желіде       сыныптасыңның күмәнді\nбейнежазбасы пайда болады. Оның шынайы жазба екені немесе\nжасанды интеллект көмегімен жасалғаны белгісіз. Достарың оны дереу\nмектеп чатына жіберуді ұсынады.\n      Тапсырма\n      Топ 2 минут ішінде төмендегі сұрақтарға жауап дайындайды:\n      1.    Қандай қауіптер бар?\n      2.    Ақпаратты қалай тексеруге болады?\n      3.    Қандай салдар туындауы мүмкін?\n      4.    Қандай қауіпсіз шешім қабылдау қажет?\n      Талқылаудан кейін топтар өз болжамдарын таныстырады.\n      «Біздің цифрлық қорытындымыз»:\n           сенуге болмайды;\n\n            алдымен тексеру қажет;\n            тексерілгеннен кейін қауіпсіз.\n      «ТОҚТА – ТЕКСЕР – РАСТА – ӘРЕКЕТ ЕТ» алгоритмі\n      Тоқта – күдікті сілтемеге өтпе, ақша аударма және күмәнді\nконтентті қайта жіберме.\n      Тексер – хабарламаның дереккөзін және оның мәнмәтінін\nанықта.\n      Раста – ақпаратты ресми дереккөз немесе басқа байланыс арнасы\nарқылы қайта тексер. Егер «танысың» ақша сұраса, онымен бұрын\nпайдаланған байланыс тәсілі арқылы хабарлас.\n      Әрекет ет – ақпарат расталмаса, оны таратпа. Алаяқтық әрекет\nбайқалса, байланысты тоқтат, қажетті дәлелдерді сақта және көмекке\nжүгін.\n      Маңызды!\n      «Заң және тәртіп» қағидаты. Жасанды интеллект\nтехнологияларын пайдалану адамның өз әрекеттері үшін\nжауапкершілігін жоймайды. Жалған контент жасау немесе тарату басқа\nадамдардың құқықтарын бұзуы мүмкін. Ал жалған аудио, бейне,\nаккаунттар немесе хабарламаларды алдау, қорқыту, бопсалау немесе\nақша алу мақсатында пайдалану Қазақстан Республикасының\nзаңнамасына сәйкес құқықтық салдарға әкелуі мүмкін.\n      Егер     цифрлық     жағдай қорқытуға,     бопсалауға   немесе\nалаяқтыққа байланысты болса, ақпаратты сақтап, сенімді ересек адамға\nхабарласу маңызды. Құқыққа қайшы әрекет белгілері болған\nжағдайда 102 нөмірі бойынша полицияға, ал кеңес пен қолдау алу\nүшін 111 байланыс орталығына жүгінуге болады.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін аяқтап,\nөз пікірін айтуды ұсынады:\n      «Бүгін мен дипфейк ... мүмкін екенін түсіндім».\n      «Бейне немесе хабарламаны қайта жібермес бұрын, мен ...».\n      «Менің цифрлық беделім үшін ... маңызды».\n      Педагог атап көрсетеді:\n      – Жасанды интеллект шынайылыққа жанасатын контент жасай\nалады. Сондықтан ақпараттың дереккөзін және мазмұнын тексер.\nКүмәнді контентті таратпа. Ақша немесе жеке деректерді\nсұрайтын күдікті өтініштерді орындама.\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 7-сабақ — Ұлы дала коды"}, "grade-10/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Интернеттегі таныстықтан туындайтын қауіптер<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 386-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=386\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ          Интернеттегі        таныстықтан     туындайтын\n              қауіптер\nМақсаты           Білім алушылардың интернеттегі қауіпсіз қарым-\n              қатынас жасау дағдыларын қалыптастыру.\nМіндеттері         білім алушыларды интернеттегі таныстықтардың\n              негізгі қауіптерімен таныстыру;\n                   қауіпті қарым-қатынас пен интернеттегі айла-\n              тәсілді тану қабілетін дамыту;\n                   интернетте          қарым-қатынас     жасауға\n              жауапкершілікпен және сақтықпен қарауға, жеке\n              шекараны құрметтеуге тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «ОЙЛАН – ТЕКСЕР – ӨЗІҢДІ ҚОРҒА» алгоритмі жазылған\nкарточка.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      - Әлеуметтік желіде сізге шамамен өзіңізбен құрдас адам\nхабарласады. Сіз бірнеше апта бойы сөйлесіп жүрсіз. Әңгімелесуші\nсыпайы, сізді үнемі қолдайды, өміріңізге қызығушылық танытады.\nБіраз уақыттан кейін ол сізбен жеке кездесуді ұсынады және хат\nалмасуларыңыз туралы ешкімге айтпауыңызды сұрайды.\n      Білім алушыларға сұрақтар:\n       Адаммен ұзақ уақыт хат алмасқаныңыз үшін ғана оған\nтолықтай сенуге бола ма?\n       Қарым-қатынасты құпия сақтауды сұрау неліктен сақ болуға\nсебеп болуы керек?\n       Мұндай таныстық кезінде қандай қауіптер туындауы мүмкін?\n      Білім алушылар өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n      – Интернетте адам өзі туралы шындыққа сәйкес келмейтін немесе\nбірден тексеру қиын ақпарат беруі мүмкін. Сондықтан интернеттегі\nтаныстықты адамның қаншалықты сыпайы не мейірімді көрінетініне\nнемесе қанша уақыттан бері сөйлесіп жүргендеріңе қарап бағаламау\nкерек.\n\n       Ең алдымен оның әрекетіне назар аудар: жеке шекараңды\n құрметтемеу, қарым-қатынасты құпия ұстауды талап ету, жеке\n мәліметтеріңді, фотосуреттеріңді немесе ақша сұрау, күмән тудыратын\n кездесуге шақыру. Осындай белгілер байқалса, сақтық танытып, өзің\n сенетін ересек адамнан кеңес сұраған дұрыс.\n       ІІ. Негізгі бөлім\n       «Қауіпті белгілерді анықтау» жаттығуы\n       Педагог білім алушыларға интернеттегі әңгімелесушінің қандай\nәрекеттері күмәндануға себеп болуы мүмкін екенін, ал қайсысы қауіпсіз\nекенін анықтауды ұсынады:\n          ортақ қызығушылықтар туралы сөйлеседі;\n          қарым-қатынасты құпия сақтауды сұрайды;\n          мерекемен құттықтайды;\n          өте қысқа уақытта «ең жақын дос» болуға тырысады;\n          жеке фотосуреттерді жіберуді сұрайды;\n          бірге онлайн ойын ойнауды ұсынады;\n          мекенжайың мен күн тәртібіңе қызығушылық танытады;\n          сенің бас тартуыңды сабырлы түрде қабылдайды;\n          ересектерден жасырын кездесуді ұсынады;\n          құпиясөзді немесе растау кодын хабарлауды сұрайды;\n          өтінішін орындаудан бас тартсаң, қорқытады немесе\nбопсалайды.\n       Сұрақтар:\n             Қандай әрекеттер сізді алаңдатты және неліктен?\n             Мұндай жағдайда қалай әрекет ету керек?\n       Педагог атап көрсетеді:\n       Егер қарым-қатынас алаңдаушылық немесе қорқыныш тудырса,\nәсіресе әңгімелесуші қысым көрсетсе, құпия сақтауды талап етсе, бас\nтартуды қабылдамаса, қорқытса немесе бопсаласа. бұл белгілерді\nелемеуге болмайды. Қауіпті қарым-қатынасты тоқтатып, көмекке\nжүгіну қажет. Құпия кездесуге келіспе. Ата-анаңа немесе басқа сенімді\nересек адамға кіммен, қай жерде және қашан кездесуді жоспарлап\nотырғаныңды айт. Пәтерде, автокөлікте, адам аз немесе бейтаныс жерде\nкездесуге келіспе. Егер кездесу туралы ұсыныс қысыммен, қорқытумен\nнемесе оны жақындарыңнан жасыру талабымен бірге айтылса – бас тарт\nжәне қарым-қатынасты тоқтат.\n       «ОЙЛАН – ТЕКСЕР – ӨЗІҢДІ ҚОРҒА» алгоритмі\n       ОЙЛАН\n       Асықпа және жеке деректеріңді, құпиясөздерді, растау кодтарын\nнемесе банк ақпаратын ешкімге хабарлама.\n       ТЕКСЕР\n\n       Тек профильге, фотосуретке, дауысқа немесе бейнеге қарап\nсенбе. Ақпаратты тексер және алдау немесе қысым көрсету белгілеріне\nназар аудар.\n       ӨЗІҢДІ ҚОРҒА\n       Қорқыту, бопсалау немесе қысым көрсету жағдайында қарым-\nқатынасты тоқтат, қажетті дәлелдерді сақта, пайдаланушыны бұғатта\nжәне     сенімді      ересек     адамға     хабарла.  Қажет   болған\nжағдайда 102 нөміріне, ал кеңес пен қолдау алу үшін 111 байланыс\nорталығына жүгін.\n       Педагог білім алушыларға тақырыпқа қатысты ақпараттық\nпостермен танысуды ұсынады.\n       https://drive.google.com/file/d/1ks4dDioHbCyR0uX1AKutz71qg6S\nNfsrT/view?usp=drive_link\n       III. Қорытынды бөлім\n       Педагог білім алушыларға сөйлемді аяқтауды ұсынады:\n       – «Осы сабақтан кейін интернетте бейтаныс адаммен қарым-\nқатынас жасағанда мен ...»\n       Бірнеше білім алушы өз жауаптарын айтады.\n       Педагог қорытынды жасайды:\n       – Интернеттегі қарым-қатынаста жеке шекараны сақтау,\nақпаратты тексеру және қысымға берілмеу маңызды. Егер жағдай\nалаңдаушылық немесе күмән тудырса – қарым-қатынасты тоқтатып,\nсенімді ересек адамнан көмек сұраңыз.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1ks4dDioHbCyR0uX1AKutz71qg6S\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1ks4dDioHbCyR0uX1AKutz71qg6S<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 8-сабақ — Ұлы дала коды"}, "grade-10/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Қаржылық алаяқтықтан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 389-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=389\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№9 сабақ           Қаржылық алаяқтықтан сақтану\nМақсаты            Білім алушылардың қаржылық алаяқтықтың\n              заманауи түрлері туралы білімдерін және қауіпсіз\n              әрекет ету дағдыларын қалыптастыру.\nМіндеттері         - білім алушыларды қаржылық алаяқтықтың кең\n              таралған схемаларымен таныстыру;\n                   - ақшаға, банк карталарына және цифрлық\n              сервистерге қатысты қауіпсіз мінез-құлық дағдыларын\n              дамыту;\n                   - қаржылық сауаттылыққа        жауапкершілікпен\n              қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Жағдайларды талдауға арналған «Қауіпсіз» және «Қауіпті»\nкарточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Сізге бір адам қоңырау шалып, өзін банк қызметкері ретінде\nтаныстырды деп елестетіңіз. Ол:\n      «Сіздің банк картаңыздан күдікті операциялар байқалды.\nҚаражатыңызды қорғау үшін операцияның күшін жоюды шұғыл\nрастауыңыз қажет. Қазір сізге код келеді – оны маған айтыңыз. Егер\nмұны жасамасаңыз, ақшаңыз есептен шығарылуы мүмкін», – дейді.\n      Педагог:\n            Мұндай хабарлама неліктен алаңдаушылық тудыруы\nмүмкін?\n            Қандай белгілер сақ болуға себеп болуы керек?\n            Мұндай жағдайда қалай әрекет ету қажет?\n      Білім алушылар жауап береді.\n      Педагог қорытынды жасайды:\n      – Алаяқтар адамдардың қорқынышын, асығыстығын және\nсенімін жиі пайдаланады. Олардың негізгі мақсаты – ақшаға немесе\nжеке деректерге қол жеткізу. Бүгін біз осындай схемаларды қалай\nтануға және өзімізді қалай қорғауға болатынын қарастырамыз.\n      II. Негізгі бөлім\n      «Алаяқты таны» жаттығуы\n\n      Педагог білім алушыларға төмендегі ұсыныстардың қайсысы\nалаяқтық болуы мүмкін екенін анықтауды ұсынады.\n      1-хабарлама\n      «Құттықтаймыз! Сіз смартфон ұтып алдыңыз. Сыйлықты алу\nүшін 15 минут ішінде жеткізу қызметінің комиссиясын төлеу қажет».\n      2-хабарлама\n      «Сәлеметсіз бе, бұл банктің қауіпсіздік қызметі. Қаражатыңызды\nесептен шығаруға әрекет жасалғаны анықталды. Қазір операцияны\nжою үшін сізге код келеді. Оны қызметкерге айтыңыз».\n      3-хабарлама\n      «Сіздің аккаунтыңыз бұғатталады. Жеке басыңызды растау үшін\nшұғыл түрде сілтеме арқылы өтіп, жеке кабинетіңізге кіріңіз».\n      4-хабарлама\n      «Досың жаңа аккаунттан жазды: «Мен мәселеге тап болдым.\nДереу ақша қажет болып тұр. Кейін бәрін түсіндіремін».\n      5-хабарлама\n      «Интернет-дүкенде тауар әдеттегі бағадан әлдеқайда арзан\nсатылып жатыр. Сатушы сатып алу ақысын жеке банк картасына\nаударуды сұрайды».\n      Талқылаудан кейін педагог сұрақ қояды:\n      Педагог:\n      – Алаяқтық хабарламаларды не біріктіреді?\n      – Қандай белгілер сақ болуға себеп болуы керек?\n      Алаяқтар әртүрлі сценарийлерді қолдануы мүмкін, бірақ көбіне\nұқсас тәсілдерге жүгінеді:\n            асығыстық сезімін тудырады: «дәл қазір», «соңғы\nмүмкіндік», «шот бұғатталады»;\n            қорқыныш немесе қатты қобалжу сезімін туындатады;\n            күтпеген пайда, сыйлық немесе оңай табыс уәде етеді;\n            өзін банк, мемлекеттік орган, жеткізу қызметінің\nқызметкері ретінде таныстырады;\n            растау кодын, құпиясөзді немесе басқа да құпия\nақпаратты хабарлауды сұрайды;\n            сілтемеге өтуді немесе белгісіз қосымшаны орнатуды\nұсынады;\n            ақшаны басқа шотқа немесе картаға аударуды талап етеді;\n            болып жатқан жағдайды ешкімге айтпауға көндіреді.\n      Педагог            білім         алушыларға         тақырыпқа\nқатысты бейнематериалмен танысуды ұсынады.\n      https://drive.google.com/file/d/1H8lfT5i-\nMiI9cgvzPPkydlb2imhaLVA9/view?usp=drive_link\n\n       «ТОҚТА – ТЕКСЕР – ХАБАРЛА» алгоритмі\n       ТОҚТА\n       Қысыммен және асығыс жағдайда қаржылық әрекеттер жасама.\nРастау кодтарын, құпиясөздерді және басқа да құпия ақпаратты\nешкімге айтпа. Күмәнді сілтемелерге өтпе.\n       ТЕКСЕР\n       Банкпен немесе ұйыммен ресми байланыс арнасы арқылы өзің\nхабарлас. Егер хабарлама танысыңнан келгендей көрінсе, онымен басқа\nбайланыс тәсілі арқылы хабарласып, оның шынымен саған\nхабарласқанын анықта.\n       ХАБАРЛА\n       Алаяқтық әрекетке тап болсаң, ата-анаңа немесе басқа сенімді\nересек адамға хабарла. Қажет болған жағдайда банкке және тиісті\nоргандарға жүгін.\n       Егер жеке деректеріңді беріп қойсаң немесе ақша аударсаң\n       1.    Қорқып немесе ұялып, болған жағдайды жасырма.\nАлаяқпен өз бетіңше келісуге немесе мәселені жалғыз шешуге\nтырыспа.\n       2.    Мүмкіндігінше тезірек ата-анаңа немесе өзің сенетін\nересек адамға айт. Егер банк картасына немесе шотыңа қатысты\nдеректерді беріп қойсаң, банкке ресми байланыс арналары арқылы\nдереу хабарлас. Шотыңды бұғатта.\n       3.    Егер алаяқтық жасалса немесе ақшаңды жоғалтсаң,\nполицияға жүгін. Неғұрлым ертерек әрекет етсең, келтірілетін зиянды\nазайту мүмкіндігі соғұрлым жоғары болады.\n       II. Қорытынды бөлім\n       Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n            «Бүгін мен қаржылық алаяқтықтың ... екенін түсіндім».\n            «Егер мені ақша аударуға немесе кодты айтуға асықтырса,\nмен ...».\n            «Күмәнді хабарламаны тексеру үшін мен ...».\n            «Егер деректерімді айтып қойсам немесе ақша аударып\nқойсам, мен ...».\n       Білім алушылардың жауаптарын тыңдағаннан кейін педагог\nсабақтың негізгі қорытындысын жасайды.<\/div><p><a href=\"https://drive.google.com/file/d/1H8lfT5i-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1H8lfT5i-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 9-сабақ — Ұлы дала коды"}, "grade-10/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Жұмысқа орналасудағы құқықтар мен қауіпсіздік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 392-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=392\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ         Жұмысқа орналасудағы құқықтар мен\n              қауіпсіздік\n Мақсаты           Білім    алушылардың      қауіпсіз   жұмысқа\n              орналасу, кәмелетке толмаған жұмыскерлердің\n              құқықтары және алғашқы жұмысын іздеу кезіндегі\n              ықтимал қауіптер туралы түсініктерін қалыптастыру.\n Міндеттері         білім алушыларды жұмысқа орналасу кезінде\n              кәмелетке толмағандардың негізгі құқықтарымен\n              таныстыру;\n                    қауіпті немесе заңсыз жұмыстың белгілерін\n              тану дағдыларын дамыту;\n                    қаржылық сауаттылыққа жауапкершілікпен\n              қарауға тәрбиелеу.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Жұмысты таңдаймын» жаттығуы\n      Педагог үш жұмыс туралы хабарландыруды ұсынады:\n      №1 вакансия\n      Курьер. Жұмыс – сабақтан кейін және күніне 4 сағат. Әр\nжеткізген тауарың үшін төлем. Сынақ мерзімінен кейін ресми түрде\nжұмысқа қабылдау. Толық ақпарат сұхбат барысында беріледі.\n      №2 вакансия\n      Кітап дүкеніне көмекші. Міндеттері, жұмыс кестесі және\nеңбекақы мөлшері көрсетілген. Ресми түрде жұмысқа қабылдау\nқарастырылған.\n      №3 вакансия\n      Қашықтан жұмыс. Жоғары табыс. Өзінің банк картасына ақша\nаударымдарын қабылдап, оларды көрсетілген реквизиттер бойынша\nбасқа тұлғаларға аудару қажет.\n      Педагог:\n      – Жұмысқа орналасу туралы шешім қабылдау үшін сізге қандай\nақпарат жетіспейді?\n      Талқылаудан кейін педагог қорытынды жасайды:\n      – Кез келген тартымды ұсыныс қауіпсіз бола бермейді. Жұмысқа\nкелісім бермес бұрын оның шарттарын тексеру, жұмыс беруші туралы\nақпаратты анықтау және өз құқықтарыңды білу маңызды.\n      II. Негізгі бөлім\n      «Жұмысты бастамас бұрын нені тексеру керек?» шағын\nәңгіме\n      Педагог түсіндіреді:\n\n      – Жұмысқа орналасуға келісім бермес бұрын мыналарды анықтау\nмаңызды:\n           жұмыс беруші кім екенін;\n           қандай міндеттерді орындау қажет екенін;\n           еңбек қатынастарының қалай рәсімделетінін;\n           жұмыс кестесі қандай екенін;\n           еңбекақы мөлшері және оны төлеу тәртібі қандай екенін;\n           жұмыс жағдайларының жас ерекшелігіне сәйкес келетінін;\n           еңбек жағдайларының қауіпсіз екенін;\n           нақты жұмыс жағдайлары уәде етілген шарттардан өзгеше\nболған жағдайда кімге жүгінуге болатынын.\n      Маңызды:\n      Кәмелетке        толмаған      жұмыскерлердің       Қазақстан\nРеспубликасының заңнамасында көзделген еңбек құқықтары мен\nқосымша кепілдіктері бар. Жұмыс денсаулыққа зиян келтірмеуі, оқу\nпроцесіне кедергі келтірмеуі және кәмелетке толмағандарға тыйым\nсалынған қызмет түрлерін қамтымауы тиіс.\n      «БІЛ – ТЕКСЕР – ТАЛҚЫЛА – ШЕШІМ ҚАБЫЛДА»\nалгоритмі\n      БІЛ\n      Жұмыс міндеттерін, жұмыс кестесін, еңбекақыны және еңбек\nжағдайларын нақтыла.\n      ТЕКСЕР\n      Жұмыс берушінің кім екенін және ұсыныстың заңдылығын\nтексер.\n      ТАЛҚЫЛА\n      Ұсынысты ата-анаңмен, заңды өкіліңмен немесе басқа сенімді\nересек адаммен талқыла.\n      ШЕШІМ ҚАБЫЛДА\n      Тек түсінікті, заңды және қауіпсіз жұмысқа келіс. Егер елеулі\nкүмән қалса – бас тарт.\n      Егер жұмысқа орналасу кезінде алдансаң...\n      Егер саған уәде етілген еңбекақы төленбесе, жұмыс жағдайлары\nөзгертілсе немесе сені қауіпті не заңсыз әрекеттерді орындауға\nмәжбүрлесе, қорқыныштан немесе ұяттан бұл жағдайды жасырма.\n      Көмек алу үшін қайда жүгінуге болады?\n           Ата-анаңа, заңды өкіліңе немесе басқа сенімді ересек\nадамға – күрделі жағдайды жалғыз шешуге тырыспа.\n           Мемлекеттік еңбек инспекциясына – еңбек құқықтары\nбұзылған жағдайда, соның ішінде еңбекақының уақытында төленбеуі\n\nнемесе қауіпсіз еңбек жағдайларының қамтамасыз етілмеуі бойынша\nаумақтық мемлекеттік еңбек инспекциясы органына жүгінуге болады.\n            111 – кәмелетке толмаған баланың құқықтары бұзылып,\nкеңес немесе көмек қажет болған жағдайда. Байланыс орталығы тәулік\nбойы жұмыс істейді және балалардың құқықтарын қорғауға қатысты\nөтініштерді қабылдайды.\n            102 – жасөспірімді заңға қайшы әрекетке тартса, қорқытса,\nбопсаласа немесе қылмыс белгілері болса.\n            112 – өмірге немесе денсаулыққа тікелей қауіп төнген\nжағдайда.\n      Маңызды: Кәмелетке толмағандардың қауіпсіз еңбек ету құқығы\nҚазақстан Республикасының заңнамасымен қорғалады.\n      Педагог білім алушылардың назарын тақырыптық\nбейнероликке аударады.\n      https://www.youtube.com/watch?v=p_T2yVlgtBY&amp;list=PLA5eCSY\n2FeoTMEec8T451Um4EJpuikdqk&amp;index=12\n      III. Қорытынды бөлім\n      Рефлексия. «Менің алғашқы жұмыс күнім»\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n            «Алғашқы жұмысымның алдында мен міндетті түрде ...»\n            «Енді мен қауіпсіз жұмыстың ... екенін білемін».\n            «Егер жұмыс туралы ұсыныс күмәнді болып көрінсе, мен\n...»\n            «Жұмыскердің ең маңызды құқықтарының бірі – ...»\n      Бірнеше білім алушы өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n      – Алғашқы жұмыс – тәжірибе жинауға, ақша табуға және өз\nбетінше әрекет етуге мүмкіндік береді. Бірақ қауіпсіз жұмыс заңды,\nтүсінікті және жас ерекшелігіне сай болуы керек.\n      Жұмысқа орналасар алдында жұмыс берушіні, міндеттерді, еңбек\nжағдайларын, жұмыс кестесін және еңбекақыны тексеру маңызды.\n      Егер жұмыс жағдайлары күтпеген жерден өзгерсе, қауіпті бола\nбастаса немесе сізді алдын ала келісілмеген әрекеттерді орындауға\nмәжбүрлесе, үндемей қалмаңыз – қауіпті әрекетті тоқтатып, көмекке\nжүгініңіз.\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=p_T2yVlgtBY&amp;list=PLA5eCSY\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=p_T2yVlgtBY&amp;list=PLA5eCSY<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 10-сабақ — Ұлы дала коды"}, "grade-10/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Суда және табиғат аясындағы қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 395-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=395\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№11 сабақ         Суда және табиғат аясындағы қауіпсіздік\n               ережелері\n Мақсаты           Білім алушылардың суда және табиғат аясында\n               демалу кезінде өз қауіпсіздігіне жауапкершілікпен\n               қарау дағдыларын қалыптастыру.\n Міндеттері        - білім алушыларда суда және табиғат аясында\n               қауіпсіз демалудың негізгі ережелерін бекіту;\n                   - қауіп-қатерді бағалау және қауіпсіз шешім\n               қабылдау дағдыларын дамыту;\n                   - өз іс-әрекетіне жауапкершілікпен қарауға және\n               қауіпсіз шешім қабылдай білуге тәрбиелеу.\n\n      Материалдар мен ресурстар\n      әртүрлі қауіпті жағдайлар бейнеленген карточкалар;\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Жағдаят\n      Достар тобы демалыс күнін көл жағасында өткізуді шешті. Олар\nсуға түсуді, сапбордпен жүзуді, от жағып тамақ дайындауды және\nкешке үйлеріне қайтуды жоспарлап отыр.\n      Педагог сұрақ қояды:\n            Сіздің ойыңызша, демалыстың қай сәтінде жағдай қауіпті\nболуы мүмкін?\n            Қандай қауіптер табиғи жағдайларға байланысты, ал\nқандай қауіптерді өз әрекеттеріміз арқылы азайтуға болады?\n      Білім алушылардың жауаптарын тыңдағаннан кейін педагог\nқорытынды жасайды:\n      – Қауіпті жағдай күтпеген жерден туындауы мүмкін, алайда\nкөптеген қауіптің алдын ала белгілерін байқап, олардың әсерін азайтуға\nболады. Сондықтан су айдынының жағдайын, ауа райын, баратын\nбағытты, өз мүмкіндіктеріңді ескеріп, қауіпсіздік ережелерін сақтау\nмаңызды.\n      II. Негізгі бөлім\n      «Сапар алдында нені ұмыттық?» практикалық жаттығуы\n      Педагог жағдайды ұсынады:\n\n       Кіріспе бөлімдегі жағдаятты жалғастырайық. Сөйтіп достар\nтаңертең кездесіп, бірден жолға шығуға келісті. Ауа райы болжамын\nтексермеді, нақты маршрут туралы жақындарына хабарламады.\nҚатысушылардың бірінің телефонының қуаты небәрі 20%. Достар суға\nтүсетін орынды және қайту бағытын барғаннан кейін анықтауды\nжоспарлап отыр.\n      Тапсырма:\n      2 минут ішінде анықтаңдар:\n           сапар басталғанға дейін қандай қауіптерді байқауға\nболады;\n           жолға шықпас бұрын не істеу қажет;\n           жағдай өзгерген кезде қандай шешімдер қауіпті азайтуға\nкөмектеседі.\n      Жауаптарды талқылағаннан кейін педагог білім алушылармен\nбірге «Сапар алдындағы чек-парақ» құрастырады:\n           ауа райы болжамын тексеру;\n           демалуға арналған қауіпсіз және рұқсат етілген орынды\nтаңдау;\n           маршрут пен жоспарланған қайту уақытын жақын\nадамдарға хабарлау;\n           телефонды толық қуаттау;\n           су, ауа райына сай киім және қажетті қорғаныс құралдарын\nалу;\n           қажетсіз жағдайда маршрутты өзгертпеу және жалғыз\nкетпеу;\n           көмек қажет болған жағдайда кімге және қайда жүгіну\nкеректігін алдын ала білу.\n      Педагог қорытынды жасайды:\n      – Қауіпсіздік қауіп туындаған кезде ғана емес, демалысқа\nдайындық кезеңінен басталады. Жолға шығар алдында жасалған\nбірнеше қарапайым әрекет көптеген қауіптің алдын ала азайтуға\nмүмкіндік береді.\n      Суда маңызды қауіпсіздік ережелері\n           тек рұқсат     етілген   және    арнайы     жабдықталған\nорындарда шомылу;\n           бейтаныс жерде суға түспеу;\n           тереңдігі мен түбінің жағдайы белгісіз жерде суға сүңгіп\nсекірмеу;\n           адамды су астында ұстап тұруға байланысты қауіпті\nойындар ойнамау;\n\n            су айдынында «бәстесіп» жүзу және өз мүмкіндігіңді асыра\nбағаламау;\n            ауа райы мен судың жағдайын ескеру;\n            сапбордты, қайықты және басқа да жүзу құралдарын\nпайдаланған кезде белгіленген қауіпсіздік талаптарын сақтау және\nқажетті құтқару жабдықтарын пайдалану.\n      Педагог          білім          алушыларға          тақырыпқа\nқатысты бейнематериалдармен танысуды ұсынады.\n      https://www.youtube.com/watch?v=WhnGWpaeZcQ&amp;list=PLA5eC\nSY2FeoT00B3gyDuskOvkalEx7TmU&amp;index=46\n      Педагогтің қорытынды сөзі\n      – Қауіпсіз демалыс – бұл өзіңе, айналаңдағы адамдарға және\nтабиғатқа жауапкершілікпен қарау. Қауіпсіздік ережелерін сақтаңыз,\nдемалған жеріңізде қоқыс қалдырмаңыз, су айдындары мен демалыс\nорындарын қорғаңыз.\n      «Таза      Қазақстан» бастамасының         қағидаларын    ұстану\nәрқайсымыздың қарапайым әрекеттерімізден басталады: тазалықты\nсақтау және қоршаған ортаға ұқыпты қарау. Сапар барысында табиғат\nаясын қоқыспен ластама және от жақпа.\n      Егер қауіпті жағдай туындаса, жақын жердегі ересектерге,\nқұтқарушыларға немесе басқа жауапты адамдарға хабарлаңыз. Өмірге\nнемесе денсаулыққа тікелей қауіп төнген жағдайда – 112, ал шұғыл\nмедициналық көмек қажет болса – 103 немесе 112 нөміріне қоңырау\nшалыңыз.\n      III. Қорытынды бөлім\n      Рефлексия. «Менің басты ережем»\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n            «Бүгін мен тәуекел ... кезінде туындайтынын түсіндім».\n            «Демалыс кезінде мен әрдайым ...».\n            «Мен үшін ең маңызды қауіпсіздік ережесі – ...».\n            «Жауапты демалыс – бұл ...».\n      Білім алушылар өз жауаптарын айтады.\n      Педагог қорытынды жасайды:\n      – Демалыс жағымды эмоциялар сыйлауы керек, бірақ қауіп\nкөзіне айналмауы тиіс. Өз шешімдеріне жауапкершілікпен қарау,\nмұқият болу және қауіпсіздік ережелерін сақтау өз денсаулығың мен\nөміріңді, сондай-ақ айналаңдағы адамдардың қауіпсіздігін сақтауға\nкөмектеседі.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=WhnGWpaeZcQ&amp;list=PLA5eC\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=WhnGWpaeZcQ&amp;list=PLA5eC<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 11-сабақ — Ұлы дала коды"}, "grade-10/lesson-12.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>10-сынып · 12-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-10/index.html\">← 10-сынып тақырыптары<\/a><article><h2>Қысым мен бопсалаудан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 398-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=398\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№12 сабақ        Қысым мен бопсалаудан сақтану\n Мақсаты          Білім алушылардың құрдастар тарапынан болатын\n              қысымы мен бопсалауды ажыратып, дұрыс әрекет ету\n              дағдыларын қалыптастыру.\n Міндеттері       – психологиялық қысым, қорқыту және бопсалаудың\n              негізгі белгілерін анықтай білуге үйрету;\n                  – қысымға ермей, жеке шекарасын қорғау және\n              қауіпсіз шешім қабылдау дағдыларын дамыту;\n                  – қауіпті жағдайда мәселені жасырмай, сенім артатын\n              ересек адамға немесе тиісті қызметке дер кезінде жүгінуге\n              дағдыландыру.\n\n      Материалдар мен ресурстар\n      өмірлік жағдаяттар сипатталған карточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Шекара қай жерден басталады?» жаттығуы\n      Педагог бірнеше тұжырым ұсынады. Әр тұжырымнан кейін білім\nалушылар оның «өтініш» немесе «қысым» екенін анықтап, жауап\nбереді.\n      Мысалы:\n            «Қолыңнан келсе, үй тапсырмасын орындауға көмектесші».\n            «Егер сен менің досым болсаң, маған ақша беруге\nміндеттісің».\n            «Бірге барайық. Егер барғың келмесе, ештеңе етпейді».\n            «Бұл туралы ешкімге айтпа, әйтпесе өкінесің».\n      Талқылаудан кейін педагог қорытынды жасайды:\n      - Кез келген ұсыныс немесе өтініш қауіпті бола бермейді.\nАлайда адам қорқыту, бопсалау немесе кемсіту арқылы өз дегеніне\nжеткісі келсе, не сізді өзіңіз қаламайтын әрекетті жасауға мәжбүрлесе,\nбұл – психологиялық қысым немесе бопсалау болып табылады.\n      II. Негізгі бөлім\n      Ақпараттық блок\n      Құрдастардың қысымы – адамды өз еркіне қарсы әрекет жасауға\nкөндіру, мазақ ету, қорқыту немесе түрлі айла-тәсілдер арқылы\nмәжбүрлеу әрекеті.\n\n      Бопсалау – адамнан қорқыту, үрей туғызу арқылы ақша, мүлік\nберуді немесе белгілі бір әрекетті орындауды талап ету жағдайы.\nМұндай талаптарды өз бетіңше орындауға немесе мәселені жалғыз өзің\n«шешуге» тырысуға болмайды. Міндетті түрде ересек адамнан көмек\nсұрап, қажет болған жағдайда полицияға жүгіну керек.\n      Психологиялық қысымның белгілері:\n            бас тартқаннан кейін де қайта-қайта көндіруге тырысу;\n            қорқыту немесе үрей туғызу;\n            кемсіту және мазақ ету;\n            достықты пайдаланып қысым жасау («Егер сен менің\nдосым болсаң, онда міндеттісің...»);\n            жеке ақпаратпен бопсалау;\n            болған жағдайды ешкімге айтпауға мәжбүрлеу.\n   Педагог:\n      -      Егер адам сіздің таңдауыңызды құрметтесе, сіздің бас\nтартқаныңызды қабылдайды. Ал бас тартқаныңыздан кейін де қорқыту\nнемесе мәжбүрлеу жалғаса берсе, бұл – қауіпті жағдайдың белгісі.\n      Педагог       білім    алушыларға       тақырыпқа      қатысты\nбейнематериалды көруді ұсынады.\n      https://drive.google.com/file/d/1zSXqhB19iMYg24enCPqrBI4xTN9\nGUcHe/view?usp=sharing\n\n     Практикалық жаттығу\n     Педагог білім алушыларға қай жағдаятта қысым жасалып\nтұрғанын анықтап, қауіпсіз әрекет түрін таңдауды ұсынады.\n     1-жағдаят\n     «Досым болсаң өтінішімді орындашы. Ертеңге дейін маған ақша\nберші».\n     2-жағдаят\n     «Егер бұл туралы біреуге айтсаң, қиындыққа тап боласың».\n     3-жағдаят\n     «Бәрі келісіп қойды, тек сен ғана қалдың».\n     4-жағдаят\n     «Ақшаны аудар, әйтпесе сенің суреттеріңді жариялап жіберемін».\n     Әр жағдаяттан кейін білім алушылар екі сұраққа жауап береді:\n     1.    Қысымның қандай белгісін байқадыңыз?\n     2.    Қандай әрекет қауіпсіз болады?\n     Педагог білім алушыларды мынадай қорытындыға жетелейді:\n     - Қысым, қорқыту немесе бопсалау күшейе түссе, мәселені өз\nбетіңше шешуге тырыспай, міндетті түрде көмек сұра.\n\n      «БЕРІЛМЕ – САҚТА – ХАБАРЛА» алгоритмі\n      БЕРІЛМЕ\n      Ақшаңды, заттарыңды, банк деректеріңді, фотосуреттеріңді\nберме және қауіпті немесе заңға қайшы талаптарды орындама.\nАгрессияға агрессиямен жауап беруге немесе мәселені өз бетіңше\nшешуге тырыспа.\n      САҚТА\n      Егер қысым немесе қорқыту цифрлық ортада орын алса,\nхабарламаларды өшірме. Хат-хабарларды, скриншоттарды және\nжағдайды анықтауға көмектесетін басқа да материалдарды сақтап қой.\n      ХАБАРЛА\n      Ата-анаңа, сынып жетекшісіне, мектеп психологіне, әлеуметтік\nпедагогке немесе өзің сенетін басқа ересек адамға айт.\n      Егер сенен ақша немесе мүлік талап етсе, күш қолданумен\nқорқытса немесе басқа да заңға қайшы әрекеттер жасалса, 102 нөмірі\nарқылы полицияға хабарласу қажет. Өмірге немесе денсаулыққа\nтікелей қауіп төнген жағдайда 112 нөміріне қоңырау шал.\n      Балалардың құқықтарын қорғау мәселелері бойынша кеңес пен\nқолдау алу үшін 111 байланыс орталығына жүгінуге болады.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға төмендегі сөйлемдерді аяқтауды\nұсынады:\n      Бүгін мен қысымның ... кезде басталатынын түсіндім.\n      Егер маған қысым жасалса,...\n      Менің қауіпсіздігіме қатысты ең маңызды ереже...\n      Көмек алу үшін ... жүгінуге болады.\n      Жауаптардан кейін педагог қорытынды жасайды:\n      Әр жасөспірім қауіпсіз ортада өмір сүруге, қысым мен\nбопсалаудан қорғалуға құқылы. Егер саған қысым көрсетсе, қорқытса\nнемесе бір нәрсені мәжбүрлеп талап етсе, мұны жасырма және мәселені\nжалғыз шешуге тырыспа. Дәлелдерді сақтап, өзің сенетін ересек\nадамнан көмек сұра. Қажет болса, 111 байланыс орталығына, ал тікелей\nқауіп немесе құқық бұзушылық жағдайында 102 нөміріне хабарлас.<\/div><p><a href=\"https://drive.google.com/file/d/1zSXqhB19iMYg24enCPqrBI4xTN9\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1zSXqhB19iMYg24enCPqrBI4xTN9<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "10-сынып · 12-сабақ — Ұлы дала коды"}};const HOME="grade-10/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
