rame\"><span>3</span><h3>Қорытынды</h3><p>Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Көмектің қажет екенін қалай білеміз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Неге жеке оқиғаны жарияламаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Пайданы ақшадан бөлек қалай өлшейміз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Еріктілік» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.\"></textarea><label for=\"reflection-1\">«Әлеуметтік жобадағы шынайы нәтиже» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Көмекті ерікті, қажетке сай және қадірді сақтап ұсынамын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Еріктілік» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t25\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t27\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t26", "title": "Әлеуметтік жобадағы шынайы нәтиже | Тәрбие әлемі"}, "lesson/g09-t27": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Денсаулық және пайдалы әдеттер</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>♧</span><span>9-сынып · 27/30 · 40 минут</span></div><h1>Оқу жүктемесін саналы жоспарлау</h1><p>Денсаулық және пайдалы әдеттер</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Оқу жүктемесін саналы жоспарлау» тақырыбы арқылы әдет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Әдет» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Демалыс, күн тәртібі, қауіпсіз қозғалыс және қол гигиенасы күнделікті өзіне қамқорлықтың бөлігі. Әр адамның мүмкіндігі әртүрлі. Сабақта дене салмағы, диагноз немесе жеке денсаулық ақпараты сұралмайды. Денсаулық мәселесінде сенімді ересек пен медицина маманына жүгінеді.</p><p>Бүгінгі назарымыз: «Оқу жүктемесін саналы жоспарлау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p><div class=\"concepts\"><span>Әдет</span><span>Демалыс</span><span>Қозғалыс</span><span>Өзіне қамқорлық</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Оқу тобы түнгі уақытта міндетті жауап беруді талап етті.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Демалыс шекарасын келісу; байланыс уақытын алдын ала белгілеу.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Белсенділік жоспары әркімнің мүмкіндігін ескермей, бәріне бірдей талап қойды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз балама; ауырсыну не жайсыздықта тоқтау; салыстырып бағаламау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Дәлелсіз денсаулық кеңесі жарнамалық мүддесін жасырды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тексерілмеген емге сенбеу; маманмен кеңесу; жарнаманы ажырату.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Жобаға қатысушы үзіліс сұраудан ұялады, топ нәтижені ғана күтеді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жайсыздықты ересекке айту; демалыс пен көмекке жағдай жасау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ойдан шығарылған оқушының күніне оқу, демалыс және қауіпсіз қозғалыс уақытын үйлестіріңдер. Нақты денсаулық дерегін жазбаңдар. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Қолайлы үзіліс» картасын жасаңдар: отырып, тұрып не тыныш орындалатын үш балама. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Бір пайдалы әдет — бір шағын қадам» апталық жоспар эскизін құрыңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Демалыс неге қажет? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Өзіне қамқорлық қалай көрінеді? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Әркімге бірдей қимыл міндетті ме? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Денсаулық ақпаратын кіммен тексереміз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Жаңа әдетті кішкентай қадамнан қалай бастаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын. Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Оқу жүктемесін саналы жоспарлау»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Денсаулық және пайдалы әдеттер» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Демалыс неге қажет? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Әркімге бірдей қимыл міндетті ме? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Жаңа әдетті кішкентай қадамнан қалай бастаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Әдет» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Оқу жүктемесін саналы жоспарлау» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Өз мүмкіндігімді ескеріп, жайсыздықта көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Әдет» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t26\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t28\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t27", "title": "Оқу жүктемесін саналы жоспарлау | Тәрбие әлемі"}, "lesson/g09-t28": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Жолдағы қауіпсіздік</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>↔</span><span>9-сынып · 28/30 · 40 минут</span></div><h1>Көше ортасын қауіпсіз бағалау</h1><p>Жолдағы қауіпсіздік</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Көше ортасын қауіпсіз бағалау» тақырыбы арқылы өткел мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Өткел» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Жолда назарды қозғалысқа аударып, белгіленген жаяу жүргінші өткелі мен бағдаршам тәртібін сақтау керек. Жас бала жолды сенімді ересекпен өтеді. Қауіпсіздік тапсырмалары тек қағазда орындалады; көлік жолында тәжірибе жасалмайды.</p><p>Бүгінгі назарымыз: «Көше ортасын қауіпсіз бағалау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p><div class=\"concepts\"><span>Өткел</span><span>Бағдаршам</span><span>Назар</span><span>Қауіпсіз бағыт</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Топтық тапсырманы жол үстінде телефонмен орындау ұсынылды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жолда экранға алаңдамау; тапсырманы қауіпсіз орында тоқтатып орындау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Тұрақтағы көліктер жаяу жүргіншінің көру аймағын жауып тұр.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көрінбейтін жерден шықпау; қауіпсіз өткелге бару; ересекпен шешу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Ұсынылған маршрутта жарық аз, қолжетімділік мәселесі бар.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жақсы көрінетін қауіпсіз бағыт; ересекпен маршрутты келісу; мәселені жауаптыға хабарлау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Мектеп маңындағы қауіп туралы тексерілген ұсыныс дайындау керек.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Өздігінен тәуекел етпеу; ересекке айту; қауіпсіз жерден бақылау және ұсыныс.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Қағаздағы үш маршрутты салыстырыңдар: өткелі бар ұзындау жол, өткелсіз қысқа жол, жарықсыз жол. Қауіпсіз нұсқаны негіздеңдер. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ойдан шығарылған мектеп маңындағы қауіпсіздік картасын жасаңдар. Нақты мекенжай мен күнделікті жеке маршрутты жазбаңдар. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Жолда назарым — қауіпсіздікке» үш белгісін әзірлеңдер. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қай жерден өтеміз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Неге қысқа жол әрдайым қауіпсіз емес? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Телефон назарды қалай бөледі? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Көрінбейтін жерден неге шықпаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Түсініксіз белгі болса кімнен көмек сұраймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын. Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Көше ортасын қауіпсіз бағалау»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Жолдағы қауіпсіздік» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қай жерден өтеміз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Телефон назарды қалай бөледі? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Түсініксіз белгі болса кімнен көмек сұраймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Өткел» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.\"></textarea><label for=\"reflection-1\">«Көше ортасын қауіпсіз бағалау» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Жолда асықпаймын, қауіпсіз өткел мен ересек көмегін таңдаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Өткел» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t27\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t29\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t28", "title": "Көше ортасын қауіпсіз бағалау | Тәрбие әлемі"}, "lesson/g09-t29": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Жеке шекара және өзара құрмет</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☂</span><span>9-сынып · 29/30 · 40 минут</span></div><h1>Келісімнің еріктілігін түсіну</h1><p>Жеке шекара және өзара құрмет</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Келісімнің еріктілігін түсіну» тақырыбы арқылы шекара мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Шекара» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Әр адам өзінің затына, кеңістігіне және жеке ақпаратына қатысты шекарасын айта алады. Келісім ерікті болуы керек және оны өзгертуге болады. «Жоқ» деген жауапты сыйлаймыз. Қорқыныш не қысым болса, сенімді ересекке айтамыз.</p><p>Бүгінгі назарымыз: «Келісімнің еріктілігін түсіну». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p><div class=\"concepts\"><span>Шекара</span><span>Рұқсат</span><span>Келісім</span><span>Құрмет</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Бұрын берген жариялау келісімін қатысушы кейін өзгертті.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бас тартуды құрметтеу; келісімді қайтарып алуды ескеру; балама ұсыну.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Беделді қатысушы бас тартқан адамды мүмкіндіктен айырамын деп қысым жасады.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қысым келісім емес; қауіпсіз бас тарту; сенімді ересектен қолдау сұрау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Ортақ жобада байланыс уақыты мен жеке кеңістік келісілмеген.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Нақты әрі тыныш сөйлем; шекараны келісу; қайталанса көмек сұрау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Қысым көрген адам құпиялық уәдесі үшін көмекке жүгінбей жүр.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіздікке қатысты қорқынышты құпияны жалғыз сақтамау; сенімді ересекке айту.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Қауіпсіз зат мысалымен «Мен ... қаламаймын. Оның орнына ... ұсынамын» сөйлемін жаттықтырыңдар. Бір-біріңді ұстамаңдар, қысым жасамаңдар. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Жеке және цифрлық кеңістікке арналған бес ереже құрыңдар: рұқсат, бас тарту, өзгерген келісім, құпиялық, көмек. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Рұқсат сұра — жауапты сыйла» карточкасын жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Жеке шекара нені қамтиды? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Рұқсатты неге сұраймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Келісімді өзгертуге бола ма? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қысым мен ерікті келісім қалай ажыратылады? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қауіп туса кімнен көмек сұраймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын. Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Келісімнің еріктілігін түсіну»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Жеке шекара және өзара құрмет» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Жеке шекара нені қамтиды? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Келісімді өзгертуге бола ма? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қауіп туса кімнен көмек сұраймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Шаңырақтағы үлес</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Шекара» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Келісімнің еріктілігін түсіну» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Рұқсат сұраймын, бас тартуды сыйлаймын, қысымда көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қудалауды сахналамаңыз; кінә артпаңыз; қолдау мен сенімді ересекке жүгінуді ғана жаттықтырыңыз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Шекара» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t28\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t30\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t29", "title": "Келісімнің еріктілігін түсіну | Тәрбие әлемі"}, "lesson/g09-t30": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Медиасауаттылық</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⌕</span><span>9-сынып · 30/30 · 40 минут</span></div><h1>Дереккөздің сенімділігін бағалау</h1><p>Медиасауаттылық</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Дереккөздің сенімділігін бағалау» тақырыбы арқылы факт мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Факт» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Ақпаратты бөліспес бұрын авторын, жарияланған күнін және бастапқы дерегін тексереміз. Сурет басқа оқиғаға қатысты болуы мүмкін. Пікір адамның бағасын білдіреді, ал фактіні тексеруге болады. Сенімді көрінген ЖИ мәтінінде де қате кездеседі.</p><p>Бүгінгі назарымыз: «Дереккөздің сенімділігін бағалау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Көшірілген хабар ресми құжатқа ұқсайды, бірақ бастапқы жарияланымы жоқ. Ойлану бағдары: Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p><div class=\"concepts\"><span>Факт</span><span>Пікір</span><span>Дереккөз</span><span>Контекст</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Алдымен тексеремін, содан кейін ғана бөлісемін.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Көшірілген хабар ресми құжатқа ұқсайды, бірақ бастапқы жарияланымы жоқ.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Шын фотоға қате уақыт пен орын беріліп, қоғамдық пікірге әсер ету көзделді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Суреттің бастапқы контекстін, күнін және дереккөзін салыстыру.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Бағалау тұжырымы өлшемі мен дерегінсіз зерттеу қорытындысы деп ұсынылды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Факт пен пікірді ажырату; қандай өлшем мен дәлел қажет екенін сұрау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Қорқыныш туғызатын манипуляциялық мәтін тек бір тарапты көрсетеді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тоқтау; толық мәтін мен балама сенімді деректі оқу; асықпай шешу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">ЖИ жасаған сенімді мәтінде ойдан шығарылған сілтеме мен дәйексөз бар.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Түпнұсқадан тексеру; табылмаған деректі факт деп бермеу; қатені түзету.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Ертең мектепте көрме болады» деген фактіні тексеру жолы мен «Бұл ең қызық көрме» пікірін салыстырыңдар. Нақты хабар деп қабылдамаңдар. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ақпаратты тексеру картасын құрыңдар: автор, күн, түпнұсқа, өзге сенімді дерек, тарату шешімі. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Екі ойдан шығарылған хабардың бірін тексеріп, «Неге әзірге таратпаймын?» түсіндірмесін жасаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Факт пен пікірдің айырмасы қандай? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Хабардың күнін неге қараймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Әдемі сурет дәлел бола ма? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>ЖИ жауабын қалай тексереміз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Расталмаған ақпаратты неге таратпаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Алдымен тексеремін, содан кейін ғана бөлісемін.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Мектептің ресми хабарын тексеру; расталмағанын таратпау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Алдымен тексеремін, содан кейін ғана бөлісемін. Мектептің ресми хабарын тексеру; расталмағанын таратпау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Дереккөздің сенімділігін бағалау»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Медиасауаттылық» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Көшірілген хабар ресми құжатқа ұқсайды, бірақ бастапқы жарияланымы жоқ.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Мектептің ресми хабарын тексеру; расталмағанын таратпау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Алдымен тексеремін, содан кейін ғана бөлісемін.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Факт пен пікірдің айырмасы қандай? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Әдемі сурет дәлел бола ма? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Расталмаған ақпаратты неге таратпаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Факт» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Алдымен тексеремін, содан кейін ғана бөлісемін.\"></textarea><label for=\"reflection-1\">«Дереккөздің сенімділігін бағалау» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Алдымен тексеремін, содан кейін ғана бөлісемін.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Факт» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t29\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><span class=\"muted\">Соңғы тақырып</span></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t30", "title": "Дереккөздің сенімділігін бағалау | Тәрбие әлемі"}, "home": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><span>9-сынып</span></nav><section class=\"class-hero\"><div><span class=\"eyebrow\">30 тақырып · 150 жағдаят</span><h1>9-сыныптың<br>тәрбие қоржыны</h1><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түр
