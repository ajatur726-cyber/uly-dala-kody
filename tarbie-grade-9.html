нут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Серіктес достықты алға тартып, адал емес шешімді қолдауды талап етті.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Сыпайы бас тарту; себеп пен қауіпсіз балама ұсыну; қысымға келіспеу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Ортақ жобада беделді қатысушының ойы үнемі автоматты қабылданады.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кезек пен рөл бөлу; әркімнің үлесін сұрау; ортақ шешімді ашық келісу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Тыңдаушы мен әңгімелеуші болыңдар: бірі қауіпсіз ойдан шығарылған өтініш айтады, екіншісі естігенін қайталап, қолдау ұсынады. Рөл ауыстырыңдар. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Әркімге орын бар» қолдау картасын жасаңдар: шақыру сөзі, қолжетімді рөл, бас тарту құқығы. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Досымды тыңдаймын, оның таңдауын сыйлаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Достықты қолдайтын үш қысқа сөйлемі бар ашықхат жасаңыздар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Жақсы тыңдау қалай байқалады? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Досқа әрқашан келісу керек пе? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Жаңа баланы қалай қосамыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қолдау мен қысымның айырмасы қандай? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Топта әркімнің пікірін қалай ескереміз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Досымды тыңдаймын, оның таңдауын сыйлаймын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Досымды тыңдаймын, оның таңдауын сыйлаймын. Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Қолдау мәдениеті және шекара»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «ДосболLIKE» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Жоба тобына бұрын танымайтын қатысушыны алуға қарсы пікір айтылды.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Досымды тыңдаймын, оның таңдауын сыйлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Жақсы тыңдау қалай байқалады? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Жаңа баланы қалай қосамыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Топта әркімнің пікірін қалай ескереміз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Ізгілік шамы</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Достық» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Досымды тыңдаймын, оның таңдауын сыйлаймын.\"></textarea><label for=\"reflection-1\">«Қолдау мәдениеті және шекара» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Досымды тыңдаймын, оның таңдауын сыйлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Достық» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t04\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t06\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t05", "title": "Қолдау мәдениеті және шекара | Тәрбие әлемі"}, "lesson/g09-t06": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Буллингтің алдын алу</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>☂</span><span>9-сынып · 06/30 · 40 минут</span></div><h1>Қауіпсіз мектеп: жауапты куәгер</h1><p>Буллингтің алдын алу</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Қауіпсіз мектеп: жауапты куәгер» тақырыбы арқылы қолдау мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Қолдау» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Біреуді қайта-қайта қорлау, қорқыту не шеттету — көмек қажет ететін жағдай. Оған ұшыраған бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтуға болады. Бір рет болған ауыр әрекетті де елемеуге болмайды. Бұл сабақта қорлау сөздері мен көріністері қайталанбайды.</p><p>Бүгінгі назарымыз: «Қауіпсіз мектеп: жауапты куәгер». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</p><div class=\"concepts\"><span>Қолдау</span><span>Қауіпсіздік</span><span>Куәгер</span><span>Сенімді ересек</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Көмек сұраған адамға қарсы кек қайтару қаупі бар, орта қауіпсіз емес.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қасында болуды ұсыну; сенімді ересекке жеке хабарлау; қауіпсіздік жоспарын ересек ұйымдастырады.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Беделді топ қудалауды әзіл деп ақтап, куәгерлерден үнсіз қалуды сұрайды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қолпаштауды тоқтату; қарсы күш қолданбау; қауіпсіз қолдау және хабарлау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Алдын алу шарасында нақты оқушының оқиғасын оның келісімінсіз жарияламақ.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жеке тәжірибені айтқызбау; жеке сөйлесуді ұсыну; қажет деректі тек жауапты ересекке беру.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Алғашқы хабарға жауап болмады, оқушы қауіпсіздігі әлі қамтамасыз етілген жоқ.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Басқа сенімді ересекке, сынып жетекшісіне не мектеп әкімшілігіне қайта айту; көмекті жалғастыру.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Мен сені тыңдаймын», «Сен кінәлі емессің», «Сенімді ересекке бірге барайық» қолдау сөздерінің қай кезде айтылатынын талқылаңдар. Қудалауды сахналамаңдар. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Қауіпсіз көмек картасын жасаңыздар: қауіпсіз орын, мектептегі екі жауапты ересек рөлі, хабарлау және қайта хабарлау жолы. Нақты оқушы атын жазбаңдар. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Көмек сұрау — дұрыс қадам» постерін жасаңыздар. Жәбірленушіні бейнелеп масқаралайтын сурет қоспаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Қолдау неге маңызды? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қай әрекет жағдайды ушықтырады? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Куәгер қауіпсіз қалай көмектеседі? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Кімге хабарлауға болады? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Алғашқы көмек нәтиже бермесе не істейміз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></details></section><section class=\"quiz\" data-correct=\"0\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады. Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Қауіпсіз мектеп: жауапты куәгер»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Буллингтің алдын алу» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Қолдау неге маңызды? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Куәгер қауіпсіз қалай көмектеседі? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Алғашқы көмек нәтиже бермесе не істейміз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Аманат жапырағы</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Қолдау» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.\"></textarea><label for=\"reflection-1\">«Қауіпсіз мектеп: жауапты куәгер» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қудалауға ұшыраған адам кінәлі емес; көмек сұрауға болады.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қудалауды сахналамаңыз; кінә артпаңыз; қолдау мен сенімді ересекке жүгінуді ғана жаттықтырыңыз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Қолдау» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://www.unicef.org/kazakhstan/kk/%D0%BA%D0%B8%D0%B1%D0%B5%D1%80%D0%B1%D1%83%D0%BB%D0%BB%D0%B8%D0%BD%D0%B3%D1%82%D0%B5%D0%BD-%D2%9B%D0%B0%D0%BB%D0%B0%D0%B9-%D2%9B%D0%BE%D1%80%D2%93%D0%B0%D0%BD%D1%83%D2%93%D0%B0-%D0%B1%D0%BE%D0%BB%D0%B0%D0%B4%D1%8B\" target=\"_blank\" rel=\"noopener noreferrer\">Кибербуллингтен қалай қорғануға болады?</a> · UNICEF Қазақстан / БҰҰДБ. Қазақша беті ашылып, қолдау және көмек сұрау материалы тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t05\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t07\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t06", "title": "Қауіпсіз мектеп: жауапты куәгер | Тәрбие әлемі"}, "lesson/g09-t07": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Кибербуллингтің алдын алу</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>▣</span><span>9-сынып · 07/30 · 40 минут</span></div><h1>Келісімсіз контентті таратпау</h1><p>Кибербуллингтің алдын алу</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Келісімсіз контентті таратпау» тақырыбы арқылы кибербуллинг мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Кибербуллинг» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Цифрлық ортада қорлау, қорқыту және келісімсіз контент тарату адамға зиян тигізеді. Жауап ретінде қорлаудың қажеті жоқ. Қауіпсіздік үшін сенімді ересекпен бірге шағымдану және бұғаттау мүмкіндігін қарастыруға болады. Куәгер ренжітетін материалды әрі қарай таратпайды.</p><p>Бүгінгі назарымыз: «Келісімсіз контентті таратпау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</p><div class=\"concepts\"><span>Кибербуллинг</span><span>Шағым</span><span>Бұғаттау</span><span>Қолдау</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Адамды кемсітетін өңделген бейнені «тексеру үшін» таратуды ұсынды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Контентті көбейтпеу; адамды қолдау; ересекке не платформаға хабарлау.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Біреудің атынан жасалған парақша оның беделіне зиян келтіреді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Аккаунтпен дауласпау; жалғандықты жауапты ересекпен тіркеу; шағым беру.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Киберқудалауға ұшыраған оқушы бар кінәні өзіне артып, көмек сұрамай жүр.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Кінәламау; тыңдау; сенімді ересекпен жеке сөйлесуге қолдау беру.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Қудалаушы топ контентті өшіруді мәселе толық шешілді деп көрсетеді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әсерін мойындау; қайта таратпау; қауіпсіздіктің қалпына келуін ересекпен қадағалау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Ойдан шығарылған чат үшін қолдау хабарын жазыңдар: кінәламау, таратпау, ересекке жүгіну. Шынайы хатты ашпаңдар. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Көрдім — таратпадым — қолдадым — хабарладым» төрт қадамдық карта құрыңдар. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Қолдау хабарлары бар қағаз чат-комикс жасаңыздар; қорлау сөздерін қоспаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Ренжітетін хабарды неге таратпаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қауіпсіз қолдау сөзі қандай? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Шағым мен бұғаттау не үшін керек? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Көмек сұрауға не кедергі болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қауіпсіздік қалпына келгенін қалай білеміз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></details></section><section class=\"quiz\" data-correct=\"2\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын. Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Келісімсіз контентті таратпау»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Кибербуллингтің алдын алу» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Ренжітетін хабарды неге таратпаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Шағым мен бұғаттау не үшін керек? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қауіпсіздік қалпына келгенін қалай білеміз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Қоржындағы ой</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Кибербуллинг» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.\"></textarea><label for=\"reflection-1\">«Келісімсіз контентті таратпау» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Ренжітетін контентті таратпаймын, жалғыз қалмай көмек сұраймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қудалауды сахналамаңыз; кінә артпаңыз; қолдау мен сенімді ересекке жүгінуді ғана жаттықтырыңыз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Кибербуллинг» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p><p><a href=\"https://www.unicef.org/kazakhstan/kk/%D0%BA%D0%B8%D0%B1%D0%B5%D1%80%D0%B1%D1%83%D0%BB%D0%BB%D0%B8%D0%BD%D0%B3%D1%82%D0%B5%D0%BD-%D2%9B%D0%B0%D0%BB%D0%B0%D0%B9-%D2%9B%D0%BE%D1%80%D2%93%D0%B0%D0%BD%D1%83%D2%93%D0%B0-%D0%B1%D0%BE%D0%BB%D0%B0%D0%B4%D1%8B\" target=\"_blank\" rel=\"noopener noreferrer\">Кибербуллингтен қалай қорғануға болады?</a> · UNICEF Қазақстан / БҰҰДБ. Қазақша беті ашылып, қолдау және көмек сұрау материалы тексерілді. Тексерілген күн: 25.10.2026. Интернет қажет.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t06\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t08\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t07", "title": "Келісімсіз контентті таратпау | Тәрбие әлемі"}, "lesson/g09-t08": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Қоғамдық ортадағы қауіпсіздік</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⌂</span><span>9-сынып · 08/30 · 40 минут</span></div><h1>Қауіпті бағалау және хабарлау</h1><p>Қоғамдық ортадағы қауіпсіздік</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Қауіпті бағалау және хабарлау» тақырыбы арқылы кездесу орны мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Кездесу орны» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Қоғамдық жерде алдын ала келісілген бағыт пен кездесу орны көмектеседі. Бейтаныс адамға еріп кетпеу, қауіпті затты ұстамау және жауапты қызметкерден көмек сұрау маңызды. Қауіпсіздікке күмән туса, сенімді ересекпен бірге шешім қабылда.</p><p>Бүгінгі назарымыз: «Қауіпті бағалау және хабарлау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</p><div class=\"concepts\"><span>Кездесу орны</span><span>Қауіп</span><span>Көмек</span><span>Жауапты қызметкер</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Ұйымдастырушы болып көрінген адам қатысушыны жеке орынға шақырды, өкілеті расталмаған.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Еріп кетпеу; сенімді ересекке не ресми қызметкерге айту; тұлғаны жауапты адам арқылы тексеру.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Шара еріктілеріне белгісіз пакетті орнынан жылжыту ұсынылды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тиіспеу; қауіпсіз қашықтық сақтау; жауапты қызметкерге хабарлау.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Көрме ұйымдастырушылары қосымша орын үшін шығу жолын тарылтқысы келеді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Итермелеуге қосылмау; жауапты ересекке айту; шығу жолын бос ұстауды келісу.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Жоба үшін қауіпті орынға кіруді батылдық сынағы деп ұсынды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Бас тарту; қауіпсіз балама табу; рұқсатсыз орынға кірмеу.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>«Адастым — қауіпсіз жер — жауапты қызметкер — байланыс» картасын қағазда реттеңдер. Жеке телефон нөмірін жазбаңдар. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>Ойдан шығарылған мектеп көрмесіне қауіпсіз бағыт пен кездесу орнының сызбасын жасаңдар. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>«Көмек сұрайтын бір сөйлем» карточкасын дайындаңдар. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Кездесу орнын не үшін келісеміз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Көмекті кімнен сұраймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Иесіз затты неге ұстамаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Қауіпті ұсынысқа қалай бас тартамыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Топта қауіпсіздікке қалай үлес қосамыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ol><details class=\"teacher-answer\"><summary>Мұғалімге: сұрақтарды талқылау бағдары</summary><p>Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын. Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></details></section><section class=\"quiz\" data-correct=\"1\"><h2>Өзімді тексеремін</h2><p>Алғашқы жағдаятқа қай әрекет орынды?</p><div class=\"quiz-options\"><button type=\"button\" class=\"quiz-option\" data-option=\"0\" aria-pressed=\"false\">Ешкімге айтпай, мәселе өзі шешіледі деп күту.</button><button type=\"button\" class=\"quiz-option\" data-option=\"1\" aria-pressed=\"false\">Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</button><button type=\"button\" class=\"quiz-option\" data-option=\"2\" aria-pressed=\"false\">Асығып әрекет ету, басқа адамның келісімін және қауіпсіздікті ескермеу.</button></div><p class=\"quiz-result\" role=\"status\" hidden data-explanation=\"Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын. Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.\"></p></section></section><section id=\"panel-resource\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-resource\" tabindex=\"0\"><h2>Бейне және шығармашылық ресурс</h2><div class=\"notice\">Тексерілген бейне әзірге қосылмаған. Оның орнына төмендегі толық дайын материалды интернетсіз қолданыңыз.</div><h3>«Қауіпті бағалау және хабарлау»: үш көріністі қағаз әңгіме</h3><p class=\"meta\">Автор: Осы жинақтың авторлық әдістемелік материалы · Тілі: Қазақша · 5–7 минут · 9-сынып</p><p>Тақырыпқа сәйкестігі: оқиға «Қоғамдық ортадағы қауіпсіздік» бағыты бойынша таңдау, әрекет және салдарды көрсетеді.</p><h3>Қарауға дейін</h3><p>Кейіпкер қандай таңдауға тап болуы мүмкін? Факт пен пікірді ажыратып, қажет деректі ата.</p><div class=\"story-grid\"><section class=\"story-frame\"><span>1</span><h3>Мәселе</h3><p>Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек.</p></section><section class=\"story-frame\"><span>2</span><h3>Қауіпсіз шешім</h3><p>Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу.</p></section><section class=\"story-frame\"><span>3</span><h3>Қорытынды</h3><p>Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.</p></section></div><h3>Орындау нұсқауы</h3><p>Үш көріністі ретімен оқыңдар не мұғалімнен тыңдаңдар. Мәселе, шешім және қорытындыға бір-бір сурет салыңдар. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p><h3>Қараудан кейінгі 3 сұрақ</h3><ul><li>Кездесу орнын не үшін келісеміз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Иесіз затты неге ұстамаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Топта қауіпсіздікке қалай үлес қосамыз? Факт пен пікірді ажыратып, қажет деректі ата.</li></ul><p class=\"muted\">Бұл — негізгі 40 минуттан бөлек қолдануға немесе шығармашылық тапсырманың орнына таңдауға арналған ресурс. Қосымша уақытты мұғалім өзі жоспарлайды.</p></section><section id=\"panel-reflection\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-reflection\" tabindex=\"0\"><h2>Кері байланыс · Келесі қадам картасы</h2><p>«Қорытындым — дәлелім — әлі тексеретінім» үштігін толтыр.</p><div class=\"notice\">Аты-жөніңізді жазбаңыз. Жеке оқиға, телефон не құпия ақпарат енгізбеңіз. Жауаптар осы бет жабылғанша ғана сақталады. Бір құрылғыда оқушылар кезекпен жауап бере алады.</div><form id=\"feedback-form\"><fieldset><legend>Өзімді қалай бағалаймын?</legend><div class=\"rating-row\"><label><input type=\"radio\" name=\"confidence\" value=\"Түсіндім\" required> ☀ Түсіндім</label><label><input type=\"radio\" name=\"confidence\" value=\"Жаттығамын\"> ◐ Жаттығамын</label><label><input type=\"radio\" name=\"confidence\" value=\"Көмек керек\"> ♡ Көмек керек</label></div></fieldset><label for=\"reflection-0\">«Кездесу орны» туралы не түсіндім?</label><textarea id=\"reflection-0\" maxlength=\"1200\" placeholder=\"Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.\"></textarea><label for=\"reflection-1\">«Қауіпті бағалау және хабарлау» тақырыбынан кейін қандай әрекет жасаймын?</label><textarea id=\"reflection-1\" maxlength=\"1200\" placeholder=\"Өзің таңдаған бір әрекетті қысқа жаз немесе мұғалімге ауызша айт.\"></textarea><label for=\"reflection-2\">Осы әрекетті орындауда қай жерде және кімнен көмек керек?</label><textarea id=\"reflection-2\" maxlength=\"1200\" placeholder=\"Көмек қажет болмаса, солай жазуға болады.\"></textarea><p class=\"muted\">Жазу қиын болса, белгішені таңдап, жауабыңызды мұғалімге айтыңыз. Мұғалім жеке дерексіз тіркей алады. Жауап үлгісі: «Қауіп байқасам, өзім сынамаймын, жауапты ересекке хабарлаймын.»</p><button class=\"btn primary\" type=\"submit\">Кері байланысты тіркеу</button><button type=\"reset\">Өрістерді тазалау</button></form><section class=\"feedback-summary\"><h3>Осы сессияда жиналған жауаптар</h3><p id=\"feedback-count\" role=\"status\">Әзірге 0 жауап.</p><div id=\"feedback-tally\"></div><details><summary>Анонимді жауаптарды қарау</summary><div id=\"feedback-list\"></div></details><div class=\"toolbar\"><button type=\"button\" id=\"export-feedback\">Жауаптарды TXT жүктеу</button><button type=\"button\" id=\"clear-feedback\">Осы сессия жауаптарын өшіру</button></div><p class=\"muted\">Сервер жоқ. Басқа телефондардан берілген жауаптар мұнда келмейді. Жауаптарды беттен кетпей тұрып жүктеп алыңыз.</p></section></section><section id=\"panel-teacher\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-teacher\" tabindex=\"0\"><h2>Мұғалімге арналған нұсқаулық</h2><p>Ұсынылатын ұзақтық — 40 минут. Бастауышта мәтінді мұғалім дауыстап оқиды. Негізгі жауапты ауызша не суретпен алуға болады. Күн, мұғалім, мектеп және нақты оқушы мәліметтері алдын ала толтырылмайды.</p><h3>Уақыт құрылымы · 40 минут</h3><div class=\"tablewrap\"><table><thead><tr><th>Кезең</th><th>Уақыт</th><th>Әрекет</th></tr></thead><tbody><tr><td>Мақсат пен түсіндірме</td><td>3 мин</td><td>Мақсатты айтып, мысалды талқылау</td></tr><tr><td>5 жағдаят</td><td>15 мин</td><td>A1–A5: әрқайсысына 3 минут</td></tr><tr><td>Жұптық жұмыс</td><td>4 мин</td><td>A6: ортақ жауап</td></tr><tr><td>Топтық жұмыс</td><td>6 мин</td><td>A7: ортақ өнім</td></tr><tr><td>Шығармашылық жұмыс</td><td>5 мин</td><td>A8: қысқа мәтін не сурет</td></tr><tr><td>5 сұрақ</td><td>4 мин</td><td>Бес сұраққа қысқа жауап</td></tr><tr><td>Кері байланыс</td><td>3 мин</td><td>Белгіше және келесі қадам</td></tr></tbody></table></div><h3>Жеңілдету</h3><p>Нұсқауды бір қадамға қысқартыңыз; мәтінді дауыстап оқыңыз; екі қауіпсіз таңдау ұсыныңыз; сурет, ауызша жауап не көмекші хатшы беріңіз.</p><h3>Күрделендіру</h3><p>Ұсынысқа балама шешім және тексеру өлшемін қосуды сұраңыз. Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><h3>Әдеп және қауіпсіздік</h3><p>Жеке оқиғаны, отбасы қаржысын, денсаулық дерегін, құпиясөз не хаттарды сұрамаңыз. Ойдан шығарылған жағдайды талқылаңыз. Қатысу мен жауап беру формасын таңдауға мүмкіндік беріңіз. Қауіпті әрекеттерді тәжірибеде орындатпаңыз. Қажет болса, оқушыға жеке және қауіпсіз көмек жолын түсіндіріңіз.</p><h3>Бақылау бағдары</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Кездесу орны» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><p>Балаларға сандық баға қойылмайды. Қандай шешім таңдағанын, себебін және қажет қолдауын сипаттаңыз.</p><h3>Дереккөздер</h3><p>Жағдаяттар, түсіндірме мен тапсырмалар — авторлық әдістемелік әзірлеме. Бағыт атауы ресми бағдарлама талаптарының толық көшірмесі ретінде ұсынылмайды.</p></section></article><nav class=\"topic-nav\" aria-label=\"Тақырыптар арасында өту\"><a class=\"btn\" href=\"#/lesson/g09-t07\">← Алдыңғы тақырып</a><a class=\"btn\" href=\"#/grade/9\">Сынып тақырыптары</a><a class=\"btn\" href=\"#/lesson/g09-t09\">Келесі тақырып →</a></nav>", "kind": "lesson", "grade": "9", "lesson": "g09-t08", "title": "Қауіпті бағалау және хабарлау | Тәрбие әлемі"}, "lesson/g09-t09": {"html": "<nav class=\"breadcrumb\" aria-label=\"Орналасу жолы\"><a href=\"tarbie.html\">Басты бет</a><span> / </span><a href=\"#/grade/9\">9-сынып</a><span> / </span><span>Құқықтық тәртіп</span></nav><section class=\"lesson-head\"><div class=\"lesson-kicker\"><span>⚑</span><span>9-сынып · 09/30 · 40 минут</span></div><h1>Құқықтық мәселені дерекпен талдау</h1><p>Құқықтық тәртіп</p></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/grade/9\">← Сыныпқа оралу</a><a class=\"btn\" href=\"tarbie.html\">Басты бет</a><button id=\"favorite\" type=\"button\" aria-pressed=\"false\">☆ Таңдаулыға қосу</button><button id=\"mark-viewed\" type=\"button\" aria-pressed=\"false\">○ Қаралды деп белгілеу</button><button id=\"print-lesson\" type=\"button\">Басып шығару / PDF</button></div><div class=\"tabbar\" role=\"tablist\" aria-label=\"Сабақ бөлімдері\"><button type=\"button\" role=\"tab\" id=\"tab-intro\" aria-controls=\"panel-intro\" aria-selected=\"true\" data-tab=\"intro\">Түсіндірме</button><button type=\"button\" role=\"tab\" id=\"tab-tasks\" aria-controls=\"panel-tasks\" aria-selected=\"false\" data-tab=\"tasks\">Тапсырмалар</button><button type=\"button\" role=\"tab\" id=\"tab-resource\" aria-controls=\"panel-resource\" aria-selected=\"false\" data-tab=\"resource\">Шығармашылық ресурс</button><button type=\"button\" role=\"tab\" id=\"tab-reflection\" aria-controls=\"panel-reflection\" aria-selected=\"false\" data-tab=\"reflection\">Кері байланыс</button><button type=\"button\" role=\"tab\" id=\"tab-teacher\" aria-controls=\"panel-teacher\" aria-selected=\"false\" data-tab=\"teacher\">Мұғалімге</button></div><article class=\"lesson-body\"><section id=\"panel-intro\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-intro\" tabindex=\"0\"><h2>Тәрбие сағатының мақсаты</h2><p class=\"goal\">«Құқықтық мәселені дерекпен талдау» тақырыбы арқылы құқық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну.</p><h3>Күтілетін нәтижелер</h3><ul><li>Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</li><li>«Құқық» ұғымын тақырыптағы бір әрекетпен байланыстырады.</li><li>Өзі орындайтын бір келесі қадамды және қажет көмекті атайды.</li></ul><h3>Шағын түсіндірме</h3><p>Әр баланың қадір-қасиеті мен қауіпсіздігі маңызды. Пікір айту кезінде өзгенің де сөзін тыңдау қажет. Құқықтар жақсы мінез үшін берілетін сыйлық емес. Келіспеушілікті тыныш талқылап, қажет болса сенімді ересектің көмегін сұраймыз.</p><p>Бүгінгі назарымыз: «Құқықтық мәселені дерекпен талдау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет.</p><p>Өмірлік мысал: Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</p><div class=\"concepts\"><span>Құқық</span><span>Міндет</span><span>Қадір-қасиет</span><span>Бейбіт шешім</span></div><div class=\"remember\"><strong>Есте сақта</strong><p>Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.</p></div></section><section id=\"panel-tasks\" class=\"tab-panel\" role=\"tabpanel\" aria-labelledby=\"tab-tasks\" tabindex=\"0\"><h2>5 жағдаяттық тапсырма</h2><p class=\"muted\">Әр оқиға ойдан шығарылған. Жеке өміріңіз туралы айту міндетті емес.</p><section class=\"activity \" id=\"A1\"><div class=\"activity-top\"><span class=\"activity-id\">A1</span><span class=\"tag\">3 минут</span></div><h3>1-жағдаят. Таңдау сәті</h3><p class=\"case-text\">Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру.</p></details></section><section class=\"activity \" id=\"A2\"><div class=\"activity-top\"><span class=\"activity-id\">A2</span><span class=\"tag\">3 минут</span></div><h3>2-жағдаят. Өзгеге әсері</h3><p class=\"case-text\">Жоба қатысушысының жеке мәліметі ортақ кестеге келісімсіз жарияланды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Рұқсат сұрау; жеке деректі таратпау; бұзылған шекараны түзету.</p></details></section><section class=\"activity \" id=\"A3\"><div class=\"activity-top\"><span class=\"activity-id\">A3</span><span class=\"tag\">3 минут</span></div><h3>3-жағдаят. Қауіпсіз шешім</h3><p class=\"case-text\">Шектеулі ресурсты бөлу кезінде бір топтың мүддесі ескерілмеді.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Әр тараптың қажетін тыңдау; кезек не ортақ пайдалану келісімін табу.</p></details></section><section class=\"activity \" id=\"A4\"><div class=\"activity-top\"><span class=\"activity-id\">A4</span><span class=\"tag\">3 минут</span></div><h3>4-жағдаят. Сыйластық қадамы</h3><p class=\"case-text\">Міндетін орындамаған адамды негізгі қолдаудан айыру керек деген пікір айтылды.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Міндет бұзылуын түзету мен негізгі құқықтарды ажырату; адамды қолдаудан айырмау.</p></details></section><section class=\"activity \" id=\"A5\"><div class=\"activity-top\"><span class=\"activity-id\">A5</span><span class=\"tag\">3 минут</span></div><h3>5-жағдаят. Келесі әрекет</h3><p class=\"case-text\">Жауапсыз қалған өтінішті қайта жолдаудың дұрыс ретін топ іздеп отыр.</p><p>Белгілі фактіні, пікірді және жетіспейтін ақпаратты бөлек жаз. Тексеру қажет бір дереккөз түрін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз, қарындаш; ауызша жауап беруге болады.</p><p class=\"meta\"><strong>Нәтиже:</strong> Факт, пікір және белгісіздікті ажыратып шешім ұсынады.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Мұғалім, сынып жетекшісі, мектеп әкімшілігі арқылы қауіпсіз көмек пен қарау жолын нақтылау.</p></details></section><h2>Жұптық және топтық жұмыс</h2><section class=\"activity pair\" id=\"A6\"><div class=\"activity-top\"><span class=\"activity-id\">A6</span><span class=\"tag\">4 минут</span></div><h3>Жұптық жұмыс: бірге ойланайық</h3><p>Бірі өтініш айтады, екіншісі өзгенің қажетін қайталап, бейбіт шешім ұсынады. Мысал: ортақ кітапты пайдалану. Бірің факт тексеруші, екіншің дәлелді пікір авторы болыңдар. Дерек жеткілікті және жеткіліксіз тұстарды ажыратып, қорытынды жазыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Екі адамға бір қағаз, қарындаш; сурет не ауызша жауап баламасы бар.</p><p class=\"meta\"><strong>Нәтиже:</strong> Екі қатысушының үлесі бар ортақ жауап.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Белгілі факт ...; тексерілетіні ...; осы шектеумен ... ұсынамын.</p></details></section><section class=\"activity group\" id=\"A7\"><div class=\"activity-top\"><span class=\"activity-id\">A7</span><span class=\"tag\">6 минут</span></div><h3>Топтық жұмыс: ортақ шешім</h3><p>«Мәселе — әр тараптың қажеті — келісім — қайта қарау» бейбіт шешім картасын жасаңдар. Дерек тексеруші, мүдде талдаушы, хатшы, модератор рөлдерін бөліңдер. Ұсынысқа дәлел, шектеу және қауіпсіздік шартын қосыңдар.</p><p class=\"meta\"><strong>Құрал:</strong> Үш-төрт адамға бір парақ, қарындаш, таймер.</p><p class=\"meta\"><strong>Нәтиже:</strong> Рөлдері анық, қауіпсіз әрі қолжетімді ортақ өнім.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Ұсыныстың тақырыпқа сай, орындалатын және әр қатысушыға қолжетімді болуын тексеріңіз. Өз құқығымды түсіндіремін, өзгенің құқығын сыйлаймын.</p></details></section><h2>Шығармашылық тапсырма</h2><section class=\"activity \" id=\"A8\"><div class=\"activity-top\"><span class=\"activity-id\">A8</span><span class=\"tag\">5 минут</span></div><h3>Шығармашылық тапсырма</h3><p>Құқық пен міндет байланысын көрсететін екі бағанды постер әзірлеңдер. Дерек шегін, әсерін және іске асыру шартын көрсет.</p><p class=\"meta\"><strong>Құрал:</strong> Қағаз және қауіпсіз жазу құралдары; интернет қажет емес.</p><p class=\"meta\"><strong>Нәтиже:</strong> Тақырыпты түсіндіретін авторлық сурет не мәтін.</p><details class=\"teacher-answer\"><summary>Мұғалімге: ықтимал жауап / талқылау бағдары</summary><p>Көркемдік сапаны емес, мағынаны, қауіпсіз шешімді және өзгенің қадірін сақтауын талқылаңыз.</p></details></section><section class=\"questions\"><h2>Тәрбие сағаты бойынша 5 сұрақ</h2><ol><li>Өзгенің сөзін тыңдау неге қажет? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Құқық пен міндет қалай байланысады? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Жеке мәліметті неге қорғау керек? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Дауда екі тарапты қалай тыңдаймыз? Факт пен пікірді ажыратып, қажет деректі ата.</li><li>Көмек сұрау жолын қайдан білеміз? Факт пен пікірді ажыратып, қажет деректі ата.</
