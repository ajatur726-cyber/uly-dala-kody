ін ата. Дәлел жетпесе, шешімнің шегін көрсет.</p></div><span class=\"class-num\" aria-hidden=\"true\">09</span></section><div class=\"toolbar\"><a class=\"btn\" href=\"#/home?section=classes\">← Басты бет</a><a class=\"btn\" href=\"#/home?section=library\">Барлық сыныптан іздеу</a></div><section class=\"filterbox\" aria-label=\"Материалды іздеу\"><label class=\"searchlabel\">Тақырып немесе кілт сөз<input id=\"search\" type=\"search\" placeholder=\"Мысалы: достық, рәміздер, қауіпсіздік…\"></label><label>Сынып<select id=\"grade-filter\"><option value=\"\">Осы сынып</option><option value=\"1\">1-сынып</option><option value=\"2\">2-сынып</option><option value=\"3\">3-сынып</option><option value=\"4\">4-сынып</option><option value=\"5\">5-сынып</option><option value=\"6\">6-сынып</option><option value=\"7\">7-сынып</option><option value=\"8\">8-сынып</option><option value=\"9\">9-сынып</option><option value=\"10\">10-сынып</option><option value=\"11\">11-сынып</option></select></label><label>Бағыт<select id=\"direction-filter\"><option value=\"\">Барлық бағыт</option><option value=\"Адал азамат\">Адал азамат</option><option value=\"Таза Қазақстан\">Таза Қазақстан</option><option value=\"Заң мен тәртіп\">Заң мен тәртіп</option><option value=\"Ұлттық мұраны қорғайық\">Ұлттық мұраны қорғайық</option><option value=\"ДосболLIKE\">ДосболLIKE</option><option value=\"Буллингтің алдын алу\">Буллингтің алдын алу</option><option value=\"Кибербуллингтің алдын алу\">Кибербуллингтің алдын алу</option><option value=\"Қоғамдық ортадағы қауіпсіздік\">Қоғамдық ортадағы қауіпсіздік</option><option value=\"Құқықтық тәртіп\">Құқықтық тәртіп</option><option value=\"Білімім — Отаныма!\">Білімім — Отаныма!</option><option value=\"Қарттар күні\">Қарттар күні</option><option value=\"Ұстаздар күні\">Ұстаздар күні</option><option value=\"Отбасы күні\">Отбасы күні</option><option value=\"Республика күні\">Республика күні</option><option value=\"Ұлттық валюта — теңге\">Ұлттық валюта — теңге</option>< window.TARBIE_CATALOG=[{"id": "g09-t01", "grade": 9, "topic": 1, "title": "Адалдық пен авторлық еңбек", "direction": "Адал азамат", "icon": "✦", "search": "Адалдық пен авторлық еңбек Адал азамат «Адалдық пен авторлық еңбек» тақырыбы арқылы адалдық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Адалдық — өз әрекетің туралы шын айту және өзгенің еңбегін иемденбеу. Қателескен адам оны мойындап, түзете алады. Әділдік әр адамның үлесін және қажет қолдауын ескеруді талап етеді. Бүгінгі назарымыз: «Адалдық пен авторлық еңбек». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Жобаға қажет дерегі бар табылған құрылғыны қолдану ұсынылды. Иесінің келісімі жоқ. Ойлану бағдары: Затты мұғалімге жеткізу; құрылғыны ашпау; иесін қауіпсіз жолмен іздеу. Жобаға қажет дерегі бар табылған құрылғыны қолдану ұсынылды. Иесінің келісімі жоқ. Жоба есебіндегі қателікті бір ғана қатысушыға жабу команда беделін сақтайтындай көрінді. Қоғамдық бастаманың мерзімі өтуде. Уәде орындалмайтынын ұйымдастырушы біледі. ЖИ мен ашық деректі қолданған зерттеу жеке авторлық еңбек ретінде ұсынылмақ. Іріктеу талабын ұйымдастырушы өз танысына ыңғайлап өзгертті.", "path": "#/lesson/g09-t01"}, {"id": "g09-t02", "grade": 9, "topic": 2, "title": "Қалдық мәселесіне жүйелі көзқарас", "direction": "Таза Қазақстан", "icon": "♧", "search": "Қалдық мәселесіне жүйелі көзқарас Таза Қазақстан «Қалдық мәселесіне жүйелі көзқарас» тақырыбы арқылы тазалық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Таза орта күнделікті ұсақ әрекеттерден құралады. Қалдықты азайту, суды ысырап етпеу және ортақ орынды ұқыпты пайдалану маңызды. Тазалық жұмысы қауіпсіз болуы керек; шыны мен белгісіз затты балалар жинамайды. Бүгінгі назарымыз: «Қалдық мәселесіне жүйелі көзқарас». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Бір реттік безендіруге көп қаржы кетеді, бірақ қайта қолданылатын затты сақтау орны жоқ. Ойлану бағдары: Қауіпсіз қағазды жәшікке салу; азайту мен қайта қолдануды алдымен қарастыру. Бір реттік безендіруге көп қаржы кетеді, бірақ қайта қолданылатын затты сақтау орны жоқ. Суды үнемдеу жобасының нәтижесі тек әдемі есеппен көрсетіліп, өлшем жасалмаған. Қоғамдық сенбілікте балаларға қауіпті қалдықты жинауды ұсынды. Ағаш отырғызу ұсынылды, бірақ кейінгі суару жауаптысы анықталмады. Экологиялық науқан үшін көп пластик сыйлық сатып алу ұсынылды.", "path": "#/lesson/g09-t02"}, {"id": "g09-t03", "grade": 9, "topic": 3, "title": "Заң мен мектеп ережесін ажырату", "direction": "Заң мен тәртіп", "icon": "⚖", "search": "Заң мен мектеп ережесін ажырату Заң мен тәртіп «Заң мен мектеп ережесін ажырату» тақырыбы арқылы ереже мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ереже адамдардың бірге қауіпсіз өмір сүруіне көмектеседі. Мектептің күнделікті ережесі мен мемлекет заңының қызметі бірдей емес. Түсініксіз талапты сұрақ қою және ұсыныс білдіру арқылы нақтылауға болады. Бұл сабақ нақты құқықтық кеңес бермейді. Бүгінгі назарымыз: «Заң мен мектеп ережесін ажырату». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Ұйымдастырушы кезек тәртібін өз тобына ғана қолданбайды. Ойлану бағдары: Сыпайы ескерту; бәріне түсінікті тәртіп сұрау; дау өршісе ересекке жүгіну. Ұйымдастырушы кезек тәртібін өз тобына ғана қолданбайды. Байқау өлшемі нәтижелер белгілі болған соң өзгертілді. Белсенділер нәтижеге тез жету үшін келісілген қауіпсіздік рәсімін айналып өткісі келеді. Мектеп талабын заң талабы деп түсіндірген хабарлама тарады, дереккөз жоқ. Ереже бұзылғанын тіркеу рәсімі адамдарды ұялтуға айналды.", "path": "#/lesson/g09-t03"}, {"id": "g09-t04", "grade": 9, "topic": 4, "title": "Мәдени мұра және авторлық еңбек", "direction": "Ұлттық мұраны қорғайық", "icon": "❖", "search": "Мәдени мұра және авторлық еңбек Ұлттық мұраны қорғайық «Мәдени мұра және авторлық еңбек» тақырыбы арқылы мұра мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мұраға тіл, өнер, дәстүр, тарихи орын мен тұрмыстық бұйым жатады. Оны сақтау — бүлдірмеу, мағынасын білу және дерегін бұрмаламай жеткізу. Бір бұйым туралы әртүрлі әңгіме болуы мүмкін; авторын және дереккөзін нақтылау пайдалы. Бүгінгі назарымыз: «Мәдени мұра және авторлық еңбек». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Көрме жобасында түпнұсқа затты тиісті қорғанышсыз тасымалдау жоспарланды. Ойлану бағдары: Көрме талабын сақтау; рұқсат сұрау; түпнұсқа орнына сурет не көшірме қолдану. Көрме жобасында түпнұсқа затты тиісті қорғанышсыз тасымалдау жоспарланды. Цифрлық көрмеде дерексіз түсіндірме ұлттық дәстүрдің жалғыз нұсқасы ретінде берілді. Көптілді көрмеде бір тілдегі түсіндірме қате аударылды. Жобада шебер туындысының бейнесін коммерциялық өнімге рұқсатсыз пайдалану ұсынылды. Ауызша тарих жобасында жазбаны кейін алып тастауды сұраған адамның өтініші ескерілмеді.", "path": "#/lesson/g09-t04"}, {"id": "g09-t05", "grade": 9, "topic": 5, "title": "Қолдау мәдениеті және шекара", "direction": "ДосболLIKE", "icon": "♡", "search": "Қолдау мәдениеті және шекара ДосболLIKE «Қолдау мәдениеті және шекара» тақырыбы арқылы достық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Достық тыңдау, сенім және ерікті қолдауға сүйенеді. Дос болу барлық ұсынысқа келісу дегенді білдірмейді. Өз шекараңды айтып, өзгенің таңдауын сыйлауға болады. Қауіп төнсе, мәселені жалғыз шешуге міндетті емессің. Бүгінгі назарымыз: «Қолдау мәдениеті және шекара». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Жоба тобына бұрын танымайтын қатысушыны алуға қарсы пікір айтылды. Ойлану бағдары: Қосылуды ұсыну; жауапты мәжбүрлемеу; қатысудың қолжетімді рөлін табу. Жоба тобына бұрын танымайтын қатысушыны алуға қарсы пікір айтылды. Серіктестер ортақ жобаның бағыты туралы екі түрлі ұстанымда. Досын қолдағысы келген адам оның жеке мәселесін топқа айтып қойды. Серіктес достықты алға тартып, адал емес шешімді қолдауды талап етті. Ортақ жобада беделді қатысушының ойы үнемі автоматты қабылданады.", "path": "#/lesson/g09-t05"}, {"id": "g09-t06", "grade": 9, "topic": 6, "title": "Қауіпсіз мектеп: жауапты куәгер", "direction": "Буллингтің алдын алу", "icon": "☂", "search": "Қауіпсіз мектеп: жауапты куәгер Буллингтің алдын алу «Қауіпсіз мектеп: жауапты куәгер» тақырыбы арқылы қолдау мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Біреуді қайта-қайта қорлау, қорқыту не шеттету — көмек қажет ететін жағдай. Оған ұшыраған бала кінәлі емес. Қауіпсіз жерге барып, сенімді ересекке айтуға болады. Бір рет болған ауыр әрекетті де елемеуге болмайды. Бұл сабақта қорлау сөздері мен көріністері қайталанбайды. Бүгінгі назарымыз: «Қауіпсіз мектеп: жауапты куәгер». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді. Ойлану бағдары: Шеттетілген адамды кінәламау; қауіпсіз қолдау; ересекке хабарлау. Құрамды анықтайтын топ бір адамды жүйелі түрде әлеуметтік ортадан шеттетеді. Көмек сұраған адамға қарсы кек қайтару қаупі бар, орта қауіпсіз емес. Беделді топ қудалауды әзіл деп ақтап, куәгерлерден үнсіз қалуды сұрайды. Алдын алу шарасында нақты оқушының оқиғасын оның келісімінсіз жарияламақ. Алғашқы хабарға жауап болмады, оқушы қауіпсіздігі әлі қамтамасыз етілген жоқ.", "path": "#/lesson/g09-t06"}, {"id": "g09-t07", "grade": 9, "topic": 7, "title": "Келісімсіз контентті таратпау", "direction": "Кибербуллингтің алдын алу", "icon": "▣", "search": "Келісімсіз контентті таратпау Кибербуллингтің алдын алу «Келісімсіз контентті таратпау» тақырыбы арқылы кибербуллинг мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Цифрлық ортада қорлау, қорқыту және келісімсіз контент тарату адамға зиян тигізеді. Жауап ретінде қорлаудың қажеті жоқ. Қауіпсіздік үшін сенімді ересекпен бірге шағымдану және бұғаттау мүмкіндігін қарастыруға болады. Куәгер ренжітетін материалды әрі қарай таратпайды. Бүгінгі назарымыз: «Келісімсіз контентті таратпау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр. Ойлану бағдары: Жауаптасып ұрыспау; ересекке айту; қауіпсіз бұғаттау мен шағым жолын таңдау. Бірнеше платформада бір адамды нысанаға алған жүйелі қудалау жүріп жатыр. Адамды кемсітетін өңделген бейнені «тексеру үшін» таратуды ұсынды. Біреудің атынан жасалған парақша оның беделіне зиян келтіреді. Киберқудалауға ұшыраған оқушы бар кінәні өзіне артып, көмек сұрамай жүр. Қудалаушы топ контентті өшіруді мәселе толық шешілді деп көрсетеді.", "path": "#/lesson/g09-t07"}, {"id": "g09-t08", "grade": 9, "topic": 8, "title": "Қауіпті бағалау және хабарлау", "direction": "Қоғамдық ортадағы қауіпсіздік", "icon": "⌂", "search": "Қауіпті бағалау және хабарлау Қоғамдық ортадағы қауіпсіздік «Қауіпті бағалау және хабарлау» тақырыбы арқылы кездесу орны мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қоғамдық жерде алдын ала келісілген бағыт пен кездесу орны көмектеседі. Бейтаныс адамға еріп кетпеу, қауіпті затты ұстамау және жауапты қызметкерден көмек сұрау маңызды. Қауіпсіздікке күмән туса, сенімді ересекпен бірге шешім қабылда. Бүгінгі назарымыз: «Қауіпті бағалау және хабарлау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек. Ойлану бағдары: Қауіпсіз жерде қалу; жауапты қызметкерге жүгіну; топты бақылаусыз бөлмеу. Қоғамдық шарада бір қатысушы жоғалды, топ өз бетімен әр жаққа бөлінбек. Ұйымдастырушы болып көрінген адам қатысушыны жеке орынға шақырды, өкілеті расталмаған. Шара еріктілеріне белгісіз пакетті орнынан жылжыту ұсынылды. Көрме ұйымдастырушылары қосымша орын үшін шығу жолын тарылтқысы келеді. Жоба үшін қауіпті орынға кіруді батылдық сынағы деп ұсынды.", "path": "#/lesson/g09-t08"}, {"id": "g09-t09", "grade": 9, "topic": 9, "title": "Құқықтық мәселені дерекпен талдау", "direction": "Құқықтық тәртіп", "icon": "⚑", "search": "Құқықтық мәселені дерекпен талдау Құқықтық тәртіп «Құқықтық мәселені дерекпен талдау» тақырыбы арқылы құқық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр баланың қадір-қасиеті мен қауіпсіздігі маңызды. Пікір айту кезінде өзгенің де сөзін тыңдау қажет. Құқықтар жақсы мінез үшін берілетін сыйлық емес. Келіспеушілікті тыныш талқылап, қажет болса сенімді ересектің көмегін сұраймыз. Бүгінгі назарымыз: «Құқықтық мәселені дерекпен талдау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады. Ойлану бағдары: Тыңдау кезегін келісу; пікірді мазмұны бойынша қарау; сыпайы қайта өтініш білдіру. Оқушы пікірі ұйымдастырушыға ұнамағандықтан ұсынысы қаралмады. Жоба қатысушысының жеке мәліметі ортақ кестеге келісімсіз жарияланды. Шектеулі ресурсты бөлу кезінде бір топтың мүддесі ескерілмеді. Міндетін орындамаған адамды негізгі қолдаудан айыру керек деген пікір айтылды. Жауапсыз қалған өтінішті қайта жолдаудың дұрыс ретін топ іздеп отыр.", "path": "#/lesson/g09-t09"}, {"id": "g09-t10", "grade": 9, "topic": 10, "title": "Өңір мәселесіне біліммен қарау", "direction": "Білімім — Отаныма!", "icon": "☀", "search": "Өңір мәселесіне біліммен қарау Білімім — Отаныма! «Өңір мәселесіне біліммен қарау» тақырыбы арқылы білім мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Білім адамға мәселені түсініп, пайдалы шешім табуға көмектеседі. Отанға қызмет ету күнделікті ортаға қамқорлықтан басталады. Пайдалы бастама біреудің нақты қажетіне жауап береді; оның нәтижесі тек суретпен емес, өзгеріспен бағаланады. Бүгінгі назарымыз: «Өңір мәселесіне біліммен қарау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Кітапханаға каталог ұсынылды, бірақ оны жаңартатын жауапты жоқ. Ойлану бағдары: Қажеттілікті нақтылау; реттеу жүйесін келісу; қолжетімді әрі сақталатын шешім табу. Кітапханаға каталог ұсынылды, бірақ оны жаңартатын жауапты жоқ. Тәлімгерлік жобасы оқушының орнына жұмыс орындауға айналды. Экожобада өлшем орнына болжам нәтиже ретінде жазылды. Ақпараттық карта көруі әлсіз адамдарға қолайсыз болып шықты. Қоғамдық жоба табысы бір адамның жетістігі ретінде көрсетілді.", "path": "#/lesson/g09-t10"}, {"id": "g09-t11", "grade": 9, "topic": 11, "title": "Ұрпақтар диалогы және келісім", "direction": "Қарттар күні", "icon": "✿", "search": "Ұрпақтар диалогы және келісім Қарттар күні «Ұрпақтар диалогы және келісім» тақырыбы арқылы құрмет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Үлкенге құрмет — тыңдау, сыпайы сөйлесу және көмекті рұқсатпен ұсыну. Адамның жасына қарап оның мүмкіндігін болжауға болмайды. Қарт кісі де өз таңдауын өзі жасайды. Сұхбатты жазуға және жариялауға бөлек келісім қажет. Бүгінгі назарымыз: «Ұрпақтар диалогы және келісім». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Қамқорлық жобасы қызмет алушының таңдауын сұрамай шешім қабылдады. Ойлану бағдары: Көмекті сыпайы ұсыну; бас тартуды құрметтеу. Қамқорлық жобасы қызмет алушының таңдауын сұрамай шешім қабылдады. Ауызша тарих жобасында қатысушы тәжірибесі жоба жоспарына сыймай қалды. Қамқорлық есебіне адамның келісімінсіз фотосын қосу ұсынылды. Цифрлық қолдау бағдарламасы қатысушыларды жасына қарай бірдей әлсіз деп сипаттады. Ұрпақтар кездесуінің орны кей қонақтарға қолжетімсіз.", "path": "#/lesson/g09-t11"}, {"id": "g09-t12", "grade": 9, "topic": 12, "title": "Кері байланысты мәдени жеткізу", "direction": "Ұстаздар күні", "icon": "✎", "search": "Кері байланысты мәдени жеткізу Ұстаздар күні «Кері байланысты мәдени жеткізу» тақырыбы арқылы ұстаз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Ұстаз еңбегі сабақ түсіндірумен шектелмейді: ол дайындалады, кері байланыс береді, оқуға жағдай жасайды. Алғыс қымбат сыйлыққа тәуелді емес. Құрметпен сұрақ қоюға және түсінбегеніңді айтуға болады. Алғыс шарасына қатысу ерікті болуы керек. Бүгінгі назарымыз: «Кері байланысты мәдени жеткізу». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Мерекелік сыйлыққа қатыспаған отбасылар тізімін жарияламақ. Ойлану бағдары: Алғысты тегін әрі ерікті білдіру; қаржылық мәлімет сұрамау. Мерекелік сыйлыққа қатыспаған отбасылар тізімін жарияламақ. Оқушы бағалау туралы келіспеушілікті қоғамдық айыптаумен шешкісі келеді. Бірлескен іс-шарада оқушы мен мұғалім міндеттері анық бөлінбеген. Жобаға қатысу оқушының жеке сенімі мен мүмкіндігін ескермей міндеттелді. Мерекелік бейнеде адамның жеке пікірі келісімсіз берілді.", "path": "#/lesson/g09-t12"}, {"id": "g09-t13", "grade": 9, "topic": 13, "title": "Ұрпақтар диалогын құру", "direction": "Отбасы күні", "icon": "⌂", "search": "Ұрпақтар диалогын құру Отбасы күні «Ұрпақтар диалогын құру» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отбасы мен қамқор адамдар әртүрлі болады. Жылы сөз, қауіпсіз көмек және бір-бірін тыңдау жақындықты нығайтады. Үйдегі міндет жас пен мүмкіндікке сай бөлінеді. Отбасы туралы жеке мәліметті көпшілікке айтуға ешкім міндетті емес. Бүгінгі назарымыз: «Ұрпақтар диалогын құру». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Үйдегі көрінбейтін еңбек ескерілмей, оқу мен демалыс уақыты тең бөлінбейді. Ойлану бағдары: Жасқа сай қауіпсіз міндет ұсыну; еңбек пен демалысты келісу. Үйдегі көрінбейтін еңбек ескерілмей, оқу мен демалыс уақыты тең бөлінбейді. Оқу жоспары туралы отбасы пікірі мен оқушы мақсаты сәйкес келмеді. Жобаға отбасылық қаржы мен жеке хаттарды қосу ұсынылды. Отбасы мүшесінің жеке дерегі ортақ чатқа рұқсатсыз жіберілді. Іс-шара тапсырмалары әртүрлі отбасылардың қатысу мүмкіндігін шектеді.", "path": "#/lesson/g09-t13"}, {"id": "g09-t14", "grade": 9, "topic": 14, "title": "Республика және азаматтық қатысу", "direction": "Республика күні", "icon": "☀", "search": "Республика және азаматтық қатысу Республика күні «Республика және азаматтық қатысу» тақырыбы арқылы республика мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Республика күні елдің мемлекеттілігі мен ортақ болашағы туралы ойлануға мүмкіндік береді. Елге құрмет сөзбен де, қоғамдық мүлікті сақтау мен адамдарға сыйластық таныту арқылы да көрінеді. Әр адамның қауіпсіз, шамасына сай пайдалы іс жасауына болады. Бүгінгі назарымыз: «Республика және азаматтық қатысу». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді. Ойлану бағдары: Мерекені жауапты ұйымдастыру; қауіпсіз тазалық пен қолжетімділікті алдын ала жоспарлау. Ірі патриоттық шараның бюджетінде тазалау мен қолжетімділік ескерілмеді. Қоғамдық ұсыныс тек орталықтың қажетіне бағытталып, шағын елді мекен ұмыт қалды. Патриоттық жоба атауымен рұқсатсыз нысан орнату ұсынылды. Жоба ел жетістігін көрсету үшін дәлелсіз көрсеткіштер ұсынды. Қоғамдық бастаманың әсері тек қатысушылар саны арқылы бағаланды.", "path": "#/lesson/g09-t14"}, {"id": "g09-t15", "grade": 9, "topic": 15, "title": "Шығын мен мүмкіндікті салыстыру", "direction": "Ұлттық валюта — теңге", "icon": "₸", "search": "Шығын мен мүмкіндікті салыстыру Ұлттық валюта — теңге «Шығын мен мүмкіндікті салыстыру» тақырыбы арқылы теңге мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Теңге — Қазақстанның ұлттық валютасы. Ақшаны жоспарлау қажеттілік пен қалауды ажыратудан басталады. Оқу тапсырмасында тек ойдан шығарылған сома қолданылады. Жеке қаржы, банк картасының дерегі немесе құпия код сұралмайды. Бүгінгі назарымыз: «Шығын мен мүмкіндікті салыстыру». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді. Ойлану бағдары: Алдымен нақты қажеттілік; шығын шегін есептеу; жеке қаржы туралы сұрамау. Айлық оқу бюджетінде міндетті шығын бар, жарнама жоспардан тыс сатып алуға итермелейді. Топқа қабылдау үшін белгілі қымбат өнім алу талап етілді. Тегін сынақтан кейін ақылы жазылым басталатыны ұсақ мәтінмен берілді. Банк атынан сөйлеген адам шұғыл растау кодын беруді талап етті. Екі ұсыныстың бастапқы бағасы бірдей, бірақ қосымша төлемі әртүрлі.", "path": "#/lesson/g09-t15"}, {"id": "g09-t16", "grade": 9, "topic": 16, "title": "Рәміздерді таныстыру жауапкершілігі", "direction": "Мемлекеттік рәміздер", "icon": "☀", "search": "Рәміздерді таныстыру жауапкершілігі Мемлекеттік рәміздер «Рәміздерді таныстыру жауапкершілігі» тақырыбы арқылы ту мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Қазақстанның мемлекеттік рәміздері — Ту, Елтаңба және Әнұран. Олар елдің біртұтастығы мен мемлекеттілігін танытады. Рәміз туралы мәліметті ресми дереккөзден тексерген дұрыс. Қолдан жасалған оюды ресми рәміздің дәл көшірмесі деп таныстыруға болмайды. Бүгінгі назарымыз: «Рәміздерді таныстыру жауапкершілігі». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды. Ойлану бағдары: Ресми нұсқамен салыстыру; бұрмаланған бейнені дәл деп ұсынбау. Ресми рәмізді ЖИ жасаған дәл емес суретпен ауыстыру ұсынылды. Қатысушының денсаулық не қолжетімділік ерекшелігі ескерілмей, рәсімде масқаралау болды. Таныстырылымда дәлелсіз символдық жорамал ресми түсіндірме ретінде берілді. Көрмедегі рәмізді пайдалану жоспары жауапты маманмен келісілмеді. Қоғамдық парақша ресми суретті белгісіз сайттан алып, нұсқасын тексермеді.", "path": "#/lesson/g09-t16"}, {"id": "g09-t17", "grade": 9, "topic": 17, "title": "Тәуелсіздік туралы деректі талдау", "direction": "Тәуелсіздік күні", "icon": "✦", "search": "Тәуелсіздік туралы деректі талдау Тәуелсіздік күні «Тәуелсіздік туралы деректі талдау» тақырыбы арқылы тәуелсіздік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Тәуелсіздік — елдің өз болашағын өзі айқындауымен байланысты ұғым. Бейбіт өмірді бағалау, тарихи деректі бұрмаламау және өзгенің қадірін сыйлау маңызды. Азаматтық жауапкершілік ортақ ортаға қамқорлықтан көрінеді. Бүгінгі назарымыз: «Тәуелсіздік туралы деректі талдау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды. Ойлану бағдары: Ортақ мүлікті сақтау; зиянды мойындап, қауіпсіз түзету. Ауқымды шараның имиджі үшін келтірілген зиянды есептен жасыру ұсынылды. Қоғамдық мәселедегі келіспеушілік жеке адамды айыптауға айналды. Әлеуметтік желіде дереккөзсіз тарихи тұжырым кең тарады. Қоғамдық бастама әртүрлі адамдардың қатысу мүмкіндігін ескермеді. Жастар ұсынысы шешімге ықпал ете алмайды деген пікір туды.", "path": "#/lesson/g09-t17"}, {"id": "g09-t18", "grade": 9, "topic": 18, "title": "Білім бағытын саналы таңдау", "direction": "Мамандық таңдау және еңбек", "icon": "⚙", "search": "Білім бағытын саналы таңдау Мамандық таңдау және еңбек «Білім бағытын саналы таңдау» тақырыбы арқылы еңбек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Мамандық қоғамдағы белгілі бір қажеттілікке жауап береді. Таңдауда қызығушылық, дағды, оқу жолы және еңбек жағдайы ескеріледі. Кәсіпті адамның жынысына немесе отбасы жағдайына қарап шектеуге болмайды. Бірден түпкілікті шешімге келу міндетті емес. Бүгінгі назарымыз: «Білім бағытын саналы таңдау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді. Ойлану бағдары: Әр еңбектің нақты пайдасын атау; адам қадірін лауазыммен өлшемеу. Кәсіби талқылау табыс мөлшеріне ғана тіреліп, қоғамдық маңыз ескерілмеді. Талапкер бағытын өз қызығушылығын тексермей, құрдасының таңдауына қарап бекітті. Мамандыққа жарамдылық туралы дәлелсіз әлеуметтік шектеу қойылды. Кәсіби сынамада оқушыға рұқсатсыз қауіпті жұмыс ұсынылды. Оқу орны туралы жарнамада қабылдау шарты мен толық шығын көрсетілмеді.", "path": "#/lesson/g09-t18"}, {"id": "g09-t19", "grade": 9, "topic": 19, "title": "Қауіпсіздікті көп қадаммен қорғау", "direction": "Интернеттегі қауіпсіздік", "icon": "▤", "search": "Қауіпсіздікті көп қадаммен қорғау Интернеттегі қауіпсіздік «Қауіпсіздікті көп қадаммен қорғау» тақырыбы арқылы жеке дерек мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жеке дерекке аты-жөн, мекенжай, құпиясөз және растау коды сияқты мәлімет жатады. Күдікті сілтеме мен шұғыл талапты бірден орындамай, ресми арнадан тексерген дұрыс. Сабақта нақты құпиясөз жасалмайды және ешкімнің аккаунты ашылмайды. Бүгінгі назарымыз: «Қауіпсіздікті көп қадаммен қорғау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды. Ойлану бағдары: Артық дерек бермеу; ересекпен мақсат пен рұқсатты тексеру. Жобаға қажет емес жеке деректі міндетті жинайтын қолданба ұсынылды. Таныс ұйымның атына ұқсас домен төлем не код енгізуді талап етті. Топ әр сервисте бір құпиясөз қолдануды ыңғайлы деп таңдады. Қосымша деректі үшінші тарапқа беру шартын түсініксіз жазды. Желіде ғана танитын адам өз тұлғасын растамай жеке кездесуді талап етті.", "path": "#/lesson/g09-t19"}, {"id": "g09-t20", "grade": 9, "topic": 20, "title": "Қоғамдағы өзара көмек", "direction": "Алғыс айту күні", "icon": "✿", "search": "Қоғамдағы өзара көмек Алғыс айту күні «Қоғамдағы өзара көмек» тақырыбы арқылы алғыс мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Алғыс нақты көмекті байқап, оның әсерін айту арқылы шынайы болады. «Көмектескенің үшін рақмет» деген сөздің өзі маңызды. Алғыс міндетті сыйлық немесе жауап қызмет талап етпейді. Күнделікті байқалмайтын еңбекті де бағалауға болады. Бүгінгі назарымыз: «Қоғамдағы өзара көмек». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді. Ойлану бағдары: Нақты көмек пен әсерін атау; үлесті әділ көрсету. Есепте негізгі еңбекті атқарған еріктілердің аты не рөлі ескерілмеді. Құрмет тізімі тек көпшілікке танымал адамдардан құралды. Серіктес бұрынғы көмегі үшін этикалық емес шешімге қолдау талап етті. Жобаға алғыс айтуды міндетті жария әрекетпен өлшеу ұсынылды. Бюджеті жоқ қатысушыларды мерекелік шарадан шеттету қаупі туды.", "path": "#/lesson/g09-t20"}, {"id": "g09-t21", "grade": 9, "topic": 21, "title": "Қамқор еңбек және тең мүмкіндік", "direction": "Аналар мерекесі", "icon": "❀", "search": "Қамқор еңбек және тең мүмкіндік Аналар мерекесі «Қамқор еңбек және тең мүмкіндік» тақырыбы арқылы қамқорлық мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Анаға және қамқор ересекке құрмет жылы сөзден, тыңдаудан және қауіпсіз көмектен көрінеді. Қамқорлық еңбегі бір адамға ғана міндеттелмейді. Әр оқушы өзі таңдаған қамқор адамға алғыс білдіре алады. Аналар күні мен 8 наурыз — атауы мен күні бөлек мерекелер. Бүгінгі назарымыз: «Қамқор еңбек және тең мүмкіндік». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды. Ойлану бағдары: Жасқа сай қауіпсіз көмек; еңбек пен демалысты әділ бөлісу. Мерекелік құрмет күнделікті үй еңбегін әділ бөлумен жалғаспайды. Жалғыз отбасы үлгісіне құрылған сценарий кей қатысушыларды ыңғайсыз күйге түсірді. Мерекелік жоспар қаржылық мүмкіндікке қарай оқушыларды бөліп жіберді. Еңбек туралы талқылауда қамқорлық тек әйел адамның міндеті деп айтылды. Мерекелік жобаға отбасы оқиғасы мен бейнесін келісімсіз жариялау жоспарланды.", "path": "#/lesson/g09-t21"}, {"id": "g09-t22", "grade": 9, "topic": 22, "title": "Конституциялық ұғымды дерекпен түсіндіру", "direction": "Конституция күні", "icon": "⚖", "search": "Конституциялық ұғымды дерекпен түсіндіру Конституция күні «Конституциялық ұғымды дерекпен түсіндіру» тақырыбы арқылы конституция мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Конституция — мемлекеттің негізгі заңы. Бұл сабақта адам қадірін, қауіпсіздікті және өзгенің пікіріне құрметті күнделікті мысалмен талқылаймыз. Нақты құқықтық тұжырымға ресми мәтіннен дәлел қажет. Бұрынғы мәтін мен қолданыстағы редакцияны шатастырмау маңызды. Бүгінгі назарымыз: «Конституциялық ұғымды дерекпен түсіндіру». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Қоғамдық жобаны талқылауда азшылық пікірін мүлде тіркемеу ұсынылды. Ойлану бағдары: Әркімді тыңдау; негізгі адам қадірін дауыс көпшілігімен жоққа шығармау. Қоғамдық жобаны талқылауда азшылық пікірін мүлде тіркемеу ұсынылды. Пікірлер қайшылығында адамның құқығын талқылау жеке айыптауға айналды. Тексерілмеген ескі құқықтық мәтін жаңа нұсқа ретінде ұсынылды. Қолжетімділік шарасы артық жеңілдік деп сыналды. Жастар ұсынысын қабылдау рәсімі түсініксіз және кері байланыс жоқ.", "path": "#/lesson/g09-t22"}, {"id": "g09-t23", "grade": 9, "topic": 23, "title": "Мәдени таныстырудағы дәлдік", "direction": "Наурыз мерекесі", "icon": "❖", "search": "Мәдени таныстырудағы дәлдік Наурыз мерекесі «Мәдени таныстырудағы дәлдік» тақырыбы арқылы наурыз мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Наурыз жаңару, татулық және ізгі тілекпен байланысты. Дәстүрді түсіндіруде оның мағынасына назар аударамыз. Әр өңірдегі тәжірибе әртүрлі болуы мүмкін. Мерекені қауіпсіз, ысырапсыз және бәріне қолжетімді өткізуге болады. Бүгінгі назарымыз: «Мәдени таныстырудағы дәлдік». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді. Ойлану бағдары: Күлмеу; әртүрлі тәжірибені құрметтеу; деректі нақтылау. Сценарийде бір өңірдің нұсқасы бүкіл халықтың жалғыз дәстүрі ретінде берілді. Мереке бюджеті кей отбасыларға міндетті шығын жүктейді. Мерекелік ас жоспары қатысушылардың қауіпсіздік қажеттілігін ескермеді. Экологиялық ұранға қарамастан қайта қолдану жоспары жасалмады. Мерекенің бірлік мақсаты рейтинг пен бәсекенің көлеңкесінде қалды.", "path": "#/lesson/g09-t23"}, {"id": "g09-t24", "grade": 9, "topic": 24, "title": "Қоғамға қызмет және этика", "direction": "Отан қорғаушылар күні", "icon": "⚑", "search": "Қоғамға қызмет және этика Отан қорғаушылар күні «Қоғамға қызмет және этика» тақырыбы арқылы бейбітшілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Отанға қызмет жауапкершілік, бейбіт өмірді бағалау және адамдардың қауіпсіздігіне қамқорлықпен байланысты. Батылдық — қауіпті сынаққа бару емес; кейде қауіпті ұсыныстан бас тартып, көмек шақыру. Сабақта әскери құрал не қауіпті жаттығу қолданылмайды. Бүгінгі назарымыз: «Қоғамға қызмет және этика». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды. Ойлану бағдары: Қауіпті әрекеттен бас тарту; қауіпсіз балама; жауапты ересекпен келісу. Іс-шараға тәуекелді кедергі жаттығуын қауіпсіздік бағасынсыз қосу ұсынылды. Бастамада тек күш талап ететін рөлдер жоспарланып, басқа қабілет ескерілмеді. Қоғамға қызмет мысалдары бір ғана топпен шектелді. Көрмеге шығу тегі белгісіз әскери зат әкелу ұсынылды. Қоғамдық жоба үшін адамның жеке қызмет мәліметін жариялау ұсынылды.", "path": "#/lesson/g09-t24"}, {"id": "g09-t25", "grade": 9, "topic": 25, "title": "Бірлікке кедергі болатын ақпарат", "direction": "Қазақстан халқының бірлігі", "icon": "◉", "search": "Бірлікке кедергі болатын ақпарат Қазақстан халқының бірлігі «Бірлікке кедергі болатын ақпарат» тақырыбы арқылы бірлік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Бірлік әр адамның қадірін сыйлап, ортақ іске тең қатысуына жағдай жасаудан басталады. Адамды тіліне, тегіне немесе сыртқы белгісіне қарап бағаламаймыз. Мәдени таныстыруда бір адамның тәжірибесін тұтас топқа телуге болмайды. Бүгінгі назарымыз: «Бірлікке кедергі болатын ақпарат». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды. Ойлану бағдары: Кемсітуді қолдамау; мазмұнын тыңдау; қажет болса қолжетімді тілдік көмек. Қоғамдық талқылауда тілдік ерекшелік адамның ұсынысын төмендетуге пайдаланылды. Жобаға қосылу тәртібі тек бұрынғы мүшелерге түсінікті. Мәдени шара барлық қатысушы бірдей дәстүрді ұстанады деп жоспарланды. Жобада аз ұсынылған топтардың қажеттілігі өлшенбеді. Манипуляциялық хабар бір оқиғаны тұтас қауымға телиді.", "path": "#/lesson/g09-t25"}, {"id": "g09-t26", "grade": 9, "topic": 26, "title": "Әлеуметтік жобадағы шынайы нәтиже", "direction": "Волонтерлік және қайырымдылық", "icon": "♡", "search": "Әлеуметтік жобадағы шынайы нәтиже Волонтерлік және қайырымдылық «Әлеуметтік жобадағы шынайы нәтиже» тақырыбы арқылы еріктілік мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Волонтерлік — ерікті пайдалы әрекет. Көмектің қажеттігін алдымен сұраған дұрыс. Адамның қадірі мен жеке мәліметі сақталуы керек. Оқушыдан ақша жинау, жеке жағдайын жариялау немесе қауіпті жұмыс істеу талап етілмейді. Бүгінгі назарымыз: «Әлеуметтік жобадағы шынайы нәтиже». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды. Ойлану бағдары: Көмектің қажет екенін сұрау; бас тартуды сыйлау. Жоба бенефициардың нақты сұранысынсыз ұйымдастырылды. Волонтерлік сағат үшін адамдардың ерікті таңдауы шектелді. Есепке адамның қиын жағдайын егжей-тегжейлі жазу ұсынылды. Жобаның қауіпсіздік жоспары жоқ, оқушыларға ересек жұмысы берілді. Жоба табысы тек жиналған қаржымен өлшенді.", "path": "#/lesson/g09-t26"}, {"id": "g09-t27", "grade": 9, "topic": 27, "title": "Оқу жүктемесін саналы жоспарлау", "direction": "Денсаулық және пайдалы әдеттер", "icon": "♧", "search": "Оқу жүктемесін саналы жоспарлау Денсаулық және пайдалы әдеттер «Оқу жүктемесін саналы жоспарлау» тақырыбы арқылы әдет мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Демалыс, күн тәртібі, қауіпсіз қозғалыс және қол гигиенасы күнделікті өзіне қамқорлықтың бөлігі. Әр адамның мүмкіндігі әртүрлі. Сабақта дене салмағы, диагноз немесе жеке денсаулық ақпараты сұралмайды. Денсаулық мәселесінде сенімді ересек пен медицина маманына жүгінеді. Бүгінгі назарымыз: «Оқу жүктемесін саналы жоспарлау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды. Ойлану бағдары: Қысқа қауіпсіз үзіліс; жүктеме мен демалысты үйлестіру. Емтихан жоспары демалыссыз құрылған, оны еңбекқорлық белгісі деп санайды. Оқу тобы түнгі уақытта міндетті жауап беруді талап етті. Белсенділік жоспары әркімнің мүмкіндігін ескермей, бәріне бірдей талап қойды. Дәлелсіз денсаулық кеңесі жарнамалық мүддесін жасырды. Жобаға қатысушы үзіліс сұраудан ұялады, топ нәтижені ғана күтеді.", "path": "#/lesson/g09-t27"}, {"id": "g09-t28", "grade": 9, "topic": 28, "title": "Көше ортасын қауіпсіз бағалау", "direction": "Жолдағы қауіпсіздік", "icon": "↔", "search": "Көше ортасын қауіпсіз бағалау Жолдағы қауіпсіздік «Көше ортасын қауіпсіз бағалау» тақырыбы арқылы өткел мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Жолда назарды қозғалысқа аударып, белгіленген жаяу жүргінші өткелі мен бағдаршам тәртібін сақтау керек. Жас бала жолды сенімді ересекпен өтеді. Қауіпсіздік тапсырмалары тек қағазда орындалады; көлік жолында тәжірибе жасалмайды. Бүгінгі назарымыз: «Көше ортасын қауіпсіз бағалау». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді. Ойлану бағдары: Белгіленген қауіпсіз өткелді таңдау; асықпау; кіші балаға ересек көмегі. Қысқа маршрут қауіпсіз өткелден айналып өтуге итермелейді. Топтық тапсырманы жол үстінде телефонмен орындау ұсынылды. Тұрақтағы көліктер жаяу жүргіншінің көру аймағын жауып тұр. Ұсынылған маршрутта жарық аз, қолжетімділік мәселесі бар. Мектеп маңындағы қауіп туралы тексерілген ұсыныс дайындау керек.", "path": "#/lesson/g09-t28"}, {"id": "g09-t29", "grade": 9, "topic": 29, "title": "Келісімнің еріктілігін түсіну", "direction": "Жеке шекара және өзара құрмет", "icon": "☂", "search": "Келісімнің еріктілігін түсіну Жеке шекара және өзара құрмет «Келісімнің еріктілігін түсіну» тақырыбы арқылы шекара мәнін күнделікті әрекетпен байланыстырып, жасына сай қауіпсіз және сыйластыққа негізделген шешім ұсыну. Әр адам өзінің затына, кеңістігіне және жеке ақпаратына қатысты шекарасын айта алады. Келісім ерікті болуы керек және оны өзгертуге болады. «Жоқ» деген жауапты сыйлаймыз. Қорқыныш не қысым болса, сенімді ересекке айтамыз. Бүгінгі назарымыз: «Келісімнің еріктілігін түсіну». Дәлелді шешім белгілі фактіні пікірден ажыратуға сүйенеді. Ақпарат жетпесе, жорамалдың шегін ашық айтамыз. Құқықтық, медициналық немесе қаржылық тұжырымда маман мен ресми дерекке жүгіну қажет. Өмірлік мысал: Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады. Ойлану бағдары: Рұқсатсыз алмау; жеке деректі ашпау; шекараны анық айту. Топ тиімділік үшін адамның жеке аккаунтына қолжетімділік сұрады. Бұрын берген жариялау келісімін қатысушы кейін өзгертті. Беделді қатысушы бас тартқан адамды мүмкіндіктен айырамын деп қысым жасады. Ортақ жобада байланыс уақыты мен жеке кеңістік келісілмеген. Қысым көрген адам құпиялық уәдесі үшін көмекке жүгінбей жүр.", "path": "#/lesson/g09-t29"}, {"id": "g09-t30", "grade": 9, "topic": 30, "title": "Дереккөздің сенімділігін бағалау", "direction": "М function initializeTarbie(){

(() => {

function status(id){return (marks.favorites.includes(id)?'★ ':'')+(marks.viewed.includes(id)?'✓ Қаралған':'');}
function updateCardStatus(){$$('[data-status]').forEach(e=>e.textContent=status(e.dataset.status));}
function download(name,text){const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
if(page==='home'||page==='grade'){
const search=$('#search'),grade=$('#grade-filter'),direction=$('#direction-filter'),view=$('#view-filter');let pageIndex=0;const pageSize=18;
if(page==='grade'){grade.value=body.dataset.grade;grade.disabled=true;}
const params=new URLSearchParams(window.SINGLE_QUERY||'');if(params.get('view')==='favorites')view.value='favorites';
function matches(x){const q=search.value.trim().toLocaleLowerCase('kk');return (!q||x.search.toLocaleLowerCase('kk').includes(q))&&(!grade.value||x.grade===Number(grade.value))&&(!direction.value||x.direction===direction.value)&&(view.value==='all'||view.value==='favorites'&&marks.favorites.includes(x.id)||view.value==='viewed'&&marks.viewed.includes(x.id)||view.value==='new'&&!marks.viewed.includes(x.id));}

if(page==='grade'){const ids=new Set(found.map(x=>x.id));$$('#class-results .topic-card').forEach(e=>e.hidden=!ids.has(e.dataset.id));$('#class-empty').hidden=found.length>0;updateCardStatus();return;}
const total=Math.max(1,Math.ceil(found.length/pageSize));pageIndex=Math.min(pageIndex,total-1);const shown=found.slice(pageIndex*pageSize,(pageIndex+1)*pageSize);
$('#catalog-results').innerHTML=shown.length?shown.map(x=>`<a class="topic-card" href="${root}${x.path}"><div class="card-top"><span class="topic-icon" aria-hidden="true">${x.icon}</span><span class="tag">${x.grade}-сынып</span><span class="card-status">${status(x.id)}</span></div><span class="direction-label">${esc(x.direction)}</span><h3>${esc(x.title)}</h3><p>5 жағдаят · жұптық · топтық · 5 сұрақ · кері байланыс</p><span class="read-link">Сабақты ашу →</span></a>`).join(''):'<p class="empty">Материал табылмады. Іздеу сөзін немесе сүзгіні өзгертіңіз. Таңдаулыға сабақ ішіндегі ☆ батырмасымен қосуға болады.</p>';
$('#pagination').innerHTML=found.length?`<button id="prev-page" type="button" ${pageIndex===0?'disabled':''}>← Алдыңғы</button><span class="muted">${pageIndex+1} / ${total}</span><button id="next-page" type="button" ${pageIndex>=total-1?'disabled':''}>Келесі →</button>`:'';
if($('#prev-page'))$('#prev-page').onclick=()=>{pageIndex--;render();};if($('#next-page'))$('#next-page').onclick=()=>{pageIndex++;render();};}
[search,grade,direction,view].forEach(e=>e.addEventListener(e===search?'input':'change',()=>{pageIndex=0;render();}));
$('#reset-filter').onclick=()=>{search.value='';grade.value=page==='grade'?body.dataset.grade:'';direction.value='';view.value='all';pageIndex=0;render();};
if($('#clear-marks'))$('#clear-marks').onclick=()=>{marks={favorites:[],viewed:[]};saveMarks();render();toast('Таңдаулы мен қаралған белгілер тазаланды.');};render();
}
if(page==='lesson'){
const id=body.dataset.lesson;const tabs=$$('[role=tab]'),panels=$$('.tab-panel');
function activate(key,focus=false){const target=tabs.find(t=>t.dataset.tab===key)||tabs[0];tabs.forEach(t=>{const active=t===target;t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;});panels.forEach(p=>p.hidden=p.id!==target.getAttribute('aria-controls'));if(focus)target.focus();}
tabs.forEach((tab,i)=>{tab.onclick=()=>{activate(tab.dataset.tab);window.setSingleTab(tab.dataset.tab);};tab.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();activate(tabs[n].dataset.tab,true);window.setSingleTab(tabs[n].dataset.tab);};});activate(window.SINGLE_TAB||'intro');
function updateMarks(){const fav=marks.favorites.includes(id),seen=marks.viewed.includes(id);$('#favorite').textContent=fav?'★ Таңдаулыдан алу':'☆ Таңдаулыға қосу';$('#favorite').setAttribute('aria-pressed',String(fav));$('#mark-viewed').textContent=seen?'✓ Қаралған белгісін алу':'○ Қаралды деп белгілеу';$('#mark-viewed').setAttribute('aria-pressed',String(seen));}
$('#favorite').onclick=()=>{marks.favorites=marks.favorites.includes(id)?marks.favorites.filter(x=>x!==id):[...marks.favorites,id];saveMarks();updateMarks();};$('#mark-viewed').onclick=()=>{marks.viewed=marks.viewed.includes(id)?marks.viewed.filter(x=>x!==id):[...marks.viewed,id];saveMarks();updateMarks();};updateMarks();
$$('.quiz-option').forEach(button=>button.onclick=()=>{const box=button.closest('.quiz');box.querySelectorAll('.quiz-option').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const correct=Number(button.dataset.option)===Number(box.dataset.correct),result=box.querySelector('.quiz-result');result.hidden=false;result.textContent=(correct?'Орынды жауап. ':'Бұл таңдауды қайта қара. ')+result.dataset.explanation;});
let responses=[];const form=$('#feedback-form');function showFeedback(){$('#feedback-count').textContent=responses.length+' анонимді жауап тіркелді.';const ratings=['Түсіндім','Жаттығамын','Көмек керек'];$('#feedback-tally').innerHTML='<div class="tally">'+ratings.map(r=>`<span>${r}: <b>${responses.filter(x=>x.confidence===r).length}</b></span>`).join('')+'</div>';$('#feedback-list').innerHTML=responses.length?responses.map((r,i)=>`<section class="feedback-response"><strong>Жауап ${i+1} · ${esc(r.confidence)}</strong>${r.answers.map((a,n)=>`<p><b>${n+1}.</b> ${esc(a||'Ауызша жауап / мәтін енгізілмеген')}</p>`).join('')}</section>`).join(''):'<p class="muted">Әзірге жауап жоқ.</p>';}
form.addEventListener('submit',event=>{event.preventDefault();const selected=form.querySelector('input[name=confidence]:checked');if(!selected){toast('Алдымен өзіндік бағалау белгісін таңдаңыз.');return;}responses.push({confidence:selected.value,answers:[0,1,2].map(i=>$('#reflection-'+i).value.trim())});form.reset();showFeedback();toast('Анонимді жауап тіркелді. Келесі оқушы жауап бере алады.');});
$('#export-feedback').onclick=()=>{if(!responses.length){toast('Әзірге жауап жоқ.');return;}const title=$('.lesson-head h1').textContent;const text=title+'\nАнонимді кері байланыс\nЖауап саны: '+responses.length+'\n\n'+responses.map((r,i)=>'Жауап '+(i+1)+' · '+r.confidence+'\n'+r.answers.map((a,n)=>(n+1)+'. '+(a||'Ауызша жауап / мәтін жоқ')).join('\n')).join('\n\n');download(id+'-keri-bailanys.txt',text);toast('Кері байланыс файлы жүктеуге дайын.');};

$('#print-lesson').onclick=()=>{printDraft();window.print();};window.onbeforeprint=printDraft;showFeedback();
}
})();

}
