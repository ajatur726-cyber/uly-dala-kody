 кезіндегі қауіпсіз әрекет<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-7/lesson-07.html\"><h2>7. Қауіпті заттар мен әрекеттерден сақтану 274 «Қауіпсіздік сабақтарын» өткізу жөніндегі әдістемелік ұсынымдар<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-7/lesson-08.html\"><h2>8. Дипфейк пен цифрлық алаяқтықтан сақтану<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-7/lesson-09.html\"><h2>9. Жас ерекшелігіне байланысты шектеулер және қауіпсіздік<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-7/lesson-10.html\"><h2>10. Менің денем – менің жеке шекарам<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-7/lesson-11.html\"><h2>11. Жасөспірімнің жолдағы қауіпсіздігі: велосипед, самокат, скейтборд<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-7/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 255-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=255\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ        Төтенше жағдайлар қызметтері мен байланыс\n              орталығының телефон нөмірлері\nМақсаты         Білім алушыларда қауіпті және қиын өмірлік\n              жағдайларда көмекке дұрыс жүгіну дағдыларын\n              қалыптастыру\n\nМіндеттері:        - Қазақстан       Республикасындағы     төтенше\n                 қызметтердің негізгі нөмірлері мен байланыс\n                 орталығы туралы білімді бекіту;\n                   - қандай жағдайда тиісті қызметке жүгіну\n                 керектігін және көмек шақырғанда қандай ақпарат\n                 беру қажет екенін үйрету;\n                   - шұғыл көмек нөмірлерін жауапкершілікпен\n                 пайдалануға және қажет болған жағдайда дер кезінде\n                 көмек сұрауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Шұғыл көмек шақыру алгоритмі» жаднамасы; төтенше\nқызметтердің және 111 байланыс орталығының нөмірлері көрсетілген\nжаднама.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      1. Проблемалық жағдаят «Қалай әрекет ету керек?»\n      Педагог білім алушыларға мынадай жағдайды елестетуді\nұсынады.\n      -      Серуендеп жүргенде жаныңыздағы адамның кенеттен\nжағдайы нашарлады. Айналада адамдар бар, бірақ ешкім не істеу\nкерегін білмейді. Ал сіздің қолыңызда ұялы телефон бар.\n      Педагогтің сұрақтары:\n      Қай нөмірге қоңырау шалу керек?\n      Неліктен уақыт жоғалтпау маңызды?\n      Қайда хабарласу керегін білмесең, қандай жағдай орын алуы\nмүмкін?\n      Білім алушылар өз болжамдарын айтады.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады:\n      https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2FeoT00B3\ngyDuskOvkalEx7TmU&amp;index=28\n       Педагогтің қорытындысы:\n       – Төтенше жағдайда қандай көмек қажет екенін жылдам анықтап,\nтиісті қызметке дер кезінде хабарласу маңызды.\n       II. Негізгі бөлім\n       Педагог білім алушыларға «Көмек шақыру алгоритмі»\nжаднамасын ұсынады.\n       Көмек шақыру алгоритмі\n             1.     Сабыр сақта.\n             2.     Тиісті қызметке қоңырау шал.\n\n            3.   Оқиға болған орынды нақты айт.\n            4.   Не болғанын қысқаша түсіндір.\n            5.   Диспетчердің сұрақтарына жауап бер.\n            6.   Диспетчерден бұрын тұтқаны қойма.\n     «Қайда жүгіну керек?» жаттығуы\n     Педагог білім алушыларға әр жағдаятта қай қызметке жүгіну\nкеректігін анықтауды ұсынады.\n\n     Жағдаят                       Жауап\nПәтерден қою түтін шығып      101 немесе 112\nжатыр\nКөшеде адам есінен танып      103 немесе 112\nқалды\nТөбелестің куәсі болдың       102 немесе 112\nГаздың иісін сездің           104 немесе 112\nЖасөспірім буллингке          111 байланыс орталығы, мектеп\nұшырап жүр, қатты             психологі, сынып жетекшісі, ата-ана\nмазасызданып,                 немесе өзі сенетін басқа ересек адам,\nпсихологиялық көмек алу       Балалардың құқықтарын қорғау\nүшін кімге жүгінерін          басқармасы, Психологиялық қолдау\nбілмейді                      орталығы\n\n      111 байланыс орталығы – қиын жағдайға тап болған балалар\nмен жасөспірімдерге көмек көрсететін бірыңғай мемлекеттік байланыс\nорталығы. Мұнда буллинг, кибербуллинг, зорлық-зомбылық,\nқұқықтың бұзылуы және басқа да мәселелер бойынша кеңес пен көмек\nалуға болады. 111 нөміріне тәулік бойы тегін хабарласуға болады.\n      Егер сенің құқығың бұзылса, біреу қорқытса немесе өзің шеше\nалмайтын қиын жағдайға тап болсаң, бұл мәселені жалғыз шешуге\nтырыспа. Ата-анаңа, педагогке, мектеп психологіне немесе өзің сенетін\nересек адамға айт. Қажет болған жағдайда 111 байланыс орталығына,\nөңірдегі балалардың құқықтарын қорғау жөніндегі органға немесе Бала\nқұқықтары жөніндегі уәкілге жүгінуге болады.\n      Педагог білім алушыларға өз өңірінде көмек көрсететін ұйымдар\nмен олардың байланыс деректерін таныстырады.\n      III. Қорытынды бөлім\n      Қорытындылау және рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n      Бүгін мен ... білдім.\n      Енді мен 112 нөмірі ... үшін қажет екенін білемін.\n\n     Егер маған немесе досыма психологиялық не әлеуметтік көмек\nқажет болса, мен ... жүгіне аламын.\n     Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n\n\n\n\nБіріккен Ұлттар Ұйымының Балалар\nқоры (ЮНИСЕФ) материалдары\nнегізінде әзірленген қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2FeoT00B3\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=glwBLiDftak&amp;list=PLA5eCSY2FeoT00B3<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 1-сабақ — Ұлы дала коды"}, "grade-7/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Қысым мен мәжбүрлеу кезінде қауіпсіз әрекет ету<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 259-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=259\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ             Қысым мен мәжбүрлеу кезінде қауіпсіз әрекет\n               ету\nМақсаты             Білім алушыларда психологиялық қысым,\n               мәжбүрлеу және манипуляция жағдайларында\n               қауіпсіз әрекет ету дағдыларын қалыптастыру\nМіндеттері:       - білім       алушыларды      мәжбүрлеу   мен\n               манипуляция белгілерімен таныстыру;\n                  - психологиялық қысым жағдайларын ажырата\n               білу және қауіпті ұсыныстардан нық бас тарту\n               дағдыларын дамыту;\n                  - жеке      шекарасын    қорғай   білуге және\n               психологиялық қысым, мәжбүрлеу немесе қорқыту\n               жағдайында көмек сұрауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Қалай қауіпсіз бас тартуға болады?» жаднамасы; сенімді\nересектердің байланыс деректері және 111 байланыс орталығының\nнөмірі көрсетілген жадынама.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Проблемалық жағдаят «Сен не істер едің?».\n      Педагог білім алушыларға мынадай жағдаят ұсынады.\n      -      Сабақтан кейін бір топ жасөспірім сыныптасын қараусыз\nқалған ғимаратқа бірге баруға шақырады. Ол бас тартқаннан кейін:\n       «Бармайтын болсаң, қорқақ болғаның»;\n       «Бәрі келісті, жалғыз сен ғана бас тартып тұрсың»;\n       «Неге артқа тарта бересің?», – дейді.\n      Педагог:\n            Мұндай жағдайда адам өзін қалай сезінуі мүмкін?\n            Бұл сөздерді қысым көрсету тәсілі деп санауға бола ма?\nНеліктен?\n            Кейде неліктен «жоқ» деп айту қиын?\n      Білім алушылар өз пікірлерін айтады.\n      Педагогтің қорытындысы:\n      – Егер біреуді өзі қаламайтын әрекетке қорқыту, келемеждеу\nнемесе кінәлі сезіндіру арқылы мәжбүрлеуге тырысса, бұл\nпсихологиялық қысым болып саналады.\n      II. Негізгі бөлім\n      «Айла-тәсілді таны» жаттығуы\n      Педагог       манипуляциялық       сипаттағы     сөйлемдермен\nтаныстырады.\n\n       «Егер шын дос болсаң, келісесің».\n       «Мұны бәрі істейді».\n       «Ешкімге айтпа, әйтпесе қиындық болады».\n       «Егер бұл саған ұнамаса, бас тартуыңа болады».\n      Педагог білім алушыларды психологиялық қысымның негізгі\nбелгілерімен таныстырады:\n       шешімді тез қабылдауға мәжбүрлейді;\n       достықты тоқтатумен немесе беделіңе нұқсан келтірумен\nқорқытады;\n       қауіпті әрекет үшін сыйақы уәде етеді;\n       болған жағдайды құпия сақтауды талап етеді;\n       бас тартқаның үшін өзіңді кінәлі сезіндіруге тырысады.\n      Практикалық жаттығу. «Нық бас тарту»\n      Педагог білім алушыларға жұппен жұмыс істеуді ұсынады.\n      Тапсырма: бір білім алушы қауіпті әрекет жасауды ұсынады,\nекіншісі сабырлы әрі нық түрде бас тартады.\n      Бас тартудың қарапайым жолдары:\n      «Жоқ, мен мұны істемеймін».\n      «Маған бұл әрекет ұнамайды».\n      «Бұл – қауіпті».\n      «Мен кетемін».\n      Жаттығудан кейін педагог мына сұрақтарды талқылайды:\n           Қай жауаптар неғұрлым нық әрі сенімді естілді?\n           Неліктен сабырлы сөйлеу және өз шешімің үшін ақталмау\nмаңызды?\n      Педагог\n      – Әр адамның қорқыныш, күмән немесе қауіп сезімін тудыратын\nкез келген ұсыныстан бас тартуға құқығы бар.\n      Шағын кейс. «Кімнен көмек сұрауға болады?»\n      Педагог жағдаят ұсынады.\n      Жетінші сынып оқушысынан үнемі ақша талап етеді. Ақша\nбермесе, оның сырын басқаларға айтып қоямыз деп қорқытып, бұл\nтуралы ешкімге айтпауын талап етеді.\n      Педагогтің сұрақтары:\n          Жасөспірім не істеуі керек?\n          Ол кімнен көмек сұрай алады?\n          Білім алушылар өз жауаптарын ұсынады.\n      Педагог толықтырады:\n           ата-анасына немесе өзі сенетін басқа ересек адамға;\n           сынып жетекшісіне;\n\n           мектеп психологіне;\n           мектеп әкімшілігіне;\n           111 байланыс орталығына;\n           Балалардың құқықтарын қорғау басқармасына;\n           Психологиялық қолдау орталығына;\n           Бала құқықтары жөніндегі уәкілге.\n      Педагог түсіндіреді:\n      Кейде адам басынан өтіп жатқан жағдайды ата-анасына да,\nпедагогке де, психологке де, тіпті жақын досына да бірден айта алмауы\nмүмкін. Не істерін білмей, алдымен біреудің ақыл-кеңесін тыңдағысы\nкелетін кездер де болады.\n      Осындай жағдайда 111 байланыс орталығына хабарласуға\nболады. Мұнда сені тыңдап, жағдайды түсінуге және әрі қарай не\nістеуге болатынын анықтауға көмектеседі. Буллинг, қорқыту, зорлық-\nзомбылық, мәжбүрлеу немесе басқа да қиын жағдайлар бойынша кеңес\nалуға болады. 111 нөміріне хабарласу тегін.\n      Ең бастысы – қиындықпен жалғыз қалмау. Кейде көмек сұраудың\nөзі дұрыс шешімге бастайтын алғашқы қадам болады.\n      Қажет болған жағдайда Балалардың құқықтарын қорғау\nбасқармасына, Психологиялық қолдау орталығына немесе Бала\nқұқықтары жөніндегі уәкілге де жүгінуге болады.\n      Педагог білім алушыларға өз өңірінде көмек көрсететін\nұйымдардың байланыс деректерін таныстырады.\n      Педагог білім алушыларға тақырыптық постермен\nтанысуды ұсынады:\n       https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us\np=sharing\n     III. Қорытынды бөлім\n     – Әр адамның қауіпті ұсыныстан бас тартуға құқығы бар. «Жоқ»\nдеп нық айта білу және дер кезінде көмек сұрау қауіпсіздікті,\nденсаулықты және адамның өзіндік қадір-қасиетін сақтауға\nкөмектеседі.\n     «Егер сені мәжбүрлесе» жаднамасы\n         тоқта және қысыммен шешім қабылдама;\n         сабырлы әрі нық түрде «жоқ» деп айт;\n         қауіпті жағдай орын алған жерден кет;\n         өзің сенетін ересек адамға айт;\n         қажет болса, 111 байланыс орталығына не 102-ге\n           хабарлас.<\/div><p><a href=\"https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/12RshJ_Gze3ts571j0LC5DPiGbtqI5p0p/view?us<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 2-сабақ — Ұлы дала коды"}, "grade-7/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Буллинг кезіндегі әрекет және көмекке жүгіну тәртібі<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 262-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=262\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ       Буллинг кезіндегі әрекет және көмекке жүгіну\n           тәртібі\nМақсаты        Білім алушылардың буллинг жағдайында өзін\n           қауіпсіз ұстау, дұрыс әрекет ету және қажет кезде көмек\n           сұрау дағдысын қалыптастыру.\n\nМіндеттері:        – буллинг жағдайында не істеу керектігі туралы\n               білімдерін бекіту;\n                   – қауіп төнген кезде дұрыс шешім қабылдап,\n               сенімді адамнан көмек сұрай білуге үйрету;\n                   – біреудің буллингке ұшырағанын көргенде бейжай\n               қалмай, оған қолдау көрсетуге баулу.\n\n      Материалдар мен ресурстар\n      Жағдаяттар жазылған карточкалар, тақта немесе экран.\n      I. Кіріспе бөлім\n      Педагог:\n      – Сендер буллингтің не екенін және оның жай ғана ренжісуден\nнемесе жанжалдан айырмашылығын білесіңдер. Бүгін буллингке тап\nболғанда не істеу керек және кімнен көмек сұрауға болады деген\nсұрақтарды талқылаймыз.\n      Қалай ойлайсыңдар, кейде оқушы буллинг жағдайында өзіне\nқиын болса да, көмек сұрай алмайды. Оның себебі неде деп\nойлайсыңдар?\n      Білім алушылар өз ойларын айтады.\n      Педагог:\n      – Кейде адам қорыққаннан, ұялғаннан немесе қорқытқандықтан\nболған жағдайды ешкімге айта алмай жүреді. Бірақ болған жағдайды\nіште сақтап жүру мәселені шешпейді. Сондықтан мұндай кезде кімге\nайтуға болатынын және қандай әрекет жасау керектігін білу маңызды.\n      II. Негізгі бөлім\n      1. «Не істер едің?» жаттығуы\n      Педагог жағдаяттарды оқиды. Білім алушылар әр жағдайда қалай\nәрекет ету керектігін айтады.\n      1-жағдаят\n      Сені қайта-қайта ренжітіп жүр. Ал ренжіткендер бұл туралы\nешкімге айтпауыңды талап етеді.\n      Жауап: болған жағдайды жасырмай, өзің сенетін ересек адамға\nайту. 111 байланыс орталығына хабарласып, мәселең бойынша кеңес\nалу.\n      2-жағдаят\n      Сен болған жағдайды ересек адамға айттың, бірақ ештеңе\nөзгермеді.\n      Жауап: басқа сенімді ересек адамнан көмек сұрау. Мысалы,\nсынып жетекшісіне, мектеп психологіне немесе мектеп әкімшілігіне\nайтуға болады. 111 байланыс орталығына хабарласып, мәселең\nбойынша кеңес алу.\n\n      3-жағдаят\n      Бір топ оқушы сыныптасыңды күнде мазақтап, кемсітіп жүр.\n      Жауап: оларға қосылмау, сыныптасыңа қолдау көрсету және\nболған жағдайды ересек адамға айту. 111 байланыс орталығына\nхабарласып, мәселең бойынша кеңес алу.\n      4-жағдаят\n      Біреу сені әдейі төбелеске шақырып, арандатып жүр.\n      Жауап: төбелеске бармау, қауіпті жерден кету және ересек\nадамнан көмек сұрау. 111 байланыс орталығына хабарласып, мәселең\nбойынша кеңес алу.\n      5-жағдаят\n      Біреу саған: «Айтып қойсаң, жағдайың одан да қиындайды», –\nдеп қорқытты.\n      Жауап: қорқытуға көнбей, бұл туралы мүмкіндігінше тезірек\nсенетін ересек адамға айту. 111 байланыс орталығына хабарласып,\nмәселең бойынша кеңес алу.\n      Педагог қорытындылайды:\n      – Буллингке тап болғанда бәрін жалғыз шешуге тырыспау керек.\nКөмек сұрау – дұрыс әрекет.\n      Есте сақта\n      Агрессияға агрессиямен жауап берме – қауіпті жерден кет –\nболған жағдайды айт – көмек сұра – жағдай өзгермесе, басқа ересек\nадамға қайта айт.\n      2. Кімнен көмек сұрауға болады?\n      Педагог:\n      – Мектепте сынып жетекшісінен, мұғалімнен, мектеп\nпсихологінен, әлеуметтік педагогтен немесе мектеп әкімшілігінен\nкөмек сұрауға болады.\n      – Үйде ата-анаңа, қамқоршыңа немесе өзің сенетін басқа ересек\nадамға айт.\n      – Қосымша көмек қажет болса, Психологиялық қолдау\nорталығына немесе 111 нөміріне хабарласуға болады.\n      – Егер өміріңе немесе денсаулығыңа қауіп төніп тұрса, дереу\nересек адамды шақырып, шұғыл көмекке жүгіну қажет.\n      3. Егер буллинг оқиғасының куәсі болсаң\n      Педагог:\n      – Буллинг жағдайының куәгері болсаң, агрессорды қолдама.\n      Мұндай кезде:\n      – жәбірлеуші адамдарға қосылма;\n      – күлме, келемеждеме, қолпаштама;\n\n      – болған жағдайды қызық көріп видеоға түсірме және оны\nөзгелерге таратпа;\n      – жәбір көрген адамға қолдау көрсет;\n      – болған жағдайды сенім артатын ересек адамға, мектеп\nпсихологіне айт;\n      – жағдай қауіпті болса, өзің араласпай, ересек адамды көмекке\nшақыр.\n      III. Қорытынды бөлім\n      «Мен не істеймін?» рефлексиясы\n      Білім алушылар сөйлемдерді жалғастырады:\n      – Егер мені қайта-қайта ренжітсе мен ...\n      – Егер біреуді жәбірлеп жатқанын көрсем, мен ...\n      – Мектепте көмек керек болса, мен ... айтамын.\n      – Егер бірінші айтқан адам көмектеспесе, мен ...\n      – Қосымша көмек қажет болса, мен ...\n      Педагог қорытындылайды:\n      – Буллинг жағдайында үндемей қалуға болмайды. Егер өзің\nнемесе басқа біреу осындай жағдайға тап болса, қарсы агрессиямен\nнемесе физикалық күшті қолданып жауап берме. Қауіпті жерден кетіп,\nболған жағдайды сенетін ересек адамға айт. Егер бір адамнан көмек\nболмаса, басқа ересек адамға қайта айт. Ең бастысы – жалғыз қалмай,\nкөмек сұрау.\n      Сабақтың басты ережесі:\n      «Үндемей қалма – қарсы агрессия танытпа – сенетін ересек\nадамға айт – көмек сұра».\n\n\n\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 3-сабақ — Ұлы дала коды"}, "grade-7/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Кибербуллингке қарсы қауіпсіз әрекет 265 «Қауіпсіздік сабақтарын» өткізу жөніндегі әдістемелік ұсынымдар<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 265-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=265\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ           Кибербуллингке қарсы қауіпсіз әрекет\n\n Мақсаты             Білім алушыларда кибербуллингке тап болған\n                  жағдайда    қауіпсіз   әрекет   ету    дағдыларын\n                  қалыптастыру.\n Міндеттері:         - білім       алушыларды       кибербуллингтің\n                  белгілерімен және ерекшеліктерімен таныстыру.\n                     - цифрлық ортада қауіпсіз әрекет ету және жеке\n                  деректерді қорғау дағдыларын дамыту.\n                     - жауапкершілікпен әрекет етуге, өзгелермен\n                  құрметке негізделген қарым-қатынас жасауға және\n                  қажет болған жағдайда көмек сұрауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Тоқта – сақта – бұғатта – хабарла» алгоритмі, «Кибербуллинг\nкезінде қалай әрекет ету керек?» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Әзіл не кибербуллинг» жағдаяты\n      Педагог білім алушыларға мынадай жағдаят ұсынады.\n      Білім алушы әлеуметтік желіге фотосуретін жариялағаннан\nкейін, оның астына келемеждейтін пікірлер жазыла бастады.\nФотосуретті басқа чаттарға таратып, жалған аккаунттан қорлайтын\nхабарламалар жібереді.\n      Педагогтің сұрақтары:\n            Бұл әзіл ме, әлде кибербуллинг пе?\n            Неліктен мұндай жағдай тез арада күрделі мәселеге\nайналуы мүмкін?\n      Білім алушылар өз пікірлерін айтады.\n      Педагог білім алушыларға тақырыптық бейнематериалмен\nтанысуды ұсынады:\n       https://drive.google.com/file/d/1P2jq6pUVs8J0Ogc1DvelgJ2piyedvJyx/view?us\np=sharing\n      Педагогтің қорытындысы\n      – Кибербуллинг цифрлық ортада тез таралуы, тәулік бойы\nжалғасуы және жасөспірімнің психологиялық жағдайына елеулі зиян\nкелтіруі мүмкін.\n      II. Негізгі бөлім\n      «Қалай қауіпсіз әрекет ету керек?» жаттығуы\n      Педагог      білім алушыларға     берілген  жағдаяттардың\nкибербуллингке жататынын немесе жатпайтынын анықтап, қауіпсіз\nәрекет ету жолын таңдауды ұсынады.\n\n      1-жағдаят\n      Жасөспірімге бірнеше күн бойы үнемі қорлайтын хабарламалар\nжіберіледі.\n      2-жағдаят\n      Жасөспірімнің келісімінсіз оның фотосуреті әлеуметтік желіде\nжарияланып, астына кемсітетін пікірлер жазылған.\n      3-жағдаят\n      Белгісіз пайдаланушы жасөспірімді қорқытып, жариялаған\nжазбасын өшіруді талап етеді.\n      Педагогтің сұрақтары:\n           Неліктен бұл жағдайларды кибербуллингке жатқызуға\nболады?\n           Қандай әрекеттер өзіңді қорғауға көмектеседі?\n           Кімнен көмек сұрауға болады?\n      Талқылаудан кейін педагог қорытынды жасайды.\n      Кибербуллинг – цифрлық технологияларды пайдалану арқылы\nадамды кемсітуге, қорқытуға немесе оған зиян келтіруге бағытталған\nқасақана және қайталанатын әрекеттер. Ол қорлау, жалған ақпарат\nтарату, адамның келісімінсіз материалдар жариялау, жалған аккаунттар\nашу, қорқыту немесе бопсалау түрінде көрінуі мүмкін.\n      Педагог білім алушылардың назарын аударады:\n      – «Заң және тәртіп» қағидатын сақтау – шынайы өмірде де,\nцифрлық ортада да басқа адамдардың құқықтарын құрметтеуді\nбілдіреді. Интернетте адамды қорлау, қорқыту, оның фотосуреттерін\nкелісімінсіз тарату және жәбірлеу заңда көзделген жауаптылыққа\nәкелуі мүмкін.\n      Қазақстан Республикасында кәмелетке толмаған адамды\nжәбірлеу, соның ішінде буллинг пен кибербуллинг құқық бұзушылық\nболып табылады. Қазақстан Республикасының Әкімшілік құқық\nбұзушылық туралы кодексінің 127-2-бабында мұндай әрекеттер үшін\nескерту жасау немесе әкімшілік айыппұл салу көзделген. Егер осы\nқұқық бұзушылықты 12 жастан 16 жасқа дейінгі кәмелетке толмаған\nадам жасаса, заңда белгіленген тәртіппен оның ата-анасына немесе\nзаңды өкілдеріне қатысты жауаптылық көзделеді.\n      Қауіпсіз әрекет ету алгоритмі\n      Егер интернетте кибербуллингке, қорқытуға немесе жәбірлеуге\nтап болсаң, бұл жағдаймен жалғыз қалма.\n      Қорлайтын хабарламаларға, қоқан-лоқыларға және арандатуға\nжауап берме.\n      Хабарламаларды, фотосуреттерді, скриншоттарды және басқа да\nматериалдарды дәлел ретінде сақта.\n\n      Сені жәбірлеген пайдаланушыны бұғаттап, платформа\nәкімшілігіне шағымдан.\n      Болған жағдайды ата-анаңа немесе өзің сенетін басқа ересек\nадамға айт.\n      Сынып жетекшісіне немесе мектеп психологіне жүгін.\n      Қажет болған жағдайда өз өңіріңдегі Психологиялық қолдау\nорталығынан көмек ал.\n      Психологиялық көмек және кеңес алу үшін 111 байланыс\nорталығына хабарлас.\n      Егер кибербуллинг қорқытумен, бопсалаумен немесе басқа да\nқұқыққа қайшы әрекеттермен қатар жүрсе, полицияның 102 нөміріне\nқоңырау шал.\n      Педагог:\n      – Кибербуллингті жасыруға болмайды. Ересектер мен\nмамандарға дер кезінде жүгіну өзіңді қорғауға және қажетті қолдау\nалуға көмектеседі.\n      (Педагог білім алушыларға өз өңіріндегі Психологиялық қолдау\nорталығының телефон нөмірі мен байланыс деректерін ұсынады).\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n      Егер мен кибербуллингке тап болсам, ең алдымен...\n      Егер мен кибербуллингтің куәсі болсам, ...\n      Көмек қажет болса, мен ... жүгіне аламын.\n      Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n      Сабақтың қорытындысы\n      Кибербуллингті елемеуге немесе жасыруға болмайды. Сабыр\nсақтап, дер кезінде әрекет ету, дәлелдерді сақтау және көмек сұрау\nөзіңді қорғауға әрі кибербуллингті тоқтатуға көмектеседі.\n\n\n\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1P2jq6pUVs8J0Ogc1DvelgJ2piyedvJyx/view?us\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1P2jq6pUVs8J0Ogc1DvelgJ2piyedvJyx/view?us<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 4-сабақ — Ұлы дала коды"}, "grade-7/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Қауіпті жағдайдың куәсі болсаң, не істеу керек? 268 «Қауіпсіздік сабақтарын» өткізу жөніндегі әдістемелік ұсынымдар<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 268-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=268\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№5 сабақ          Қауіпті жағдайдың куәсі болсаң, не істеу\n               керек?\n\nМақсаты             Білім алушылардың қауіпті жағдайға куә болған\n                кезде дұрыс әрі қауіпсіз әрекет ету дағдыларын\n                қалыптастыру.\nМіндеті             - қауіпті жағдайға куә болғанда әрекет ету\n                тәртібін меңгерту;\n                    - жағдайды бағалап, көмек көрсетудің қауіпсіз\n                жолын таңдай білуге үйрету;\n                    - жауапкершілікке, жанашырлық танытуға және\n                дер кезінде көмек сұрауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Қауіпті жағдайға куә болғанда қалай әрекет ету керек?»\nжаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Проблемалық жағдаят\n      Педагог жағдаятты ұсынады:\n      Үзіліс кезінде екі оқушының арасында жанжал туындайды.\nҚастарында тұрған балалардың бірі болған жағдайды телефонға түсіріп\nжатыр, екіншісі күліп тұр, ал қалғандары сырттай бақылап тұр.\n      Педагог сұрайды:\n      – Бұл жағдайда қандай қауіп бар?\n      – Қауіпті жағдайға әрдайым өзің араласу керек пе?\n      – Өз басыңды қауіпке тікпей, қалай көмектесуге болады?\n      Білім алушылар өз ойларын ортаға салады.\n      Педагог:\n      – Кез келген адам қауіпті жағдайға куә болуы мүмкін. Мұндай\nкезде көмектескің келетіні түсінікті. Бірақ ең алдымен өзіңнің және\nайналадағы адамдардың қауіпсіздігін ойлау керек.\n      II. Негізгі бөлім\n      «Қалай қауіпсіз әрекет етуге болады?» шағын жаттығуы\n      Педагог білім алушыларға жағдаяттарды ұсынады:\n      – мектеп ауласында екі оқушы төбелесіп жатыр, ал\nайналасындағылардың кейбірі ересектерге хабарлау орнына телефонға\nтүсіріп тұр;\n      – дүкен маңында бірнеше жасөспірім бір баланы қоршап алып,\nақшасын беруді талап етіп жатыр;\n      – аулада қоқыс жәшігі өртеніп, оған жақын жерде балалар ойнап\nжүр.\n      Білім алушылар әр жағдаятта қандай қауіп бар екенін және куәгер\nретінде қалай қауіпсіз әрекет етуге болатынын талқылайды.\n\n      Педагог қорытындылайды:\n      – Қауіпті жағдайды байқасаң, алдымен не болып жатқанын\nбағала. Өзіңді қауіпке тікпей, көмек көрсетудің ең қауіпсіз жолын\nтаңда.\n      «Қауіпті жағдайға куә болғанда қалай әрекет ету керек?»\nжадынамасы\n      Егер қауіпті жағдайға куә болсаң:\n      1.     Жағдайды бағала. Өзіңе немесе айналадағы адамдарға\nқауіп төніп тұрғанын анықта.\n      2.     Қауіпті әрекетті қолдама. Күлме, телефонға түсірме,\nбейнежазбаны таратпа және әлеуметтік желіде бөліспе.\n      3.     Қауіпсіз болса ғана аралас. Жанжалды ушықтырмай, болып\nжатқан әрекетті қолдамайтыныңды сабырлы түрде айтуға болады.\n      4.     Өзіңді қауіпке тікпе. Көмектесемін деп өз өміріңе немесе\nденсаулығыңа қатер төндірме.\n      5.     Көмек шақыр. Адамның өміріне немесе денсаулығына\nқауіп төнсе, дереу ересек адамға хабарла немесе 102 не 112 нөміріне\nқоңырау шал.\n      6.     Зардап шеккен адамды жалғыз қалдырма. Оған қолдау\nкөрсетіп, ересек адамнан көмек сұрауды ұсын.\n      7.     Егер психологиялық, құқықтық немесе ақпараттық көмек\nқажет болса, 111 байланыс орталығына жүгінуге болады.\n      Есте сақта: көмек көрсету кезінде өз қауіпсіздігіңді де ойлау\nкерек. Кей жағдайда өзің араласпай, ересек адамға хабарлау немесе\nжедел қызмет шақыру – ең дұрыс шешім.\n      III. Қорытынды бөлім\n      Рефлексия\n      Білім алушылар сөйлемдерді аяқтайды:\n      – Бүгін мен қауіпті жағдайға куә болғанда ... екенін түсіндім.\n      – Мұндай жағдайда ең алдымен мен ... .\n      – Өз өміріңді қауіпке тікпей көмектесу дегеніміз ... .\n      – Қажет кезде мен ... көмек сұрай аламын.\n      Сабақтың қорытындысы\n      Қауіпті жағдайға куә болғанда бейжай қалмау керек, бірақ\nойланбай әрекет ету де дұрыс емес. Алдымен жағдайды бағалап, өзіңе\nжәне өзгелерге қауіп төндірмейтін көмек жолын таңда. Кейде ең тиімді\nәрекет – жанжалға өзің араласпай, ересек адамға хабарлау немесе жедел\nқызмет шақыру. Осылайша сен зардап шеккен адамға да көмектесіп, өз\nқауіпсіздігіңді де сақтайсың.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 5-сабақ — Ұлы дала коды"}, "grade-7/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Дүрбелең мен қатты күйзеліс кезіндегі қауіпсіз әрекет<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 271-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=271\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№6 сабақ      Дүрбелең мен қатты күйзеліс кезіндегі қауіпсіз\n           әрекет\nМақсаты       Білім алушыларда дүрбелең мен қатты күйзеліс\n           жағдайында өзін-өзі ұстай білу және қауіпсіз шешім\n           қабылдау дағдыларын қалыптастыру.\n\nМіндеттері:        - білім алушыларды дүрбелең мен қатты күйзелістің\n               белгілерімен таныстыру.\n                   - қатты күйзеліс жағдайында өзін-өзі реттеу және\n               қауіпсіз шешім қабылдау дағдыларын, сондай-ақ дер\n               кезінде көмек сұрауға дайындығын дамыту.\n                   - өз қауіпсіздігіне және айналасындағылардың\n               қауіпсіздігіне жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Жағдаяттық кейстер жазылған карточкалар, «Тоқта – ойлан –\nәрекет ет» жадынамасы, сенімді ересектердің байланыс деректері және\n111 байланыс орталығының нөмірі көрсетілген жадынама.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Проблемалық жағдаят «Қатты күйзеліс кезінде неге\nойланбай әрекет етуіміз мүмкін?»\n      Педагог білім алушыларға жағдаят ұсынады.\n       Қатты жер сілкінісінен кейін жасөспірім үйден шығып,\nқауіпсіз жерге жетті. Айналада адамдар абыржып, біреулер айқайлап,\nдабыл дыбыстары естіліп жатты. Жасөспірім ата-анасымен хабарласа\nалмай, қатты қобалжыды. Телефонының үйде қалып қойғаны есіне\nтүскенде, ол көп ойланбастан үйге қайта кірмек болды.\n      Педагогтің сұрақтары:\n      – Жасөспірімнің асығыс шешім қабылдауына не әсер етті?\n      – Қорқыныш пен дүрбелең адамның шешіміне қалай әсер етуі\nмүмкін?\n      – Оның үйге қайта кіруі неліктен қауіпті?\n      – Осындай жағдайда асығыс әрекет етпеу үшін не істеуге болады?\n      Білім алушылар өз пікірлерін ортаға салады.\n      Педагогтің қорытындысы:\n      – Қатты күйзеліс немесе дүрбелең кезінде адам ойланбай әрекет\nетіп, қауіпті шешім қабылдауы мүмкін. Сондықтан алдымен сабырға\nкеліп, жағдайды бағалап, содан кейін ғана әрекет ету маңызды.\n      II. Негізгі бөлім\n      «Қауіпті не қауіпсіз шешім бе» жаттығуы\n      Педагог білім алушыларға берілген жағдаяттарға назар аударып,\nқалай әрекет ету керектігі туралы тапсырма береді.\n      1-жағдаят\n      Өрт кезінде адам жеке заттарын алу үшін ғимаратқа қайта кіреді.\n      2-жағдаят\n\n      Жасөспірім көпшілік шара кезінде достарынан көз жазып қалады.\nАйналада адам көп, байланыс нашар, телефонының қуаты таусылуға\nжақын. Ол абыржып, достарын тезірек табу үшін адамдардың\nарасымен асығыс жүріп, қауіпсіз шығу жолдарын елемей кетеді.\n      3-жағдаят\n      Маңызды емтихан алдында білім алушы қатты қобалжиды:\nжүрегі жиі соғады, қолы дірілдейді, зейінін емтихан тапсырмасына\nаудара алмайды. Ол не істерін және кімнен көмек сұрарын білмейді.\n      Талқылаудан кейін педагог қорытынды жасайды:\n      – Дүрбелең мен қатты күйзеліс жағдайды дұрыс бағалауға кедергі\nкелтіріп, қауіпті шешім қабылдауға әкелуі мүмкін.\n      Практикалық жаттығу. «Тоқта – ойлан – әрекет ет»\n      Педагог бір әрекетке кіріспес бұрын сабырға келіп, өзін-өзі ұстай\nбілу маңызды екенін түсіндіреді.\n      Білім алушылар жаттығуды орындайды.\n      1-қадам. Тоқта.\n      2-қадам. Екі-үш рет баяу тыныс алып, дем шығар.\n      3-қадам. Ойлан:\n      Қазір ең үлкен қауіп неден туындап тұр?\n      Қандай шешім ең қауіпсіз болады?\n      Ересек адамның көмегі қажет пе?\n      Педагог атап өтеді:\n      – Бірнеше рет баяу әрі бірқалыпты тыныс алу зейінді жинақтап,\nжағдайды байыппен бағалауға көмектесуі мүмкін.\n      Шағын кейс. «Қай кезде көмек сұрау қажет?»\n      Педагог мынадай жағдаят ұсынады:\n       Қатты шошынғаннан кейін жасөспірім бірнеше күн бойы\nдұрыс ұйықтай алмай жүр. Ол үнемі мазасызданады, үйден шығуға\nқорқады және сабақта зейінін шоғырландыра алмайды.\n      Педагог:\n       Ол бұл жағдайды өз бетімен жеңе ала ма?\n       Кімнен көмек сұраған дұрыс?\n      Білім алушылар өз жауаптарын ұсынады.\n      Педагог толықтырады:\n      Егер қатты күйзелісті өз бетіңше жеңу қиын болса,\n      – ата-анаңнан;\n      – сынып жетекшісінен;\n      – мектеп психологінен;\n      – өзің сенетін басқа ересек адамнан;\n      – 111 байланыс орталығынан;\n      – Психологиялық қолдау орталығынан көмек сұрауға болады.\n\n       Педагог атап өтеді:\n       – Кейде адам қатты күйзелгенде не істерін білмей, бәрін ішінде\nсақтап қалуы мүмкін. Егер мазасыздық ұзақ уақыт басылмаса, ұйқыңа,\nоқуыңа, күнделікті ісіңе немесе адамдармен қарым-қатынасыңа әсер\nетсе, бұл туралы біреуге айтқан дұрыс.\n       Кейде өзіңді мазалаған мәселе туралы біреуге айтып берудің өзі\nжеңілдеп қалуыңа көмектеседі. Ойыңды бөліскенде жағдайға басқа\nқырынан қарап, не істеуге болатынын түсіну оңайырақ болады. Ал\nқажет кезде кеңес немесе қолдау алу мәселені шешудің жолын табуға\nкөмектеседі.\n       Сондықтан қиындықты іште сақтап қалма. Өзің сенетін адаммен\nсөйлесіп, қажет болса көмек сұра. Кейде мәселенің шешімі дәл осындай\nәңгімеден басталады.\n     Педагог білім алушыларға өз өңіріндегі Психологиялық             қолдау\nорталығының телефон нөмірі мен байланыс деректерін ұсынады.\n     Педагог      білім      алушыларға                     тақырыптық\nбейнематериалдармен танысуды ұсынады:\n     https://www.youtube.com/watch?v=EC4zYl37wNk\n     III. Қорытынды бөлім\n     Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n     Бүгін мен ... түсіндім.\n     Егер мен қатты дүрбелеңге түссем, ...\n     Қауіпсіз шешім қабылдау үшін алдымен...\n     Көмек қажет болса, мен ... жүгіне аламын.\n     Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n\n\n\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=EC4zYl37wNk\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=EC4zYl37wNk<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 6-сабақ — Ұлы дала коды"}, "grade-7/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Қауіпті заттар мен әрекеттерден сақтану 274 «Қауіпсіздік сабақтарын» өткізу жөніндегі әдістемелік ұсынымдар<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 274-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=274\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№7 сабақ         Қауіпті заттар мен әрекеттерден сақтану\n\n Мақсаты        Білім алушылардың қысым жасау және айла-\n             тәсіл қолдану жағдайларында қауіпті ұсыныстарды\n             ажырата білу мен олардан қауіпсіз түрде бас тарту\n             дағдыларын қалыптастыру.\n Міндеттері:    - білім алушыларды жасөспірімдерді қауіпті\n             әрекеттерге тартудың кең таралған тәсілдерімен\n             таныстыру;\n                - қауіпті ұсыныстарды сыни тұрғыдан бағалау\n             және олардан нық бас тарту дағдыларын дамыту;\n                - өз денсаулығын сақтауға және жеке\n             қауіпсіздігіне     жауапкершілікпен       қарауға\n             тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Қалай қауіпсіз бас тартуға болады?» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Не нәрсе күмән тудырады?» жаттығуы\n      Педагог білім алушылардың назарын мына сөздерге аударады:\n      «Бір рет қана қолданып көр. Ештеңе болмайды».\n      «Ешкімге айтпа. Бұл екеуіміздің арамызда ғана қалсын».\n      «Бас тартсаң, қорқақ болғаның».\n      Педагог:\n           Бұл сөздердің қандай ортақ белгісі бар?\n           Мұндай ұсыныстар неліктен қауіпті болуы мүмкін?\n           Қысым көрсетілген кезде адам өзін қалай сезінуі мүмкін?\n      Білім алушылар жауаптарын талқылайды.\n      Педагогтің қорытындысы\n      – Қауіп кейде заттың өзінде ғана емес, адамды сол әрекетке\nкелісуге итермелейтін тәсілдерде де жасырынуы мүмкін.\n      II. Негізгі бөлім\n      «Қауіпсіз бас тартудың үш қадамы» практикалық жаттығуы\n      Педагог білім алушыларға жұппен жұмыс істеуді ұсынады.\n      Бір білім алушы қауіпті ұсыныс жасайды, екіншісі одан қауіпсіз\nтүрде бас тартуға жаттығады.\n      Әрекет алгоритмі\n      1-қадам. Сабырлы түрде: «Жоқ, рақмет», – деп айт.\n      2-қадам. Ақталма және дауласпа.\n      3-қадам. Егер қысым жалғаса берсе, ол жерден кетіп, өзің сенетін\nересек адамға хабарла.\n      Жаттығудан кейін педагог мына сұрақтарды талқылайды:\n\n      Қай жауаптар неғұрлым нық әрі сенімді естілді?\n      Неліктен ұзақ түсініктеме беру немесе ақталу әрдайым көмектесе\nбермейді?\n      Педагог атап өтеді:\n      – Қысқа, сабырлы әрі нық бас тарту ұзақ түсіндіру мен ақталудан\nтиімдірек болады.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады:\n     https://www.youtube.com/watch?v=4Xj4VqG7pRo\n      Педагог толықтырады:\n      Егер біреу сені қауіпті әрекетке көндіру үшін қысым көрсетсе,\nқорқытса, мәжбүрлесе немесе соңынан қалмай мазалай берсе, бұл\nжағдайды жалғыз шешуге тырыспа.\n      Көмек алу үшін ата-анаңа, өзің сенетін ересек адамға, сынып\nжетекшісіне, мектеп психологіне, мектеп әкімшілігіне, Психологиялық\nқолдау орталығына немесе 111 байланыс орталығына жүгіне аласың.\n      Егер саған тікелей қауіп төніп тұрса, 102 нөміріне хабарлас.\n      Педагог атап өтеді:\n      – Кейде адам қысымға тап болғанда не істерін білмей, бәрін өзі\nшешуге тырысуы мүмкін. Бірақ қауіпті жағдайда жалғыз қалудың\nқажеті жоқ. Болған жағдайды біреуге айтып, көмек сұрау мәселені\nқауіпсіз жолмен шешуге көмектеседі. Егер қысым тоқтамаса немесе\nөзіңді қауіпсіз сезінбесең, міндетті түрде ересек адамға немесе маманға\nхабарла.\n      (Педагог білім алушыларға өз өңіріндегі Психологиялық қолдау\nорталығының телефон нөмірі мен байланыс деректерін ұсынады.)\n      III. Қорытынды бөлім\n      Қорытындылау және рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n      Егер маған күмәнді нәрсені қолданып көруді ұсынса, мен...\n      Бас тартудың ең сенімді тәсілі...\n      Көмек қажет болса, мен ... жүгіне аламын.\n      Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n\n\n\nҚазақстан Республикасының Жасанды\nинтеллект және цифрлық даму\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=4Xj4VqG7pRo\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=4Xj4VqG7pRo<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 7-сабақ — Ұлы дала коды"}, "grade-7/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Дипфейк пен цифрлық алаяқтықтан сақтану<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 277-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=277\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ           Дипфейк пен цифрлық алаяқтықтан сақтану\nМақсаты            Білім алушыларда күмәнді цифрлық контентті\n               тексеру және цифрлық айла-тәсілдерге қарсы тұру\n               арқылы цифрлық ортада қауіпсіз әрекет ету\n               дағдыларын қалыптастыру.\nМіндеттері:       - білім алушыларды «дипфейк» және «цифрлық\n               айла-тәсіл» ұғымдарымен таныстыру.\n                  - күмәнді      цифрлық   контентті   дереккөзі,\n               мәнмәтіні және ақпараттың расталуы бойынша\n               тексеруге үйрету.\n                  - цифрлық контентті жасауға, пайдалануға және\n               таратуға жауапкершілікпен қарауды дамыту.\n\n      Материалдар мен ресурстар\n      Жағдаяттық кейстер жазылған карточкалар, «Тоқта – дереккөз –\nтексеру – шешім» сызбасы, «Цифрлық қауіпсіздік ережелері»\nжаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Мәселелі жағдаят\n      Педагог білім алушыларға мынадай жағдаят ұсынады.\n            Мессенджерде белгілі бір адамның маңызды мәлімдеме\nжасап тұрған бейнежазбасы пайда болды. Бірнеше минуттан кейін\nдосың:\n      «Бейнежазбаны өшіріп тастамай тұрғанда, тез арада барлығына\nжіберші!» – деп жазды.\n      Педагогтің сұрақтары:\n       Мұндай бейнежазбаға бірден сенуге бола ма?\n       Ақпараттың шынайылыығна көз жеткізбей, таратуға бола ма?\n       Ең алдымен қандай әрекет жасаған қауіпсіз?\n      Білім алушылар өз пікірлерін айтады.\n      Педагогтің қорытындысы\n      – Қазіргі технологиялар суреттер, бейнежазбалар, тіпті адамның\nдауысын да шынайылыққа жанасатындай жасауға мүмкіндік береді.\nСондықтан көрген немесе естіген ақпаратқа бірден сенбей, алдымен\nоны тексеру маңызды.\n      II. Негізгі бөлім\n      «Қауіпті белгі» шағын жаттығуы\n      Педагог бірнеше хабарламаны көрсетеді.\n      «Тез арада барлығына жібер!».\n\n      «Бұл бейнежазбаны ешкімге көрсетпе».\n      «Шындықты бірінші болып тек сен білесің».\n      «Бұл рас сияқты, тексермей-ақ қояйын».\n      Тапсырма\n      Қай сөйлемдер күмән тудыратынын анықтаңыздар.\n      Талқылаудан кейін педагог түсіндіреді.\n      Дипфейк – жасанды интеллект көмегімен жасалған немесе\nөзгертілген, соның нәтижесінде шынайы болып көрінетін не естілетін\nсурет, бейнежазба немесе аудиожазба.\n      Педагог атап өтеді:\n      – Тіпті өте шынайы көрінетін бейнежазба немесе дауыс та ЖИ\nкөмегімен жасалуы мүмкін. Сондықтан ақпараттың мазмұнын ғана\nемес, оның шығу тегін де тексеру маңызды.\n      «Тоқта – дереккөз – тексеру – шешім» практикалық\nжаттығуы\n      Педагог білім алушыларға қарапайым әрекет алгоритмін есте\nсақтауды ұсынады.\n      Тоқта – ақпаратты бірден таратпа.\n      Дереккөз – материалды алғаш кім және қай жерде жариялағанын\nанықта.\n      Тексеру – ақпараттың расталғанын басқа сенімді дереккөздерден\nнемесе ресми хабарламалардан ізде.\n      Шешім – ақпаратқа сену немесе сенбеу туралы шешімді тек\nтексергеннен кейін қабылда.\n      Педагог атап өтеді:\n      – Дипфейкті сыртқы белгілеріне қарап анықтау әрдайым мүмкін\nбола бермейді. Сондықтан қорғанудың ең сенімді тәсілі – ақпаратты\nтаратпас бұрын оның дұрыстығын тексеру.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады:\n     https://www.youtube.com/watch?v=gGAZaFs9DzI\n      Педагог толықтырады:\n      Егер күмәнді немесе ЖИ жасалған контент сенің өзіңе қатысты\nболса, алдау, буллинг, қорқыту немесе бопсалау мақсатында\nпайдаланылса, бұл мәселемен жалғыз қалма.\n      Хабарламалар мен скриншоттар сияқты дәлелдерді сақта,\nкүмәнді материалды әрі қарай таратпа және көмек сұра.\n      Көмек алу үшін ата-анаңа немесе өзің сенетін басқа ересек\nадамға,    сынып    жетекшісіне    немесе    мектеп   психологіне,\nПсихологиялық қолдау орталығына, 111 байланыс орталығына\nжүгінуге болады.\n\n      Егер саған қоқан-лоқы жасалса, бопсаласа немесе қауіпсіздігіңе\nтікелей қатер төнсе, полицияның 102 нөміріне хабарлас.\n      Педагог атап өтеді:\n      – Егер интернетте өз бетіңше шешу қиын жағдай туындаса, көмек\nсұрау – қауіпсіз әрі жауапты шешім. Қорқыту, бопсалау немесе буллинг\nфактісін растайтын хабарламалар мен басқа материалдарды өшірмей,\nоларды ересек адамға немесе маманға көрсету маңызды.\n      (Педагог білім алушыларға өз өңіріндегі Психологиялық қолдау\nорталығының телефон нөмірі мен байланыс деректерін ұсынады.)\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n      Бүгін мен ... білдім.\n      Ақпаратты басқаларға жібермес бұрын, мен...\n      Егер ақпарат күмән тудырса, мен...\n      Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n      «Цифрлық контентті қалай тексеруге болады?» чек-парағы\n      Ақпаратты, хабарламаны, аудио немесе бейнежазбаны\nмессенджерде таратпас бұрын, оның шынайылығын тексер.\n      Шұғыл әрекет етуге мәжбүрлейтін немесе күшті эмоция\nтудыратын хабарламаларды бірден таратпа.\n      Ақпарат жарияланған дереккөзді тексер және оның расталғанын\nбасқа сенімді дереккөздерден ізде.\n      Егер күмәнді хабарлама танысыңның немесе туысыңның атынан\nкелсе, онымен тікелей байланысып, ақпаратты нақтыла.\n      Басқа адамдарға зиян келтіруі мүмкін цифрлық контентті жасама\nжәне таратпа.\n      Күмән туындаса, ата-анаңнан, педагогтен немесе өзің сенетін\nбасқа ересек адамнан кеңес сұра.\n      Сабақтың қорытындысы\n      Интернеттегі ақпараттың бәрі бірдей шынайы бола бермейді.\nДереккөзді тексеру, сыни ойлау және цифрлық контентті таратуға\nжауапкершілікпен қарау өзіңді де, өзгелерді де цифрлық айла-\nтәсілдерден қорғауға көмектеседі.<\/div><p><a href=\"https://www.youtube.com/watch?v=gGAZaFs9DzI\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=gGAZaFs9DzI<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 8-сабақ — Ұлы дала коды"}, "grade-7/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Жас ерекшелігіне байланысты шектеулер және қауіпсіздік<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 280-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=280\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№9 сабақ            Жас ерекшелігіне байланысты шектеулер және\n                қауіпсіздік\nМақсаты             Білім алушыларда жас шектеулерін цифрлық\n                контентті қауіпсіз таңдауға көмектесетін құрал ретінде\n                саналы қабылдау дағдысын қалыптастыру.\nМіндеттері:          - білім   алушыларды       интернеттегі     және\n                медиаконтенттегі жас шектеулерінің мақсаты мен\n                маңызымен таныстыру.\n                     - цифрлық контентті таңдау кезінде қауіпсіз\n                шешім қабылдау дағдыларын дамыту.\n                     - өзінің психологиялық әл-ауқатына          және\n                цифрлық қауіпсіздігіне жауапкершілікпен қарауға\n                тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Жағдаяттар жазылған карточкалар, жас шектеулері көрсетілген\nбелгілердің суреттері (12+, 14+, 16+, 18+), «Цифрлық контентті қауіпсіз\nтаңдау» жаднамасы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Проблемалық сұрақ: «Жас шектеулері жасөспірімді қалай\nқорғайды?»\n      Педагог жас шектеулері көрсетілген фильмнің, компьютерлік\nойынның, әлеуметтік желінің және бейнеплатформаның суреттерін\nкөрсетеді.\n      Педагогтің сұрақтары:\n           Жас шектеулерін қай жерлерден кездестірдіңіздер?\n           Жас шектеулері жасөспірімді қалай қорғайды?\n      Білім алушылар өз болжамдарын айтады.\n      Педагогтің қорытындысы\n      – Жас шектеулері жасөспірімге өз жасына сай контентті таңдауға\nкөмектеседі және қорқыныш, мазасыздық немесе жайсыздық тудыруы\nмүмкін материалдардан қорғайды.\n      II. Негізгі бөлім\n      «Қауіпсіз таңдау» жаттығуы\n      Педагог білім алушыларға бірнеше жағдаят ұсынады.\n      1-жағдаят\n      Жаңа қолданбаға тіркелу кезінде:\n      «Бұл сервис белгілі 16 жастан асқан пайдаланушыларға\nарналған», – деген хабарлама шығады.\n\n      Досың тезірек тіркелу үшін жасыңды басқаша көрсетуді\nұсынады.\n      2-жағдаят\n      Қорқынышты көріністері бар бейнероликтерді көргеннен кейін\nжасөспірім мазасызданып, ұзақ уақыт ұйықтай алмайды.\n      Талқылауға арналған сұрақтар:\n      Әр жағдаятта қандай қауіп бар?\n      Бұл қауіптерді елемеу қандай салдарға әкелуі мүмкін?\n      Қандай шешім қауіпсіз болады?\n      Егер жас шектеулері сақталмаса, жасөспірім:\n       қатты қорқыныш, мазасыздық немесе эмоциялық жайсыздық\nтудыратын контентті көруі;\n       қауіпті немесе агрессивті әрекеттерді қалыпты құбылыс\nретінде қабылдап, оларға еліктеуге тырысуы;\n       цифрлық ортада алаяқтыққа, жағымсыз байланыстарға немесе\nбасқа да қауіпті контентке тап болуы;\n       пайдалану үшін көбірек жетілу мен жауапкершілікті қажет\nететін цифрлық сервистердің мүмкіндіктеріне қол жеткізуі;\n       платформа ережелерін бұзып, соның салдарынан аккаунтына\nшектеу қойылуы немесе оның бұғатталуы мүмкін.\n      Педагогтің қорытындысы\n      – Жас шектеулері жасөспірімді оның психологиялық әл-\nауқатына, қауіпсіздігіне және цифрлық ортадағы жауапты мінез-\nқұлқына кері әсер етуі мүмкін келеңсіз жағдайлардан қорғауға\nкөмектеседі.\n      «Қауіпсіз контентті қалай таңдаймыз?» алгоритмі\n      Педагог білім алушыларға қарапайым алгоритм ұсынады.\n      Фильм көру, ойын орнату, қолданбаға тіркелу немесе\nбейнеконтент таңдау алдында өзіңе мына үш сұрақты қой:\n      1. Бұл контент менің жасыма сай ма?\n      2. Оған жас шектеуі неліктен қойылған?\n      3. Бұл контент қорқыныш, мазасыздық тудыруы немесе қауіпті\nәрекетке итермелеуі мүмкін бе?\n      4. Егер күмәндансаң, өз таңдауыңды ата-анаңмен немесе өзің\nсенетін басқа ересек адаммен талқыла.\n      Педагог атап өтеді:\n      – Жас шектеулері жасөспірімнің қызығушылығын шектеу үшін\nемес, қауіпсіз таңдау жасауына көмектесу үшін белгіленеді.\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n      Фильм немесе бейне көрмес бұрын, ойын орнатпас бұрын мен...\n\n      Жас шектеулері маған ... көмектеседі.\n      Егер контенттің қауіпсіз екеніне күмәндансам, мен...\n      Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n      «Менің цифрлық қауіпсіздігім» чек-парағы\n      Фильмдердің, ойындардың, бейнеконтенттің және цифрлық\nсервистердің жас шектеулеріне назар аудар.\n      Жас шектеулерін елемей қойма.\n      Контентті достарың немесе блогерлердің ұсынғаны оның қауіпсіз\nекенін білдірмейді.\n      Егер контент қорқыныш, мазасыздық немесе қатты эмоциялық\nжайсыздық тудырса, оны көруді тоқтат.\n      Ата-анаңмен бірге Қауіпсіз іздеу (SafeSearch), ата-ана бақылауы\nжәне қауіпсіздік баптауларын пайдалан. Мысалы, Google жүйесінде\nҚауіпсіз іздеуді, YouTube платформасында Шектеулі режимді\n(Restricted Mode), TikTok желісінде Отбасылық баптауларды (Family\nPairing) және Шектеулі режимді (Restricted Mode), ал Instagram\nжелісінде қауіпсіздік параметрлері күшейтілген жасөспірімдер\nаккаунтын (Teen Account) пайдалануға болады.\n      Күмән туындаса, контент таңдау туралы ата-анаңмен немесе өзің\nсенетін басқа ересек адаммен ақылдас.\n        Педагогке арналған әдістемелік ұсыным\n        Сабақтан кейін ата-аналарға сынып чаты арқылы «Балалар үшін интернетті\nқалай қауіпсіз етеміз?» жаднамасын жіберу ұсынылады. Бұл сабақта қарастырылған\nматериалды бекітуге және балалардың үй жағдайында цифрлық сервистерді қауіпсіз\nпайдалануына ықпал етеді.\n        Ата-аналарға арналған жаднама\n        Бала үшін интернетті қалай қауіпсіз етуге болады?\n        Құрметті ата-аналар!\n        Баланың қажетті немесе жасына сай емес контентті тұтыну қаупін азайту\nүшін цифрлық сервистердегі кіріктірілген қауіпсіздік құралдарын пайдалануды ұсынамыз.\n        Google – Қауіпсіз іздеуді (SafeSearch) қосыңыз.\n        YouTube – Шектеулі режимді (Restricted Mode) қосыңыз.\n        TikTok – Отбасылық баптауларды (Family Pairing) және Шектеулі режимді\n(Restricted Mode) пайдаланыңыз.\n        Instagram – қауіпсіздік параметрлері күшейтілген жасөспірімдер аккаунтын\n(Teen Account) баптаңыз.\n        Сондай-ақ:\n        Баламен интернеттегі қауіпсіз мінез-құлық ережелерін талқылаңыз.\n        Қолданбалардың, ойындардың, фильмдердің және басқа медиаконтенттің жас\nшектеулеріне назар аударыңыз.\n        Баланың қандай цифрлық контентті көріп, қандай сервистерді пайдаланып\nжүргеніне жүйелі түрде қызығушылық танытыңыз.\n        Есте сақтаңыз: баланың цифрлық қауіпсіздігі қауіпсіздік баптауларын бірге\nреттеуден және отбасындағы сенімді қарым-қатынастан басталады.<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 9-сабақ — Ұлы дала коды"}, "grade-7/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Менің денем – менің жеке шекарам<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 283-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=283\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ          Менің денем – менің жеке шекарам\nМақсаты            Білім алушыларда жеке басына қол сұғылмау\n               құқығы туралы түсінік қалыптастыру және тәндік\n               шекарасы бұзылған жағдайда қауіпсіз әрекет ету\n               дағдыларын дамыту.\nМіндеттері:        - білім алушыларды «Менің денем – менің\n               ережелерім» қағидасымен және әр адамның жеке\n               басына қол сұғылмау құқығымен таныстыру.\n                   - қауіпті жағдайларды ажырата білу және тәндік\n               шекарасы бұзылған жағдайда қауіпсіз әрекет ету\n               дағдыларын дамыту.\n                   - өз денесіне, жеке шекарасына және басқа\n               адамдардың құқықтарына       құрметпен қарауға\n               тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Менің қауіпсіздік ережелерім» чек-парағы.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      «Қауіпсіздік бағдаршамы» жаттығуы\n      Педагог білім алушыларға әр жағдаятты талдап, оның қауіпсіз,\nкүмәнді немесе қауіпті екенін анықтауды ұсынады.\n      Жағдаяттар:\n      Дәрігер ата-ананың немесе басқа ересек адамның қатысуымен\nтексеру жүргізеді.\n      Досың ойын кезінде сені байқамай итеріп кетіп, бірден кешірім\nсұрады.\n      Бейтаныс ересек адам сені үйге жеткізіп салуды ұсынады.\n      Сыныптасың сенің рұқсатынсыз құшақтап, сәлемдескісі келді.\n      Әр жағдаяттан кейін білім алушылар өз пікірлерін айтып,\nтаңдауын түсіндіреді.\n      Педагогтің сұрақтары:\n           Қандай жағдаяттарды қауіпсіз деп санауға болады?\n           Қандай жағдаяттарда сақ болған жөн?\n           Қандай белгілер ықтимал қауіпті білдіреді?\n      Егер адам «тоқта» деген өтінішке мән бермесе, не істеу керек?\n      Педагогтің қорытындысы\n      – «Менің денем – менің ережелерім» қағидасы әр адамның өз\nтәндік шекарасын белгілеуге және өзіне жағымсыз жанасуға «жоқ» деп\nайтуға құқығы бар екенін білдіреді. Ешкім бұл шекараны бұзбауы тиіс.\nТек медициналық көмек көрсету немесе адамның өмірі мен\n\nденсаулығын сақтау үшін қажетті әрекеттер кезінде тәндік жанасу\nқажет болуы мүмкін.\n      II. Негізгі бөлім\n      «Қауіпті белгі» жаттығуы\n      Педагог білім алушыларға қандай жағдаяттардың қауіп белгісі\nболуы мүмкін екенін анықтауды ұсынады.\n      1-жағдаят\n      Бейтаныс ересек адам жоғалған күшікті іздеуге көмектесуді\nсұрап, адам жоқ жерге бірге баруды ұсынады.\n      2-жағдаят\n      Ойын кезінде жасөспірімдердің бірі екіншісіне қолымен тисіп,\nәзілдегісі келді. Екіншісі: «Қойшы, тоқтат», – деді.\n      3-жағдаят\n      Таныс ересек адам: «Бұл екеуіміздің құпиямыз болсын. Ата-\nанаңа айтудың қажеті жоқ», – дейді.\n      Тапсырма\n      Не нәрсе алаңдатады?\n      Неліктен мұндай ұсынысқа келіспеу керек?\n      Қандай шешім қауіпсіз болады?\n      Талқылаудан кейін педагог қорытынды жасайды.\n      Қауіпті жағдайды білдіретін белгілер\n      Адам сенің бас тартқаныңды елемейді.\n      Адам жоқ жерге бірге баруды немесе оңаша қалуды ұсынады.\n      Болған жағдайды құпия сақтауды сұрайды.\n      Келісімің үшін сыйлық, ақша немесе басқа да нәрсе ұсынады.\n      Сенде қорқыныш, ұялу, кінәлілік немесе ыңғайсыздық сезімін\nтудырады.\n      «Қорықпа», «Ешкімге айтпа», «Мұны бәрі істейді», «Сен маған\nсенбейсің бе?» деген сөздермен қысым көрсетеді.\n      Ішкі түйсігің мазасыздық тудырып, болып жатқан жағдайдың\nдұрыс немесе қауіпсіз емес екенін сезесің.\n      Педагог атап өтеді:\n      – Егер жағдай қорқыныш, мазасыздық немесе жайсыздық сезімін\nтудырса, бұл сезімдерді елемеуге болмайды. Қарым-қатынасты\nтоқтатып, қауіпсіз жерге барып, өзің сенетін ересек адамнан көмек\nсұра.\n      Егер өзіңе қауіп төніп тұрғанын сезсең\n      1. «Жоқ» деп айт – сабырлы әрі нық түрде бас тарт.\n      2. Қауіпсіз жерге бар – адамдар көп жерге барып, қажет болса\nкөмек сұра.\n\n      3. Болған жағдайды айт – ата-анаңа, педагогке, мектеп\nпсихологіне немесе өзің сенетін басқа ересек адамға хабарла.\n      4. Егер саған тікелей қауіп төніп тұрса немесе құқыққа қайшы\nәрекет жасалып жатса, дереу 102 немесе 112 нөміріне қоңырау шал.\n      5. Егер саған психологиялық, ақпараттық немесе құқықтық\nқолдау қажет болса, 111 байланыс орталығына хабарлас.\n      6. Егер психологиялық көмек пен қолдау қажет болса, өз\nөңіріңдегі Психологиялық қолдау орталығына да жүгіне аласың.\n      (Педагог білім алушыларға өз өңіріндегі Психологиялық қолдау\nорталығының телефон нөмірі мен байланыс деректерін ұсынады.)\n      III. Қорытынды бөлім\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.\n      «Менің денем – менің ережелерім» дегеніміз...\n      Егер мен өзіме қауіп төніп тұрғанын сезсем, ...\n      Көмек қажет болса, мен ... жүгіне аламын.\n      Бірнеше білім алушы өз жауаптарын дауыстап айтады.\n      Сабақтың қорытындысы\n      Әрбір бала жынысына қарамастан, өз денесіне құрметпен\nқаралуына және жеке басына қол сұғылмауына құқылы. Қауіпті\nжағдайларды ажырата білу, «жоқ» деп нық айту, қауіпті жерден кету\nжәне дер кезінде көмек сұрау денсаулықты, қадір-қасиетті және\nқауіпсіздікті қорғауға көмектеседі.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "7-сынып · 10-сабақ — Ұлы дала коды"}, "grade-7/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>7-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-7/index.html\">← 7-сынып тақырыптары<\/a><article><h2>Жасөспірімнің жолдағы қауіпсіздігі: велосипед, самокат, скейтборд<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 286-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=286\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№11 сабақ         Жасөспірімнің        жолдағы       қауіпсіздігі:\n              велосипед, самокат, скейтборд\nМақсаты           Білім алушылардың велосипед, самокат және\n              скейтбордты    қауіпсіз    пайдалану    дағдыларын\n              қалыптастыру.\nМіндеттері:       - велосипед, самокат және скейтборд тебу кезінде\n              туындауы мүмкін қауіпті жағдайлар туралы білім\n              алушылардың түсінігін кеңейту;\n                  - жол жағдайын бағалау және қауіпсіз шешім\n              қабылдау дағдыларын дамыту;\n                  - жол     жүрісі      қағидаларын      сақтауға\n              жауапкершілікпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Қауіпсіз қозғалыс алгоритмі» жаднамасы, жолдағы түрлі\nжағдаяттар бейнеленген суреттер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға мынадай жағдаят ұсынады.\n       Екі жасөспірім бір электросамокатқа бірге мініп келеді.\nОлардың бірі телефонына қарап отыр. Жаяу жүргіншілер өткеліне\nжақындағанда да жылдамдықтарын бәсеңдетпейді.\n      Педагогтің сұрақтары:\n       Қандай қателерді байқадыңыздар? Олардың қайсысы ең\nқауіпті?\n       Әрбір қате қандай салдарға әкелуі мүмкін?\n       Ал велосипед немесе скейтборд тепкенде қандай кедергілер\nалдымыздан шығады?\n      Білім алушылар жіберген қателерге тоқталады.\n      Педагогтің қорытындысы\n      – Жолда асығыстық, зейіннің басқа нәрсеге аударылуы, өз\nмүмкіндігін шамадан тыс бағалау және «ештеңе болмайды» деген ой\nқауіпті жағдайға әкелуі мүмкін. Сондықтан жол жүрісі қағидаларын\nбілу ғана емес, оларды әрдайым сақтау маңызды.\n\n      II. Негізгі бөлім\n      Жағдаяттық тапсырма\n      Әр топқа бір жағдаят беріледі.\n      1-жағдаят\n      Жасөспірім велосипедтен түспей, жаяу жүргіншілер өткелі\nарқылы жолды кесіп өтеді.\n      2-жағдаят\n      Жасөспірім электросамокатпен келе жатып, телефондағы\nхабарламаны оқиды да, тұрақта тұрған автокөлікті байқамай қалды.\n      3-жағдаят\n      Жасөспірім велосипедпен жаяу жүргіншілер көп жерде жоғары\nжылдамдықпен келе жатыр.\n      4-жағдаят\n      Велосипедші ауладан жолдың жүріс бөлігіне шығар алдында\nкөліктердің жоқ екеніне көз жеткізбестен жолға шығады.\n      5-жағдаят\n      Жасөспірім құлаққаппен скейтборд теуіп келе жатып,\nбағдаршамда 7 секунд қалғанын көрді. «Үлгеремін» деп жылдамдығын\nарттырды. Бірақ жолға шыға бергенде бұрылып келе жатқан көлікті\nбайқап қалды.\n      Тапсырма\n      Қауіпті жағдайға қандай қате себеп болды?\n      Оның салдары қандай болуы мүмкін?\n      Қандай қауіпсіздік ережесі жол-көлік оқиғасының алдын алуға\nкөмектесер еді?\n      Талқылаудан кейін топ өкілдері өз жауаптарын таныстырады.\n      Педагогтің қорытындысы\n      – Бір ғана қателіктің өзі ауыр салдарға әкелуі мүмкін. Жолда\nережелерді білу ғана емес, айналадағы жағдайды үнемі бағалап отыру\nмаңызды.\n      «Тоқта – бағала – жалғастыр» алгоритмі\n      Жолдан өтер алдында немесе жолдың жүру бөлігіне шығар\nалдында:\n      1. Тоқта.\n      2. Жол жағдайын бағала – жан-жағыңа қарап, көлік\nжүргізушілерінің сені байқағанына көз жеткіз.\n      3. Велосипедпен немесе электросамокатпен жаяу жүргіншілер\nөткелінен өтетін болсаң, көлік құралынан түс. Скейтбордпен келе\nжатсаң, одан түсіп, жолдан жаяу өт.\n      4. Қозғалысты қауіпсіз екеніне толық көз жеткізгеннен кейін ғана\nжалғастыр.\n\n      Педагог білім алушылардың назарын аударады\n      Мына жағдайлар қауіпті:\n           тым жоғары жылдамдықпен жүру;\n           қозғалыс кезінде телефонға алаңдау;\n           құлаққаптан айналадағы дыбыстарды естімеу;\n           тұрақта тұрған көліктердің арасынан жолға кенеттен шығу;\n           бір электросамокатқа екі адамның бірге мінгесуі;\n           скейтбордпен көлік жүретін жолға немесе оған тым жақын\nжерге шығу;\n           скейтбордпен жаяу жүргіншілер көп жерде жоғары\nжылдамдықпен сырғанау;\n           тұрақта тұрған автокөліктердің арасынан скейтбордпен\nкенеттен шығу;\n           қорғаныш құралдарынсыз скейтборд тебу.\n           тәуліктің қараңғы уақытында жарық қайтарғыш\nэлементтерсіз немесе жарықсыз жүру.\n      Педагог білім алушылардың назарын жол жүрісі\nқағидаларына аударады\n      Велосипедті, электросамокатты және басқа да жеке мобильділік\nқұралдарын пайдаланғанда Қазақстан Республикасының Жол жүрісі\nқағидаларын сақтау қажет.\n      Есте сақтау маңызды:\n      Жолдың жүру бөлігімен велосипед немесе электросамокат\nбасқарған кезде белгіленген талаптарға сәйкес қорғаныш дулығасын\nпайдалану қажет.\n      Көлік құралы жолаушы тасымалдауға арналмаған болса,\nжолаушы алып жүруге болмайды.\n      Велосипедпен немесе электросамокатпен жаяу жүргіншілер\nөткелінен өтерде одан түсіп, көлік құралын жетектеп өту қажет.\n      Тәуліктің қараңғы уақытында жарық қайтарғыш элементтерді\nпайдалану, ал көлік құралында жарық беру құрылғысы болса, оны қосу\nқажет.\n      Қозғалыс кезінде телефонға алаңдауға болмайды. Жол жағдайын\nүнемі бақылап отыру қажет.\n      Қауіпсіз жылдамдықты таңдап, жаяу жүргіншілер өткелдері,\nаулалар және тұрақта тұрған автокөліктер маңында ерекше мұқият\nболу керек.\n      Электросамокатпен тротуарлар мен жаяу жүргіншілер\nжолдарында жүруге болмайды. Велосипед жолы немесе велосипед\nжолағы бар болса, электросамокатпен солардың бойымен жүру қажет.\n\nОлар болмаған жағдайда заң талаптарын сақтай отырып, жолдың жүру\nбөлігінің оң жақ шетімен немесе жол жиегімен қозғалуға болады.\n      18 жасқа толмағандарға электросамокатпен жолдың жүру\nбөлігіне шығуға болмайды. Жолдың жүру бөлігімен электросамокат\nбасқаруға 18 жасқа толған, тиісті жүргізуші куәлігі бар және қорғаныш\nдулығасын таққан адамдарға ғана рұқсат етіледі.\n      Жалға берілетін электросамокаттарды пайдалану үшін\nпайдаланушы 18 жасқа толған және жарамды жүргізуші куәлігі бар\nболуы тиіс.\n      Скейтборд тепкенде есте сақтау маңызды:\n       скейтбордты көлік қозғалысынан оқшауланған, қауіпсіз жерде\nнемесе арнайы алаңда тепкен дұрыс;\n       жолдың жүру бөлігіне скейтбордпен кенеттен шығуға\nболмайды;\n       жаяу жүргіншілердің қауіпсіздігіне кедергі келтірмей,\nайналадағы жағдайды үнемі бақылау қажет;\n       жолдан өтерде скейтбордтан түсіп, оны қолмен алып өткен\nқауіпсіз;\n       дулыға, тізелік және шынтаққап сияқты қорғаныш құралдарын\nпайдаланған жөн;\n       қараңғыда, көріну нашар болғанда немесе жол жабыны тайғақ\nкезде скейтборд теппеген дұрыс.\n      Педагог атап өтеді\n      – Жол жүрісі қағидаларын сақтау – «Заң және тәртіп» қағидатын\nұстанудың көрінісі. Заң талаптарын орындай отырып, әрбір жол\nқозғалысына қатысушы өзінің өмірі мен денсаулығын ғана емес,\nайналасындағы адамдардың қауіпсіздігін де қорғайды. Жолдағы\nжауапты мінез-құлық жол-көлік оқиғаларының алдын алуға және адам\nөмірін сақтауға көмектеседі.\n      III. Қорытынды бөлім\n      «Өмірді сақтайтын бір ереже» жаттығуы\n      Педагог әр білім алушыға жолдағы өз қауіпсіздігі үшін ең\nмаңызды деп санайтын бір ережені атап, оның неліктен маңызды екенін\nқысқаша түсіндіруді ұсынады.\n      Білім алушылардың жауаптарынан кейін педагог қорытынды\nжасайды.\n      – Жолдағы қауіпсіздік дұрыс шешім қабылдаудан басталады.\nКейде бірнеше секундқа тоқтап, айналадағы жағдайды бағалаудың өзі\nжол-көлік оқиғасының алдын алуға көмектеседі.\n      Рефлексия\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады.<\/div><\/article><\/mai
