лерді ашуға болмайды?<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-2/lesson-08.html\"><h2>8. Интернеттегі ақпараттың бәріне сенуге бола ма?<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-2/lesson-09.html\"><h2>9. Үйдегі қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-2/lesson-10.html\"><h2>10. Көшедегі жануарлардан қалай сақтану керек?<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><a class=\"card\" href=\"#/grade-2/lesson-11.html\"><h2>11. Мұз үстіндегі қауіпсіздік ережелері<\/h2>Сабақ пен тапсырмаларды ашу →<\/a><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · Қауіпсіздік сабақтары — Ұлы дала коды"}, "grade-2/lesson-01.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 1-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Төтенше жағдайлар қызметтері мен байланыс орталығының телефон нөмірлері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 87-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=87\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№1 сабақ          Төтенше жағдайлар қызметтері мен байланыс\n               орталығының телефон нөмірлері\n Мақсаты           Білім алушылардың төтенше жағдайлар кезіндегі\n               қауіпсіз мінез-құлық дағдыларын қалыптастыру\n Міндеттері         нақты жағдайға байланысты қай төтенше\n               жағдайлар қызметіне жүгінуге үйрету;\n                    төтенше жағдайлар қызметтерін жедел шақыру\n               дағдыларын дамыту;\n                    қауіпті жағдайда жауапкершілік пен сабырлылық\n               танытуға тәрбиелеу.\n\n     Материалдар мен ресурстар\n     Әртүрлі жағдаяттар бейнеленген карточкалар, «Көмекті қалай\nшақыру керек?» жаднамасы.\n     Сабақ барысы\n     I. Кіріспе бөлім\n     Педагог:\n     – Балалар, елестетіп көріңдерші, жақын жерде төтенше жағдай\nболды: біреудің денсаулығы нашарлады немесе өрт шықты. Мұндай\nжағдайда қалай тез көмек алуға болады?\n     Білім алушылар жауап береді. Педагог:\n     – Ол үшін әрдайым көмек көрсетуге дайын арнайы төтенше\nжағдайлар қызметтері бар.\n     II. Негізгі бөлім\n     Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n     https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\nC74gi/view?usp=sharing\n     1. Қызметтердің телефон нөмірлерімен танысу\n     Педагог карточкаларды көрсетеді.\n     101 – Өрт сөндіру қызметі\n           өрт шыққанда; түтін немесе от көргенде.\n     102 – Полиция\n           бала адасып кеткенде; адамға қауіп төнгенде.\n     103 – Жедел медициналық жәрдем\n           адам ауырып қалғанғанда немесе жарақат алған жағдайда.\n     112 – Бірыңғай құтқару қызметі\n\n            қай қызметке қоңырау шалу керектігін білмеген жағдайда;\n            кез келген төтенше жағдайда.\n      111 – Отбасы, әйелдер және балалардың құқықтарын қорғау\nмәселелері бойынша байланыс орталығы\n            қорқынышты жағдайға тап болсаң немесе көмек қажет\nболса; біреу сені ренжітсе немесе қорқытса;\n            кімнен көмек сұрау керектігін білмесең.\n      2. Көмек шақыру ережелері\n      Педагог төтенше жағдайлар қызметіне қоңырау шалған кезде\nсабырлы түрде мына ақпараттарды айту керектігін түсіндіреді:\n            не болғанын;\n            оқиғаның қай жерде болғанын;\n            өзінің аты-жөнін.\n      Одан кейін операторды мұқият тыңдап, оның сұрақтарына жауап\nберу қажет. Педагог:\n      – Балалар, қалай ойлайсыңдар, әзіл үшін 102 немесе 112 нөміріне\nқоңырау шалып, жалған ақпарат айтуға бола ма?\n      Білім алушылар жауап береді. Педагог:\n      – Бұлай жасауға болмайды. Төтенше жағдайлар қызметтері шын\nмәнінде көмекке мұқтаж адамдарға асығады. Егер біреу жалған\nшақырту жасаса, қызметкерлер жалған оқиғаға уақыт жұмсайды.\nСоның салдарынан шын мәнінде көмек қажет болған адамдарға кешігіп\nбаруы мүмкін. Сондықтан төтенше жағдайлар қызметтеріне тек қажет\nболған жағдайда қоңырау шалып, шынайы ақпарат хабарлау\nкерек. Көрінеу жалған хабарлама бергені үшін заңнамада\nжауапкершілік қарастырылған.\n      III. Қорытынды бөлім\n      – Білім алушылар, төтенше жағдайлар қызметтерінің нөмірлерін\nқалай есте сақтағандарыңды тексерейік. Мен допты лақтырып, қандай\nжағдай болғанын айтамын, ал сендер допты маған қайтарып, тиісті\nтелефон нөмірін айтасыңдар.\n            «Подъезде газдың иісі шығып тұр!» – 104\n            «Орманда адасып кеттім!» – 112\n            «Көшеде адамдар төбелесіп жатыр!» – 102\n            «Дене қызуым көтерілді!» – 103\n      Педагог:\n      – Бүгін біз төтенше жағдайлар қызметтерінің нөмірлерін\nқайталап, көмекке қалай дұрыс жүгіну керектігін үйрендік. Қауіпті\nжағдайда сабыр сақтап, ересек адамға хабарласу немесе қажетті\nқызметке қоңырау шалу керек. Өз атыңды айтып, не болғанын\nтүсіндіріп, қай жерде тұрғаныңды хабарлау қажет.\n\nҚазақстан Республикасының Бас\nпрокуратурасы ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1CpHsUuaZrvtFqm_VlWwva3vGJQt<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 1-сабақ — Ұлы дала коды"}, "grade-2/lesson-02.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 2-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Абайла: бейтаныс адамдар!<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 89-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=89\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№2 сабақ         Абайла: бейтаныс адамдар!\nМақсаты          Білім алушылардың бейтаныс адамдармен қарым-\n              қатынас кезінде қауіпсіз әрекет ету дағдыларын\n              қалыптастыру және қауіпті жағдайда дұрыс шешім\n              қабылдауға үйрету.\nМіндеттері       - бейтаныс адамдармен кездескен кезде қауіпсіз\n              мінез-құлық ережелерін үйрету;\n                 - «жоқ» деп айта білу және ересек адамдардан\n              көмек сұрау дағдыларын дамыту;\n                 - өз қауіпсіздігіне мұқият әрі жауапкершілікпен\n              қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Өмірлік жағдаяттар бейнеленген карточкалар,            телефон\nмакеті, «Болады», «Болмайды» карточкалары, әртүрлі жағдаяттар\nбейнеленген иллюстрациялар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушылардың назарын тақырыптық\nбейнероликке аударады.\n      https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eCS\nY2FeoTMEec8T451Um4EJpuikdqk&amp;index=7\n      Педагог:\n      – Балалар, бүгін біз әрбір қауіпсіздік суперагенті білуі тиіс\nережелер туралы сөйлесеміз. Бүгінгі сабағымыздың тақырыбы: «Абай\nбол: бейтаныс адамдар!». Қалай ойлайсыңдар, қауіпті бейтаныс адам\nқандай болады?\n      (Балалар әдетте: қара маска киген, ашулы, қабағы түйілген,\nжасырынып жүрген адам деп жауап береді.)\n      Педагог:\n      – Олай емес! Бұл – ең маңызды ереже. Өмірде қауіпті адамдар өте\nжағымды болып көрінуі мүмкін: сыпайы киінген ағай немесе кәмпит\nұсынып, күлімсіреп тұрған апай болуы мүмкін. Сондықтан бірінші\nережені есте сақтаңдар:\n      Бейтаныс адамды сыртқы келбетіне қарап емес, оның әрекетіне\nқарап бағалаймыз.\n\n      Бейтаныс адам – сен танымайтын кез келген адам. Ол сенің\nатыңды атап сөйлессе де, бейтаныс адам болып қала береді.\n      II. Негізгі бөлім\n      1. «Қауіпсіз бе, қауіпті ме?» ойыны\n      Білім алушылар «Болады» немесе «Болмайды» карточкаларын\nкөрсетеді.\n      Педагог жағдаяттарды оқиды:\n    Педагог оқулықты ашуды сұрайды.\n    Бейтаныс адам өзімен бірге баруды сұрайды.\n    Бейтаныс адам болған әңгіме туралы ешкімге айтпауды сұрайды.\n    Көрші әжей сөмкесін көтерісуге көмектесуді сұрайды.\n      Педагог қорытынды жасайды:\n      – Егер біреу сенен өзіңе немесе басқа адамға зиян келтіруі мүмкін\nнәрсені істеуді немесе бір нәрсені жасыруды сұраса, оның өтінішін\nорындама.\n      2. «Қалай әрекет етесің?» ойыны\n      Педагог:\n      – Балалар, біз ережелерді қайталадық. Енді әртүрлі жағдайларда\nдұрыс әрекет ете алатындарыңды тексерейік. Мен жағдаятты айтамын,\nал сендер не істейтіндеріңді айтасыңдар.\n      1-жағдаят. Бейтаныс адам: «Анаң сені мектептен алып кетуге\nмені жіберді. Менімен бірге жүр», – деді.\n      Білім алушылар:\n      – Мен онымен бармаймын. Одан алыстап, педагогке немесе өзім\nсенетін басқа ересек адамға жүгінемін.\n      2-жағдаят. Бейтаныс адам артыңнан еріп, саған жақындауға\nтырысып келеді.\n      Білім алушылар:\n      – Адамдар көп, қауіпсіз жерге барамын және ересек адамнан\nкөмек сұраймын. Егер қауіп төнсе, қатты дауыстап көмекке\nшақырамын.\n      3-жағдаят. Бейтаныс адам қолыңнан ұстап, өзімен бірге алып\nкетуге тырысты.\n      Білім алушылар:\n      – Қатты дауыстап: «Мен сізді танымаймын! Көмектесіңіз!» – деп\nайтамын. Алыстауға немесе қауіпсіз жерге қашуға тырысамын және\nкөмек сұраймын.\n      4-жағдаят. Сен қауіпсіз жерге жеттің. Енді не істеу керек?\n      Білім алушылар:\n      – Болған жағдайды міндетті түрде ата-анама, педагогке немесе\nөзім сенетін басқа ересек адамға айтамын. Қауіп төнсе 102 немесе\n\n112 нөміріне хабарласамын. Егер көмек, қорғау немесе қолдау қажет\nболса, 111 нөміріне жүгінуге болады.\n      Педагог балалармен бірге негізгі ережелерді қайталайды:\n      –    Қауіпке     ұшырамас     үшін біз «Қауіпсіздіктің алты\nережесін» жақсы білуіміз керек. Келіңдер, оларды бірге талдап көрейік.\n      1. Сөйлеспе! Егер бейтаныс адам сені тоқтатуға тырысса, бір\nжаққа шақырса немесе түсініксіз сұрақтар қойса, онымен сөйлесуге\nміндетті емессің. «Жоқ!» деп айт та, одан алыста.\n      2. Ештеңе алма! Бейтаныс адамдар ұсынған кәмпитті,\nойыншықты, ақшаны, телефонды немесе басқа заттарды алма.\n      3. Көлікке отырма және ешқайда барма! Бейтаныс адамның\nкөлігіне ешқашан отырма. Ол өзін ата-анаң жібергенін немесе\nжақындарыңа бір жағдай болғанын айтса да, онымен бірге барма.\nБейтаныс адаммен аулаға, бұрышқа, кіреберіске немесе басқа жерге\nбарма. Ол сенен көмек сұраса, бір нәрсе көрсетемін десе немесе сыйлық\nұсынса да, онымен бірге кетпе.\n      4. Алыста және көмекке шақыр! Егер бейтаныс адам тым\nжақын келсе, артыңнан ерсе, ұстап алуға немесе алып кетуге тырысса,\nқатты дауыстап: «Жоқ! Мен сізді танымаймын! Көмектесіңіз!», – деп\nайт. Қауіпсіз әрі адам көп жерге қарай алыста немесе қаш.\n      5. Қауіпсіз ересек адамнан көмек сұра! Балаларымен бірге\nжүрген ата-анадан, мұғалімнен, полиция қызметкерінен, күзетшіден,\nсатушыдан немесе жақын жердегі дүкен, дәріхана не басқа мекеме\nқызметкерінен көмек сұра. Болған жағдайды міндетті түрде айтып бер.\n      6. Қоңырау шал және міндетті түрде айтып бер! Егер саған\nқауіп төніп тұрса, 102 немесе 112 нөміріне қоңырау шал. Егер көмек,\nқорғау немесе қолдау қажет болса, 111 нөміріне хабарласуға болады.\nОқиғадан кейін болған жағдайды міндетті түрде ата-анаңа, мұғалімге\nнемесе өзің сенетін басқа ересек адамға айт.\n      Педагог:\n      – Ең бастысы, балалар, қауіпті жағдайда жалғыз қалмаңдар.\n«Жоқ!» деп нық айтыңдар, қауіпсіз жерге барыңдар, көмек сұраңдар\nжәне болған жағдайды өздерің сенетін ересек адамға міндетті түрде\nайтыңдар.\n      III. Қорытынды бөлім\n      Рефлексия «Мен қалай әрекет ету керектігін білемін»\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n           «Егер маған бейтаныс адам жақындаса, мен ...».\n           «Егер мен қорқып қалсам немесе қауіп төнсе, мен ...».\n           «Көмек сұрау үшін мен ... адамға жүгіне аламын».\n\n           «Бүгін мен үшін ең маңызды ереже – ...».\n      Педагог:\n      – Естеріңде болсын: ересек адамға көмек қажет болса, ол басқа\nересек адамнан көмек сұрауы керек. Бейтаныс адам баладан өзімен\nбірге баруды өтінбеуі тиіс. Егер ересек адам сенен көмек сұрап, онымен\nбірге жүруді ұсынса – бұл қауіпті жағдай болуы мүмкін.<\/div><p><a href=\"https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eCS\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=94MROnYncto&amp;list=PLA5eCS<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 2-сабақ — Ұлы дала коды"}, "grade-2/lesson-03.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 3-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Қауіпті өтінішті қалай тануға болады?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 93-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=93\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№3 сабақ          Қауіпті өтінішті қалай тануға болады?\nМақсаты           Білім алушылардың қауіпсіз және қауіпті\n              өтініштерді ажырата білу дағдыларын қалыптастыру\nМіндеттері        - жасырын        айла-тәсілдің    белгілерімен\n              таныстыру;\n                  - өтініштің мазмұнына және өтініш жасаған\n              адамның кім екеніне жылдам баға беру қабілетін\n              дамыту;\n                  - өз жеке шекарасына және жеке қауіпсіздігіне\n              саналы түрде қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Қауіпсіз және қауіпті өмірлік жағдаяттар бейнеленген\nкарточкалар, «Жасыл» (қауіпсіз) және «Қызыл» (қауіпті) сигналдық\nкарточкалары.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, бізді кішкентай кезімізден мейірімді, әдепті болуға\nжәне басқа адамдарға көмектесуге үйретеді. Бұл – өте жақсы қасиет.\nМысалы, анаңа сөмкесін көтеруге көмектесу, әжеге есікті ашып беру\nнемесе мұғалімге дәптерлерді таратуға көмектесу.\n      Алайда кейде жаман ниетті адамдар өздерін мейірімді адам\nретінде көрсетіп, баланың көмектесуге деген ниетін пайдаланып, оны\nалдауы мүмкін.\n      Сондықтан бүгін біз қандай өтініштердің қауіпсіз, ал қандай\nөтініштердің қауіпті болуы мүмкін екенін үйренеміз.\n      Сабақтың басты ережесі:\n      Егер ересек адамға көмек керек болса, ол бейтаныс баладан емес,\nбасқа ересек адамнан көмек сұрайды.\n      II. Негізгі бөлім\n      Педагог:\n      – Қауіпсіз және қауіпті өтініштердің қандай болатынын бірге\nталдап көрейік.\n      Қауіпсіз өтініштер\n      Сендердің «жасыл қауіпсіздік шеңберлеріңе» кіретін адамдар\n(ата-аналар, мұғалімдер) немесе қауіпсіз жерде (аулада, мектепте)\nтұратын таныс қарт көршілер сенен ешқайда баруды талап етпей,\nқарапайым өтінішпен жүгінуі мүмкін. Мысалы:\n            Ұстазың дәптерлерді таратуға көмектесуіңді сұрауы\nмүмкін.\n\n            Көрші ата қолындағы заттарын көтеріп келе жатып, есікті\nашуға көмектесуіңді сұрауы мүмкін.\n      Қауіпті өтініштер\n      Бейтаныс немесе жақсы таныс емес адамдар сенен бір жерге бірге\nбаруды, бір нәрсені жасыруды немесе әдетте ересектер жасайтын\nәрекетті орындауды сұраса – бұл қауіпті жағдайдың белгісі болуы\nмүмкін. Мысалы:\n       «Менімен бірге ана жерге жүрші, марғауды қорапқа салуға\nкөмектес»;\n       «Мен саған қызық нәрсе көрсетемін, тек менімен бірге жүр»;\n       «Анаңа бұл ойыншықты мен бергенімді айтпа».\n      «Қауіпті – қауіпсіз» ойыны\n      Педагог жағдаяттарды оқиды. Білім алушылар «Жасыл» немесе\n«Қызыл» белгісін көтеріп, өз таңдауын түсіндіреді.\n      1-жағдаят. Мектеп ауласында жылап тұрған бейтаныс әйел сенің\nжаныңа келіп:\n      – Балам, телефонымды жоғалтып алдым. Мектептің артындағы\nбұталардың арасынан іздеуге көмектесші, – дейді.\n      Өтінішті орындаудан бас тарт. Егер тікелей қауіп төнсе, 102\nнемесе 112 нөміріне қоңырау шал. Егер көмек, қорғау немесе қолдау\nқажет болса, 111 нөміріне хабарласуға болады.\n      III. Қорытынды бөлім\n      «Сөйлемді аяқта» рефлексиясы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n            «Қауіпті өтініш дегеніміз – ... екенін білемін».\n            «Егер бейтаныс ересек адам мені өзімен бірге шақырса, мен\n...».\n            «Бүгін мен үшін ең маңызды ереже – ...».\n      Педагог:\n      – Бүгін біз қандай ең маңызды ережені үйрендік? Сендер\nқауіпсіздік сарапшысы рөлін өте жақсы орындадыңдар!\n      Естеріңде болсын: бейтаныс ересек адамның қауіпті өтінішінен\nбас тарту – әдепсіздік емес. Бұл – өз қауіпсіздігіңе жауапкершілікпен\nқарау және сақтық таныту.\n      Үйде бүгінгі қауіпсіздік ережелерін ата-аналарыңмен бірге тағы\nбір рет қайталап шығыңдар.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 3-сабақ — Ұлы дала коды"}, "grade-2/lesson-04.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 4-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Самокат, велосипед пен скейтборд тебу кезіндегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 95-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=95\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№4 сабақ         Самокат, велосипед пен скейтборд тебу кезіндегі\n             қауіпсіздік ережелері\nМақсаты          Велосипед, самокат және скейтборд тебу кезінде\n             білім алушылардың қауіпсіз әрекет ету дағдыларын\n             қалыптастыру.\nМіндеттері       - велосипед, самокат және скейтборд тебу кезіндегі\n             қауіпсіздік ережелері туралы білімдерін бекіту;\n                 - жолда және тротуарда қауіпті алдын ала байқап,\n             дұрыс әрекет ету қабілетін дамыту;\n                 - жаяу жүргіншілерге және жол қозғалысының\n             басқа да қатысушыларына өзара құрметпен қарауға\n             тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Балалар велосипеді немесе самокат, скейтборд (немесе олардың\nсуреттері); қорғаныс құралдарының жиынтығы: шлем, тізеқап,\nшынтаққап, қолғап (немесе олардың суреттері); жолдағы түрлі\nжағдайлар бейнеленген карточкалар: «тротуар», «жаяу жүргіншілер\nөткелі», «балалар алаңы», «жолдың жүріс бөлігі», «саябақ»;\nтақырыптық постер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушылардың назарын тақырыптық постерге\nаударады.\n      https://cloud.mail.ru/public/dHRB/58bQrEgcp/%D0%92%20%D1%80%D0%B\n0%D0%B1%D0%BE%D1%82%D0%B5/%D0%BF%D0%BB%D0%B0%D0%BA%D\n0%B0%D1%82%D1%82%D0%B0%D1%80/posters%203%20%D0%BA%D0%B0%D\n0%B7.jpg\n      Педагог:\n      –      Балалар, көпшілігің велосипед айдағанды, самокат пен\nскейтборд тепкенді жақсы көресіңдер. Бұл қызықты әрі денсаулыққа\nпайдалы. Бірақ қауіпсіздік ережелерін сақтамасаңдар, ойын кезінде\nжарақат алып қалуларың мүмкін.\n      Бүгін велосипед, самокат және скейтборд тепкенде қандай\nқауіпсіздік ережелерін сақтау керектігін үйренеміз.\n      II. Негізгі бөлім\n      1.     Педагог қауіпсіздіктің негізгі ережелерін түсіндіреді:\n\n      Қауіпсіздік    велосипедке     отырудан,   самокатқа   немесе\nскейтбордқа тұрудан бұрын басталады.\n      1. Қолданатын құралыңды тексер. Жолға шығар алдында\nтежегішінің, рөлінің және дөңгелектерінің дұрыс екенін тексер.\nСкейтбордтың тақтасы мен дөңгелектерінің бүтін екеніне көз жеткіз.\nЕгер ақау байқасаң, мінбе және бұл туралы ересек адамға айт.\n      2. Велосипед, самокат немесе скейтборд тепкенде қорғаныс\nқұралдарын қолдан. Міндетті түрде шлем ки. Тізеқап пен шынтаққап,\nшлем секілді қорғаныс құралдары құлаған жағдайда жарақаттан\nқорғануға көмектеседі.\n      3. Қауіпсіз жерді таңда. Велосипед, самокат және скейтбордты\nқауіпсіз әрі рұқсат етілген жерде теп. Жолдың жүріс бөлігіне шықпа.\nҚозғалысты бастамас бұрын айналаңа мұқият қара.\n      4. Жаяу жүргіншілер жолынан жаяу өт. Жаяу жүргіншілер\nөткелінің алдында тоқта. Солға қара әне оңға қара. Велосипедтен\nнемесе самокаттан түс. Скейтбордты қолыңа ал. Жолдан жаяу өт.\n      5. Айналаңдағы адамдарға мұқият бол. Жаяу жүргіншілердің\nжанында жылдамдықты арттырма, қауіпсіз арақашықтық сақта және\nалдыңа қара. Қозғалыс кезінде телефонға алаңдама және құлаққап\nқолданба.\n      2. «Қалай қауіпсіз қалай әрекет ету керек?» ойыны\n      Педагог:\n      – Енді ережелерді іс жүзінде қолдана алатындарыңды тексерейік.\nМен жағдаятты айтамын, ал сендер бұл жағдайда қалай дұрыс әрекет\nету керектігін түсіндіресіңдер.\n      1-жағдаят. Сен велосипед тебуге дайындалып жатырсың, бірақ\nтежегішінің дұрыс жұмыс істемейтінін байқадың.\n      Білім алушылардың жауабы:\n      – Велосипед теппеу, бұл туралы ересек адамға айту және ақауды\nжөндету.\n      2-жағдаят. Сен самокатпен келе жатырсың, ал алдыңда\nтротуармен адамдар жүріп келеді.\n      Жауап:\n      – Жылдамдықты азайту, адамдардан қауіпсіз арақашықтық\nсақтау, қажет болса тоқтау, самокаттан түсу.\n      3-жағдаят. Саған жолды жаяу жүргіншілер өткелі арқылы кесіп\nөту керек.\n      Жауап:\n      – Тоқтау, велосипедтен немесе самокаттан түсу, жолдың қауіпсіз\nекеніне көз жеткізу және велосипедті / самокатты жаныңа алып,\nжолдан жаяу өту.\n\n      4-жағдаят. Досың автомобильдер жолында велосипед тебуді\nұсынды.\n      Жауап:\n      – Бас тарту және велосипед тебуге қауіпсіз жерді таңдау.\n      5-жағдаят. Сен скейтборд тепкің келді, бірақ шлемің жоқ.\n      Жауап:\n      – Шлем кимей скейтборд теппеу. Алдымен қорғаныс құралдарын\nкию.\n      Педагог білім алушыларға тақырыптық постер ұсынады.\n      https://cloud.mail.ru/public/dHRB/58bQrEgcp/В%20работе/Постер\nы/КАЗ/posters%208%20каз.jpg\n      III. Қорытынды бөлім\n      «Сөйлемді аяқта» рефлексиясы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n            «Велосипед, самокат немесе скейтборд тебер алдында мен\nміндетті түрде ...».\n            «Велосипед, самокат немесе скейтборд теуіп жүргенде мен\nешқашан ...».\n            «Жаяу жүргіншілер өткелінің алдында мен ...».\n            «Бүгін мен ... түсіндім».\n      Педагог сабақтың басты ережесін айтады:\n      «Қауіпсіз серуендеу қарапайым ережелерден басталады: тексер –\nқорғаныс құралдарын ки – айналаңа қара – асықпа – мұқият бол!».\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://cloud.mail.ru/public/dHRB/58bQrEgcp/%D0%92%20%D1%80%D0%B\" target=\"_blank\" rel=\"noopener noreferrer\">https://cloud.mail.ru/public/dHRB/58bQrEgcp/%D0%92%20%D1%80%D0%B<\/a><\/p><p><a href=\"https://cloud.mail.ru/public/dHRB/58bQrEgcp/В%20работе/Постер\" target=\"_blank\" rel=\"noopener noreferrer\">https://cloud.mail.ru/public/dHRB/58bQrEgcp/В%20работе/Постер<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 4-сабақ — Ұлы дала коды"}, "grade-2/lesson-05.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 5-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Үйде өрт болған жағдайда не істеу керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 98-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=98\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№5 сабақ       Үйде өрт болған жағдайда не істеу керек?\nМақсаты        Білім алушылардың үйде/пәтерде өрт болған\n           жағдайда     қауіпісіз  әрекет   ету    дағдыларын\n           қалыптастыру\nМіндеттері     - эвакуациялау ережелерін сақтауға, өрт сөндіру\n           қызметін шақыруға және өрттің алғашқы белгілерін\n           анықтауға үйрету;\n               - қауіпті жағдайда сабырлылық сақтау, жылдам\n           әрекет ету және жағдайды дұрыс бағдарлай білу\n           дағдыларын дамыту;\n               - өз өміріне ұқыпты қарауға және өрт сөндіруші\n           мамандығына құрметпен қарауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Өрт      кезінде     өзін-өзі    ұстау  ережелері    бейнеленген\nиллюстрациялар, «Өрт болған жағдайда не істеу керек?» әрекет\nалгоритмі жазылған карточкалар, телефон макеті, 101 және 111\nнөмірлері жазылған карточкалар.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог білім алушыларға тақырыптық бейнематериалды көруді\nұсынады.\n      https://drive.google.com/file/d/1cTlChZpQ9Ni94I3kLzASqxBV_jSb\nHQoo/view?usp=sharing\n      Педагог:\n      - Балалар, өрт – қауіпті жағдай. Өрт тез таралады, ал түтіні оттан\nда қауіпті болуы мүмкін. Сондықтан үйде өрт шыққан жағдайда не\nістеу керектігін білу өте маңызды.\n      Бүгін біз өрт жағдайында бізге көмектесетін қарапайым\nережелермен танысамыз.\n      II. Негізгі бөлім\n      1. Өрт болған жағдайда не істеу керек?\n      Педагог:\n      – Түтіннің иісін сезгеніңізді немесе отты көргеніңізді елестетіп\nкөріңіздер.\n\n      1. Ересек адамға хабарла. Отты көрсең немесе түтіннің иісін\nсезсең, бірден ересек адамға айт. Қасыңда ересек адам жоқ болса 101\nнөмріне хабарлас.\n      2. Қауіпсіз жерге шық. Ғимаратта «ШЫҒУ» деген жасыл\nбелгілерге бағдарланып, ең жақын шығу есігіне қарай жүр. Ғимараттан\nтез шық. Жасырынба және ойыншықтарыңды, телефоныңды немесе\nбасқа заттарды алуға қайта кірме.\n      3. Түтіннен сақтан. Егер түтін пайда болса, еденге жақын еңкейіп\nжүр. Қою түтіннің немесе оттың арасымен өтпе. Егер сыртқа шыға\nалмасаң – есікті жап, от жоқ қауіпсіз жерде қал және көмекке шақыр.\n      4. Көмекке шақыр. Қауіпсіз жерге шыққаннан кейін 101 немесе\n112 нөміріне қоңырау шал. Не болғанын айтып, мекенжайыңды және\nаты-жөніңді хабарла.\n      Педагог қорытындылап, алгоритмді бекітеді:\n      Педагог:\n      – Алгоритмімізді бірге қайталайық:\n      Хабарла – шық – түтіннен сақтан – көмекке шақыр!\n      «Қалай әрекет етесің?» ойыны\n      Педагог:\n      – Ережелерді қайталап шықтық. Енді қауіпті жағдайда дұрыс\nәрекет ете алатындарыңды тексеріп көрейік.\n      1-жағдаят. Сен түтіннің иісін сезіп, ас бөлмеде түтінді байқадың.\nҮйде сенімен бірге анаң бар. Не істейсің?\n      Жауабы: Бірден анама хабарлаймын.\n      Маңызды! Егер табадағы май тұтанса, оны сумен өшіруге\nболмайды – бұл жалынның күрт күшеюіне және күйік алуға әкелуі\nмүмкін. Өртті өз бетіңше сөндіруге тырыспа – ересек адамды шақыр\nжәне қажет болған жағдайда 101 нөміріне қоңырау шал.\n      2-жағдаят. Сен пәтерден шықтың, бірақ ішінде сүйікті сөмкең\nқалып қойды. Оны алу үшін қайта кіресің бе?\n      Жауабы: Жоқ. Өрт кезінде заттарды алу үшін қайта кіруге\nболмайды.\n      3-жағдаят. Бөлмеде түтін пайда болды. Қауіпсіз шығатын жерге\nқарай қалай қозғалу керек?\n      Жауабы: Қою түтін болса, еңкейіп немесе еңбектеп қозғалып,\nауыз бен мұрынды мата немесе киіммен жабу керек.\n      Педагог:\n      – Жарайсыңдар! Ал егер қасыңда ересек адам болмаса және\nкөмек шақыру қажет болса, қай нөмірге қоңырау шаламыз?\n      Білім алушылардың жауаптары: 101 немесе 112.\n\n      «Таза Қазақстан» бастамасы бізге тазалықтың қауіпсіздікті\nсақтауға көмектесетінін еске салады. Аулада жатқан қоқыс пен қураған\nшөп оңай тұтануы мүмкін. Сондықтан қоқысты, шөпті өртеуге және\nотпен ойнауға болмайды. Ауладағы тазалықты сақтай отырып, біз\nтабиғатты, өз үйімізді және адамдардың қауіпсіздігін қорғаймыз.\n      III. Қорытынды бөлім\n      «Сөйлемді аяқта» рефлексиясы\n      Педагог білім алушыларға төмендегі сөйлемдердің бірін\nаяқтауды ұсынады:\n      «Егер мен отты көрсем, …»\n      «Егер мен түтіннің иісін сезсем, …»\n      «Өрт кезінде … болмайды»\n      «Бүгін мен … есімде сақтадым»\n\nҚазақстан Республикасы Денсаулық\nсақтау министрлігі ұсынған қауіпсіздік\nсабағы<\/div><p><a href=\"https://drive.google.com/file/d/1cTlChZpQ9Ni94I3kLzASqxBV_jSb\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1cTlChZpQ9Ni94I3kLzASqxBV_jSb<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 5-сабақ — Ұлы дала коды"}, "grade-2/lesson-06.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 6-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Ауырып немесе жарақаттанып қалғанда кімнен көмек сұрау керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 101-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=101\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№ 6 сабақ           Ауырып немесе жарақаттанып қалғанда\n                кімнен көмек сұрау керек?\nМақсаты             Білім алушылардың ауыру не жарақаттану\n                жағдайында қауіпсіз әрекет ету дағдыларын\n                қалыптастыру\nМіндеттері          – білім алушыларды ауырып немесе\n                жарақаттанып қалған жағдайда кімнен көмек\n                сұрау керектігімен таныстыру;\n                    – өз жағдайын дұрыс бағалап, қауіпсіз әрекет\n                етуге және ересек адамға дер кезінде хабарлауға\n                үйрету;\n                    – өз денсаулығына ұқыпты қарауға және қажет\n                кезде көмек сұраудан тартынбауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Көмек      көрсететін   адамдардың      суреттері  бейнеленген\nкарточкалар: ата-аналар, педагог, мектеп медбикесі, полиция\nқызметкері, жедел жәрдем дәрігері.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, кейде ойнап жүргенде, серуендегенде немесе сабақ\nкезінде құлап қалуымыз, бір жерімізді ауыртып алуымыз не өзімізді\nжайсыз сезінуіміз мүмкін. Мұндай кезде үндемей қалмай, бірден ересек\nадамға айтып, көмек сұрау керек.\n      Бүгін біз ауырып қалғанда немесе жарақат алған кезде кімге\nжүгіну керектігін білеміз.\n      II. Негізгі бөлім\n      Педагог:\n      – Көмек көрсететін адамдар әртүрлі болады және кімге жүгіну\nкеректігі сіздің қай жерде жүргеніңізге байланысты. Ендеше, негізгі үш\nорынды қарастырайық.\n      1-жағдаят: Мектепте\n      Сен үзіліс кезінде жүгіріп жүріп құлап қалдың, тізеңді қатты\nжарақаттап алдың немесе басың қатты ауырды. Кімге барасың?\n\n      Дұрыс жауап: Сынып жетекшісіне немесе дәлізде жүрген кез\nкелген ересек адамға. Педагог сені бірден мектептің медициналық\nкабинетіне апарады. Онда медбике алғашқы көмек көрсетіп, ата-анаңа\nхабарласады.\n      Не істеуге болмайды: Дәретханаға тығылуға, ауырсынуға\nшыдап жүре беруге және жылап отыруға, сабақ үстінде жалғыз өзіңе\nүйге қайтуға болмайды.\n      2-жағдаят: Үйде жалғыз қалғанда\n      Сен қайшымен қағаз қиып отырып, саусағыңды жарақаттап\nалдың.\n      1-қадам: Бірден ата-анаңа немесе қасыңда жүрген басқа ересек\nадамға хабарла.\n      2-қадам: Егер үйде жалғыз болсаң – ата-анаңа немесе басқа\nжақын ересек адамға қоңырау шал.\n      3-қадам: Егер қасыңда ересек адам болмаса, ата-анаңмен\nбайланысу мүмкін болмаса, қауіпті жағдай туындаса – 103 немесе\n112 нөміріне қоңырау шал.\n      3-жағдаят: Көшеде (балалар алаңында, саябақта)\n      Сен әткеншектен құлап қалдың немесе аяғыңды ауыртып алдың.\nЖаныңда ата-анаң жоқ.\n      Көмек көрсететін адамды дұрыс таңдау: Егер телефоның болса –\nата-анаңа қоңырау шал. Егер телефон болмаса – өз жұмысына\nбайланысты көмек көрсете алатын ересек адамға: полиция\nқызметкеріне, күзетшіге, дүкен, дәріхана немесе басқа да мекеме\nқызметкеріне жүгін.\n      Егер мұндай ересек адамдар қасыңда болмаса, адамдар көп жерде\nболып, балалары бар ересек адамнан көмек сұрауға болады.\n      Кімге жүгінбеген дұрыс:\n      Егер қасыңда көмек көрсету және қауіпсіздікті қамтамасыз етуге\nбайланысты жұмыс істейтін ересек адамдар болса, кездейсоқ бейтаныс\nадамдарға жүгінбе.\n      Бейтаныс адаммен бірге басқа жерге кетпе және ол көмектесемін\nдесе де, оның көлігіне отырма.\n      Педагог:\n      – Кейде үйде ересек адам болмаған кезде саған немесе\nжаныңдағы адамға көмек қажет болуы мүмкін. Осындай жағдайда\nжедел қызметке қалай дұрыс хабарласу керектігін білу маңызды.\nЕндеше, телефон арқылы көмек шақыруды үйренейік.\n      Педагог телефон макетін алып, өзін «Диспетчер» ретінде\nкөрсетеді, ал білім алушы екінші телефонды алып, «Бала» рөлін\nатқарады.\n\n      Диспетчер: «112 құтқару қызметі. Сізге не болды?»\n      Бала: «Сәлеметсіз бе. Менің аты-жөнім – Әлібек Сәменов. Мен 8\nжастамын. Мен үйде жалғызбын, ішім қатты ауырып тұр, орнымнан\nтұра алмаймын».\n      Диспетчер: «Әлібек, мекенжайыңды айт».\n      Бала: «... қаласы, Абай көшесі, 5-үй, 12-пәтер».\n      Диспетчер: «Көмек жолға шықты. Пәтерден ешқайда шықпа,\nбейтаныс адамдарға есік ашпа, дәрігерлерді күт».\n      Педагог:\n      – Жарайсың, Әлібек! Балалар, байқадыңдар ма? Әлібек\nжыламады, өзінің аты-жөнін, не болғанын және ең бастысы – нақты\nмекенжайын айтты.\n      Педагог білім алушыларға тақырыптық бейнематериалды көруді\nұсынады.\n    https://drive.google.com/file/d/1WvB65-\nfQwf0pTejx5v0PdLD4t6Cur2Y3/view?usp=sharing\n      III. Қорытынды бөлім\n      Рефлексия\n      Педагог білім алушыларға төмендегі сөйлемдерді аяқтауды\nұсынады:\n           «Егер мен өзімді нашар сезінсем, …»\n           «Егер мен мектепте жарақат алсам, …»\n           «Егер маған шұғыл көмек қажет болса, … нөміріне\nқоңырау шала аламын»\n           «Бүгін мен … есімде сақтадым»\n      Педагог қорытындылайды:\n      -     Егер бір жерің ауырса немесе өзіңді нашар сезінсең –\nүндемей қалма және мәселені жалғыз шешуге тырыспа. Өзің сенетін\nересек адамнан көмек сұра. Ал егер төтенше жағдай туындап, қасыңда\nересек адам болмаса – 103 немесе 112 нөміріне қоңырау шал.\n      Қарапайым тәртіпті есте сақта: ересек адамға хабарла – не\nболғанын түсіндір – қажет болса көмек шақыр.\n\nҚазақстан Республикасы Ішкі істер\nминистрлігі ұсынған қауіпсіздік сабағы<\/div><p><a href=\"https://drive.google.com/file/d/1WvB65-\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1WvB65-<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 6-сабақ — Ұлы дала коды"}, "grade-2/lesson-07.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 7-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Қандай сілтемелерді ашуға болмайды?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 104-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=104\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№7 сабақ       Қандай сілтемелерді ашуға болмайды?\nМақсаты        Білім алушылардың интернет желісіндегі қауіпсіз\n           мінез-құлық дағдыларын және жасырын қауіптерді\n           тани білу қабілетін қалыптастыру\nМіндеттері     - сілтеменің не екенін және кейбір сілтемелердің\n           неліктен қауіпті болуы мүмкін екенін түсіндіру;\n               - бейтаныс хабарлама алған кезде мұқият болу\n           және қауіпсіз шешім қабылдай білу дағдыларын\n           дамыту;\n               - интернетті     пайдалануға    жауапкершілікпен\n           қарауға және қажет болған жағдайда ата-анадан немесе\n           педагогтен көмек сұрауға тәрбиелеу.\n\n      Материалдар мен ресурстар\n      «Қауіпсіз» және «Қауіпті» карточкалары, «Қармаққа түсіп\nқалма!» ойынына арналған балықтың, қармақтың және «ілмектердің»\nсуреттері.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, балықты қалай аулайтынын білесіңдер ме? Ол үшін не\nпайдаланады?\n(Білім алушылардың жауаптары: қармақ, ілмек, жем).\n      Педагог:\n      – Балық жемді көріп, қармаққа түсіп қалуы мүмкін. Интернетте\nде адамды қызықтыратын «жем» сияқты сілтемелер кездеседі. Олар\nсыйлық, жүлде, тегін ойын немесе басқа да қызықты нәрселерді\nұсынуы мүмкін. Мұндай хабарламалар адамды сілтемені бірден басуға\nқызықтырады.\n      Бірақ кез келген сілтеме қауіпсіз бола бермейді. Сондықтан бүгін\nбіз күмәнді хабарламаларды ажыратуды үйренеміз және басты\nережемен танысамыз:\n      «Сенімді болмасаң – баспа, ересек адамға көрсет!».\n      II. Негізгі бөлім\n      Педагог білім алушыларға бейнематериалды көруді ұсынады.\n\n      https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj\nVOYfcO/view?usp=sharing\n      Педагог:\n      – Балалар, сілтеменің не екенін білесіңдер ме?\n      Білім алушылардың жауаптары.\n      Педагог түсіндіреді:\n      – Сілтеме – бізді басқа бетке, сайтқа, бейнематериалға немесе\nойынға апаратын цифрлық жол. Сілтемелер пайдалы болуы мүмкін,\nбірақ олардың арасында күмәнділері де кездеседі. Сондықтан кез\nкелген сілтемені басуға болмайды.\n      Педагог:\n      – Қай кезде тоқтап, ересек адамдның көмегіне жүгіну керектігін\nқалай түсінуге болады? Әсіресе мынадай хабарламаларға мұқият\nболыңдар:\n            хабарлама бейтаныс адамнан келсе;\n            күтпеген сыйлық, жүлде немесе ойын ішіндегі заттарды\nуәде етсе;\n            асықтырса: «Тез бас!», «Тек бүгін ғана!»;\n            қорқытса: «Тез бас, әйтпесе телефоның бұғатталады!»;\n            құпиясөзді немесе басқа да жеке мәліметтерді енгізуді\nсұрайтын хабарламалар.\n      Педагог:\n      – Қарапайым ережені есте сақтаңдар: «Сенімді болмасаң – баспа,\nересек адамға көрсет!».\n      Педагог:\n      – Балалар, алаяқтардың тағы бір айласы – сілтеме арқылы басқа\nсайтқа өтуге мәжбүрлеу. Сілттемені басқанда басқа сайтқа өтесіңдер.\nОл жерде телефондарыңды вирус зақымдауы мүмкін, ал алаяқтар ата-\nаналарыңның ақшасын немесе ойындардағы аккаунттарыңды ұрлауы\nмүмкін.\n      «Қармаққа түсіп қалма!» ойыны\n      Педагог:\n      – Қазір мен әртүрлі хабарламаларды оқимын. Егер хабарлама\nқауіпсіз деп ойласаңдар – бір рет қол шапалақтаңдар. Ал егер\nхабарлама күмәнді болып көрінсе – қолдарыңды айқастырып,\n«Баспаймын!» деп айтыңдар.\n      1-жағдаят\n      Анаң алдын ала саған оқу бейнематериалының сілтемесін\nжіберетінін айтты және оны отбасылық чатқа жіберді.\n      Білім алушылар қол шапалақтайды.\n      2-жағдаят.\n\n      Кенеттен мынадай хабарлама келді: «Құттықтаймыз! Сен жаңа\nтелефон ұтып алдың! Сыйлықты алу үшін мына жерді бас!»\n      Білім алушылар: «Баспаймын!»\n      3-жағдаят.\n      Бейтаныс ойыншы саған: «Тегін ойын заттарын алғың келе ме?\nТезірек сілтемеге өт!» – деп жазды.\n      Білім алушылар: «Баспаймын!»\n      4- жағдаят.\n      Педагог алдын ала мектеп чатына оқу тапсырмасының сілтемесін\nжіберетінін айтты және сол сілтемені жіберді.\n      Білім алушылар қол шапалақтайды.\n      5-жағдаят.\n      Экранда мынадай хабарлама пайда болды: «Шұғыл! Мына жерді\nбас, әйтпесе ойының бұғатталады!»\n      Білім алушылар: «Баспаймын!»\n      Педагог:\n      – Жарайсыңдар! Егер бейтаныс хабарлама сендерді асықтырса,\nқорқытса немесе күтпеген сыйлық ұсынса, сілтемені өз беттеріңше\nбаспаңдар, хабарламаны ересек адамға көрсетіңдер.\n      III. Қорытынды бөлім\n      1. «Үш қадам» жаттығуы\n      Педагог:\n      – Егер бейтаныс немесе күмәнді сілтемені көрсеңдер, не істеу\nкерек? Үш қадамды есте сақтайық:\n      1. Тоқта! – Бірден баспа.\n      2. Ойлан! – Сілтемені кім жіберді және не үшін?\n      3. Сұра! – Сілтемені ата-анаңа немесе педагогке көрсет.\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n           «Егер бейтаныс адам маған сілтеме жіберсе, мен…»\n           «Егер сілтемені басқаным үшін маған сыйлық уәде етсе,\nмен…»\n           «Егер хабарлама мені қорқытса немесе асықтырса, мен…»\n           «Егер сілтемені басуға болатынына сенімді болмасам,\nмен…»\n      Педагог:\n      – Есте сақтаңдар: интернетте алдымен тексеріп алған дұрыс,\nсодан кейін ғана басу керек. Біздің басты ережеміз:\n      «Сілтеменің қауіпсіз екеніне сенімді болмасаң – баспа, ересек\nадамға көрсет!».<\/div><p><a href=\"https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1MWXo7_JNDjaF0E09n5rXehgMAj<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 7-сабақ — Ұлы дала коды"}, "grade-2/lesson-08.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 8-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Интернеттегі ақпараттың бәріне сенуге бола ма?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 107-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=107\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№8 сабақ         Интернеттегі ақпараттың бәріне сенуге бола ма?\nМақсаты         Білім алушылардың интернеттегі шынайы және\n              күмәнді ақпаратты ажырата білу дағдыларын\n              қалыптастыру\nМіндеттері       балаларға     «ақпаратты   тексеру»  ұғымын\n              таныстыру;\n                 интернеттегі күмәнді ақпаратты байқай білу,\n              мұқият болу дағдыларын дамыту;\n                 ақпаратты жауапкершілікпен тұтыну мәдениетін\n              қалыптастыру.\n\n      Материалдар мен ресурстар\n      Шынайы және ойдан шығарылған жаңалықтар бейнеленген\nиллюстрациялар, «Сенемін» және «Тексеремін» карточкалары,\nсалыстыруға арналған шынайы және өңделген суреттер.\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, қараңдаршы, интернеттен қандай ерекше жаңалық\nкөрдім: «Ғалымдар ұшатын иттердің жаңа тұқымын шығарды!».\n      Қалай ойлайсыңдар, бұл рас па?\n      Білім алушылардың жауаптары.\n      Педагог:\n      – Әрине, бұл – ойдан шығарылған ақпарат. Суретті өзгертуге, ал\nмәтінді ойдан құрастыруға болады. Ендеше, интернеттен көрген және\nоқыған нәрселердің бәріне бірден сене беруге бола ма?\n      Білім алушылардың жауаптары.\n      Педагог:\n      – Бүгін біз интернет-із кесушілерге айналып, күмәнді ақпаратты\nқалай тексеру керектігін үйренеміз.\n      II. Негізгі бөлім\n      1. «Сенемін бе, әлде тексеремін бе?» ойыны\n      Педагог:\n      – Қазір сендер интернет-із кесуші боласыңдар. Мен интернетте\nкездесуі мүмкін хабарламаларды оқимын. Сендердің міндеттерің –\nақпаратқа сенуге бола ма, әлде алдымен оны тексеру керек пе, соны\nанықтау.\n      1-жағдаят.\n      Мектеп чатында біреу: «Ертең сабақтар бір сағатқа кеш\nбасталады», – деп жазды. Хабарламаны кім жібергені белгісіз.\n\n      Жауабы: «Тексеремін!»\n      Неліктен? Сабақ кестесінің өзгергенін педагогтен немесе ата-\nанадан нақтылап алу қажет.\n      2-жағдаят.\n      Интернетте: «Ертең біздің қалада қалың қар жауады,\nмектептердегі сабақтар тоқтатылады», – деген жазуы бар бейне пайда\nболды.\n      Жауабы: «Тексеремін!»\n      Неліктен? Бейне мен оның астындағы жазу ақпараттың ресми\nекенін білдірмейді. Ересек адамнан сұрап, мектептің хабарламасын\nтексеру қажет.\n       3-жағдаят.\n      Досың: «Телефонды мұздатқышқа 10 минутқа қойсаң, оның\nқуаты ұзаққа жетеді деп оқыдым», – деп хабарлама жіберді.\n      Жауабы: «Тексеремін!»\n      Неліктен? Интернеттегі барлық кеңес қауіпсіз бола бермейді.\nЕресек адамның көмегінсіз техникалық құрылғылармен тәжірибе\nжасауға болмайды.\n      4-жағдаят.\n      Интернетте: «Егер тамағың қатты ауырса, бірден бірнеше\nтаблетка іш – сонда тезірек әсер етеді», – деп жазылған.\n      Жауабы: «Тексеремін!»\n      Неліктен? Дәрі-дәрмекке қатысты кеңестерді өз бетінше\nорындауға болмайды. Ересек адамнан не дәрігерден кеңес алу қажет.\n      2. «Көрдің – ойландың – тексердің» алгоритмі\n      Педагог:\n      – Балалар, біз күмәнді ақпараттың шынайы ақпаратқа өте ұқсас\nболып көрінуі мүмкін екенін білдік. Егер оның рас-өтірігін\nбілмесеңдер, қалай әрекет ету керек? Үш қадамды есте сақтайық.\n      1. Тоқта және ойлан. Ақпаратқа бірден сенуге, оны басқа\nадамдарға жіберуге немесе ондағы кеңесті орындауға асықпа.\n      2. Ақпаратты кім хабарлағанын анықта. Бұл мектептің сайты ма,\nпедагог пе, ата-ана ма, әлде бейтаныс адам ба? Ақпараттың қайдан\nшыққаны түсінікті ме?\n      3. Ересек адаммен бірге тексер. Хабарламаны, суретті немесе\nбейнені ата-анаңа немесе педагогке көрсет. Бірге сенімді дереккөзден\nақпаратты тексеріңдер.\n      Педагог:\n      – Тағы бір маңызды ереже: егер ақпарат сендерді қорқытса, қатты\nтаңғалдырса немесе шұғыл түрде әрекет жасауға итермелесе, бірден\nәрекет етпеңдер. Алдымен оны ересек адамға көрсетіңдер.\n\n      Барлығы бірге қайталайды:\n      «Сенуге асықпа – ойлан және тексер!».\n      III. Қорытынды бөлім\n      Педагог:\n      – Балалар, бүгін біз интернеттегі ақпараттың бәрі бірдей шынайы\nбола бермейтінін білдік. Тіпті сурет, бейне немесе хабарлама да\nнанымды көрінуі мүмкін, бірақ оның ішінде қате немесе ойдан\nшығарылған ақпарат болуы ықтимал.\n      Педагог:\n      – Алгоритмімізді еске түсірейік. Егер ақпарат күмән тудырса, не\nістеу керек?\n      Білім алушылар қайталайды:\n      «Тоқта – ойлан – тексер!»\n      «Сөйлемді аяқта» рефлексиясы\n      Педагог білім алушыларға сөйлемдерді жалғастыруды ұсынады:\n           «Егер мен интернеттен ерекше жаңалық көрсем, мен…»\n           «Хабарламаны досыма жібермес бұрын, мен…»\n           «Егер ақпараттың шынайы екеніне сенімді болмасам,\nмен…»\n      Педагог қорытындылайды:\n      – Ақпарат интернетте жарияланғаны үшін ғана оған сенуге\nболмайды. Мұқият пайдаланушы алдымен ойланады, ақпаратты\nтексереді, содан кейін ғана қорытынды жасайды.\n      Сабақтың басты ережесі:\n      «Сенуге асықпа – ойлан және тексер!».\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 8-сабақ — Ұлы дала коды"}, "grade-2/lesson-09.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 9-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Үйдегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 110-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=110\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№9 сабақ        Үйдегі қауіпсіздік ережелері\nМақсаты         Білім алушылардың үйдегі тұрмыстық жағдайларда\n           қауіпсіз мінез-құлық дағдыларын қалыптастыру\nМіндеттері      - үйдегі негізгі қауіпсіздік ережелері туралы\n           білімдерін бекіту;\n                - қауіпті жағдайларды тани білу және әрекет етудің\n           қауіпсіз тәсілін таңдай білу дағдыларын дамыту;\n                - өз денсаулығы мен айналасындағылардың\n           қауіпсіздігіне жауапкершілікпен және ұқыпты қарауға\n           тәрбиелеу.\n\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, араларыңда үйде қысқа уақытқа жалғыз қалғандарың\nбар ма?\n(Білім алушылар қолдарын көтереді.)\n      Педагог:\n      – Үй – біз демалатын, ойнайтын және өзімізді қауіпсіз сезінетін\nорын. Бірақ үйде де мұқият болу керек, өйткені кейбір заттар мен\nжағдайлар қауіпті болуы мүмкін.\n      – Бүгін біз үйде қалай қауіпсіз ойнап, демалуға болатынын\nүйренеміз.\n      II. Негізгі бөлім\n      Педагог үйдегі негізгі қауіпті аймақтарды қарастырады.\n      1. Терезелер мен балкон\n      Педагог:\n      – Елестетіп көріңдер: терезенің сыртында әдемі құс пайда болды.\nОны жақынырақ көргілерің келеді. Терезе алдына шығуға немесе\nмоскит торынасүйенуге бола ма?\n      (Білім алушылардың жауаптары.)\n      Ереже:\n      Терезені өз бетіңше ашуға, терезе алдына шығуға, терезеден\nеңкеюге немесе москит торға сүйенуге болмайды. Москиттік тор құлап\nкетуден қорғамайды. Терезені желдету үшін ересек адам ашуы керек.\n      2. Қауіпті ойындар\n\n      Педагог:\n      – Биік жиһаздан секіруге, шкафқа шығуға немесе кереуеттің\nжоғарғы қабатында ойнауға бола ма?\n      Ереже:\n      Жиһаз – қауіпті ойын ойнайтын орын емес. Шкафтарға,\nсөрелерге және басқа да биік заттарға шығуға, олардан секіруге\nболмайды. Белсенді ойындар үшін қауіпсіз орынды таңдау қажет.\n      2. Электр энергиясы\n      Педагог:\n      – Әлібек планшетпен ойнап отырды. Планшетінің қуаты\nтаусылды. Зарядтағыштың жанында зақымдалған сымды байқап\nқалды. Бұл жағдайда не істеу керек?\n      (Білім алушылардың жауаптары.)\n      Ереже:\n      Зақымдалған сымдарға, электр розеткаларына және электр\nқұрылғыларына су қолмен жақындауға. Розеткаға бөгде заттарды\nсұғуға болмайды. Егер ұшқын, түтін немесе зақымдалған сымды\nбайқасаң – оған қол тигізбе, қауіпсіз жерге шегін де, бірден ересек\nадамға хабарла.\n      Егер өрт шықса немесе тікелей қауіп төнсе – 101 немесе\n112 нөміріне қоңырау шал.\n      3. Дәрі-дәрмектер және тұрмыстық химия\n      Педагог:\n      – Үстелдің үстінде кәмпитке ұқсайтын түрлі түсті дәрілер жатыр,\nал жуынатын бөлмеде ішінде түрлі түсті сұйықтығы бар бөтелке тұр.\nОларға қол тигізуге немесе дәмін татып көруге бола ма?\n      (Білім алушылардың жауаптары.)\n      Ереже:\n      Дәрі-дәрмектер мен тұрмыстық химия – ойыншық емес. Дәрі-\nдәрмектер мен тұрмыстық химия құралдарын өз бетіңше алуға,\nқолдануға немесе араластыруға болмайды. Бала дәрі-дәрмекті тек\nжауапты ересек адамның рұқсатымен және бақылауымен қабылдайды.\n      «Кім бұл?» ойын-тренажері\n      Педагог:\n      – Елестетіп көріңдер: Айбек үйде отыр. Кенет есік қоңырауы\nсоғылды. Есіктің сыртында бейтаныс адам тұр. Айбек не істеуі керек?\n      (Білім алушылардың жауаптары.)\n      Педагог:\n      – Қарапайым әрекет ету тәртібін есте сақтайық.\n      1. Бейтаныс адамға есік ашпа.\n\n      2. Үйде жалғыз екеніңді айтпа және жеке мәліметтеріңмен\nбөліспе.\n      3. Ата-анаңа немесе өзің сенетін басқа ересек адамға қоңырау\nшалып, не болып жатқанын айт.\n      4. Егер адам есікті ашуға тырысса, қорқытса немесе қауіп\nтуындаса – есіктен алыстап, қауіпсіз жерге бар да, 102 немесе\n112 нөміріне қоңырау шал.\n      5. Ата-анаңның    немесе     төтенше    жағдайлар     қызметі\nдиспетчерінің нұсқауларын орында.\n      Педагог:\n      – Адам өзін газды тексеруге келген қызметкермін, сәлемдеме\nәкелдім немесе ата-анаң жіберді деп таныстырса да, бейтаныс адамға\nөз бетіңше есік ашуға болмайды. Алдымен ата-анаңмен байланысу\nкерек.\n      Педагог білім алушыларға тақырыптық бейнематериалды көруді\nұсынады.\nhttps://www.youtube.com/watch?v=Ak3skdTL3PY\n      III. Қорытынды бөлім\n      «Сөйлемді аяқта» рефлексиясы\n      Педагог сөйлемдерді бастап айтады, білім алушылар\nжалғастырады:\n      – Бүгін мен үйде қауіпсіз болу үшін ... екенін білдім.\n      – Үйде қауіпті затты көрсем, мен ... .\n      – Электр құралдарына ... .\n      – Дәрі-дәрмекті өз бетімше ... .\n      – Егер не істеу керектігін білмесем, ... .\n      – Қауіпті жағдай болса, мен ... .\n      Педагог қорытындылайды:\n      – Үйде қауіпсіз болу үшін ережелерді сақтау маңызды. Қауіпті\nзаттарға тиіспеңдер, өз беттеріңше әрекет етпеңдер. Егер бір нәрсеге\nкүмәндансаңдар, ересек адамнан көмек сұраңдар.<\/div><p><a href=\"https://www.youtube.com/watch?v=Ak3skdTL3PY\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=Ak3skdTL3PY<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 9-сабақ — Ұлы дала коды"}, "grade-2/lesson-10.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 10-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Көшедегі жануарлардан қалай сақтану керек?<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 113-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=113\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№10 сабақ             Көшедегі жануарлардан қалай сақтану\n              керек?\nМақсаты             Балаларда қаңғыбас жануарлармен қауіпсіз\n              әрекеттесу дағдыларын қалыптастыру\nМіндеттері          - жануарлардағы агрессия белгілерін танып-\n              білуге, ит немесе мысық жақындаған жағдайда әрекет\n              ету алгоритмін меңгерту;\n                    - қиын жағдайда сабыр сақтауға, өз эмоцияларын\n              бақылауға үйрету;\n                    - қатыгездікке     немесе        жануарлардың\n              агрессиясын қоздыруға жол бермейтін, жануарларға\n              ізгілікпен қарау көзқарасын тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Әртүрлі жағдаяттар бейнеленген суреттер (ит ұйықтап жатыр,\nтамақтанып жатыр, күшіктерімен ойнап жатыр, иесімен серуендеп\nжүр), әр білім алушыға арналған «Жануарлармен қауіпсіз кездесу»\nжадынамасы (чек-парақ).\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог:\n      – Балалар, иттер мен мысықтарды кім жақсы көреді, қолдарыңды\nкөтеріңдер?\n      (Білім алушылар қолдарын көтереді.)\n      – Жануарлар – біздің достарымыз. Бірақ көшеде жүрген иттер\nмен мысықтарға абай болу керек. Олар қорқуы, ашулануы немесе өзін\nқорғауға тырысуы мүмкін. Сондықтан жануарға жақындамас бұрын\nоның қимылына назар аудару маңызды. Бүгін біз көшедегі\nжануарлармен кездескенде қалай қауіпсіз әрекет ету керектігін\nүйренеміз.\n      II. Негізгі бөлім\n      Педагог суреттерді көрсетіп, жануарлардың мінез-құлқындағы\nбелгілерді түсіндіреді:\n      Егер ит ырылдаса, үрсе, тістерін ақситса немесе мазасызданса –\nоған жақындама. Тіпті бейтаныс ит сабырлы болып көрінсе де, оған өз\nбетіңше жақындауға болмайды.\n      Бейтаныс итке жақындауға, оны сипауға, тамақтандыруға немесе\nонымен ойнауға тырысуға болмайды. Егер жанында иесі болса,\nалдымен одан рұқсат сұрап, оның нұсқауларын орындау керек.\n      Педагог:\n\n      – Иттің сақтануға көмектесетін ең маңызды үш ережені есте\nсақтаңдар:\n      1. Егер бейтаныс ит жақындаса, қашпа және кенет қимыл жасама.\nТоқтап, сабыр сақтауға тырыс.\n      2. Итке тесіле қарап, көзіне ұзақ уақыт тік қарауға болмайды. Ит\nүшін тікелей және ұзақ қарау қауіп ретінде қабылдануы мүмкін.\n      3. Қолыңды бұлғап, айқайлауға болмайды. Кенет қимылды ит\nшабуыл ретінде қабылдап, жауап ретінде тістеп алуы мүмкін.\n      Педагог:\n      – Балалар, алдарыңнан әдемі итті қарғыбаумен жетектеп адам\nкеле жатқанын елестетіп көріңдер. Сендер оны сипағыларың келеді.\nОны сипауға бола ма?\n      (Балалардың жауаптары.)\n      Педагог:\n      – Егер ит иесімен серуендеп жүрсе және оны сипағыларың келсе,\nалдымен: «Итіңізді сипауға бола ма?» – деп сұраңдар. Иесі рұқсат\nберсе, оның нұсқауын орындап барып қана жақындаңдар. Егер рұқсат\nбермесе, ренжімеңдер және жануарға тиіспеңдер.\n      Бейтаныс ит саған жақындаса\n      Педагог:\n      – Ал егер итке сен жақындамасаң, керісінше, иттің өзі саған\nжақындаса, не істеу керек?\n      Есте сақтаңдар:\n      1. Тоқта. Қашпа.\n      2. Сабырлы түрде қозғалмай тұр. Айқайлама және қолыңды\nбұлғама.\n      3. Итке тесіле көзіне ұзақ қарама және оны сипауға тырыспа.\n      4. Ит алыстап кеткен кезде, сабырлы түрде қауіпсіз жерге кетіп,\nболған жағдайды ересек адамға айт.\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n     https://www.youtube.com/watch?v=ic4oV6O3W4Q&amp;list=P\n     LA5eCSY2FeoT00B3gyDuskOvkalEx7TmU&amp;index=23\n     III. Қорытынды бөлім\n     Рефлексия\n     Сөйлемдерді аяқтаңдар:\n      «Егер мен көшеде итті көрсем, мен…»\n      «Егер ит маған жақындаса, мен…»\n      «Егер жануар мені тістеп немесе тырнап алса, мен…\n\nҚазақстан Республикасы Төтенше\nжағдайлар министрлігі ұсынған\nқауіпсіздік сабағы<\/div><p><a href=\"https://www.youtube.com/watch?v=ic4oV6O3W4Q&amp;list=P\" target=\"_blank\" rel=\"noopener noreferrer\">https://www.youtube.com/watch?v=ic4oV6O3W4Q&amp;list=P<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 10-сабақ — Ұлы дала коды"}, "grade-2/lesson-11.html": {"html": "<header><div class=\"wrap\"><a href=\"index.html\">❖ ҰЛЫ ДАЛА КОДЫ · Басты бет<\/a><h1>2-сынып · 11-сабақ<\/h1><nav><a href=\"tarbie.html\">Тәрбие әлемі<\/a><a href=\"kauipsizdik.html\">Қауіпсіздік сабақтары<\/a><a href=\"normativ.html\">Құқықтық база<\/a><\/nav><\/div><\/header><main><a href=\"#/grade-2/index.html\">← 2-сынып тақырыптары<\/a><article><h2>Мұз үстіндегі қауіпсіздік ережелері<\/h2><p>Дереккөз: жүктелген әдістемелік ұсыным, 115-беттен бастап.<\/p><a class=\"btn\" href=\"safety-source.pdf#page=115\" target=\"_blank\">PDF-тегі түпнұсқа сабақ ↗<\/a><button onclick=\"window.print()\">Басып шығару<\/button><div class=\"source-text\">№11 сабақ       Мұз үстіндегі қауіпсіздік ережелері\nМақсаты         Білім алушылардың қысқы және көктемгі\n           кезеңдерде мұз үстіндегі қауіпсіз мінез-құлық\n           дағдыларын қалыптастыру\nМіндеттері      мұздың     сыртқы    белгілеріне   қарап,   су\n           айдынындағы қауіпті учаскелерді анықтауға үйрету;\n                сабырлылық сақтауға және жағдайды бақылауда\n           ұстай білу дағдыларын дамыту;\n                өз өміріне жауапкершілікпен қарау және сақтық\n           сезімін тәрбиелеу.\n\n      Материалдар мен ресурстар\n      Мұз үстіндегі қауіпсіз және қауіпті әрекеттер бейнеленген\nиллюстрациялар; мұздың әртүрлі түрлерінің суреттері (мөлдір, ақ, қара,\nқар басқан); әр білім алушыға арналған «Мұз үстіндегі қауіпсіздік\nережелері» жаднамасы (чек-парақ).\n      Сабақ барысы\n      I. Кіріспе бөлім\n      Педагог әңгіме оқиды:\n      « Қаңтар айында бір күні Асқар үйіне қайтып келе жатты. Жолда\nол тоғанның жанынан өтті. Кенет мұздың үстінде жылтырап жатқан\nтиынды көрді.\n      Асқар: «Тиынды тез ғана алып қайтамын», – деп мұздың үстіне\nшықты. Ол бірнеше қадам жасаған кезде аяқ астындағы мұз сықырлай\nбастады...»\n      Сыныпқа арналған сұрақтар:\n            Асқармен не болуы мүмкін?\n            Ол қандай қателік жасады?\n            Оның орнына не істеу керек еді?\n      II. Негізгі бөлім\n      Педагог білім алушыларға тақырыптық бейнематериалды\nкөруді ұсынады.\n    https://drive.google.com/file/d/1E1qqMgQYhsvEQtIz4nxCf\nHXlkoAIyjhy/view?usp=sharing\n      Педагог мұздың неліктен қауіпті екенін және қандай әрекеттерге\nүзілді-кесілді жол берілмейтінін түсіндіреді.\n\n      Мұздың қалыңдығы алдамшы болуы мүмкін. Мұз біркелкі\nқатпайды. Жағада және ағыс бар жерлерде мұз әрдайым жұқалау\nболады.\n      Мұздың беріктігін өз бетіңше тексерме. Ересектерсіз және\nарнайы рұқсат етілген, жабдықталған жерде болмаса, мұз үстіне\nшықпа.\n      Қардың астында жарықтар мен ойықтар көрінбеуі мүмкін.\n      Қыста су айдынының маңындағы қауіпсіз мінез-құлық\nережелері\n      1. Ересек адамсыз мұз үстіне шықпа. Мұз үстінде сырғанауға\nжәне жүруге тек арнайы рұқсат етілген, қауіпсіздік талаптарына сай\nжабдықталған жерлерде және ересек адамның бақылауымен ғана\nболады.\n      2. Мұздың берік екенін өз бетіңше тексеруге болмайды. Оны\nаяғыңмен басып немесе затпен ұрып тексерме.\n      3. Қауіпті жерлерге жақындама. Жарықтарға, ойықтарға, сулар\nашық көрінетін жерлерге және мұз жұқа болуы мүмкін орындарға\nжақындама.\n      Педагог:\n      – Ең басты ережені есте сақтаңдар: мұздың қауіпсіз екеніне\nсенімді болмасаң – мұз үстіне шықпа!\n     Мұз астына түсіп кеткен жағдайда не істеу керек?\n     Педагог:\n     – Енді ең маңызды жағдайды қарастырайық: егер адам мұз\nойылып, суға түсіп кетсе, не істеу керек?\n        1. Көмекке шақыр: «Көмектесіңдер!» деп айқайла.\n        2. Мұздың жиегінен ұстап тұруға тырыс және артық, кенет\nқимылдар жасама.\n        3. Мұздың үстіне кеудеңмен абайлап жатып, аяғыңмен итеріле\nотырып, мұзға шығуға тырыс.\n        4. Мұздың үстіне шыққаннан кейін бірден тұрма. Қауіпті\nжерден мұздың үстімен жорғалап, өзің келген бағытқа қарай алыста.\n        5. Мүмкіндігінше тезірек ересек адамнан көмек сұра.\n      Егер басқа адам мұз астына түсіп кетсе\n      Педагог:\n      – Егер басқа адамның мұз астына түсіп кеткенін көрсеңдер, оған\nкөмектесу үшін мұздың үстімен жүгіріп баруға болмайды – сендер де\nмұз астына түсіп кетулерің мүмкін. Бірден ересек адамдарды көмекке\nшақырыңдар және 112 нөміріне қоңырау шалыңдар.\n     III. Қорытынды бөлім\n     «Сөйлемді аяқта» рефлексиясы\n\n      Педагог білім алушыларға сөйлемдерді аяқтауды ұсынады:\n            «Егер мен мұз айдынын көрсем, алдымен…»\n            «Егер мен жарықты немесе мұз ойығын байқасам, мен…»\n            «Егер біреу мұз астына түсіп кетсе, мен…»\n            «Егер өзіме көмек қажет болса, мен…»\n            «Бүгін мен … екенін есімде сақтадым»\n      Педагог қорытындылайды:\n      – Мұз берік болып көрінгенімен, қауіпті болуы мүмкін. Оның\nберіктігін өз беттеріңше тексермеңдер және ересек адамсыз мұз үстіне\nшықпаңдар. Егер біреу қауіпті жағдайға тап болса, оны өз беттеріңше\nқұтқаруға      тырыспаңдар      –    ересек      адамдарды  көмекке\nшақырып, 112 нөміріне қоңырау шалыңдар.\n      Басты ереже:\n      Тәуекел етпе – қауіпті жерден алыста – ересек адамды көмекке\nшақыр!<\/div><p><a href=\"https://drive.google.com/file/d/1E1qqMgQYhsvEQtIz4nxCf\" target=\"_blank\" rel=\"noopener noreferrer\">https://drive.google.com/file/d/1E1qqMgQYhsvEQtIz4nxCf<\/a><\/p><\/article><\/main><footer><div class=\"wrap\">Ұлттық құндылық · Адалдық · Жауапкершілік<\/div><\/footer>", "title": "2-сынып · 11-сабақ — Ұлы дала коды"}};const HOME="grade-2/index.html";function openPage(){const key=decodeURIComponent(location.hash.slice(2))||HOME;const item=PAGES[key]||PAGES[HOME];document.title=item.title;document.getElementById('app').innerHTML=item.html;document.querySelectorAll('.group-search').forEach(input=>{input.addEventListener('input',()=>{const scope=input.closest('.category-content');let count=0;scope.querySelectorAll('details.card').forEach(card=>{card.hidden=!card.textContent.toLocaleLowerCase().includes(input.value.trim().toLocaleLowerCase());if(!card.hidden)count++;});scope.querySelectorAll('.subgroup').forEach(s=>s.hidden=![...s.querySelectorAll('details.card')].some(c=>!c.hidden));const n=scope.querySelector('.group-count');if(n)n.textContent=count+' құжат көрсетілді';const empty=scope.querySelector('.no-results');if(empty)empty.hidden=count>0;});});;window.scrollTo(0,0);}addEventListener('hashchange',openPage);openPage();</script></body></html>
