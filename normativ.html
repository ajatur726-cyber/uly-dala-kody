ferrer\">Құжатты ашу ↗<\/a><a class=\"secondary\" href=\"#/documents/act-23/index.html\">Жеке бетке өту →<\/a><\/div><\/details><details class=\"card\" data-type=\"Бұйрық\"><summary><span class=\"row\"><span>24 / Бұйрық<\/span><span>ҚОШҚАРМҮЙІЗ ◇<\/span><\/span><span class=\"folder\" aria-hidden=\"true\"><\/span><h2>«Орта, техникалық және кәсіптік, орта білімнен кейінгі білім туралы құжаттардың түрлерін, орта, техникалық және кәсіптік, орта білімнен кейінгі білім туралы мемлекеттік үлгідегі құжаттардың нысандарын және оларды есепке алу мен беру қағидаларын, сондай-ақ білім беру ұйымдарында білім алуды аяқтамаған адамдарға берілетін анықтаманың нысанын бекіту туралы»<\/h2><span class=\"meta\">Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 28 қаңтардағы № 39 бұйрығы<\/span><span class=\"hint\">Қалташаны ашу ＋<\/span><\/summary><div class=\"inside\"><p class=\"meta\">Қазақстан Республикасы Білім және ғылым министрінің 2015 жылғы 28 қаңтардағы № 39 бұйрығы<\/p><a class=\"btn\" href=\"https://adilet.zan.kz/kaz/docs/V1500010348\" target=\"_blank\" rel=\"noopener noreferrer\">Құжатты ашу ↗<\/a><a class=\"secondary\" href=\"#/documents/act-24/index.html\">Жеке бетке өту →<\/a><\/div><\/details><details class=\"card\" data-type=\"Бұйрық\"><summary><span class=\"row\"><span>25 / Бұйрық<\/span><span>ҚОШҚАРМҮЙІЗ ◇<\/span><\/span><span class=\"folder\" aria-hidden=\"true\"><\/span><h2>«Тәлімгерлікті ұйымдастыру қағидаларын және тәлімгерлікті жүзеге асыратын педагогтерге қойылатын талаптарды бекіту туралы»<\/h2><span class=\"meta\">Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 24 сәуірдегі № 160 бұйрығы<\/span><span class=\"hint\">Қалташаны ашу ＋<\/span><\/summary><div class=\"inside\"><p class=\"meta\">Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 24 сәуірдегі № 160 бұйрығы<\/p><a class=\"btn\" href=\"https://adilet.zan.kz/kaz/docs/V2000020486\" target=\"_blank\" rel=\"noopener noreferrer\">Құжатты ашу ↗<\/a><a class=\"secondary\ е (жекелеген объектілерде) төтенше жағдай, шектеу іс-шаралары, оның ішінде карантин енгізілген, төтенше жағдайлар жарияланған кезде қашықтан оқыту бойынша және техникалық және кәсіптік, орта білімнен кейінгі білімнің білім беретін оқу бағдарламаларын іске асыратын білім беру ұйымдарында онлайн-оқыту нысанында оқу процесін ұйымдастыру қағидаларын, сондай-ақ қашықтан оқытуды ұсыну бойынша білім беру ұйымдарына қойылатын талаптарын бекіту туралы»<\/h2><span class=\"meta\">Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 27 қарашадағы № 349 бұйрығы<\/span><span class=\"hint\">Қалташаны ашу ＋<\/span><\/summary><div class=\"inside\"><p class=\"meta\">Қазақстан Республикасы Оқу-ағарту министрінің 2023 жылғы 27 қарашадағы № 349 бұйрығы<\/p><a class=\"btn\" href=\"https://adilet.zan.kz/kaz/docs/V2300033682\" target=\"_blank\" rel=\"noopener noreferrer\">Құжатты ашу ↗<\/a><a class=\"secondary\" href=\"#/documents/act-34/index.html\">Жеке бетке өту →<\/a><\/div><\/details><details class=\"card\" data-type=\"Бұйрық\"><summary><span class=\"row\"><span>35 / Бұйрық<\/span><span>ҚОШҚАРМҮЙІЗ ◇<\/span><\/span><span class=\"folder\" aria-hidden=\"true\"><\/span><h2>«Мектепке дейінгі тәрбие мен оқыту, бастауыш, негізгі орта, орта білім беру ұйымдарында педагогикалық кеңес қызметін ұйымдастырудың және оны сайлау тәртібінің үлгілік қағидаларын бекіту туралы»<\/h2><span class=\"meta\">Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2008 жылғы 16 мамырдағы № 272 бұйрығына өзгерістер енгізу туралы Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 2 сәуірдегі № 125 бұйрығы<\/span><span class=\"hint\">Қалташаны ашу ＋<\/span><\/summary><div class=\"inside\"><p class=\"meta\">Қазақстан Республикасы Білім және ғылым министрінің міндетін атқарушының 2008 жылғы 16 мамырдағы № 272 бұйрығына өзгерістер енгізу туралы Қазақстан Республикасы Білім және ғылым министрінің 2020 жылғы 2 сәуірдегі № 125 бұйрығы<\/p><a class=\"btn\" href=\"https://adilet.zan.kz/
